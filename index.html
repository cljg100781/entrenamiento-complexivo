n o hipoteca sobre inmuebles.", "CC 715": "Posesión: es la tenencia de una cosa determinada con ánimo de señor y dueño, sea que el dueño o el que se da por tal tenga la cosa por sí mismo o por medio de otra persona en su lugar y a su nombre.", "CC 729": "Mera tenencia: la que se ejerce sobre una cosa no como dueño, sino en lugar o a nombre del dueño (por ejemplo, el arrendatario o el depositario); se extiende a todo el que tiene una cosa reconociendo dominio ajeno.", "CC 778": "Usufructo: derecho real que consiste en la facultad de gozar de una cosa con cargo de conservar su forma y sustancia, y de restituirla a su dueño.", "CC 933": "Acción reivindicatoria: es la que tiene el dueño de una cosa singular, de que no está en posesión, para que el poseedor sea condenado a restituírsela.", "CC 1023": "Primer orden de sucesión: los hijos excluyen a los otros herederos, sin perjuicio de la porción conyugal que corresponda al cónyuge sobreviviente.", "CC 1037": "Testamento: acto más o menos solemne en que una persona dispone del todo o de una parte de sus bienes para que tenga pleno efecto después de sus días, conservando la facultad de revocar sus disposiciones mientras viva.", "CC 1205": "Legitimarios: son los hijos, personalmente o representados por su descendencia, y los padres.", "CC 1338": "Acción de partición: ningún coasignatario está obligado a permanecer en la indivisión; la partición puede pedirse siempre, salvo pacto de indivisión, que no puede exceder de cinco años (renovable).", "CC 1461": "Requisitos para obligarse: que la persona sea legalmente capaz, que consienta en el acto y su consentimiento no adolezca de vicio, que recaiga sobre un objeto lícito y que tenga una causa lícita.", "CC 1467": "Vicios del consentimiento: los vicios de que puede adolecer el consentimiento son error, fuerza y dolo.", "CC 1505": "Condición resolutoria tácita: en los contratos bilaterales va envuelta la condición de no cumplirse por uno de los contratantes lo pactado; el otro puede pedir a su arbitrio la resolución o el cumplimiento del contrato, con indemnización de perjuicios.", "CC 1527": "Solidaridad: debe ser expresamente declarada en todos los casos en que no la establece la ley; sin ella, cada deudor responde solo por su cuota.", "CC 1567": "Mora del deudor: el deudor está en mora cuando no ha cumplido en el término estipulado, cuando la cosa solo podía darse o ejecutarse en cierto tiempo que dejó pasar, y en los demás casos cuando ha sido judicialmente reconvenido por el acreedor.", "CC 1568": "La mora purga la mora: en los contratos bilaterales ninguno de los contratantes está en mora dejando de cumplir lo pactado, mientras el otro no lo cumple por su parte o no se allana a cumplirlo en la forma y tiempo debidos.", "CC 1698": "Nulidad absoluta y relativa: el objeto o causa ilícita, la omisión de solemnidades exigidas en consideración a la naturaleza del acto y los actos de absolutamente incapaces producen nulidad absoluta; cualquier otro vicio produce nulidad relativa y da derecho a la rescisión.", "CC 1699": "Declaración de la nulidad absoluta: puede y debe ser declarada por el juez, aun sin petición de parte, cuando aparece de manifiesto en el acto; puede alegarla todo el que tenga interés, excepto quien celebró el contrato sabiendo o debiendo saber el vicio; no se sanea por ratificación ni por un lapso que no pase de quince años.", "CC 2408": "Prescripción adquisitiva ordinaria: el tiempo necesario es de tres años para los muebles y de cinco años para los bienes raíces; exige posesión regular (justo título y buena fe).", "CC 2411": "Prescripción adquisitiva extraordinaria: el tiempo necesario es de quince años, sin que se requiera título alguno; se presume la buena fe.", "COA 99": "Requisitos de validez del acto administrativo: competencia, objeto, voluntad, procedimiento y motivación.", "COA 101": "Eficacia del acto administrativo: el acto será eficaz una vez notificado al administrado; la ejecución de un acto no notificado es ilegítima.", "COA 207": "Silencio administrativo: los reclamos, solicitudes o pedidos dirigidos a las administraciones públicas deben ser resueltos en el término de treinta días; vencido este término, se entienden aprobados (acto administrativo presunto), salvo las excepciones legales.", "COGEP 5": "Impulso procesal: corresponde a las partes procesales el impulso del proceso, conforme con el sistema dispositivo.", "COGEP 56": "Citación por la prensa: a quien no sea posible encontrar o cuyo domicilio se desconozca, se le cita mediante publicaciones en un diario de amplia circulación, previa declaración bajo juramento de la imposibilidad de determinar su domicilio.", "COGEP 87": "Efectos de la falta de comparecencia: la inasistencia injustificada de quien presentó la demanda a la audiencia se entiende como abandono; la de la parte demandada hace que la audiencia continúe en su rebeldía.", "COGEP 102": "Homologación: las sentencias, laudos arbitrales y actas de mediación expedidos en el extranjero deben homologarse para tener eficacia en el Ecuador; conoce la sala especializada de la Corte Provincial del domicilio de quien será requerido.", "COGEP 103": "Homologación de sentencias, laudos y actas extranjeras: regula el procedimiento ante la Corte Provincial, sin revisar el fondo de la decisión extranjera.", "COGEP 104": "Requisitos de la homologación: entre otros, que la decisión tenga fuerza de cosa juzgada en su país, que la parte demandada haya sido legalmente citada y se haya asegurado el debido proceso, y que no contraríe el orden público ecuatoriano.", "COGEP 153": "Excepciones previas: entre ellas, incompetencia, incapacidad o falta de personería, falta de legitimación en la causa, litispendencia, prescripción, caducidad, cosa juzgada, transacción, existencia de convenio, compromiso arbitral o convenio de mediación, error en la forma de proponer la demanda e inadecuación del procedimiento.", "COGEP 166": "Prueba no anunciada: puede solicitarse hasta antes de la convocatoria a la audiencia de juicio, siempre que se acredite que no fue de conocimiento de la parte a la que beneficia o que, habiéndola conocido, no pudo disponer de ella.", "COGEP 168": "Prueba para mejor resolver: la jueza o el juez puede, excepcionalmente, ordenar de oficio la práctica de prueba que juzgue necesaria para el esclarecimiento de los hechos controvertidos.", "COGEP 169": "Carga de la prueba: la parte actora debe probar los hechos que ha propuesto afirmativamente y que ha negado la demandada; esta no está obligada a producir pruebas si su contestación es simple o absolutamente negativa. Prevé reglas especiales, como en materia ambiental.", "COGEP 245": "Abandono: la jueza o el juez declara el abandono del proceso cuando todas las partes han cesado en su prosecución durante el término de ochenta días.", "COGEP 266": "Casación: se interpone por escrito dentro del término de treinta días posteriores a la ejecutoria del auto o sentencia, o del auto que niegue o acepte su aclaración o ampliación.", "COGEP 278": "Recurso de hecho: procede contra las providencias que niegan un recurso de apelación o de casación, para que el superior se pronuncie sobre su procedencia.", "COGEP 291": "Contestación en el procedimiento ordinario: la parte demandada dispone de treinta días desde la citación para contestar la demanda.", "COGEP 333": "Procedimiento sumario: la contestación se presenta en el término de quince días y se realiza una audiencia única con dos fases: saneamiento, fijación de puntos en debate y conciliación; y prueba y alegatos.", "COGEP 347": "Títulos ejecutivos: entre otros, la declaración de parte hecha con juramento, la copia de la escritura pública, el documento privado legalmente reconocido, las letras de cambio, los pagarés a la orden, los testamentos y el contrato de prenda o de crédito.", "COGEP 356": "Procedimiento monitorio: procede para el cobro de deudas determinadas de dinero, líquidas, exigibles y de plazo vencido, que no excedan de cincuenta salarios básicos unificados y no consten en título ejecutivo.", "COGEP 363": "Títulos de ejecución: la sentencia ejecutoriada, el laudo arbitral, el acta de mediación, el contrato prendario y de reserva de dominio, la sentencia o laudo extranjero homologado, entre otros.", "COIP 5": "Principios procesales: enumera, entre otros, legalidad, favorabilidad, duda a favor del reo, inocencia, igualdad, impugnación procesal, prohibición de empeorar la situación del procesado, prohibición de autoincriminación, prohibición de doble juzgamiento, intimidad, oralidad, concentración, contradicción, dirección judicial del proceso, imparcialidad, privacidad y confidencialidad, publicidad, inmediación, motivación, objetividad.", "COIP 18": "Infracción penal: es la conducta típica, antijurídica y culpable cuya sanción se encuentra prevista en el Código.", "COIP 19": "Clasificación de las infracciones: se dividen en delitos y contravenciones. Delito es la infracción penal sancionada con pena privativa de libertad mayor a treinta días; contravención, la sancionada con pena no privativa de libertad o privativa de hasta treinta días.", "COIP 21": "Concurso ideal de infracciones: cuando varios tipos penales son subsumibles a la misma conducta, se aplica la pena de la infracción más grave.", "COIP 26": "Dolo: actúa con dolo la persona que tiene el designio de causar daño. Responde por delito preterintencional quien realiza una acción u omisión de la cual se produce un resultado más grave que aquel que quiso causar.", "COIP 27": "Culpa: actúa con culpa la persona que infringe el deber objetivo de cuidado que personalmente le corresponde, produciendo un resultado dañoso; es punible cuando se encuentra tipificada como infracción.", "COIP 30": "Causas de exclusión de la antijuridicidad: no existe infracción penal cuando la conducta típica se encuentra justificada por estado de necesidad o legítima defensa; tampoco cuando se actúa en cumplimiento de una orden legítima y expresa de autoridad competente o de un deber legal.", "COIP 32": "Estado de necesidad: existe cuando el derecho protegido está en real y actual peligro, el resultado del acto de protección no es mayor que la lesión o daño que se quiso evitar y no existe otro medio practicable y menos perjudicial para defenderlo.", "COIP 33": "Legítima defensa: existe cuando la persona actúa en defensa de cualquier derecho, propio o ajeno, siempre que concurran: agresión actual e ilegítima, necesidad racional de la defensa y falta de provocación suficiente por parte de quien actúa.", "COIP 34": "Culpabilidad: para que una persona sea considerada responsable penalmente debe ser imputable y actuar con conocimiento de la antijuridicidad de su conducta.", "COIP 35": "Causa de inculpabilidad: no existe responsabilidad penal en el caso de trastorno mental debidamente comprobado.", "COIP 36": "Trastorno mental: la persona que al momento de cometer la infracción no tiene la capacidad de comprender la ilicitud de su conducta o de determinarse de conformidad con esa comprensión, en razón de un trastorno mental, no es penalmente responsable; el juez puede dictar una medida de seguridad.", "COIP 38": "Personas menores de dieciocho años: en conflicto con la ley penal, están sometidas al Código Orgánico de la Niñez y Adolescencia.", "COIP 39": "Tentativa: es la ejecución que no logra consumarse o cuyo resultado no llega a verificarse por circunstancias ajenas a la voluntad del autor, a pesar de que de manera dolosa inicie la ejecución mediante actos idóneos; se sanciona con una pena de un tercio a dos tercios de la que correspondería si el delito se hubiera consumado.", "COIP 41": "Participación: las personas participan en la infracción como autores o cómplices.", "COIP 42": "Autores: responden como autores quienes cometen la infracción de manera directa e inmediata (autoría directa), quienes instigan u ordenan a otra persona su comisión o se valen de otra persona, imputable o no, mediante fuerza, engaño u otros medios (autoría mediata), y quienes coadyuvan con un acto sin el cual no habría podido perpetrarse (coautoría).", "COIP 43": "Cómplices: responden quienes, en forma dolosa, facilitan o cooperan con actos secundarios, anteriores o simultáneos, sin los cuales igualmente se habría cometido la infracción; se sancionan con una pena equivalente de un tercio a la mitad de la prevista para el autor.", "COIP 44": "Mecanismos de aplicación de atenuantes y agravantes: si concurren al menos dos atenuantes y ninguna agravante, se aplica el mínimo de la pena reducido en un tercio; si concurre al menos una agravante no constitutiva del tipo, se aplica el máximo de la pena aumentado en un tercio.", "COIP 49": "Responsabilidad de las personas jurídicas: responden penalmente por los delitos cometidos para beneficio propio o de sus asociados, por la acción u omisión de quienes ejercen su propiedad o control, sus órganos de gobierno o administración, apoderados, mandatarios o representantes; su responsabilidad es independiente de la de las personas naturales y subsiste aunque estas fallezcan o se extinga su responsabilidad.", "COIP 76": "Internamiento en un hospital psiquiátrico: medida de seguridad que se aplica a la persona inimputable por trastorno mental; su finalidad es lograr la superación de su perturbación y la inclusión social.", "COIP 141": "Femicidio: la persona que, como resultado de relaciones de poder manifestadas en cualquier tipo de violencia, dé muerte a una mujer por el hecho de serlo o por su condición de género.", "COIP 146": "Homicidio culposo por mala práctica profesional: la persona que, al infringir un deber objetivo de cuidado en el ejercicio o práctica de su profesión, ocasione la muerte de otra.", "COIP 189": "Robo: la persona que mediante amenazas o violencias sustraiga o se apodere de cosa mueble ajena, sea que la violencia tenga lugar antes del acto para facilitarlo, en el momento de cometerlo o después de cometido para procurar impunidad; también se sanciona el robo cometido con fuerza en las cosas.", "COIP 196": "Hurto: la persona que, sin violencia, amenaza o intimidación en la persona o fuerza en las cosas, se apodere ilegítimamente de cosa mueble ajena.", "COIP 278": "Peculado: la servidora o servidor público, o quien actúe en virtud de una potestad estatal, que en beneficio propio o de terceros abuse, se apropie, distraiga o disponga arbitrariamente de bienes, dineros públicos o privados, efectos que los representen, piezas, títulos o documentos que estén en su poder en virtud o razón de su cargo.", "COIP 317": "Lavado de activos: sanciona a quien, en forma directa o indirecta, tenga, adquiera, transfiera, posea, administre, utilice, mantenga, resguarde, entregue, transporte, convierta o se beneficie de activos de origen ilícito, entre otras conductas; es un delito autónomo de otros delitos cometidos dentro o fuera del país.", "COIP 415": "Ejercicio privado de la acción penal: procede en la calumnia, la usurpación, el estupro y las lesiones que generen incapacidad o enfermedad de hasta treinta días, con excepción de los casos de violencia contra la mujer o miembros del núcleo familiar.", "COIP 454": "Principios de la prueba: incluye la oportunidad (las actuaciones de la investigación solo adquieren valor de prueba cuando son presentadas, practicadas y valoradas en la audiencia de juicio, salvo el testimonio anticipado), inmediación, contradicción, libertad probatoria, pertinencia, exclusión de la prueba obtenida con violación de derechos, e igualdad de oportunidades para la prueba.", "COIP 502": "Reglas del testimonio: entre ellas, la posibilidad de recibir testimonio anticipado de personas que no puedan comparecer a la audiencia de juicio y de víctimas de delitos contra la integridad sexual y reproductiva, trata de personas y violencia contra la mujer o miembros del núcleo familiar.", "COIP 529": "Audiencia de calificación de flagrancia: en los casos de infracción flagrante, dentro de las veinticuatro horas desde que tuvo lugar la aprehensión, se realiza la audiencia en la que se califica la legalidad de la aprehensión.", "COIP 534": "Finalidad y requisitos de la prisión preventiva: para garantizar la comparecencia al proceso y el cumplimiento de la pena; exige elementos de convicción suficientes sobre la existencia del delito y la participación del procesado, indicios de que las medidas no privativas de libertad son insuficientes, y que la infracción esté sancionada con pena privativa de libertad superior a un año.", "COIP 537": "Casos especiales: la prisión preventiva podrá ser sustituida por arresto domiciliario y el uso obligatorio de dispositivo de vigilancia electrónica, entre otros, cuando la procesada es una mujer embarazada o se encuentra hasta en los noventa días posteriores al parto, o cuando la persona procesada es mayor de sesenta y cinco años.", "COIP 541": "Caducidad de la prisión preventiva: no puede exceder de seis meses en los delitos sancionados con pena privativa de libertad de hasta cinco años, ni de un año en los sancionados con pena mayor a cinco años.", "COIP 580": "Investigación previa: fase preprocesal en la que se reúnen los elementos de convicción, de cargo y de descargo, que permitan a la o el fiscal decidir si formula o no la imputación.", "COIP 585": "Duración de la investigación previa: no puede superar un año en los delitos sancionados con pena privativa de libertad de hasta cinco años, ni dos años en los sancionados con pena mayor a cinco años.", "COIP 589": "Etapas del procedimiento ordinario: instrucción; evaluación y preparatoria de juicio; y juicio.", "COIP 591": "Inicio de la instrucción: la etapa de instrucción inicia con la audiencia de formulación de cargos convocada a petición de la o el fiscal.", "COIP 592": "Duración de la instrucción: concluye en el plazo máximo de noventa días; prevé plazos distintos para delitos flagrantes y reglas para la vinculación de nuevos procesados.", "COIP 635": "Procedimiento abreviado: procede en infracciones sancionadas con pena máxima privativa de libertad de hasta diez años; la propuesta puede presentarse desde la audiencia de formulación de cargos hasta la audiencia preparatoria de juicio; la persona procesada debe consentir expresamente y admitir el hecho; la pena no puede ser superior a la sugerida por la Fiscalía.", "COIP 640": "Procedimiento directo: concentra todas las etapas en una sola audiencia; procede en los delitos calificados como flagrantes sancionados con pena máxima privativa de libertad de hasta cinco años y en los delitos contra la propiedad cuyo monto no exceda de treinta salarios básicos unificados, con las exclusiones que señala la ley.", "COIP 653": "Procedencia de la apelación: de la resolución que declara la prescripción del ejercicio de la acción o de la pena; del auto de nulidad; del auto de sobreseimiento, si existió acusación fiscal; de las sentencias; y de la resolución que conceda o niegue la prisión preventiva en los casos previstos.", "COIP 654": "Trámite de la apelación: se interpone ante la o el juzgador dentro de los tres días contados a partir de la notificación de la decisión.", "COIP 656": "Casación penal: procede contra las sentencias cuando se haya violado la ley por contravenir expresamente su texto, por indebida aplicación o por errónea interpretación; no son admisibles los pedidos tendientes a volver a valorar la prueba.", "COIP 658": "Revisión: procede ante la Corte Nacional de Justicia contra la sentencia condenatoria, en cualquier tiempo después de ejecutoriada, entre otros casos cuando se compruebe la existencia de la persona que se creía muerta, o la sentencia se funde en documentos o testigos falsos.", "COIP 663": "Conciliación: puede presentarse hasta antes de la conclusión de la etapa de instrucción fiscal en delitos sancionados con pena privativa de libertad de hasta cinco años, delitos de tránsito que no tengan resultado de muerte y delitos contra la propiedad cuyo monto no exceda de treinta salarios básicos; se excluyen, entre otros, los delitos contra la eficiencia de la administración pública, contra la integridad sexual y reproductiva y de violencia contra la mujer o miembros del núcleo familiar.", "CRE 10": "Titulares de derechos: las personas, comunidades, pueblos, nacionalidades y colectivos son titulares y gozarán de los derechos garantizados en la Constitución; la naturaleza es sujeto de aquellos derechos que le reconozca la Constitución.", "CRE 11": "Principios de aplicación de los derechos: entre ellos, exigibilidad individual o colectiva, igualdad y no discriminación con acciones afirmativas, aplicación directa e inmediata sin que pueda alegarse falta de norma, interpretación más favorable, progresividad y responsabilidad del Estado con derecho de repetición.", "CRE 35": "Grupos de atención prioritaria: las personas adultas mayores, niñas, niños y adolescentes, mujeres embarazadas, personas con discapacidad, personas privadas de libertad y quienes adolezcan de enfermedades catastróficas o de alta complejidad recibirán atención prioritaria y especializada.", "CRE 45": "Niñas, niños y adolescentes: gozan de los derechos comunes del ser humano, además de los específicos de su edad; el Estado reconoce y garantiza la vida, incluido el cuidado y protección desde la concepción.", "CRE 57": "Derechos colectivos de comunas, comunidades, pueblos y nacionalidades: entre ellos, la consulta previa, libre e informada sobre planes de prospección, explotación y comercialización de recursos no renovables en sus tierras (num. 7) y la consulta prelegislativa (num. 17).", "CRE 68": "Unión de hecho: la unión estable y monogámica entre dos personas libres de vínculo matrimonial que formen un hogar de hecho genera los mismos derechos y obligaciones que las familias constituidas mediante matrimonio, en el lapso y bajo las condiciones que señale la ley.", "CRE 71": "Derechos de la naturaleza: la naturaleza tiene derecho a que se respete integralmente su existencia y el mantenimiento y regeneración de sus ciclos vitales; toda persona, comunidad, pueblo o nacionalidad puede exigir a la autoridad pública su cumplimiento.", "CRE 76": "Garantías básicas del debido proceso: entre ellas, presunción de inocencia, legalidad de la infracción y la pena, exclusión de la prueba ilícita, favorabilidad, proporcionalidad, derecho a la defensa, prohibición de doble juzgamiento y la motivación de las resoluciones, cuya falta produce nulidad.", "CRE 77": "Garantías de la persona privada de libertad: la privación de libertad es excepcional; nadie puede ser detenido sin orden judicial, salvo flagrancia, y en ese caso debe ser presentado ante el juez en veinticuatro horas; la prisión preventiva caduca a los seis meses o al año según la gravedad del delito.", "CRE 80": "Imprescriptibilidad: las acciones y penas por genocidio, lesa humanidad, crímenes de guerra, desaparición forzada de personas o crímenes de agresión a un Estado son imprescriptibles.", "CRE 86": "Disposiciones comunes de las garantías jurisdiccionales: cualquier persona, grupo o comunidad puede proponerlas; procedimiento sencillo, rápido y eficaz, oral en todas sus fases; no se requiere patrocinio de abogado para proponer la acción.", "CRE 88": "Acción de protección: tiene por objeto el amparo directo y eficaz de los derechos constitucionales; procede contra actos u omisiones de autoridad pública no judicial, políticas públicas y actos de particulares cuando la violación provoca daño grave, prestan servicios públicos impropios, actúan por delegación o concesión, o la persona afectada se encuentra en estado de subordinación, indefensión o discriminación.", "CRE 89": "Hábeas corpus: tiene por objeto recuperar la libertad de quien se encuentre privado de ella de forma ilegal, arbitraria o ilegítima, y proteger la vida y la integridad física de las personas privadas de libertad; la audiencia se realiza dentro de las veinticuatro horas.", "CRE 91": "Acción de acceso a la información pública: tiene por objeto garantizar el acceso a ella cuando ha sido denegada expresa o tácitamente, o cuando la proporcionada no es completa o fidedigna; procede incluso si la negativa se sustenta en el carácter reservado de la información, que debe haber sido declarado previamente conforme a la ley.", "CRE 92": "Hábeas data: toda persona tiene derecho a conocer la existencia y acceder a los documentos, datos genéticos, bancos o archivos de datos personales sobre sí misma o sus bienes, y a solicitar su actualización, rectificación, eliminación o anulación.", "CRE 93": "Acción por incumplimiento: tiene por objeto garantizar la aplicación de normas que integran el sistema jurídico y el cumplimiento de sentencias o informes de organismos internacionales de derechos humanos, cuando contengan una obligación de hacer o no hacer clara, expresa y exigible; se interpone ante la Corte Constitucional.", "CRE 94": "Acción extraordinaria de protección: procede contra sentencias o autos definitivos en los que se haya violado por acción u omisión derechos reconocidos en la Constitución; se interpone ante la Corte Constitucional, una vez agotados los recursos ordinarios y extraordinarios, salvo que la falta de interposición no sea atribuible a negligencia del titular.", "CRE 105": "Revocatoria del mandato: las personas en goce de los derechos políticos pueden revocar el mandato de las autoridades de elección popular; la solicitud se presenta después de cumplido el primer año y antes del último año del periodo.", "CRE 133": "Leyes orgánicas: regulan, entre otras materias, la organización de las funciones del Estado y el ejercicio de los derechos y garantías constitucionales; su expedición, reforma, derogación e interpretación requieren mayoría absoluta de los miembros de la Asamblea Nacional.", "CRE 165": "Límites del estado de excepción: la Presidenta o Presidente solo puede suspender o limitar los derechos que la Constitución enumera (inviolabilidad de domicilio, de correspondencia, libertad de tránsito, de asociación y reunión, e información), y puede, entre otras medidas, decretar la recaudación anticipada de tributos.", "CRE 166": "Duración del estado de excepción: el decreto tiene vigencia de hasta un máximo de sesenta días; si persisten las causas, puede renovarse hasta por treinta días más.", "CRE 168": "Principios de la administración de justicia: independencia interna y externa, autonomía administrativa, económica y financiera, unidad jurisdiccional, acceso gratuito, publicidad, y la sustanciación de los procesos mediante el sistema oral, de acuerdo con los principios de concentración, contradicción y dispositivo.", "CRE 171": "Justicia indígena: las autoridades de las comunidades, pueblos y nacionalidades indígenas ejercen funciones jurisdiccionales con base en sus tradiciones ancestrales y su derecho propio, dentro de su ámbito territorial, siempre que no sean contrarios a la Constitución y a los derechos humanos; sus decisiones están sujetas al control de constitucionalidad.", "CRE 178": "Órganos de la Función Judicial: el Consejo de la Judicatura es el órgano de gobierno, administración, vigilancia y disciplina de la Función Judicial.", "CRE 182": "Corte Nacional de Justicia: es el máximo órgano de la justicia ordinaria; tiene jurisdicción en todo el territorio nacional.", "CRE 190": "Medios alternativos: se reconoce el arbitraje, la mediación y otros procedimientos alternativos para la solución de conflictos en materias transigibles; en la contratación pública procede el arbitraje en derecho, previo pronunciamiento favorable de la Procuraduría General del Estado.", "CRE 226": "Principio de legalidad: las instituciones del Estado, sus organismos, dependencias, servidoras o servidores públicos ejercerán solamente las competencias y facultades que les sean atribuidas en la Constitución y la ley.", "CRE 233": "Responsabilidad de servidores públicos: ningún servidor público está exento de responsabilidad; las acciones y penas por peculado, cohecho, concusión y enriquecimiento ilícito son imprescriptibles, y los juicios pueden iniciarse y continuar aun en ausencia de las personas acusadas.", "CRE 301": "Reserva de ley tributaria: solo por iniciativa de la Función Ejecutiva y mediante ley sancionada por la Asamblea Nacional se pueden establecer, modificar, exonerar o extinguir impuestos; las tasas y contribuciones se establecen por acto normativo de órgano competente.", "CRE 326": "Principios del derecho al trabajo: entre ellos, la irrenunciabilidad e intangibilidad de los derechos laborales, la nulidad de toda estipulación en contrario y la aplicación en el sentido más favorable a las personas trabajadoras en caso de duda.", "CRE 327": "Relación laboral directa y bilateral: se prohíbe toda forma de precarización, como la intermediación laboral y la tercerización en las actividades propias y habituales de la empresa, la contratación laboral por horas o cualquier otra que afecte los derechos de las personas trabajadoras.", "CRE 397": "Daños ambientales: en caso de daño ambiental el Estado actuará de manera inmediata y subsidiaria; la carga de la prueba sobre la inexistencia de daño potencial o real recae sobre el gestor de la actividad o el demandado.", "CRE 425": "Orden jerárquico de las normas: Constitución; tratados y convenios internacionales; leyes orgánicas; leyes ordinarias; normas regionales y ordenanzas distritales; decretos y reglamentos; ordenanzas; acuerdos y resoluciones; y demás actos de los poderes públicos. En caso de conflicto entre normas de distinta jerarquía se aplica la superior.", "CRE 426": "Aplicación directa de la Constitución: las juezas y jueces, autoridades administrativas y servidores públicos aplicarán directamente las normas constitucionales y las previstas en los instrumentos internacionales de derechos humanos siempre que sean más favorables, aunque las partes no las invoquen expresamente.", "CRE 427": "Interpretación constitucional: las normas constitucionales se interpretan por el tenor literal que más se ajuste a la Constitución en su integralidad; en caso de duda, en el sentido que más favorezca a la plena vigencia de los derechos.", "CRE 428": "Control concreto (consulta de norma): cuando una jueza o juez considere que una norma es contraria a la Constitución o a instrumentos internacionales más favorables, suspende la causa y remite el expediente a la Corte Constitucional, que resuelve en un plazo no mayor a cuarenta y cinco días.", "CRE 429": "Corte Constitucional: es el máximo órgano de control, interpretación constitucional y de administración de justicia en esta materia.", "CRE 436": "Atribuciones de la Corte Constitucional: entre ellas, ser la máxima instancia de interpretación de la Constitución con decisiones vinculantes, conocer las acciones de inconstitucionalidad y expedir sentencias que constituyan jurisprudencia vinculante.", "CRE 441": "Enmienda constitucional: procede para uno o varios artículos que no alteren la estructura fundamental, el carácter y los elementos constitutivos del Estado, no establezcan restricciones a los derechos y garantías ni modifiquen el procedimiento de reforma.", "CRE 442": "Reforma parcial: procede cuando no suponga una restricción en los derechos y garantías constitucionales ni modifique el procedimiento de reforma de la Constitución; requiere aprobación de la Asamblea Nacional y referéndum.", "CRE 444": "Asamblea Constituyente: solo puede convocarse a través de consulta popular; la nueva Constitución debe ser aprobada mediante referéndum.", "CT 4": "Irrenunciabilidad de derechos: los derechos del trabajador son irrenunciables; será nula toda estipulación en contrario.", "CT 15": "Periodo de prueba: en todo contrato por tiempo indefinido puede señalarse un periodo de prueba de duración máxima de noventa días; solo puede pactarse por una sola vez entre las mismas partes.", "CT 47": "Jornada máxima: es de ocho horas diarias, de manera que no exceda de cuarenta horas semanales, salvo disposición de la ley en contrario.", "CT 111": "Decimotercera remuneración: los trabajadores tienen derecho a que sus empleadores les paguen, hasta el veinticuatro de diciembre de cada año, una remuneración equivalente a la doceava parte de las remuneraciones percibidas durante el año calendario; puede recibirse de forma mensualizada.", "CT 185": "Bonificación por desahucio: en los casos de terminación por desahucio, el empleador bonifica al trabajador con el veinticinco por ciento del equivalente a la última remuneración mensual por cada uno de los años de servicio.", "CT 188": "Indemnización por despido intempestivo: hasta tres años de servicio, tres meses de remuneración; más de tres años, un mes por cada año, sin exceder de veinticinco meses. Si el trabajador tiene más de veinte y menos de veinticinco años de servicio, recibe además la parte proporcional de la jubilación patronal.", "CT 216": "Jubilación patronal: los trabajadores que por veinticinco años o más hubieren prestado servicios continuada o interrumpidamente tienen derecho a ser jubilados por sus empleadores.", "CT 635": "Prescripción de las acciones laborales: las acciones provenientes de los actos y contratos de trabajo prescriben en tres años, contados desde la terminación de la relación laboral, salvo los casos especiales de la ley.", "CTRIB 24": "Sujeto pasivo: es la persona natural o jurídica que, según la ley, está obligada al cumplimiento de la prestación tributaria, sea como contribuyente o como responsable.", "CTRIB 28": "Responsables como adquirentes o sucesores: entre otros, los adquirentes de negocios o empresas, por todos los tributos que se adeuden por el anterior propietario, generados en el año en curso y los dos años anteriores, limitada al valor de los bienes adquiridos.", "CTRIB 29": "Otros responsables: los agentes de retención y los agentes de percepción, entre otros que por disposición de la ley deben cumplir obligaciones tributarias atribuidas a otros.", "CTRIB 37": "Modos de extinción de la obligación tributaria: solución o pago; compensación; confusión; remisión; y prescripción de la acción de cobro.", "CTRIB 55": "Plazo de prescripción de la acción de cobro: cinco años desde la fecha en que la obligación fue exigible; siete años si no se presentó la declaración tributaria a que estaba obligado el contribuyente.", "CTRIB 94": "Caducidad de la facultad determinadora: caduca en tres años desde la fecha de la declaración en los tributos que la ley exige determinación por el sujeto pasivo; en seis años cuando no se presentó la declaración; y en un año en los casos de verificación de una determinación previa.", "CTRIB 115": "Reclamos: los contribuyentes, responsables o terceros que se creyeren afectados por un acto de determinación pueden presentar su reclamo ante la autoridad competente dentro del plazo de veinte días, contados desde el día hábil siguiente al de la notificación.", "LAM 5": "Convenio arbitral: es el acuerdo escrito en virtud del cual las partes deciden someter al arbitraje todas las controversias o ciertas controversias que hayan surgido o puedan surgir entre ellas respecto de una relación jurídica, contractual o no.", "LAM 22": "Audiencia de sustanciación: una vez constituido el tribunal, en esta audiencia se lee el documento que contiene el convenio arbitral y el tribunal resuelve sobre su propia competencia.", "LAM 30": "Recursos contra el laudo: los laudos arbitrales tienen efecto de sentencia ejecutoriada y de cosa juzgada; solo se puede pedir su aclaración o ampliación.", "LAM 31": "Acción de nulidad del laudo: procede por causales taxativas, como la falta de citación, la no notificación de providencias, la falta de práctica de pruebas, o haberse resuelto puntos no sometidos al arbitraje o más allá de lo reclamado; se interpone dentro de diez días de ejecutoriado el laudo y conoce la Presidencia de la Corte Provincial.", "LAM 47": "Acta de mediación: en caso de acuerdo, el acta tiene efecto de sentencia ejecutoriada y cosa juzgada, y se ejecuta del mismo modo que las sentencias de última instancia, siguiendo la vía de apremio, sin que el juez acepte excepción alguna, salvo las que se originen con posterioridad a su suscripción.", "LC 17": "Responsabilidad por fraudes: por los fraudes, abusos o vías de hecho que se cometan a nombre de compañías y otras personas naturales o jurídicas, son personal y solidariamente responsables quienes los ordenaron o ejecutaron, quienes obtuvieron provecho y los tenedores de los bienes para efectos de su restitución.", "LC 143": "Compañía anónima: sociedad cuyo capital, dividido en acciones negociables, está formado por la aportación de los accionistas, que responden únicamente por el monto de sus acciones.", "LOGJCC 18": "Reparación integral: procura que la persona titular del derecho violado goce y disfrute del derecho de la manera más adecuada posible; puede incluir restitución, compensación económica, rehabilitación, satisfacción, garantías de no repetición, obligación de investigar y sancionar, disculpas públicas y otras medidas.", "LOGJCC 27": "Requisitos de las medidas cautelares: proceden cuando hay amenaza o violación de derechos de gravedad inminente; no proceden cuando existan medidas cautelares en las vías administrativas u ordinarias, cuando se trate de la ejecución de órdenes judiciales o cuando se interpongan en la acción extraordinaria de protección de derechos.", "LOGJCC 40": "Requisitos de la acción de protección: violación de un derecho constitucional; acción u omisión de autoridad pública o de un particular; e inexistencia de otro mecanismo de defensa judicial adecuado y eficaz para proteger el derecho violado.", "LOGJCC 42": "Improcedencia de la acción de protección: entre otras causas, cuando no hay violación de derechos constitucionales, cuando el acto es impugnable en vía judicial (salvo que esta no sea adecuada ni eficaz) y cuando se trata de providencias judiciales.", "LOGJCC 60": "Término para accionar: la acción extraordinaria de protección se interpone en el término máximo de veinte días contados desde la notificación de la decisión judicial.", "LOGJCC 62": "Admisión: la acción extraordinaria de protección se presenta ante la judicatura que dictó la decisión, la cual ordena notificar a la otra parte y remitir el expediente a la Corte Constitucional en el término de cinco días.", "CC 21": "Clasificación por edad: llámase infante o niño el que no ha cumplido siete años; impúber, la niña o el niño que no ha cumplido doce años; adulto, el que ha dejado de ser impúber; mayor de edad, el que ha cumplido dieciocho años, y menor de edad, el que no ha llegado a cumplirlos.", "CC 22": "Grados de parentesco: los grados de consanguinidad se cuentan por el número de generaciones; en la línea colateral se sube hasta el tronco común y se baja hasta el otro pariente (tío y sobrino, tercer grado; primos hermanos, cuarto grado).", "CC 49": "Residencia accidental: no se presume el ánimo de permanecer, ni se adquiere domicilio, por el solo hecho de habitar una persona por algún tiempo en un lugar si tiene en otra parte su hogar doméstico o el asiento principal de sus negocios.", "CC 51": "Conservación del domicilio: el domicilio civil no se muda por el hecho de residir el individuo largo tiempo en otra parte, voluntaria o forzadamente, siempre que conserve su familia y el asiento principal de sus negocios en el domicilio anterior.", "CC 63": "Derechos del que está por nacer: los derechos que corresponderían a la criatura que está en el vientre materno quedan suspensos hasta que el nacimiento se efectúe; si nace y constituye un principio de existencia, entra en el goce de esos derechos como si hubiese existido al tiempo en que se defirieron.", "CC 65": "Conmoriencia: si por haber perecido dos o más personas en un mismo acontecimiento no puede saberse el orden en que han ocurrido sus fallecimientos, se procede como si todas hubiesen perecido en un mismo momento y ninguna hubiese sobrevivido a las otras.", "CC 95": "Nulidad del matrimonio: es nulo, entre otros casos, el matrimonio contraído por menores de dieciocho años, por personas casadas, y entre parientes en línea recta o colaterales en segundo grado de consanguinidad.", "CC 99": "Plazo de la acción de nulidad del matrimonio: la acción por ciertas causales, como la edad de los contrayentes, prescribe en el plazo de dos años desde la celebración del matrimonio.", "CC 110": "Causales de divorcio: entre ellas, el adulterio, los tratos crueles o la violencia contra el cónyuge (num. 2) y el abandono injustificado de otro cónyuge por más de seis meses ininterrumpidos (num. 9).", "CC 112": "Quinta parte de los bienes: el cónyuge que carece de lo necesario para su congrua sustentación y no dio causa para el divorcio tiene derecho a la quinta parte de los bienes del otro, imputándose a ella lo que reciba por gananciales.", "CC 117": "Competencia para el divorcio: se considera el último domicilio común en el Ecuador cuando el cónyuge demandado se halla en el extranjero; en lo demás rige la regla del domicilio del demandado.", "CC 157": "Haber de la sociedad conyugal: comprende, entre otros, los salarios y emolumentos devengados durante el matrimonio (num. 1) y los bienes que cualquiera de los cónyuges adquiera durante él a título oneroso (num. 5).", "CC 165": "Subrogación real: para que un inmueble adquirido durante el matrimonio se subrogue a uno propio, debe expresarse en las escrituras de venta y de compra el ánimo de subrogar; de lo contrario ingresa al haber social con derecho a recompensa.", "CC 189": "Disolución de la sociedad conyugal: se disuelve por la terminación del matrimonio, por la sentencia que concede la posesión definitiva de los bienes del desaparecido y por sentencia judicial a petición de cualquiera de los cónyuges, entre otras causas taxativas; la separación de hecho no la disuelve.", "CC 222": "Unión de hecho: la unión estable y monogámica entre dos personas libres de vínculo matrimonial, que formen un hogar de hecho, genera los mismos derechos y obligaciones que tienen las familias constituidas mediante matrimonio y da origen a una sociedad de bienes.", "CC 1463": "Incapacidad: son absolutamente incapaces, entre otros, los impúberes; son relativamente incapaces, entre otros, los menores adultos. Los actos de los absolutamente incapaces no producen ni aun obligaciones naturales.", "CC 1700": "Titulares de la nulidad relativa: no puede ser declarada por el juez sino a pedimento de parte, ni puede pedirse por el ministerio público en solo interés de la ley; solo pueden alegarla aquellos en cuyo beneficio la han establecido las leyes, o sus herederos o cesionarios; y puede sanearse por el lapso de tiempo o por la ratificación de las partes.", "CC 1708": "Plazo de la rescisión: dura cuatro años; se cuenta, en el caso de violencia, desde el día en que esta hubiere cesado; en el de error o dolo, desde el día de la celebración del acto o contrato; y si la nulidad proviene de una incapacidad, desde que esta hubiere cesado.", "COGEP 6": "Principio de inmediación: la o el juzgador celebrará directamente las audiencias y conocerá de manera directa las pruebas que deban practicarse en ellas.", "COGEP 9": "Competencia territorial: por regla general será competente la o el juzgador del lugar donde tiene su domicilio la persona demandada, sin perjuicio de los fueros concurrentes y especiales.", "COGEP 30": "Partes procesales: el sujeto activo o actor y el sujeto pasivo o demandado; pueden serlo las personas naturales, las jurídicas, las comunidades, pueblos, nacionalidades o colectivos, y la naturaleza (num. 4).", "COGEP 37": "Procuración común: cuando varias personas litigan unidas por un mismo derecho o interés, deben nombrar un procurador común; la designación no exige que sea abogado.", "COGEP 43": "Facultades del procurador: para desistir, allanarse, transigir, aprobar convenios, absolver posiciones, deferir juramento, recibir valores o la cosa sobre la cual verse el litigio, entre otros actos, se requiere cláusula especial.", "COGEP 47": "Clases de tercerías: la tercería excluyente de dominio, en la que el tercero pretende en todo o en parte el derecho discutido (num. 1), y la tercería coadyuvante, en la que apoya la pretensión de una de las partes.", "COGEP 253": "Aclaración y ampliación: la aclaración tiene lugar si la sentencia es oscura; la ampliación, cuando no se resolvió alguno de los puntos controvertidos o se omitió decidir sobre frutos, intereses o costas.", "COGEP 268": "Casos de casación: el recurso procede únicamente por las causales taxativas previstas en la ley; no es una tercera instancia ni permite revalorar la prueba."};

const EMB=[{"id": "pack-001", "bibliografia": {"CC": "Congreso Nacional del Ecuador. (2005). Código Civil (Codificación 2005-010). Registro Oficial Suplemento 46, 24 de junio de 2005. Texto vigente con sus reformas, entre ellas la Ley Reformatoria de 2015 (R.O. 526-2S, 19 de junio de 2015); última actualización: Segundo Suplemento del R.O. 61, 17 de junio de 2025. https://www.gob.ec/regulaciones/codigo-civil-codificacion-no-2005-010", "COGEP": "Asamblea Nacional del Ecuador. (2015). Código Orgánico General de Procesos. Registro Oficial Suplemento 506, 22 de mayo de 2015. Reformado, entre otras, por la Ley Orgánica Reformatoria del COGEP (R.O. Suplemento 517, 26 de junio de 2019); última reforma consultada: Cuarto Suplemento del R.O. 140, 7 de octubre de 2025. https://portal.compraspublicas.gob.ec/sercop/wp-content/uploads/2025/11/CODIGO-ORGANICO-GENERAL-DE-PROCESOS-COGEP.pdf", "COIP": "Asamblea Nacional del Ecuador. (2014). Código Orgánico Integral Penal. Registro Oficial Suplemento 180, 10 de febrero de 2014. Texto actualizado al 13 de octubre de 2025 (última reforma incorporada: Tercer Suplemento del R.O. 68, 26 de junio de 2025). https://legalcloud.ec/wp-content/uploads/2025/10/COIP-13102025-Digital.pdf", "CRE": "Asamblea Constituyente del Ecuador. (2008). Constitución de la República del Ecuador. Registro Oficial 449, 20 de octubre de 2008 (con las enmiendas posteriores, incluidas las aprobadas en el referéndum de 2024). https://www.asambleanacional.gob.ec/", "CT": "Congreso Nacional del Ecuador. (2005). Código del Trabajo (Codificación 2005-017). Registro Oficial Suplemento 167, 16 de diciembre de 2005. Texto vigente con sus reformas; última reforma: 9 de abril de 2026. https://portal.compraspublicas.gob.ec/sercop/wp-content/uploads/2026/08/CODIGO-DEL-TRABAJO.pdf", "CTRIB": "Congreso Nacional del Ecuador. (2005). Código Orgánico Tributario (antes Código Tributario, Codificación 2005-09). Registro Oficial Suplemento 38, 14 de junio de 2005; reformado y renombrado por la Ley Orgánica Reformatoria al Código Tributario, Noveno Suplemento del R.O. 392, 19 de octubre de 2026. https://www.gob.ec/regulaciones/codigo-organico-tributario", "HCCH": "Conferencia de La Haya de Derecho Internacional Privado. (1961). Convenio por el que se suprime el requisito de legalización de los documentos públicos extranjeros. https://www.hcch.net/es/instruments/conventions/full-text/?cid=41", "LAM": "Congreso Nacional del Ecuador. (2006). Ley de Arbitraje y Mediación (Codificación 2006-014). Registro Oficial 417, 14 de diciembre de 2006, con sus reformas. https://oas.org/es/sla/ddi/docs/Ecuador%20-%20Ley%20de%20Arbitraje%20y%20Mediaci%C3%B3n.pdf", "LC": "Congreso Nacional del Ecuador. (1999). Ley de Compañías (Codificación 1999-031). Registro Oficial 312, 5 de noviembre de 1999. Reformada por la Ley Reformatoria a la Ley de Compañías para la Optimización e Impulso Empresarial y para el Fomento del Gobierno Corporativo (R.O. Suplemento 269, 15 de marzo de 2023); última reforma: 3 de octubre de 2025. https://www.eeasa.com.ec/content/uploads/2025/12/LEY-DE-COMPANIAS.pdf", "LOGJCC": "Asamblea Nacional del Ecuador. (2009). Ley Orgánica de Garantías Jurisdiccionales y Control Constitucional. Registro Oficial Segundo Suplemento 52, 22 de octubre de 2009. Última reforma: R.O. Suplemento 245, 7 de febrero de 2023. https://lotaip.bomberosquito.gob.ec/transparencia/2026/archivos/logjcc26.pdf"}, "preguntas": [{"id": "P1-01", "area": 1, "subarea": "Derecho Constitucional", "tema": "Acceso a la información pública", "resultado": "Identifica la garantía que tutela el acceso a la información pública.", "demanda": "Aplicar", "enunciado": "Un periodista solicita a un ministerio los contratos de una obra; la entidad le entrega información incompleta alegando que el resto es «reservado», sin norma que lo declare así. ¿Qué garantía procede?", "opciones": [{"texto": "Acción de acceso a la información pública.", "justificacion": "Correcta. Así lo prevé el art. 91 CRE; la reserva debe estar declarada previamente conforme a la ley."}, {"texto": "Acción de hábeas data.", "justificacion": "Incorrecta. El hábeas data protege datos personales del propio titular (art. 92 CRE), no información pública general."}, {"texto": "Acción por incumplimiento.", "justificacion": "Incorrecta. Garantiza la aplicación de normas o sentencias internacionales con obligación clara (art. 93 CRE)."}, {"texto": "Ninguna, porque la reserva la califica la entidad.", "justificacion": "Incorrecta. La Constitución permite impugnar la negativa aun cuando se invoque reserva."}], "correcta": 0, "referencias": ["CRE", "LOGJCC"]}, {"id": "P1-02", "area": 1, "subarea": "Derecho Constitucional", "tema": "Hábeas data", "resultado": "Determina el objeto y alcance del hábeas data.", "demanda": "Comprender", "enunciado": "Una persona descubre que una central de riesgos mantiene un registro desactualizado de una deuda que ya pagó. Mediante hábeas data puede:", "opciones": [{"texto": "Pedir la actualización o eliminación del registro.", "justificacion": "Correcta. Es el alcance del art. 92 CRE respecto de archivos y bancos de datos personales."}, {"texto": "Exigir únicamente una indemnización por daño moral.", "justificacion": "Incorrecta. El objeto del hábeas data es el control de los datos, sin perjuicio de otras acciones."}, {"texto": "Pedir la información financiera de terceros de la base.", "justificacion": "Incorrecta. El hábeas data se refiere a datos propios o sobre los bienes del titular."}, {"texto": "Obtener la liberación de una persona detenida.", "justificacion": "Incorrecta. Ese es el objeto del hábeas corpus (art. 89 CRE)."}], "correcta": 0, "referencias": ["CRE", "LOGJCC"]}, {"id": "P1-03", "area": 1, "subarea": "Derecho Constitucional", "tema": "Acción de protección", "resultado": "Verifica los requisitos de procedencia de la acción de protección.", "demanda": "Analizar", "enunciado": "Según la Ley Orgánica de Garantías Jurisdiccionales y Control Constitucional, la acción de protección exige concurrentemente:", "opciones": [{"texto": "Violación de un derecho, acción u omisión, y falta de otra vía eficaz.", "justificacion": "Correcta. Son los requisitos del art. 40 LOGJCC."}, {"texto": "Agotamiento previo de la vía administrativa y judicial ordinaria.", "justificacion": "Incorrecta. El art. 88 CRE no exige agotar la vía administrativa; la residualidad se analiza caso a caso."}, {"texto": "Que el accionante sea el afectado y actúe con patrocinio de abogado.", "justificacion": "Incorrecta. La legitimación es amplia (art. 86 num. 1 CRE) y no se requiere patrocinio para presentar la acción."}, {"texto": "Que la vulneración provenga exclusivamente de una autoridad pública.", "justificacion": "Incorrecta. También procede contra particulares en los supuestos constitucionales."}], "correcta": 0, "referencias": ["LOGJCC", "CRE"]}, {"id": "P1-04", "area": 1, "subarea": "Derecho Constitucional", "tema": "Órganos de control constitucional", "resultado": "Identifica al máximo órgano de control e interpretación constitucional.", "demanda": "Recordar", "enunciado": "¿Qué órgano es el máximo de control, interpretación constitucional y administración de justicia en esta materia en el Ecuador?", "opciones": [{"texto": "La Corte Constitucional.", "justificacion": "Correcta. Así lo establece el art. 429 CRE."}, {"texto": "La Corte Nacional de Justicia.", "justificacion": "Incorrecta. Es el máximo órgano de la justicia ordinaria (art. 182 CRE)."}, {"texto": "El Consejo de la Judicatura.", "justificacion": "Incorrecta. Es el órgano de gobierno, administración y disciplina de la Función Judicial (art. 178 CRE)."}, {"texto": "La Asamblea Nacional.", "justificacion": "Incorrecta. Interpreta la ley con carácter general obligatorio, no la Constitución."}], "correcta": 0, "referencias": ["CRE"]}, {"id": "P1-05", "area": 1, "subarea": "Derechos Humanos", "tema": "Derechos colectivos", "resultado": "Distingue la consulta previa de la consulta prelegislativa.", "demanda": "Analizar", "enunciado": "El Estado planifica explotar petróleo en tierras de una comuna indígena. Según el artículo 57 de la Constitución, corresponde:", "opciones": [{"texto": "La consulta previa, libre e informada a la comuna.", "justificacion": "Correcta. Es el derecho colectivo del art. 57 num. 7 CRE."}, {"texto": "La consulta prelegislativa a la comuna indígena.", "justificacion": "Incorrecta. Se refiere a medidas legislativas que puedan afectar derechos colectivos (art. 57 num. 17 CRE)."}, {"texto": "Un referéndum nacional obligatorio sobre la explotación.", "justificacion": "Incorrecta. No es el mecanismo previsto para este supuesto."}, {"texto": "Solo una notificación posterior al inicio de la explotación.", "justificacion": "Incorrecta. La consulta debe ser previa."}], "correcta": 0, "referencias": ["CRE"]}, {"id": "P1-06", "area": 1, "subarea": "Derecho Constitucional", "tema": "Derechos de la naturaleza", "resultado": "Determina la legitimación para exigir los derechos de la naturaleza.", "demanda": "Comprender", "enunciado": "Una vecina de un río contaminado, sin afectación personal directa, pretende exigir judicialmente los derechos de la naturaleza. Según la Constitución:", "opciones": [{"texto": "Está legitimada: toda persona puede exigir esos derechos.", "justificacion": "Correcta. Lo dispone el art. 71 CRE; la naturaleza es sujeto de derechos (art. 10 CRE)."}, {"texto": "Solo puede hacerlo el ministerio rector del ambiente.", "justificacion": "Incorrecta. La legitimación es amplia."}, {"texto": "Solo pueden hacerlo los propietarios ribereños afectados.", "justificacion": "Incorrecta. No se exige afectación personal."}, {"texto": "Solo puede hacerlo la Defensoría del Pueblo.", "justificacion": "Incorrecta. La Defensoría puede actuar, pero no tiene exclusividad."}], "correcta": 0, "referencias": ["CRE"]}, {"id": "P1-07", "area": 1, "subarea": "Derecho Constitucional", "tema": "Estado de excepción", "resultado": "Aplica los límites temporales del estado de excepción.", "demanda": "Recordar", "enunciado": "Según la Constitución, el decreto de estado de excepción tiene vigencia máxima de:", "opciones": [{"texto": "Sesenta días, renovable hasta por treinta días más.", "justificacion": "Correcta. Lo dispone el art. 166 CRE."}, {"texto": "Noventa días, renovable de forma indefinida.", "justificacion": "Incorrecta. No corresponde a los límites constitucionales."}, {"texto": "Treinta días, sin posibilidad de renovación.", "justificacion": "Incorrecta. No corresponde a los límites constitucionales."}, {"texto": "El tiempo que determine la Asamblea Nacional.", "justificacion": "Incorrecta. Los plazos están fijados en la Constitución."}], "correcta": 0, "referencias": ["CRE"]}, {"id": "P1-08", "area": 1, "subarea": "Derecho Constitucional", "tema": "Consulta de norma", "resultado": "Aplica el procedimiento de control concreto de constitucionalidad.", "demanda": "Aplicar", "enunciado": "Una jueza, al resolver un caso, considera que la norma aplicable es contraria a la Constitución. Según el artículo 428 de la Constitución, debe:", "opciones": [{"texto": "Suspender la causa y consultar a la Corte Constitucional.", "justificacion": "Correcta. Es el control concreto del art. 428 CRE."}, {"texto": "Inaplicar la norma y resolver el caso sin consultar.", "justificacion": "Incorrecta. El modelo ecuatoriano exige la consulta a la Corte Constitucional."}, {"texto": "Remitir la consulta a la Corte Nacional de Justicia.", "justificacion": "Incorrecta. La competencia es de la Corte Constitucional."}, {"texto": "Pedir a la Asamblea Nacional que derogue la norma.", "justificacion": "Incorrecta. No es el mecanismo de control concreto."}], "correcta": 0, "referencias": ["CRE"]}, {"id": "P1-09", "area": 1, "subarea": "Derechos Humanos", "tema": "Igualdad y no discriminación", "resultado": "Comprende la legitimidad de las medidas de acción afirmativa.", "demanda": "Evaluar", "enunciado": "Una ley reserva un porcentaje de becas para personas de pueblos históricamente excluidos. Un postulante alega discriminación. Según la Constitución, la medida:", "opciones": [{"texto": "Es legítima como medida de acción afirmativa.", "justificacion": "Correcta. Así lo prevé el art. 11 num. 2 CRE."}, {"texto": "Es inconstitucional: toda diferencia de trato discrimina.", "justificacion": "Incorrecta. La Constitución admite y ordena acciones afirmativas."}, {"texto": "Solo es válida si la Corte Constitucional la aprueba antes.", "justificacion": "Incorrecta. No existe ese control previo obligatorio."}, {"texto": "Es válida únicamente si se aplica en el sector privado.", "justificacion": "Incorrecta. La obligación recae en el Estado."}], "correcta": 0, "referencias": ["CRE"]}, {"id": "P2-01", "area": 2, "subarea": "Derecho Penal (parte general)", "tema": "Principio de favorabilidad", "resultado": "Aplica el principio de favorabilidad en la sucesión de leyes penales.", "demanda": "Aplicar", "enunciado": "Durante el proceso por un delito, una reforma reduce la pena prevista para esa conducta. Según la Constitución y el COIP:", "opciones": [{"texto": "Se aplica la norma menos rigurosa, aunque sea posterior.", "justificacion": "Correcta. Es el principio de favorabilidad (art. 76 num. 5 CRE; art. 5 num. 2 COIP)."}, {"texto": "Se aplica siempre la ley vigente al momento del hecho.", "justificacion": "Incorrecta. Desconoce la retroactividad favorable."}, {"texto": "El juez puede elegir libremente la norma que estime justa.", "justificacion": "Incorrecta. La favorabilidad es una regla obligatoria."}, {"texto": "La reforma solo rige para los hechos futuros.", "justificacion": "Incorrecta. La ley penal más favorable se aplica retroactivamente."}], "correcta": 0, "referencias": ["CRE", "COIP"]}, {"id": "P2-02", "area": 2, "subarea": "Derecho Procesal Penal", "tema": "Prohibición de doble juzgamiento", "resultado": "Aplica la garantía non bis in idem.", "demanda": "Evaluar", "enunciado": "Una persona fue sentenciada por la justicia indígena de su comunidad por un hecho, y luego la Fiscalía inicia un proceso penal ordinario por el mismo hecho. Según la Constitución:", "opciones": [{"texto": "Vulnera la prohibición de doble juzgamiento por el mismo hecho.", "justificacion": "Correcta. Lo dispone el art. 76 num. 7 lit. i) CRE, en concordancia con el art. 171 CRE."}, {"texto": "Es válido, porque la justicia indígena no produce cosa juzgada.", "justificacion": "Incorrecta. La Constitución reconoce sus decisiones para efectos del non bis in idem."}, {"texto": "Es válido si la pena prevista en la justicia ordinaria es mayor.", "justificacion": "Incorrecta. La gravedad de la pena no habilita el doble juzgamiento."}, {"texto": "Es válido si la víctima solicita el nuevo juzgamiento.", "justificacion": "Incorrecta. La garantía no depende de la voluntad de la víctima."}], "correcta": 0, "referencias": ["CRE", "COIP"]}, {"id": "P2-03", "area": 2, "subarea": "Derecho Penal (parte general)", "tema": "Culpabilidad", "resultado": "Identifica las causas de inculpabilidad.", "demanda": "Comprender", "enunciado": "Una persona comete un hecho típico bajo un trastorno mental debidamente comprobado que le impedía comprender la ilicitud de su conducta. Según el COIP:", "opciones": [{"texto": "No hay responsabilidad penal; cabe una medida de seguridad.", "justificacion": "Correcta. El trastorno mental es causa de inculpabilidad (arts. 35 y 36 COIP); la medida de seguridad es el internamiento (art. 76 COIP)."}, {"texto": "Responde penalmente, pero con una circunstancia atenuante.", "justificacion": "Incorrecta. La falta total de capacidad de comprender excluye la culpabilidad."}, {"texto": "La conducta deja de ser típica por falta de dolo.", "justificacion": "Incorrecta. La tipicidad subsiste; lo que falta es la culpabilidad."}, {"texto": "Se excluye la antijuridicidad de la conducta.", "justificacion": "Incorrecta. El trastorno mental no es causa de justificación."}], "correcta": 0, "referencias": ["COIP"]}, {"id": "P2-04", "area": 2, "subarea": "Derecho Penal (parte general)", "tema": "Complicidad", "resultado": "Determina la pena aplicable al cómplice.", "demanda": "Recordar", "enunciado": "Quien coopera dolosamente en la ejecución de un delito con actos secundarios, sin los cuales igualmente se habría cometido, responde según el COIP como:", "opciones": [{"texto": "Cómplice, con un tercio a la mitad de la pena del autor.", "justificacion": "Correcta. Es la regla del art. 43 COIP."}, {"texto": "Coautor, con la misma pena prevista para el autor.", "justificacion": "Incorrecta. La coautoría exige un aporte principal al hecho."}, {"texto": "Encubridor, con una pena equivalente a una contravención.", "justificacion": "Incorrecta. El COIP no reconoce el encubrimiento como forma de participación."}, {"texto": "Autor mediato, por facilitar la ejecución del delito.", "justificacion": "Incorrecta. No se vale de otra persona para ejecutar el delito."}], "correcta": 0, "referencias": ["COIP"]}, {"id": "P2-05", "area": 2, "subarea": "Derecho Penal (parte general)", "tema": "Circunstancias modificatorias", "resultado": "Aplica las reglas de individualización de la pena.", "demanda": "Aplicar", "enunciado": "En un delito, concurren dos circunstancias atenuantes y ninguna agravante. Según el COIP, la pena:", "opciones": [{"texto": "Es la mínima prevista en el tipo, reducida en un tercio.", "justificacion": "Correcta. Es la regla del art. 44 COIP."}, {"texto": "Es la máxima prevista en el tipo, reducida a la mitad.", "justificacion": "Incorrecta. No corresponde a la regla legal."}, {"texto": "Se sustituye por una pena no privativa de libertad.", "justificacion": "Incorrecta. Las atenuantes no producen esa sustitución."}, {"texto": "Se extingue por completo por las atenuantes.", "justificacion": "Incorrecta. Las atenuantes modifican la pena, no la extinguen."}], "correcta": 0, "referencias": ["COIP"]}, {"id": "P2-06", "area": 2, "subarea": "Derecho Penal (parte especial)", "tema": "Femicidio", "resultado": "Subsume hechos en el tipo penal de femicidio.", "demanda": "Analizar", "enunciado": "Según el COIP, el femicidio se configura cuando una persona:", "opciones": [{"texto": "Por relaciones de poder, da muerte a una mujer por su condición de género.", "justificacion": "Correcta. Es la descripción típica del art. 141 COIP."}, {"texto": "Da muerte a cualquier mujer, independientemente de las circunstancias.", "justificacion": "Incorrecta. El tipo exige el elemento de género y relaciones de poder."}, {"texto": "Lesiona gravemente a una mujer en el ámbito familiar.", "justificacion": "Incorrecta. Las lesiones se tipifican en otras normas."}, {"texto": "Causa culposamente la muerte de una mujer en cualquier contexto.", "justificacion": "Incorrecta. El femicidio es doloso."}], "correcta": 0, "referencias": ["COIP"]}, {"id": "P2-07", "area": 2, "subarea": "Derecho Procesal Penal", "tema": "Investigación previa", "resultado": "Aplica los plazos de la fase de investigación previa.", "demanda": "Recordar", "enunciado": "Según el COIP, la investigación previa por un delito sancionado con pena privativa de libertad de hasta cinco años no puede superar:", "opciones": [{"texto": "Un año.", "justificacion": "Correcta. El art. 585 COIP fija un año para estos delitos y dos años para los sancionados con más de cinco años."}, {"texto": "Dos años.", "justificacion": "Incorrecta. Es el plazo para delitos con pena mayor a cinco años."}, {"texto": "Noventa días.", "justificacion": "Incorrecta. Es el plazo máximo de la instrucción (art. 592 COIP)."}, {"texto": "Seis meses.", "justificacion": "Incorrecta. No es el plazo previsto."}], "correcta": 0, "referencias": ["COIP"]}, {"id": "P2-08", "area": 2, "subarea": "Derecho Procesal Penal", "tema": "Instrucción", "resultado": "Identifica el acto que inicia la etapa de instrucción.", "demanda": "Recordar", "enunciado": "Según el COIP, la etapa de instrucción se inicia con:", "opciones": [{"texto": "La audiencia de formulación de cargos.", "justificacion": "Correcta. Lo dispone el art. 591 COIP; la etapa no puede exceder de noventa días (art. 592 COIP)."}, {"texto": "La denuncia presentada ante la Fiscalía.", "justificacion": "Incorrecta. La denuncia puede dar lugar a la investigación previa."}, {"texto": "La audiencia preparatoria de juicio.", "justificacion": "Incorrecta. Corresponde a la etapa de evaluación y preparatoria de juicio."}, {"texto": "El parte policial.", "justificacion": "Incorrecta. No inicia ninguna etapa procesal."}], "correcta": 0, "referencias": ["COIP"]}, {"id": "P2-09", "area": 2, "subarea": "Derecho Procesal Penal", "tema": "Procedimiento directo", "resultado": "Determina la procedencia del procedimiento directo.", "demanda": "Aplicar", "enunciado": "Una persona es aprehendida en flagrancia por un delito contra la propiedad cuyo monto no excede de treinta salarios básicos. Según el COIP, el procedimiento directo:", "opciones": [{"texto": "Procede: concentra las etapas en una sola audiencia.", "justificacion": "Correcta. Es el ámbito del art. 640 COIP, salvo las exclusiones expresas de esa norma."}, {"texto": "No procede, porque solo se aplica a contravenciones.", "justificacion": "Incorrecta. El procedimiento directo se aplica a delitos."}, {"texto": "Procede solo si la persona procesada admite el hecho.", "justificacion": "Incorrecta. La admisión es requisito del procedimiento abreviado."}, {"texto": "Procede solo con acusación particular de la víctima.", "justificacion": "Incorrecta. Es un delito de ejercicio público."}], "correcta": 0, "referencias": ["COIP"]}, {"id": "P2-10", "area": 2, "subarea": "Derecho Penal (parte especial)", "tema": "Peculado", "resultado": "Identifica los elementos del delito de peculado.", "demanda": "Comprender", "enunciado": "Un servidor público se apropia, en beneficio propio, de fondos públicos cuya administración le fue confiada en razón de su cargo. ¿Qué delito comete según el COIP?", "opciones": [{"texto": "Peculado.", "justificacion": "Correcta. Tipificado en el art. 278 COIP; imprescriptible según el art. 233 CRE."}, {"texto": "Abuso de confianza.", "justificacion": "Incorrecta. Se aplica a particulares; la calidad de servidor público y los fondos públicos configuran peculado."}, {"texto": "Estafa.", "justificacion": "Incorrecta. La estafa exige engaño para obtener una disposición patrimonial."}, {"texto": "Concusión.", "justificacion": "Incorrecta. La concusión consiste en exigir pagos indebidos abusando del cargo."}], "correcta": 0, "referencias": ["COIP", "CRE"]}, {"id": "P3-01", "area": 3, "subarea": "Derecho Procesal (COGEP)", "tema": "Principios procesales", "resultado": "Identifica el sistema que rige el impulso procesal.", "demanda": "Recordar", "enunciado": "Según el COGEP, el impulso del proceso corresponde a las partes procesales conforme al sistema:", "opciones": [{"texto": "Dispositivo.", "justificacion": "Correcta. Lo dispone el art. 5 COGEP, en concordancia con el art. 168 num. 6 CRE."}, {"texto": "Inquisitivo.", "justificacion": "Incorrecta. Asigna la dirección e impulso principalmente al juez."}, {"texto": "Mixto escrito.", "justificacion": "Incorrecta. No es el sistema del COGEP."}, {"texto": "De oficio absoluto.", "justificacion": "Incorrecta. La actuación de oficio es excepcional."}], "correcta": 0, "referencias": ["COGEP", "CRE"]}, {"id": "P3-02", "area": 3, "subarea": "Derecho Procesal (COGEP)", "tema": "Citación", "resultado": "Aplica las formas de citación del COGEP.", "demanda": "Aplicar", "enunciado": "La parte actora desconoce el domicilio del demandado y no puede determinarlo. Según el COGEP, puede citarlo:", "opciones": [{"texto": "Por la prensa, previa declaración juramentada.", "justificacion": "Correcta. Es la citación por la prensa del art. 56 COGEP."}, {"texto": "Por boleta dejada en el domicilio de un familiar.", "justificacion": "Incorrecta. No es una forma válida de citación."}, {"texto": "Mediante llamada telefónica registrada por el secretario.", "justificacion": "Incorrecta. No es una forma de citación prevista."}, {"texto": "No puede citarlo hasta conocer su domicilio.", "justificacion": "Incorrecta. La ley prevé la citación por la prensa."}], "correcta": 0, "referencias": ["COGEP"]}, {"id": "P3-03", "area": 3, "subarea": "Derecho Procesal (COGEP)", "tema": "Excepciones previas", "resultado": "Distingue las excepciones previas de las defensas de fondo.", "demanda": "Analizar", "enunciado": "¿Cuál de las siguientes es una excepción previa según el COGEP?", "opciones": [{"texto": "La existencia de convenio arbitral o de mediación.", "justificacion": "Correcta. Figura entre las excepciones previas del art. 153 COGEP."}, {"texto": "El pago total de la obligación demandada.", "justificacion": "Incorrecta. Es una defensa de fondo."}, {"texto": "La lesión enorme sufrida en el contrato.", "justificacion": "Incorrecta. Es una pretensión o defensa de fondo."}, {"texto": "La falta de prueba de los hechos del actor.", "justificacion": "Incorrecta. Es una cuestión de mérito."}], "correcta": 0, "referencias": ["COGEP"]}, {"id": "P3-04", "area": 3, "subarea": "Derecho Procesal (COGEP)", "tema": "Procedimiento sumario", "resultado": "Identifica la estructura de audiencias del procedimiento sumario.", "demanda": "Comprender", "enunciado": "En el procedimiento sumario del COGEP, la audiencia es:", "opciones": [{"texto": "Única, con dos fases.", "justificacion": "Correcta. Es la regla del art. 333 COGEP."}, {"texto": "Doble: preliminar y de juicio, como en el ordinario.", "justificacion": "Incorrecta. Esa estructura corresponde al procedimiento ordinario."}, {"texto": "Escrita, sin audiencia oral.", "justificacion": "Incorrecta. El COGEP es un sistema oral."}, {"texto": "Triple: conciliación, prueba y sentencia.", "justificacion": "Incorrecta. No corresponde a la ley."}], "correcta": 0, "referencias": ["COGEP"]}, {"id": "P3-05", "area": 3, "subarea": "Métodos Alternativos", "tema": "Convenio arbitral", "resultado": "Identifica los requisitos formales del convenio arbitral.", "demanda": "Comprender", "enunciado": "Según la Ley de Arbitraje y Mediación, el convenio arbitral:", "opciones": [{"texto": "Es un acuerdo escrito sobre materias transigibles.", "justificacion": "Correcta. Es la definición del art. 5 LAM, en relación con el art. 1."}, {"texto": "Puede ser verbal si consta ante dos testigos.", "justificacion": "Incorrecta. La ley exige la forma escrita."}, {"texto": "Solo puede pactarse después de surgido el conflicto.", "justificacion": "Incorrecta. Puede referirse a controversias futuras."}, {"texto": "Puede abarcar también materias no transigibles.", "justificacion": "Incorrecta. Solo cabe sobre materias susceptibles de transacción."}], "correcta": 0, "referencias": ["LAM", "CRE"]}, {"id": "P3-06", "area": 3, "subarea": "Métodos Alternativos", "tema": "Conciliación penal", "resultado": "Determina la procedencia de la conciliación en materia penal.", "demanda": "Analizar", "enunciado": "¿En cuál de los siguientes casos procede la conciliación según el COIP?", "opciones": [{"texto": "En un delito de tránsito sin resultado de muerte.", "justificacion": "Correcta. Es uno de los supuestos del art. 663 COIP."}, {"texto": "En un delito contra la integridad sexual y reproductiva.", "justificacion": "Incorrecta. Está expresamente excluido."}, {"texto": "En un delito de violencia contra la mujer o la familia.", "justificacion": "Incorrecta. Está expresamente excluido."}, {"texto": "En un delito de peculado de baja cuantía.", "justificacion": "Incorrecta. Los delitos contra la eficiencia de la administración pública están excluidos."}], "correcta": 0, "referencias": ["COIP"]}, {"id": "P4-01", "area": 4, "subarea": "Personas y Familia", "tema": "Domicilio", "resultado": "Identifica los elementos del domicilio civil.", "demanda": "Recordar", "enunciado": "Según el Código Civil, el domicilio consiste en:", "opciones": [{"texto": "La residencia con ánimo de permanecer en ella.", "justificacion": "Correcta. Es la definición del art. 45 del Código Civil."}, {"texto": "El lugar de nacimiento de la persona.", "justificacion": "Incorrecta. El nacimiento no determina el domicilio."}, {"texto": "El lugar donde se encuentra la persona en un momento dado.", "justificacion": "Incorrecta. Eso es la mera residencia o habitación."}, {"texto": "El lugar señalado en la cédula de identidad.", "justificacion": "Incorrecta. Es un dato administrativo, no el concepto civil."}], "correcta": 0, "referencias": ["CC"]}, {"id": "P4-02", "area": 4, "subarea": "Personas y Familia", "tema": "Patria potestad", "resultado": "Comprende la naturaleza de la patria potestad.", "demanda": "Comprender", "enunciado": "Según el Código Civil, la patria potestad es:", "opciones": [{"texto": "Los derechos de los padres sobre sus hijos no emancipados.", "justificacion": "Correcta. Es la definición del art. 283 del Código Civil."}, {"texto": "La obligación de alimentos entre parientes cercanos.", "justificacion": "Incorrecta. Es una institución distinta."}, {"texto": "La facultad del Estado de proteger a los menores de edad.", "justificacion": "Incorrecta. La patria potestad corresponde a los padres."}, {"texto": "El derecho de los hijos a heredar a sus padres.", "justificacion": "Incorrecta. Se refiere a la sucesión, no a la patria potestad."}], "correcta": 0, "referencias": ["CC"]}, {"id": "P4-03", "area": 4, "subarea": "Bienes", "tema": "Usufructo", "resultado": "Identifica las características del usufructo.", "demanda": "Comprender", "enunciado": "Según el Código Civil, el usufructo es un derecho real que consiste en:", "opciones": [{"texto": "Gozar de una cosa ajena conservando su forma y sustancia.", "justificacion": "Correcta. Es la definición del art. 778 del Código Civil."}, {"texto": "El dominio pleno sobre una cosa ajena por tiempo limitado.", "justificacion": "Incorrecta. El usufructuario no es dueño."}, {"texto": "La mera tenencia temporal de una cosa sin derecho a frutos.", "justificacion": "Incorrecta. El usufructo da derecho a los frutos."}, {"texto": "Un derecho personal que nace del contrato de arrendamiento.", "justificacion": "Incorrecta. El arrendamiento genera derechos personales, no reales."}], "correcta": 0, "referencias": ["CC"]}, {"id": "P4-04", "area": 4, "subarea": "Bienes", "tema": "Acción reivindicatoria", "resultado": "Identifica la legitimación en la acción reivindicatoria.", "demanda": "Aplicar", "enunciado": "El propietario de un terreno, que no está en posesión de él, quiere que el actual poseedor se lo restituya. Debe ejercer:", "opciones": [{"texto": "La acción reivindicatoria.", "justificacion": "Correcta. Es la definición del art. 933 del Código Civil."}, {"texto": "Una acción posesoria de amparo.", "justificacion": "Incorrecta. Protege la posesión, no el dominio, y la ejerce quien poseía."}, {"texto": "La prescripción adquisitiva de dominio.", "justificacion": "Incorrecta. La alega el poseedor, no el dueño."}, {"texto": "La acción de partición del bien.", "justificacion": "Incorrecta. Procede entre comuneros."}], "correcta": 0, "referencias": ["CC"]}, {"id": "P4-05", "area": 4, "subarea": "Obligaciones y Contratos", "tema": "Solidaridad", "resultado": "Aplica las fuentes de la solidaridad pasiva.", "demanda": "Analizar", "enunciado": "Tres personas firman un préstamo sin pactar nada sobre la forma de responder, y ninguna ley establece solidaridad para ese caso. El acreedor:", "opciones": [{"texto": "Solo puede cobrar a cada deudor su cuota.", "justificacion": "Correcta. Es la regla del art. 1527 del Código Civil."}, {"texto": "Puede cobrar el total a cualquiera, porque la solidaridad se presume.", "justificacion": "Incorrecta. La solidaridad no se presume."}, {"texto": "Debe demandar primero al deudor que sea más solvente.", "justificacion": "Incorrecta. No existe esa regla."}, {"texto": "No puede cobrar a nadie si uno de ellos es insolvente.", "justificacion": "Incorrecta. La insolvencia de uno no extingue la obligación de los demás."}], "correcta": 0, "referencias": ["CC"]}, {"id": "P4-06", "area": 4, "subarea": "Obligaciones y Contratos", "tema": "Mora", "resultado": "Determina cuándo el deudor está en mora.", "demanda": "Aplicar", "enunciado": "Un deudor que debía pagar el 30 de junio no lo hizo, y el contrato no exige requerimiento. Según el Código Civil:", "opciones": [{"texto": "Está en mora desde que no pagó en el término estipulado.", "justificacion": "Correcta. Es el supuesto del art. 1567 num. 1 del Código Civil."}, {"texto": "Solo estará en mora cuando sea demandado judicialmente.", "justificacion": "Incorrecta. La reconvención judicial opera en los casos no previstos en los numerales anteriores."}, {"texto": "Nunca estará en mora si actúa de buena fe.", "justificacion": "Incorrecta. La buena fe no excluye la mora."}, {"texto": "Estará en mora treinta días después del vencimiento.", "justificacion": "Incorrecta. No existe ese plazo de gracia legal."}], "correcta": 0, "referencias": ["CC"]}, {"id": "P4-07", "area": 4, "subarea": "Sucesiones", "tema": "Legitimarios", "resultado": "Identifica a los legitimarios en el Código Civil.", "demanda": "Recordar", "enunciado": "Según el Código Civil, son legitimarios:", "opciones": [{"texto": "Los hijos, personalmente o por representación, y los padres.", "justificacion": "Correcta. Es la enumeración del art. 1205 del Código Civil."}, {"texto": "El cónyuge sobreviviente, los hijos y los hermanos.", "justificacion": "Incorrecta. El cónyuge tiene porción conyugal y los hermanos no son legitimarios."}, {"texto": "Todos los parientes hasta el cuarto grado de consanguinidad.", "justificacion": "Incorrecta. Confunde la legítima con la sucesión intestada."}, {"texto": "Solo los hijos que sean mayores de edad.", "justificacion": "Incorrecta. La edad no determina la calidad de legitimario."}], "correcta": 0, "referencias": ["CC"]}, {"id": "P4-08", "area": 4, "subarea": "Sucesiones", "tema": "Beneficio de inventario", "resultad
