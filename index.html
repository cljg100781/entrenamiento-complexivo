otivación facilita, no impide, la impugnación."}, {"texto": "Sustituir la audiencia por actuaciones escritas.", "justificacion": "Incorrecta. La motivación no reemplaza la oralidad."}, {"texto": "Impedir la publicidad de las actuaciones.", "justificacion": "Incorrecta. La motivación refuerza la transparencia."}], "correcta": 0, "referencias": ["CRE", "COGEP"]}, {"id": "DPG-20", "area": 3, "dificultad": 2, "subarea": "Derecho Procesal General", "tema": "Congruencia", "resultado": "Aplica el principio de congruencia de la sentencia.", "demanda": "Comprender", "enunciado": "La congruencia de la sentencia exige que:", "opciones": [{"texto": "Se resuelva lo pedido y debatido, sin excederse.", "justificacion": "Correcta. La sentencia debe ser congruente con las pretensiones y excepciones planteadas; no puede conceder más ni cosa distinta de lo pedido (art. 92 COGEP)."}, {"texto": "El juez modifique libremente la pretensión si lo estima justo.", "justificacion": "Incorrecta. Sería un fallo extra o ultra petita."}, {"texto": "Se introduzcan hechos nuevos en la sentencia.", "justificacion": "Incorrecta. El juez decide sobre los hechos debatidos."}, {"texto": "Se omita el análisis de las excepciones.", "justificacion": "Incorrecta. Omitirlas sería un fallo citra petita."}], "correcta": 0, "referencias": ["COGEP"]}, {"id": "DPG-21", "area": 3, "dificultad": 2, "subarea": "Derecho Procesal General", "tema": "Excepciones previas", "resultado": "Distingue excepciones previas de defensas de fondo.", "demanda": "Comprender", "enunciado": "Una excepción procesal (previa) suele dirigirse a:", "opciones": [{"texto": "Cuestionar la validez o procedencia del proceso.", "justificacion": "Correcta. Las excepciones previas (incompetencia, falta de capacidad, litispendencia, caducidad, entre otras) atacan la constitución válida del proceso (art. 153 COGEP)."}, {"texto": "Negar el fondo de la pretensión con nuevos hechos.", "justificacion": "Incorrecta. Esa es una defensa o excepción de fondo."}, {"texto": "Solicitar medidas de apremio contra la contraparte.", "justificacion": "Incorrecta. El apremio es una medida de ejecución, no una excepción."}, {"texto": "Pedir la ejecución anticipada de la sentencia.", "justificacion": "Incorrecta. No es una excepción."}], "correcta": 0, "referencias": ["COGEP"]}, {"id": "DPG-22", "area": 3, "dificultad": 1, "subarea": "Derecho Procesal General", "tema": "Reconvención", "resultado": "Identifica la reconvención.", "demanda": "Recordar", "enunciado": "La reconvención se entiende como:", "opciones": [{"texto": "Una pretensión del demandado contra el actor en el mismo proceso.", "justificacion": "Correcta. El demandado puede reconvenir al actor al contestar la demanda (art. 154 COGEP)."}, {"texto": "Una prueba nueva que el demandado presenta fuera del plazo legal previsto.", "justificacion": "Incorrecta. La prueba no anunciada se rige por el art. 166 COGEP."}, {"texto": "Una forma de desistimiento de la demanda.", "justificacion": "Incorrecta. El desistimiento se regula en el art. 237 COGEP."}, {"texto": "Un acuerdo extrajudicial de carácter obligatorio.", "justificacion": "Incorrecta. Describe una transacción, no la reconvención."}], "correcta": 0, "referencias": ["COGEP"]}, {"id": "DPG-23", "area": 3, "dificultad": 2, "subarea": "Derecho Procesal General", "tema": "Acumulación de pretensiones", "resultado": "Comprende la acumulación de pretensiones.", "demanda": "Comprender", "enunciado": "La acumulación de pretensiones permite:", "opciones": [{"texto": "Tramitar juntas varias pretensiones compatibles.", "justificacion": "Correcta. El actor puede proponer varias pretensiones en una demanda siempre que no sean contrarias o incompatibles y correspondan a la misma competencia y procedimiento (art. 145 COGEP)."}, {"texto": "Ejecutar una obligación sin necesidad de sentencia.", "justificacion": "Incorrecta. La ejecución exige título."}, {"texto": "Evitar la notificación de las providencias.", "justificacion": "Incorrecta. Las notificaciones son obligatorias."}, {"texto": "Reemplazar la contestación a la demanda.", "justificacion": "Incorrecta. La contestación es un acto del demandado."}], "correcta": 0, "referencias": ["COGEP"]}, {"id": "DPG-24", "area": 3, "dificultad": 1, "subarea": "Derecho Procesal General", "tema": "Litisconsorcio", "resultado": "Identifica el litisconsorcio.", "demanda": "Recordar", "enunciado": "El litisconsorcio se presenta cuando:", "opciones": [{"texto": "Hay varias personas en una misma posición procesal.", "justificacion": "Correcta. Existe litisconsorcio cuando varias personas actúan como actores o demandados en un mismo proceso (arts. 51 y 52 COGEP)."}, {"texto": "Existen varios jueces para un mismo caso.", "justificacion": "Incorrecta. Eso describe un tribunal pluripersonal."}, {"texto": "Se acumulan varios peritajes en el expediente.", "justificacion": "Incorrecta. No guarda relación con las partes."}, {"texto": "La audiencia se realiza en varias fechas.", "justificacion": "Incorrecta. Eso es una suspensión de audiencia (art. 82 COGEP)."}], "correcta": 0, "referencias": ["COGEP"]}, {"id": "DPG-25", "area": 3, "dificultad": 1, "subarea": "Derecho Procesal General", "tema": "Intervención de terceros", "resultado": "Identifica la finalidad de la tercería.", "demanda": "Comprender", "enunciado": "La intervención de terceros en el proceso persigue, en general:", "opciones": [{"texto": "Proteger un interés que la decisión podría afectar.", "justificacion": "Correcta. El tercero puede intervenir cuando acredite un interés directo en la causa (tercerías, arts. 46 a 50 COGEP)."}, {"texto": "Impedir que se practique la prueba anunciada por las partes principales.", "justificacion": "Incorrecta. No es su finalidad."}, {"texto": "Reemplazar al juez natural de la causa.", "justificacion": "Incorrecta. El tercero es parte, no juzgador."}, {"texto": "Convertir el proceso judicial en arbitraje.", "justificacion": "Incorrecta. El arbitraje requiere convenio arbitral."}], "correcta": 0, "referencias": ["COGEP"]}, {"id": "DPG-26", "area": 3, "dificultad": 2, "subarea": "Derecho Procesal General", "tema": "Nulidad procesal", "resultado": "Identifica los criterios para declarar la nulidad procesal.", "demanda": "Analizar", "enunciado": "Una nulidad procesal requiere, como criterio orientador, que exista:", "opciones": [{"texto": "Un vicio relevante que afecte garantías o la finalidad del acto.", "justificacion": "Correcta. Solo la omisión de solemnidades sustanciales que haya influido o pueda influir en la decisión acarrea nulidad (arts. 107 y 110 COGEP)."}, {"texto": "Cualquier error de forma en una providencia, aunque no cause perjuicio alguno.", "justificacion": "Incorrecta. Rige el principio de trascendencia."}, {"texto": "La sola inconformidad de una parte con la sentencia.", "justificacion": "Incorrecta. La inconformidad se canaliza por recursos."}, {"texto": "Mala fe de la parte contraria en todos los casos.", "justificacion": "Incorrecta. La nulidad no exige mala fe."}], "correcta": 0, "referencias": ["COGEP"]}, {"id": "DPG-27", "area": 3, "dificultad": 2, "subarea": "Derecho Procesal General", "tema": "Convalidación", "resultado": "Aplica la convalidación de vicios procesales.", "demanda": "Aplicar", "enunciado": "La convalidación de un vicio procesal ocurre cuando:", "opciones": [{"texto": "La parte afectada no lo reclama a tiempo pudiendo hacerlo.", "justificacion": "Correcta. La nulidad no se declara si el vicio fue convalidado por la parte que podía alegarlo (art. 110 COGEP)."}, {"texto": "El juez declara de oficio la nulidad del acto viciado en todos los casos.", "justificacion": "Incorrecta. Es lo contrario de convalidar."}, {"texto": "Se presenta una nueva demanda por los mismos hechos.", "justificacion": "Incorrecta. Eso puede generar litispendencia."}, {"texto": "Se modifica la competencia territorial del juez.", "justificacion": "Incorrecta. No guarda relación con la convalidación."}], "correcta": 0, "referencias": ["COGEP"]}, {"id": "DPG-28", "area": 3, "dificultad": 2, "subarea": "Derecho Procesal General", "tema": "Preclusión", "resultado": "Comprende la preclusión procesal.", "demanda": "Comprender", "enunciado": "La preclusión opera cuando:", "opciones": [{"texto": "Se pierde una facultad por no ejercerla a tiempo.", "justificacion": "Correcta. El proceso avanza por etapas: vencida la oportunidad (por ejemplo, para anunciar prueba o proponer excepciones), la facultad se extingue."}, {"texto": "Se suspende el proceso por acuerdo de las partes.", "justificacion": "Incorrecta. Describe una suspensión."}, {"texto": "Se abre automáticamente una nueva instancia.", "justificacion": "Incorrecta. Las instancias se abren por recurso."}, {"texto": "Se permite repetir indefinidamente los alegatos.", "justificacion": "Incorrecta. La preclusión impide precisamente eso."}], "correcta": 0, "referencias": ["COGEP"]}, {"id": "DPG-29", "area": 3, "dificultad": 2, "subarea": "Derecho Procesal General", "tema": "Caducidad", "resultado": "Identifica la caducidad en materia procesal.", "demanda": "Comprender", "enunciado": "La caducidad, en términos procesales, se asocia a:", "opciones": [{"texto": "La pérdida del derecho de accionar por el paso del tiempo.", "justificacion": "Correcta. La caducidad extingue la acción por no ejercerla en el plazo legal y puede alegarse como excepción previa (art. 153 num. 7 COGEP)."}, {"texto": "La nulidad automática de toda sentencia dictada.", "justificacion": "Incorrecta. No guarda relación con la nulidad."}, {"texto": "La incapacidad del abogado patrocinador.", "justificacion": "Incorrecta. No se refiere al patrocinio."}, {"texto": "La falta de prueba documental de la demanda.", "justificacion": "Incorrecta. Es una cuestión probatoria."}], "correcta": 0, "referencias": ["COGEP"]}, {"id": "DPG-30", "area": 3, "dificultad": 1, "subarea": "Derecho Procesal General", "tema": "Suspensión", "resultado": "Distingue la suspensión de la terminación del proceso.", "demanda": "Comprender", "enunciado": "La suspensión del proceso o de una audiencia implica:", "opciones": [{"texto": "Detener temporalmente el trámite, sin extinguirlo.", "justificacion": "Correcta. La suspensión interrumpe el curso por una causa prevista y luego se reanuda (por ejemplo, la de audiencias, art. 82 COGEP)."}, {"texto": "Cerrar definitivamente el expediente y archivar la causa sin sentencia.", "justificacion": "Incorrecta. Eso es el archivo o la terminación."}, {"texto": "Dictar sentencia de forma inmediata.", "justificacion": "Incorrecta. Es contrario a la suspensión."}, {"texto": "Cambiar al juez competente de la causa.", "justificacion": "Incorrecta. Eso es una cuestión de competencia."}], "correcta": 0, "referencias": ["COGEP"]}, {"id": "DPG-31", "area": 3, "dificultad": 1, "subarea": "Derecho Procesal General", "tema": "Audiencia preliminar", "resultado": "Identifica el contenido de la audiencia preliminar.", "demanda": "Recordar", "enunciado": "La audiencia preliminar sirve, principalmente, para:", "opciones": [{"texto": "Sanear el proceso, fijar la controversia y admitir prueba.", "justificacion": "Correcta. En ella se resuelven excepciones previas, se declara la validez, se fija el objeto de la controversia, se promueve la conciliación y se admite la prueba (art. 294 COGEP)."}, {"texto": "Ejecutar la sentencia dictada en el proceso.", "justificacion": "Incorrecta. La ejecución es posterior a la sentencia."}, {"texto": "Recibir únicamente los alegatos finales de las partes antes del fallo.", "justificacion": "Incorrecta. Los alegatos finales se presentan en la audiencia de juicio."}, {"texto": "Practicar solo inspecciones judiciales.", "justificacion": "Incorrecta. La prueba se practica en la audiencia de juicio."}], "correcta": 0, "referencias": ["COGEP"]}, {"id": "DPG-32", "area": 3, "dificultad": 1, "subarea": "Derecho Procesal General", "tema": "Audiencia de juicio", "resultado": "Identifica la finalidad de la audiencia de juicio.", "demanda": "Recordar", "enunciado": "La audiencia de juicio se orienta principalmente a:", "opciones": [{"texto": "Practicar la prueba, oír alegatos y decidir.", "justificacion": "Correcta. En la audiencia de juicio se practica la prueba admitida, se presentan los alegatos y se emite la decisión (art. 297 COGEP)."}, {"texto": "Notificar la demanda por primera vez.", "justificacion": "Incorrecta. La demanda se cita al inicio (art. 53 COGEP)."}, {"texto": "Negociar exclusivamente acuerdos entre partes.", "justificacion": "Incorrecta. La conciliación se promueve en la preliminar."}, {"texto": "Resolver la competencia territorial del juez.", "justificacion": "Incorrecta. Se resuelve en la audiencia preliminar."}], "correcta": 0, "referencias": ["COGEP"]}, {"id": "DPG-33", "area": 3, "dificultad": 1, "subarea": "Derecho Procesal General", "tema": "Inmediación", "resultado": "Aplica el principio de inmediación.", "demanda": "Comprender", "enunciado": "El principio de inmediación se ve reforzado cuando:", "opciones": [{"texto": "El juez presencia directamente la práctica de la prueba.", "justificacion": "Correcta. El juzgador debe estar presente de forma ininterrumpida en las audiencias (art. 81 COGEP)."}, {"texto": "Las partes remiten todos sus escritos por correo, sin necesidad de audiencia.", "justificacion": "Incorrecta. Excluye el contacto directo con la prueba."}, {"texto": "La prueba se valora sin ninguna explicación.", "justificacion": "Incorrecta. Vulnera la motivación."}, {"texto": "El proceso es totalmente reservado para las partes.", "justificacion": "Incorrecta. La reserva no tiene relación con la inmediación."}], "correcta": 0, "referencias": ["COGEP"]}, {"id": "DPG-34", "area": 3, "dificultad": 1, "subarea": "Derecho Procesal General", "tema": "Concentración", "resultado": "Identifica el principio de concentración.", "demanda": "Comprender", "enunciado": "El principio de concentración busca:", "opciones": [{"texto": "Reunir las actuaciones en el menor número de actos.", "justificacion": "Correcta. Es uno de los principios del sistema oral (art. 168 num. 6 CRE)."}, {"texto": "Multiplicar los incidentes para mayor detalle.", "justificacion": "Incorrecta. Es contrario a la concentración."}, {"texto": "Evitar que el juez conozca la prueba.", "justificacion": "Incorrecta. Vulneraría la inmediación."}, {"texto": "Sustituir audiencias por escritos extensos.", "justificacion": "Incorrecta. Contradice el sistema oral."}], "correcta": 0, "referencias": ["CRE"]}, {"id": "DPG-35", "area": 3, "dificultad": 1, "subarea": "Derecho Procesal General", "tema": "Publicidad", "resultado": "Comprende el principio de publicidad procesal.", "demanda": "Comprender", "enunciado": "La publicidad procesal, como regla, persigue:", "opciones": [{"texto": "Control social y transparencia, salvo excepciones legales.", "justificacion": "Correcta. Los juicios y sus decisiones son públicos, salvo los casos expresamente señalados por la ley (art. 168 num. 5 CRE; art. 83 COGEP)."}, {"texto": "Impedir el acceso de las partes al expediente para proteger su intimidad.", "justificacion": "Incorrecta. Las partes siempre tienen acceso."}, {"texto": "Eliminar la contradicción entre las partes.", "justificacion": "Incorrecta. La publicidad no la elimina."}, {"texto": "Hacer obligatorio el arbitraje en la causa.", "justificacion": "Incorrecta. No guarda relación."}], "correcta": 0, "referencias": ["CRE", "COGEP"]}, {"id": "DPG-36", "area": 3, "dificultad": 1, "subarea": "Derecho Procesal General", "tema": "Notificación", "resultado": "Identifica la función de la notificación.", "demanda": "Recordar", "enunciado": "La notificación válida cumple la función de:", "opciones": [{"texto": "Hacer conocer oportunamente los actos procesales.", "justificacion": "Correcta. La notificación es el acto por el cual se pone en conocimiento de las partes y demás interesados las providencias judiciales (art. 65 COGEP)."}, {"texto": "Garantizar la práctica de la prueba pericial solicitada por las partes.", "justificacion": "Incorrecta. No guarda relación con la pericia."}, {"texto": "Sustituir la contestación a la demanda.", "justificacion": "Incorrecta. La contestación es un acto de parte."}, {"texto": "Evitar que el juez deba motivar.", "justificacion": "Incorrecta. La motivación es obligatoria."}], "correcta": 0, "referencias": ["COGEP"]}, {"id": "DPG-37", "area": 3, "dificultad": 2, "subarea": "Derecho Procesal General", "tema": "Ineficacia de los actos procesales", "resultado": "Identifica la ineficacia de los actos procesales.", "demanda": "Comprender", "enunciado": "Un acto procesal es ineficaz cuando:", "opciones": [{"texto": "No produce efectos por omitir requisitos esenciales.", "justificacion": "Correcta. La omisión de solemnidades sustanciales priva al acto de eficacia y puede acarrear nulidad (art. 107 COGEP)."}, {"texto": "Se practica de forma oral en una audiencia y no se reduce a escrito.", "justificacion": "Incorrecta. La oralidad es la regla."}, {"texto": "Se realiza con la intervención de un abogado.", "justificacion": "Incorrecta. El patrocinio no lo invalida."}, {"texto": "Se incorpora formalmente al expediente.", "justificacion": "Incorrecta. La incorporación no lo vuelve ineficaz."}], "correcta": 0, "referencias": ["COGEP"]}, {"id": "DPG-38", "area": 3, "dificultad": 1, "subarea": "Derecho Procesal General", "tema": "Prueba testimonial", "resultado": "Identifica los estándares de la prueba testimonial.", "demanda": "Comprender", "enunciado": "La prueba testimonial exige, como estándar mínimo, que:", "opciones": [{"texto": "Se practique con preguntas y contradicción.", "justificacion": "Correcta. El testimonio se practica en audiencia mediante interrogatorio y contrainterrogatorio (arts. 174 y 178 COGEP)."}, {"texto": "Sea siempre escrita y sin audiencia.", "justificacion": "Incorrecta. Se practica oralmente en audiencia."}, {"texto": "Se sustituya por informes policiales.", "justificacion": "Incorrecta. Un informe no reemplaza el testimonio."}, {"texto": "Se limite a familiares de las partes.", "justificacion": "Incorrecta. Puede declarar cualquier persona hábil."}], "correcta": 0, "referencias": ["COGEP"]}, {"id": "DPG-39", "area": 3, "dificultad": 1, "subarea": "Derecho Procesal General", "tema": "Contrainterrogatorio", "resultado": "Identifica el objetivo del contrainterrogatorio.", "demanda": "Comprender", "enunciado": "El contrainterrogatorio tiene como objetivo principal:", "opciones": [{"texto": "Cuestionar la credibilidad del testimonio adverso.", "justificacion": "Correcta. Lo realiza la parte contraria para controvertir la versión del testigo (art. 178 COGEP)."}, {"texto": "Sustituir el alegato final de la parte que propuso al testigo.", "justificacion": "Incorrecta. El alegato es un acto distinto."}, {"texto": "Evitar la inmediación del juzgador.", "justificacion": "Incorrecta. El contrainterrogatorio se hace ante el juez."}, {"texto": "Impulsar la reconvención del demandado.", "justificacion": "Incorrecta. No guarda relación."}], "correcta": 0, "referencias": ["COGEP"]}, {"id": "DPG-40", "area": 3, "dificultad": 1, "subarea": "Derecho Procesal General", "tema": "Prueba pericial", "resultado": "Identifica cuándo procede la prueba pericial.", "demanda": "Comprender", "enunciado": "La pericia se utiliza cuando:", "opciones": [{"texto": "Se requieren conocimientos técnicos para esclarecer hechos.", "justificacion": "Correcta. El perito es la persona natural o jurídica que, por sus conocimientos especializados, informa al juzgador sobre hechos técnicos (art. 221 COGEP)."}, {"texto": "Basta la simple afirmación de una de las partes.", "justificacion": "Incorrecta. La afirmación debe probarse."}, {"texto": "Solo existen documentos públicos en el proceso.", "justificacion": "Incorrecta. No es el criterio de la pericia."}, {"texto": "El juez debe delegar en un experto la decisión de fondo de la causa.", "justificacion": "Incorrecta. El juez no delega su decisión."}], "correcta": 0, "referencias": ["COGEP"]}, {"id": "DPG-41", "area": 3, "dificultad": 1, "subarea": "Derecho Procesal General", "tema": "Inspección judicial", "resultado": "Identifica la procedencia de la inspección judicial.", "demanda": "Comprender", "enunciado": "La inspección judicial es adecuada cuando:", "opciones": [{"texto": "La percepción directa del juez ayuda a esclarecer hechos.", "justificacion": "Correcta. El juzgador puede examinar directamente lugares, cosas o documentos (arts. 228 a 232 COGEP)."}, {"texto": "Se pretende reemplazar con ella toda otra prueba anunciada por las partes.", "justificacion": "Incorrecta. Es un medio más de prueba."}, {"texto": "No existe ninguna controversia sobre los hechos.", "justificacion": "Incorrecta. Sin controversia no hace falta prueba."}, {"texto": "Se busca cambiar la competencia del juez.", "justificacion": "Incorrecta. No guarda relación."}], "correcta": 0, "referencias": ["COGEP"]}, {"id": "DPG-42", "area": 3, "dificultad": 1, "subarea": "Derecho Procesal General", "tema": "Providencias preventivas", "resultado": "Identifica la finalidad de las providencias preventivas.", "demanda": "Comprender", "enunciado": "Una medida cautelar o providencia preventiva busca, en general:", "opciones": [{"texto": "Asegurar la eficacia de una eventual decisión final.", "justificacion": "Correcta. Las providencias preventivas, como el secuestro o la retención, aseguran el cumplimiento de lo que se resuelva (art. 124 COGEP)."}, {"texto": "Sancionar anticipadamente al demandado.", "justificacion": "Incorrecta. No son sanciones."}, {"texto": "Resolver de inmediato el fondo del litigio.", "justificacion": "Incorrecta. Son provisionales y accesorias."}, {"texto": "Eliminar el derecho de defensa del demandado.", "justificacion": "Incorrecta. No afectan el derecho de defensa."}], "correcta": 0, "referencias": ["COGEP"]}, {"id": "DPG-43", "area": 3, "dificultad": 2, "subarea": "Derecho Procesal General", "tema": "Apariencia de buen derecho", "resultado": "Comprende los requisitos de las providencias preventivas.", "demanda": "Analizar", "enunciado": "El requisito de apariencia de buen derecho se relaciona con:", "opciones": [{"texto": "La verosimilitud inicial de lo que se pretende.", "justificacion": "Correcta. Para ordenar una providencia preventiva se exige, entre otros requisitos, que se pruebe la existencia del crédito (art. 125 COGEP), es decir, una apariencia razonable del derecho."}, {"texto": "La certeza absoluta que el juez debe tener sobre el fondo del litigio.", "justificacion": "Incorrecta. La certeza se alcanza en sentencia."}, {"texto": "La existencia obligatoria de una confesión.", "justificacion": "Incorrecta. No es requisito."}, {"texto": "La renuncia del demandado a defenderse.", "justificacion": "Incorrecta. No guarda relación."}], "correcta": 0, "referencias": ["COGEP"]}, {"id": "DPG-44", "area": 3, "dificultad": 2, "subarea": "Derecho Procesal General", "tema": "Peligro en la demora", "resultado": "Comprende los requisitos de las providencias preventivas.", "demanda": "Analizar", "enunciado": "El peligro en la demora se configura cuando:", "opciones": [{"texto": "La espera puede frustrar la tutela o causar un daño grave.", "justificacion": "Correcta. Se exige probar que los bienes del deudor se encuentran en tal estado que no alcancen a cubrir la deuda o que puedan desaparecer u ocultarse (art. 125 COGEP)."}, {"texto": "El demandado comparece oportunamente al proceso y contesta la demanda.", "justificacion": "Incorrecta. La comparecencia no genera peligro."}, {"texto": "Existen varios abogados patrocinando a una parte.", "justificacion": "Incorrecta. No guarda relación."}, {"texto": "El juez convoca a la audiencia preliminar.", "justificacion": "Incorrecta. No guarda relación."}], "correcta": 0, "referencias": ["COGEP"]}, {"id": "DPG-45", "area": 3, "dificultad": 1, "subarea": "Derecho Procesal General", "tema": "Desistimiento", "resultado": "Identifica los efectos del desistimiento.", "demanda": "Recordar", "enunciado": "El desistimiento de la demanda implica, en general:", "opciones": [{"texto": "Que el actor abandona su pretensión en el proceso.", "justificacion": "Correcta. Quien desiste de la pretensión no puede volver a proponerla contra la misma persona (art. 237 COGEP)."}, {"texto": "Una sentencia definitiva favorable al actor.", "justificacion": "Incorrecta. Es lo opuesto."}, {"texto": "La imposición de responsabilidad penal al actor por haber demandado.", "justificacion": "Incorrecta. No tiene efectos penales."}, {"texto": "La nulidad de todo lo actuado por el juez.", "justificacion": "Incorrecta. No es una nulidad."}], "correcta": 0, "referencias": ["COGEP"]}, {"id": "DPG-46", "area": 3, "dificultad": 1, "subarea": "Derecho Procesal General", "tema": "Transacción", "resultado": "Identifica la transacción como forma de terminación.", "demanda": "Recordar", "enunciado": "La transacción, como forma de terminación del proceso, supone:", "opciones": [{"texto": "Un acuerdo con concesiones recíprocas de las partes.", "justificacion": "Correcta. Las partes terminan el litigio mediante concesiones mutuas; el juez la autoriza si es válida (art. 235 COGEP)."}, {"texto": "Una sentencia impuesta por el juzgador.", "justificacion": "Incorrecta. Es un acuerdo, no una imposición."}, {"texto": "Una declaración unilateral del demandado.", "justificacion": "Incorrecta. Requiere el acuerdo de ambas partes."}, {"texto": "Una sanción por la rebeldía del demandado.", "justificacion": "Incorrecta. No es una sanción."}], "correcta": 0, "referencias": ["COGEP"]}, {"id": "DPG-47", "area": 3, "dificultad": 2, "subarea": "Derecho Procesal General", "tema": "Falta de contestación", "resultado": "Determina los efectos de la falta de contestación.", "demanda": "Comprender", "enunciado": "Si el demandado no contesta la demanda, según el COGEP:", "opciones": [{"texto": "El proceso continúa y su silencio se tiene como negativa.", "justificacion": "Correcta. La falta de contestación se considera negativa de los fundamentos de la demanda, salvo que la ley disponga otro efecto (art. 157 COGEP); la inasistencia del demandado hace que la audiencia continúe en su rebeldía (art. 87 COGEP)."}, {"texto": "El actor gana automáticamente el proceso, sin necesidad de probar nada.", "justificacion": "Incorrecta. El actor sigue obligado a probar."}, {"texto": "Se anula la demanda presentada.", "justificacion": "Incorrecta. La demanda subsiste."}, {"texto": "Se suspende indefinidamente el trámite.", "justificacion": "Incorrecta. El proceso continúa."}], "correcta": 0, "referencias": ["COGEP"]}, {"id": "DPG-48", "area": 3, "dificultad": 1, "subarea": "Derecho Procesal General", "tema": "Recursos", "resultado": "Identifica la finalidad de los recursos.", "demanda": "Comprender", "enunciado": "El recurso, como institución procesal, tiene por finalidad:", "opciones": [{"texto": "Permitir revisar o corregir decisiones dentro de límites legales.", "justificacion": "Correcta. El COGEP prevé recursos horizontales y verticales (aclaración, ampliación, reforma, revocatoria, apelación, casación y de hecho, art. 251)."}, {"texto": "Reabrir el debate de la causa indefinidamente, sin plazos ni reglas fijas.", "justificacion": "Incorrecta. Los recursos tienen plazos y requisitos."}, {"texto": "Sustituir la motivación de la decisión judicial.", "justificacion": "Incorrecta. La motivación es obligatoria."}, {"texto": "Eliminar la firmeza de todas las sentencias.", "justificacion": "Incorrecta. Las sentencias quedan firmes al agotarse los recursos."}], "correcta": 0, "referencias": ["COGEP"]}, {"id": "DPG-49", "area": 3, "dificultad": 1, "subarea": "Derecho Procesal General", "tema": "Doble instancia", "resultado": "Comprende la garantía de doble instancia.", "demanda": "Comprender", "enunciado": "La doble instancia se justifica principalmente por:", "opciones": [{"texto": "Permitir que un superior revise y corrija errores.", "justificacion": "Correcta. La Constitución garantiza recurrir el fallo en todos los procedimientos en que se decida sobre derechos (art. 76 num. 7 lit. m CRE); la apelación procede contra sentencias de primera instancia (art. 256 COGEP)."}, {"texto": "Garantizar que el superior siempre modifique la sentencia recurrida.", "justificacion": "Incorrecta. El superior puede confirmarla."}, {"texto": "Evitar toda audiencia oral en segunda instancia.", "justificacion": "Incorrecta. La segunda instancia también es oral."}, {"texto": "Impedir los acuerdos entre las partes.", "justificacion": "Incorrecta. No guarda relación."}], "correcta": 0, "referencias": ["CRE", "COGEP"]}, {"id": "DPG-50", "area": 3, "dificultad": 1, "subarea": "Derecho Procesal General", "tema": "Cosa juzgada", "resultado": "Identifica los efectos de la cosa juzgada.", "demanda": "Recordar", "enunciado": "La cosa juzgada se caracteriza por:", "opciones": [{"texto": "La inmutabilidad de lo decidido una vez firme.", "justificacion": "Correcta. Las sentencias ejecutoriadas surten efecto irrevocable respecto de las partes (arts. 99 y 101 COGEP)."}, {"texto": "Permitir reabrir el caso por simple inconformidad.", "justificacion": "Incorrecta. Es lo contrario de la cosa juzgada."}, {"texto": "La suspensión automática de la sentencia.", "justificacion": "Incorrecta. La sentencia firme se cumple."}, {"texto": "La ausencia total de motivación del fallo.", "justificacion": "Incorrecta. No guarda relación."}], "correcta": 0, "referencias": ["COGEP"]}, {"id": "DPG-51", "area": 3, "dificultad": 1, "subarea": "Derecho Procesal General", "tema": "Ejecución", "resultado": "Identifica la finalidad de la ejecución.", "demanda": "Comprender", "enunciado": "La ejecución de una decisión judicial se orienta a:", "opciones": [{"texto": "Hacer cumplir lo resuelto, incluso de forma forzosa.", "justificacion": "Correcta. La sentencia ejecutoriada es título de ejecución (art. 363 COGEP) y su cumplimiento puede exigirse coactivamente."}, {"texto": "Revisar nuevamente la prueba practicada en juicio.", "justificacion": "Incorrecta. La prueba ya no se discute."}, {"texto": "Negociar otra vez la pretensión de la demanda.", "justificacion": "Incorrecta. Lo resuelto ya es obligatorio."}, {"texto": "Declarar la incompetencia del juez de ejecución.", "justificacion": "Incorrecta. No es su finalidad."}], "correcta": 0, "referencias": ["COGEP"]}, {"id": "DPG-52", "area": 3, "dificultad": 1, "subarea": "Derecho Procesal General", "tema": "Economía procesal", "resultado": "Identifica el principio de economía procesal.", "demanda": "Comprender", "enunciado": "El principio de economía procesal busca:", "opciones": [{"texto": "Evitar actuaciones innecesarias sin sacrificar garantías.", "justificacion": "Correcta. El sistema procesal debe ser eficaz y ágil, sin sacrificar la justicia por la sola omisión de formalidades (art. 169 CRE)."}, {"texto": "Reducir el derecho de defensa de las partes para acelerar el proceso.", "justificacion": "Incorrecta. Las garantías no se sacrifican."}, {"texto": "Eliminar toda la prueba del proceso.", "justificacion": "Incorrecta. La prueba sigue siendo necesaria."}, {"texto": "Impedir la intervención de terceros.", "justificacion": "Incorrecta. No guarda relación."}], "correcta": 0, "referencias": ["CRE"]}, {"id": "DPG-53", "area": 3, "dificultad": 1, "subarea": "Derecho Procesal General", "tema": "Tutela judicial efectiva", "resultado": "Comprende el contenido de la tutela judicial efectiva.", "demanda": "Comprender", "enunciado": "La tutela judicial efectiva exige que el sistema procesal:", "opciones": [{"texto": "Garantice acceso, decisión motivada y cumplimiento.", "justificacion": "Correcta. Toda persona tiene derecho al acceso gratuito a la justicia y a la tutela efectiva, imparcial y expedita de sus derechos (art. 75 CRE)."}, {"texto": "Asegure siempre un resultado favorable a quien presenta la demanda.", "justificacion": "Incorrecta. No garantiza un resultado."}, {"texto": "Permita dictar decisiones secretas.", "justificacion": "Incorrecta. Rige la publicidad."}, {"texto": "Prohíba la asistencia de un abogado.", "justificacion": "Incorrecta. La defensa técnica es un derecho."}], "correcta": 0, "referencias": ["CRE"]}]}, {"id": "pack-004", "bibliografia": {"ATALA": "Corte Interamericana de Derechos Humanos. (2012). Caso Atala Riffo y niñas vs. Chile (Serie C No. 239). https://www.corteidh.or.cr/docs/casos/articulos/seriec_239_esp.pdf", "CC": "Congreso Nacional del Ecuador. (2005). Código Civil (Codificación 2005-010). Registro Oficial Suplemento 46, 24 de junio de 2005. Texto vigente con sus reformas, entre ellas la Ley Reformatoria de 2015 (R.O. 526-2S, 19 de junio de 2015); última actualización: Segundo Suplemento del R.O. 61, 17 de junio de 2025. https://www.gob.ec/regulaciones/codigo-civil-codificacion-no-2005-010", "CCE2815": "Corte Constitucional del Ecuador. (2021). Sentencia No. 28-15-IN/21 (preferencia materna en la tenencia). https://www.corteconstitucional.gob.ec/", "COA": "Asamblea Nacional del Ecuador. (2017). Código Orgánico Administrativo. Registro Oficial Segundo Suplemento 31, 7 de julio de 2017. Última reforma: 13 de octubre de 2025. https://lotaip.bomberosquito.gob.ec/transparencia/2026/archivos/coa26.pdf", "COFJ": "Asamblea Nacional del Ecuador. (2009). Código Orgánico de la Función Judicial. Registro Oficial Suplemento 544, 9 de marzo de 2009. Reformado, entre otras, por la Ley Orgánica Reformatoria de Varios Cuerpos Legales para la Agilización de la Adopción (R.O. 347, 14 de agosto de 2026). https://www.funcionjudicial.gob.ec/", "COGEP": "Asamblea Nacional del Ecuador. (2015). Código Orgánico General de Procesos. Registro Oficial Suplemento 506, 22 de mayo de 2015. Reformado, entre otras, por la Ley Orgánica Reformatoria del COGEP (R.O. Suplemento 517, 26 de junio de 2019); última reforma consultada: Cuarto Suplemento del R.O. 140, 7 de octubre de 2025. https://portal.compraspublicas.gob.ec/sercop/wp-content/uploads/2025/11/CODIGO-ORGANICO-GENERAL-DE-PROCESOS-COGEP.pdf", "CONA": "Congreso Nacional del Ecuador. (2003). Código de la Niñez y Adolescencia (Ley 100). Registro Oficial 737, 3 de enero de 2003. Última reforma: Ley Orgánica Reformatoria de Varios Cuerpos Legales para la Agilización de la Adopción, R.O. 347, 14 de agosto de 2026. https://www.registroficial.gob.ec/", "CRE": "Asamblea Constituyente del Ecuador. (2008). Constitución de la República del Ecuador. Registro Oficial 449, 20 de octubre de 2008 (con las enmiendas posteriores, incluidas las aprobadas en el referéndum de 2024). https://www.asambleanacional.gob.ec/"}, "preguntas": [{"id": "UTE-ADM-01", "area": 1, "dificultad": 4, "subarea": "Derecho Administrativo", "tema": "Actos de simple administración", "resultado": "Resuelve el caso aplicando actos de simple administración.", "demanda": "Aplicar", "enunciado": "En un trámite de licencia, una dirección técnica emite un informe desfavorable no vinculante. Antes de la resolución final, el solicitante apela el informe. ¿Qué debe hacer la entidad?", "opciones": [{"texto": "Inadmitir el recurso: el informe es un acto de simple administración.", "justificacion": "Correcta. Los informes no vinculantes son actos de simple administración que no producen efectos jurídicos directos; no se impugnan de forma autónoma, sino junto con el acto administrativo que resuelva el procedimiento (Código Orgánico Administrativo)."}, {"texto": "Tramitarlo, porque el informe ya afecta derechos subjetivos del solicitante.", "justificacion": "Incorrecta. Un informe no vinculante no decide la situación jurídica del administrado."}, {"texto": "Inadmitirlo, porque los informes solo se cuestionan por lesividad.", "justificacion": "Incorrecta. La lesividad es la vía de la propia administración para impugnar sus actos favorables, no la del administrado."}, {"texto": "Tramitarlo como recurso extraordinario de revisión.", "justificacion": "Incorrecta. La revisión procede contra actos firmes y por causales tasadas."}], "correcta": 0, "referencias": ["COA"]}, {"id": "UTE-ADM-02", "area": 1, "dificultad": 5, "subarea": "Derecho Administrativo", "tema": "Conflictos de competencia entre GAD", "resultado": "Resuelve el caso aplicando conflictos de competencia entre gad.", "demanda": "Analizar", "enunciado": "El GAD municipal de X y el GAD provincial de Y reclaman, ambos, la competencia sobre el mantenimiento de una vía rural. ¿Quién resuelve el conflicto?", "opciones": [{"texto": "El Consejo Nacional de Competencias o la Corte Constitucional.", "justificacion": "Correcta. Los conflictos de competencia entre gobiernos autónomos descentralizados se resuelven en sede administrativa por el Consejo Nacional de Competencias, y corresponde a la Corte Constitucional dirimir conflictos de competencias o atribuciones (art. 436 num. 7 CRE)."}, {"texto": "El superior jerárquico común de ambos GAD, según el COA.", "justificacion": "Incorrecta. Los GAD gozan de autonomía y no tienen un superior jerárquico común."}, {"texto": "Un juez de lo civil, en el término de diez días.", "justificacion": "Incorrecta. No es un conflicto de competencia judicial."}, {"texto": "El presidente de la República, por el principio de jerarquía administrativa.", "justificacion": "Incorrecta. La autonomía de los GAD excluye esa jerarquía."}], "correcta": 0, "referencias": ["CRE", "COA"]}, {"id": "UTE-ADM-03", "area": 1, "dificultad": 4, "subarea": "Derecho Administrativo", "tema": "Delegación de competencias", "resultado": "Resuelve el caso aplicando delegación de competencias.", "demanda": "Aplicar", "enunciado": "El 2 de marzo se posesiona un nuevo ministro. La coordinadora jurídica tenía una delegación del ministro anterior sin plazo, y el 10 de marzo dicta un acto con base en ella sin haber informado a la nueva autoridad. ¿Qué afirmación es correcta?", "opciones": [{"texto": "La delegación subsiste; la delegada debía informar a la nueva autoridad.", "justificacion": "Correcta. Según las reglas de transferencia de la competencia del COA, el cambio del titular del órgano delegante no extingue la delegación; la delegada debe informar a la nueva autoridad en el término de tres días."}, {"texto": "La delegación subsiste solo si el nuevo ministro la ratifica.", "justificacion": "Incorrecta. La ley no exige ratificación expresa para que subsista."}, {"texto": "La delegación se extinguió; el acto es nulo por incompetencia.", "justificacion": "Incorrecta. El cambio de autoridad no extingue la delegación."}, {"texto": "La delegación se transforma en avocación del nuevo ministro.", "justificacion": "Incorrecta. La avocación es una figura distinta, que requiere decisión expresa del superior."}], "correcta": 0, "referencias": ["COA"]}, {"id": "UTE-ADM-04", "area": 1, "dificultad": 5, "subarea": "Derecho Administrativo", "tema": "Efectos de la nulidad", "resultado": "Resuelve el caso aplicando efectos de la nulidad.", "demanda": "Evaluar", "enunciado": "Un Tribunal Contencioso Administrativo declara nula la destitución de un servidor, ocurrida en 2023, por haberla dictado un órgano incompetente por materia. ¿Qué efecto tiene la declaración sobre sus remuneraciones?", "opciones": [{"texto": "Efecto retroactivo: proceden las remuneraciones dejadas de percibir.", "justificacion": "Correcta. La declaración de nulidad tiene efecto retroactivo desde la expedición del acto, por lo que el servidor debe ser restituido en sus derechos, incluidas las remuneraciones dejadas de percibir (criterio aplicado en el caso Duarte Estévez trabajado en clase)."}, {"texto": "Solo produce efectos desde la sentencia, con efecto ex nunc.", "justificacion": "Incorrecta. La nulidad opera desde el origen del acto."}, {"texto": "Ninguno: la reparación de los sueldos exige una acción de daños por separado.", "justificacion": "Incorrecta. La restitución es consecuencia directa de la nulidad."}, {"texto": "Efecto retroactivo, pero solo si el servidor era de carrera.", "justificacion": "Incorrecta. La retroactividad no depende del tipo de nombramiento."}], "correcta": 0, "referencias": ["COA"]}, {"id": "UTE-ADM-05", "area": 1, "dificultad": 4, "subarea": "Derecho Administrativo", "tema": "Confianza legítima y fraude", "resultado": "Resuelve el caso aplicando confianza legítima y fraude.", "demanda": "Evaluar", "enunciado": "Un administrado obtuvo una licencia profesional presentando un título falso. Años después la entidad lo descubre, y él invoca la confianza legítima y la doctrina de los actos propios. ¿Qué afirmación es correcta?", "opciones": [{"texto": "Esos principios no amparan lo obtenido mediante fraude; cabe la nulidad.", "justificacion": "Correcta. La confianza legítima y la seguridad jurídica (art. 22 COA) protegen expectativas legítimas, no situaciones creadas con fraude; la entidad puede declarar la nulidad por los mecanismos del ordenamiento."}, {"texto": "La confianza legítima impide declarar la nulidad del acto.", "justificacion": "Incorrecta. No hay confianza legítima cuando el beneficiario provocó el vicio con fraude."}, {"texto": "Basta convalidar el acto con un título auténtico que obtenga después el administrado.", "justificacion": "Incorrecta. Un vicio originado en fraude no se convalida a posteriori."}, {"texto": "Solo cabe la lesividad, porque se trata de un acto favorable.", "justificacion": "Incorrecta. El ordenamiento prevé otros mecanismos frente a actos nulos."}], "correcta": 0, "referencias": ["COA"]}, {"id": "UTE-ADM-06", "area": 1, "dificultad": 4, "subarea": "Derecho Administrativo", "tema": "Ejecución de actos nulos", "resultado": "Resuelve el caso aplicando ejecución de actos nulos.", "demanda": "Aplicar", "enunciado": "Un jefe de unidad recibe la orden de ejecutar la demolición de un inmueble particular, dispuesta por un órgano manifiestamente incompetente por materia. ¿Qué debe hacer?", "opciones": [{"texto": "Oponerse motivadamente, porque nadie está obligado a cumplir un acto nulo.", "justificacion": "Correcta. La presunción de legitimidad cede ante la nulidad manifiesta por incompetencia material (art. 105 COA); el servidor debe dejar constancia motivada de su oposición."}, {"texto": "Ejecutarla, por la presunción de legitimidad del acto administrativo.", "justificacion": "Incorrecta. La presunción no ampara actos manifiestamente nulos."}, {"texto": "Ejecutarla e informar después al superior, según la normativa interna.", "justificacion": "Incorrecta. Ejecutar un acto nulo compromete su responsabilidad."}, {"texto": "Abstenerse de ejecutarla sin dejar constancia alguna.", "justificacion": "Incorrecta. La oposición debe ser motivada y documentada."}], "correcta": 0, "referencias": ["COA"]}, {"id": "UTE-ADM-07", "area": 1, "dificultad": 5, "subarea": "Derecho Administrativo", "tema": "Nulidad por actuación extemporánea", "resultado": "Resuelve el caso aplicando nulidad por actuación extemporánea.", "demanda": "Analizar", "enunciado": "Cuatro actos se dictaron fuera del tiempo previsto para ejercer la competencia. ¿Cuál es nulo según el art. 105 num. 4 del COA?", "opciones": [{"texto": "Una sanción impuesta después de vencido el término para resolver.", "justificacion": "Correcta. El COA sanciona con nulidad el acto dictado fuera del tiempo para ejercer la competencia cuando esa extemporaneidad lesiona derechos, como ocurre con una sanción dictada tras caducar el procedimiento sancionador."}, {"texto": "Una respuesta tardía que confirma lo ya concedido por silencio positivo.", "justificacion": "Incorrecta. No afecta derechos: ratifica lo ya obtenido."}, {"texto": "Una autorización de funcionamiento concedida días después del término.", "justificacion": "Incorrecta. La demora no perjudica al administrado."}, {"texto": "Una licencia otorgada tarde que beneficia al solicitante.", "justificacion": "Incorrecta. No lesiona derechos del solicitante ni de terceros."}], "correcta": 0, "referencias": ["COA"]}, {"id": "UTE-ADM-08", "area": 1, "dificultad": 5, "subarea": "Derecho Administrativo", "tema": "Vicios subsanables", "resultado": "Resuelve el caso aplicando vicios subsanables.", "demanda": "Evaluar", "enunciado": "En 2023 una universidad pública otorgó nombramiento definitivo a una profesora tras un concurso. En 2026 el nuevo rector advierte que un miembro del tribunal no tenía el grado exigido, aunque las calificaciones habrían sido las mismas. ¿Cómo se califica ese vicio?", "opciones": [{"texto": "Es subsanable: no tuvo trascendencia y no encaja en el art. 105 del COA.", "justificacion": "Correcta. Solo son nulos los actos incursos en las causales taxativas del art. 105 COA; una irregularidad sin incidencia en el resultado es un vicio subsanable."}, {"texto": "Es nulidad de pleno derecho por incompetencia del tribunal.", "justificacion": "Incorrecta. La conformación irregular no equivale a incompetencia del órgano que dictó el acto."}, {"texto": "Es nulidad, porque todo vicio de procedimiento en un concurso público es grave.", "justificacion": "Incorrecta. Rige el principio de trascendencia."}, {"texto": "No es un vicio, porque el tribunal es solo un órgano auxiliar.", "justificacion": "Incorrecta. Sí hay irregularidad, aunque subsanable."}], "correcta": 0, "referencias": ["COA"]}, {"id": "UTE-ADM-09", "area": 1, "dificultad": 4, "subarea": "Derecho Administrativo", "tema": "Validez y eficacia", "resultado": "Resuelve el caso aplicando validez y eficacia.", "demanda": "Analizar", "enunciado": "Un municipio clausura un local con base en una resolución sancionadora válida que nunca fue notificada al propietario. ¿Qué afirmación es correcta?", "opciones": [{"texto": "La resolución era válida pero no eficaz; ejecutarla sin notificar es falta.", "justificacion": "Correcta. El acto es eficaz solo una vez notificado (art. 101 COA); su ejecución sin notificación es ilegítima y genera responsabilidad de los servidores."}, {"texto": "La clausura es válida: el acto se presume legítimo y ejecutorio desde su expedición.", "justificacion": "Incorrecta. La ejecutoriedad exige eficacia, que nace de la notificación."}, {"texto": "La clausura es válida si la resolución se publica después en la web.", "justificacion": "Incorrecta. La publicación posterior no subsana la falta de notificación."}, {"texto": "La resolución es nula por contrariar la Constitución.", "justificacion": "Incorrecta. La resolución es válida; el problema está en su eficacia."}], "correcta": 0, "referencias": ["COA", "CRE"]}, {"id": "UTE-ADM-10", "area": 1, "dificultad": 4, "subarea": "Derecho Administrativo", "tema": "Convalidación", "resultado": "Resuelve el caso aplicando convalidación.", "demanda": "Aplicar", "enunciado": "Un contribuyente recibe una resolución con un defecto subsanable en la identificación del expediente. Apela discutiendo solo el monto, sin alegar ese defecto. ¿Qué sucede con el defecto?", "opciones": [{"texto": "Quedó convalidado por preclusión al recurrir sin alegarlo.", "justificacion": "Correcta. Los vicios subsanables se convalidan cuando el interesado, pudiendo alegarlos, actúa en el procedimiento sin hacerlo (reglas de nulidad y convalidación del COA)."}, {"texto": "Puede alegarse después ante el tribunal contencioso sin restricción.", "justificacion": "Incorrecta. La oportunidad para alegarlo precluyó."}, {"texto": "Vuelve inadmisible el recurso de apelación presentado.", "justificacion": "Incorrecta. El defecto no afecta la admisibilidad del recurso."}, {"texto": "Subsiste hasta que el órgano lo convalide expresamente.", "justificacion": "Incorrecta. La convalidación operó por la conducta del interesado."}], "correcta": 0, "referencias": ["COA"]}, {"id": "UTE-CIV-01", "area": 4, "dificultad": 4, "subarea": "Personas y Familia", "tema": "Sociedad conyugal y separación de hecho", "resultado": "Resuelve el caso aplicando sociedad conyugal y separación de hecho.", "demanda": "Aplicar", "enunciado": "Mónica y Rafael se separaron de hecho en 2022 sin demandar divorcio ni disolución. Desde entonces Rafael ahorró USD 15.000 de su sueldo en una cuenta a su nombre. ¿Cómo se clasifica ese ahorro en la liquidación?", "opciones": [{"texto": "Como haber social, porque la separación de hecho no disuelve la sociedad.", "justificacion": "Correcta. El art. 189 CC enumera taxativamente las causas de disolución y no incluye la separación de hecho; mientras la sociedad subsiste, los salarios devengados forman parte del haber social (art. 157 num. 1 CC)."}, {"texto": "Como bien propio de Rafael, porque se formó tras la separación de hecho.", "justificacion": "Incorrecta. La separación de hecho no es causa de disolución."}, {"texto": "Como haber social, pero solo lo ahorrado durante el primer año de separación.", "justificacion": "Incorrecta. La ley no establece ese límite temporal."}, {"texto": "Como bien propio de Rafael, porque la cuenta está a su nombre.", "justificacion": "Incorrecta. La titularidad formal no determina la naturaleza del bien."}], "correcta": 0, "referencias": ["CC"]}, {"id": "UTE-CIV-02", "area": 4, "dificultad": 4, "subarea": "Personas y Familia", "tema": "Conmoriencia", "resultado": "Resuelve el caso aplicando conmoriencia.", "demanda": "Aplicar", "enunciado": "Rafael, de setenta años, y Elsa, de cuarenta y cinco, casados y sin descendientes, mueren en el derrumbe de su vivienda sin que se pueda establecer quién murió primero. ¿Cómo se defieren sus sucesiones?", "opciones": [{"texto": "Ninguno hereda al otro; cada herencia pasa a sus propios herederos.", "justificacion": "Correcta. El art. 65 CC dispone que, si no puede saberse el orden de los fallecimientos, se procede como si todos hubiesen perecido en un mismo momento; no hay sucesión recíproca."}, {"texto": "Elsa hereda a Rafael, porque se presume que muere primero la persona mayor.", "justificacion": "Incorrecta. El Código Civil ecuatoriano no establece presunciones por edad."}, {"texto": "Se suspenden hasta que el juez determine el orden más probable de muerte.", "justificacion": "Incorrecta. La ley resuelve el caso con la conmoriencia."}, {"texto": "Ambas sucesiones se unen y se reparten por mitades entre las dos familias.", "justificacion": "Incorrecta. Las sucesiones son independientes."}], "correcta": 0, "referencias": ["CC"]}, {"id": "UTE-CIV-03", "area": 4, "dificultad": 5, "subarea": "Personas y Familia", "tema": "Quinta parte de los bienes del cónyuge", "resultado": "Resuelve el caso aplicando quinta parte de los bienes del cónyuge.", "demanda": "Aplicar", "enunciado": "Martha, sin ingresos propios, no dio causa para el divorcio que demandó su cónyuge. En la liquidación le corresponden USD 15.000 de gananciales, y la quinta parte de los bienes de él asciende a USD 40.000. ¿Cuánto debe recibir por la quinta parte?", "opciones": [{"texto": "USD 25.000, que completan la quinta parte considerando sus gananciales.", "justificacion": "Correcta. El art. 112 CC concede la quinta parte de los bienes del otro al cónyuge que carece de lo necesario y no dio causa para el divorcio, imputando a ella lo que reciba por gananciales: 40.000 − 15.000."}, {"texto": "USD 40.000, que se suman íntegros a los gananciales que le corresponden.", "justificacion": "Incorrecta. Los gananciales se imputan a la quinta parte."}, {"texto": "USD 0, porque los gananciales recibidos excluyen ese derecho.", "justificacion": "Incorrecta. Los gananciales no lo excluyen; solo se descuentan."}, {"texto": "USD 20.000, que equivalen a la mitad de la quinta parte.", "justificacion": "Incorrecta. La ley no reduce la quinta parte a la mitad."}], "correcta": 0, "referencias": ["CC"]}, {"id": "UTE-CIV-04", "area": 4, "dificultad": 4, "subarea": "Personas y Familia", "tema": "Incapacidad absoluta", "resultado": "Resuelve el caso aplicando incapacidad absoluta.", "demanda": "Aplicar", "enunciado": "Emilia, de once años, compra en línea una consola por USD 480 con la tarjeta de su progenitora y acepta los términos del sitio. ¿Qué consecuencia corresponde al contrato?", "opciones": [{"texto": "Nulidad absoluta, sin que produzca siquiera obligaciones naturales.", "justificacion": "Correcta. Es impúber la niña hasta los doce años (art. 21 CC) y los impúberes son absolutamente incapaces (art. 1463 CC); sus actos no producen ni aun obligaciones naturales."}, {"texto": "Nulidad relativa, que su representante legal puede sanear ratificándolo.", "justificacion": "Incorrecta. La incapacidad del impúber es absoluta, no relativa."}, {"texto": "Inexistencia, porque falta el consentimiento de su representante.", "justificacion": "Incorrecta. El Código Civil sanciona el caso con nulidad absoluta."}, {"texto": "Validez, por tratarse de un acto ordinario de consumo.", "justificacion": "Incorrecta. La autonomía progresiva no suple la incapacidad absoluta."}], "correcta": 0, "referencias": ["CC"]}, {"id": "UTE-CIV-05", "area": 4, "dificultad": 5, "subarea": "Personas y Familia", "tema": "Rescisión por incapacidad", "resultado": "Resuelve el caso aplicando rescisión por incapacidad.", "demanda": "Analizar", "enunciado": "Valentina nació el 10 de marzo de 2011. El 5 de mayo de 2026 firmó, sin conocimiento de sus progenitores, un contrato de representación artística por dos años. ¿Hasta cuándo puede ella pedir la rescisión?", "opciones": [{"texto": "Hasta el 10 de marzo de 2033, cuatro años después de su mayoría de edad.", "justificacion": "Correcta. El art. 1708 CC fija en cuatro años el plazo de la rescisión y, cuando la nulidad proviene de una incapacidad, lo cuenta desde que esta cesó: cumple 18 años el 10 de marzo de 2029."}, {"texto": "Hasta el 5 de mayo de 2028, cuando vence el plazo de dos años pactado en el contrato.", "justificacion": "Incorrecta. El plazo de la acción no depende de la duración del contrato."}, {"texto": "Hasta el 5 de mayo de 2030, cuatro años después de la firma.", "justificacion": "Incorrecta. En la incapacidad, el cuatrienio corre desde que cesa."}, {"texto": "Hasta el 5 de mayo de 2041, quince años después de la firma.", "justificacion": "Incorrecta. Quince años corresponde a la nulidad absoluta."}], "correcta": 0, "referencias": ["CC"]}, {"id": "UTE-CIV-06", "area": 4, "dificultad": 4, "subarea": "Personas y Familia", "tema": "Unión de hecho", "resultado": "Resuelve el caso aplicando unión de hecho.", "demanda": "Aplicar", "enunciado": "Lucía, casada con Esteban desde 2012 y separada de hecho desde 2021, convive desde 2023 con Daniel. Ambos acuden a una notaría para formalizar su unión de hecho. ¿Qué corresponde?", "opciones": [{"texto": "Negarla, porque ambos deben estar libres de vínculo matrimonial.", "justificacion": "Correcta. El art. 222 CC exige una unión estable y monogámica entre personas libres de vínculo matrimonial; mientras Lucía no se divorcie, la unión no puede formalizarse."}, {"texto": "Admitirla, siempre que Esteban la consienta ante la notaría.", "justificacion": "Incorrecta. El consentimiento del cónyuge no suple el impedimento."}, {"texto": "Admitirla, pero sin sociedad de bienes mientras subsista el matrimonio.", "justificacion": "Incorrecta. La unión no puede formalizarse en absoluto."}, {"texto": "Admitirla, porque la separación de hecho supera los dos años.", "justificacion": "Incorrecta. La separación de hecho no disuelve el vínculo matrimonial."}], "correcta": 0, "referencias": ["CC", "CRE"]}, {"id": "UTE-CIV-07", "area": 4, "dificultad": 3, "subarea": "Personas y Familia", "tema": "Competencia en el divorcio", "resultado": "Resuelve el caso aplicando competencia en el divorcio.", "demanda": "Aplicar", "enunciado": "Marcela y Tomás se casaron en Loja y vivieron en Cuenca hasta 2023, cuando Tomás se trasladó a Machala, donde vive y administra su empresa. Marcela, que vive en Cuenca, quiere demandar el divorcio. ¿Ante quién debe hacerlo?", "opciones": [{"texto": "Ante la jueza o el juez de familia de Machala, domicilio del demandado.", "justificacion": "Correcta. Rige la regla general de competencia territorial del domicilio del demandado (art. 9 COGEP); el último domicilio común en el Ecuador solo se considera cuando el demandado está en el extranjero (art. 117 CC)."}, {"texto": "Ante la jueza o el juez de familia de Cuenca, domicilio de la demandante.", "justificacion": "Incorrecta. El domicilio del actor no determina la competencia general."}, {"texto": "Ante la jueza o el juez de familia de Cuenca, último domicilio común.", "justificacion": "Incorrecta. Ese criterio aplica solo si el demandado reside en el extranjero."}, {"texto": "Ante la jueza o el juez de familia de Loja, donde se celebró el matrimonio.", "justificacion": "Incorrecta. El lugar de celebración no fija la competencia."}], "correcta": 0, "referencias": ["COGEP", "CC"]}, {"id": "UTE-CIV-08", "area": 4, "dificultad": 5, "subarea": "Personas y Familia", "tema": "Subrogación real", "resultado": "Resuelve el caso aplicando subrogación real.", "demanda": "Analizar", "enunciado": "En 2018 Nina heredó un local. En 2020, casada sin capitulaciones, lo vendió y con ese dinero compró un departamento a su nombre, sin expresar en las escrituras el ánimo de subrogar. ¿Cómo se trata el departamento en la liquidación?", "opciones": [{"texto": "Como haber social, con recompensa a favor de Nina por el precio del local.", "justificacion": "Correcta. El art. 165 CC exige, para la subrogación, que en ambas escrituras se exprese el ánimo de subrogar; sin ello el inmueble ingresa al haber social y Nina tiene derecho a recompensa."}, {"texto": "Como bien propio de Nina, porque proviene del precio de un bien heredado.", "justificacion": "Incorrecta. Sin las formalidades de la subrogación, no conserva el carácter de propio."}, {"texto": "Como bien propio, porque la subrogación opera aunque no se exprese.", "justificacion": "Incorrecta. La ley exige expresar el ánimo de subrogar."}, {"texto": "Como copropiedad ordinaria entre los cónyuges, por partes iguales.", "justificacion": "Incorrecta. Se rige por las reglas de la sociedad conyugal."}], "correcta": 0, "referencias": ["CC"]}, {"id": "UTE-CIV-09", "area": 4, "dificultad": 5, "subarea": "Personas y Familia", "tema": "Nulidad del matrimonio por edad", "resultado": "Resuelve el caso aplicando nulidad del matrimonio por edad.", "demanda": "Analizar", "enunciado": "Por un error de verificación, Karina se casó el 10 de marzo de 2024 con diecisiete años. En octubre de 2026, su cónyuge demanda la nulidad del matrimonio por la edad que ella tenía. ¿Qué corresponde?", "opciones": [{"texto": "Rechazarla, porque prescribió al cumplirse dos años desde la celebración.", "justificacion": "Correcta. El art. 95 num. 2 CC declara nulo el matrimonio de menores de dieciocho años, pero el art. 99 CC fija un plazo de dos años para demandar esa nulidad."}, {"texto": "Aceptarla, porque la nulidad por la edad del contrayente es imprescriptible.", "justificacion": "Incorrecta. La ley fija un plazo para esa acción."}, {"texto": "Rechazarla, porque solo la cónyuge menor de edad puede plantearla.", "justificacion": "Incorrecta. El fundamento del rechazo es la prescripción."}, {"texto": "Aceptarla, porque el cónyuge mayor de edad conocía la edad de ella.", "justificacion": "Incorrecta. Conocer la edad no altera el plazo de la acción."}], "correcta": 0, "referencias": ["CC"]}, {"id": "UTE-CIV-10", "area": 4, "dificultad": 4, "subarea": "Personas y Familia", "tema": "Tenencia y no discriminación", "resultado": "Resuelve el caso aplicando tenencia y no discriminación.", "demanda": "Evaluar", "enunciado": "Sandra vive con sus hijos y su pareja, Daniela. El progenitor pide la tenencia alegando que esa convivencia «confunde a los niños». Los informes técnicos no registran afectación alguna. ¿Cómo debe valorarse ese argumento?", "opciones": [{"texto": "Rechazarlo: la orientación sexual no justifica limitar derechos sin daño probado.", "justificacion": "Correcta. La Corte Interamericana (caso Atala Riffo y niñas vs. Chile) estableció que la orientación sexual es una categoría protegida por la Convención Americana y no puede fundar restricciones sin un daño concreto probado; rige también el art. 11 num. 2 CRE."}, {"texto": "Valorarlo como factor de riesgo y ordenar una evaluación psicológica previa del entorno.", "justificacion": "Incorrecta. Sería un trato discriminatorio sin base probatoria."}, {"texto": "Rechazarlo solo si la pareja de Sandra no participa en la crianza.", "justificacion": "Incorrecta. La participación de la pareja no es un criterio legítimo de exclusión."}, {"texto": "Aceptarlo, porque prima el modelo de familia tradicional.", "justificacion": "Incorrecta. La Constitución reconoce la familia en sus diversos tipos (art. 67 CRE)."}], "correcta": 0, "referencias": ["ATALA", "CRE"]}, {"id": "UTE-CIV-11", "area": 4, "dificultad": 5, "subarea": "Personas y Familia", "tema": "Existencia legal y transmisión", "resultado": "Resuelve el caso aplicando existencia legal y transmisión.", "demanda": "Analizar", "enunciado": "Luis muere sin testamento cuando su cónyuge tenía siete meses de embarazo. El hijo nace, se separa completamente de su madre, respira y fallece dos horas después. ¿Qué pasa con sus derechos hereditarios en la sucesión de Luis?", "opciones": [{"texto": "Los adquirió al nacer con vida y se transmiten a los herederos del niño.", "justificacion": "Correcta. La existencia legal principia al nacer (art. 60 CC); los derechos que estaban en suspenso se adquieren si el nacimiento constituye un principio de existencia (art. 63 CC) y, al morir, se transmiten a sus herederos."}, {"texto": "Pasan a los demás herederos de Luis, como si el niño no hubiese existido.", "justificacion": "Incorrecta. Eso solo ocurre si no llega a nacer con vida."}, {"texto": "Quedan suspensos hasta que el juez declare que el niño era viable.", "justificacion": "Incorrecta. El Código Civil no exige viabilidad."}, {"texto": "Se extinguen y la cuota acrece a la cónyuge sobreviviente.", "justificacion": "Incorrecta. Los derechos ya fueron adquiridos por el niño."}], "correcta": 0, "referencias": ["CC"]}, {"id": "UTE-CIV-12", "area": 4, "dificultad": 4, "subarea": "Personas y Familia", "tema": "Causales de divorcio", "resultado": "Resuelve el caso aplicando causales de divorcio.", "demanda": "Analizar", "enunciado": "Rosa salió del hogar con sus hijos en marzo de 2025 tras ser agredida por su cónyuge, hecho acreditado. En octubre de 2026 él demanda el divorcio por abandono. ¿Qué corresponde respecto de esa causal?", "opciones": [{"texto": "Desestimarla: la causal exige abandono injustificado y aquí hubo violencia.", "justificacion": "Correcta. El art. 110 num. 9 CC exige abandono injustificado por más de seis meses; la salida motivada por violencia está justificada y, además, configura la causal de tratos crueles o violencia del num. 2."}, {"texto": "Aceptarla, porque Rosa permaneció fuera del hogar más de seis meses.", "justificacion": "Incorrecta. El abandono debe ser injustificado."}, {"texto": "Aceptarla, aunque Rosa puede reconvenir por la causal de tratos crueles o violencia.", "justificacion": "Incorrecta. La causal de abandono no se configura."}, {"texto": "Desestimarla, porque el abandono debe superar un año ininterrumpido.", "justificacion": "Incorrecta. El plazo legal es de seis meses."}], "correcta": 0, "referencias": ["CC"]}, {"id": "UTE-CIV-13", "area": 4, "dificultad": 4, "subarea": "Personas y Familia", "tema": "Parentesco e impedimentos", "resultado": "Resuelve el caso aplicando parentesco e impedimentos.", "demanda": "Aplicar", "enunciado": "Diego quiere casarse con Andrea, hija de Lorena, hermana de Diego por parte de padre y madre. ¿Qué parentesco existe y qué efecto tiene?", "opciones": [{"texto": "Colateral de tercer grado, y el matrimonio sería válido.", "justificacion": "Correcta. Entre tío y sobrina hay consanguinidad colateral en tercer grado (art. 22 CC); el art. 95 CC solo declara nulo el matrimonio entre colaterales en segundo grado, es decir, entre hermanos."}, {"texto": "Colateral de segundo grado, y el matrimonio sería nulo.", "justificacion": "Incorrecta. El grado se cuenta por generaciones: son tres."}, {"texto": "En línea recta de segundo grado, y el matrimonio sería nulo.", "justificacion": "Incorrecta. No descienden uno del otro."}, {"texto": "Colateral de cuarto grado, y el matrimonio sería válido.", "justificacion": "Incorrecta. El cuarto grado corresponde a los primos."}], "correcta": 0, "referencias": ["CC"]}, {"id": "UTE-CIV-14", "area": 4, "dificultad": 4, "subarea": "Personas y Familia", "tema": "Tenencia e interés superior", "resultado": "Resuelve el caso aplicando tenencia e interés superior.", "demanda": "Evaluar", "enunciado": "Ana y Luis, divorciados, son aptos para cuidar a Camila, de catorce años, que siempre ha vivido con su madre y expresó que desea seguir con ella. Luis pide la tenencia por tener mejores ingresos. ¿Con qué criterio se resuelve?", "opciones": [{"texto": "Valorando principalmente la opinión de Camila y la continuidad de sus rutinas.", "justificacion": "Correcta. Eliminada la preferencia materna automática, la Corte Constitucional fijó parámetros del interés superior que priorizan la opinión del adolescente según su madurez y la estabilidad de su vida (sentencia 28-15-IN/21)."}, {"texto": "Confiándola al padre, porque sus mayores ingresos le dan mejores condiciones.", "justificacion": "Incorrecta. Los ingresos se atienden con alimentos, no con la tenencia."}, {"texto": "Confiándola a la madre, porque la ley la prefiere en la adolescencia.", "justificacion": "Incorrecta. Esa preferencia automática fue declarada inconstitucional."}, {"texto": "Alternando la residencia, porque ambos progenitores son aptos.", "justificacion": "Incorrecta. Camila expresó que no desea alternar residencias."}], "correcta": 0, "referencias": ["CCE2815", "CONA"]}, {"id": "UTE-CIV-15", "area": 4, "dificultad": 4, "subarea": "Personas y Familia", "tema": "Exigibilidad de alimentos", "resultado": "Resuelve el caso aplicando exigibilidad de alimentos.", "demanda": "Aplicar", "enunciado": "Silvia demandó alimentos para sus hijos en marzo de 2026; la citación fue en septiembre y la sentencia en octubre de 2026. El juez fijó la pensión desde la sentencia. ¿Desde cuándo es exigible?", "opciones": [{"texto": "Desde la presentación de la demanda, en marzo de 2026.", "justificacion": "Correcta. La pensión de alimentos se debe desde la presentación de la demanda, regla del Código de la Niñez y Adolescencia ratificada como precedente por la Corte Constitucional."}, {"texto": "Desde la citación al alimentante, en septiembre de 2026.", "justificacion": "Incorrecta. La ley fija la exigibilidad desde la demanda."}, {"texto": "Desde la sentencia que la fija, en octubre de 2026.", "justificacion": "Incorrecta. Esa fue la decisión del juez, contraria a la regla legal."}, {"texto": "Desde la separación de hecho de los progenitores.", "justificacion": "Incorrecta. No se retrotrae a antes de la demanda."}], "correcta": 0, "referencias": ["CONA"]}, {"id": "UTE-CIV-16", "area": 4, "dificultad": 5, "subarea": "Personas y Familia", "tema": "Afinidad", "resultado": "Resuelve el caso aplicando afinidad.", "demanda": "Analizar", "enunciado": "Carla estuvo casada con Pablo; el divorcio se inscribió en 2023. En 2026 quiere casarse con Jorge, viudo y padre de Pablo. ¿Qué vínculo existe hoy entre ellos y qué efecto tiene?", "opciones": [{"texto": "Ningún parentesco vigente; no existe impedimento para casarse.", "justificacion": "Correcta. Según la retroalimentación del curso, el Código Civil vigente no incluye la afinidad entre los impedimentos del matrimonio, por lo que el vínculo previo no impide celebrarlo."}, {"texto": "Afinidad en línea recta de primer grado, que es impedimento dirimente.", "justificacion": "Incorrecta. La afinidad no figura entre los impedimentos vigentes."}, {"texto": "Afinidad en línea recta de primer grado, que no impide el matrimonio.", "justificacion": "Incorrecta. La respuesta oficial descarta un parentesco vigente."}, {"texto": "Afinidad colateral de segundo grado, que no impide el matrimonio.", "justificacion": "Incorrecta. Suegro y nuera no son colaterales."}], "correcta": 0, "referencias": ["CC"]}, {"id": "UTE-CIV-17", "area": 4, "dificultad": 3, "subarea": "Personas y Familia", "tema": "Domicilio civil", "resultado": "Resuelve el caso aplicando domicilio civil.", "demanda": "Aplicar", "enunciado": "Fernando vive con su pareja e hijos en Riobamba, donde tiene una ferretería que administra los fines de semana. Hace tres años trabaja con contrato a plazo en Guayaquil, donde arrienda una habitación. ¿Cuál es su domicilio civil?", "opciones": [{"texto": "Riobamba, porque allí conserva su familia y el asiento de sus negocios.", "justificacion": "Correcta. El domicilio civil no se muda por residir largo tiempo en otra parte si se conserva la familia y el asiento principal de los negocios (art. 51 CC); la residencia accidental no crea domicilio (art. 49 CC)."}, {"texto": "Guayaquil, porque allí ejerce su profesión de forma habitual desde hace tres años.", "justificacion": "Incorrecta. Su residencia allí es accidental, por un contrato a plazo."}, {"texto": "Quito, porque allí se celebró su matrimonio anterior.", "justificacion": "Incorrecta. El lugar del matrimonio no fija el domicilio."}, {"texto": "Tiene dos domicilios a la vez, Riobamba y Guayaquil.", "justificacion": "Incorrecta. La pluralidad de domicilios exige circunstancias constitutivas en ambos lugares."}], "correcta": 0, "referencias": ["CC"]}, {"id": "UTE-CIV-18", "area": 4, "dificultad": 4, "subarea": "Personas y Familia", "tema": "Titulares de la nulidad relativa", "resultado": "Resuelve el caso aplicando titulares de la nulidad relativa.", "demanda": "Aplicar", "enunciado": "Mateo, de dieciséis años, vendió su computadora a un vecino de veintitrés. Arrepentido, el comprador demanda la nulidad alegando la incapacidad de Mateo. ¿Qué corresponde?", "opciones": [{"texto": "Rechazarla, porque solo puede alegarla quien está protegido por la incapacidad.", "justificacion": "Correcta. El adolescente es relativamente incapaz (art. 1463 CC); la nulidad relativa solo puede alegarse por aquellos en cuyo beneficio la establecen las leyes (art. 1700 CC)."}, {"texto": "Aceptarla, porque cualquier persona interesada puede alegarla.", "justificacion": "Incorrecta. Esa regla corresponde a la nulidad absoluta."}, {"texto": "Declararla de oficio, porque la incapacidad del vendedor aparece de manifiesto en el acto.", "justificacion": "Incorrecta. La declaración de oficio procede solo en la nulidad absoluta."}, {"texto": "Aceptarla, porque el contrato es nulo de nulidad absoluta.", "justificacion": "Incorrecta. El adolescente es relativamente incapaz."}], "correcta": 0, "referencias": ["CC"]}, {"id": "UTE-CIV-19", "area": 4, "dificultad": 3, "subarea": "Personas y Familia", "tema": "Haber social", "resultado": "Resuelve el caso aplicando haber social.", "demanda": "Aplicar", "enunciado": "En 2014, casados sin capitulaciones, Andrés y Nina compraron una casa con crédito pagado con los sueldos de ambos; la escritura se otorgó solo a nombre de Andrés. ¿Cómo se clasifica la casa?", "opciones": [{"texto": "Como haber social, por haberse adquirido a título oneroso en el matrimonio.", "justificacion": "Correcta. El art. 157 num. 5 CC incorpora al haber social los bienes que cualquiera de los cónyuges adquiera durante el matrimonio a título oneroso."}, {"texto": "Como bien propio de Andrés, porque la escritura está solo a su nombre.", "justificacion": "Incorrecta. La titularidad registral no cambia la naturaleza social del bien."}, {"texto": "Como copropiedad ordinaria, en proporción a lo aportado.", "justificacion": "Incorrecta. Se rige por la sociedad conyugal, no por la copropiedad ordinaria."}, {"texto": "Como bien propio de Nina, en proporción a sus aportes.", "justificacion": "Incorrecta. No hay base legal para ello."}], "correcta": 0, "referencias": ["CC"]}, {"id": "UTE-CIV-20", "area": 4, "dificultad": 4, "subarea": "Personas y Familia", "tema": "Nulidad por fuerza", "resultado": "Resuelve el caso aplicando nulidad por fuerza.", "demanda": "Aplicar", "enunciado": "Gabriela se casó con Iván después de que el padre de este la amenazara con denunciar falsamente a su hermano. Tres meses después, la madre de Gabriela, que presenció las amenazas, quiere demandar la nulidad. ¿Quién puede demandarla?", "opciones": [{"texto": "Solo Gabriela, por ser la cónyuge perjudicada por el vicio del consentimiento.", "justificacion": "Correcta. La nulidad por falta de libre consentimiento solo puede alegarla el cónyuge cuyo consentimiento fue viciado, según las reglas del Código Civil sobre la nulidad del matrimonio."}, {"texto": "Cualquier persona con interés, porque la nulidad por amenazas es absoluta.", "justificacion": "Incorrecta. La acción está reservada a la cónyuge afectada."}, {"texto": "Cualquiera de los cónyuges, porque el vicio del consentimiento afecta el vínculo común.", "justificacion": "Incorrecta. Iván no puede invocar el vicio que sufrió Gabriela."}, {"texto": "La madre de Gabriela, porque presenció directamente las amenazas.", "justificacion": "Incorrecta. Presenciar los hechos no la legitima."}], "correcta": 0, "referencias": ["CC"]}, {"id": "UTE-DPG-01", "area": 3, "dificultad": 2, "subarea": "Derecho Procesal General", "tema": "Motivación", "resultado": "Resuelve el caso aplicando motivación.", "demanda": "Aplicar", "enunciado": "Una sentencia enumera normas, pero no explica su pertinencia para los hechos del caso. ¿Qué garantía debe examinarse directamente?", "opciones": [{"texto": "La motivación de las resoluciones.", "justificacion": "Correcta. El art. 76 num. 7 lit. l CRE exige enunciar las normas y explicar su pertinencia a los antecedentes de hecho."}, {"texto": "La publicidad de las audiencias.", "justificacion": "Incorrecta. La publicidad no se refiere a la justificación de la decisión."}, {"texto": "La gratuidad del acceso a la justicia.", "justificacion": "Incorrecta. No guarda relación con el defecto descrito."}, {"texto": "La competencia por razón del territorio.", "justificacion": "Incorrecta. No es un problema de competencia."}], "correcta": 0, "referencias": ["CRE"]}, {"id": "UTE-DPG-02", "area": 3, "dificultad": 2, "subarea": "Derecho Procesal General", "tema": "Inmediación", "resultado": "Resuelve el caso aplicando inmediación.", "demanda": "Aplicar", "enunciado": "El juzgador pretende encargar a un funcionario administrativo la conducción de la audiencia de juicio y la recepción de la prueba en su propia circunscripción. ¿Qué principio exige su intervención directa?", "opciones": [{"texto": "Inmediación.", "justificacion": "Correcta. El juzgador debe celebrar las audiencias y conocer directamente la prueba (art. 6 COGEP)."}, {"texto": "Especialidad.", "justificacion": "Incorrecta. Se refiere a la distribución por materias."}, {"texto": "Gradualidad.", "justificacion": "Incorrecta. No regula la presencia del juzgador."}, {"texto": "Dispositivo.", "justificacion": "Incorrecta. Se refiere al impulso procesal de las partes."}], "correcta": 0, "referencias": ["COGEP"]}, {"id": "UTE-DPG-03", "area": 3, "dificultad": 3, "subarea": "Derecho Procesal General", "tema": "Casación", "resultado": "Resuelve el caso aplicando casación.", "demanda": "Comprender", "enunciado": "Una parte quiere usar la casación como una tercera instancia ordinaria, sin identificar ninguna causal legal. ¿Qué afirmación es correcta?", "opciones": [{"texto": "La estrategia desconoce que la casación es extraordinaria y exige causal.", "justificacion": "Correcta. La casación es un recurso extraordinario cuya procedencia se sujeta a los supuestos y causales legales (art. 10 COFJ; arts. 266 y 268 COGEP)."}, {"texto": "Es válida, porque la casación permite revisar de nuevo todo el proceso.", "justificacion": "Incorrecta. La casación no es una tercera instancia."}, {"texto": "Es válida si se presenta dentro del término de treinta días.", "justificacion": "Incorrecta. El término no suple la falta de causal."}, {"texto": "Es válida si el recurrente se allana a revisar solo los hechos.", "justificacion": "Incorrecta. La casación no revisa hechos ni prueba."}], "correcta": 0, "referencias": ["COFJ", "COGEP"]}, {"id": "UTE-DPG-04", "area": 3, "dificultad": 1, "subarea": "Derecho Procesal General", "tema": "Citación", "resultado": "Resuelve el caso aplicando citación.", "demanda": "Recordar", "enunciado": "El órgano judicial debe hacer conocer formalmente al demandado el contenido de la demanda y la providencia inicial. ¿Qué actuación corresponde?", "opciones": [{"texto": "Citación.", "justificacion": "Correcta. La citación hace conocer a la persona demandada el contenido de la demanda (art. 53 COGEP); las demás providencias se notifican (art. 65 COGEP)."}, {"texto": "Notificación de la sentencia.", "justificacion": "Incorrecta. La sentencia aún no existe."}, {"texto": "Calificación de la contestación.", "justificacion": "Incorrecta. Es un acto posterior."}, {"texto": "Convocatoria de testigos.", "justificacion": "Incorrecta. No informa al demandado de la demanda."}], "correcta": 0, "referencias": ["COGEP"]}, {"id": "UTE-DPG-05", "area": 3, "dificultad": 3, "subarea": "Derecho Procesal General", "tema": "Procuración común", "resultado": "Resuelve el caso aplicando procuración común.", "demanda": "Aplicar", "enunciado": "Varios actores reclaman un mismo derecho, sin intereses contrapuestos, y designan procurador común a uno de ellos, que no es abogado. ¿Debe rechazarse el nombramiento?", "opciones": [{"texto": "No: la procuración común no exige la calidad de abogado.", "justificacion": "Correcta. La designación de procurador común entre litigantes con un mismo derecho no requiere esa condición profesional (art. 37 COGEP), sin perjuicio del patrocinio de un abogado."}, {"texto": "Sí: el procurador común debe ser siempre abogado.", "justificacion": "Incorrecta. La ley no exige esa calidad."}, {"texto": "Sí: cada actor debe comparecer por separado.", "justificacion": "Incorrecta. La procuración común está prevista precisamente para estos casos."}, {"texto": "No, pero solo si el juez lo autoriza de oficio.", "justificacion": "Incorrecta. No se requiere autorización judicial."}], "correcta": 0, "referencias": ["COGEP"]}, {"id": "UTE-DPG-06", "area": 3, "dificultad": 2, "subarea": "Derecho Procesal General", "tema": "Falta de contestación", "resultado": "Resuelve el caso aplicando falta de contestación.", "demanda": "Comprender", "enunciado": "En un proceso sujeto al COGEP, el demandado no contesta la demanda. ¿Qué efecto produce esa omisión?", "opciones": [{"texto": "Se tiene como negativa de los fundamentos de la demanda.", "justificacion": "Correcta. La falta de contestación se tiene como negativa de los fundamentos de la demanda (art. 157 COGEP); el actor debe probar sus afirmaciones."}, {"texto": "Se tienen por aceptados todos los fundamentos de la demanda.", "justificacion": "Incorrecta. El COGEP no presume el allanamiento."}, {"texto": "El juez debe dictar sentencia sin audiencia.", "justificacion": "Incorrecta. El proceso continúa con sus audiencias."}, {"texto": "Se archiva el proceso por falta de controversia.", "justificacion": "Incorrecta. La controversia subsiste."}], "correcta": 0, "referencias": ["COGEP"]}, {"id": "UTE-DPG-07", "area": 3, "dificultad": 2, "subarea": "Derecho Procesal General", "tema": "Litispendencia", "resultado": "Resuelve el caso aplicando litispendencia.", "demanda": "Aplicar", "enunciado": "La parte demandada advierte que existe otro proceso pendiente con la identidad exigida respecto de la misma controversia. ¿Qué excepción previa corresponde?", "opciones": [{"texto": "Litispendencia.", "justificacion": "Correcta. Es excepción previa del art. 153 num. 5 COGEP."}, {"texto": "Cosa juzgada.", "justificacion": "Incorrecta. Requiere una sentencia ejecutoriada, no un proceso pendiente."}, {"texto": "Caducidad.", "justificacion": "Incorrecta. Se refiere a la extinción por el paso del tiempo."}, {"texto": "Transacción.", "justificacion": "Incorrecta. Supone un acuerdo de las p
