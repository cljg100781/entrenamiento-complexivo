<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f3a63">
<title>Simulador Complexivo</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<style>
:root{--bg:#f3f5f9;--card:#fff;--ink:#141c28;--mut:#5d6879;--line:#dde3ec;--pri:#1f4e8c;--pri2:#e7effa;--ok:#17794a;--okb:#e5f4eb;--bad:#b0281f;--badb:#fbe8e6;--warn:#8a5a00;--warnb:#fff3d6;--hd:#1f3a63}
@media (prefers-color-scheme:dark){:root{--bg:#0e131a;--card:#171f2b;--ink:#e7ecf3;--mut:#9aa5b6;--line:#2a3443;--pri:#86b4f0;--pri2:#1b2a3f;--ok:#62cf95;--okb:#12301f;--bad:#ff8f84;--badb:#3a1b19;--warn:#f1b84c;--warnb:#36290f;--hd:#111b2a}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
body{padding-bottom:env(safe-area-inset-bottom)}
button{font:inherit;color:inherit}
.top{background:var(--hd);color:#fff;padding:18px 16px 16px;padding-top:calc(18px + env(safe-area-inset-top));position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px}
.top h1{margin:2px 0 0;font-size:22px;letter-spacing:-.01em}
.kicker{font-size:11px;text-transform:uppercase;letter-spacing:.08em;opacity:.75}
.top .mid{flex:1;min-width:0}
.top .mid b{font-size:16px}
.ic{background:rgba(255,255,255,.12);border:0;border-radius:10px;width:40px;height:40px;font-size:18px;color:#fff}
.timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:17px;background:rgba(255,255,255,.12);padding:8px 10px;border-radius:10px}
.timer.low{background:#c0392b}
.prog{height:4px;background:var(--line)}.prog i{display:block;height:100%;background:var(--pri);transition:width .2s}
.wrap{max-width:720px;margin:0 auto;padding:16px 16px 110px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:0 0 14px}
.card h3{margin:0 0 10px;font-size:16px}
.warnc{background:var(--warnb);border-color:transparent}
.warnc p{margin:4px 0 12px;color:var(--mut)}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;width:100%;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:0 0 12px;cursor:pointer}
.tile.main{background:var(--pri);color:#fff;border:0;padding:20px}
@media (prefers-color-scheme:dark){.tile.main{color:#0e131a}}
.tile .tt{font-weight:700;font-size:17px}
.tile .ds{font-size:13px;opacity:.8}
.tile:disabled{opacity:.45}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid2 .tile{margin:0}
.btn{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:12px 14px;font-weight:600;cursor:pointer;min-height:46px}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
@media (prefers-color-scheme:dark){.btn.pri{color:#0e131a}}
.btn:disabled{opacity:.4}
.btn.flagon{background:var(--warnb);border-color:var(--warn);color:var(--warn)}
.row{display:flex;gap:10px;flex-wrap:wrap}.row .btn{flex:1}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 12px;padding-bottom:calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px;z-index:6}
.bar .btn{flex:1}.bar .btn.sq{flex:0 0 52px;padding:0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.chip{font-size:12px;background:var(--pri2);color:var(--pri);padding:5px 9px;border-radius:999px;font-weight:600}
.stem{font-size:17px;line-height:1.5;margin:0 0 14px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:var(--bg);border:2px solid transparent;border-radius:12px;padding:12px;margin:0 0 10px;cursor:pointer;line-height:1.45;font-size:15.5px}
.opt .lt{flex:0 0 28px;height:28px;border-radius:50%;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:14px}
.opt.sel{border-color:var(--pri);background:var(--pri2)}.opt.sel .lt{background:var(--pri);color:#fff;border-color:var(--pri)}
.opt.ok{border-color:var(--ok);background:var(--okb)}.opt.ok .lt{background:var(--ok);color:#fff;border-color:var(--ok)}
.opt.bad{border-color:var(--bad);background:var(--badb)}.opt.bad .lt{background:var(--bad);color:#fff;border-color:var(--bad)}
.opt:disabled{cursor:default;color:inherit}
.verdict{font-weight:700;margin:0 0 10px}.verdict.ok{color:var(--ok)}.verdict.bad{color:var(--bad)}
.why{border-left:3px solid var(--line);padding:2px 0 2px 10px;margin:0 0 10px;font-size:14.5px;line-height:1.5}
.why.ok{border-color:var(--ok)}
.why b{display:block;margin-bottom:2px}
.meta{width:100%;border-collapse:collapse;font-size:13.5px;margin:6px 0 10px}
.meta td{padding:6px 0;border-bottom:1px solid var(--line);vertical-align:top}.meta td:first-child{color:var(--mut);width:42%;padding-right:8px}
.refs{font-size:13px;line-height:1.5;color:var(--mut)}.refs p{margin:0 0 6px;padding-left:1.4em;text-indent:-1.4em;word-break:break-word}
h4{margin:14px 0 8px;font-size:14px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut)}
.dist .r{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px;margin:8px 0 3px}
.track{height:8px;background:var(--line);border-radius:6px;overflow:hidden}.track i{display:block;height:100%;background:var(--pri);border-radius:6px}
.track.g i{background:var(--ok)}.track.y i{background:var(--warn)}.track.rd i{background:var(--bad)}
.score{text-align:center;padding:24px 16px}
.score .big{font-size:56px;font-weight:800;letter-spacing:-.03em;line-height:1}
.score .sub{color:var(--mut);margin-top:6px}
.note{font-size:13px;color:var(--mut);text-align:center;margin:18px 0}
.nums{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:8px}
.nums button{height:46px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-weight:700}
.nums .an{background:var(--pri2);border-color:var(--pri);color:var(--pri)}
.nums .fl{background:var(--warnb);border-color:var(--warn);color:var(--warn)}
.nums .cur{outline:3px solid var(--pri)}
.nums .ok{background:var(--okb);border-color:var(--ok);color:var(--ok)}.nums .bad{background:var(--badb);border-color:var(--bad);color:var(--bad)}
label.fld{display:block;font-weight:600;font-size:14px;margin:12px 0 6px}
select,textarea,input[type=number]{width:100%;font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px}
textarea{min-height:150px;font-family:ui-monospace,Menlo,monospace;font-size:12.5px}
pre{white-space:pre-wrap;word-break:break-word;background:var(--bg);border-radius:10px;padding:12px;font-size:12px;line-height:1.45;overflow:auto}
.chk{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
.chk input{width:22px;height:22px}
.hist{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.hist:last-child{border:0}
.pill{font-weight:800}
.muted{color:var(--mut)}
.seg{display:flex;gap:8px;margin:0 0 14px}.seg .btn{flex:1;padding:10px}.seg .btn.on{background:var(--pri2);border-color:var(--pri);color:var(--pri)}
.sync{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--mut);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:0 0 14px}
.sync .dot{flex:0 0 9px;height:9px;border-radius:50%;background:var(--mut)}
.sync .dot.on{background:var(--ok)}.sync .dot.off{background:var(--warn)}.sync .dot.busy{background:var(--pri);animation:pl 1s infinite}
@keyframes pl{50%{opacity:.3}}
.sync span{flex:1}.sync button{border:0;background:none;color:var(--pri);font-weight:700;padding:4px}
.toast{position:fixed;left:16px;right:16px;bottom:calc(84px + env(safe-area-inset-bottom));background:var(--ink);color:var(--bg);padding:14px 16px;border-radius:12px;font-weight:600;z-index:20;box-shadow:0 6px 24px rgba(0,0,0,.25);text-align:center}
input[type=url]{width:100%;font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px}
.lv{display:inline-block;font-size:12px;font-weight:700;padding:4px 9px;border-radius:999px;white-space:nowrap}
.lv.l1{background:var(--line);color:var(--ink)}.lv.l2{background:var(--pri2);color:var(--pri)}.lv.l3{background:var(--okb);color:var(--ok)}.lv.l4{background:var(--warnb);color:var(--warn)}.lv.l5{background:var(--badb);color:var(--bad)}
.lvrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}.lvrow:last-of-type{border:0}
.lvrow small{display:block;color:var(--mut);font-size:12px}.lvch{display:flex;align-items:center;gap:6px}
.upc{color:var(--ok)}.dnc{color:var(--bad)}.eqc{color:var(--mut)}
.meter{display:flex;gap:4px;margin:8px 0 2px}.meter i{flex:1;height:6px;border-radius:4px;background:var(--line)}.meter i.f{background:var(--pri)}
.plan .cd{display:flex;align-items:baseline;gap:8px;margin:0 0 4px}.plan .cd b{font-size:40px;letter-spacing:-.02em;line-height:1}
.task{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14.5px}.task:last-child{border:0}
.task .ck{flex:0 0 24px;height:24px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:13px;font-weight:800}
.task .ck.on{background:var(--ok);border-color:var(--ok);color:#fff}
.task span{flex:1;line-height:1.35}.task small{display:block;color:var(--mut);font-size:12.5px}
.task button{border:1px solid var(--pri);background:var(--pri2);color:var(--pri);border-radius:10px;padding:8px 12px;font-weight:700;white-space:nowrap}
.streak{display:inline-flex;align-items:center;gap:6px;background:var(--warnb);color:var(--warn);font-weight:800;font-size:13px;padding:5px 10px;border-radius:999px}
.spk{border:1px solid var(--line);background:var(--card);color:var(--pri);border-radius:999px;padding:5px 11px;font-size:12.5px;font-weight:700;margin-left:auto}
details.art{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:0 0 8px;font-size:14px;line-height:1.5;background:var(--bg)}
details.art summary{font-weight:700;cursor:pointer}details.art p{margin:8px 0 0}
.artnote{font-size:12px;color:var(--mut);margin:0 0 8px}
.sub2{display:flex;justify-content:space-between;gap:8px;font-size:13.5px;margin:10px 0 3px}.sub2 small{color:var(--mut)}
input[type=date],input[type=text]{width:100%;font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px}
.optrow{border:1px solid var(--line);border-radius:12px;padding:10px;margin:0 0 10px}.optrow label{display:flex;gap:8px;align-items:center;font-weight:700;font-size:14px;margin:0 0 6px}
.optrow textarea{min-height:60px;font-family:inherit;font-size:14px}
.pk{display:flex;justify-content:space-between;gap:8px;font-size:13.5px;padding:8px 0;border-bottom:1px solid var(--line)}.pk:last-child{border:0}
</style>
</head>
<body>
<div id="app"></div>
<script>
const BIB={
CRE:"Asamblea Constituyente del Ecuador. (2008). Constitución de la República del Ecuador. Registro Oficial 449, 20 de octubre de 2008. https://www.asambleanacional.gob.ec/",
LOGJCC:"Asamblea Nacional del Ecuador. (2009). Ley Orgánica de Garantías Jurisdiccionales y Control Constitucional. Registro Oficial Segundo Suplemento 52, 22 de octubre de 2009. https://www.corteconstitucional.gob.ec/",
COA:"Asamblea Nacional del Ecuador. (2017). Código Orgánico Administrativo. Registro Oficial Segundo Suplemento 31, 7 de julio de 2017. https://www.registroficial.gob.ec/",
COIP:"Asamblea Nacional del Ecuador. (2014). Código Orgánico Integral Penal. Registro Oficial Suplemento 180, 10 de febrero de 2014. https://www.registroficial.gob.ec/",
COGEP:"Asamblea Nacional del Ecuador. (2015). Código Orgánico General de Procesos. Registro Oficial Suplemento 506, 22 de mayo de 2015. https://www.funcionjudicial.gob.ec/",
LAM:"Congreso Nacional del Ecuador. (2006). Ley de Arbitraje y Mediación (Codificación). Registro Oficial 417, 14 de diciembre de 2006. https://www.registroficial.gob.ec/",
CC:"Congreso Nacional del Ecuador. (2005). Código Civil (Codificación). Registro Oficial Suplemento 46, 24 de junio de 2005. https://www.registroficial.gob.ec/",
CONA:"Congreso Nacional del Ecuador. (2003). Código de la Niñez y Adolescencia. Registro Oficial 737, 3 de enero de 2003. https://www.registroficial.gob.ec/",
CT:"Congreso Nacional del Ecuador. (2005). Código del Trabajo (Codificación). Registro Oficial Suplemento 167, 16 de diciembre de 2005. https://www.trabajo.gob.ec/",
CTRIB:"Congreso Nacional del Ecuador. (2005). Código Tributario (Codificación). Registro Oficial Suplemento 38, 14 de junio de 2005. https://www.sri.gob.ec/",
LC:"Congreso Nacional del Ecuador. (1999). Ley de Compañías (Codificación). Registro Oficial 312, 5 de noviembre de 1999. https://www.supercias.gob.ec/",
LOEI:"Asamblea Nacional del Ecuador. (2020). Ley Orgánica de Emprendimiento e Innovación. Registro Oficial Suplemento 151, 28 de febrero de 2020. https://www.supercias.gob.ec/",
CADH:"Organización de los Estados Americanos. (1969). Convención Americana sobre Derechos Humanos. https://www.oas.org/dil/esp/tratados_b-32_convencion_americana_sobre_derechos_humanos.htm",
ALM:"Corte Interamericana de Derechos Humanos. (2006). Caso Almonacid Arellano y otros vs. Chile (Serie C No. 154). https://www.corteidh.or.cr/docs/casos/articulos/seriec_154_esp.pdf",
SR:"Corte Interamericana de Derechos Humanos. (1997). Caso Suárez Rosero vs. Ecuador (Serie C No. 35). https://www.corteidh.or.cr/docs/casos/articulos/seriec_35_esp.pdf",
CC1158:"Corte Constitucional del Ecuador. (2021). Sentencia No. 1158-17-EP/21 (garantía de motivación). https://www.corteconstitucional.gob.ec/",
BUST:"Convención de Derecho Internacional Privado [Código de Bustamante]. (1928). La Habana. https://www.oas.org/juridico/spanish/tratados/a-31.html",
HCCH:"Conferencia de La Haya de Derecho Internacional Privado. (1961). Convenio por el que se suprime el requisito de legalización de los documentos públicos extranjeros. https://www.hcch.net/es/instruments/conventions/full-text/?cid=41"
};

/* Cada ítem: la opción correcta es la primera (o[0]); la app baraja el orden al presentarlas. */
/* Cada ítem: la opción correcta es la primera (o[0]); la app baraja el orden al presentarlas. */
/* Cada ítem: la opción correcta es la primera (o[0]); la app baraja el orden al presentarlas. */
const Q=[{"id":"A1-01","a":1,"s":"Derecho Constitucional","t":"Acción extraordinaria de protección","ra":"Determina la garantía jurisdiccional y el término procedente frente a decisiones judiciales que vulneran derechos constitucionales.","d":"Aplicar","q":"Una sentencia de segunda instancia, ya ejecutoriada, se dictó sin que se permitiera a la parte demandada practicar su prueba de descargo. ¿Qué garantía procede y en qué término debe interponerse?","o":[["Acción extraordinaria de protección, en el término de veinte días desde la notificación.","Correcta. Procede contra sentencias y autos definitivos que vulneren derechos constitucionales (art. 94 CRE); el término es de veinte días (art. 60 LOGJCC) y se presenta ante la judicatura que dictó la decisión (art. 62 LOGJCC)."],["Acción de protección ante una jueza de primer nivel, sin término de caducidad alguno.","Incorrecta. La acción de protección es improcedente contra providencias judiciales (art. 42 num. 6 LOGJCC)."],["Recurso de casación ante la Corte Nacional de Justicia, en el término de treinta días.","Incorrecta. La casación es un recurso extraordinario de legalidad, no una garantía jurisdiccional de derechos constitucionales."],["Acción de hábeas data ante la Corte Provincial, en el término de diez días hábiles.","Incorrecta. El hábeas data tutela el acceso y la rectificación de datos personales (art. 92 CRE), no el derecho a la defensa en un proceso."]],"r":["CRE","LOGJCC"]},
{"id":"A1-02","a":1,"s":"Derecho Constitucional","t":"Hábeas corpus","ra":"Identifica la garantía idónea frente a privaciones de libertad ilegales y sus plazos constitucionales.","d":"Aplicar","q":"Una persona es detenida por agentes policiales sin orden judicial ni flagrancia y permanece incomunicada. Su familia busca su liberación inmediata. ¿Qué garantía procede y en qué plazo debe realizarse la audiencia?","o":[["Hábeas corpus; la audiencia debe realizarse dentro de las veinticuatro horas.","Correcta. El hábeas corpus busca recuperar la libertad de quien se halla privado de ella de forma ilegal, arbitraria o ilegítima, y la audiencia se convoca dentro de las 24 horas (art. 89 CRE)."],["Acción de protección; la audiencia debe realizarse dentro de los tres días siguientes.","Incorrecta. La acción de protección no procede cuando existe una garantía específica; la privación ilegal de libertad se tutela por hábeas corpus."],["Acción por incumplimiento, previo reclamo de cuarenta días a la autoridad policial.","Incorrecta. Esta acción garantiza la aplicación de normas y sentencias de organismos internacionales (art. 93 CRE)."],["Acción extraordinaria de protección, con audiencia ante la Corte Constitucional.","Incorrecta. Requiere una sentencia o auto definitivo que vulnere derechos (art. 94 CRE)."]],"r":["CRE","LOGJCC"]},
{"id":"A1-03","a":1,"s":"Derecho Constitucional","t":"Jerarquía normativa","ra":"Resuelve antinomias aplicando el orden jerárquico del artículo 425 de la Constitución.","d":"Analizar","q":"Un juez constata una contradicción entre una ley orgánica y un tratado internacional ratificado por el Ecuador en materia comercial (no relativo a derechos humanos). Según el artículo 425 de la Constitución, ¿qué norma prevalece?","o":[["El tratado, que en el orden jerárquico está sobre las leyes orgánicas.","Correcta. El art. 425 CRE ordena: Constitución; tratados y convenios internacionales; leyes orgánicas; leyes ordinarias, etc. Ante conflicto entre normas de distinta jerarquía se aplica la superior."],["La ley orgánica, por haber sido aprobada con mayoría absoluta de la Asamblea.","Incorrecta. La mayoría calificada del art. 133 CRE no coloca a la ley orgánica sobre los tratados."],["La norma posterior en el tiempo, sin importar su jerarquía normativa.","Incorrecta. El criterio cronológico opera entre normas de igual jerarquía; entre distinta jerarquía rige el criterio jerárquico (art. 425 inc. 2 CRE)."],["Ninguna: el juez debe suspender la causa y consultar a la Asamblea Nacional.","Incorrecta. La consulta de constitucionalidad se eleva a la Corte Constitucional (art. 428 CRE), no a la Asamblea."]],"r":["CRE"]},
{"id":"A1-04","a":1,"s":"Derecho Constitucional","t":"Aplicación directa de los derechos","ra":"Aplica los principios de aplicación de los derechos del artículo 11 de la Constitución.","d":"Evaluar","q":"Una jueza niega tutelar un derecho reconocido en la Constitución argumentando que aún no se ha expedido la ley que lo desarrolle. Esta decisión:","o":[["Contraviene la Constitución: los derechos son de directa e inmediata aplicación.","Correcta. Así lo dispone el art. 11 num. 3 CRE, reforzado por el art. 426 CRE sobre la aplicación directa de las normas constitucionales."],["Es válida, porque los derechos programáticos requieren desarrollo legislativo previo.","Incorrecta. La Constitución no condiciona la exigibilidad de los derechos a su desarrollo legal (art. 11 num. 3 CRE)."],["Es válida solo si el derecho no consta además en instrumentos internacionales.","Incorrecta. La aplicación directa abarca por igual los derechos de la Constitución y de los instrumentos internacionales."],["Obliga a la jueza a remitir el caso a la Defensoría del Pueblo para su trámite.","Incorrecta. No existe tal remisión; la jueza está obligada a resolver aplicando directamente la Constitución."]],"r":["CRE"]},
{"id":"A1-05","a":1,"s":"Derechos Humanos","t":"Control de convencionalidad","ra":"Reconoce el origen y alcance del control de convencionalidad en el Sistema Interamericano.","d":"Recordar","q":"La obligación de los jueces nacionales de verificar la compatibilidad de las normas internas con la Convención Americana, considerando también la interpretación de la Corte Interamericana, fue formulada expresamente en:","o":[["El caso Almonacid Arellano y otros vs. Chile (2006).","Correcta. En este fallo la Corte IDH sostuvo que el Poder Judicial debe ejercer un control de convencionalidad entre las normas internas y la Convención Americana."],["El caso Marbury vs. Madison (1803), de la Corte Suprema estadounidense.","Incorrecta. Marbury es el precedente fundacional del control judicial de constitucionalidad en Estados Unidos, no del sistema interamericano."],["La jurisprudencia europea sobre el margen de apreciación nacional.","Incorrecta. El margen de apreciación es una doctrina europea de deferencia a los Estados, distinta del control de convencionalidad."],["El caso Suárez Rosero vs. Ecuador (1997).","Incorrecta. Ese caso trató la detención incomunicada y la prisión preventiva prolongada."]],"r":["ALM","CADH"]},
{"id":"A1-06","a":1,"s":"Derechos Humanos","t":"Jurisprudencia interamericana sobre Ecuador","ra":"Identifica los hechos y derechos vulnerados en casos contenciosos contra el Ecuador.","d":"Comprender","q":"En el caso Suárez Rosero vs. Ecuador (1997), la Corte Interamericana declaró la responsabilidad internacional del Estado principalmente por:","o":[["La detención incomunicada y la prisión preventiva prolongada de la víctima.","Correcta. La Corte declaró violados los derechos a la integridad, libertad personal, garantías judiciales y protección judicial, además del deber de adecuar el derecho interno (arts. 5, 7, 8, 25 y 2 CADH)."],["La desaparición forzada de la víctima por parte de agentes militares.","Incorrecta. En el caso no hubo desaparición forzada."],["La falta de consulta previa a una comunidad indígena amazónica.","Incorrecta. Esa temática corresponde al caso Pueblo Indígena Kichwa de Sarayaku vs. Ecuador (2012)."],["La destitución arbitraria de magistrados de las altas cortes del país.","Incorrecta. Corresponde a otros casos, como Camba Campos y otros vs. Ecuador y Quintana Coello y otros vs. Ecuador (2013)."]],"r":["SR","CADH"]},
{"id":"A1-07","a":1,"s":"Derecho Constitucional","t":"Garantía de motivación","ra":"Evalúa la validez de resoluciones a la luz del estándar constitucional de motivación.","d":"Evaluar","q":"Una resolución judicial transcribe normas jurídicas pero no explica la pertinencia de su aplicación a los antecedentes de hecho. Según el artículo 76, numeral 7, literal l) de la Constitución, la resolución:","o":[["Se considera nula por falta de motivación.","Correcta. La norma exige enunciar las normas o principios y explicar su pertinencia a los hechos; la Corte Constitucional (Sentencia 1158-17-EP/21) exige una fundamentación normativa y fáctica suficiente."],["Es válida mientras la parte resolutiva sea clara y ejecutable.","Incorrecta. La claridad del decisorio no suple la ausencia de justificación."],["Solo puede corregirse mediante el recurso de aclaración.","Incorrecta. La aclaración resuelve oscuridad del fallo; no subsana la falta de motivación."],["Es anulable únicamente si la parte afectada lo alega en cuatro años.","Incorrecta. Confunde la garantía constitucional con el régimen civil de la nulidad relativa."]],"r":["CRE","CC1158"]},
{"id":"A1-08","a":1,"s":"Derecho Administrativo","t":"Acto administrativo","ra":"Distingue los requisitos de validez del acto administrativo de sus condiciones de eficacia.","d":"Recordar","q":"Según el Código Orgánico Administrativo, los requisitos de validez del acto administrativo son:","o":[["Competencia, objeto, voluntad, procedimiento y motivación.","Correcta. Son los requisitos enumerados en el art. 99 COA."],["Competencia, notificación, publicidad, ejecutoriedad y motivación.","Incorrecta. La notificación es condición de eficacia del acto (art. 101 COA), no de validez."],["Capacidad, consentimiento, objeto lícito y causa lícita.","Incorrecta. Son los requisitos civiles para obligarse (art. 1461 Código Civil)."],["Legalidad, oportunidad, proporcionalidad y gratuidad.","Incorrecta. Son principios de la actuación administrativa, no requisitos de validez."]],"r":["COA"]},
{"id":"A1-09","a":1,"s":"Derecho Administrativo","t":"Silencio administrativo","ra":"Aplica los efectos del silencio administrativo en el procedimiento administrativo.","d":"Aplicar","q":"Una ciudadana presenta una solicitud de permiso de funcionamiento ante un gobierno autónomo descentralizado y vence el término legal sin respuesta. Según el Código Orgánico Administrativo, por regla general:","o":[["Opera el silencio positivo: la petición se entiende aprobada.","Correcta. El art. 207 COA fija un término de treinta días, vencido el cual la petición se entiende aprobada."],["Opera el silencio negativo: se entiende negada y cabe apelación.","Incorrecta. El silencio negativo no es la regla general en el COA."],["La ciudadana debe esperar noventa días y presentar acción de protección.","Incorrecta. No existe ese plazo; la ley prevé el acto presunto favorable."],["La petición caduca y la ciudadana debe presentarla nuevamente.","Incorrecta. La inacción administrativa no hace caducar la petición del administrado."]],"r":["COA"]},
{"id":"A1-10","a":1,"s":"Derecho Administrativo","t":"Principio de legalidad","ra":"Evalúa actuaciones públicas a la luz del principio de legalidad.","d":"Evaluar","q":"Un director de una entidad pública impone a un servidor una sanción no prevista en ninguna norma, argumentando que la ley tampoco la prohíbe. Esta actuación:","o":[["Vulnera el principio de legalidad que rige a los servidores públicos.","Correcta. Lo dispone el art. 226 CRE; además, nadie puede ser sancionado por conducta no tipificada como infracción (art. 76 num. 3 CRE)."],["Es válida por el principio de autonomía de la voluntad del funcionario.","Incorrecta. La regla de que lo no prohibido está permitido rige para los particulares, no para el poder público."],["Es válida como ejercicio legítimo de la discrecionalidad administrativa.","Incorrecta. La discrecionalidad requiere habilitación normativa previa y no permite crear sanciones."],["Es válida si la sanción se publica previamente en el Registro Oficial.","Incorrecta. La publicación no suple la falta de competencia ni de tipificación legal."]],"r":["CRE","COA"]},
{"id":"A1-11","a":1,"s":"Derecho Constitucional","t":"Imprescriptibilidad","ra":"Identifica los delitos contra la administración pública con régimen constitucional especial.","d":"Recordar","q":"Según el artículo 233 de la Constitución, ¿qué delitos tienen acciones y penas imprescriptibles y permiten iniciar y continuar el juicio aun en ausencia de la persona acusada?","o":[["Peculado, cohecho, concusión y enriquecimiento ilícito.","Correcta. Es el catálogo del art. 233 CRE, referido a delitos contra la administración pública."],["Estafa, abuso de confianza, lavado de activos y defraudación tributaria.","Incorrecta. Ninguno integra el catálogo del art. 233 CRE."],["Genocidio, lesa humanidad, crímenes de guerra y desaparición forzada.","Incorrecta. Son imprescriptibles por el art. 80 CRE, pero no constituyen el catálogo del art. 233."],["Homicidio, asesinato, sicariato y secuestro.","Incorrecta. Estos delitos tienen el régimen ordinario de prescripción del COIP."]],"r":["CRE"]},
{"id":"A1-12","a":1,"s":"Derecho Administrativo","t":"Responsabilidad del Estado","ra":"Comprende la responsabilidad objetiva del Estado y el derecho de repetición.","d":"Comprender","q":"El Estado es condenado a reparar a una persona por error judicial imputable a un juez. Según el artículo 11, numeral 9 de la Constitución, el Estado:","o":[["Debe ejercer de inmediato el derecho de repetición contra los responsables.","Correcta. El Estado responde frente a la víctima por error judicial, retardo injustificado o inadecuada administración de justicia, y luego repite contra los responsables."],["Queda exonerado si demuestra que el juez actuó sin dolo ni culpa grave.","Incorrecta. La responsabilidad del Estado frente al afectado no depende del dolo del servidor."],["Solo repara si el juez es condenado penalmente antes por prevaricato.","Incorrecta. La reparación no está condicionada a una condena penal previa."],["Debe trasladar la obligación de pago directamente al juez responsable.","Incorrecta. El Estado repara primero; la repetición es una acción posterior."]],"r":["CRE"]},
{"id":"A2-01","a":2,"s":"Derecho Penal (parte general)","t":"Infracción penal","ra":"Identifica los elementos dogmáticos de la infracción penal en el COIP.","d":"Recordar","q":"Según el Código Orgánico Integral Penal, la infracción penal es:","o":[["La conducta típica, antijurídica y culpable sancionada en el COIP.","Correcta. Es la definición del art. 18 COIP."],["Todo acto imputable que se encuentre sancionado por las leyes penales.","Incorrecta. Es una fórmula propia de la legislación derogada que omite los elementos dogmáticos del COIP."],["Toda conducta contraria al orden público, aunque no esté tipificada.","Incorrecta. Vulnera el principio de legalidad (art. 76 num. 3 CRE; art. 5 num. 1 COIP)."],["La conducta típica y punible, aunque no sea culpable ni reprochable.","Incorrecta. Sin culpabilidad no hay infracción penal (arts. 18 y 34 COIP)."]],"r":["COIP","CRE"]},
{"id":"A2-02","a":2,"s":"Derecho Penal (parte general)","t":"Clasificación de las infracciones","ra":"Distingue delitos y contravenciones según la pena.","d":"Comprender","q":"Según el COIP, las contravenciones se distinguen de los delitos porque:","o":[["Se sancionan con pena no privativa o privativa de hasta treinta días.","Correcta. Así lo establece el art. 19 COIP."],["Se sancionan con pena privativa de libertad de hasta un año como máximo.","Incorrecta. Una pena de más de treinta días corresponde a un delito."],["Son siempre conductas culposas, nunca dolosas, según el COIP.","Incorrecta. La distinción no se basa en el dolo o la culpa sino en la pena."],["Solo admiten el ejercicio privado de la acción por parte de la víctima.","Incorrecta. El ejercicio privado se limita a los delitos del art. 415 COIP."]],"r":["COIP"]},
{"id":"A2-03","a":2,"s":"Derecho Penal (parte general)","t":"Legítima defensa","ra":"Aplica las causas de exclusión de la antijuridicidad a un caso concreto.","d":"Aplicar","q":"Andrés es atacado con un cuchillo por un desconocido; sin haberlo provocado, lo empuja con fuerza y el agresor se lesiona al caer. Según el COIP, la conducta de Andrés:","o":[["Carece de antijuridicidad, porque actuó en legítima defensa.","Correcta. Son los requisitos del art. 33 COIP; la legítima defensa excluye la antijuridicidad (art. 30 COIP)."],["Es típica y antijurídica, pero no culpable por miedo insuperable.","Incorrecta. La legítima defensa opera en la antijuridicidad, no en la culpabilidad."],["Es delictiva con atenuante: debía usar el mismo medio que el agresor.","Incorrecta. La ley exige necesidad racional del medio, no identidad de medios."],["Constituye estado de necesidad, que solo protege bienes patrimoniales.","Incorrecta. El estado de necesidad (art. 32 COIP) no parte de una agresión ilegítima y no se limita a bienes patrimoniales."]],"r":["COIP"]},
{"id":"A2-04","a":2,"s":"Derecho Penal (parte general)","t":"Tentativa","ra":"Determina la pena aplicable a los delitos en grado de tentativa.","d":"Aplicar","q":"Mario dispara contra su vecino con intención de matarlo, pero no lo alcanza por la intervención de un tercero. En la tentativa, el COIP dispone que se imponga:","o":[["De un tercio a dos tercios de la pena del delito consumado.","Correcta. Lo dispone el art. 39 COIP para actos idóneos que no logran consumarse por circunstancias ajenas a la voluntad del autor."],["La misma pena prevista para el delito consumado, sin reducción.","Incorrecta. La ley prevé una pena reducida para la tentativa."],["Ninguna pena, porque no se produjo el resultado de muerte.","Incorrecta. La tentativa es punible en los delitos dolosos."],["Siempre la mitad exacta de la pena del delito consumado.","Incorrecta. La ley fija un rango (de un tercio a dos tercios), no una fracción única."]],"r":["COIP"]},
{"id":"A2-05","a":2,"s":"Derecho Penal (parte general)","t":"Autoría y participación","ra":"Clasifica las formas de participación penal reconocidas en el COIP.","d":"Analizar","q":"Un adulto ordena a un adolescente de quince años sustraer un teléfono celular, valiéndose de su ascendencia sobre él. Según el COIP, el adulto responde como:","o":[["Autor mediato, por valerse de otra persona para cometerla.","Correcta. Es un supuesto de autoría mediata del art. 42 num. 2 COIP; el adolescente queda sujeto al régimen especial (art. 38 COIP)."],["Cómplice, porque no ejecutó materialmente la sustracción.","Incorrecta. El cómplice coopera con actos secundarios (art. 43 COIP); aquí el adulto domina el hecho."],["Encubridor, por aprovecharse del resultado del delito.","Incorrecta. El COIP solo reconoce como formas de participación la autoría y la complicidad (art. 41 COIP)."],["No responde, porque el ejecutor material es inimputable.","Incorrecta. La inimputabilidad del ejecutor no excluye la responsabilidad del autor mediato."]],"r":["COIP"]},
{"id":"A2-06","a":2,"s":"Derecho Penal (parte general)","t":"Culpa","ra":"Diferencia el dolo, la preterintención y la culpa en casos concretos.","d":"Analizar","q":"Una médica, al no aplicar los protocolos exigibles, causa la muerte de un paciente sin intención de dañarlo. Según el COIP, su conducta es:","o":[["Culposa, por infringir el deber objetivo de cuidado.","Correcta. Es la definición de culpa del art. 27 COIP; el art. 146 COIP tipifica el homicidio culposo por mala práctica profesional."],["Dolosa, porque la muerte causada por un profesional se presume intencional.","Incorrecta. El dolo exige designio de causar daño (art. 26 COIP) y no se presume."],["Atípica, porque solo se sancionan las conductas dolosas.","Incorrecta. La culpa es punible cuando está tipificada como infracción (art. 27 COIP)."],["Preterintencional, porque quiso causar un resultado menor.","Incorrecta. La preterintención exige voluntad de causar un daño menor; aquí no hubo intención de dañar."]],"r":["COIP"]},
{"id":"A2-07","a":2,"s":"Derecho Penal (parte especial)","t":"Robo y hurto","ra":"Subsume hechos en los tipos de delitos contra la propiedad.","d":"Aplicar","q":"Durante la noche, Luis rompe la ventana de un vehículo estacionado, sin ocupantes, y se apodera de una computadora portátil. ¿Qué infracción comete según el COIP?","o":[["Robo, porque hubo fuerza en las cosas.","Correcta. El art. 189 COIP sanciona el robo cometido con violencia, amenaza o fuerza en las cosas."],["Hurto, porque no hubo violencia contra las personas.","Incorrecta. El hurto (art. 196 COIP) supone apoderamiento sin violencia, amenaza ni fuerza en las cosas."],["Únicamente daño a bien ajeno por la ventana rota.","Incorrecta. La rotura fue el medio para la sustracción, que es la conducta principal."],["Abigeato, por tratarse de un bien mueble ajeno.","Incorrecta. El abigeato recae sobre ganado."]],"r":["COIP"]},
{"id":"A2-08","a":2,"s":"Derecho Procesal Penal","t":"Ejercicio de la acción penal","ra":"Distingue los delitos de ejercicio público y privado de la acción.","d":"Recordar","q":"¿Cuál de las siguientes infracciones es de ejercicio privado de la acción penal según el COIP?","o":[["Calumnia.","Correcta. Figura en el catálogo del art. 415 COIP junto con usurpación, estupro y ciertas lesiones de hasta treinta días."],["Estafa.","Incorrecta. Es de ejercicio público, a cargo de la Fiscalía."],["Lesiones leves por violencia intrafamiliar.","Incorrecta. El art. 415 COIP excluye expresamente estos casos del ejercicio privado."],["Peculado.","Incorrecta. Es de ejercicio público y además imprescriptible (art. 233 CRE)."]],"r":["COIP"]},
{"id":"A2-09","a":2,"s":"Derecho Procesal Penal","t":"Prisión preventiva","ra":"Verifica los requisitos legales de la prisión preventiva.","d":"Comprender","q":"Para ordenar la prisión preventiva, el COIP exige, entre otros requisitos, que:","o":[["La infracción tenga pena privativa de libertad superior a un año.","Correcta. Son requisitos del art. 534 COIP, junto con los elementos de convicción sobre el delito y la participación."],["La infracción tenga pena privativa de libertad superior a cinco años.","Incorrecta. El umbral legal es una pena superior a un año."],["La persona procesada registre antecedentes penales previos.","Incorrecta. No es un requisito legal."],["La Fiscalía la solicite por la alarma social que causó el hecho.","Incorrecta. La alarma social no es criterio legal; la prisión preventiva es excepcional (art. 77 num. 1 CRE)."]],"r":["COIP","CRE"]},
{"id":"A2-10","a":2,"s":"Derecho Procesal Penal","t":"Caducidad de la prisión preventiva","ra":"Aplica los plazos constitucionales y legales de caducidad de la prisión preventiva.","d":"Aplicar","q":"Una persona procesada por un delito sancionado con pena de hasta cinco años permanece siete meses en prisión preventiva sin sentencia, sin dilaciones atribuibles a ella. ¿Qué ocurre?","o":[["Caducó al exceder seis meses; debe recuperar su libertad.","Correcta. Lo disponen el art. 77 num. 9 CRE y el art. 541 COIP (seis meses para delitos de hasta cinco años)."],["No ha caducado, porque el plazo aplicable es de un año.","Incorrecta. El plazo de un año aplica a delitos sancionados con más de cinco años."],["No caduca mientras el proceso penal siga activo.","Incorrecta. La caducidad es una garantía constitucional."],["Se convierte automáticamente en arresto domiciliario.","Incorrecta. La ley no prevé esa conversión automática."]],"r":["CRE","COIP"]},
{"id":"A2-11","a":2,"s":"Derecho Procesal Penal","t":"Etapas del proceso","ra":"Identifica la estructura del procedimiento penal ordinario.","d":"Recordar","q":"Según el COIP, el procedimiento penal ordinario se desarrolla en las siguientes etapas:","o":[["Instrucción; evaluación y preparatoria de juicio; y juicio.","Correcta. Son las tres etapas del art. 589 COIP."],["Investigación previa, instrucción y juicio.","Incorrecta. La investigación previa es una fase preprocesal (art. 580 COIP), no una etapa."],["Indagación, instrucción fiscal, etapa intermedia y plenario.","Incorrecta. Es una estructura propia del Código de Procedimiento Penal derogado."],["Instrucción, juicio e impugnación.","Incorrecta. La impugnación no es una etapa del procedimiento ordinario."]],"r":["COIP"]},
{"id":"A2-12","a":2,"s":"Derecho Procesal Penal","t":"Flagrancia","ra":"Aplica los plazos de la audiencia de calificación de flagrancia.","d":"Recordar","q":"Una persona es aprehendida en delito flagrante. ¿En qué plazo debe realizarse la audiencia de calificación de flagrancia?","o":[["Dentro de las veinticuatro horas siguientes a la aprehensión.","Correcta. Lo disponen el art. 77 num. 1 CRE y el art. 529 COIP."],["Dentro de las cuarenta y ocho horas siguientes a la aprehensión.","Incorrecta. Excede el plazo constitucional."],["Dentro de las setenta y dos horas siguientes a la aprehensión.","Incorrecta. Excede el plazo constitucional."],["Dentro de los ocho días siguientes a la aprehensión.","Incorrecta. Excede ampliamente el plazo constitucional."]],"r":["CRE","COIP"]},
{"id":"A2-13","a":2,"s":"Derecho Procesal Penal","t":"Procedimiento abreviado","ra":"Determina la procedencia de los procedimientos especiales del COIP.","d":"Analizar","q":"En un proceso por un delito cuya pena máxima es de siete años, la defensa evalúa el procedimiento abreviado. Según el COIP:","o":[["Procede, porque cabe en infracciones con pena máxima de hasta diez años.","Correcta. Son las reglas del art. 635 COIP."],["No procede, porque solo cabe en delitos flagrantes de hasta cinco años.","Incorrecta. Confunde el abreviado con el procedimiento directo (art. 640 COIP)."],["Procede, y el juez puede imponer una pena mayor a la sugerida por Fiscalía.","Incorrecta. La pena no puede ser superior a la sugerida por la Fiscalía."],["Procede aun sin aceptación del procesado si la Fiscalía tiene prueba suficiente.","Incorrecta. El consentimiento libre y la admisión del hecho son indispensables."]],"r":["COIP"]},
{"id":"A2-14","a":2,"s":"Derecho Procesal Penal","t":"Recurso de casación","ra":"Determina la naturaleza y límites del recurso de casación penal.","d":"Evaluar","q":"La defensa interpone casación pidiendo a la Corte Nacional que vuelva a valorar los testimonios practicados en juicio. ¿Es procedente?","o":[["No, porque en casación no cabe volver a valorar la prueba.","Correcta. Así lo dispone el art. 656 COIP."],["Sí, porque la casación funciona como una tercera instancia.","Incorrecta. La casación es un recurso extraordinario de derecho, no una instancia."],["Sí, siempre que los testimonios hayan sido contradictorios.","Incorrecta. La contradicción en la prueba no habilita su revaloración en casación."],["Solo si lo autoriza previamente el tribunal de juicio.","Incorrecta. No existe tal autorización."]],"r":["COIP"]},
{"id":"A2-15","a":2,"s":"Derecho Procesal Penal","t":"Prueba ilícita","ra":"Aplica el principio de exclusión probatoria.","d":"Evaluar","q":"La Fiscalía pretende introducir en juicio una grabación de comunicaciones privadas del procesado obtenida sin autorización judicial. Según la Constitución y el COIP:","o":[["Carece de eficacia probatoria por ser ilícita y debe excluirse.","Correcta. Lo disponen el art. 76 num. 4 CRE y el principio de exclusión del art. 454 num. 6 COIP."],["Es válida si demuestra la verdad de los hechos investigados.","Incorrecta. La búsqueda de la verdad no legitima la prueba obtenida con violación de derechos."],["Es válida si se somete a la cadena de custodia correspondiente.","Incorrecta. La cadena de custodia asegura la integridad del elemento, no subsana su ilicitud de origen."],["Su admisión depende de que la defensa no la objete en juicio.","Incorrecta. La exclusión de la prueba ilícita no depende de la objeción de las partes."]],"r":["CRE","COIP"]},
{"id":"A3-01","a":3,"s":"Derecho Procesal (COGEP)","t":"Procedimiento monitorio","ra":"Selecciona la vía procesal idónea según la naturaleza de la pretensión.","d":"Aplicar","q":"Un carpintero reclama USD 3.000 por muebles entregados. La deuda es determinada, líquida, exigible y de plazo vencido, pero solo tiene una factura no aceptada y correos del cliente, sin título ejecutivo. ¿Qué procedimiento del COGEP es idóneo?","o":[["El procedimiento monitorio.","Correcta. Procede para deudas dinerarias líquidas, exigibles y de plazo vencido que no excedan de cincuenta salarios básicos unificados y carezcan de título ejecutivo (art. 356 COGEP)."],["El procedimiento ejecutivo.","Incorrecta. Requiere un título ejecutivo (art. 347 COGEP)."],["El procedimiento sumario.","Incorrecta. No es la vía prevista para el cobro de deudas dinerarias en estas condiciones."],["El procedimiento ordinario, por la cuantía.","Incorrecta. No existe esa regla de cuantía; el monitorio es la vía específica."]],"r":["COGEP"]},
{"id":"A3-02","a":3,"s":"Derecho Procesal (COGEP)","t":"Títulos ejecutivos y de ejecución","ra":"Distingue títulos ejecutivos de títulos de ejecución.","d":"Comprender","q":"¿Cuál de los siguientes documentos es un título ejecutivo, y no un título de ejecución, según el COGEP?","o":[["Un pagaré a la orden.","Correcta. Figura entre los títulos ejecutivos del art. 347 COGEP, que se tramitan en procedimiento ejecutivo."],["Una sentencia ejecutoriada.","Incorrecta. Es título de ejecución (art. 363 COGEP)."],["Un acta de mediación.","Incorrecta. Es título de ejecución (art. 363 COGEP)."],["Un laudo arbitral.","Incorrecta. Es título de ejecución (art. 363 COGEP)."]],"r":["COGEP"]},
{"id":"A3-03","a":3,"s":"Derecho Procesal (COGEP)","t":"Carga de la prueba","ra":"Aplica las reglas de distribución de la carga probatoria.","d":"Aplicar","q":"En un proceso civil, la demandada contesta negando de forma simple y absoluta los hechos de la demanda. Según el COGEP, ¿a quién corresponde probar?","o":[["A la parte actora, respecto de los hechos que afirmó y fueron negados.","Correcta. Es la regla del art. 169 COGEP."],["Siempre a la parte demandada, por haber negado los hechos.","Incorrecta. Invierte la regla general sin base legal."],["Al juzgador, que debe ordenar la prueba de oficio.","Incorrecta. La prueba de oficio es excepcional (art. 168 COGEP) y no sustituye la carga de las partes."],["A ambas partes por igual, en todos los casos.","Incorrecta. La ley distribuye la carga según la posición de las partes."]],"r":["COGEP"]},
{"id":"A3-04","a":3,"s":"Derecho Procesal (COGEP)","t":"Inasistencia a audiencias","ra":"Determina los efectos procesales de la inasistencia a audiencias.","d":"Recordar","q":"La parte actora no comparece, sin justificación, a la audiencia preliminar de un procedimiento ordinario. ¿Cuál es la consecuencia según el COGEP?","o":[["Su inasistencia se entiende como abandono.","Correcta. Lo dispone el art. 87 num. 1 COGEP."],["Se suspende la audiencia y se convoca nuevamente.","Incorrecta. La ley asigna un efecto directo a la inasistencia injustificada."],["El proceso continúa en rebeldía del actor.","Incorrecta. La continuación en rebeldía es la consecuencia prevista para la parte demandada (art. 87 num. 2 COGEP)."],["Se acepta automáticamente la reconvención.","Incorrecta. No existe esa consecuencia automática."]],"r":["COGEP"]},
{"id":"A3-05","a":3,"s":"Derecho Procesal (COGEP)","t":"Abandono","ra":"Aplica los requisitos y plazos del abandono del proceso.","d":"Recordar","q":"Todas las partes de un proceso civil han dejado de impulsarlo. Según el COGEP, el abandono se declara cuando la inactividad alcanza:","o":[["El término de ochenta días.","Correcta. Lo dispone el art. 245 COGEP; no procede en las causas exceptuadas por el art. 247."],["El plazo de seis meses.","Incorrecta. No es el tiempo previsto en el COGEP."],["El término de treinta días.","Incorrecta. Es inferior al previsto en la ley."],["El plazo de un año.","Incorrecta. No es el tiempo previsto en el COGEP."]],"r":["COGEP"]},
{"id":"A3-06","a":3,"s":"Derecho Procesal (COGEP)","t":"Contestación a la demanda","ra":"Identifica los términos procesales del procedimiento ordinario.","d":"Recordar","q":"En un procedimiento ordinario, ¿de qué término dispone la parte demandada para contestar la demanda según el COGEP?","o":[["Treinta días desde la citación.","Correcta. Lo dispone el art. 291 COGEP."],["Quince días desde la citación.","Incorrecta. Es el término del procedimiento sumario (art. 333 COGEP)."],["Diez días desde la calificación de la demanda.","Incorrecta. No corresponde a la contestación en el ordinario."],["Sesenta días desde la citación.","Incorrecta. Excede el término legal."]],"r":["COGEP"]},
{"id":"A3-07","a":3,"s":"Derecho Procesal (COGEP)","t":"Recurso de casación","ra":"Aplica los requisitos de forma y tiempo del recurso de casación civil.","d":"Aplicar","q":"Contra una sentencia de segunda instancia en un proceso de conocimiento civil, la parte vencida desea interponer casación. Según el COGEP, debe hacerlo:","o":[["Por escrito, en el término de treinta días desde la ejecutoria.","Correcta. Es la regla del art. 266 COGEP."],["Oralmente, en la misma audiencia de segunda instancia.","Incorrecta. La casación se interpone por escrito."],["Por escrito, en el término de diez días desde la notificación.","Incorrecta. No es el término de la casación."],["Ante la Corte Constitucional, en el término de veinte días.","Incorrecta. Confunde la casación con la acción extraordinaria de protección."]],"r":["COGEP"]},
{"id":"A3-08","a":3,"s":"Métodos Alternativos","t":"Nulidad del laudo arbitral","ra":"Identifica los medios de impugnación del laudo arbitral.","d":"Aplicar","q":"Una parte considera que el laudo arbitral resolvió materias no sometidas al arbitraje. Según la Ley de Arbitraje y Mediación, puede:","o":[["Interponer acción de nulidad en el término de diez días.","Correcta. Es una de las causales y el trámite del art. 31 de la Ley de Arbitraje y Mediación."],["Apelar el laudo ante la Corte Provincial de Justicia.","Incorrecta. Los laudos solo admiten aclaración o ampliación (art. 30 LAM)."],["Interponer recurso de casación ante la Corte Nacional.","Incorrecta. La casación no procede contra laudos arbitrales."],["Presentar acción de protección como vía ordinaria de impugnación.","Incorrecta. La acción de protección no sustituye los mecanismos legales de impugnación del laudo."]],"r":["LAM"]},
{"id":"A3-09","a":3,"s":"Métodos Alternativos","t":"Acta de mediación","ra":"Comprende los efectos jurídicos del acta de mediación.","d":"Comprender","q":"Dos socios suscriben en un centro de mediación un acta con acuerdo total. Si uno incumple, según la Ley de Arbitraje y Mediación:","o":[["Se ejecuta como sentencia ejecutoriada, por la vía de apremio.","Correcta. Lo dispone el art. 47 LAM; el COGEP la reconoce como título de ejecución (art. 363)."],["Debe iniciarse un juicio ordinario para que se reconozca.","Incorrecta. El acta se ejecuta directamente."],["El acta solo vale como un documento privado reconocido.","Incorrecta. La ley le confiere efecto de sentencia ejecutoriada."],["Debe homologarse previamente ante la Corte Constitucional.","Incorrecta. No existe tal requisito."]],"r":["LAM","COGEP"]},
{"id":"A3-10","a":3,"s":"Métodos Alternativos","t":"Arbitraje y Estado","ra":"Aplica las reglas constitucionales del arbitraje en la contratación pública.","d":"Aplicar","q":"Una empresa contratista y una entidad pública desean pactar arbitraje en un contrato de contratación pública. Según la Constitución:","o":[["Procede el arbitraje en derecho, previo pronunciamiento de la Procuraduría.","Correcta. Así lo dispone el art. 190 inc. 2 CRE."],["Procede libremente el arbitraje en equidad, por acuerdo de las partes.","Incorrecta. En contratación pública la Constitución exige arbitraje en derecho."],["El arbitraje está prohibido cuando interviene una entidad del Estado.","Incorrecta. La Constitución lo permite con requisitos."],["Solo procede con autorización previa de la Corte Constitucional.","Incorrecta. La autorización corresponde a la Procuraduría General del Estado."]],"r":["CRE","LAM"]},
{"id":"A4-01","a":4,"s":"Personas y Familia","t":"Existencia legal de la persona","ra":"Identifica el inicio de la existencia legal de la persona natural.","d":"Recordar","q":"Según el Código Civil, la existencia legal de una persona principia:","o":[["Al nacer, al separarse completamente de su madre.","Correcta. Es la regla del art. 60 del Código Civil."],["Desde la concepción, para todos los efectos patrimoniales.","Incorrecta. El que está por nacer es protegido (art. 61 CC; art. 45 CRE), pero sus derechos patrimoniales quedan en suspenso hasta el nacimiento."],["Al inscribirse el nacimiento en el Registro Civil.","Incorrecta. La inscripción prueba, pero no constituye la existencia legal."],["A las veinticuatro horas de vida, si el nacido es viable.","Incorrecta. El criterio de viabilidad no rige en el Código Civil ecuatoriano."]],"r":["CC","CRE"]},
{"id":"A4-02","a":4,"s":"Personas y Familia","t":"Unión de hecho","ra":"Comprende el reconocimiento constitucional de la unión de hecho.","d":"Comprender","q":"Carla y Diego, ambos libres de vínculo matrimonial, mantienen una unión estable y monogámica y forman un hogar de hecho. Según la Constitución:","o":[["Genera los mismos derechos y obligaciones que el matrimonio, según la ley.","Correcta. Lo dispone el art. 68 CRE; el Código Civil la regula a partir del art. 222."],["Solo genera derechos patrimoniales si luego contraen matrimonio civil.","Incorrecta. La unión de hecho produce efectos propios."],["Genera derechos personales, pero no da origen a sociedad de bienes.","Incorrecta. El art. 68 CRE reconoce la sociedad de bienes."],["Solo se reconoce jurídicamente si tienen hijos en común.","Incorrecta. La existencia de hijos no es requisito."]],"r":["CRE","CC"]},
{"id":"A4-03","a":4,"s":"Personas y Familia","t":"Derecho de alimentos","ra":"Aplica los titulares del derecho de alimentos en la legislación de niñez y adolescencia.","d":"Aplicar","q":"Un joven de veinte años cursa estudios universitarios y carece de recursos propios suficientes. Según el Código de la Niñez y Adolescencia:","o":[["Conserva el derecho hasta los veintiún años, por cursar estudios.","Correcta. Es uno de los supuestos de titularidad del derecho de alimentos del Título V, Libro II del CONA."],["Pierde el derecho al cumplir dieciocho años, sin excepción alguna.","Incorrecta. La ley prevé la extensión hasta los veintiún años por estudios."],["Conserva el derecho indefinidamente mientras siga estudiando.","Incorrecta. La extensión por estudios tiene un límite de edad."],["Solo lo conserva si además tiene una discapacidad.","Incorrecta. La discapacidad es un supuesto distinto, que no está sujeto a ese límite de edad."]],"r":["CONA"]},
{"id":"A4-04","a":4,"s":"Bienes","t":"Título y modo","ra":"Distingue título y modo en la adquisición del dominio.","d":"Comprender","q":"La compraventa de un inmueble, celebrada por escritura pública, constituye en la teoría del título y el modo:","o":[["El título; el dominio se adquiere luego por la tradición.","Correcta. Los modos son ocupación, accesión, tradición, sucesión por causa de muerte y prescripción (art. 603 CC); la compraventa solo genera obligaciones."],["Por sí sola, un modo de adquirir el dominio del inmueble.","Incorrecta. La compraventa es un contrato que genera obligaciones, no un modo."],["Una forma de ocupación, por la entrega del bien.","Incorrecta. La ocupación recae sobre cosas sin dueño."],["Una forma de accesión, por la unión al patrimonio.","Incorrecta. La accesión opera por lo que produce o se junta a una cosa."]],"r":["CC"]},
{"id":"A4-05","a":4,"s":"Bienes","t":"Tradición de inmuebles","ra":"Aplica las reglas de la tradición de bienes raíces.","d":"Aplicar","q":"Rosa firmó la escritura de compraventa de una casa y pagó el precio, pero la escritura no ha sido inscrita en el Registro de la Propiedad. Rosa:","o":[["Aún no adquiere el dominio, porque falta la inscripción.","Correcta. Lo dispone el art. 702 del Código Civil."],["Es propietaria desde la firma de la escritura pública.","Incorrecta. La escritura es el título; falta el modo."],["Es propietaria desde que pagó la totalidad del precio.","Incorrecta. El pago extingue su obligación, pero no transfiere el dominio."],["Es propietaria desde la entrega material de la casa.","Incorrecta. La entrega material no sustituye la inscripción en los inmuebles."]],"r":["CC"]},
{"id":"A4-06","a":4,"s":"Bienes","t":"Posesión y mera tenencia","ra":"Distingue posesión y mera tenencia para efectos de la prescripción.","d":"Analizar","q":"Un arrendatario que ocupa un departamento desde hace quince años pretende demandar la prescripción adquisitiva de dominio. Su pretensión:","o":[["No prospera, porque es mero tenedor y no poseedor.","Correcta. La posesión exige ánimo de señor y dueño (art. 715 CC) y la mera tenencia no habilita la prescripción (art. 729 CC)."],["Prospera, por haber superado los quince años de ocupación.","Incorrecta. El tiempo no basta sin posesión."],["Prospera si pagó puntualmente todos los cánones.","Incorrecta. El pago de cánones confirma que reconoce dominio ajeno."],["Prospera como prescripción ordinaria a los cinco años.","Incorrecta. La ordinaria exige posesión regular, que el arrendatario no tiene."]],"r":["CC"]},
{"id":"A4-07","a":4,"s":"Bienes","t":"Prescripción adquisitiva","ra":"Aplica los plazos de la prescripción adquisitiva de dominio.","d":"Recordar","q":"Una persona posee un inmueble con ánimo de señor y dueño, de forma pública, pacífica e ininterrumpida, pero sin justo título. ¿Qué tiempo exige el Código Civil para adquirirlo por prescripción extraordinaria?","o":[["Quince años.","Correcta. Lo dispone el art. 2411 del Código Civil."],["Cinco años.","Incorrecta. Es el plazo de la prescripción ordinaria de inmuebles (art. 2408 CC), que exige posesión regular."],["Tres años.","Incorrecta. Es el plazo de la prescripción ordinaria de muebles."],["Diez años.","Incorrecta. No corresponde a la prescripción adquisitiva extraordinaria."]],"r":["CC"]},
{"id":"A4-08","a":4,"s":"Obligaciones y Contratos","t":"Requisitos del acto jurídico","ra":"Identifica los requisitos de validez para obligarse.","d":"Recordar","q":"Para que una persona se obligue a otra por un acto o declaración de voluntad, el Código Civil exige:","o":[["Capacidad, consentimiento sin vicios, objeto lícito y causa lícita.","Correcta. Es el art. 1461 del Código Civil."],["Capacidad, consentimiento, objeto lícito y forma escrita.","Incorrecta. La forma escrita no es requisito general."],["Capacidad, consentimiento, precio y tradición de la cosa.","Incorrecta. Mezcla elementos de la compraventa con el modo de adquirir."],["Competencia, objeto, voluntad, procedimiento y motivación.","Incorrecta. Son requisitos del acto administrativo (art. 99 COA)."]],"r":["CC"]},
{"id":"A4-09","a":4,"s":"Obligaciones y Contratos","t":"Vicios del consentimiento","ra":"Identifica los vicios del consentimiento.","d":"Recordar","q":"Según el Código Civil, los vicios de que puede adolecer el consentimiento son:","o":[["Error, fuerza y dolo.","Correcta. Es el art. 1467 del Código Civil."],["Error, fuerza, dolo y lesión enorme.","Incorrecta. La lesión enorme opera en ciertos contratos, como la compraventa de inmuebles, pero no figura entre los vicios del consentimiento."],["Simulación, fraude y error.","Incorrecta. La simulación y el fraude son figuras distintas."],["Incapacidad, error y violencia.","Incorrecta. La incapacidad afecta la capacidad, no el consentimiento."]],"r":["CC"]},
{"id":"A4-10","a":4,"s":"Obligaciones y Contratos","t":"Condición resolutoria tácita","ra":"Aplica los remedios frente al incumplimiento contractual.","d":"Aplicar","q":"En una compraventa, el comprador no paga el precio en la fecha pactada. El vendedor, que sí cumplió, puede según el Código Civil:","o":[["Pedir la resolución o el cumplimiento, con indemnización de perjuicios.","Correcta. Es la condición resolutoria tácita del art. 1505 del Código Civil."],["Solo pedir el cumplimiento forzoso de la obligación de pago.","Incorrecta. La ley le permite elegir entre resolución y cumplimiento."],["Declarar unilateralmente resuelto el contrato, sin acudir al juez.","Incorrecta. La resolución por condición resolutoria tácita requiere declaración judicial."],["Solo pedir indemnización de perjuicios, sin resolución.","Incorrecta. La indemnización es accesoria a la resolución o al cumplimiento."]],"r":["CC"]},
{"id":"A4-11","a":4,"s":"Obligaciones y Contratos","t":"Excepción de contrato no cumplido","ra":"Aplica la mora en los contratos bilaterales.","d":"Analizar","q":"En un contrato bilateral, A demanda a B por falta de pago, pero A tampoco entregó la mercadería que debía entregar primero. B puede oponer:","o":[["La excepción de contrato no cumplido.","Correcta. Lo dispone el art. 1568 del Código Civil."],["La prescripción extintiva de la acción.","Incorrecta. Nada indica que haya transcurrido el plazo de prescripción."],["La nulidad absoluta del contrato.","Incorrecta. El incumplimiento no es causa de nulidad."],["La novación de la obligación demandada.","Incorrecta. No hay sustitución de una obligación por otra."]],"r":["CC"]},
{"id":"A4-12","a":4,"s":"Obligaciones y Contratos","t":"Nulidad absoluta","ra":"Distingue los efectos de la nulidad absoluta y relativa.","d":"Evaluar","q":"Un contrato adolece de objeto ilícito. ¿Cuál afirmación es correcta?","o":[["Es nulidad absoluta, que el juez puede declarar de oficio.","Correcta. Así lo disponen los arts. 1698 y 1699 del Código Civil."],["Es nulidad relativa, que se sanea en cuatro años.","Incorrecta. El objeto ilícito produce nulidad absoluta."],["Las partes pueden ratificarlo por escritura pública.","Incorrecta. La nulidad absoluta no se sanea por ratificación."],["Solo puede alegarla quien contrató sabiendo el vicio.","Incorrecta. Precisamente esa persona está impedida de alegarla."]],"r":["CC"]},
{"id":"A4-13","a":4,"s":"Sucesiones","t":"Órdenes de sucesión intestada","ra":"Aplica los órdenes de sucesión intestada.","d":"Aplicar","q":"Juan fallece sin testamento. Le sobreviven su cónyuge, dos hijos y su madre. Según el Código Civil:","o":[["Heredan los hijos, sin perjuicio de la porción conyugal.","Correcta. Es el primer orden de sucesión (art. 1023 del Código Civil)."],["Se divide por partes iguales entre cónyuge, hijos y madre.","Incorrecta. Ignora la exclusión del primer orden."],["La madre y la cónyuge heredan cada una la mitad.","Incorrecta. Esa división corresponde al orden de ascendientes y cónyuge, cuando no hay descendientes."],["Hereda el Estado, a falta de testamento.","Incorrecta. El Estado solo sucede a falta de los demás órdenes."]],"r":["CC"]},
{"id":"A4-14","a":4,"s":"Sucesiones","t":"Testamento","ra":"Comprende la naturaleza jurídica del testamento.","d":"Comprender","q":"Según el Código Civil, la característica esencial del testamento es que:","o":[["Es revocable mientras viva el testador.","Correcta. El art. 1037 CC lo define como acto más o menos solemne en que se conserva la facultad de revocar sus disposiciones."],["Puede otorgarse conjuntamente por dos o más personas.","Incorrecta. El testamento es un acto de una sola persona."],["Es irrevocable una vez otorgado ante notario.","Incorrecta. La solemnidad no le quita su revocabilidad."],["Produce efectos desde el momento de su otorgamiento.","Incorrecta. Sus disposiciones surten efecto después de la muerte del testador."]],"r":["CC"]},
{"id":"A4-15","a":4,"s":"Sucesiones","t":"Derecho de representación","ra":"Aplica el derecho de representación en la sucesión intestada.","d":"Analizar","q":"Pedro fallece sin testamento. Tenía tres hijos, pero uno de ellos, Luis, murió antes que él dejando dos hijos. ¿Cómo se distribuye la herencia?","o":[["En tres partes; los nietos reciben por estirpe la de Luis.","Correcta. La representación permite a los descendientes ocupar el lugar del padre premuerto (arts. 1024 y siguientes del Código Civil)."],["En cuatro partes iguales, una por cabeza para cada heredero.","Incorrecta. Quienes heredan por representación lo hacen por estirpe."],["Solo entre los dos hijos que sobrevivieron al causante.","Incorrecta. Desconoce la representación."],["Los nietos heredan solo si Luis dejó testamento.","Incorrecta. La representación opera por ley en la sucesión intestada."]],"r":["CC"]},
{"id":"A4-16","a":4,"s":"Sucesiones","t":"Partición","ra":"Aplica las reglas sobre la indivisión hereditaria.","d":"Aplicar","q":"Tres hermanos heredan un inmueble en común. Uno solicita la partición, pero los otros se niegan alegando que deben esperar diez años. Según el Código Civil:","o":[["La partición puede pedirse siempre, salvo pacto de indivisión.","Correcta. Es la regla del art. 1338 del Código Civil."],["Deben esperar diez años desde la apertura de la sucesión.","Incorrecta. No existe ese plazo."],["La partición requiere la unanimidad de los herederos.","Incorrecta. Cualquier coasignatario puede pedirla."],["Solo el juez puede disponerla de oficio, sin pedido.","Incorrecta. La partición se pide a instancia de los coasignatarios."]],"r":["CC"]},
{"id":"A5-01","a":5,"s":"Laboral","t":"Despido intempestivo","ra":"Calcula la indemnización por despido intempestivo.","d":"Aplicar","q":"Un trabajador con cinco años de servicio es despedido intempestivamente. Según el artículo 188 del Código del Trabajo, la indemnización por despido equivale a:","o":[["Un mes de remuneración por cada año de servicio.","Correcta. Para más de tres años de servicio corresponde un mes por año, sin exceder de veinticinco meses (art. 188 CT)."],["Tres meses de remuneración, sin importar los años.","Incorrecta. Es el monto para quien tiene hasta tres años de servicio."],["Veinticinco meses de remuneración en todos los casos.","Incorrecta. Es el tope máximo de la indemnización."],["El veinticinco por ciento de la remuneración por cada año.","Incorrecta. Es la bonificación por desahucio (art. 185 CT), distinta de la indemnización."]],"r":["CT"]},
{"id":"A5-02","a":5,"s":"Laboral","t":"Período de prueba","ra":"Identifica los límites del período de prueba.","d":"Recordar","q":"En el primer contrato de trabajo por tiempo indefinido, el período de prueba según el Código del Trabajo:","o":[["Tiene una duración máxima de noventa días.","Correcta. Lo dispone el art. 15 del Código del Trabajo."],["Puede pactarse por un plazo de hasta un año.","Incorrecta. Excede el máximo legal."],["Dura seis meses y puede renovarse una vez.","Incorrecta. Excede el máximo legal y no es renovable."],["Puede pactarse otra vez en cada renovación del contrato.","Incorrecta. La ley no permite un nuevo período de prueba con el mismo trabajador."]],"r":["CT"]},
{"id":"A5-03","a":5,"s":"Laboral","t":"Prescripción laboral","ra":"Aplica los plazos de prescripción de las acciones laborales.","d":"Recordar","q":"Un extrabajador quiere reclamar haberes impagos. Según el Código del Trabajo, las acciones provenientes de actos o contratos de trabajo prescriben en:","o":[["Tres años desde la terminación de la relación laboral.","Correcta. Lo dispone el art. 635 del Código del Trabajo."],["Un año desde la terminación de la relación laboral.","Incorrecta. No es la regla general."],["Cinco años desde la terminación de la relación laboral.","Incorrecta. No es la regla laboral."],["Nunca, porque los créditos laborales son imprescriptibles.","Incorrecta. Los derechos son irrenunciables, pero las acciones prescriben."]],"r":["CT"]},
{"id":"A5-04","a":5,"s":"Laboral","t":"Irrenunciabilidad","ra":"Aplica los principios constitucionales del derecho al trabajo.","d":"Evaluar","q":"Un contrato de trabajo incluye una cláusula por la que el trabajador renuncia a la decimotercera remuneración a cambio de un sueldo mensual mayor. Esa cláusula:","o":[["Es nula, porque los derechos laborales son irrenunciables.","Correcta. Lo disponen el art. 326 num. 2 CRE y el art. 4 del Código del Trabajo; otra cosa es recibir el beneficio de forma mensualizada, que no implica renuncia."],["Es válida por la autonomía de la voluntad de las partes.","Incorrecta. La autonomía de la voluntad está limitada por normas de orden público laboral."],["Es válida si se celebra y reconoce ante notario.","Incorrecta. La forma no convalida la renuncia."],["Es válida si el trabajador tiene título profesional.","Incorrecta. La irrenunciabilidad protege a todo trabajador."]],"r":["CRE","CT"]},
{"id":"A5-05","a":5,"s":"Mercantil","t":"Sociedad por acciones simplificada","ra":"Selecciona la forma societaria adecuada a un emprendimiento.","d":"Aplicar","q":"Una emprendedora desea constituir sola una sociedad, con responsabilidad limitada y mediante un trámite simplificado. Conforme a la Ley de Compañías, reformada por la Ley Orgánica de Emprendimiento e Innovación, la figura idónea es:","o":[["La sociedad por acciones simplificada.","Correcta. Es la figura incorporada por la Ley Orgánica de Emprendimiento e Innovación (2020)."],["La compañía en nombre colectivo.","Incorrecta. Sus socios responden solidaria e ilimitadamente."],["La compañía en comandita simple.","Incorrecta. Requiere al menos un socio de responsabilidad ilimitada."],["La compañía de economía mixta.","Incorrecta. Requiere participación del sector público."]],"r":["LC","LOEI"]},
{"id":"A5-06","a":5,"s":"Mercantil","t":"Responsabilidad por fraude societario","ra":"Aplica la responsabilidad personal por fraudes cometidos a nombre de compañías.","d":"Analizar","q":"Los administradores de una compañía la utilizan para defraudar a acreedores. Según el artículo 17 de la Ley de Compañías:","o":[["Responden personal y solidariamente quienes los ordenaron o se beneficiaron.","Correcta. Es el régimen del art. 17 de la Ley de Compañías."],["Solo responde la compañía, por su personalidad jurídica separada.","Incorrecta. La ley permite alcanzar a los responsables personales."],["Los socios responden ilimitadamente con su patrimonio, en todo caso.","Incorrecta. La responsabilidad se imputa a quienes intervinieron o se beneficiaron."],["Solo la Superintendencia de Compañías puede reclamar los daños.","Incorrecta. Los perjudicados pueden ejercer sus acciones."]],"r":["LC"]},
{"id":"A5-07","a":5,"s":"Tributario","t":"Reserva de ley tributaria","ra":"Evalúa la validez de normas tributarias según la reserva de ley.","d":"Evaluar","q":"El Presidente de la República crea un nuevo impuesto mediante decreto ejecutivo. Según la Constitución, este decreto:","o":[["Es inconstitucional: los impuestos solo se crean mediante ley.","Correcta. Es la reserva de ley del art. 301 CRE."],["Es válido si el Servicio de Rentas Internas lo reglamenta.","Incorrecta. La reglamentación no suple la falta de ley."],["Es válido si se expide durante un estado de excepción.","Incorrecta. En estado de excepción se puede anticipar la recaudación de tributos (art. 165 CRE), no crear impuestos."],["Es válido, porque los tributos pueden crearse por acto normativo.","Incorrecta. Solo las tasas y contribuciones se crean por acto normativo de órgano competente; los impuestos requieren ley."]],"r":["CRE","CTRIB"]},
{"id":"A5-08","a":5,"s":"Tributario","t":"Prescripción de la acción de cobro","ra":"Aplica los plazos de prescripción tributaria.","d":"Aplicar","q":"Un contribuyente presentó oportunamente su declaración, pero no pagó el impuesto. Según el Código Tributario, la acción de cobro prescribe en:","o":[["Cinco años desde que la obligación fue exigible.","Correcta. Es la regla del art. 55 del Código Tributario."],["Siete años desde que la obligación fue exigible.","Incorrecta. Ese plazo aplica cuando no se presentó la declaración."],["Tres años desde la presentación de la declaración.","Incorrecta. Confunde la prescripción del cobro con la caducidad de la facultad determinadora (art. 94 CTrib)."],["Nunca, porque los tributos son imprescriptibles.","Incorrecta. La acción de cobro prescribe."]],"r":["CTRIB"]},
{"id":"A5-09","a":5,"s":"Tributario","t":"Extinción de la obligación tributaria","ra":"Identifica los modos de extinción de la obligación tributaria.","d":"Recordar","q":"¿Cuál de los siguientes NO es un modo de extinción de la obligación tributaria previsto en el Código Tributario?","o":[["La novación.","Correcta (no es modo tributario). El art. 37 CTrib enumera la solución o pago, la compensación, la confusión, la remisión y la prescripción de la acción de cobro."],["La compensación.","Incorrecta. Sí es modo de extinción (art. 37 CTrib)."],["La remisión.","Incorrecta. Sí es modo de extinción; requiere ley (art. 37 CTrib)."],["La confusión.","Incorrecta. Sí es modo de extinción (art. 37 CTrib)."]],"r":["CTRIB"]},
{"id":"A5-10","a":5,"s":"Internacional Privado","t":"Ley aplicable a los bienes","ra":"Aplica los factores de conexión del Derecho Internacional Privado.","d":"Aplicar","q":"Un ciudadano extranjero domiciliado en España es propietario de un inmueble ubicado en Quito. ¿Qué ley rige ese bien?","o":[["La ecuatoriana, por la ubicación del bien.","Correcta. Es el criterio lex rei sitae del Título Preliminar del Código Civil, coincidente con el Código de Bustamante (art. 105)."],["La española, por el domicilio del propietario.","Incorrecta. El domicilio no rige el estatuto real de los inmuebles."],["La que elijan libremente las partes del contrato.","Incorrecta. El régimen de los bienes es de orden público territorial."],["La de la nacionalidad del propietario, según Bustamante.","Incorrecta. El Código de Bustamante también somete los bienes a la ley de su situación."]],"r":["CC","BUST"]},
{"id":"A5-11","a":5,"s":"Internacional Privado","t":"Homologación de sentencias extranjeras","ra":"Determina la autoridad competente para homologar decisiones extranjeras.","d":"Recordar","q":"Una sentencia de divorcio dictada en Italia debe surtir efectos en el Ecuador. Según el COGEP, la homologación corresponde a:","o":[["La Corte Provincial del domicilio del requerido.","Correcta. Es la regla de los arts. 102 a 104 del COGEP."],["La Corte Nacional de Justicia, en sala especializada.","Incorrecta. No es la autoridad competente según el COGEP."],["Una jueza de familia, sin necesidad de homologación.","Incorrecta. La homologación es requisito previo para su eficacia."],["El Ministerio de Relaciones Exteriores, por vía consular.","Incorrecta. La homologación es un acto jurisdiccional."]],"r":["COGEP"]},
{"id":"A5-12","a":5,"s":"Internacional Privado","t":"Apostilla","ra":"Identifica el régimen de validez de documentos públicos extranjeros.","d":"Comprender","q":"Un título universitario emitido en Colombia debe presentarse ante una autoridad ecuatoriana. Ambos Estados son parte del Convenio de La Haya de 1961. ¿Qué formalidad sustituye la cadena de legalizaciones consulares?","o":[["La apostilla emitida en el Estado de origen.","Correcta. El Convenio de La Haya de 1961 reemplaza la legalización por un certificado único de apostilla."],["La homologación ante la Corte Provincial.","Incorrecta. La homologación se aplica a sentencias, laudos y actas de mediación, no a documentos públicos."],["La protocolización notarial en el Ecuador.","Incorrecta. No sustituye la legalización."],["La traducción oficial del documento.","Incorrecta. La traducción puede requerirse, pero no reemplaza la legalización."]],"r":["HCCH"]}];

/* Síntesis de artículos clave (no es texto literal) */
const ART={"CADH 2": "Deber de adoptar disposiciones de derecho interno: los Estados se comprometen a adoptar las medidas legislativas o de otro carácter necesarias para hacer efectivos los derechos de la Convención.", "CADH 5": "Derecho a la integridad personal: nadie debe ser sometido a torturas ni a penas o tratos crueles, inhumanos o degradantes; toda persona privada de libertad será tratada con el respeto debido a la dignidad humana.", "CADH 7": "Derecho a la libertad personal: nadie puede ser privado de su libertad sino por las causas y condiciones fijadas por la ley; prohíbe la detención arbitraria y reconoce el derecho a ser llevado sin demora ante un juez y a ser juzgado en un plazo razonable.", "CADH 8": "Garantías judiciales: derecho a ser oído con las debidas garantías y dentro de un plazo razonable por un juez competente, independiente e imparcial; presunción de inocencia y garantías mínimas de defensa.", "CADH 25": "Protección judicial: derecho a un recurso sencillo, rápido y efectivo ante los jueces contra actos que violen derechos fundamentales.", "CC 45": "Domicilio: consiste en la residencia, acompañada, real o presuntivamente, del ánimo de permanecer en ella.", "CC 60": "Principio de la existencia legal: el nacimiento de una persona fija el principio de su existencia legal, desde que es separada completamente de su madre.", "CC 61": "Protección del que está por nacer: la ley protege la vida del que está por nacer; el juez adoptará las providencias necesarias para protegerla cuando crea que de algún modo peligra.", "CC 283": "Patria potestad: es el conjunto de derechos que tienen los padres sobre sus hijos no emancipados.", "CC 603": "Modos de adquirir el dominio: la ocupación, la accesión, la tradición, la sucesión por causa de muerte y la prescripción.", "CC 702": "Tradición de inmuebles: se efectúa por la inscripción del título en el Registro de la Propiedad; de la misma manera se efectúa la tradición de los derechos de usufructo, uso, habitación o hipoteca sobre inmuebles.", "CC 715": "Posesión: es la tenencia de una cosa determinada con ánimo de señor y dueño, sea que el dueño o el que se da por tal tenga la cosa por sí mismo o por medio de otra persona en su lugar y a su nombre.", "CC 729": "Mera tenencia: la que se ejerce sobre una cosa no como dueño, sino en lugar o a nombre del dueño (por ejemplo, el arrendatario o el depositario); se extiende a todo el que tiene una cosa reconociendo dominio ajeno.", "CC 778": "Usufructo: derecho real que consiste en la facultad de gozar de una cosa con cargo de conservar su forma y sustancia, y de restituirla a su dueño.", "CC 933": "Acción reivindicatoria: es la que tiene el dueño de una cosa singular, de que no está en posesión, para que el poseedor sea condenado a restituírsela.", "CC 1023": "Primer orden de sucesión: los hijos excluyen a los otros herederos, sin perjuicio de la porción conyugal que corresponda al cónyuge sobreviviente.", "CC 1037": "Testamento: acto más o menos solemne en que una persona dispone del todo o de una parte de sus bienes para que tenga pleno efecto después de sus días, conservando la facultad de revocar sus disposiciones mientras viva.", "CC 1205": "Legitimarios: son los hijos, personalmente o representados por su descendencia, y los padres.", "CC 1338": "Acción de partición: ningún coasignatario está obligado a permanecer en la indivisión; la partición puede pedirse siempre, salvo pacto de indivisión, que no puede exceder de cinco años (renovable).", "CC 1461": "Requisitos para obligarse: que la persona sea legalmente capaz, que consienta en el acto y su consentimiento no adolezca de vicio, que recaiga sobre un objeto lícito y que tenga una causa lícita.", "CC 1467": "Vicios del consentimiento: los vicios de que puede adolecer el consentimiento son error, fuerza y dolo.", "CC 1505": "Condición resolutoria tácita: en los contratos bilaterales va envuelta la condición de no cumplirse por uno de los contratantes lo pactado; el otro puede pedir a su arbitrio la resolución o el cumplimiento del contrato, con indemnización de perjuicios.", "CC 1527": "Solidaridad: debe ser expresamente declarada en todos los casos en que no la establece la ley; sin ella, cada deudor responde solo por su cuota.", "CC 1567": "Mora del deudor: el deudor está en mora cuando no ha cumplido en el término estipulado, cuando la cosa solo podía darse o ejecutarse en cierto tiempo que dejó pasar, y en los demás casos cuando ha sido judicialmente reconvenido por el acreedor.", "CC 1568": "La mora purga la mora: en los contratos bilaterales ninguno de los contratantes está en mora dejando de cumplir lo pactado, mientras el otro no lo cumple por su parte o no se allana a cumplirlo en la forma y tiempo debidos.", "CC 1698": "Nulidad absoluta y relativa: el objeto o causa ilícita, la omisión de solemnidades exigidas en consideración a la naturaleza del acto y los actos de absolutamente incapaces producen nulidad absoluta; cualquier otro vicio produce nulidad relativa y da derecho a la rescisión.", "CC 1699": "Declaración de la nulidad absoluta: puede y debe ser declarada por el juez, aun sin petición de parte, cuando aparece de manifiesto en el acto; puede alegarla todo el que tenga interés, excepto quien celebró el contrato sabiendo o debiendo saber el vicio; no se sanea por ratificación ni por un lapso que no pase de quince años.", "CC 2408": "Prescripción adquisitiva ordinaria: el tiempo necesario es de tres años para los muebles y de cinco años para los bienes raíces; exige posesión regular (justo título y buena fe).", "CC 2411": "Prescripción adquisitiva extraordinaria: el tiempo necesario es de quince años, sin que se requiera título alguno; se presume la buena fe.", "COA 99": "Requisitos de validez del acto administrativo: competencia, objeto, voluntad, procedimiento y motivación.", "COA 101": "Eficacia del acto administrativo: el acto será eficaz una vez notificado al administrado; la ejecución de un acto no notificado es
