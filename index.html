gación solidaria", "resultado": "Resuelve un caso de obligación solidaria razonando desde la norma aplicable.", "demanda": "Aplicar", "enunciado": "Tres personas se obligaron solidariamente a pagar 9.000 dólares. El acreedor demanda solo a una de ellas por el total. ¿Qué razonamiento es correcto?", "opciones": [{"texto": "Puede exigirle el total; quien paga puede luego repetir contra los demás por su parte.", "justificacion": "Correcta. El acreedor puede dirigirse contra todos los deudores solidarios conjuntamente o contra cualquiera de ellos, a su arbitrio, por el total (art. 1530 del Código Civil); el que paga se subroga y puede reclamar a los codeudores su cuota."}, {"texto": "Solo puede exigirle 3.000 dólares, que es la cuota que le corresponde.", "justificacion": "Incorrecta. Esa regla rige para las obligaciones simplemente conjuntas."}, {"texto": "Debe demandar a los tres a la vez, porque la solidaridad exige un litisconsorcio.", "justificacion": "Incorrecta. El acreedor elige a quién demandar."}, {"texto": "Puede exigir el total, pero el deudor que paga no puede reclamar nada a los demás.", "justificacion": "Incorrecta. El deudor que paga tiene acción contra los codeudores."}], "correcta": 0, "referencias": ["CC"]}, {"id": "RZ-CIV-11", "area": 4, "dificultad": 4, "subarea": "Obligaciones y Contratos", "tema": "Obligación simplemente conjunta", "resultado": "Resuelve un caso de obligación simplemente conjunta razonando desde la norma aplicable.", "demanda": "Evaluar", "enunciado": "Tres hermanos firman un contrato en el que deben 9.000 dólares a un proveedor, sin pactar solidaridad. El proveedor demanda a uno de ellos por el total. ¿Qué defensa es procedente?", "opciones": [{"texto": "Que debe únicamente su cuota, porque la solidaridad no se presume.", "justificacion": "Correcta. En las obligaciones con pluralidad de deudores, cada uno está obligado solo a su parte, salvo que la solidaridad se haya pactado expresamente o la disponga la ley (art. 1527 del Código Civil)."}, {"texto": "Ninguna, porque entre parientes se presume que la deuda es solidaria.", "justificacion": "Incorrecta. La solidaridad no se presume por el parentesco."}, {"texto": "Que el proveedor debió demandar a una sociedad de hecho formada por los tres.", "justificacion": "Incorrecta. No existe base para presumir una sociedad entre los deudores."}, {"texto": "Que la obligación es nula por no haberse dividido el monto en el contrato.", "justificacion": "Incorrecta. A falta de pacto, la ley divide la deuda en cuotas."}], "correcta": 0, "referencias": ["CC"]}, {"id": "RZ-CIV-12", "area": 4, "dificultad": 4, "subarea": "Obligaciones y Contratos", "tema": "Excepción de contrato no cumplido", "resultado": "Resuelve un caso de excepción de contrato no cumplido razonando desde la norma aplicable.", "demanda": "Analizar", "enunciado": "En una compraventa, el vendedor demanda el pago del saldo del precio, pero aún no ha entregado la cosa vendida, que debía entregarse primero. ¿Qué puede oponer el comprador?", "opciones": [{"texto": "La excepción de contrato no cumplido: no está en mora mientras el vendedor no cumpla.", "justificacion": "Correcta. En los contratos bilaterales ninguno de los contratantes está en mora dejando de cumplir lo pactado, mientras el otro no lo cumple por su parte o no se allana a cumplirlo en la forma y tiempo debidos (art. 1568 del Código Civil)."}, {"texto": "La nulidad del contrato, porque el vendedor no puede exigir sin haber cumplido.", "justificacion": "Incorrecta. El incumplimiento no anula el contrato; habilita la excepción o la resolución."}, {"texto": "Ninguna, porque la obligación de pagar el precio es independiente de la entrega.", "justificacion": "Incorrecta. En los contratos bilaterales las obligaciones son recíprocas."}, {"texto": "La prescripción, porque el vendedor dejó pasar el plazo de entrega.", "justificacion": "Incorrecta. El vencimiento del plazo no extingue la acción."}], "correcta": 0, "referencias": ["CC"]}, {"id": "RZ-CIV-13", "area": 4, "dificultad": 4, "subarea": "Obligaciones y Contratos", "tema": "Condición resolutoria tácita", "resultado": "Resuelve un caso de condición resolutoria tácita razonando desde la norma aplicable.", "demanda": "Aplicar", "enunciado": "Un constructor incumple totalmente un contrato de obra. El dueño ya no quiere la obra, sino recuperar lo pagado y los daños. ¿Qué acción corresponde?", "opciones": [{"texto": "La resolución del contrato por incumplimiento, con indemnización de perjuicios.", "justificacion": "Correcta. En los contratos bilaterales va envuelta la condición resolutoria de no cumplirse por uno de los contratantes lo pactado; el otro puede pedir a su arbitrio la resolución o el cumplimiento, con indemnización de perjuicios (art. 1505 del Código Civil)."}, {"texto": "La nulidad del contrato, porque el incumplimiento lo vicia desde su origen.", "justificacion": "Incorrecta. El incumplimiento es posterior a la formación del contrato y no es causa de nulidad."}, {"texto": "El cumplimiento forzoso, porque es la única acción ante el incumplimiento.", "justificacion": "Incorrecta. El contratante cumplido puede elegir entre cumplimiento y resolución."}, {"texto": "La rescisión por lesión enorme, porque recibió menos de lo que pagó.", "justificacion": "Incorrecta. La lesión enorme se refiere a la desproporción del precio en ciertas compraventas."}], "correcta": 0, "referencias": ["CC"]}, {"id": "RZ-CIV-14", "area": 4, "dificultad": 4, "subarea": "Obligaciones y Contratos", "tema": "Requisitos de la compensación", "resultado": "Resuelve un caso de requisitos de la compensación razonando desde la norma aplicable.", "demanda": "Evaluar", "enunciado": "A debe a B 2.000 dólares, exigibles hoy. B debe a A 2.000 dólares, pero con plazo que vence en seis meses. A alega que ambas deudas se compensaron. ¿Es correcto?", "opciones": [{"texto": "No, porque la deuda de B aún no es actualmente exigible por el plazo pendiente.", "justificacion": "Correcta. La compensación legal opera cuando ambas deudas son de dinero o de cosas fungibles de igual género, líquidas y actualmente exigibles (art. 1672 del Código Civil); la deuda con plazo pendiente no lo es."}, {"texto": "Sí, porque ambas deudas son de dinero y por el mismo monto.", "justificacion": "Incorrecta. Falta el requisito de exigibilidad actual."}, {"texto": "Sí, porque la compensación opera por el hecho de existir deudas recíprocas.", "justificacion": "Incorrecta. La compensación legal exige todos los requisitos del art. 1672."}, {"texto": "No, porque la compensación solo procede cuando lo declara un juez.", "justificacion": "Incorrecta. La compensación legal opera por el solo ministerio de la ley, cumplidos sus requisitos."}], "correcta": 0, "referencias": ["CC"]}, {"id": "RZ-CIV-15", "area": 4, "dificultad": 4, "subarea": "Obligaciones y Contratos", "tema": "Interrupción natural de la prescripción", "resultado": "Resuelve un caso de interrupción natural de la prescripción razonando desde la norma aplicable.", "demanda": "Analizar", "enunciado": "Un deudor de una obligación ejecutiva hace un abono parcial en el cuarto año, reconociendo la deuda. En el séptimo año el acreedor demanda y el deudor alega prescripción de cinco años. ¿Prospera?", "opciones": [{"texto": "No, porque el abono interrumpió la prescripción y el plazo volvió a correr desde entonces.", "justificacion": "Correcta. La prescripción que extingue las obligaciones se interrumpe naturalmente por el hecho de reconocer el deudor la obligación, expresa o tácitamente (art. 2418 del Código Civil); desde el abono no han transcurrido cinco años (art. 2415)."}, {"texto": "Sí, porque el plazo de cinco años se cuenta desde que la obligación fue exigible.", "justificacion": "Incorrecta. El reconocimiento interrumpe la prescripción y borra el tiempo anterior."}, {"texto": "Sí, porque el abono parcial solo interrumpe la prescripción de la parte pagada.", "justificacion": "Incorrecta. El reconocimiento recae sobre la obligación en su conjunto."}, {"texto": "No, porque las obligaciones ejecutivas prescriben en quince años.", "justificacion": "Incorrecta. Las ejecutivas prescriben en cinco años (art. 2415)."}], "correcta": 0, "referencias": ["CC"]}, {"id": "RZ-CIV-16", "area": 4, "dificultad": 3, "subarea": "Obligaciones y Contratos", "tema": "Responsabilidad por el hecho ajeno", "resultado": "Resuelve un caso de responsabilidad por el hecho ajeno razonando desde la norma aplicable.", "demanda": "Aplicar", "enunciado": "Un adolescente de quince años que vive con sus padres raya y daña un vehículo estacionado. El dueño demanda a los padres. ¿Qué razonamiento es correcto?", "opciones": [{"texto": "Responden los padres por el hijo que vive con ellos, salvo que prueben que no pudieron impedirlo.", "justificacion": "Correcta. Toda persona es responsable no solo de sus propias acciones sino del hecho de quienes estuvieren a su cuidado; así, los padres responden del hecho de los hijos menores que habiten en la misma casa, salvo que con la autoridad y el cuidado debidos no hubieren podido impedir el hecho (art. 2220 del Código Civil)."}, {"texto": "Los padres no responden, porque la responsabilidad civil es estrictamente personal.", "justificacion": "Incorrecta. El Código Civil establece la responsabilidad por el hecho ajeno."}, {"texto": "Solo responde el adolescente, porque a los quince años es plenamente capaz de delito civil.", "justificacion": "Incorrecta. La eventual capacidad del menor no excluye la responsabilidad de quienes lo tienen a su cuidado."}, {"texto": "Los padres responden de forma absoluta, sin posibilidad de probar diligencia.", "justificacion": "Incorrecta. Pueden exonerarse si prueban que no pudieron impedir el hecho."}], "correcta": 0, "referencias": ["CC"]}, {"id": "RZ-CIV-17", "area": 4, "dificultad": 4, "subarea": "Obligaciones y Contratos", "tema": "Prescripción de la acción extracontractual", "resultado": "Resuelve un caso de prescripción de la acción extracontractual razonando desde la norma aplicable.", "demanda": "Aplicar", "enunciado": "Una persona sufrió daños en un accidente causado por la negligencia de otra hace cinco años y recién ahora demanda la indemnización. ¿Qué excepción puede oponer el demandado?", "opciones": [{"texto": "Prescripción, por haber pasado más de cuatro años desde el hecho.", "justificacion": "Correcta. Las acciones por daño o dolo en materia extracontractual prescriben en cuatro años contados desde la perpetración del acto (art. 2235 del Código Civil)."}, {"texto": "Ninguna, porque la acción ordinaria prescribe en diez años.", "justificacion": "Incorrecta. La acción extracontractual tiene un plazo especial de cuatro años."}, {"texto": "Caducidad, porque la indemnización debía pedirse dentro de un año.", "justificacion": "Incorrecta. No existe ese plazo de caducidad."}, {"texto": "Prescripción de cinco años, porque es el plazo de las acciones ejecutivas.", "justificacion": "Incorrecta. No es una acción ejecutiva; rige el plazo especial del art. 2235."}], "correcta": 0, "referencias": ["CC"]}, {"id": "RZ-CIV-18", "area": 4, "dificultad": 4, "subarea": "Personas y Familia", "tema": "Bienes propios en la sociedad conyugal", "resultado": "Resuelve un caso de bienes propios en la sociedad conyugal razonando desde la norma aplicable.", "demanda": "Analizar", "enunciado": "Durante el matrimonio, la cónyuge hereda una casa de su padre. Al liquidar la sociedad conyugal, el otro cónyuge pide la mitad de la casa. ¿Qué razonamiento es correcto?", "opciones": [{"texto": "La casa es un bien propio de la cónyuge, por haberla adquirido a título gratuito.", "justificacion": "Correcta. Los bienes que los cónyuges adquieren durante el matrimonio a título gratuito, como la herencia, no ingresan al haber de la sociedad conyugal y son bienes propios del cónyuge adquirente (arts. 158 y 164 del Código Civil)."}, {"texto": "La casa es social, porque se adquirió durante la vigencia de la sociedad conyugal.", "justificacion": "Incorrecta. Los bienes adquiridos a título gratuito no son sociales."}, {"texto": "La casa es social, pero la cónyuge tiene una preferencia para adjudicársela.", "justificacion": "Incorrecta. No es un bien social que deba repartirse."}, {"texto": "La casa es de ambos solo si fue inscrita a nombre de los dos cónyuges.", "justificacion": "Incorrecta. La calidad del bien depende del título de adquisición, no de una inscripción conjunta."}], "correcta": 0, "referencias": ["CC"]}, {"id": "RZ-CIV-19", "area": 4, "dificultad": 3, "subarea": "Personas y Familia", "tema": "Causal de abandono en el divorcio", "resultado": "Resuelve un caso de causal de abandono en el divorcio razonando desde la norma aplicable.", "demanda": "Aplicar", "enunciado": "Un cónyuge abandonó el hogar sin justificación hace ocho meses y no ha regresado. El otro cónyuge quiere el divorcio, pero no hay acuerdo. ¿Con qué fundamento puede demandar?", "opciones": [{"texto": "Con la causal de abandono injustificado por más de seis meses.", "justificacion": "Correcta. Es causal de divorcio el abandono injustificado de cualquiera de los cónyuges por más de seis meses ininterrumpidos (art. 110 num. 9 del Código Civil)."}, {"texto": "No puede divorciarse sin el consentimiento del otro cónyuge.", "justificacion": "Incorrecta. El divorcio por causal no requiere consentimiento."}, {"texto": "Debe esperar a que el abandono cumpla tres años ininterrumpidos.", "justificacion": "Incorrecta. El plazo vigente de la causal es de más de seis meses."}, {"texto": "Debe acudir a un notario, que es competente para el divorcio contencioso.", "justificacion": "Incorrecta. El notario interviene en el divorcio por mutuo consentimiento, no en el divorcio contencioso por causal."}], "correcta": 0, "referencias": ["CC"]}, {"id": "RZ-CIV-20", "area": 4, "dificultad": 4, "subarea": "Personas y Familia", "tema": "Alimentos desde la demanda", "resultado": "Resuelve un caso de alimentos desde la demanda razonando desde la norma aplicable.", "demanda": "Aplicar", "enunciado": "Un padre es condenado a pagar alimentos. Sostiene que solo debe pagarlos desde la resolución que los fijó, y no por los meses que duró el juicio. ¿Tiene razón?", "opciones": [{"texto": "No, porque la pensión se debe desde la presentación de la demanda.", "justificacion": "Correcta. La pensión de alimentos se debe desde la presentación de la demanda (art. innumerado 8 del Título V, Libro II del Código de la Niñez y Adolescencia)."}, {"texto": "Sí, porque las obligaciones nacen cuando el juez las declara en la resolución.", "justificacion": "Incorrecta. La ley fija expresamente que se deben desde la demanda."}, {"texto": "Sí, salvo que la madre pruebe que el niño pasó necesidades durante el juicio.", "justificacion": "Incorrecta. No se exige esa prueba; la regla es objetiva."}, {"texto": "No, porque la pensión se debe desde el nacimiento del niño.", "justificacion": "Incorrecta. La regla general toma como punto de partida la presentación de la demanda."}], "correcta": 0, "referencias": ["CONA"]}, {"id": "RZ-CIV-21", "area": 4, "dificultad": 4, "subarea": "Personas y Familia", "tema": "Obligados subsidiarios de alimentos", "resultado": "Resuelve un caso de obligados subsidiarios de alimentos razonando desde la norma aplicable.", "demanda": "Analizar", "enunciado": "El padre de un niño está desempleado, sin bienes y con una discapacidad que le impide trabajar, y la madre tampoco puede cubrir las necesidades. ¿A quién puede demandarse la pensión?", "opciones": [{"texto": "A los obligados subsidiarios, como los abuelos, según su capacidad.", "justificacion": "Correcta. En caso de ausencia, impedimento, insuficiencia de recursos o discapacidad de los obligados principales, la obligación se cumple por los obligados subsidiarios, en atención a su capacidad económica: los abuelos, los hermanos mayores de veintiún años y los tíos (art. innumerado 5 del Título V, Libro II del Código de la Niñez y Adolescencia)."}, {"texto": "A nadie, porque la obligación alimentaria se extingue si el padre no tiene recursos.", "justificacion": "Incorrecta. La ley prevé obligados subsidiarios."}, {"texto": "Solo al Estado, que debe cubrir directamente la pensión de alimentos.", "justificacion": "Incorrecta. Antes intervienen los obligados subsidiarios previstos en la ley."}, {"texto": "A los tíos en primer lugar, porque son los parientes más cercanos al niño.", "justificacion": "Incorrecta. El orden comienza por los abuelos."}], "correcta": 0, "referencias": ["CONA"]}, {"id": "RZ-CIV-22", "area": 4, "dificultad": 4, "subarea": "Sucesiones", "tema": "Derecho de representación", "resultado": "Resuelve un caso de derecho de representación razonando desde la norma aplicable.", "demanda": "Aplicar", "enunciado": "Un causante muere sin testamento y deja dos hijos vivos y dos nietos, hijos de un tercer hijo que falleció antes que él. ¿Cómo se reparte la herencia?", "opciones": [{"texto": "En tres partes: una para cada hijo vivo y una para los nietos, por representación.", "justificacion": "Correcta. Por el derecho de representación, los descendientes ocupan el lugar del ascendiente fallecido y heredan lo que a este le habría correspondido (arts. 1024 y 1025 del Código Civil); los nietos dividen entre ellos la cuota de su padre."}, {"texto": "En dos partes, solo para los hijos vivos, porque los nietos no heredan si hay hijos.", "justificacion": "Incorrecta. La representación permite a los nietos ocupar el lugar del hijo premuerto."}, {"texto": "En cuatro partes iguales, entre los dos hijos y los dos nietos.", "justificacion": "Incorrecta. Los nietos heredan por estirpes, no por cabezas."}, {"texto": "En dos partes, una para los hijos y otra para los nietos, por orden de grados.", "justificacion": "Incorrecta. La división se hace por estirpes: una cuota por cada hijo."}], "correcta": 0, "referencias": ["CC"]}, {"id": "RZ-CIV-23", "area": 4, "dificultad": 5, "subarea": "Sucesiones", "tema": "Acción de reforma del testamento", "resultado": "Resuelve un caso de acción de reforma del testamento razonando desde la norma aplicable.", "demanda": "Evaluar", "enunciado": "Un testador con tres hijos deja todos sus bienes a dos de ellos y a una fundación, sin mencionar al tercero. El hijo omitido quiere anular todo el testamento. ¿Cuál es la acción adecuada?", "opciones": [{"texto": "La acción de reforma del testamento, para que se le asigne su legítima.", "justificacion": "Correcta. Los legitimarios a quienes el testador no ha dejado lo que por ley les corresponde tienen derecho a que se reforme el testamento a su favor (art. 1239 del Código Civil); la acción no anula el testamento, lo ajusta a las legítimas."}, {"texto": "La nulidad absoluta del testamento, porque vulnera normas de orden público.", "justificacion": "Incorrecta. La lesión de la legítima no produce nulidad, sino reforma."}, {"texto": "La acción de indignidad contra sus hermanos, por haberlo excluido de la herencia.", "justificacion": "Incorrecta. Los hermanos no incurrieron en causal de indignidad."}, {"texto": "Ninguna, porque el testador puede preferir a unos hijos sobre otros.", "justificacion": "Incorrecta. Con legitimarios, la libertad de testar está limitada."}], "correcta": 0, "referencias": ["CC"]}, {"id": "RZ-CIV-24", "area": 4, "dificultad": 4, "subarea": "Obligaciones y Contratos", "tema": "Beneficio de excusión del fiador", "resultado": "Resuelve un caso de beneficio de excusión del fiador razonando desde la norma aplicable.", "demanda": "Analizar", "enunciado": "Un banco demanda directamente al fiador de un crédito sin haber intentado cobrar al deudor principal, que tiene bienes suficientes. El fiador no renunció a ningún beneficio ni se obligó solidariamente. ¿Qué puede oponer?", "opciones": [{"texto": "El beneficio de excusión, para que primero se persigan los bienes del deudor.", "justificacion": "Correcta. El fiador reconvenido goza del beneficio de excusión, en virtud del cual puede exigir que antes de proceder contra él se persiga la deuda en los bienes del deudor principal, siempre que no lo haya renunciado ni se haya obligado como codeudor solidario (arts. 2259 y 2260 del Código Civil)."}, {"texto": "La nulidad de la fianza, porque el banco no notificó primero al deudor principal.", "justificacion": "Incorrecta. La falta de cobro previo no anula la fianza."}, {"texto": "Ninguna, porque el fiador responde de igual forma que el deudor principal.", "justificacion": "Incorrecta. La fianza es una obligación accesoria y subsidiaria."}, {"texto": "La prescripción, porque la obligación del fiador se extingue antes que la principal.", "justificacion": "Incorrecta. No hay datos que sustenten una prescripción."}], "correcta": 0, "referencias": ["CC"]}, {"id": "RZ-MER-01", "area": 5, "dificultad": 4, "subarea": "Mercantil", "tema": "Cesión de participaciones", "resultado": "Resuelve un caso de cesión de participaciones razonando desde la norma aplicable.", "demanda": "Aplicar", "enunciado": "Un socio de una compañía de responsabilidad limitada con cinco socios cede sus participaciones a un tercero con la aprobación de cuatro de ellos; el quinto se opuso. ¿Es eficaz la cesión?", "opciones": [{"texto": "No, porque la cesión a un extraño requería la unanimidad del capital social.", "justificacion": "Correcta. Las participaciones pueden cederse a terceros extraños a la compañía solo con el consentimiento unánime del capital social, expresado en junta general o por otro medio fehaciente; desde la reforma de 2023 la cesión puede instrumentarse por documento privado (art. 113 de la Ley de Compañías)."}, {"texto": "Sí, porque basta la aprobación de la mayoría del capital social.", "justificacion": "Incorrecta. Para la cesión a terceros la ley exige unanimidad."}, {"texto": "Sí, porque las participaciones son libremente transferibles como las acciones.", "justificacion": "Incorrecta. La libre transferencia es propia de las acciones de la compañía anónima."}, {"texto": "No, porque las participaciones de una limitada no pueden cederse a terceros.", "justificacion": "Incorrecta. Pueden cederse, pero con el consentimiento unánime."}], "correcta": 0, "referencias": ["LC"]}, {"id": "RZ-MER-02", "area": 5, "dificultad": 4, "subarea": "Mercantil", "tema": "Transferencia de acciones", "resultado": "Resuelve un caso de transferencia de acciones razonando desde la norma aplicable.", "demanda": "Analizar", "enunciado": "Un accionista de una compañía anónima vende sus acciones a un tercero, pero la transferencia nunca se inscribe en el Libro de Acciones y Accionistas. El comprador quiere votar en la junta. ¿Puede hacerlo?", "opciones": [{"texto": "No, porque la transferencia no surte efecto frente a la compañía sin la inscripción.", "justificacion": "Correcta. Las acciones de la compañía anónima son libremente transferibles, pero la transferencia del dominio no surte efecto contra la compañía ni contra terceros sino desde su inscripción en el Libro de Acciones y Accionistas (normas sobre la transferencia de acciones de la Ley de Compañías)."}, {"texto": "Sí, porque la compraventa de acciones es válida desde el acuerdo de las partes.", "justificacion": "Incorrecta. La validez entre las partes no equivale a su oponibilidad frente a la compañía."}, {"texto": "No, porque la venta de acciones requiere la aprobación unánime de la junta.", "justificacion": "Incorrecta. En la anónima, las acciones son libremente transferibles."}, {"texto": "Sí, siempre que exhiba la escritura pública de compraventa de las acciones.", "justificacion": "Incorrecta. Lo determinante es la inscripción en el libro, no el instrumento."}], "correcta": 0, "referencias": ["LC"]}, {"id": "RZ-MER-03", "area": 5, "dificultad": 3, "subarea": "Mercantil", "tema": "Sociedad por acciones simplificada", "resultado": "Resuelve un caso de sociedad por acciones simplificada razonando desde la norma aplicable.", "demanda": "Aplicar", "enunciado": "Una emprendedora quiere constituir, ella sola, una compañía de responsabilidad limitada. Un asesor le dice que la ley exige al menos dos socios. ¿Tiene razón el asesor?", "opciones": [{"texto": "No: desde 2023 la limitada puede constituirse por acto unilateral.", "justificacion": "Correcta. La compañía de responsabilidad limitada se puede constituir mediante contrato o acto unilateral y puede subsistir con un solo socio (art. 92 de la Ley de Compañías, reformado por la Ley Reformatoria a la Ley de Compañías para la Optimización e Impulso Empresarial y para el Fomento del Gobierno Corporativo, R.O. Suplemento 269, 15 de marzo de 2023)."}, {"texto": "Sí: la limitada exige pluralidad de socios desde su constitución.", "justificacion": "Incorrecta. La reforma de 2023 admite la constitución unipersonal (art. 92)."}, {"texto": "Sí, aunque puede quedar con un solo socio después de constituida.", "justificacion": "Incorrecta. No solo puede subsistir con un socio: también puede constituirse con uno solo (art. 92)."}, {"texto": "No, pero solo si la constituye como sociedad por acciones simplificada.", "justificacion": "Incorrecta. La SAS no es la única opción unipersonal; la limitada también la admite (art. 92)."}], "correcta": 0, "referencias": ["LC"]}, {"id": "RZ-MER-04", "area": 5, "dificultad": 4, "subarea": "Mercantil", "tema": "Legitimación del tenedor de una letra", "resultado": "Resuelve un caso de legitimación del tenedor de una letra razonando desde la norma aplicable.", "demanda": "Analizar", "enunciado": "Una letra de cambio llega a manos de su tenedor actual tras tres endosos sucesivos e ininterrumpidos, el último de ellos en blanco. El deudor se niega a pagar alegando que no conoce al tenedor. ¿Quién tiene razón?", "opciones": [{"texto": "El tenedor, porque se legitima por una serie ininterrumpida de endosos.", "justificacion": "Correcta. El tenedor de la letra se considera portador legítimo si justifica su derecho por una serie ininterrumpida de endosos, aun cuando el último sea en blanco (normas sobre el endoso de la letra de cambio del Código de Comercio de 2019)."}, {"texto": "El deudor, porque solo está obligado frente al beneficiario original de la letra.", "justificacion": "Incorrecta. La letra es un título circulante; el endoso transmite los derechos."}, {"texto": "El deudor, porque el endoso en blanco carece de efectos jurídicos.", "justificacion": "Incorrecta. El endoso en blanco es válido y transmite el título."}, {"texto": "El tenedor, pero solo si notifica cada endoso al deudor antes del vencimiento.", "justificacion": "Incorrecta. El endoso no requiere notificación al deudor."}], "correcta": 0, "referencias": ["CCOM"]}, {"id": "RZ-TRI-01", "area": 5, "dificultad": 4, "subarea": "Tributario", "tema": "Calificación del hecho generador", "resultado": "Resuelve un caso de calificación del hecho generador razonando desde la norma aplicable.", "demanda": "Evaluar", "enunciado": "Dos partes celebran un contrato que denominan \"donación\", pero el \"donatario\" paga al \"donante\" un precio equivalente al valor comercial del bien. ¿Cómo debe calificarlo la administración tributaria?", "opciones": [{"texto": "Como compraventa, porque se atiende a la esencia económica y no a la denominación.", "justificacion": "Correcta. Cuando el hecho generador consista en un acto jurídico, se calificará conforme a su verdadera esencia y naturaleza jurídica, cualquiera que sea la forma elegida o la denominación utilizada por los interesados (art. 17 del Código Orgánico Tributario)."}, {"texto": "Como donación, porque la administración debe respetar la voluntad declarada por las partes.", "justificacion": "Incorrecta. La denominación no vincula a la administración tributaria."}, {"texto": "Como un contrato atípico, que no genera ninguna obligación tributaria.", "justificacion": "Incorrecta. La administración califica según la realidad económica del acto."}, {"texto": "Como donación, salvo que un juez civil declare antes la simulación del contrato.", "justificacion": "Incorrecta. La calificación tributaria no depende de una declaración judicial civil previa."}], "correcta": 0, "referencias": ["CTRIB"]}, {"id": "RZ-TRI-02", "area": 5, "dificultad": 4, "subarea": "Tributario", "tema": "Responsabilidad del agente de retención", "resultado": "Resuelve un caso de responsabilidad del agente de retención razonando desde la norma aplicable.", "demanda": "Aplicar", "enunciado": "Una empresa paga honorarios a un profesional y no efectúa la retención en la fuente que la ley le impone. El SRI le exige el valor no retenido. ¿Por qué responde la empresa?", "opciones": [{"texto": "Como responsable del tributo, porque como agente debía retener y no lo hizo.", "justificacion": "Correcta. Los agentes de retención son responsables del tributo que debieron retener; si no lo hacen, responden solidariamente con el contribuyente, sin perjuicio de su derecho de repetición (art. 29 num. 1 y art. 30 del Código Orgánico Tributario)."}, {"texto": "No responde, porque el contribuyente es el único obligado al pago del impuesto.", "justificacion": "Incorrecta. La ley establece la responsabilidad del agente de retención."}, {"texto": "Responde solo con una multa formal, sin obligación de pagar el impuesto.", "justificacion": "Incorrecta. Responde también por el tributo no retenido."}, {"texto": "Responde si se prueba que actuó con dolo para favorecer al profesional.", "justificacion": "Incorrecta. La responsabilidad no exige dolo."}], "correcta": 0, "referencias": ["CTRIB"]}, {"id": "RZ-TRI-03", "area": 5, "dificultad": 3, "subarea": "Tributario", "tema": "Término del reclamo administrativo", "resultado": "Resuelve un caso de término del reclamo administrativo razonando desde la norma aplicable.", "demanda": "Aplicar", "enunciado": "Un contribuyente recibe la notificación de un acta de determinación y presenta un reclamo administrativo treinta días hábiles después. ¿Qué ocurre?", "opciones": [{"texto": "El reclamo es extemporáneo, porque el término para presentarlo es de veinte días.", "justificacion": "Correcta. Los contribuyentes pueden presentar reclamo ante la autoridad tributaria dentro del plazo de veinte días contados desde el día hábil siguiente al de la notificación del acto (art. 115 del Código Orgánico Tributario)."}, {"texto": "El reclamo es oportuno, porque el término para reclamar es de sesenta días.", "justificacion": "Incorrecta. Sesenta días es el término para la acción contenciosa, no para el reclamo."}, {"texto": "El reclamo es oportuno, porque los términos tributarios se cuentan en meses.", "justificacion": "Incorrecta. El reclamo tiene un término específico de veinte días."}, {"texto": "El reclamo es extemporáneo, porque el término es de diez días como en la apelación.", "justificacion": "Incorrecta. El término del reclamo tributario es de veinte días."}], "correcta": 0, "referencias": ["CTRIB"]}, {"id": "RZ-TRI-04", "area": 5, "dificultad": 5, "subarea": "Tributario", "tema": "Vigencia de normas sobre impuestos anuales", "resultado": "Resuelve un caso de vigencia de normas sobre impuestos anuales razonando desde la norma aplicable.", "demanda": "Evaluar", "enunciado": "Una ley publicada en el mes de agosto eleva la tarifa del impuesto a la renta, que se liquida por períodos anuales. El SRI pretende aplicarla a todo el ejercicio fiscal en curso. ¿Es correcto?", "opciones": [{"texto": "No, porque las normas sobre tributos anuales rigen desde el siguiente año calendario.", "justificacion": "Correcta. Las normas que se refieren a tributos cuya determinación o liquidación deban realizarse por períodos anuales se aplican desde el primer día del siguiente año calendario (art. 11 del Código Orgánico Tributario), lo que concreta la irretroactividad tributaria (art. 300 de la Constitución)."}, {"texto": "Sí, porque las leyes rigen desde su publicación en el Registro Oficial.", "justificacion": "Incorrecta. La regla general cede ante la norma especial para tributos anuales."}, {"texto": "Sí, siempre que la ley declare expresamente su aplicación inmediata.", "justificacion": "Incorrecta. La irretroactividad tributaria es un principio constitucional."}, {"texto": "No, porque la tarifa del impuesto a la renta exige consulta popular para elevarse.", "justificacion": "Incorrecta. No existe ese requisito; basta una ley a iniciativa del Ejecutivo (art. 301 de la Constitución)."}], "correcta": 0, "referencias": ["CTRIB", "CRE"]}, {"id": "RZ-LAB-01", "area": 5, "dificultad": 3, "subarea": "Laboral", "tema": "Período de prueba", "resultado": "Resuelve un caso de período de prueba razonando desde la norma aplicable.", "demanda": "Aplicar", "enunciado": "Un contrato de trabajo fija un período de prueba de seis meses. Al quinto mes, el empleador da por terminada la relación invocando ese período. ¿Qué razonamiento es correcto?", "opciones": [{"texto": "El período de prueba no puede exceder de noventa días; ya había vencido.", "justificacion": "Correcta. En todo contrato de plazo indefinido puede pactarse un período de prueba de duración máxima de noventa días (art. 15 del Código del Trabajo); vencido ese plazo, el contrato continúa y una terminación unilateral puede ser despido intempestivo."}, {"texto": "La terminación es válida, porque las partes pactaron libremente el período de prueba.", "justificacion": "Incorrecta. El máximo legal es irrenunciable para el trabajador."}, {"texto": "La terminación es válida, porque el período de prueba puede durar hasta un año.", "justificacion": "Incorrecta. El máximo es de noventa días."}, {"texto": "La terminación es nula, porque los contratos indefinidos no admiten período de prueba.", "justificacion": "Incorrecta. La ley lo admite, con un máximo de noventa días."}], "correcta": 0, "referencias": ["CT"]}, {"id": "RZ-LAB-02", "area": 5, "dificultad": 3, "subarea": "Laboral", "tema": "Desahucio por el trabajador", "resultado": "Resuelve un caso de desahucio por el trabajador razonando desde la norma aplicable.", "demanda": "Aplicar", "enunciado": "Una trabajadora quiere dar por terminada su relación laboral de plazo indefinido para aceptar otra oferta. ¿Qué debe hacer?", "opciones": [{"texto": "Notificar el desahucio con al menos quince días de anticipación.", "justificacion": "Correcta. El desahucio es el aviso con el que el trabajador hace saber al empleador que pone fin al contrato, y debe darse con al menos quince días de anticipación (art. 184 del Código del Trabajo)."}, {"texto": "Solicitar el visto bueno ante el inspector del trabajo.", "justificacion": "Incorrecta. El visto bueno es para la terminación por causas legales imputables a la otra parte."}, {"texto": "Abandonar el puesto, porque el contrato indefinido termina por la sola voluntad del trabajador.", "justificacion": "Incorrecta. El abandono puede ser causal de visto bueno en su contra."}, {"texto": "Esperar el vencimiento del contrato, porque no puede terminarlo unilateralmente.", "justificacion": "Incorrecta. El contrato indefinido no tiene vencimiento y puede terminarse por desahucio."}], "correcta": 0, "referencias": ["CT"]}, {"id": "RZ-LAB-03", "area": 5, "dificultad": 4, "subarea": "Laboral", "tema": "Prescripción de las acciones laborales", "resultado": "Resuelve un caso de prescripción de las acciones laborales razonando desde la norma aplicable.", "demanda": "Aplicar", "enunciado": "Un trabajador despedido en marzo de 2022 demanda en noviembre de 2026 el pago de la indemnización por despido intempestivo. ¿Qué excepción puede oponer el empleador?", "opciones": [{"texto": "Prescripción, por haber pasado más de tres años desde la terminación laboral.", "justificacion": "Correcta. Las acciones provenientes de actos o contratos de trabajo prescriben en tres años, contados desde la terminación de la relación laboral (art. 635 del Código del Trabajo)."}, {"texto": "Ninguna, porque los derechos laborales son imprescriptibles e irrenunciables.", "justificacion": "Incorrecta. La irrenunciabilidad no impide la prescripción de las acciones."}, {"texto": "Prescripción, porque el trabajador tenía un año para reclamar la indemnización.", "justificacion": "Incorrecta. El plazo general es de tres años."}, {"texto": "Caducidad, porque debía reclamar antes ante el Ministerio del Trabajo.", "justificacion": "Incorrecta. El reclamo administrativo no es requisito previo de la acción judicial."}], "correcta": 0, "referencias": ["CT"]}, {"id": "RZ-LAB-04", "area": 5, "dificultad": 4, "subarea": "Laboral", "tema": "Irrenunciabilidad de derechos", "resultado": "Resuelve un caso de irrenunciabilidad de derechos razonando desde la norma aplicable.", "demanda": "Evaluar", "enunciado": "En el acta de finiquito, un trabajador declara que \"renuncia a reclamar las horas extraordinarias\" que el empleador reconoce adeudarle. Luego las demanda. ¿Qué razonamiento es correcto?", "opciones": [{"texto": "La renuncia es nula, porque los derechos laborales son irrenunciables e intangibles.", "justificacion": "Correcta. Los derechos laborales son irrenunciables e intangibles, y es nula toda estipulación en contrario (art. 326 num. 2 de la Constitución; art. 4 del Código del Trabajo)."}, {"texto": "La renuncia es válida, porque el finiquito suscrito ante el inspector tiene valor de cosa juzgada.", "justificacion": "Incorrecta. El finiquito no convalida la renuncia de derechos."}, {"texto": "La renuncia es válida, porque la firmó un trabajador mayor de edad y capaz.", "justificacion": "Incorrecta. La capacidad no habilita a renunciar a derechos laborales."}, {"texto": "La renuncia es válida, pero el trabajador puede pedir una indemnización compensatoria.", "justificacion": "Incorrecta. La renuncia es nula, por lo que conserva el derecho a las horas extraordinarias."}], "correcta": 0, "referencias": ["CRE", "CT"]}, {"id": "RZ-LAB-05", "area": 5, "dificultad": 4, "subarea": "Laboral", "tema": "In dubio pro operario", "resultado": "Resuelve un caso de in dubio pro operario razonando desde la norma aplicable.", "demanda": "Analizar", "enunciado": "Una cláusula del contrato colectivo sobre un bono anual admite dos lecturas: una lo otorga a todos los trabajadores y otra solo a los sindicalizados. ¿Cómo debe interpretarla el juez?", "opciones": [{"texto": "En el sentido más favorable a las personas trabajadoras, por la duda existente.", "justificacion": "Correcta. En caso de duda sobre el alcance de las disposiciones legales, reglamentarias o contractuales en materia laboral, se aplican en el sentido más favorable a las personas trabajadoras (art. 326 num. 3 de la Constitución; art. 7 del Código del Trabajo)."}, {"texto": "Según la lectura que menos afecte la situación financiera de la empresa.", "justificacion": "Incorrecta. La duda se resuelve a favor del trabajador."}, {"texto": "Según la intención del empleador que redactó el texto final de la cláusula.", "justificacion": "Incorrecta. El contrato colectivo se interpreta conforme al principio pro operario."}, {"texto": "Debe declarar nula la cláusula, por ser ambigua e imprecisa.", "justificacion": "Incorrecta. La ambigüedad se resuelve por interpretación favorable, no por nulidad."}], "correcta": 0, "referencias": ["CRE", "CT"]}, {"id": "RZ-DIP-01", "area": 5, "dificultad": 3, "subarea": "Internacional Privado", "tema": "Ley aplicable a los bienes", "resultado": "Resuelve un caso de ley aplicable a los bienes razonando desde la norma aplicable.", "demanda": "Aplicar", "enunciado": "Un ciudadano español que nunca residió en Ecuador es dueño de un terreno en Manabí. Se discute qué ley rige la propiedad y su transferencia. ¿Qué ley se aplica?", "opciones": [{"texto": "La ley ecuatoriana, porque el bien está situado en Ecuador.", "justificacion": "Correcta. Los bienes situados en el Ecuador están sujetos a las leyes ecuatorianas, aunque sus dueños sean extranjeros y no residan en el Ecuador (art. 15 del Código Civil)."}, {"texto": "La ley española, porque rige la nacionalidad del propietario.", "justificacion": "Incorrecta. Para los bienes rige la ley del lugar de su situación."}, {"texto": "La ley del domicilio del propietario, sea cual sea el lugar del bien.", "justificacion": "Incorrecta. El Código Civil adopta la regla de la ubicación del bien."}, {"texto": "La que elijan las partes en el contrato de compraventa del terreno.", "justificacion": "Incorrecta. El régimen de los bienes inmuebles no es disponible por las partes."}], "correcta": 0, "referencias": ["CC"]}, {"id": "RZ-DIP-02", "area": 5, "dificultad": 4, "subarea": "Internacional Privado", "tema": "Forma de los instrumentos públicos", "resultado": "Resuelve un caso de forma de los instrumentos públicos razonando desde la norma aplicable.", "demanda": "Analizar", "enunciado": "Dos ecuatorianos otorgan en Madrid, ante notario español y con las formalidades españolas, un poder que se usará en Ecuador. La contraparte alega que el poder debió seguir las solemnidades ecuatorianas. ¿Quién tiene razón?", "opciones": [{"texto": "Los otorgantes, porque la forma se rige por la ley del lugar de otorgamiento.", "justificacion": "Correcta. La forma de los instrumentos públicos se determina por la ley del lugar en que hayan sido otorgados (art. 16 del Código Civil), sin perjuicio de su apostilla o legalización para surtir efectos en el Ecuador."}, {"texto": "La contraparte, porque el instrumento se usará en Ecuador y debe seguir su ley.", "justificacion": "Incorrecta. El Código Civil adopta la regla del lugar de celebración para la forma."}, {"texto": "La contraparte, porque los ecuatorianos deben otorgar sus poderes en un consulado.", "justificacion": "Incorrecta. El otorgamiento consular es una alternativa, no una obligación."}, {"texto": "Ninguno, porque los poderes otorgados en el extranjero no tienen validez en Ecuador.", "justificacion": "Incorrecta. Son válidos si cumplen la ley del lugar y los requisitos de autenticación."}], "correcta": 0, "referencias": ["CC"]}, {"id": "RZ-DIP-03", "area": 5, "dificultad": 5, "subarea": "Internacional Privado", "tema": "Ley personal de los ecuatorianos en el extranjero", "resultado": "Resuelve un caso de ley personal de los ecuatorianos en el extranjero razonando desde la norma aplicable.", "demanda": "Evaluar", "enunciado": "Un ecuatoriano domiciliado desde hace años en Italia es demandado por su hijo, también ecuatoriano, por alimentos. Alega que, por su domicilio, la obligación debe regirse por la ley italiana. ¿Qué razonamiento es correcto?", "opciones": [{"texto": "Rige la ley ecuatoriana, porque sigue a los ecuatorianos en sus relaciones de familia.", "justificacion": "Correcta. Los ecuatorianos, aunque residan o estén domiciliados en el extranjero, permanecen sujetos a las leyes de su patria en las obligaciones y derechos que nacen de las relaciones de familia, respecto de su cónyuge y parientes ecuatorianos (art. 14 num. 2 del Código Civil)."}, {"texto": "Rige la ley italiana, porque las obligaciones se regulan por la ley del domicilio del deudor.", "justificacion": "Incorrecta. Para las relaciones de familia entre ecuatorianos, el Código Civil adopta la ley de la nacionalidad."}, {"texto": "Rige la ley que elija el padre, porque es quien debe cumplir la obligación de alimentos.", "justificacion": "Incorrecta. La ley aplicable no queda a elección del obligado."}, {"texto": "Ninguna ley ecuatoriana se aplica, porque los jueces del Ecuador no son competentes.", "justificacion": "Incorrecta. La competencia judicial y la ley aplicable son cuestiones distintas; la ley de familia aplicable es la ecuatoriana."}], "correcta": 0, "referencias": ["CC"]}]}];

/* ---------- DIFICULTAD ADAPTATIVA ----------
   Cada área tiene un nivel (1 a 5). Tras cada simulacro completo: ≥ 80 % de acierto en el área → sube; < 50 % → baja.
   La dificultad de cada pregunta parte de su demanda cognitiva (o del campo «dificultad») y se ajusta con tu historial con ella. */
const LEVELS=[null,{n:"Básico",t:1.6,min:120},{n:"Intermedio",t:2.5,min:120},{n:"Avanzado",t:3.3,min:120},{n:"Experto",t:4.1,min:110},{n:"Titulación",t:4.7,min:100}];
const DEM={recordar:1,comprender:2,aplicar:3,analizar:4,evaluar:5,crear:5};
const UP=0.8,DOWN=0.5,START_LV=2;
function levels(){const l=store.get(K.lvl,{});for(const a in AREAS)if(!(l[a]>=1&&l[a]<=5))l[a]=START_LV;return l}
function globalLv(){const l=levels();return Math.round(Object.values(l).reduce((s,x)=>s+x,0)/Object.keys(l).length)}
function baseDiff(q){return q.dif||DEM[String(q.d||"").trim().toLowerCase()]||3}
function qDiff(q,QS){let e=baseDiff(q);const st=QS[q.id];if(st&&st[0]){const r=st[1]/st[0];e+=(1-r)*1.2-(r===1?0.4:0)}return Math.max(1,Math.min(5,e))}
function weightedPick(pool,k,wf){const items=pool.map(q=>({q,w:Math.max(1e-6,wf(q))})),out=[];
  while(out.length<k&&items.length){let s=items.reduce((t,x)=>t+x.w,0),r=Math.random()*s,i=0;for(;i<items.length-1;i++){r-=items[i].w;if(r<=0)break}out.push(items.splice(i,1)[0].q)}return out}
function pickAdaptive(pool,k,lv){
  const QS=store.get(K.qs,{}),last=new Set((store.get(K.last,null)||{}).ids||[]),T=LEVELS[lv].t;
  return weightedPick(pool,k,q=>{let w=Math.exp(-1.1*Math.abs(qDiff(q,QS)-T));const st=QS[q.id];
    if(!st)w*=1.4;else if(last.has(q.id))w*=0.35;if(lv>=4&&st&&st[1]<st[0])w*=1.3;return w});
}

   Si la vuelves a fallar en cualquier momento, reinicia el ciclo. */

function srsUpdate(ids,ans){const s=srs(),t=TODAY();let mastered=0,added=0,advanced=0;
  for(const id of ids){const ok=ans[id]===0,e=s[id];
    if(!ok){if(!e)added++;s[id]={b:0,due:t+SRS_INT[0]}}
    else if(e&&e.due<=t){const b=e.b+1;advanced++;if(b>=SRS_INT.length){delete s[id];mastered++}else s[id]={b,due:t+SRS_INT[b]}}}
  store.set(K.srs,s);if(mastered)store.set(K.mast,store.get(K.mast,0)+mastered);return {mastered,added,advanced}}
function srsList(){const m=byId(),s=srs();return Object.entries(s).filter(([id])=>m[id]).map(([id,e])=>Object.assign({id},e))}
function srsDue(){const t=TODAY();return srsList().filter(e=>e.due<=t)}
function srsPrune(){const m=byId(),s=srs();for(const id in s)if(!m[id])delete s[id];store.set(K.srs,s)}

function startDaily(){
  if(!canStart())return;const due=shuffle(srsDue().map(e=>e.id)).slice(0,6),QS=store.get(K.qs,{}),lv=levels(),acc=areaAcc();

const CODE_NAME={CRE:"Constitución",LOGJCC:"Ley Orgánica de Garantías Jurisdiccionales y Control Constitucional",COA:"Código Orgánico Administrativo",COIP:"Código Orgánico Integral Penal",COGEP:"Código Orgánico General de Procesos",LAM:"Ley de Arbitraje y Mediación",CC:"Código Civil",CT:"Código del Trabajo",CTRIB:"Código Tributario",CONA:"Código de la Niñez y Adolescencia",LC:"Ley de Compañías",CADH:"Convención Americana sobre Derechos Humanos"};
const ART_RE=new RegExp("\\barts?\\.\\s*(\\d+(?:\\s*(?:,|y|a)\\s*\\d+)*)(?:\\s*(?:num|lit|inc)\\.\\s*[\\w\\)]+)*\\s*,?\\s*(?:del |de la |de )?("+Object.keys(CODES).sort((a,b)=>b.length-a.length).map(x=>x.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("|")+")\\b","g");

async function sync(manual){
  if(SYNCING)return;const url=srcUrl();
  if(!url){if(manual)alert("Primero configura la dirección del banco en línea en Banco › Actualización en línea.");return}
  if(navigator.onLine===false){if(manual)alert("No hay conexión a internet. Seguirás usando las preguntas guardadas.");return}
  SYNCING=true;refreshSync();
  const st=store.get(K.sync,{});let added=0,updated=0;
  try{
    const man=await getJSON(url);const list=man.paquetes||man.packs||[];
    if(!Array.isArray(list))throw"manifiesto sin «paquetes»";
    const have=store.get(K.packs,{});
    for(const p of list){
      const v=String(p.version??1);if(have[p.id]&&have[p.id].v===v)continue;
      const data=await getJSON(new URL(p.archivo,url).href);
      const arr=Array.isArray(data)?data:(data.preguntas||[]);const bib=data.bibliografia||{};if(data.articulos&&typeof data.articulos==='object')store.set(K.arts,Object.assign(store.get(K.arts,{}),data.articulos));
      const qs=[];arr.forEach((x,i)=>{try{const q=normItem(x,String(x.id||(p.id+"-"+(i+1))),bib);q.pk=p.id;qs.push(q)}catch(e){}});
      const old=store.get(K.remote,[]),prev=old.filter(q=>q.pk===p.id).length;
      store.set(K.remote,old.filter(q=>q.pk!==p.id).concat(qs));
      if(have[p.id])updated+=qs.length;else added+=Math.max(0,qs.length-prev);
      have[p.id]={v,n:qs.length,t:String(p.titulo||p.id),f:Date.now()};store.set(K.packs,have);
    }
    store.set(K.sync,{t:Date.now(),ok:true,added,updated,url});
    if(added||updated)toast(added?`Se añadieron ${added} preguntas nuevas al banco. Ya puedes usarlas sin internet.`:`Se actualizaron ${updated} preguntas del banco.`);
    else if(manual)toast("Tu banco ya está al día.");
  }catch(e){
    store.set(K.sync,Object.assign({},st,{err:String(e&&e.message||e),te:Date.now(),url}));
    if(manual)alert("No se pudo actualizar el banco:\n"+(e&&e.message||e)+"\n\nSeguirás usando las preguntas guardadas.");
  }finally{SYNCING=false;refreshSync();if(VIEW==="home")home();else if(VIEW==="bank")bankView()}
}
function ago(t){const s=Math.round((Date.now()-t)/1000);if(s<60)return"hace un momento";const m=Math.round(s/60);if(m<60)return`hace ${m} min`;const h=Math.round(m/60);if(h<48)return`hace ${h} h`;return`hace ${Math.round(h/24)} días`}
function syncLine(){
  const st=store.get(K.sync,{}),n=bank().length,url=srcUrl();
  let dot="",txt;
  if(SYNCING){dot="busy";txt="Buscando preguntas nuevas…"}
  else if(!url){txt=`${n} preguntas guardadas · actualización en línea sin configurar`}
  else if(navigator.onLine===false){dot="off";txt=`Sin conexión · usando ${n} preguntas guardadas`}
  else if(st.err&&(!st.t||st.te>st.t)){dot="off";txt=`No se pudo actualizar (${ago(st.te)}) · ${n} preguntas guardadas`}
  else if(st.t){dot="on";txt=`Banco al día · ${n} preguntas · revisado ${ago(st.t)}`}
  else{txt=`${n} preguntas guardadas`}
  return `<div class="sync" id="syncbar"><i class="dot ${dot}"></i><span>${esc(txt)}</span>${url&&!SYNCING?`<button onclick="sync(true)">Actualizar</button>`:!url?`<button onclick="bankView()">Configurar</button>`:""}</div>`;
}
function refreshSync(){const el=document.getElementById("syncbar");if(el)el.outerHTML=syncLine()}
function toast(msg){const t=document.createElement("div");t.className="toast";t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),4500)}
function byId(){const m={};bank().forEach(q=>m[q.id]=q);return m}

let EX=null,TICK=null,VIEW="home";
function stopTick(){if(TICK){clearInterval(TICK);TICK=null}}
function fmt(ms){ms=Math.max(0,ms);const s=Math.floor(ms/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (h?h+":":"")+String(m).padStart(h?2:1,"0")+":"+String(x).padStart(2,"0")}
function remaining(){return EX.dur-(Date.now()-EX.start)}
function answered(){return Object.keys(EX.ans).length}
function saveEx(){store.set(K.exam,EX)}
function nota(ok,n){return n?(ok/n*10):0}

function levelCard(){const l=levels(),g=globalLv();
  return `<div class="card"><h3>Tu nivel de dificultad</h3><div class="meter">${[1,2,3,4,5].map(i=>`<i class="${i<=g?"f":""}"></i>`).join("")}</div>

  ${Object.entries(AREAS).map(([a,v])=>`<div class="lvrow"><span>${esc(v.n)}</span>${lvPill(l[a])}</div>`).join("")}</div>`}
function validErrs(){return srsList().map(e=>e.id)}

/* ---------- INICIO DE EVALUACIONES ---------- */
function canStart(){const sv=store.get(K.exam,null);return !(sv&&!sv.done)||confirm("Tienes una evaluación en curso. ¿Descartarla y empezar otra?")}
function newExam(mode,title,ids,dur,fb){
  EX={mode,title,ids,perm:Object.fromEntries(ids.map(id=>[id,shuffle([0,1,2,3])])),ans:{},flag:{},idx:0,start:Date.now(),dur,fb,done:false};
  saveEx();go(0,true);
}
function startSim(){
  if(!canStart())return;
  const b=bank(),lv=levels(),g=globalLv();let ids=[],faltan=0;
  for(const a in AREAS){const p=b.filter(q=>q.a==a);faltan+=Math.max(0,AREAS[a].k-p.length);ids=ids.concat(pickAdaptive(p,AREAS[a].k,lv[a]).map(q=>q.id))}
  if(faltan&&!confirm(`El banco no alcanza para las 50 preguntas (faltan ${faltan}). Se tomará con ${ids.length} preguntas y tiempo proporcional. ¿Continuar?`))return;
  const dur=Math.round(LEVELS[g].min*60000*ids.length/SIM_N);
  newExam("sim","Simulacro · nivel "+LEVELS[g].n,shuffle(ids),dur,false);
  EX.lv=lv;EX.full=!faltan;saveEx();
}

function startPractice(){
  const ar=[...document.querySelectorAll('input[name=ar]:checked')].map(i=>+i.value);
  if(!ar.length){alert("Selecciona al menos un área.");return}
  const n=+document.getElementById("pn").value,fb=document.getElementById("pm").value==="fb";
  if(!canStart())return;
  let pool=shuffle(bank().filter(q=>ar.includes(q.a)).map(q=>q.id));if(n)pool=pool.slice(0,n);
  if(!pool.length){alert("No hay preguntas en esas áreas.");return}
  newExam("prac",ar.length===5?"Práctica general":"Práctica: "+ar.map(a=>AREAS[a].n.split(",")[0].split(" (")[0]).join(" · "),pool,fb?0:Math.round(pool.length*144000),fb);
}
function startErrs(){
  let e=srsDue().map(x=>x.id);
  if(!e.length){const all=srsList();if(!all.length)return;if(!confirm(`No tienes repasos programados para hoy (el próximo es en ${plural(srsNext(),"día")}). ¿Quieres repasar igual tus ${plural(all.length,"pregunta")} en seguimiento? No avanzarán en el ciclo hasta que les toque.`))return;e=all.map(x=>x.id)}
  if(!canStart())return;
  newExam("err","Repaso espaciado",shuffle(e).slice(0,30),0,true);
}
function resume(){EX=store.get(K.exam,null);if(!EX)return home();if(EX.dur&&remaining()<=0){alert("El tiempo de esta evaluación terminó. Se calificará con las respuestas guardadas.");return finish(true)}go(0,true)}
function discard(){if(confirm("¿Descartar la evaluación en curso? No se guardará en el historial.")){store.set(K.exam,null);EX=null;home()}}

/* ---------- EXAMEN ---------- */
function accTime(){if(EX&&EX.qt0&&EX.cur){EX.tq=EX.tq||{};EX.tq[EX.cur]=(EX.tq[EX.cur]||0)+Math.min(Date.now()-EX.qt0,15*60000)}if(EX)EX.qt0=null}
function go(d,abs){if(!abs)EX.idx=Math.min(EX.ids.length-1,Math.max(0,EX.idx+d));saveEx();examView();window.scrollTo(0,0)}
function jump(i){EX.idx=i;go(0,true)}
function pick(oi){const id=EX.ids[EX.idx];if(EX.fb&&EX.ans[id]!==undefined)return;EX.ans[id]=oi;saveEx();const y=window.scrollY;examView();if(!EX.fb)window.scrollTo(0,y)}
function toggleFlag(){const id=EX.ids[EX.idx];if(EX.flag[id])delete EX.flag[id];else EX.flag[id]=1;saveEx();const y=window.scrollY;examView();window.scrollTo(0,y)}
function startTick(){stopTick();if(!EX.dur)return;TICK=setInterval(()=>{const r=remaining();const t=document.getElementById("timer");if(r<=0){stopTick();alert("Se terminó el tiempo. Tu evaluación se calificará ahora.");finish(true);return}if(t){t.textContent=fmt(r);t.classList.toggle("low",r<600000)}},1000)}
function examView(){
  accTime();stopSpeak();VIEW="exam";const m=byId(),id=EX.ids[EX.idx],q=m[id];
  if(!q){EX.ids.splice(EX.idx,1);if(!EX.ids.length){store.set(K.exam,null);return home()}EX.idx=Math.min(EX.idx,EX.ids.length-1);return go(0,true)}
  EX.cur=id;EX.qt0=Date.now();saveEx();
  const p=EX.perm[id],a=EX.ans[id],lock=EX.fb&&a!==undefined,last=EX.idx===EX.ids.length-1;
  app().innerHTML=`<header class="top"><button class="ic" onclick="exitExam()" aria-label="Salir">✕</button><div class="mid"><div class="kicker">${esc(EX.title)}</div><b>Pregunta ${EX.idx+1} de ${EX.ids.length}</b></div><div id="timer" class="timer ${EX.dur&&remaining()<600000?"low":""}">${EX.dur?fmt(remaining()):answered()+"/"+EX.ids.length}</div></header>
  <div class="prog"><i style="width:${answered()/EX.ids.length*100}%"></i></div>
  <main class="wrap">
   <div class="chips"><span class="chip">${esc(AREAS[q.a]?.n)}</span>${q.s?`<span class="chip">${esc(q.s)}</span>`:""}${q.t?`<span class="chip">${esc(q.t)}</span>`:""}${TTS?`<button class="spk" onclick="speakQ()">🔊 Escuchar</button>`:""}</div>
   <div class="card"><p class="stem">${esc(q.q)}</p>
   ${p.map((oi,k)=>{let c="opt";if(a===oi)c+=" sel";if(lock){if(oi===0)c+=" ok";else if(a===oi)c+=" bad"}return `<button class="${c}" ${lock?"disabled":""} onclick="pick(${oi})"><span class="lt">${L[k]}</span><span>${esc(q.o[oi].x)}</span></button>`}).join("")}
   </div>
   ${lock?reviewBody(q,p,a,true):""}
  </main>
  <footer class="bar"><button class="btn" onclick="go(-1)" ${EX.idx?"":"disabled"}>‹ Anterior</button><button class="btn sq ${EX.flag[id]?"flagon":""}" onclick="toggleFlag()" aria-label="Marcar">⚑</button><button class="btn sq" onclick="gridView()" aria-label="Mapa">▦</button>${last?`<button class="btn pri" onclick="askFinish()">Finalizar</button>`:`<button class="btn pri" onclick="go(1)">Siguiente ›</button>`}</footer>`;
  startTick();
}
function gridView(){
  accTime();saveEx();stopSpeak();VIEW="grid";const n=EX.ids.length,un=n-answered(),fl=Object.keys(EX.flag).length;
  app().innerHTML=`<header class="top"><button class="ic" onclick="go(0,true)">‹</button><div class="mid"><div class="kicker">${esc(EX.title)}</div><b>Mapa de preguntas</b></div><div id="timer" class="timer">${EX.dur?fmt(remaining()):""}</div></header>
  <main class="wrap"><div class="card"><p class="muted" style="margin:0 0 12px;font-size:14px">${answered()} respondidas · ${un} sin responder · ${fl} marcadas</p>
  <div class="nums">${EX.ids.map((id,i)=>{let c=[];if(EX.ans[id]!==undefined)c.push(EX.fb?(EX.ans[id]===0?"ok":"bad"):"an");if(EX.flag[id])c.push("fl");if(i===EX.idx)c.push("cur");return `<button class="${c.join(" ")}" onclick="jump(${i})">${i+1}</button>`}).join("")}</div></div>
  <button class="btn pri" style="width:100%" onclick="askFinish()">Finalizar y calificar</button></main>`;
  startTick();
}
function askFinish(){const un=EX.ids.length-answered(),fl=Object.keys(EX.flag).length;
  let msg="¿Finalizar y calificar?";if(un)msg+=`\n\nTienes ${un} pregunta${un>1?"s":""} sin responder (cuentan como incorrectas).`;if(fl)msg+=`\n${fl} marcada${fl>1?"s":""} para revisar.`;
  if(confirm(msg))finish(false)}
function exitExam(){accTime();saveEx();if(confirm(EX.dur?"¿Salir al inicio? Tu evaluación queda guardada, pero el cronómetro sigue corriendo.":"¿Salir al inicio? Tu avance queda guardado."))home();else if(VIEW==="exam"){EX.qt0=Date.now()}}

/* ---------- CALIFICACIÓN ---------- */
function finish(auto){
  accTime();stopTick();stopSpeak();const m=byId();let ok=0;const by={},wrong=[];
  EX.ids.forEach(id=>{const q=m[id];if(!q)return;by[q.a]=by[q.a]||[0,0];by[q.a][1]++;if(EX.ans[id]===0){ok++;by[q.a][0]++}else wrong.push(id)});
  EX.done=true;EX.end=Math.min(Date.now(),EX.dur?EX.start+EX.dur:Date.now());EX.ok=ok;EX.by=by;EX.auto=!!auto;
  EX.srs=srsUpdate(EX.ids.filter(id=>m[id]),EX.ans);
  const QS=store.get(K.qs,{});EX.ids.forEach(id=>{if(!m[id])return;const s=QS[id]||[0,0,0];s[0]++;if(EX.ans[id]===0)s[1]++;s[2]=(s[2]||0)+((EX.tq||{})[id]||0);QS[id]=s});store.set(K.qs,QS);
  if(answered()>=5||EX.mode==="daily")EX.streak=bumpStreak().n;
  if(EX.mode==="daily")store.set(K.daily,TODAY());
  EX.lvChange=[];
  if(EX.mode==="sim"){const lv=levels();
    for(const a in by){const[o,t]=by[a],p=o/t,from=lv[a];let to=from;if(p>=UP)to=Math.min(5,from+1);else if(p<DOWN)to=Math.max(1,from-1);lv[a]=to;EX.lvChange.push({a,from,to,p})}
    store.set(K.lvl,lv);EX.lvAfter=lv}
  const h=store.get(K.hist,[]);h.unshift({d:EX.end,mode:EX.mode,title:EX.title,n:EX.ids.length,ok,by,used:EX.end-EX.start,auto:EX.auto,g:EX.mode==="sim"?globalLv():undefined});store.set(K.hist,h.slice(0,200));
  store.set(K.last,EX);store.set(K.exam,null);
  resultsView(EX);
}
function paceCard(ex){const tq=ex.tq||{},ids=ex.ids.filter(id=>tq[id]);if(!ids.length)return"";const m=byId();
  const tot=ids.reduce((s,id)=>s+tq[id],0),avg=tot/ids.length,slow=ids.slice().sort((x,y)=>tq[y]-tq[x]).slice(0,3).filter(id=>tq[id]>PACE);
  return `<div class="card"><h3>Ritmo</h3><p class="muted" style="font-size:14px;margin:0 0 6px;line-height:1.5">Promedio: <b style="color:var(--${avg>PACE*1.1?"bad":avg>PACE*.9?"warn":"ok"})">${mmss(avg)}</b> por pregunta · objetivo del examen: ${mmss(PACE)} (50 preguntas en 2 horas).</p>
  ${slow.length?`<p class="muted" style="font-size:13px;margin:8px 0 4px">Donde más te demoraste:</p>${slow.map(id=>`<div class="pk"><span>Pregunta ${ex.ids.indexOf(id)+1} · ${esc(m[id]?m[id].s:"")}</span><b>${mmss(tq[id])}</b></div>`).join("")}`:""}</div>`}
function trackCls(p){return p>=.7?"g":p>=.5?"y":"rd"}
function resultsView(ex){
  VIEW="results";stopTick();const n=ex.ids.length,nt=nota(ex.ok,n);
  app().innerHTML=`<header class="top"><button class="ic" onclick="home()">‹</button><div class="mid"><div class="kicker">${esc(ex.title)}</div><b>Resultado</b></div></header>
  <main class="wrap">
  <div class="card score"><div class="big" style="color:var(--${nt>=7?"ok":nt>=5?"warn":"bad"})">${nt.toFixed(2)}</div><div class="sub">sobre 10 · ${ex.ok} de ${n} correctas (${Math.round(ex.ok/n*100)}%)</div>
  <div class="sub">Tiempo usado: ${fmt(ex.end-ex.start)}${ex.dur?" de "+fmt(ex.dur):""}${ex.auto?" · finalizado por tiempo":""}</div></div>

function impFile(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>doImport(String(r.result));r.readAsText(f)}
function doImport(txt){
  let raw,aik=null;try{raw=JSON.parse(txt)}catch(e){aik=parseAiken(txt);if(!aik.items.length&&!aik.bad.length){alert("No reconozco el formato. Usa JSON (como el ejemplo) o AIKEN (Q1. / A. / B. / C. / D. / ANSWER: A).");return}
    if(!aik.items.length){alert("No se importó ninguna pregunta AIKEN:\n\n"+aik.bad.slice(0,8).join("\n"));return}
    const a=prompt(`Detecté ${aik.items.length} preguntas en formato AIKEN. ¿A qué área pertenecen?\n1 Constitucional/DD. HH./Administrativo\n2 Penal y Procesal Penal\n3 Procesal y Métodos Alternativos\n4 Civil\n5 Int. Privado/Mercantil/Tributario/Laboral`,"3");if(a==null)return;
    if(!AREAS[+a]){alert("Área no válida (1 a 5).");return}aik.items.forEach(x=>x.area=+a);raw=aik.items}
  let data=Array.isArray(raw)?raw:Array.isArray(raw.preguntas)?raw.preguntas:[raw];if(!Array.isArray(raw))data.bibliografia=raw.bibliografia;
  const out=[],bad=aik?aik.bad.slice():[],stamp=Date.now().toString(36),seen=new Set(bank().map(qKey));let dup=0;
  const bib=data.bibliografia||{};let biased=0;
  data.forEach((x,i)=>{try{const q=normItem(x,"U"+stamp+"-"+i,bib);const k=qKey(q);if(seen.has(k)){dup++;return}seen.add(k);if(lenBias(q.o.map(o=>o.x),0)>1.35)biased++;out.push(q)}catch(e){bad.push("Pregunta "+(i+1)+": "+e)}});
  if(out.length){store.set(K.custom,store.get(K.custom,[]).concat(out))}
  alert(`Importadas: ${out.length}${dup?"\nOmitidas por repetidas (ya estaban en el banco o duplicadas en el archivo): "+dup:""}${aik&&out.length?"\nLas preguntas AIKEN no traen argumentación de cada opción ni bibliografía.":""}${biased?"\nAtención: en "+biased+" de ellas la correcta es bastante más larga que los distractores (se adivina fácil). Conviene equilibrarlas.":""}${bad.length?"\nCon errores (omitidas): "+bad.length+"\n\n"+bad.slice(0,8).join("\n"):""}`);
  bankView();
}

}
function restoreFile(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{let d;try{d=JSON.parse(String(r.result))}catch(e){alert("El archivo no es un respaldo válido.");return}
  if(!d||d.app!=="simulador-complexivo-ute"||typeof d.datos!=="object"){alert("Este archivo no es un respaldo del Simulador Complexivo.");return}
  const n=(d.datos[K.hist]||[]).length;if(!confirm(`Respaldo del ${new Date(d.fecha).toLocaleString("es-EC",{dateStyle:"medium",timeStyle:"short"})} con ${plural(n,"evaluación","evaluaciones")}. ¿Reemplazar tu progreso actual?`))return;
  for(const k of Object.values(K))store.set(k,k in d.datos?d.datos[k]:null);store.set(K.bk,Date.now());EX=null;toast("Progreso restaurado.");home()};r.readAsText(f)}

/* ---------- PROPONER PREGUNTA ---------- */
function proposeView(){
  VIEW="propose";stopTick();
  app().innerHTML=`<header class="top"><button class="ic" onclick="home()">‹</button><div class="mid"><div class="kicker">Aportar al banco</div><b>Proponer pregunta</b></div></header>
  <main class="wrap"><div class="card">
  <label class="fld">Área</label><select id="pa">${Object.entries(AREAS).map(([a,v])=>`<option value="${a}">${esc(v.n)}</option>`).join("")}</select>
  <label class="fld">Subárea</label><input type="text" id="ps" placeholder="Ej.: Sucesiones">
  <label class="fld">Tema</label><input type="text" id="pt" placeholder="Ej.: Porción conyugal">
  <label class="fld">Resultado de aprendizaje</label><input type="text" id="pr" placeholder="Ej.: Aplica las reglas de la porción conyugal">
  <label class="fld">Demanda cognitiva</label><select id="pd">${["Recordar","Comprender","Aplicar","Analizar","Evaluar"].map(x=>`<option${x==="Aplicar"?" selected":""}>${x}</option>`).join("")}</select>
  <label class="fld">Enunciado</label><textarea id="pq" style="font-family:inherit;font-size:15px;min-height:110px" placeholder="Caso o pregunta, breve y técnico"></textarea>
  <label class="fld">Alternativas (marca la correcta)</label>
  ${[0,1,2,3].map(i=>`<div class="optrow"><label><input type="radio" name="pc" value="${i}" ${i===0?"checked":""}> Opción ${L[i]}</label><textarea id="po${i}" placeholder="Texto de la opción ${L[i]}"></textarea><textarea id="pw${i}" placeholder="Por qué es correcta o incorrecta (con el artículo)"></textarea></div>`).join("")}
  <label class="fld">Referencias (una por línea, en APA 7)</label><textarea id="pref" style="font-family:inherit;font-size:14px;min-height:80px"></textarea>
  </div>
  <div class="row"><button class="btn pri" onclick="proposeSave()">Agregar a mi banco</button><button class="btn" onclick="proposeShare()">Compartir</button></div>
  <p class="note">Compartir envía la pregunta en el formato del banco. Quien administra el banco en línea la revisa y la publica en el siguiente paquete.</p></main>`;
}
function proposeItem(){const g=i=>document.getElementById(i).value.trim();
  return {area:+g("pa"),subarea:g("ps"),tema:g("pt"),resultado:g("pr"),demanda:g("pd"),enunciado:g("pq"),
    opciones:[0,1,2,3].map(i=>({texto:g("po"+i),justificacion:g("pw"+i)})),correcta:+document.querySelector("input[name=pc]:checked").value,referencias:g("pref").split("\n").map(x=>x.trim()).filter(Boolean)}}
/* Sesgo de longitud: la correcta no debe delatarse por ser mucho más larga que los distractores */
/* Clave para detectar preguntas repetidas: enunciado + opciones, sin mayúsculas, tildes ni signos */
function normTxt(t){return String(t||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9ñ ]+/g," ").replace(/\s+/g," ").trim()}
function qKey(q){return normTxt(q.q)+"|"+q.o.map(o=>normTxt(o.x)).sort().join("|")}
/* Formato AIKEN (Moodle): enunciado, opciones "A." a "D." y línea "ANSWER: X" */
function parseAiken(txt){const items=[],bad=[];let cur=null,n=0;
  const close=()=>{if(!cur)return;n++;const lab="Pregunta "+n+(cur.q?" («"+cur.q.slice(0,40)+"…»)":"");
    if(cur.opts.length!==4)bad.push(lab+": debe tener exactamente 4 opciones (tiene "+cur.opts.length+")");
    else if(cur.ans==null)bad.push(lab+": falta la línea ANSWER");
    else{const c="ABCD".indexOf(cur.ans);if(c<0)bad.push(lab+": ANSWER no válido");else items.push({enunciado:cur.q,opciones:cur.opts.map(t=>({texto:t,justificacion:""})),correcta:c,subarea:"",tema:"",demanda:"",referencias:[]})}
    cur=null};
  for(let line of String(txt).replace(/\r/g,"").split("\n")){line=line.trim();if(!line)continue;
    let m;
    if((m=line.match(/^ANSWER\s*:\s*([A-Za-z])/i))){if(cur)cur.ans=m[1].toUpperCase();close();continue}
    if(cur&&cur.opts.length<6&&(m=line.match(/^([A-Fa-f])\s*[\.\)]\s*(.+)$/))&&m[1].toUpperCase()==="ABCDEF"[cur.opts.length]){cur.opts.push(m[2].trim());continue}
    if(cur&&cur.opts.length){if(/^(Q|P|Pregunta)?\s*\d+\s*[\.\)\-:]/i.test(line))close();else continue} /* notas tras las opciones (p. ej., «Tema → art.») */
    line=line.replace(/^(Q|P|Pregunta)?\s*\d+\s*[\.\)\-:]\s*/i,"");
    if(!cur)cur={q:line,opts:[],ans:null};else cur.q+=" "+line}
  if(cur)close();return {items,bad}}
function lenBias(textos,c){const L=textos.map(t=>String(t||"").length),ds=L.filter((_,i)=>i!==c),avg=ds.reduce((a,b)=>a+b,0)/ds.length;return avg?L[c]/avg:1}
function proposeCheck(x){if(!x.enunciado)return"Falta el enunciado.";if(x.opciones.some(o=>!o.texto))return"Completa las cuatro alternativas.";if(x.opciones.some(o=>!o.justificacion))return"Argumenta las cuatro alternativas (por qué cada una es correcta o incorrecta).";if(!x.subarea||!x.tema)return"Indica la subárea y el tema.";
  const r=lenBias(x.opciones.map(o=>o.texto),x.correcta);if(r>1.35)return`La alternativa correcta es ${Math.round((r-1)*100)} % más larga que el promedio de los distractores, y eso la delata. Acórtala (lleva la explicación a su justificación) o desarrolla más los distractores.`;return""}
function proposeSave(){const x=proposeItem(),e=proposeCheck(x);if(e){alert(e);return}
  try{const q=normItem(x,"U"+Date.now().toString(36)+"-p",{});store.set(K.custom,store.get(K.custom,[]).concat([q]));VIEW="home";toast("Pregunta agregada a tu banco.");home()}catch(err){alert(String(err))}}
async function proposeShare(){const x=proposeItem(),e=proposeCheck(x);if(e){alert(e);return}
  const txt=JSON.stringify([x],null,2);
  try{if(navigator.share){await navigator.share({title:"Pregunta para el Simulador Complexivo",text:txt});return}}catch(err){if(err&&err.name==="AbortError")return}
  try{await navigator.clipboard.writeText(txt);toast("Pregunta copiada. Pégala en WhatsApp o correo.")}catch(err){const blob=new Blob([txt],{type:"application/json"}),u=URL.createObjectURL(blob),l=document.createElement("a");l.href=u;l.download="pregunta-propuesta.json";document.body.appendChild(l);l.click();l.remove()}}

  try{history.pushState({s:1},"")}catch(e){}
  if(VIEW==="exam")exitExam();

});
document.addEventListener("visibilitychange",()=>{if(EX&&!EX.done&&VIEW==="exam"){if(document.hidden){accTime();saveEx();stopSpeak()}else EX.qt0=Date.now()}});

setInterval(()=>sync(false),6*3600*1000);

if(isWeb()&&"serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(()=>{})}

home();
setTimeout(()=>sync(false),800);
