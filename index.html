adjudica; eso lo hace la partición."}, {"texto": "Testamento, porque solo el testador puede dividir los bienes entre los herederos.", "justificacion": "Incorrecta. La partición la pueden promover los herederos, no solo el testador."}, {"texto": "Posesión efectiva, porque con ella se divide automáticamente la herencia entre herederos.", "justificacion": "Incorrecta. La posesión efectiva declara la calidad de heredero, no divide ni adjudica los bienes."}], "correcta": 0, "referencias": ["CC"]}, {"id": "EX-090", "area": 5, "subarea": "Mercantil", "tema": "Letra de cambio", "resultado": "Identifica los requisitos de la letra de cambio.", "demanda": "Comprender", "enunciado": "Un documento denominado letra de cambio no indica la fecha de vencimiento ni el lugar de pago. ¿Qué consecuencia tiene?", "opciones": [{"texto": "Sigue siendo válida: la ley suple esos datos con presunciones.", "justificacion": "Correcta. A falta de vencimiento se entiende pagadera a la vista; a falta de lugar, el del girado. Base legal: normas sobre la letra de cambio del Código de Comercio de 2019."}, {"texto": "Es nula, porque sin esos datos no existe letra de cambio válida.", "justificacion": "Incorrecta. La falta de esos datos se suple por presunciones legales del Código de Comercio."}, {"texto": "Se convierte en cheque, pagadero a la vista contra un banco.", "justificacion": "Incorrecta. El cheque es un título distinto, con régimen propio."}, {"texto": "Se convierte automáticamente en un pagaré a la orden.", "justificacion": "Incorrecta. La letra no se convierte en pagaré por falta de vencimiento."}], "correcta": 0, "referencias": ["CCOM"]}, {"id": "EX-091", "area": 5, "subarea": "Mercantil", "tema": "Pagaré", "resultado": "Distingue pagaré de letra de cambio.", "demanda": "Comprender", "enunciado": "Una persona firma un documento en que promete pagar una suma a otra, sin intervención de un tercero girado. ¿Qué título es?", "opciones": [{"texto": "Pagaré.", "justificacion": "Correcta. El pagaré es la promesa incondicional de pagar una suma determinada. Base legal: normas sobre el pagaré del Código de Comercio de 2019."}, {"texto": "Letra de cambio.", "justificacion": "Incorrecta. La letra exige girador, girado y beneficiario; aquí hay promesa directa."}, {"texto": "Cheque.", "justificacion": "Incorrecta. El cheque es orden contra un banco; aquí hay promesa de pago del suscriptor."}, {"texto": "Endoso.", "justificacion": "Incorrecta. El endoso transmite un título, no es la promesa inicial de pago."}], "correcta": 0, "referencias": ["CCOM"]}, {"id": "EX-092", "area": 5, "subarea": "Mercantil", "tema": "Cheque", "resultado": "Identifica la naturaleza del cheque.", "demanda": "Comprender", "enunciado": "Un cheque es girado contra un banco para que pague una suma a su presentación. ¿Qué caracteriza al cheque?", "opciones": [{"texto": "Es una orden incondicional de pago a la vista, girada contra un banco.", "justificacion": "Correcta. El cheque es orden incondicional de pago a la vista contra una institución financiera."}, {"texto": "Es una promesa de pago a plazo, que el banco paga cuando lo estime conveniente.", "justificacion": "Incorrecta. El cheque es pagadero a la vista, no a plazo ni a conveniencia del banco."}, {"texto": "Es un título de crédito a largo plazo, que se paga a los 90 días de su emisión.", "justificacion": "Incorrecta. El cheque no es a largo plazo; es pagadero a la vista."}, {"texto": "Es un contrato de préstamo, que obliga al banco a prestar dinero al beneficiario.", "justificacion": "Incorrecta. El cheque no es préstamo; es orden de pago con fondos disponibles."}], "correcta": 0, "referencias": ["CCOM"]}, {"id": "EX-093", "area": 5, "subarea": "Mercantil", "tema": "Endoso", "resultado": "Identifica los efectos del endoso.", "demanda": "Aplicar", "enunciado": "El beneficiario de una letra de cambio la endosa a un tercero, entregándole el título. ¿Qué efecto produce el endoso?", "opciones": [{"texto": "Transmite los derechos del título al endosatario, quien puede exigir el pago.", "justificacion": "Correcta. El endoso transmite la propiedad del título y los derechos que incorpora."}, {"texto": "Extingue la letra, porque el endoso pone fin a la obligación cambiaria.", "justificacion": "Incorrecta. El endoso no extingue; transmite los derechos del título."}, {"texto": "Convierte la letra en cheque, porque el endoso cambia la naturaleza del título.", "justificacion": "Incorrecta. El endoso no cambia la naturaleza del título; sigue siendo letra."}, {"texto": "Anula la letra, porque solo el girador puede transmitir el título cambiario.", "justificacion": "Incorrecta. El beneficiario puede endosar; no solo el girador transmite."}], "correcta": 0, "referencias": ["CCOM"]}, {"id": "EX-094", "area": 5, "subarea": "Mercantil", "tema": "Compañía de responsabilidad limitada", "resultado": "Identifica las características de la compañía limitada.", "demanda": "Comprender", "enunciado": "Dos personas quieren constituir una compañía donde su responsabilidad se limite al aporte y el capital se divida en participaciones. ¿Qué tipo corresponde?", "opciones": [{"texto": "Compañía de responsabilidad limitada, con capital dividido en participaciones.", "justificacion": "Correcta. En la limitada el capital se divide en participaciones y los socios responden hasta su aporte. Base legal: art. 92-95 de la Ley de Compañías."}, {"texto": "Compañía anónima, porque su capital se divide en acciones y la responsabilidad es limitada.", "justificacion": "Incorrecta. La anónima divide en acciones; la de responsabilidad limitada divide en participaciones."}, {"texto": "Compañía en nombre colectivo, porque los socios responden solidariamente con todo su patrimonio.", "justificacion": "Incorrecta. En la colectiva la responsabilidad es solidaria e ilimitada, no limitada al aporte."}, {"texto": "Compañía en comandita, porque combina socios gestores y comanditarios con distinta responsabilidad.", "justificacion": "Incorrecta. La comandita tiene dos clases de socios; aquí se busca solo responsabilidad limitada."}], "correcta": 0, "referencias": ["LC"]}, {"id": "EX-095", "area": 5, "subarea": "Mercantil", "tema": "Representación societaria", "resultado": "Distingue representante legal de apoderado.", "demanda": "Analizar", "enunciado": "El gerente general de una compañía suscribe un contrato dentro del objeto social y de las facultades inscritas. ¿En qué calidad actúa?", "opciones": [{"texto": "Como representante legal de la compañía, dentro de sus facultades.", "justificacion": "Correcta. El representante legal actúa a nombre de la compañía dentro del objeto y sus facultades."}, {"texto": "Como apoderado especial, con poder para un acto concreto.", "justificacion": "Incorrecta. El gerente actúa como representante legal, no como apoderado especial."}, {"texto": "Como socio, a nombre propio y no de la compañía.", "justificacion": "Incorrecta. El gerente no actúa a nombre propio ni por ser socio, sino como representante."}, {"texto": "Como tercero, de modo que el contrato lo obliga solo a él.", "justificacion": "Incorrecta. Si actúa dentro de sus facultades, obliga a la compañía, no a él personalmente."}], "correcta": 0, "referencias": ["LC"]}, {"id": "EX-096", "area": 5, "subarea": "Internacional Privado", "tema": "Conflicto de leyes", "resultado": "Identifica la ley aplicable en conflicto de leyes.", "demanda": "Comprender", "enunciado": "Un ecuatoriano residente en España celebra un contrato en Francia para ejecutarse en Ecuador. Surge conflicto sobre qué ley rige la forma. ¿Qué debe analizar el juez?", "opciones": [{"texto": "Aplicar la norma de conflicto para determinar la ley aplicable a la forma del acto.", "justificacion": "Correcta. La norma de conflicto indica qué ley rige la forma, capacidad y fondo del acto. Base legal: normas de conflicto del Título Preliminar del Código Civil."}, {"texto": "Aplicar siempre la ley ecuatoriana, porque el juez ecuatoriano solo aplica su propia ley.", "justificacion": "Incorrecta. El juez puede aplicar ley extranjera según las normas de conflicto."}, {"texto": "Aplicar la ley que elija el demandado, porque el demandado decide la ley aplicable.", "justificacion": "Incorrecta. La ley aplicable no la elige unilateralmente el demandado."}, {"texto": "Declararse incompetente, porque todo caso con elemento extranjero debe resolverse en el extranjero.", "justificacion": "Incorrecta. La presencia de elemento extranjero no implica incompetencia automática."}], "correcta": 0, "referencias": ["CC", "COGEP"]}, {"id": "EX-097", "area": 5, "subarea": "Internacional Privado", "tema": "Exequátur", "resultado": "Identifica los requisitos del exequátur.", "demanda": "Analizar", "enunciado": "Una sentencia extranjera de divorcio quiere ejecutarse en Ecuador. ¿Qué debe obtenerse?", "opciones": [{"texto": "El exequátur, que homologa la sentencia extranjera para que surta efectos.", "justificacion": "Correcta. El exequátur es el procedimiento para homologar sentencias extranjeras. Base legal: arts. 102 a 104 del Código Orgánico General de Procesos."}, {"texto": "Apostilla, porque con la apostilla la sentencia extranjera se ejecuta automáticamente.", "justificacion": "Incorrecta. La apostilla autentica el documento, pero no homologa la sentencia."}, {"texto": "Traducción, porque con traducir la sentencia ya puede ejecutarse en Ecuador.", "justificacion": "Incorrecta. La traducción no sustituye la homologación por exequátur."}, {"texto": "Nada, porque las sentencias extranjeras tienen efecto automático en Ecuador.", "justificacion": "Incorrecta. Las sentencias extranjeras no tienen efecto automático; requieren exequátur."}], "correcta": 0, "referencias": ["COGEP"]}, {"id": "EX-098", "area": 5, "subarea": "Internacional Privado", "tema": "Domicilio y nacionalidad", "resultado": "Distingue domicilio de nacionalidad.", "demanda": "Comprender", "enunciado": "Un ciudadano colombiano con domicilio en Quito celebra un acto jurídico en Ecuador. ¿Qué determina su domicilio y qué su nacionalidad?", "opciones": [{"texto": "Domicilio: residencia con ánimo de permanecer; nacionalidad: vínculo con un Estado.", "justificacion": "Correcta. El domicilio es residencia con ánimo de permanencia; la nacionalidad es el vínculo con el Estado. Base legal: art. 45-48 del Código Civil; art. 6-8 de la Constitución de la República."}, {"texto": "El domicilio y la nacionalidad son lo mismo, porque ambos dependen del lugar de nacimiento.", "justificacion": "Incorrecta. Son categorías distintas: domicilio es residencia; nacionalidad es vínculo jurídico."}, {"texto": "El domicilio es su nacionalidad, porque el domicilio se adquiere por nacer en un país.", "justificacion": "Incorrecta. El nacimiento determina nacionalidad, no necesariamente domicilio."}, {"texto": "La nacionalidad es su residencia, porque vivir en un país otorga automáticamente la nacionalidad.", "justificacion": "Incorrecta. Residir no otorga automáticamente la nacionalidad."}], "correcta": 0, "referencias": ["CC", "CRE"]}, {"id": "EX-099", "area": 5, "subarea": "Internacional Privado", "tema": "Contratos internacionales", "resultado": "Aplica la autonomía de la voluntad en contratos internacionales.", "demanda": "Aplicar", "enunciado": "Dos empresas de distintos países pactan que su contrato se regirá por la ley de un tercer país, sin vulnerar orden público. ¿Es válido el pacto?", "opciones": [{"texto": "Sí, porque en contratos internacionales rige la autonomía de la voluntad para elegir la ley.", "justificacion": "Correcta. Las partes pueden elegir la ley aplicable, respetando normas imperativas y orden público."}, {"texto": "No, porque las partes nunca pueden elegir la ley aplicable a su contrato internacional.", "justificacion": "Incorrecta. En contratos internacionales las partes pueden elegir la ley aplicable."}, {"texto": "No, porque solo el juez puede elegir la ley aplicable al contrato internacional.", "justificacion": "Incorrecta. El juez aplica la norma de conflicto, pero respeta la elección válida de las partes."}, {"texto": "Sí, porque la elección de ley permite eludir cualquier norma imperativa del foro.", "justificacion": "Incorrecta. La autonomía no permite eludir normas imperativas ni el orden público."}], "correcta": 0, "referencias": ["BUST"]}, {"id": "EX-100", "area": 5, "subarea": "Mercantil", "tema": "Acto de comercio", "resultado": "Identifica el acto de comercio.", "demanda": "Comprender", "enunciado": "Una persona compra mercaderías para revenderlas con ánimo de lucro, de forma habitual. ¿Qué acto realiza?", "opciones": [{"texto": "Acto de comercio, porque hay intermediación y ánimo de lucro en la compra para reventa.", "justificacion": "Correcta. El acto de comercio implica intermediación y ánimo de lucro en la circulación de bienes. Base legal: Código de Comercio de 2019."}, {"texto": "Acto civil, porque la compra de mercaderías es siempre un acto civil sin lucro.", "justificacion": "Incorrecta. La compra para revender con lucro es acto de comercio."}, {"texto": "Acto administrativo, porque la compra requiere autorización de una entidad pública.", "justificacion": "Incorrecta. No requiere autorización administrativa para ser acto de comercio."}, {"texto": "Acto laboral, porque la compra se realiza en ejercicio de una relación de trabajo.", "justificacion": "Incorrecta. No hay relación laboral; es actividad mercantil."}], "correcta": 0, "referencias": ["CCOM"]}, {"id": "EX-101", "area": 5, "subarea": "Mercantil", "tema": "Comerciante", "resultado": "Identifica quién es comerciante.", "demanda": "Comprender", "enunciado": "Una persona ejerce habitualmente actos de comercio, con empresa organizada y por cuenta propia. ¿Cómo se la califica?", "opciones": [{"texto": "Comerciante, porque ejerce de forma habitual y por cuenta propia actos de comercio.", "justificacion": "Correcta. Es comerciante quien habitualmente ejerce actos de comercio por cuenta propia. Base legal: Código de Comercio de 2019."}, {"texto": "Consumidor, porque quien compra mercaderías para revender es consumidor final.", "justificacion": "Incorrecta. El consumidor adquiere para uso final, no para revender con lucro."}, {"texto": "Artesano, porque todo comerciante es artesano por ejercer una actividad manual.", "justificacion": "Incorrecta. El artesano ejerce actividad manual; no todo comerciante es artesano."}, {"texto": "Trabajador, porque ejerce su actividad bajo dependencia de un empleador.", "justificacion": "Incorrecta. El comerciante actúa por cuenta propia, no bajo dependencia."}], "correcta": 0, "referencias": ["CCOM"]}, {"id": "EX-103", "area": 5, "subarea": "Mercantil", "tema": "Sociedades mercantiles", "resultado": "Distingue compañía anónima de limitada.", "demanda": "Comprender", "enunciado": "Una compañía quiere emitir acciones negociables en el mercado y tener muchos accionistas. ¿Qué tipo le conviene?", "opciones": [{"texto": "Compañía anónima, porque su capital se divide en acciones negociables.", "justificacion": "Correcta. En la anónima el capital se divide en acciones, que son negociables. Base legal: art. 143-145 de la Ley de Compañías."}, {"texto": "Compañía limitada, porque su capital se divide en acciones negociables en el mercado.", "justificacion": "Incorrecta. La limitada divide en participaciones, no en acciones negociables."}, {"texto": "Compañía comandita, porque su capital se divide en acciones para el público.", "justificacion": "Incorrecta. La comandita tiene socios gestores y comanditarios; no es la forma típica para emitir acciones."}, {"texto": "Compañía colectiva, porque sus socios responden solidariamente y pueden emitir acciones.", "justificacion": "Incorrecta. La colectiva no divide en acciones negociables; la responsabilidad es solidaria."}], "correcta": 0, "referencias": ["LC"]}, {"id": "EX-104", "area": 5, "subarea": "Tributario", "tema": "Obligación tributaria", "resultado": "Identifica el hecho generador.", "demanda": "Comprender", "enunciado": "Una persona vende un inmueble y obtiene una ganancia. La ley prevé que esa ganancia genera impuesto a la renta. ¿Qué es el hecho generador?", "opciones": [{"texto": "El hecho previsto en la ley cuya realización genera la obligación de pagar el tributo.", "justificacion": "Correcta. El hecho generador es el supuesto legal cuya realización hace nacer la obligación tributaria. Base legal: art. 15-16 del Código Orgánico Tributario."}, {"texto": "El pago del tributo, porque sin pago no existe hecho generador alguno.", "justificacion": "Incorrecta. El pago extingue la obligación; el hecho generador la hace nacer."}, {"texto": "La fiscalización, porque la obligación nace cuando la administración fiscaliza al contribuyente.", "justificacion": "Incorrecta. La fiscalización verifica, pero la obligación nace con el hecho generador."}, {"texto": "La declaración, porque sin declaración no nace la obligación tributaria.", "justificacion": "Incorrecta. La declaración determina, pero el hecho generador es el que hace nacer la obligación."}], "correcta": 0, "referencias": ["CTRIB"]}, {"id": "EX-105", "area": 5, "subarea": "Tributario", "tema": "Principios tributarios", "resultado": "Aplica el principio de legalidad tributaria.", "demanda": "Comprender", "enunciado": "Un municipio crea por resolución una tasa que no está prevista en ordenanza ni en ley. ¿Qué principio vulnera?", "opciones": [{"texto": "Legalidad: las tasas se crean por ordenanza, no por simple resolución.", "justificacion": "Correcta. Solo por acto normativo de órgano competente se pueden establecer, modificar, exonerar o extinguir tasas y contribuciones (art. 301 de la Constitución); en los municipios ese acto es la ordenanza del concejo, no una resolución administrativa."}, {"texto": "Generalidad: la tasa debe aplicarse por igual a todas las personas.", "justificacion": "Incorrecta. El vicio está en el instrumento usado para crear la tasa."}, {"texto": "Simplicidad administrativa: la tasa debe ser fácil de recaudar.", "justificacion": "Incorrecta. La simplicidad se refiere a la gestión del sistema tributario."}, {"texto": "Progresividad: la tasa debe crecer según la capacidad económica.", "justificacion": "Incorrecta. La progresividad orienta la carga tributaria, no el modo de crear tributos."}], "correcta": 0, "referencias": ["CRE", "CTRIB"]}, {"id": "EX-106", "area": 5, "subarea": "Tributario", "tema": "Sujeto activo y pasivo", "resultado": "Distingue sujeto activo de sujeto pasivo.", "demanda": "Comprender", "enunciado": "En el impuesto a la renta, el Estado exige el pago al contribuyente que obtuvo ingresos. ¿Quién es sujeto activo y quién pasivo?", "opciones": [{"texto": "El Estado es sujeto activo y el contribuyente, sujeto pasivo de la obligación.", "justificacion": "Correcta. El sujeto activo es el acreedor del tributo; el pasivo es quien debe pagarlo. Base legal: art. 23-24 del Código Orgánico Tributario."}, {"texto": "El Estado es sujeto pasivo, porque es quien paga el impuesto al contribuyente.", "justificacion": "Incorrecta. El Estado no paga; exige el tributo."}, {"texto": "Ambos son sujetos pasivos, porque ambos deben cumplir la obligación tributaria.", "justificacion": "Incorrecta. No ambos son pasivos; uno exige y otro paga."}, {"texto": "El contribuyente es sujeto activo, porque es quien genera el ingreso gravado.", "justificacion": "Incorrecta. Generar el ingreso no lo hace acreedor; es deudor del tributo."}], "correcta": 0, "referencias": ["CTRIB"]}, {"id": "EX-107", "area": 5, "subarea": "Tributario", "tema": "Infracciones tributarias", "resultado": "Distingue defraudación de contravención.", "demanda": "Analizar", "enunciado": "Un contribuyente simula operaciones con facturas falsas para pagar menos impuesto a la renta. ¿Qué infracción comete?", "opciones": [{"texto": "Defraudación tributaria.", "justificacion": "Correcta. Simular operaciones o usar facturas falsas para evadir tributos constituye defraudación tributaria, delito tipificado actualmente en el art. 298 del Código Orgánico Integral Penal."}, {"texto": "Una contravención por omisión en el pago.", "justificacion": "Incorrecta. La simulación con engaño para evadir excede la contravención."}, {"texto": "Una falta reglamentaria por deber formal.", "justificacion": "Incorrecta. No es solo formal; hay engaño para evadir el tributo."}, {"texto": "Solo una simulación con efectos civiles.", "justificacion": "Incorrecta. La simulación para evadir genera infracción tributaria, no solo civil."}], "correcta": 0, "referencias": ["COIP"]}, {"id": "EX-108", "area": 5, "subarea": "Laboral", "tema": "Contrato de trabajo", "resultado": "Identifica los elementos del contrato de trabajo.", "demanda": "Comprender", "enunciado": "Una persona presta servicios personales, bajo dependencia y por remuneración, para un empleador. ¿Qué contrato se configura?", "opciones": [{"texto": "Contrato de trabajo, porque concurren prestación personal, dependencia y remuneración.", "justificacion": "Correcta. El contrato de trabajo exige prestación personal, dependencia y remuneración. Base legal: art. 8 del Código del Trabajo."}, {"texto": "Contrato civil de servicios, porque toda prestación de servicios es civil y no laboral.", "justificacion": "Incorrecta. Si hay dependencia y remuneración, es laboral, no civil."}, {"texto": "Contrato de mandato, porque el trabajador actúa por mandato del empleador.", "justificacion": "Incorrecta. El mandato no exige dependencia ni remuneración laboral."}, {"texto": "Contrato de sociedad, porque trabajador y empleador son socios en la empresa.", "justificacion": "Incorrecta. No son socios; hay relación de dependencia laboral."}], "correcta": 0, "referencias": ["CT"]}, {"id": "EX-109", "area": 5, "subarea": "Laboral", "tema": "Despido intempestivo", "resultado": "Aplica las consecuencias del despido intempestivo.", "demanda": "Aplicar", "enunciado": "Un trabajador con 3 años de servicio es despedido sin causa justa ni visto bueno. ¿Qué debe pagar el empleador?", "opciones": [{"texto": "La indemnización por despido intempestivo.", "justificacion": "Correcta. El despido intempestivo obliga a pagar la indemnización según el tiempo de servicio: hasta tres años, tres meses de remuneración (art. 188 del Código del Trabajo), además de los haberes pendientes."}, {"texto": "Solo el último sueldo mensual devengado.", "justificacion": "Incorrecta. El despido intempestivo genera indemnización según tiempo de servicio."}, {"texto": "Nada, porque puede despedir en cualquier momento.", "justificacion": "Incorrecta. El despido sin causa genera indemnización por despido intempestivo."}, {"texto": "Solo las vacaciones no gozadas por el trabajador.", "justificacion": "Incorrecta. Además de vacaciones, debe indemnización por despido intempestivo."}], "correcta": 0, "referencias": ["CT"]}, {"id": "EX-110", "area": 5, "subarea": "Laboral", "tema": "Jornada y horas extras", "resultado": "Aplica los límites de la jornada laboral.", "demanda": "Aplicar", "enunciado": "Un trabajador labora 10 horas diarias de lunes a viernes por disposición de su empleador y reclama el pago de esas horas adicionales. ¿Qué corresponde?", "opciones": [{"texto": "El pago de las horas que exceden la jornada máxima, con el recargo legal.", "justificacion": "Correcta. La jornada máxima ordinaria es de ocho horas diarias y cuarenta semanales (art. 47 del Código del Trabajo); las horas que la exceden se pagan con el recargo legal (art. 55 del Código del Trabajo)."}, {"texto": "Nada, porque la jornada de 10 horas es la jornada ordinaria en Ecuador.", "justificacion": "Incorrecta. La jornada ordinaria máxima es de 8 horas diarias y 40 semanales."}, {"texto": "Compensación con vacaciones, porque las horas extras solo se compensan con vacaciones.", "justificacion": "Incorrecta. Las horas extras se pagan con recargo, no solo se compensan con vacaciones."}, {"texto": "Sanción al trabajador, porque trabajar más de 8 horas es falta del trabajador.", "justificacion": "Incorrecta. Exceder la jornada no es falta del trabajador si fue dispuesto por el empleador."}], "correcta": 0, "referencias": ["CT"]}, {"id": "EX-111", "area": 5, "subarea": "Laboral", "tema": "Visto bueno", "resultado": "Identifica cuándo procede el visto bueno.", "demanda": "Analizar", "enunciado": "Un empleador quiere despedir a un trabajador por indisciplina grave, pero sin pagar indemnización. ¿Qué debe obtener?", "opciones": [{"texto": "Solicitar el visto bueno ante el inspector del trabajo, probando la causal.", "justificacion": "Correcta. El visto bueno es la autorización para terminar el contrato por justa causa. Base legal: art. 172 y 621 del Código del Trabajo."}, {"texto": "Despido intempestivo, porque el empleador puede despedir sin autorización pagando indemnización.", "justificacion": "Incorrecta. Si quiere evitar indemnización por justa causa, debe obtener visto bueno."}, {"texto": "Renuncia, porque solo con renuncia del trabajador puede despedirse sin indemnización.", "justificacion": "Incorrecta. La renuncia es del trabajador; el visto bueno es del empleador por justa causa."}, {"texto": "Nada, porque el empleador puede despedir por indisciplina sin trámite alguno.", "justificacion": "Incorrecta. Despedir sin visto bueno por causa alegada se considera despido intempestivo."}], "correcta": 0, "referencias": ["CT"]}, {"id": "EX-113", "area": 1, "subarea": "Derechos Humanos", "tema": "Progresividad", "resultado": "Identifica el alcance del principio de progresividad.", "demanda": "Comprender", "enunciado": "Una reforma legal reduce el alcance de un derecho social previamente reconocido. ¿Qué principio resulta vulnerado?", "opciones": [{"texto": "El principio de progresividad y no regresividad de los derechos humanos.", "justificacion": "Correcta. El artículo 11 numeral 8 prohíbe la regresividad."}, {"texto": "El principio de igualdad formal entre todas las personas frente a la ley.", "justificacion": "Incorrecta. El problema no se centra en la igualdad formal."}, {"texto": "El principio de reserva de ley en materia de derechos fundamentales.", "justificacion": "Incorrecta. No es el principio directamente vulnerado."}, {"texto": "El principio de tipicidad que exige certeza en las normas restrictivas.", "justificacion": "Incorrecta. El tipicidad opera principalmente en el ámbito sancionatorio."}], "correcta": 0, "referencias": ["CRE"]}, {"id": "EX-114", "area": 1, "subarea": "Derecho Administrativo", "tema": "Acto administrativo", "resultado": "Identifica los elementos de validez del acto administrativo.", "demanda": "Comprender", "enunciado": "Un acto administrativo es emitido por un órgano incompetente. ¿Cuál es su régimen de validez?", "opciones": [{"texto": "Es nulo porque la competencia constituye un elemento esencial de validez.", "justificacion": "Correcta. El COA establece la competencia como presupuesto de validez. Base legal: art. 99 del Código Orgánico Administrativo."}, {"texto": "Es válido mientras no sea revocado por la misma autoridad que lo emitió.", "justificacion": "Incorrecta. La incompetencia genera nulidad."}, {"texto": "Es anulable solo a petición de parte dentro del plazo de caducidad.", "justificacion": "Incorrecta. La incompetencia produce nulidad de pleno derecho."}, {"texto": "Es válido porque los defectos de competencia se convalidan con el silencio.", "justificacion": "Incorrecta. Los vicios de competencia no se convalidan por silencio."}], "correcta": 0, "referencias": ["COA"]}, {"id": "EX-115", "area": 1, "subarea": "Derecho Constitucional", "tema": "Control de constitucionalidad", "resultado": "Distingue el control abstracto del control concreto.", "demanda": "Analizar", "enunciado": "La Corte Constitucional conoce una demanda de inconstitucionalidad de una ley sin caso concreto pendiente. ¿Qué tipo de control ejerce?", "opciones": [{"texto": "Control abstracto.", "justificacion": "Correcta. El control abstracto no requiere caso concreto pendiente. Base legal: art. 436 de la Constitución de la República."}, {"texto": "Control concreto.", "justificacion": "Incorrecta. El control concreto se ejerce en un proceso específico."}, {"texto": "Control difuso.", "justificacion": "Incorrecta. El control difuso corresponde a los jueces ordinarios."}, {"texto": "Control preventivo.", "justificacion": "Incorrecta. El control preventivo opera en fases previas a la publicación."}], "correcta": 0, "referencias": ["CRE"]}, {"id": "EX-117", "area": 1, "subarea": "Derecho Constitucional", "tema": "Debido proceso", "resultado": "Aplica las garantías del debido proceso en sede administrativa.", "demanda": "Aplicar", "enunciado": "Una autoridad impone una sanción sin notificar al administrado ni conceder plazo para descargos. ¿Qué garantía resulta vulnerada?", "opciones": [{"texto": "El derecho a la defensa y a ser escuchado antes de la sanción.", "justificacion": "Correcta. El artículo 76 exige el derecho a la defensa."}, {"texto": "La motivación suficiente del acto sancionador.", "justificacion": "Incorrecta. El problema central es la ausencia de contradicción."}, {"texto": "La tipicidad, que exige describir la conducta con claridad.", "justificacion": "Incorrecta. El defecto no se refiere a la tipicidad."}, {"texto": "La proporcionalidad entre la falta y la sanción impuesta.", "justificacion": "Incorrecta. La proporcionalidad es distinta de la contradicción."}], "correcta": 0, "referencias": ["CRE"]}, {"id": "EX-119", "area": 1, "subarea": "Derechos Humanos", "tema": "Igualdad", "resultado": "Aplica el principio de igualdad y no discriminación.", "demanda": "Analizar", "enunciado": "Una norma establece un trato diferenciado basado en la condición migratoria. ¿Cuándo resulta legítimo ese trato?", "opciones": [{"texto": "Cuando la diferenciación persigue un fin legítimo y es idónea, necesaria y proporcional.", "justificacion": "Correcta. El test de igualdad exige finalidad legítima y proporcionalidad. Base legal: art. 11 num. 2 de la Constitución de la República."}, {"texto": "Cuando la diferenciación se basa en cualquier criterio que el legislador considere conveniente.", "justificacion": "Incorrecta. Debe superar el test de igualdad."}, {"texto": "Cuando la diferenciación beneficia a la mayoría de la población nacional.", "justificacion": "Incorrecta. El beneficio a la mayoría no justifica discriminación."}, {"texto": "Cuando la diferenciación se aplica de manera general a todos los extranjeros.", "justificacion": "Incorrecta. La generalidad no elimina el análisis de razonabilidad."}], "correcta": 0, "referencias": ["CRE"]}, {"id": "EX-120", "area": 1, "subarea": "Derecho Constitucional", "tema": "Estado de excepción", "resultado": "Identifica los límites del estado de excepción.", "demanda": "Comprender", "enunciado": "El Presidente declara estado de excepción. ¿Cuál es el control inmediato que debe realizarse?", "opciones": [{"texto": "Control de constitucionalidad por la Corte Constitucional dentro del plazo legal.", "justificacion": "Correcta. El artículo 436 numeral 8 atribuye ese control a la Corte."}, {"texto": "Control político exclusivo de la Asamblea Nacional sin intervención de otros órganos.", "justificacion": "Incorrecta. Existe control constitucional obligatorio."}, {"texto": "Control administrativo por el Ministerio de Gobierno sobre las medidas.", "justificacion": "Incorrecta. El control principal es constitucional."}, {"texto": "Control judicial difuso por cualquier juez que conozca casos relacionados.", "justificacion": "Incorrecta. El control concentrado corresponde a la Corte Constitucional."}], "correcta": 0, "referencias": ["CRE"]}, {"id": "EX-121", "area": 1, "subarea": "Derecho Administrativo", "tema": "Responsabilidad extracontractual del Estado", "resultado": "Aplica los presupuestos de la responsabilidad estatal.", "demanda": "Aplicar", "enunciado": "Un particular sufre daños por el funcionamiento de un servicio público. ¿Cuáles son los elementos que debe acreditar?", "opciones": [{"texto": "El daño, el nexo causal con el servicio público y su antijuridicidad.", "justificacion": "Correcta. Son los presupuestos clásicos de la responsabilidad estatal. Base legal: art. 11 num. 9 de la Constitución de la República."}, {"texto": "Únicamente el daño sufrido y su condición de usuario del servicio.", "justificacion": "Incorrecta. Se requiere además causalidad y antijuridicidad."}, {"texto": "La culpa grave del funcionario y la ausencia de fuerza mayor.", "justificacion": "Incorrecta. Puede ser objetiva en ciertos casos."}, {"texto": "La reclamación administrativa previa y el agotamiento de la vía judicial.", "justificacion": "Incorrecta. No constituye elemento de la responsabilidad en sí."}], "correcta": 0, "referencias": ["CRE"]}, {"id": "EX-122", "area": 2, "subarea": "Derecho Penal (parte general)", "tema": "Tentativa", "resultado": "Distingue la tentativa acabada de la inacabada.", "demanda": "Analizar", "enunciado": "El sujeto realiza todos los actos necesarios para consumar el delito, pero el resultado no se produce por causas ajenas a su voluntad. ¿Cómo se tipifica?", "opciones": [{"texto": "Como tentativa acabada porque se agotaron los actos ejecutivos sin resultado.", "justificacion": "Correcta. La doctrina llama tentativa acabada a aquella en la que el autor realizó todos los actos de ejecución sin que el resultado se produjera por causas ajenas a su voluntad; el art. 39 del Código Orgánico Integral Penal la sanciona con una pena de un tercio a dos tercios de la del delito consumado."}, {"texto": "Como delito consumado porque el dolo y la ejecución se completaron.", "justificacion": "Incorrecta. La ausencia del resultado impide la consumación."}, {"texto": "Como tentativa inacabada porque el resultado no se produjo por causas externas.", "justificacion": "Incorrecta. La tentativa inacabada se configura cuando faltan actos."}, {"texto": "Como acto preparatorio no punible por no haberse iniciado la ejecución.", "justificacion": "Incorrecta. Los actos superan la fase preparatoria."}], "correcta": 0, "referencias": ["COIP"]}, {"id": "EX-123", "area": 2, "subarea": "Derecho Procesal Penal", "tema": "Prisión preventiva", "resultado": "Aplica los requisitos de la prisión preventiva.", "demanda": "Aplicar", "enunciado": "El fiscal solicita prisión preventiva. El juez debe verificar los presupuestos legales. ¿Cuál es el estándar correcto?", "opciones": [{"texto": "Elementos de convicción e insuficiencia de otras medidas.", "justificacion": "Correcta. El art. 534 del Código Orgánico Integral Penal exige elementos de convicción suficientes sobre la existencia del delito y la participación del procesado, indicios de que las medidas no privativas de libertad son insuficientes y que el delito tenga pena superior a un año; la medida es excepcional (art. 77 num. 1 de la Constitución)."}, {"texto": "Basta con indicios de responsabilidad y la gravedad de la pena prevista.", "justificacion": "Incorrecta. Se requieren los tres presupuestos concurrentes."}, {"texto": "Solo se exige peligro de fuga cuando la pena máxima supera cinco años.", "justificacion": "Incorrecta. El peligro debe acreditarse en todo caso."}, {"texto": "Procede de manera automática en todos los delitos de acción pública.", "justificacion": "Incorrecta. No existe procedencia automática."}], "correcta": 0, "referencias": ["COIP"]}, {"id": "EX-125", "area": 2, "subarea": "Derecho Penal (parte general)", "tema": "Legítima defensa", "resultado": "Aplica los requisitos de la legítima defensa.", "demanda": "Aplicar", "enunciado": "Una persona es agredida con arma blanca y responde con un disparo que causa la muerte del agresor. ¿Cuándo se configura la legítima defensa?", "opciones": [{"texto": "Agresión ilegítima, necesidad racional y falta de provocación.", "justificacion": "Correcta. El artículo 33 del COIP exige esos tres elementos."}, {"texto": "Que el agresor muera y el defensor actúe con miedo insuperable.", "justificacion": "Incorrecta. El miedo insuperable es otra causa de exclusión."}, {"texto": "Que la agresión haya cesado y se busque evitar una nueva.", "justificacion": "Incorrecta. Se exige agresión actual o inminente."}, {"texto": "Que use un medio desproporcionado, pero para preservar su vida.", "justificacion": "Incorrecta. La necesidad racional del medio es indispensable."}], "correcta": 0, "referencias": ["COIP"]}, {"id": "EX-126", "area": 2, "subarea": "Derecho Procesal Penal", "tema": "Cadena de custodia", "resultado": "Identifica la finalidad de la cadena de custodia.", "demanda": "Comprender", "enunciado": "Se discute la validez de una evidencia física en el juicio. ¿Cuál es la finalidad principal de la cadena de custodia?", "opciones": [{"texto": "Asegurar la identidad e integridad de la evidencia desde su recolección.", "justificacion": "Correcta. La cadena de custodia preserva la pureza de la evidencia. Base legal: art. 456 del Código Orgánico Integral Penal."}, {"texto": "Garantizar que la evidencia se obtuvo exclusivamente con orden judicial.", "justificacion": "Incorrecta. La orden judicial es requisito de obtención, no de la cadena."}, {"texto": "Permitir que el fiscal decida libremente qué evidencias incorporar.", "justificacion": "Incorrecta. No otorga discrecionalidad sobre la incorporación."}, {"texto": "Sustituir la necesidad de peritaje cuando la evidencia es objetiva.", "justificacion": "Incorrecta. No reemplaza la actividad pericial."}], "correcta": 0, "referencias": ["COIP"]}, {"id": "EX-127", "area": 2, "subarea": "Derecho Penal (parte general)", "tema": "Autoría y participación", "resultado": "Distingue autoría de complicidad.", "demanda": "Analizar", "enunciado": "Una persona facilita los medios para la comisión de un delito sin intervenir en la ejecución. ¿Cuál es su grado de participación?", "opciones": [{"texto": "Cómplice.", "justificacion": "Correcta. Es cómplice quien coopera dolosamente con actos secundarios, anteriores o simultáneos, sin los cuales igualmente se habría cometido la infracción (art. 43 del Código Orgánico Integral Penal)."}, {"texto": "Autor mediato.", "justificacion": "Incorrecta. El autor mediato domina la voluntad del ejecutor."}, {"texto": "Instigador.", "justificacion": "Incorrecta. La instigación requiere determinación dolosa del autor."}, {"texto": "Autor directo.", "justificacion": "Incorrecta. El aporte accesorio configura complicidad."}], "correcta": 0, "referencias": ["COIP"]}, {"id": "EX-128", "area": 2, "subarea": "Derecho Procesal Penal", "tema": "Principio de oportunidad", "resultado": "Identifica los presupuestos del principio de oportunidad.", "demanda": "Comprender", "enunciado": "El fiscal evalúa abstenerse de iniciar o de continuar la persecución penal aplicando el principio de oportunidad. ¿En qué caso procede, según el COIP?", "opciones": [{"texto": "En delitos con pena de hasta cinco años, salvo las exclusiones legales.", "justificacion": "Correcta. El art. 412 del Código Orgánico Integral Penal permite aplicar el principio de oportunidad en infracciones sancionadas con pena privativa de libertad de hasta cinco años, con excepciones como los delitos que comprometen gravemente el interés público, y en infracciones culposas en las que el investigado sufre un daño físico grave."}, {"texto": "Cuando el investigado es primerizo y confiesa libremente el hecho.", "justificacion": "Incorrecta. Ser primerizo y confesar no son los supuestos legales."}, {"texto": "Cuando la víctima manifiesta que no desea continuar el proceso.", "justificacion": "Incorrecta. La voluntad de la víctima no habilita por sí sola la abstención."}, {"texto": "Cuando el delito ya prescribió y no puede ejercerse la acción.", "justificacion": "Incorrecta. La prescripción extingue la acción; no es un supuesto de oportunidad."}], "correcta": 0, "referencias": ["COIP"]}, {"id": "EX-129", "area": 2, "subarea": "Derecho Penal (parte general)", "tema": "Error de tipo", "resultado": "Distingue el error de tipo del error de prohibición.", "demanda": "Analizar", "enunciado": "El sujeto desconoce un elemento objetivo del tipo penal y por ello no sabe que realiza la conducta típica. ¿Qué clase de error se configura?", "opciones": [{"texto": "Error de tipo, porque recae sobre un elemento del tipo.", "justificacion": "Correcta. El error de tipo excluye el dolo cuando recae sobre elementos objetivos. Base legal: art. 28.1 del Código Orgánico Integral Penal."}, {"texto": "Error de prohibición porque desconoce la ilicitud de su conducta.", "justificacion": "Incorrecta. El error de prohibición recae sobre la antijuridicidad."}, {"texto": "Error de hecho porque se refiere a las circunstancias fácticas de la conducta.", "justificacion": "Incorrecta. La categoría dogmática correcta es el error de tipo."}, {"texto": "Error invencible de prohibición que elimina por completo la culpabilidad.", "justificacion": "Incorrecta. El supuesto no corresponde a un error sobre la prohibición."}], "correcta": 0, "referencias": ["COIP"]}, {"id": "EX-130", "area": 2, "subarea": "Derecho Procesal Penal", "tema": "Medidas cautelares personales", "resultado": "Aplica el principio de proporcionalidad en medidas cautelares.", "demanda": "Aplicar", "enunciado": "El juez debe decidir entre prisión preventiva y una medida alternativa. ¿Qué criterio debe prevalecer?", "opciones": [{"texto": "La necesidad y proporcionalidad de la medida.", "justificacion": "Correcta. El principio de proporcionalidad exige idoneidad, necesidad y ponderación. Base legal: art. 522 y 534 del Código Orgánico Integral Penal."}, {"texto": "La gravedad abstracta de la pena prevista para el delito.", "justificacion": "Incorrecta. No es el único ni el principal criterio."}, {"texto": "La solicitud del fiscal y los indicios de responsabilidad.", "justificacion": "Incorrecta. La solicitud no sustituye el análisis de necesidad."}, {"texto": "El peligro de reiteración delictiva como único presupuesto.", "justificacion": "Incorrecta. Es un elemento más, no el único."}], "correcta": 0, "referencias": ["COIP"]}, {"id": "EX-131", "area": 2, "subarea": "Derecho Penal (parte general)", "tema": "Concurso de delitos", "resultado": "Distingue el concurso real del concurso ideal.", "demanda": "Analizar", "enunciado": "El sujeto con una sola acción lesiona varios bienes jurídicos protegidos por tipos penales distintos. ¿Qué clase de concurso se configura?", "opciones": [{"texto": "Concurso ideal porque una sola acción realiza varios tipos penales.", "justificacion": "Correcta. Cuando varios tipos penales son subsumibles a una misma conducta se aplica la pena de la infracción más grave (concurso ideal, art. 21 del Código Orgánico Integral Penal)."}, {"texto": "Concurso real porque existen varios resultados y por tanto varias acciones.", "justificacion": "Incorrecta. El concurso real requiere pluralidad de acciones."}, {"texto": "Concurso medial porque un delito es medio necesario para la comisión de otro.", "justificacion": "Incorrecta. El concurso medial es especie del concurso real."}, {"texto": "Concurso aparente porque los tipos se excluyen entre sí por especialidad.", "justificacion": "Incorrecta. El concurso aparente se resuelve por reglas de interpretación."}], "correcta": 0, "referencias": ["COIP"]}, {"id": "EX-133", "area": 2, "subarea": "Derecho Procesal Penal", "tema": "Audiencia de formulación de cargos", "resultado": "Identifica la finalidad de la audiencia de formulación de cargos.", "demanda": "Comprender", "enunciado": "El fiscal solicita audiencia de formulación de cargos. ¿Cuál es su propósito principal?", "opciones": [{"texto": "Comunicar la imputación al procesado e iniciar la instrucción.", "justificacion": "Correcta. Garantiza el derecho a conocer la imputación y a defenderse. Base legal: art. 595 del Código Orgánico Integral Penal."}, {"texto": "Resolver de manera definitiva sobre la culpabilidad del procesado.", "justificacion": "Incorrecta. Esa es la finalidad del juicio."}, {"texto": "Determinar la pena que corresponde aplicar en la sentencia.", "justificacion": "Incorrecta. La determinación de la pena corresponde a la sentencia."}, {"texto": "Practicar de forma anticipada toda la prueba de cargo y de descargo.", "justificacion": "Incorrecta. La práctica de prueba se realiza en la etapa de juicio."}], "correcta": 0, "referencias": ["COIP"]}, {"id": "EX-134", "area": 2, "subarea": "Derecho Penal (parte general)", "tema": "Prescripción de la acción penal", "resultado": "Aplica los plazos de prescripción de la acción penal.", "demanda": "Aplicar", "enunciado": "Un delito de ejercicio público de la acción tiene una pena máxima de cinco años y aún no se ha iniciado el proceso penal. ¿En qué plazo prescribe la acción?", "opciones": [{"texto": "Cinco años desde que se cometió la infracción.", "justificacion": "Correcta. Sin proceso iniciado, la acción prescribe en el mismo plazo del máximo de la pena prevista en el tipo, contado desde que se cometió la infracción, y nunca en menos de cinco años (art. 417 del Código Orgánico Integral Penal)."}, {"texto": "Tres años desde la comisión, por regla general.", "justificacion": "Incorrecta. El plazo depende del máximo de la pena y nunca es inferior a cinco años."}, {"texto": "Diez años, por tratarse de un delito de acción pública.", "justificacion": "Incorrecta. La naturaleza pública de la acción no fija un plazo de diez años."}, {"texto": "Un año desde que la víctima conoció el hecho.", "justificacion": "Incorrecta. El plazo se cuenta desde la comisión del delito."}], "correcta": 0, "referencias": ["COIP"]}, {"id": "EX-135", "area": 2, "subarea": "Derecho Penal (parte general)", "tema": "Culpabilidad", "resultado": "Distingue el dolo eventual de la culpa consciente.", "demanda": "Analizar", "enunciado": "El sujeto prevé el resultado dañoso como posible y no obstante actúa, aceptando ese resultado. ¿Qué forma de culpabilidad se configura?", "opciones": [{"texto": "Dolo eventual porque el sujeto acepta la producción del resultado como posible.", "justificacion": "Correcta. El dolo eventual se caracteriza por la aceptación del resultado previsto. Base legal: art. 26 y 27 del Código Orgánico Integral Penal."}, {"texto": "Culpa consciente porque el sujeto confía en que el resultado no se producirá.", "justificacion": "Incorrecta. En la culpa consciente el sujeto confía en evitar el resultado."}, {"texto": "Dolo directo porque el sujeto busca deliberadamente la producción del resultado.", "justificacion": "Incorrecta. En el dolo directo el resultado es el fin buscado."}, {"texto": "Culpa inconsciente porque el sujeto no prevé en absoluto la posibilidad del resultado.", "justificacion": "Incorrecta. En la culpa inconsciente no existe previsión."}], "correcta": 0, "referencias": ["COIP"]}, {"id": "EX-136", "area": 2, "subarea": "Derecho Penal (parte especial)", "tema": "Justificantes", "resultado": "Identifica el estado de necesidad como causa de justificación.", "demanda": "Analizar", "enunciado": "Una persona lesiona un bien jurídico de menor valor para salvar otro de mayor valor en situación de peligro actual. ¿Qué causa de justificación se configura?", "opciones": [{"texto": "Estado de necesidad porque se sacrifica un bien de menor valor para salvar uno mayor.", "justificacion": "Correcta. Hay estado de necesidad cuando el derecho protegido está en peligro real y actual, el resultado de la protección no es mayor que el daño que se quiso evitar y no existe otro medio practicable (art. 32 del Código Orgánico Integral Penal)."}, {"texto": "Legítima defensa porque existe una agresión ilegítima que debe ser repelida.", "justificacion": "Incorrecta. En el estado de necesidad no existe agresión ilegítima."}, {"texto": "Ejercicio legítimo de un derecho porque la conducta está autorizada por el ordenamiento.", "justificacion": "Incorrecta. Es una causa distinta."}, {"texto": "Obediencia debida porque el sujeto actúa en cumplimiento de una orden superior.", "justificacion": "Incorrecta. Requiere relación jerárquica y una orden."}], "correcta": 0, "referencias": ["COIP"]}, {"id": "EX-137", "area": 2, "subarea": "Derecho Penal (parte especial)", "tema": "Delitos contra la administración pública", "resultado": "Identifica el tipo penal de concusión.", "demanda": "Comprender", "enunciado": "Un servidor público exige a un particular una contribución indebida aprovechando su cargo. ¿Qué delito se configura?", "opciones": [{"texto": "Concusión porque el servidor exige una contribución o beneficio indebido.", "justificacion": "Correcta. El artículo 281 del COIP tipifica la concusión."}, {"texto": "Peculado porque se apropia de bienes públicos o privados en razón de su cargo.", "justificacion": "Incorrecta. El peculado tiene un núcleo distinto."}, {"texto": "Cohecho porque el servidor recibe una dádiva para omitir un acto de su cargo.", "justificacion": "Incorrecta. En el cohecho existe un acuerdo; en la concusión hay exigencia."}, {"texto": "Enriquecimiento ilícito porque existe un incremento patrimonial no justificado.", "justificacion": "Incorrecta. Requiere el incremento patrimonial desproporcionado."}], "correcta": 0, "referencias": ["COIP"]}, {"id": "EX-139", "area": 2, "subarea": "Derecho Penal (parte especial)", "tema": "Delitos contra la fe pública", "resultado": "Identifica el tipo penal de falsificación de documentos.", "demanda": "Comprender", "enunciado": "Una persona altera un documento público con el fin de hacerlo pasar como auténtico. ¿Qué delito se configura?", "opciones": [{"texto": "Falsificación de documentos públicos tipificado en el COIP.", "justificacion": "Correcta. La falsificación y el uso de documento falso están tipificados en el art. 328 del Código Orgánico Integral Penal."}, {"texto": "Estafa porque se utiliza un engaño para obtener un beneficio patrimonial.", "justificacion": "Incorrecta. La falsificación tiene un tipo penal autónomo."}, {"texto": "Usurpación de funciones porque se atribuye una calidad que no se posee.", "justificacion": "Incorrecta. Es un tipo distinto."}, {"texto": "Fraude procesal porque se induce a error a la autoridad con el documento.", "justificacion": "Incorrecta. El fraude procesal requiere el uso en un proceso."}], "correcta": 0, "referencias": ["COIP"]}, {"id": "EX-140", "area": 2, "subarea": "Derecho Penal (parte especial)", "tema": "Delitos contra la integridad sexual", "resultado": "Identifica el tipo penal de acoso sexual.", "demanda": "Comprender", "enunciado": "Una persona solicita favores de naturaleza sexual para sí o para un tercero en el ámbito laboral. ¿Qué delito se configura?", "opciones": [{"texto": "Acoso sexual porque se solicitan favores sexuales en el marco de una relación de poder.", "justificacion": "Correcta. El artículo 166 del COIP tipifica el acoso sexual."}, {"texto": "Violación porque se accede carnalmente a otra persona sin su consentimiento.", "justificacion": "Incorrecta. El acoso no requiere el acceso carnal."}, {"texto": "Estupro porque se mantienen relaciones sexuales con persona entre catorce y dieciocho años.", "justificacion": "Incorrecta. El estupro tiene elementos distintos."}, {"texto": "Abuso sexual porque se realiza un acto de naturaleza sexual sin acceso carnal.", "justificacion": "Incorrecta. El abuso sexual tiene un tipo distinto."}], "correcta": 0, "referencias": ["COIP"]}, {"id": "EX-143", "area": 2, "subarea": "Derecho Procesal Penal", "tema": "Delitos contra el patrimonio", "resultado": "Identifica el tipo penal de abuso de confianza.", "demanda": "Comprender", "enunciado": "Una persona dispone de una cosa que se le ha confiado en tenencia legítima, en perjuicio de su dueño. ¿Qué delito se configura?", "opciones": [{"texto": "Abuso de confianza.", "justificacion": "Correcta. El artículo 187 del COIP tipifica el abuso de confianza."}, {"texto": "Hurto.", "justificacion": "Incorrecta. En el abuso de confianza la tenencia es legítima al inicio."}, {"texto": "Estafa.", "justificacion": "Incorrecta. El abuso de confianza no requiere engaño inicial."}, {"texto": "Robo.", "justificacion": "Incorrecta. El abuso de confianza no requiere violencia."}], "correcta": 0, "referencias": ["COIP"]}, {"id": "EX-144", "area": 2, "subarea": "Derecho Penal (parte especial)", "tema": "Delitos contra el patrimonio", "resultado": "Identifica el tipo penal de robo.", "demanda": "Comprender", "enunciado": "Una persona se apodera de una cosa ajena con violencia o intimidación. ¿Qué delito se configura?", "opciones": [{"texto": "Robo.", "justificacion": "Correcta. El artículo 189 del COIP tipifica el robo."}, {"texto": "Hurto.", "justificacion": "Incorrecta. El hurto no requiere violencia ni intimidación."}, {"texto": "Estafa.", "justificacion": "Incorrecta. La estafa requiere engaño, no violencia."}, {"texto": "Abuso de confianza.", "justificacion": "Incorrecta. En el robo la tenencia no es legítima."}], "correcta": 0, "referencias": ["COIP"]}, {"id": "EX-145", "area": 3, "subarea": "Derecho Procesal (COGEP)", "tema": "Cosa juzgada", "resultado": "Identifica los efectos de la cosa juzgada material.", "demanda": "Comprender", "enunciado": "Una sentencia ejecutoriada resuelve de fondo una controversia entre las mismas partes y sobre el mismo objeto. Se presenta una nueva demanda idéntica. ¿Cuál es el efecto?", "opciones": [{"texto": "Debe rechazarse por cosa juzgada.", "justificacion": "Correcta. Produce efecto negativo e impide relitigar lo ya resuelto. Base legal: arts. 99 y 101 del Código Orgánico General de Procesos; art. 153 del mismo código (excepción previa de cosa juzgada)."}, {"texto": "Es admisible.", "justificacion": "Incorrecta. La cosa juzgada material impide un nuevo pronunciamiento."}, {"texto": "Procede solo si se invoca una causal de nulidad de la sentencia.", "justificacion": "Incorrecta. La nulidad se tramita por vía específica de impugnación."}, {"texto": "Es admisible si se aportan pruebas nuevas no conocidas antes.", "justificacion": "Incorrecta. Las pruebas supervinientes no abren un nuevo proceso."}], "correcta": 0, "referencias": ["COGEP"]}, {"id": "EX-147", "area": 3, "subarea": "Métodos Alternativos", "tema": "Arbitraje", "resultado": "Determina la naturaleza del laudo arbitral.", "demanda": "Comprender", "enunciado": "Un tribunal arbitral dicta laudo que resuelve de fondo la controversia. Una de las partes pretende interponer recurso de apelación. ¿Cuál es el régimen aplicable?", "opciones": [{"texto": "Solo cabe la acción de nulidad, por causales taxativas.", "justificacion": "Correcta. La Ley de Arbitraje y Mediación limita la impugnación a la acción de nulidad. Base legal: arts. 30 y 31 de la Ley de Arbitraje y Mediación."}, {"texto": "Es apelable ante la Corte Provincial, por tener naturaleza de sentencia.", "justificacion": "Incorrecta. El laudo no es susceptible de apelación ante la justicia ordinaria."}, {"texto": "Es revisable mediante casación cuando se vulneran derechos.", "justificacion": "Incorrecta. No procede el recurso de casación contra laudos."}, {"texto": "El tribunal puede modificarlo al resolver la aclaración.", "justificacion": "Incorrecta. La aclaración no permite modificar el sentido del laudo."}], "correcta": 0, "referencias": ["LAM"]}, {"id": "EX-148", "area": 3, "subarea": "Derecho Procesal (COGEP)", "tema": "Litispendencia", "resultado": "Identifica los efectos de la litispendencia.", "demanda": "Comprender", "enunciado": "Se presentan dos demandas idénticas, entre las mismas partes y por la misma causa, ante jueces distintos, y ambas siguen pendientes. ¿Cómo puede reaccionar el demandado en el segundo proceso?", "opciones": [{"texto": "Oponer la excepción previa de litispendencia.", "justificacion": "Correcta. La litispendencia es excepción previa (art. 153 num. 5 del Código Orgánico General de Procesos) y busca impedir que se tramiten simultáneamente dos procesos idénticos."}, {"texto": "Esperar a que ambos procesos terminen con sentencia firme.", "justificacion": "Incorrecta. La litispendencia busca precisamente evitar la tramitación simultánea."}, {"texto": "Pedir la acumulación obligatoria ante el juez que previno.", "justificacion": "Incorrecta. La acumulación de procesos tiene presupuestos distintos."}, {"texto": "Pedir que se declare de oficio la nulidad de todo lo actuado.", "justificacion": "Incorrecta. El mecanismo es la excepción previa, no la nulidad."}], "correcta": 0, "referencias": ["COGEP"]}, {"id": "EX-149", "area": 3, "subarea": "Derecho Procesal (COGEP)", "tema": "Prueba", "resultado": "Aplica las reglas de valoración de la prueba.", "demanda": "Aplicar", "enunciado": "El juez debe valorar la prueba practicada en un proceso civil. ¿Cuál es el sistema de valoración que rige en el COGEP?", "opciones": [{"texto": "La sana crítica.", "justificacion": "Correcta. El artículo 164 del COGEP establece la valoración según la sana crítica."}, {"texto": "La prueba tasada.", "justificacion": "Incorrecta. El COGEP no adopta el sistema de prueba tasada."}, {"texto": "La libre convicción absoluta.", "justificacion": "Incorrecta. La libre convicción no elimina el deber de motivar."}, {"texto": "Un sistema mixto de tarifa legal y sana crítica.", "justificacion": "Incorrecta. No existe un sistema mixto de esas características."}], "correcta": 0, "referencias": ["COGEP"]}, {"id": "EX-150", "area": 3, "subarea": "Métodos Alternativos", "tema": "Conciliación", "resultado": "Identifica los efectos del acta de conciliación judicial.", "demanda": "Comprender", "enunciado": "Las partes llegan a un acuerdo conciliatorio en audiencia y lo aprueba el juez. ¿Cuál es el valor del acta de conciliación?", "opciones": [{"texto": "Fuerza de sentencia ejecutoriada y efecto de cosa juzgada.", "justificacion": "Correcta. La conciliación judicial aprobada produce los efectos de una sentencia firme. Base legal: arts. 233 y 234 del Código Orgánico General de Procesos."}, {"texto": "Valor de contrato privado, que exige un nuevo proceso para ejecutarse.", "justificacion": "Incorrecta. El acta aprobada tiene fuerza de sentencia ejecutoriada."}, {"texto": "Valor meramente probatorio, sin extinguir la pretensión del actor.", "justificacion": "Incorrecta. Extingue la pretensión y produce cosa juzgada."}, {"texto": "Puede impugnarse mediante recurso de apelación en el plazo legal.", "justificacion": "Incorrecta. El acuerdo conciliatorio aprobado no es susceptible de apelación ordinaria."}], "correcta": 0, "referencias": ["COGEP"]}, {"id": "EX-151", "area": 3, "subarea": "Derecho Procesal (COGEP)", "tema": "Competencia", "resultado": "Aplica las reglas de competencia territorial.", "demanda": "Aplicar", "enunciado": "Se demanda el cumplimiento de un contrato. ¿Cuál es el juez competente por territorio?", "opciones": [{"texto": "El juez del domicilio del demandado o el del lugar de cumplimiento de la obligación.", "justificacion": "Correcta. El COGEP permite al actor elegir entre esas opciones. Base legal: art. 10 del Código Orgánico General de Procesos."}, {"texto": "El juez del lugar donde se celebró el contrato de manera exclusiva y excluyente.", "justificacion": "Incorrecta. No es la única regla de competencia territorial."}, {"texto": "El juez del domicilio del actor porque la competencia se fija por la residencia del demandante.", "justificacion": "Incorrecta. La regla general es el domicilio del demandado."}, {"texto": "El juez del lugar donde se encuentra el bien objeto del contrato de manera exclusiva.", "justificacion": "Incorrecta. Esa regla corresponde a acciones reales."}], "correcta": 0, "referencias": ["COGEP"]}, {"id": "EX-152", "area": 3, "subarea": "Derecho Procesal (COGEP)", "tema": "Recursos", "resultado": "Distingue el recurso de apelación del recurso de casación.", "demanda": "Analizar", "enunciado": "Una parte pretende impugnar una sentencia de primera instancia por errores de hecho y de derecho. ¿Qué recurso corresponde?", "opciones": [{"texto": "Apelación.", "justificacion": "Correcta. La apelación es el recurso ordinario que habilita el conocimiento pleno. Base legal: art. 256 del Código Orgánico General de Procesos."}, {"texto": "Casación.", "justificacion": "Incorrecta. La casación no es el recurso ordinario contra sentencias de primera instancia."}, {"texto": "De hecho.", "justificacion": "Incorrecta. El recurso de hecho tiene una finalidad distinta."}, {"texto": "Revisión.", "justificacion": "Incorrecta. La revisión es un recurso extraordinario con causales taxativas."}], "correcta": 0, "referencias": ["COGEP"]}, {"id": "EX-153", "area": 3, "subarea": "Derecho Procesal (COGEP)", "tema": "Medidas cautelares", "resultado": "Aplica los presupuestos de las medidas cautelares en materia civil.", "demanda": "Aplicar", "enunciado": "El actor solicita el secuestro de un bien del demandado. ¿Qué debe acreditar?", "opciones": [{"texto": "La existencia del crédito y el riesgo sobre los bienes del deudor.", "justificacion": "Correcta. Para ordenar providencias preventivas como el secuestro, se debe probar la existencia del crédito y que los bienes del deudor se encuentran en tal estado que no alcancen a cubrir la deuda o que puedan desaparecer u ocultarse (arts. 124 y 125 del Código Orgánico General de Procesos)."}, {"texto": "Únicamente que exista una deuda líquida y exigible a su favor.", "justificacion": "Incorrecta. Se requiere además el peligro de que el crédito quede ilusorio."}, {"texto": "La certeza absoluta del derecho y la insolvencia actual del deudor.", "justificacion": "Incorrecta. No se exige certeza absoluta ni necesariamente insolvencia."}, {"texto": "La citación previa con la demanda y el agotamiento de la mediación.", "justificacion": "Incorrecta. Las medidas cautelares pueden solicitarse incluso antes de la demanda."}], "correcta": 0, "referencias": ["COGEP"]}, {"id": "EX-154", "area": 3, "subarea": "Derecho Procesal (COGEP)", "tema": "Acumulación de acciones", "resultado": "Identifica los presupuestos de la acumulación de acciones.", "demanda": "Comprender", "enunciado": "El actor pretende acumular varias pretensiones en una sola demanda. ¿Cuál es el requisito principal?", "opciones": [{"texto": "Que no sean contrarias o incompatibles entre sí.", "justificacion": "Correcta. El COGEP permite la acumulación cuando no existe incompatibilidad. Base legal: art. 145 del Código Orgánico General de Procesos."}, {"texto": "Que todas tengan la misma cuantía y tramitación.", "justificacion": "Incorrecta. No se exige identidad de cuantía."}, {"texto": "Que el demandado consienta expresamente la acumulación.", "justificacion": "Incorrecta. El consentimiento del demandado no es requisito."}, {"texto": "Que todas deriven de un mismo contrato.", "justificacion": "Incorrecta. Aunque frecuente, no es un requisito absoluto."}], "correcta": 0, "referencias": ["COGEP"]}, {"id": "EX-155", "area": 3, "subarea": "Derecho Procesal (COGEP)", "tema": "Sentencia", "resultado": "Identifica los requisitos de la sentencia motivada.", "demanda": "Comprender", "enunciado": "Una sentencia carece de motivación suficiente. ¿Cuál es la consecuencia?", "opciones": [{"texto": "La sentencia es nula porque la motivación es una garantía del debido proceso.", "justificacion": "Correcta. El artículo 76 numeral 7 de la Constitución exige la motivación."}, {"texto": "La sentencia es válida porque la motivación es un requisito formal no esencial.", "justificacion": "Incorrecta. La motivación es un requisito esencial."}, {"texto": "La sentencia puede ser aclarada o ampliada pero no anulada por falta de motivación.", "justificacion": "Incorrecta. La falta de motivación genera nulidad."}, {"texto": "La sentencia solo puede impugnarse por la vía de la casación y no por apelación.", "justificacion": "Incorrecta. Puede alegarse en apelación y en casación."}], "correcta": 0, "referencias": ["CRE"]}, {"id": "EX-156", "area": 3, "subarea": "Derecho Procesal (COGEP)", "tema": "Nulidad procesal", "resultado": "Identifica las causales de nulidad procesal.", "demanda": "Comprender", "enunciado": "Un proceso se tramita ante un juez manifiestamente incompetente. ¿Qué causal de nulidad se configura?", "opciones": [{"texto": "La incompetencia del juez constituye causal de nulidad procesal conforme al COGEP.", "justificacion": "Correcta. El artículo 107 del COGEP incluye la incompetencia como causal."}, {"texto": "La incompetencia solo genera la inhibición del juez pero no la nulidad de lo actuado.", "justificacion": "Incorrecta. La incompetencia manifiesta genera nulidad."}, {"texto": "La incompetencia solo puede alegarse por el demandado y nunca de oficio.", "justificacion": "Incorrecta. Puede declararse de oficio en ciertos casos."}, {"texto": "La incompetencia se convalida si las partes no la alegaron en la primera actuación.", "justificacion": "Incorrecta. La incompetencia absoluta no se convalida por silencio."}], "correcta": 0, "referencias": ["COGEP"]}, {"id": "EX-157", "area": 3, "subarea": "Derecho Procesal (COGEP)", "tema": "Tercería", "resultado": "Distingue la tercería de dominio de la tercería de mejor derecho.", "demanda": "Analizar", "enunciado": "Un tercero pretende excluir un bien del embargo alegando ser su propietario. ¿Qué clase de tercería interpone?", "opciones": [{"texto": "Tercería excluyente de dominio.", "justificacion": "Correcta. La tercería excluyente de dominio permite a quien se dice dueño del bien pedir que se lo excluya del embargo (art. 47 num. 1 del Código Orgánico General de Procesos). Base legal: art. 47 del Código Orgánico General de Procesos."}, {"texto": "Tercería coadyuvante.", "justificacion": "Incorrecta. La coadyuvante apoya la pretensión de una parte; no discute la propiedad."}, {"texto": "Reconvención contra el acreedor que pidió el embargo.", "justificacion": "Incorrecta. La reconvención es un acto del demandado, no de un tercero."}, {"texto": "Excepción previa de falta de legitimación del ejecutante.", "justificacion": "Incorrecta. El tercero no es parte que pueda oponer excepciones previas."}], "correcta": 0, "referencias": ["COGEP"]}, {"id": "EX-158", "area": 3, "subarea": "Métodos Alternativos", "tema": "Arbitraje de derecho y de equidad", "resultado": "Distingue el arbitraje de derecho del arbitraje de equidad.", "demanda": "Analizar", "enunciado": "¿Cuál es la diferencia principal entre el arbitraje de derecho y el de equidad?", "opciones": [{"texto": "En derecho se falla según la ley; en equidad, según el leal saber.", "justificacion": "Correcta. Esa es la distinción clásica entre ambos tipos de arbitraje. Base legal: art. 3 de la Ley de Arbitraje y Mediación."}, {"texto": "En el de derecho actúan tres árbitros; en el de equidad, uno solo.", "justificacion": "Incorrecta. El número de árbitros no determina la distinción."}, {"texto": "En el de derecho el laudo es apelable; en el de equidad, definitivo.", "justificacion": "Incorrecta. En ambos casos el laudo tiene un régimen de impugnación limitado."}, {"texto": "En el de derecho se aplica la ley extranjera; en el de equidad, la nacional.", "justificacion": "Incorrecta. Esa no es la distinción entre ambos tipos."}], "correcta": 0, "referencias": ["LAM"]}, {"id": "EX-163", "area": 4, "subarea": "Sucesiones", "tema": "Legítima", "resultado": "Calcula la porción de legítima rigurosa.", "demanda": "Aplicar", "enunciado": "El causante deja tres hijos y una cónyuge sobreviviente, y no tiene ascendientes. ¿Cómo se integra la mitad legitimaria?", "opciones": [{"texto": "Se divide entre los tres hijos; la cónyuge puede tener porción conyugal.", "justificacion": "Correcta. Son legitimarios los hijos y los padres (art. 1205 del Código Civil); la cónyuge no es legitimaria, pero puede tener derecho a la porción conyugal si carece de lo necesario para su congrua sustentación."}, {"texto": "Se divide por partes iguales entre los tres hijos y la cónyuge.", "justificacion": "Incorrecta. La cónyuge no figura entre los legitimarios del art. 1205 del Código Civil."}, {"texto": "Equivale a los dos tercios de los bienes, reservados a los hijos.", "justificacion": "Incorrecta. La mitad de los bienes es la que se destina a las legítimas."}, {"texto": "Comprende la totalidad de los bienes, sin parte de libre disposición.", "justificacion": "Incorrecta. Siempre queda una parte de libre disposición."}], "correcta": 0, "referencias": ["CC"]}, {"id": "EX-164", "area": 4, "subarea": "Obligaciones y Contratos", "tema": "Responsabilidad contractual", "resultado": "Distingue el dolo de la culpa en el incumplimiento contractual.", "demanda": "Analizar", "enunciado": "El deudor incumple una obligación contractual de manera deliberada y consciente. ¿Cómo se califica su conducta?", "opciones": [{"texto": "Como dolo porque existe intención deliberada de incumplir la obligación asumida.", "justificacion": "Correcta. El dolo contractual consiste en la voluntad consciente de incumplir. Base legal: art. 29 y 1563 del Código Civil."}, {"texto": "Como culpa leve porque no empleó la diligencia de un buen padre de familia.", "justificacion": "Incorrecta. La conducta deliberada configura dolo."}, {"texto": "Como culpa grave porque se omitió la diligencia mínima exigible en el tráfico.", "justificacion": "Incorrecta. La culpa grave no exige el elemento intencional."}, {"texto": "Como caso fortuito porque el incumplimiento deriva de circunstancias imprevisibles.", "justificacion": "Incorrecta. El caso fortuito excluye la responsabilidad."}], "correcta": 0, "referencias": ["CC"]}, {"id": "EX-166", "area": 5, "subarea": "Mercantil", "tema": "Cheque", "resultado": "Identifica los efectos del cheque sin provisión de fondos.", "demanda": "Comprender", "enunciado": "Se gira un cheque sin la correspondiente provisión de fondos. ¿Cuál es la consecuencia jurídica principal?", "opciones": [{"texto": "El girador responde civilmente y puede incurrir en responsabilidad penal según el caso.", "justificacion": "Correcta. La emisión de cheque sin fondos genera obligación de pago y posible tipificación penal."}, {"texto": "El cheque es nulo de pleno derecho y no genera obligación alguna para el girador.", "justificacion": "Incorrecta. Genera responsabilidad civil y, en su caso, penal."}, {"texto": "El tenedor solo puede reclamar el valor nominal sin intereses ni costas.", "justificacion": "Incorrecta. Puede reclamar el valor, intereses, gastos y costas."}, {"texto": "El banco girado está obligado a pagar el cheque con cargo a cualquier cuenta del girador.", "justificacion": "Incorrecta. El banco no está obligado a pagar un cheque sin provisión."}], "correcta": 0, "referencias": ["CCOM"]}, {"id": "EX-167", "area": 4, "subarea": "Sucesiones", "tema": "Aceptación de herencia", "resultado": "Distingue la aceptación pura y simple de la aceptación a beneficio de inventario.", "demanda": "Analizar", "enunciado": "El heredero acepta la herencia sin hacer reserva alguna. ¿Cuál es el régimen de su responsabilidad?", "opciones": [{"texto": "Responde de las deudas hereditarias con su propio patrimonio de manera ilimitada.", "justificacion": "Correcta. La aceptación pura y simple genera responsabilidad ultra vires hereditatis. Base legal: normas sobre la aceptación pura y simple y el beneficio de inventario del Código Civil."}, {"texto": "Responde solo hasta el monto de los bienes heredados y nunca con su patrimonio personal.", "justificacion": "Incorrecta. Esa es la regla de la aceptación a beneficio de inventario."}, {"texto": "Responde únicamente de las deudas que consten en el testamento del causante.", "justificacion": "Incorrecta. La responsabilidad abarca todas las deudas hereditarias."}, {"texto": "Responde de manera solidaria con los demás coherederos hasta el límite de su cuota.", "justificacion": "Incorrecta. En la aceptación pura la responsabilidad no se limita a la cuota."}], "correcta": 0, "referencias": ["CC"]}, {"id": "EX-168", "area": 4, "subarea": "Obligaciones y Contratos", "tema": "Contrato de compraventa", "resultado": "Identifica los elementos esenciales del contrato de compraventa.", "demanda": "Comprender", "enunciado": "Para que exista contrato de compraventa se requieren ciertos elementos. ¿Cuáles son los esenciales?", "opciones": [{"texto": "El consentimiento, la cosa y el precio como elementos indispensables del contrato.", "justificacion": "Correcta. El artículo 1732 del Código Civil exige consentimiento, cosa y precio."}, {"texto": "Únicamente el consentimiento de las partes y la entrega material de la cosa vendida.", "justificacion": "Incorrecta. La entrega es un efecto del contrato, no un elemento de su existencia."}, {"texto": "El consentimiento, el precio y la inscripción del contrato en el registro de la propiedad.", "justificacion": "Incorrecta. La inscripción es un requisito de oponibilidad en ciertos casos."}, {"texto": "La capacidad de las partes, el objeto lícito y la forma escrita del contrato.", "justificacion": "Incorrecta. Aunque relevantes, no son los elementos específicos de la compraventa."}], "correcta": 0, "referencias": ["CC"]}, {"id": "EX-170", "area": 4, "subarea": "Obligaciones y Contratos", "tema": "Enriquecimiento sin causa", "resultado": "Identifica los presupuestos del enriquecimiento sin causa.", "demanda": "Analizar", "enunciado": "Una persona obtiene un beneficio patrimonial a costa de otra sin que exista una causa jurídica que lo justifique. ¿Qué acción procede?", "opciones": [{"texto": "La acción de enriquecimiento sin causa para obtener la restitución del beneficio indebido.", "justificacion": "Correcta. El artículo 2184 del Código Civil regula el enriquecimiento sin causa. Base legal: principio de enriquecimiento sin causa y reglas de los cuasicontratos del Código Civil."}, {"texto": "La acción de repetición por pago de lo no debido exclusivamente.", "justificacion": "Incorrecta. El pago de lo no debido es una especie, pero no agota el enriquecimiento sin causa."}, {"texto": "La acción reivindicatoria porque se trata de recuperar la propiedad de un bien específico.", "justificacion": "Incorrecta. La reivindicación exige un derecho real de propiedad."}, {"texto": "La acción de daños y perjuicios por responsabilidad extracontractual del beneficiado.", "justificacion": "Incorrecta. El enriquecimiento sin causa no requiere culpa ni daño en el sentido clásico."}], "correcta": 0, "referencias": ["CC"]}, {"id": "EX-171", "area": 4, "subarea": "Personas y Familia", "tema": "Matrimonio", "resultado": "Identifica los impedimentos dirimentes del matrimonio.", "demanda": "Comprender", "enunciado": "Dos personas desean contraer matrimonio. Existe un vínculo de parentesco en línea recta entre ellas. ¿Cuál es el efecto?", "opciones": [{"texto": "El matrimonio es nulo porque el parentesco en línea recta constituye impedimento dirimente.", "justificacion": "Correcta. El Código Civil establece la nulidad del matrimonio entre ascendientes y descendientes. Base legal: art. 95 del Código Civil."}, {"texto": "El matrimonio es válido porque el parentesco no constituye impedimento absoluto.", "justificacion": "Incorrecta. El parentesco en línea recta es impedimento dirimente."}, {"texto": "El matrimonio es anulable solo a petición de uno de los contrayentes dentro de cierto plazo.", "justificacion": "Incorrecta. Se trata de nulidad absoluta."}, {"texto": "El matrimonio es válido si se obtiene dispensa judicial previa a su celebración.", "justificacion": "Incorrecta. El parentesco en línea recta no admite dispensa."}], "correcta": 0, "referencias": ["CC"]}, {"id": "EX-172", "area": 4, "subarea": "Obligaciones y Contratos", "tema": "Cláusula penal", "resultado": "Aplica el régimen de la cláusula penal.", "demanda": "Aplicar", "enunciado": "Las partes pactan una cláusula penal para el caso de incumplimiento. El deudor incumple. ¿Puede el acreedor exigir la cláusula y además la indemnización de daños?", "opciones": [{"texto": "No, salvo que se haya pactado expresamente que puedan acumularse.", "justificacion": "Correcta. Según las reglas del Código Civil sobre la cláusula penal, no puede pedirse a la vez la pena y la indemnización de perjuicios, a menos de haberse estipulado así expresamente. Base legal: normas sobre la cláusula penal del Código Civil."}, {"texto": "Sí, porque la cláusula penal siempre se acumula a la indemnización.", "justificacion": "Incorrecta. Por regla general la cláusula penal sustituye la indemnización."}, {"texto": "Sí, pero solo cuando el incumplimiento es doloso y no culposo.", "justificacion": "Incorrecta. La regla de sustitución no depende de la calificación del incumplimiento."}, {"texto": "No, porque la cláusula penal pactada de antemano es nula.", "justificacion": "Incorrecta. La cláusula penal es válida y se pacta precisamente de manera anticipada."}], "correcta": 0, "referencias": ["CC"]}, {"id": "EX-174", "area": 4, "subarea": "Obligaciones y Contratos", "tema": "Resolución del contrato", "resultado": "Distingue la resolución de la terminación del contrato.", "demanda": "Analizar", "enunciado": "Una de las partes incumple una obligación esencial del contrato. La otra parte pretende poner fin al vínculo. ¿Qué acción corresponde?", "opciones": [{"texto": "La acción de resolución porque el incumplimiento esencial faculta a poner fin al contrato.", "justificacion": "Correcta. El artículo 1505 del Código Civil regula la resolución por incumplimiento."}, {"texto": "La acción de terminación porque el contrato se extingue por el solo incumplimiento.", "justificacion": "Incorrecta. La terminación tiene un régimen distinto."}, {"texto": "La acción de nulidad porque el incumplimiento genera un vicio que invalida el contrato.", "justificacion": "Incorrecta. El incumplimiento no genera nulidad sino la facultad de resolver."}, {"texto": "La acción de cumplimiento forzado porque el acreedor solo puede exigir la prestación debida.", "justificacion": "Incorrecta. El acreedor puede optar entre el cumplimiento y la resolución."}], "correcta": 0, "referencias": ["CC"]}, {"id": "EX-177", "area": 4, "subarea": "Personas y Familia", "tema": "Adopción", "resultado": "Identifica los principios de la adopción.", "demanda": "Comprender", "enunciado": "En materia de adopción, ¿cuál es el principio rector principal?", "opciones": [{"texto": "El interés superior del niño, niña o adolescente como consideración primordial.", "justificacion": "Correcta. El interés superior es el principio rector de toda decisión en materia de adopción. Base legal: art. 153 del Código de la Niñez y Adolescencia."}, {"texto": "El derecho de los padres biológicos a recuperar la patria potestad en cualquier tiempo.", "justificacion": "Incorrecta. La adopción genera un vínculo definitivo."}, {"texto": "La voluntad de los adoptantes como único elemento determinante del proceso.", "justificacion": "Incorrecta. La voluntad de los adoptantes es necesaria pero no el principio rector."}, {"texto": "La celeridad del trámite administrativo por encima de cualquier otra consideración.", "justificacion": "Incorrecta. La celeridad no puede prevalecer sobre el interés superior."}], "correcta": 0, "referencias": ["CONA"]}, {"id": "EX-178", "area": 4, "subarea": "Obligaciones y Contratos", "tema": "Contrato de arrendamiento", "resultado": "Identifica las obligaciones del arrendador.", "demanda": "Comprender", "enunciado": "En un contrato de arrendamiento de inmueble, ¿cuál es una obligación principal del arrendador?", "opciones": [{"texto": "Entregar la cosa en estado de servir al uso para el que ha sido arrendada.", "justificacion": "Correcta. El artículo 1860 del Código Civil establece esa obligación. Base legal: normas sobre las obligaciones del arrendador del Código Civil."}, {"texto": "Pagar el precio del arrendamiento en los plazos convenidos por las partes.", "justificacion": "Incorrecta. Esa es una obligación del arrendatario."}, {"texto": "Realizar las reparaciones locativas que se produzcan por el uso ordinario.", "justificacion": "Incorrecta. Las reparaciones locativas corresponden generalmente al arrendatario."}, {"texto": "Garantizar al arrendatario un rendimiento económico mínimo de la cosa arrendada.", "justificacion"
