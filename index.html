o": "Comprende los efectos de aceptar con beneficio de inventario.", "demanda": "Comprender", "enunciado": "Un heredero acepta la herencia con beneficio de inventario. ¿Cuál es el efecto principal?", "opciones": [{"texto": "Responde de las deudas solo hasta el valor de lo heredado.", "justificacion": "Correcta. Es el efecto propio del beneficio de inventario en el Código Civil."}, {"texto": "Queda exento de pagar cualquier deuda del causante.", "justificacion": "Incorrecta. Responde, pero con un límite."}, {"texto": "Responde ilimitadamente con su propio patrimonio.", "justificacion": "Incorrecta. Eso ocurre en la aceptación pura y simple."}, {"texto": "Pierde su calidad de heredero frente a los acreedores.", "justificacion": "Incorrecta. Sigue siendo heredero."}], "correcta": 0, "referencias": ["CC"]}, {"id": "P4-09", "area": 4, "subarea": "Sucesiones", "tema": "Desheredamiento", "resultado": "Identifica los requisitos del desheredamiento.", "demanda": "Analizar", "enunciado": "Un padre quiere privar a uno de sus hijos de su legítima. Para que sea válido, el desheredamiento debe:", "opciones": [{"texto": "Hacerse por testamento, expresando una causa legal.", "justificacion": "Correcta. El desheredamiento es una disposición testamentaria basada en causas taxativas del Código Civil."}, {"texto": "Hacerse mediante declaración verbal ante dos testigos.", "justificacion": "Incorrecta. Requiere testamento."}, {"texto": "Basarse en cualquier motivo que el padre considere justo.", "justificacion": "Incorrecta. Las causas son taxativas."}, {"texto": "Ser aprobado previamente por un juez de familia.", "justificacion": "Incorrecta. No existe esa aprobación previa."}], "correcta": 0, "referencias": ["CC"]}, {"id": "P4-10", "area": 4, "subarea": "Bienes", "tema": "Clasificación de los bienes", "resultado": "Distingue inmuebles por destinación.", "demanda": "Comprender", "enunciado": "Un tractor destinado permanentemente al cultivo de una hacienda por su propietario se considera, según el Código Civil:", "opciones": [{"texto": "Inmueble por destinación.", "justificacion": "Correcta. Las cosas muebles destinadas permanentemente al uso, cultivo y beneficio de un inmueble se reputan inmuebles."}, {"texto": "Mueble por anticipación.", "justificacion": "Incorrecta. Esta categoría se refiere a productos de un inmueble antes de separarse."}, {"texto": "Bien incorporal accesorio.", "justificacion": "Incorrecta. El tractor es corporal."}, {"texto": "Bien fungible.", "justificacion": "Incorrecta. La fungibilidad no se relaciona con la destinación."}], "correcta": 0, "referencias": ["CC"]}, {"id": "P5-01", "area": 5, "subarea": "Laboral", "tema": "Décimo tercera remuneración", "resultado": "Aplica las reglas de las remuneraciones adicionales.", "demanda": "Recordar", "enunciado": "Según el Código del Trabajo, la decimotercera remuneración equivale a:", "opciones": [{"texto": "La doceava parte de lo percibido en el año calendario.", "justificacion": "Correcta. Es la regla del art. 111 del Código del Trabajo."}, {"texto": "Un salario básico unificado pagado en septiembre.", "justificacion": "Incorrecta. Confunde con la decimocuarta remuneración."}, {"texto": "El quince por ciento de las utilidades de la empresa.", "justificacion": "Incorrecta. Corresponde a la participación de utilidades."}, {"texto": "Un mes de remuneración por cada año de servicio.", "justificacion": "Incorrecta. Es la fórmula de la indemnización por despido."}], "correcta": 0, "referencias": ["CT"]}, {"id": "P5-02", "area": 5, "subarea": "Laboral", "tema": "Visto bueno", "resultado": "Determina el procedimiento para terminar la relación laboral por causa justa.", "demanda": "Aplicar", "enunciado": "Un trabajador incurre en faltas repetidas e injustificadas de asistencia. Para dar por terminada la relación laboral sin indemnización, el empleador debe:", "opciones": [{"texto": "Obtener el visto bueno ante la autoridad del trabajo.", "justificacion": "Correcta. El visto bueno es el mecanismo legal para la terminación por causa justa."}, {"texto": "Notificar el despido por escrito al trabajador.", "justificacion": "Incorrecta. Sin visto bueno, sería despido intempestivo."}, {"texto": "Demandar la terminación ante un juez de lo civil.", "justificacion": "Incorrecta. No es el procedimiento legal."}, {"texto": "Descontar los días faltados y despedirlo sin trámite.", "justificacion": "Incorrecta. Generaría responsabilidad indemnizatoria."}], "correcta": 0, "referencias": ["CT"]}, {"id": "P5-03", "area": 5, "subarea": "Laboral", "tema": "Jornada de trabajo", "resultado": "Identifica los límites de la jornada ordinaria.", "demanda": "Recordar", "enunciado": "Según el Código del Trabajo, la jornada máxima ordinaria es de:", "opciones": [{"texto": "Ocho horas diarias y cuarenta semanales.", "justificacion": "Correcta. Es la regla del art. 47 del Código del Trabajo."}, {"texto": "Diez horas diarias y cincuenta semanales.", "justificacion": "Incorrecta. Excede el máximo legal."}, {"texto": "Seis horas diarias y treinta semanales.", "justificacion": "Incorrecta. Corresponde a jornadas especiales."}, {"texto": "La que pacten libremente las partes.", "justificacion": "Incorrecta. La jornada máxima es de orden público."}], "correcta": 0, "referencias": ["CT"]}, {"id": "P5-04", "area": 5, "subarea": "Tributario", "tema": "Sujeto pasivo", "resultado": "Distingue contribuyente y responsable.", "demanda": "Comprender", "enunciado": "Una empresa retiene el impuesto a la renta de sus proveedores y lo deposita al fisco. Según el Código Orgánico Tributario, la empresa es:", "opciones": [{"texto": "Responsable, como agente de retención.", "justificacion": "Correcta. Los agentes de retención son responsables (arts. 24 y 29 del Código Orgánico Tributario)."}, {"texto": "Contribuyente del impuesto retenido.", "justificacion": "Incorrecta. El contribuyente es quien verifica el hecho generador."}, {"texto": "Sujeto activo de la obligación tributaria.", "justificacion": "Incorrecta. El sujeto activo es el ente acreedor del tributo."}, {"texto": "Mero tercero sin obligaciones tributarias.", "justificacion": "Incorrecta. La ley le impone obligaciones como responsable."}], "correcta": 0, "referencias": ["CTRIB"]}, {"id": "P5-05", "area": 5, "subarea": "Tributario", "tema": "Reclamo administrativo", "resultado": "Aplica los plazos del reclamo tributario.", "demanda": "Recordar", "enunciado": "Un contribuyente quiere impugnar un acto de determinación tributaria. Según el Código Orgánico Tributario, el reclamo administrativo debe presentarse dentro de:", "opciones": [{"texto": "Veinte días desde la notificación.", "justificacion": "Correcta. Es el plazo del art. 115 del Código Orgánico Tributario."}, {"texto": "Cinco años desde la notificación del acto.", "justificacion": "Incorrecta. Confunde con la prescripción de la acción de cobro."}, {"texto": "Noventa días calendario desde la notificación.", "justificacion": "Incorrecta. No es el plazo del reclamo."}, {"texto": "Tres días hábiles desde la notificación.", "justificacion": "Incorrecta. No es el plazo del reclamo."}], "correcta": 0, "referencias": ["CTRIB"]}, {"id": "P5-06", "area": 5, "subarea": "Mercantil", "tema": "Compañía anónima", "resultado": "Identifica las características de la compañía anónima.", "demanda": "Recordar", "enunciado": "Según la Ley de Compañías, la compañía anónima es una sociedad:", "opciones": [{"texto": "De capital dividido en acciones, con responsabilidad limitada al aporte.", "justificacion": "Correcta. Es la definición del art. 143 de la Ley de Compañías."}, {"texto": "En la que los socios responden solidaria e ilimitadamente.", "justificacion": "Incorrecta. Corresponde a la compañía en nombre colectivo."}, {"texto": "Cuyas participaciones sociales no son transferibles.", "justificacion": "Incorrecta. Las acciones son negociables."}, {"texto": "Que requiere necesariamente participación del Estado.", "justificacion": "Incorrecta. Corresponde a la compañía de economía mixta."}], "correcta": 0, "referencias": ["LC"]}, {"id": "P5-07", "area": 5, "subarea": "Internacional Privado", "tema": "Forma de los actos", "resultado": "Aplica la regla locus regit actum.", "demanda": "Aplicar", "enunciado": "Una escritura pública fue otorgada en Lima y debe surtir efectos en el Ecuador. La forma de ese instrumento se rige por:", "opciones": [{"texto": "La ley del lugar de otorgamiento (locus regit actum).", "justificacion": "Correcta. La forma de los instrumentos públicos se determina por la ley del país de otorgamiento; su autenticidad se acredita conforme a la ley."}, {"texto": "La ley ecuatoriana en todos los casos.", "justificacion": "Incorrecta. Desconoce la regla locus regit actum."}, {"texto": "La ley de la nacionalidad de los otorgantes.", "justificacion": "Incorrecta. La nacionalidad no rige la forma."}, {"texto": "La ley que elija el juez ecuatoriano.", "justificacion": "Incorrecta. La regla de conflicto es legal."}], "correcta": 0, "referencias": ["CC", "HCCH"]}]}, {"id": "pack-002", "bibliografia": {"CADH": "Organización de los Estados Americanos. (1969). Convención Americana sobre Derechos Humanos. https://www.oas.org/dil/esp/tratados_b-32_convencion_americana_sobre_derechos_humanos.htm", "CC": "Congreso Nacional del Ecuador. (2005). Código Civil (Codificación 2005-010). Registro Oficial Suplemento 46, 24 de junio de 2005. Texto vigente con sus reformas, entre ellas la Ley Reformatoria de 2015 (R.O. 526-2S, 19 de junio de 2015); última actualización: Segundo Suplemento del R.O. 61, 17 de junio de 2025. https://www.gob.ec/regulaciones/codigo-civil-codificacion-no-2005-010", "COGEP": "Asamblea Nacional del Ecuador. (2015). Código Orgánico General de Procesos. Registro Oficial Suplemento 506, 22 de mayo de 2015. Reformado, entre otras, por la Ley Orgánica Reformatoria del COGEP (R.O. Suplemento 517, 26 de junio de 2019); última reforma consultada: Cuarto Suplemento del R.O. 140, 7 de octubre de 2025. https://portal.compraspublicas.gob.ec/sercop/wp-content/uploads/2025/11/CODIGO-ORGANICO-GENERAL-DE-PROCESOS-COGEP.pdf", "COIP": "Asamblea Nacional del Ecuador. (2014). Código Orgánico Integral Penal. Registro Oficial Suplemento 180, 10 de febrero de 2014. Texto actualizado al 13 de octubre de 2025 (última reforma incorporada: Tercer Suplemento del R.O. 68, 26 de junio de 2025). https://legalcloud.ec/wp-content/uploads/2025/10/COIP-13102025-Digital.pdf", "CONA": "Congreso Nacional del Ecuador. (2003). Código de la Niñez y Adolescencia (Ley 100). Registro Oficial 737, 3 de enero de 2003. Última reforma: Ley Orgánica Reformatoria de Varios Cuerpos Legales para la Agilización de la Adopción, R.O. 347, 14 de agosto de 2026. https://www.registroficial.gob.ec/", "CRE": "Asamblea Constituyente del Ecuador. (2008). Constitución de la República del Ecuador. Registro Oficial 449, 20 de octubre de 2008 (con las enmiendas posteriores, incluidas las aprobadas en el referéndum de 2024). https://www.asambleanacional.gob.ec/", "CT": "Congreso Nacional del Ecuador. (2005). Código del Trabajo (Codificación 2005-017). Registro Oficial Suplemento 167, 16 de diciembre de 2005. Texto vigente con sus reformas; última reforma: 9 de abril de 2026. https://portal.compraspublicas.gob.ec/sercop/wp-content/uploads/2026/08/CODIGO-DEL-TRABAJO.pdf", "CTRIB": "Congreso Nacional del Ecuador. (2005). Código Orgánico Tributario (antes Código Tributario, Codificación 2005-09). Registro Oficial Suplemento 38, 14 de junio de 2005; reformado y renombrado por la Ley Orgánica Reformatoria al Código Tributario, Noveno Suplemento del R.O. 392, 19 de octubre de 2026. https://www.gob.ec/regulaciones/codigo-organico-tributario", "LAM": "Congreso Nacional del Ecuador. (2006). Ley de Arbitraje y Mediación (Codificación 2006-014). Registro Oficial 417, 14 de diciembre de 2006, con sus reformas. https://oas.org/es/sla/ddi/docs/Ecuador%20-%20Ley%20de%20Arbitraje%20y%20Mediaci%C3%B3n.pdf", "LOGJCC": "Asamblea Nacional del Ecuador. (2009). Ley Orgánica de Garantías Jurisdiccionales y Control Constitucional. Registro Oficial Segundo Suplemento 52, 22 de octubre de 2009. Última reforma: R.O. Suplemento 245, 7 de febrero de 2023. https://lotaip.bomberosquito.gob.ec/transparencia/2026/archivos/logjcc26.pdf"}, "preguntas": [{"id": "Q4-01", "area": 4, "dificultad": 4, "subarea": "Obligaciones y Contratos", "tema": "Rescisión por dolo", "resultado": "Determina el cómputo del plazo de la acción rescisoria según el vicio alegado.", "demanda": "Analizar", "enunciado": "Hace cinco años Marta compró un vehículo inducida por el dolo del vendedor, que ocultó que estaba gravado. Recién hoy descubre el engaño y demanda la rescisión. ¿Prosperará su acción?", "opciones": [{"texto": "No: el cuatrienio se cuenta desde la celebración del contrato.", "justificacion": "Correcta. El Código Civil fija en cuatro años el plazo para pedir la rescisión (nulidad relativa) y, para el error o el dolo, lo cuenta desde la celebración del acto o contrato; solo en la violencia se cuenta desde que esta cesó."}, {"texto": "Sí: el cuatrienio se cuenta desde que la víctima descubre el dolo.", "justificacion": "Incorrecta. Ese criterio de cómputo no es el que prevé el Código Civil para el dolo."}, {"texto": "Sí: el dolo produce nulidad absoluta, saneable en quince años.", "justificacion": "Incorrecta. El dolo que vicia el consentimiento produce nulidad relativa (arts. 1467 y 1698 del Código Civil)."}, {"texto": "No: el dolo nunca vicia el consentimiento en la venta de muebles.", "justificacion": "Incorrecta. El dolo es vicio del consentimiento en cualquier contrato cuando es obra de una de las partes y determinante."}], "correcta": 0, "referencias": ["CC"]}, {"id": "Q4-02", "area": 4, "dificultad": 5, "subarea": "Obligaciones y Contratos", "tema": "Lesión enorme", "resultado": "Aplica los efectos de la lesión enorme en la compraventa de inmuebles.", "demanda": "Evaluar", "enunciado": "Pedro vendió un terreno cuyo justo precio era USD 100.000 en USD 45.000. Demanda la rescisión por lesión enorme y el comprador quiere conservar el terreno. ¿Qué afirmación es correcta?", "opciones": [{"texto": "Hay lesión; el comprador puede completar el justo precio menos un décimo.", "justificacion": "Correcta. Así lo regula el Código Civil para la compraventa de inmuebles: el vendedor sufre lesión enorme cuando el precio que recibe es inferior a la mitad del justo precio, y el comprador contra quien se pronuncia la rescisión puede consentir en ella o completar el justo precio con deducción de una décima parte."}, {"texto": "No hay lesión, porque la diferencia no supera las dos terceras partes.", "justificacion": "Incorrecta. El umbral legal es recibir menos de la mitad del justo precio."}, {"texto": "Hay lesión; el comprador debe además indemnizar el daño moral.", "justificacion": "Incorrecta. La ley prevé completar el justo precio con deducción de una décima parte; no exige daño moral."}, {"texto": "No hay lesión, porque esta solo protege al comprador.", "justificacion": "Incorrecta. Protege a ambos: al vendedor y al comprador en sus respectivos supuestos."}], "correcta": 0, "referencias": ["CC"]}, {"id": "Q4-03", "area": 4, "dificultad": 4, "subarea": "Obligaciones y Contratos", "tema": "Venta de cosa ajena", "resultado": "Evalúa la validez de la compraventa de cosa ajena y sus efectos frente al dueño.", "demanda": "Evaluar", "enunciado": "Luis vende a Ana un caballo que pertenece a su hermano, sin autorización de este. Ana paga el precio y recibe el caballo. ¿Cuál es la situación jurídica?", "opciones": [{"texto": "La venta vale, sin perjuicio de los derechos del dueño.", "justificacion": "Correcta. El Código Civil declara que la venta de cosa ajena vale, sin perjuicio de los derechos del dueño de la cosa vendida mientras no se extingan por el lapso de tiempo; la tradición hecha por quien no es dueño no transfiere el dominio."}, {"texto": "La venta es nula de nulidad absoluta por objeto ilícito.", "justificacion": "Incorrecta. La venta de cosa ajena no adolece de objeto ilícito; es válida como contrato."}, {"texto": "Ana adquirió el dominio por la sola entrega del caballo.", "justificacion": "Incorrecta. Nadie puede transferir más derechos de los que tiene; Ana solo adquiere la posesión."}, {"texto": "El hermano pierde su dominio por no haberse opuesto.", "justificacion": "Incorrecta. El dueño conserva su dominio y puede ejercer la acción reivindicatoria."}], "correcta": 0, "referencias": ["CC"]}, {"id": "Q4-04", "area": 4, "dificultad": 4, "subarea": "Personas y Familia", "tema": "Sociedad conyugal", "resultado": "Distingue los bienes propios de los bienes sociales y el destino de sus frutos.", "demanda": "Analizar", "enunciado": "Durante el matrimonio, sin capitulaciones, Elena hereda una casa de su padre y la arrienda. ¿A quién pertenecen la casa y los cánones de arrendamiento?", "opciones": [{"texto": "La casa es propia de Elena; los cánones son sociales.", "justificacion": "Correcta. El Código Civil excluye del haber social los bienes adquiridos a título gratuito durante el matrimonio, pero incluye en él los frutos de los bienes propios de cada cónyuge devengados durante la sociedad."}, {"texto": "La casa y los cánones son sociales, por adquirirse en el matrimonio.", "justificacion": "Incorrecta. La adquisición a título gratuito (herencia) hace que el inmueble sea propio."}, {"texto": "La casa y los cánones son bienes propios de Elena.", "justificacion": "Incorrecta. Los frutos de los bienes propios ingresan a la sociedad conyugal."}, {"texto": "La casa pertenece a ambos por partes iguales, por ser vivienda familiar.", "justificacion": "Incorrecta. El carácter de vivienda no altera la naturaleza del título de adquisición."}], "correcta": 0, "referencias": ["CC"]}, {"id": "Q4-05", "area": 4, "dificultad": 5, "subarea": "Sucesiones", "tema": "Porción conyugal", "resultado": "Aplica los requisitos de la porción conyugal en la sucesión.", "demanda": "Evaluar", "enunciado": "Muere Ramiro y le sobreviven su cónyuge, Inés, y dos hijos. Inés tiene un patrimonio propio y rentas muy superiores a lo necesario para su congrua subsistencia. ¿Tiene derecho a porción conyugal?", "opciones": [{"texto": "No, porque no carece de lo necesario para su subsistencia.", "justificacion": "Correcta. El Código Civil la define como la parte del patrimonio del difunto que la ley asigna al cónyuge sobreviviente que carece de lo necesario para su congrua sustentación; si sus bienes propios son suficientes, no le corresponde."}, {"texto": "Sí, porque siempre recibe una cuarta parte de la herencia.", "justificacion": "Incorrecta. La porción conyugal no es automática; depende de la necesidad del cónyuge."}, {"texto": "Sí, y además excluye a los hijos del primer orden.", "justificacion": "Incorrecta. La porción conyugal no excluye a los hijos (art. 1028 del Código Civil)."}, {"texto": "Solo si Ramiro lo dispuso así en su testamento.", "justificacion": "Incorrecta. La porción conyugal es una asignación forzosa establecida por la ley."}], "correcta": 0, "referencias": ["CC"]}, {"id": "Q4-06", "area": 4, "dificultad": 5, "subarea": "Sucesiones", "tema": "Asignaciones forzosas", "resultado": "Determina la porción de libre disposición cuando hay legitimarios.", "demanda": "Analizar", "enunciado": "Germán, viudo con dos hijos, otorga testamento dejando todos sus bienes a un amigo. Los hijos impugnan. ¿Cuál es la solución?", "opciones": [{"texto": "Reformar el testamento: el amigo solo recibe la cuarta de libre disposición.", "justificacion": "Correcta. Habiendo legitimarios, la mitad de los bienes corresponde a las legítimas, una cuarta parte a mejoras a favor de descendientes y solo la cuarta restante es de libre disposición; los legitimarios perjudicados pueden pedir la reforma del testamento."}, {"texto": "El testamento es válido: el testador tiene plena libertad de testar.", "justificacion": "Incorrecta. Las asignaciones forzosas limitan la libertad de testar (art. 1205 del Código Civil)."}, {"texto": "El testamento es nulo y se aplica íntegramente la sucesión intestada.", "justificacion": "Incorrecta. La acción de los legitimarios es de reforma del testamento, no de nulidad total."}, {"texto": "El amigo recibe la mitad de los bienes y los hijos la otra mitad.", "justificacion": "Incorrecta. Con legitimarios, lo libremente disponible es solo una cuarta parte."}], "correcta": 0, "referencias": ["CC"]}, {"id": "Q4-07", "area": 4, "dificultad": 4, "subarea": "Sucesiones", "tema": "Indignidad para suceder", "resultado": "Comprende cómo opera la indignidad para suceder.", "demanda": "Comprender", "enunciado": "Un hijo fue condenado por el homicidio de su padre. Los demás herederos quieren excluirlo de la herencia. Según el Código Civil:", "opciones": [{"texto": "Es indigno, pero la indignidad debe declararse en juicio.", "justificacion": "Correcta. El atentado grave contra la vida del causante es causa de indignidad, y esta debe ser declarada judicialmente a petición de los interesados."}, {"texto": "Queda excluido automáticamente, sin declaración judicial.", "justificacion": "Incorrecta. La indignidad requiere declaración judicial."}, {"texto": "Solo queda excluido si el padre lo desheredó en testamento.", "justificacion": "Incorrecta. El desheredamiento es una figura distinta; la indignidad opera por ley."}, {"texto": "Conserva su derecho, porque la condena no tiene efectos civiles.", "justificacion": "Incorrecta. El hecho es justamente causa de indignidad para suceder."}], "correcta": 0, "referencias": ["CC"]}, {"id": "Q4-08", "area": 4, "dificultad": 4, "subarea": "Obligaciones y Contratos", "tema": "Obligaciones naturales", "resultado": "Aplica los efectos de las obligaciones naturales.", "demanda": "Aplicar", "enunciado": "Carlos pagó voluntariamente una deuda cuya acción de cobro ya estaba prescrita. Luego se entera de la prescripción y demanda la restitución de lo pagado. ¿Procede?", "opciones": [{"texto": "No, porque subsiste una obligación natural.", "justificacion": "Correcta. El Código Civil reconoce como obligaciones naturales las civiles extinguidas por prescripción, y autoriza a retener lo que se ha dado o pagado voluntariamente en razón de ellas."}, {"texto": "Sí, por tratarse de un pago de lo no debido.", "justificacion": "Incorrecta. Existe una obligación natural que justifica el pago."}, {"texto": "Sí, porque la prescripción extingue todo vínculo jurídico.", "justificacion": "Incorrecta. La prescripción extingue la acción, pero la obligación subsiste como natural."}, {"texto": "Solo si el acreedor actuó de mala fe al recibir.", "justificacion": "Incorrecta. La buena o mala fe del acreedor no altera la retención del pago voluntario."}], "correcta": 0, "referencias": ["CC"]}, {"id": "Q4-09", "area": 4, "dificultad": 4, "subarea": "Obligaciones y Contratos", "tema": "Responsabilidad por el hecho ajeno", "resultado": "Determina la responsabilidad civil por hechos de terceros.", "demanda": "Analizar", "enunciado": "Un adolescente de quince años, que vive con sus padres, rompe deliberadamente el vehículo de un vecino. ¿Quién responde civilmente según el Código Civil?", "opciones": [{"texto": "Los padres, salvo que prueben que no pudieron impedir el hecho.", "justificacion": "Correcta. Es la responsabilidad por el hecho ajeno: la ley presume la culpa de quienes tienen a su cuidado al menor, presunción que admite prueba en contrario."}, {"texto": "Nadie, porque el adolescente es inimputable civil y penalmente.", "justificacion": "Incorrecta. La responsabilidad civil puede recaer en quienes lo tienen a su cuidado."}, {"texto": "Solo el Estado, por falta de protección a la niñez.", "justificacion": "Incorrecta. No hay base para atribuir responsabilidad al Estado."}, {"texto": "Los padres siempre, sin poder probar que no pudieron impedirlo.", "justificacion": "Incorrecta. La presunción de culpa admite prueba en contrario."}], "correcta": 0, "referencias": ["CC"]}, {"id": "Q4-10", "area": 4, "dificultad": 5, "subarea": "Obligaciones y Contratos", "tema": "Cesión de créditos", "resultado": "Aplica los efectos de la notificación en la cesión de créditos.", "demanda": "Evaluar", "enunciado": "Banco A cede a Fondo B un crédito contra Julia. Antes de que la cesión le sea notificada o aceptada por ella, Julia paga la deuda a Banco A. Fondo B la demanda. ¿Qué ocurre?", "opciones": [{"texto": "El pago a Banco A es válido, pues la cesión no fue notificada.", "justificacion": "Correcta. El Código Civil condiciona los efectos de la cesión frente al deudor y terceros a su notificación o aceptación; antes de ello, el deudor paga válidamente al cedente."}, {"texto": "Julia debe pagar otra vez a Fondo B, pues la cesión ya se perfeccionó.", "justificacion": "Incorrecta. La cesión entre cedente y cesionario no es oponible a Julia sin notificación."}, {"texto": "La cesión es nula por no contar con el consentimiento previo de Julia.", "justificacion": "Incorrecta. La cesión no requiere el consentimiento del deudor para su validez."}, {"texto": "Julia y Banco A son solidariamente responsables ante Fondo B.", "justificacion": "Incorrecta. No existe solidaridad legal en este supuesto."}], "correcta": 0, "referencias": ["CC"]}, {"id": "Q4-11", "area": 4, "dificultad": 5, "subarea": "Obligaciones y Contratos", "tema": "Acción pauliana", "resultado": "Identifica los requisitos de la acción pauliana.", "demanda": "Analizar", "enunciado": "Un deudor insolvente dona su única casa a su hermano para que sus acreedores no puedan embargarla. El hermano ignoraba la situación del deudor. ¿Pueden los acreedores revocar la donación?", "opciones": [{"texto": "Sí: en actos gratuitos basta la mala fe del deudor.", "justificacion": "Correcta. En la acción pauliana del Código Civil, los contratos onerosos exigen la mala fe del deudor y del adquirente; los actos gratuitos se revocan probando solo la mala fe del deudor y el perjuicio."}, {"texto": "No: el hermano recibió la casa de buena fe.", "justificacion": "Incorrecta. La buena fe del donatario no impide la revocación de un acto gratuito."}, {"texto": "Solo si la donación se hizo sin escritura pública.", "justificacion": "Incorrecta. La forma no es el fundamento de la acción pauliana."}, {"texto": "Solo mediante nulidad absoluta por causa ilícita.", "justificacion": "Incorrecta. El remedio específico es la acción revocatoria o pauliana."}], "correcta": 0, "referencias": ["CC"]}, {"id": "Q4-12", "area": 4, "dificultad": 4, "subarea": "Obligaciones y Contratos", "tema": "Cláusula penal", "resultado": "Aplica las reglas de acumulación de la pena y la obligación principal.", "demanda": "Aplicar", "enunciado": "Un contrato de obra fija una cláusula penal de USD 10.000 por incumplimiento, sin pactar que se debe por el simple retardo. El contratista no entrega la obra. El dueño exige la obra terminada y además la pena. ¿Es procedente?", "opciones": [{"texto": "No: debe elegir entre el cumplimiento y la pena.", "justificacion": "Correcta. Es la regla del Código Civil sobre la cláusula penal: el acreedor elige entre la obligación principal y la pena, salvo los supuestos legales de acumulación."}, {"texto": "Sí: el acreedor siempre puede exigir ambas cosas.", "justificacion": "Incorrecta. La acumulación solo procede en los casos previstos por la ley."}, {"texto": "No: la cláusula penal es nula si supera el valor de la obra.", "justificacion": "Incorrecta. Una pena excesiva puede reducirse, pero eso no responde a la pregunta sobre la acumulación."}, {"texto": "No: solo puede exigir la pena, nunca el cumplimiento.", "justificacion": "Incorrecta. El acreedor puede optar por el cumplimiento."}], "correcta": 0, "referencias": ["CC"]}, {"id": "Q2-01", "area": 2, "dificultad": 5, "subarea": "Derecho Penal (parte general)", "tema": "Error de tipo", "resultado": "Distingue los efectos del error de tipo vencible e invencible.", "demanda": "Evaluar", "enunciado": "Un cazador dispara a un bulto entre la maleza creyendo que es un venado, sin verificar pese a saber que había personas en la zona; mata a otro cazador. Según el COIP:", "opciones": [{"texto": "Error de tipo vencible: responde por homicidio culposo.", "justificacion": "Correcta. El error de tipo invencible excluye la responsabilidad penal; el vencible deja subsistente la culpa cuando la modalidad culposa está tipificada (art. 27 COIP)."}, {"texto": "No hay error relevante: responde por homicidio doloso.", "justificacion": "Incorrecta. El error sobre un elemento del tipo excluye el dolo."}, {"texto": "Error de tipo: no responde, porque todo error excluye la responsabilidad.", "justificacion": "Incorrecta. Solo el error invencible la excluye; aquí el error era evitable."}, {"texto": "Error de prohibición, que excluye la antijuridicidad.", "justificacion": "Incorrecta. El cazador sabía que matar es ilícito; su error recae sobre un elemento del tipo."}], "correcta": 0, "referencias": ["COIP"]}, {"id": "Q2-02", "area": 2, "dificultad": 5, "subarea": "Derecho Penal (parte general)", "tema": "Error de prohibición", "resultado": "Identifica la categoría dogmática afectada por el error de prohibición.", "demanda": "Analizar", "enunciado": "Una persona realiza una conducta típica creyendo, por un error que no pudo evitar, que su comportamiento era lícito. Según el COIP, el error de prohibición invencible:", "opciones": [{"texto": "Excluye la culpabilidad.", "justificacion": "Correcta. El error de prohibición recae sobre la comprensión de la ilicitud; cuando es invencible, no hay culpabilidad y, por tanto, no hay infracción penal (art. 18 COIP)."}, {"texto": "Excluye la tipicidad.", "justificacion": "Incorrecta. Excluir la tipicidad es efecto del error de tipo."}, {"texto": "Excluye la antijuridicidad.", "justificacion": "Incorrecta. La antijuridicidad se excluye por causas de justificación (art. 30 COIP)."}, {"texto": "Solo atenúa la pena en un tercio.", "justificacion": "Incorrecta. La atenuación corresponde al error vencible, no al invencible."}], "correcta": 0, "referencias": ["COIP"]}, {"id": "Q2-03", "area": 2, "dificultad": 5, "subarea": "Derecho Penal (parte general)", "tema": "Comisión por omisión", "resultado": "Aplica la posición de garante en los delitos de omisión.", "demanda": "Analizar", "enunciado": "Un salvavidas contratado observa que un bañista se ahoga y, deliberadamente, no interviene; el bañista muere. ¿Cómo se califica su conducta?", "opciones": [{"texto": "Como omisión dolosa de quien está en posición de garante.", "justificacion": "Correcta. El COIP sanciona la omisión dolosa de quien se encuentra en posición de garante, es decir, quien tiene la obligación legal o contractual de cuidado o custodia de la vida."}, {"texto": "Como conducta atípica, porque no causó materialmente la muerte.", "justificacion": "Incorrecta. La posición de garante permite imputar el resultado a la omisión."}, {"texto": "Solo como omisión de socorro, aplicable a cualquier persona.", "justificacion": "Incorrecta. Su deber contractual de protección lo coloca en posición de garante."}, {"texto": "Como homicidio culposo, en todos los casos.", "justificacion": "Incorrecta. La omisión fue deliberada, no por infracción del deber de cuidado."}], "correcta": 0, "referencias": ["COIP"]}, {"id": "Q2-04", "area": 2, "dificultad": 4, "subarea": "Derecho Penal (parte general)", "tema": "Desistimiento voluntario", "resultado": "Determina los efectos del desistimiento en la tentativa.", "demanda": "Aplicar", "enunciado": "Raúl ingresa a una casa para robar, pero se arrepiente y sale voluntariamente sin llevarse nada; para entrar, rompió la cerradura. ¿Cómo responde?", "opciones": [{"texto": "Solo por el daño a la cerradura, al haber desistido.", "justificacion": "Correcta. El COIP excluye la pena de la tentativa cuando el autor desiste voluntariamente, quedando a salvo la responsabilidad por los actos ya ejecutados que sean delito por sí mismos."}, {"texto": "Por tentativa de robo, con la pena reducida de la tentativa.", "justificacion": "Incorrecta. El desistimiento voluntario excluye la tentativa."}, {"texto": "Por robo consumado, al haber ingresado a la casa.", "justificacion": "Incorrecta. No hubo apoderamiento de ningún bien."}, {"texto": "Por nada, porque el desistimiento extingue toda responsabilidad.", "justificacion": "Incorrecta. Los actos ejecutados que constituyen infracción subsisten."}], "correcta": 0, "referencias": ["COIP"]}, {"id": "Q2-05", "area": 2, "dificultad": 4, "subarea": "Derecho Penal (parte general)", "tema": "Concurso ideal", "resultado": "Aplica las reglas del concurso ideal de infracciones.", "demanda": "Aplicar", "enunciado": "Con una sola conducta, una persona encuadra en dos tipos penales distintos. Según el COIP, se aplica:", "opciones": [{"texto": "La pena de la infracción más grave.", "justificacion": "Correcta. Es la regla del concurso ideal de infracciones (art. 21 COIP)."}, {"texto": "La suma de las penas de ambas infracciones.", "justificacion": "Incorrecta. La acumulación corresponde al concurso real."}, {"texto": "La pena de la menos grave, por favorabilidad.", "justificacion": "Incorrecta. La ley dispone aplicar la más grave."}, {"texto": "La pena que elija la Fiscalía en su acusación.", "justificacion": "Incorrecta. La pena la determina la ley y la impone el juzgador."}], "correcta": 0, "referencias": ["COIP"]}, {"id": "Q2-06", "area": 2, "dificultad": 5, "subarea": "Derecho Procesal Penal", "tema": "Oportunidad de la prueba", "resultado": "Evalúa el valor probatorio de las actuaciones de la investigación.", "demanda": "Evaluar", "enunciado": "En juicio, la Fiscalía pide condenar únicamente con base en la versión que un testigo rindió en la investigación previa; el testigo no comparece a declarar y no se practicó testimonio anticipado. ¿Qué debe hacer el tribunal?", "opciones": [{"texto": "No condenar con esa versión, que no es prueba practicada en juicio.", "justificacion": "Correcta. Es el principio de oportunidad de la prueba del art. 454 COIP, que garantiza la inmediación y la contradicción."}, {"texto": "Condenar, porque la versión fue rendida ante un fiscal.", "justificacion": "Incorrecta. La versión fiscal no es prueba por sí misma."}, {"texto": "Condenar, siempre que la defensa no objete la versión.", "justificacion": "Incorrecta. La regla no depende de la objeción de la defensa."}, {"texto": "Suspender el juicio indefinidamente hasta que el testigo aparezca.", "justificacion": "Incorrecta. El tribunal resuelve con la prueba practicada en juicio."}], "correcta": 0, "referencias": ["COIP"]}, {"id": "Q2-07", "area": 2, "dificultad": 4, "subarea": "Derecho Procesal Penal", "tema": "Testimonio anticipado", "resultado": "Determina la procedencia del testimonio anticipado.", "demanda": "Aplicar", "enunciado": "Una víctima de un delito contra la integridad sexual debe declarar y se busca evitar su revictimización. Según el COIP:", "opciones": [{"texto": "Puede rendir testimonio anticipado con valor probatorio.", "justificacion": "Correcta. El art. 502 COIP admite el testimonio anticipado, entre otros, de víctimas de delitos contra la integridad sexual y de quienes no puedan comparecer al juicio."}, {"texto": "Solo puede declarar en la audiencia de juicio, sin excepción.", "justificacion": "Incorrecta. La ley prevé el testimonio anticipado."}, {"texto": "Basta su versión escrita rendida ante la Policía.", "justificacion": "Incorrecta. Una versión policial no es testimonio con valor probatorio."}, {"texto": "Su declaración es innecesaria si existe informe pericial.", "justificacion": "Incorrecta. El testimonio de la víctima es un medio de prueba autónomo."}], "correcta": 0, "referencias": ["COIP"]}, {"id": "Q2-08", "area": 2, "dificultad": 4, "subarea": "Derecho Procesal Penal", "tema": "Sustitución de la prisión preventiva", "resultado": "Identifica los casos especiales de sustitución de la prisión preventiva.", "demanda": "Aplicar", "enunciado": "Se dicta prisión preventiva contra una procesada embarazada. Según el COIP:", "opciones": [{"texto": "Puede sustituirse por arresto domiciliario con dispositivo electrónico.", "justificacion": "Correcta. El art. 537 COIP prevé esta sustitución para casos especiales, entre ellos la mujer embarazada y hasta noventa días posteriores al parto."}, {"texto": "Debe revocarse toda medida cautelar mientras dure el embarazo.", "justificacion": "Incorrecta. La ley prevé la sustitución, no la eliminación de las medidas."}, {"texto": "Se suspende el proceso penal hasta después del parto.", "justificacion": "Incorrecta. El embarazo no suspende el proceso penal."}, {"texto": "No hay trato diferenciado, por el principio de igualdad.", "justificacion": "Incorrecta. La protección reforzada responde a su condición de grupo de atención prioritaria (art. 35 CRE)."}], "correcta": 0, "referencias": ["COIP", "CRE"]}, {"id": "Q2-09", "area": 2, "dificultad": 5, "subarea": "Derecho Procesal Penal", "tema": "Apelación penal", "resultado": "Identifica las decisiones apelables en el proceso penal.", "demanda": "Analizar", "enunciado": "¿Cuál de las siguientes decisiones es apelable según el COIP?", "opciones": [{"texto": "El auto de sobreseimiento, si existió acusación fiscal.", "justificacion": "Correcta. Figura en el art. 653 COIP, junto con la resolución sobre prescripción, el auto de nulidad, las sentencias y la resolución sobre prisión preventiva en los casos previstos."}, {"texto": "El auto de llamamiento a juicio dictado en la evaluación.", "justificacion": "Incorrecta. No figura entre las decisiones apelables del art. 653 COIP."}, {"texto": "La providencia que fija fecha para la audiencia de juicio.", "justificacion": "Incorrecta. Es una providencia de mero trámite."}, {"texto": "La versión rendida por el procesado en la investigación.", "justificacion": "Incorrecta. No es una decisión judicial."}], "correcta": 0, "referencias": ["COIP"]}, {"id": "Q2-10", "area": 2, "dificultad": 4, "subarea": "Derecho Procesal Penal", "tema": "Recurso de revisión", "resultado": "Determina la procedencia del recurso de revisión.", "demanda": "Aplicar", "enunciado": "Una persona fue condenada por homicidio con sentencia ejecutoriada. Años después aparece con vida la supuesta víctima. ¿Qué mecanismo procede?", "opciones": [{"texto": "El recurso de revisión ante la Corte Nacional.", "justificacion": "Correcta. La comprobación de la existencia de la persona que se creía muerta es causal de revisión según el art. 658 COIP."}, {"texto": "El recurso de apelación, dentro de tres días.", "justificacion": "Incorrecta. La sentencia ya está ejecutoriada (art. 654 COIP)."}, {"texto": "La acción de hábeas data ante el juez de turno.", "justificacion": "Incorrecta. No tutela la revisión de condenas."}, {"texto": "Ninguno, porque la cosa juzgada es absoluta.", "justificacion": "Incorrecta. La revisión es la excepción a la cosa juzgada penal."}], "correcta": 0, "referencias": ["COIP"]}, {"id": "Q2-11", "area": 2, "dificultad": 5, "subarea": "Derecho Penal (parte especial)", "tema": "Lavado de activos", "resultado": "Comprende la autonomía del delito de lavado de activos.", "demanda": "Evaluar", "enunciado": "La defensa de un procesado por lavado de activos alega que no puede ser juzgado porque no existe sentencia previa por el delito del que provendrían los fondos. Según el COIP:", "opciones": [{"texto": "No prospera, porque el lavado de activos es un delito autónomo.", "justificacion": "Correcta. El art. 317 COIP consagra la autonomía del lavado de activos."}, {"texto": "Prospera, porque el delito precedente es una cuestión prejudicial.", "justificacion": "Incorrecta. La ley excluye expresamente esa dependencia."}, {"texto": "Prospera si el delito precedente se cometió en el extranjero.", "justificacion": "Incorrecta. La autonomía comprende delitos cometidos dentro o fuera del país."}, {"texto": "El proceso se suspende hasta investigar el delito precedente.", "justificacion": "Incorrecta. No existe esa suspensión."}], "correcta": 0, "referencias": ["COIP"]}, {"id": "Q2-12", "area": 2, "dificultad": 4, "subarea": "Derecho Penal (parte general)", "tema": "Responsabilidad penal de la persona jurídica", "resultado": "Aplica las reglas de responsabilidad penal de las personas jurídicas.", "demanda": "Analizar", "enunciado": "Una empresa obtiene beneficios de un delito cometido por su gerente en ejercicio de sus funciones. El gerente fallece antes del juicio. Según el COIP:", "opciones": [{"texto": "La empresa puede responder, pues su responsabilidad es independiente.", "justificacion": "Correcta. El art. 49 COIP establece la responsabilidad de las personas jurídicas por delitos cometidos para su beneficio por quienes ejercen su propiedad, control o administración, y dispone que subsiste aunque la persona natural fallezca o se extinga su responsabilidad."}, {"texto": "La persona jurídica no puede responder penalmente en ningún caso.", "justificacion": "Incorrecta. El COIP admite su responsabilidad penal."}, {"texto": "La muerte del gerente extingue la responsabilidad de la empresa.", "justificacion": "Incorrecta. Su responsabilidad es independiente."}, {"texto": "Solo responden los accionistas con su patrimonio personal.", "justificacion": "Incorrecta. La responsabilidad es de la persona jurídica."}], "correcta": 0, "referencias": ["COIP"]}, {"id": "Q1-01", "area": 1, "dificultad": 4, "subarea": "Derecho Constitucional", "tema": "Acción de protección contra particulares", "resultado": "Determina la procedencia de la acción de protección contra particulares.", "demanda": "Analizar", "enunciado": "Una trabajadora de una empresa privada es separada de un programa interno por su condición de persona con VIH. ¿Procede la acción de protección contra la empresa?", "opciones": [{"texto": "Sí, porque la afectada está en situación de discriminación.", "justificacion": "Correcta. El art. 88 CRE la habilita contra particulares en esos supuestos, además de cuando el particular presta servicios públicos impropios, actúa por delegación o concesión, o la violación provoca daño grave."}, {"texto": "No, porque solo procede contra autoridades públicas.", "justificacion": "Incorrecta. La Constitución la admite contra particulares en ciertos supuestos."}, {"texto": "Solo si antes agotó la vía laboral ordinaria.", "justificacion": "Incorrecta. La vía constitucional no exige agotar otras vías cuando estas no son adecuadas y eficaces (art. 40 LOGJCC)."}, {"texto": "No: solo procede la acción por incumplimiento.", "justificacion": "Incorrecta. Esa acción tiene otro objeto (art. 93 CRE)."}], "correcta": 0, "referencias": ["CRE", "LOGJCC"]}, {"id": "Q1-02", "area": 1, "dificultad": 5, "subarea": "Derecho Constitucional", "tema": "Medidas cautelares constitucionales", "resultado": "Identifica los límites de las medidas cautelares constitucionales.", "demanda": "Evaluar", "enunciado": "Una persona solicita como medida cautelar constitucional que se suspenda la ejecución de una sentencia dictada por un juez civil. ¿Procede?", "opciones": [{"texto": "No, porque no proceden contra la ejecución de órdenes judiciales.", "justificacion": "Correcta. El art. 27 LOGJCC excluye las medidas cautelares cuando existan medidas en las vías administrativas u ordinarias, cuando se trate de la ejecución de órdenes judiciales o cuando se interpongan en la acción extraordinaria de protección."}, {"texto": "Sí, siempre que se demuestre peligro en la demora.", "justificacion": "Incorrecta. Existe una exclusión legal expresa."}, {"texto": "Sí, si se solicita conjuntamente con una acción de protección.", "justificacion": "Incorrecta. La exclusión subsiste aunque se solicite conjuntamente."}, {"texto": "Sí, pero solo la Corte Constitucional puede dictarla.", "justificacion": "Incorrecta. La procedencia no depende del órgano; está excluida por ley."}], "correcta": 0, "referencias": ["LOGJCC", "CRE"]}, {"id": "Q1-03", "area": 1, "dificultad": 5, "subarea": "Derecho Constitucional", "tema": "Reforma constitucional", "resultado": "Selecciona el procedimiento de reforma constitucional idóneo.", "demanda": "Evaluar", "enunciado": "Se propone modificar la Constitución para restringir un derecho fundamental. ¿Qué procedimiento es constitucionalmente admisible?", "opciones": [{"texto": "Solo una Asamblea Constituyente.", "justificacion": "Correcta. Los arts. 441 y 442 CRE excluyen las restricciones a derechos de la enmienda y de la reforma parcial; el art. 444 CRE prevé la Asamblea Constituyente."}, {"texto": "La enmienda por iniciativa de la Asamblea Nacional.", "justificacion": "Incorrecta. La enmienda no puede restringir derechos (art. 441 CRE)."}, {"texto": "La reforma parcial por iniciativa ciudadana.", "justificacion": "Incorrecta. La reforma parcial tampoco puede restringir derechos (art. 442 CRE)."}, {"texto": "Un decreto ejecutivo con dictamen de la Corte Constitucional.", "justificacion": "Incorrecta. No es un mecanismo de reforma constitucional."}], "correcta": 0, "referencias": ["CRE"]}, {"id": "Q1-04", "area": 1, "dificultad": 4, "subarea": "Derecho Constitucional", "tema": "Revocatoria del mandato", "resultado": "Aplica los límites temporales de la revocatoria del mandato.", "demanda": "Aplicar", "enunciado": "A los ocho meses de posesionado un alcalde, un grupo de ciudadanos solicita su revocatoria del mandato. Según la Constitución:", "opciones": [{"texto": "Es improcedente, porque no ha cumplido el primer año.", "justificacion": "Correcta. Así lo establece el art. 105 CRE."}, {"texto": "Es procedente en cualquier momento del periodo.", "justificacion": "Incorrecta. La Constitución fija límites temporales."}, {"texto": "Es procedente, pero solo durante el último año.", "justificacion": "Incorrecta. El último año está precisamente excluido."}, {"texto": "Solo puede solicitarla el Concejo Municipal.", "justificacion": "Incorrecta. Es un derecho de las personas en goce de derechos políticos."}], "correcta": 0, "referencias": ["CRE"]}, {"id": "Q1-05", "area": 1, "dificultad": 4, "subarea": "Derechos Humanos", "tema": "Reparación integral", "resultado": "Distingue las medidas de reparación integral.", "demanda": "Analizar", "enunciado": "Tras declarar la vulneración de un derecho, la jueza ordena capacitar a los servidores de la entidad responsable para evitar que los hechos se repitan. Esta medida es de:", "opciones": [{"texto": "Garantía de no repetición.", "justificacion": "Correcta. La reparación integral comprende restitución, indemnización, rehabilitación, satisfacción y garantías de no repetición (art. 18 LOGJCC), estándar coincidente con la jurisprudencia interamericana."}, {"texto": "Medida de restitución del derecho.", "justificacion": "Incorrecta. La restitución busca restablecer la situación anterior a la vulneración."}, {"texto": "Medida de rehabilitación.", "justificacion": "Incorrecta. Comprende la atención médica, psicológica o social de la víctima."}, {"texto": "Indemnización compensatoria.", "justificacion": "Incorrecta. Es la compensación económica de los daños."}], "correcta": 0, "referencias": ["LOGJCC", "CADH"]}, {"id": "Q1-06", "area": 1, "dificultad": 4, "subarea": "Derecho Constitucional", "tema": "Interpretación constitucional", "resultado": "Aplica las reglas de interpretación constitucional.", "demanda": "Aplicar", "enunciado": "Una norma constitucional admite dos interpretaciones razonables: una restringe el ejercicio de un derecho y otra lo amplía. Según el artículo 427 de la Constitución, la jueza debe:", "opciones": [{"texto": "Escoger la que más favorezca la vigencia de los derechos.", "justificacion": "Correcta. El art. 427 CRE ordena interpretar por el tenor literal que más se ajuste a la Constitución en su integralidad y, en caso de duda, en el sentido más favorable a la plena vigencia de los derechos."}, {"texto": "Escoger la más restrictiva, por seguridad jurídica.", "justificacion": "Incorrecta. Contradice el mandato del art. 427 CRE."}, {"texto": "Consultar a la Asamblea Nacional antes de resolver.", "justificacion": "Incorrecta. La interpretación constitucional corresponde a los jueces y, con carácter vinculante, a la Corte Constitucional (art. 436 CRE)."}, {"texto": "Aplicar la que proponga la entidad pública demandada.", "justificacion": "Incorrecta. No existe deferencia de ese tipo."}], "correcta": 0, "referencias": ["CRE"]}, {"id": "Q3-01", "area": 3, "dificultad": 5, "subarea": "Derecho Procesal (COGEP)", "tema": "Prueba no anunciada", "resultado": "Aplica las reglas excepcionales de la prueba no anunciada.", "demanda": "Evaluar", "enunciado": "Después de contestada la demanda, la actora encuentra un documento decisivo que no conocía al presentar su demanda. Según el COGEP:", "opciones": [{"texto": "Pedirla antes de la convocatoria a juicio, si no la conocía.", "justificacion": "Correcta. Es la excepción del art. 166 COGEP a la regla de anunciar la prueba en la demanda."}, {"texto": "Presentarla en cualquier momento, incluso en casación.", "justificacion": "Incorrecta. La casación no admite nueva prueba."}, {"texto": "Nunca, porque la prueba solo se anuncia en la demanda.", "justificacion": "Incorrecta. La ley prevé esta excepción."}, {"texto": "Presentarla solo si la contraparte lo consiente.", "justificacion": "Incorrecta. La procedencia depende de los requisitos legales, no del consentimiento contrario."}], "correcta": 0, "referencias": ["COGEP"]}, {"id": "Q3-02", "area": 3, "dificultad": 4, "subarea": "Derecho Procesal (COGEP)", "tema": "Recurso de hecho", "resultado": "Identifica la procedencia del recurso de hecho.", "demanda": "Aplicar", "enunciado": "Una jueza niega indebidamente un recurso de apelación interpuesto a tiempo contra una sentencia. ¿Qué puede hacer la parte afectada?", "opciones": [{"texto": "Interponer recurso de hecho.", "justificacion": "Correcta. El art. 278 COGEP prevé el recurso de hecho contra las providencias que niegan un recurso de apelación o de casación."}, {"texto": "Presentar acción de protección.", "justificacion": "Incorrecta. Existe un mecanismo procesal específico y la acción no procede contra providencias judiciales (art. 42 LOGJCC)."}, {"texto": "Pedir la aclaración de la sentencia.", "justificacion": "Incorrecta. La aclaración no permite obtener la concesión del recurso."}, {"texto": "Esperar la ejecución y oponer excepciones.", "justificacion": "Incorrecta. La sentencia quedaría ejecutoriada."}], "correcta": 0, "referencias": ["COGEP"]}, {"id": "Q3-03", "area": 3, "dificultad": 5, "subarea": "Derecho Procesal (COGEP)", "tema": "Carga de la prueba", "resultado": "Aplica las reglas especiales de distribución de la carga probatoria.", "demanda": "Analizar", "enunciado": "Una comunidad demanda a una empresa minera alegando daño ambiental. ¿Sobre quién recae la carga de probar la inexistencia del daño?", "opciones": [{"texto": "Sobre la empresa, gestora de la actividad.", "justificacion": "Correcta. Así lo disponen el art. 397 num. 1 CRE y el art. 169 COGEP, que invierten la regla general en materia ambiental."}, {"texto": "Sobre la comunidad demandante, por la regla general.", "justificacion": "Incorrecta. La materia ambiental tiene una regla especial."}, {"texto": "Sobre el Ministerio del Ambiente, como autoridad rectora.", "justificacion": "Incorrecta. La carga recae en el gestor de la actividad."}, {"texto": "Sobre el juez, que debe ordenarla de oficio.", "justificacion": "Incorrecta. La prueba de oficio es excepcional y no traslada la carga."}], "correcta": 0, "referencias": ["CRE", "COGEP"]}, {"id": "Q3-04", "area": 3, "dificultad": 4, "subarea": "Métodos Alternativos", "tema": "Competencia del tribunal arbitral", "resultado": "Aplica el principio de competencia sobre la propia competencia.", "demanda": "Analizar", "enunciado": "En un arbitraje, la parte demandada alega que el convenio arbitral es inválido. ¿Quién resuelve sobre esa alegación?", "opciones": [{"texto": "El propio tribunal arbitral, sobre su competencia.", "justificacion": "Correcta. El art. 22 LAM atribuye al tribunal arbitral la decisión sobre su propia competencia, principio conocido como competencia-competencia."}, {"texto": "Necesariamente un juez civil, antes de continuar.", "justificacion": "Incorrecta. La ley asigna esa decisión al tribunal arbitral."}, {"texto": "La Corte Constitucional, por tratarse de un derecho.", "justificacion": "Incorrecta. No le corresponde resolver la competencia arbitral."}, {"texto": "El director del centro de arbitraje, sin recurso.", "justificacion": "Incorrecta. La decisión es jurisdiccional y corresponde al tribunal."}], "correcta": 0, "referencias": ["LAM"]}, {"id": "Q3-05", "area": 3, "dificultad": 4, "subarea": "Métodos Alternativos", "tema": "Mediación y materia transigible", "resultado": "Determina los límites materiales de la mediación.", "demanda": "Evaluar", "enunciado": "En un centro de mediación, las partes pretenden acordar que el hijo menor renuncie a su derecho de alimentos a cambio de un pago único. ¿Es válido el acuerdo?", "opciones": [{"texto": "No, porque los alimentos de menores son irrenunciables.", "justificacion": "Correcta. La Ley de Arbitraje y Mediación (art. 43) limita la mediación a materias transigibles, y el derecho de alimentos es irrenunciable según el Código de la Niñez y Adolescencia; sí puede mediarse el monto o la forma de pago."}, {"texto": "Sí, porque el acta de mediación tiene efecto de cosa juzgada.", "justificacion": "Incorrecta. El efecto del acta (art. 47 LAM) supone un acuerdo sobre materia transigible."}, {"texto": "Sí, si el pago único supera el valor de doce pensiones.", "justificacion": "Incorrecta. El monto no vuelve renunciable el derecho."}, {"texto": "Sí, siempre que el mediador apruebe el acuerdo.", "justificacion": "Incorrecta. El mediador no puede validar la renuncia de un derecho irrenunciable."}], "correcta": 0, "referencias": ["LAM", "CONA"]}, {"id": "Q5-01", "area": 5, "dificultad": 4, "subarea": "Laboral", "tema": "Despido ineficaz", "resultado": "Aplica la protección reforzada frente al despido de la trabajadora embarazada.", "demanda": "Aplicar", "enunciado": "Una trabajadora es despedida intempestivamente al comunicar su embarazo. Según el Código del Trabajo:", "opciones": [{"texto": "El despido es ineficaz y procede su reintegro.", "justificacion": "Correcta. El art. 195.1 CT y siguientes regulan el despido ineficaz de mujeres embarazadas o asociadas a su condición de gestación o maternidad, y de dirigentes sindicales; si la trabajadora decide no reintegrarse, la ley prevé una indemnización adicional."}, {"texto": "Solo tiene derecho a la indemnización por despido intempestivo.", "justificacion": "Incorrecta. La ley le otorga una protección reforzada adicional."}, {"texto": "El despido es válido si el empleador paga el desahucio.", "justificacion": "Incorrecta. El desahucio no convalida un despido discriminatorio."}, {"texto": "Debe presentar primero una acción de protección.", "justificacion": "Incorrecta. Existe una acción laboral específica y especial."}], "correcta": 0, "referencias": ["CT", "CRE"]}, {"id": "Q5-02", "area": 5, "dificultad": 4, "subarea": "Laboral", "tema": "Tercerización e intermediación", "resultado": "Identifica las prohibiciones constitucionales en materia laboral.", "demanda": "Evaluar", "enunciado": "Una empresa contrata, a través de otra compañía, al personal que realiza sus actividades propias y habituales para no tenerlo en su nómina. Según la Constitución:", "opciones": [{"texto": "Está prohibida por la Constitución.", "justificacion": "Correcta. Así lo dispone el art. 327 CRE."}, {"texto": "Es válida si los trabajadores firman su consentimiento.", "justificacion": "Incorrecta. Los derechos laborales son irrenunciables (art. 326 num. 2 CRE)."}, {"texto": "Es válida si la intermediaria afilia al personal al seguro social.", "justificacion": "Incorrecta. La afiliación no levanta la prohibición."}, {"texto": "Solo está prohibida en el sector público.", "justificacion": "Incorrecta. La prohibición es general."}], "correcta": 0, "referencias": ["CRE", "CT"]}, {"id": "Q5-03", "area": 5, "dificultad": 5, "subarea": "Laboral", "tema": "Jubilación patronal proporcional", "resultado": "Aplica los derechos por tiempo de servicio en caso de despido intempestivo.", "demanda": "Analizar", "enunciado": "Un trabajador con veintidós años de servicio continuo para el mismo empleador es despedido intempestivamente. Además de la indemnización por despido, ¿qué le corresponde según el Código del Trabajo?", "opciones": [{"texto": "La parte proporcional de la jubilación patronal.", "justificacion": "Correcta. El art. 188 CT reconoce este derecho; la jubilación patronal completa (art. 216 CT) exige veinticinco años o más de servicio."}, {"texto": "La jubilación patronal completa, por superar veinte años.", "justificacion": "Incorrecta. La completa requiere veinticinco años de servicio."}, {"texto": "Nada adicional, porque no cumplió veinticinco años.", "justificacion": "Incorrecta. La ley prevé el derecho proporcional desde los veinte años."}, {"texto": "Solo la bonificación por desahucio.", "justificacion": "Incorrecta. El desahucio es una figura distinta (art. 185 CT)."}], "correcta": 0, "referencias": ["CT"]}, {"id": "Q5-04", "area": 5, "dificultad": 5, "subarea": "Tributario", "tema": "Responsabilidad del adquirente", "resultado": "Aplica la responsabilidad tributaria de los adquirentes de empresas.", "demanda": "Analizar", "enunciado": "Una persona compra un negocio en marcha. El anterior propietario adeudaba tributos. Según el Código Orgánico Tributario, el adquirente:", "opciones": [{"texto": "Responde por el año en curso y los dos anteriores, hasta lo adquirido.", "justificacion": "Correcta. El art. 28 del Código Orgánico Tributario establece esta responsabilidad de los adquirentes y sucesores."}, {"texto": "No responde, porque la deuda es personal del vendedor.", "justificacion": "Incorrecta. La ley lo hace responsable en ese alcance."}, {"texto": "Responde ilimitadamente por todas las deudas históricas.", "justificacion": "Incorrecta. La responsabilidad tiene límites temporales y de valor."}, {"texto": "Responde solo si el contrato de compraventa así lo pacta.", "justificacion": "Incorrecta. La responsabilidad nace de la ley, no del contrato."}], "correcta": 0, "referencias": ["CTRIB"]}, {"id": "Q5-05", "area": 5, "dificultad": 4, "subarea": "Internacional Privado", "tema": "Homologación de sentencias extranjeras", "resultado": "Evalúa los requisitos de homologación de sentencias extranjeras.", "demanda": "Evaluar", "enunciado": "Se pide homologar en el Ecuador una sentencia extranjera de condena dictada sin que el demandado haya sido citado. ¿Qué debe resolver la Corte Provincial?", "opciones": [{"texto": "Negar la homologación por falta de citación.", "justificacion": "Correcta. El art. 104 COGEP exige, entre otros requisitos, la citación legal y el respeto al debido proceso, en concordancia con el art. 76 CRE."}, {"texto": "Homologarla, por estar ejecutoriada en su país.", "justificacion": "Incorrecta. La ejecutoria no suple la falta de citación."}, {"texto": "Homologarla, siempre que esté debidamente apostillada.", "justificacion": "Incorrecta. La apostilla acredita autenticidad, no el debido proceso."}, {"texto": "Remitirla a la Corte Nacional de Justicia.", "justificacion": "Incorrecta. Es competente la Corte Provincial (art. 102 COGEP)."}], "correcta": 0, "referencias": ["COGEP", "CRE"]}]}, {"id": "pack-003", "bibliografia": {"COFJ": "Asamblea Nacional del Ecuador. (2009). Código Orgánico de la Función Judicial. Registro Oficial Suplemento 544, 9 de marzo de 2009. Reformado, entre otras, por la Ley Orgánica Reformatoria de Varios Cuerpos Legales para la Agilización de la Adopción (R.O. 347, 14 de agosto de 2026). https://www.funcionjudicial.gob.ec/", "COGEP": "Asamblea Nacional del Ecuador. (2015). Código Orgánico General de Procesos. Registro Oficial Suplemento 506, 22 de mayo de 2015. Reformado, entre otras, por la Ley Orgánica Reformatoria del COGEP (R.O. Suplemento 517, 26 de junio de 2019); última reforma consultada: Cuarto Suplemento del R.O. 140, 7 de octubre de 2025. https://portal.compraspublicas.gob.ec/sercop/wp-content/uploads/2025/11/CODIGO-ORGANICO-GENERAL-DE-PROCESOS-COGEP.pdf", "CRE": "Asamblea Constituyente del Ecuador. (2008). Constitución de la República del Ecuador. Registro Oficial 449, 20 de octubre de 2008 (con las enmiendas posteriores, incluidas las aprobadas en el referéndum de 2024). https://www.asambleanacional.gob.ec/"}, "preguntas": [{"id": "DPG-01", "area": 3, "dificultad": 1, "subarea": "Derecho Procesal General", "tema": "Finalidad del proceso", "resultado": "Identifica la finalidad del proceso judicial.", "demanda": "Comprender", "enunciado": "En un sistema procesal civil moderno, la finalidad del proceso es principalmente:", "opciones": [{"texto": "Resolver un conflicto con una decisión obligatoria.", "justificacion": "Correcta. El proceso es el instrumento de la función jurisdiccional para resolver controversias con decisiones vinculantes; el COGEP regula su actividad procesal (art. 1) y el art. 169 de la Constitución lo concibe como medio para la realización de la justicia."}, {"texto": "Sustituir la negociación privada por sanciones penales.", "justificacion": "Incorrecta. El proceso civil no impone sanciones penales y no excluye los acuerdos entre las partes."}, {"texto": "Impedir que las partes lleguen a acuerdos entre sí.", "justificacion": "Incorrecta. El COGEP promueve la conciliación y la transacción dentro del proceso (arts. 233 y 235 COGEP)."}, {"texto": "Garantizar que siempre exista una doble instancia.", "justificacion": "Incorrecta. La doble instancia es una garantía de recurrir, no la finalidad del proceso."}], "correcta": 0, "referencias": ["COGEP", "CRE"]}, {"id": "DPG-02", "area": 3, "dificultad": 1, "subarea": "Derecho Procesal General", "tema": "Jurisdicción", "resultado": "Define la jurisdicción en sentido procesal.", "demanda": "Recordar", "enunciado": "La jurisdicción, en sentido procesal, se entiende como:", "opciones": [{"texto": "La potestad estatal de administrar justicia en casos concretos.", "justificacion": "Correcta. Es la potestad pública de juzgar y hacer ejecutar lo juzgado, que emana del pueblo y se ejerce por los órganos de la Función Judicial (art. 167 CRE)."}, {"texto": "La propiedad del juez sobre el expediente y los documentos que tramita.", "justificacion": "Incorrecta. El juez dirige el proceso (art. 3 COGEP), pero no es dueño del expediente."}, {"texto": "La facultad de las partes de escoger la ley aplicable.", "justificacion": "Incorrecta. La elección de ley es un tema de derecho internacional privado, no la jurisdicción."}, {"texto": "El derecho del abogado a intervenir en las audiencias de su cliente.", "justificacion": "Incorrecta. Se refiere al patrocinio, no a la potestad de juzgar."}], "correcta": 0, "referencias": ["CRE", "COGEP"]}, {"id": "DPG-03", "area": 3, "dificultad": 2, "subarea": "Derecho Procesal General", "tema": "Jurisdicción y competencia", "resultado": "Distingue jurisdicción y competencia.", "demanda": "Comprender", "enunciado": "La competencia se diferencia de la jurisdicción porque la competencia:", "opciones": [{"texto": "Distribuye los asuntos entre órganos judiciales concretos.", "justificacion": "Correcta. La competencia es la medida dentro de la cual se distribuye la potestad jurisdiccional entre juzgadores, en razón de materia, territorio, personas y grados."}, {"texto": "Crea en abstracto la potestad del poder judicial de administrar justicia.", "justificacion": "Incorrecta. Esa es la jurisdicción, que es previa y general."}, {"texto": "Equivale a la legitimación en la causa de las partes del proceso.", "justificacion": "Incorrecta. La legitimación se refiere a las partes, no al órgano judicial."}, {"texto": "Se limita exclusivamente a la fase de ejecución.", "justificacion": "Incorrecta. La competencia rige todo el proceso, no solo la ejecución."}], "correcta": 0, "referencias": ["COGEP"]}, {"id": "DPG-04", "area": 3, "dificultad": 2, "subarea": "Derecho Procesal General", "tema": "Presupuestos procesales", "resultado": "Identifica la noción de presupuestos procesales.", "demanda": "Comprender", "enunciado": "Un presupuesto procesal se refiere, de manera general, a:", "opciones": [{"texto": "Las condiciones mínimas para que el proceso sea válido.", "justificacion": "Correcta. Son requisitos como la competencia, la capacidad procesal y la demanda en forma, sin los cuales el proceso no puede constituirse válidamente; su falta se alega, entre otras vías, por excepciones previas (art. 153 COGEP)."}, {"texto": "Los requisitos para que la sentencia favorezca al actor.", "justificacion": "Incorrecta. Eso corresponde a los presupuestos materiales o de fondo de la pretensión."}, {"texto": "Los hechos que deben probarse en toda causa.", "justificacion": "Incorrecta. Los hechos a probar dependen de la controversia (art. 158 COGEP)."}, {"texto": "Los criterios con los que se valora la prueba.", "justificacion": "Incorrecta. La valoración se rige por las reglas de la sana crítica (art. 164 COGEP)."}], "correcta": 0, "referencias": ["COGEP"]}, {"id": "DPG-05", "area": 3, "dificultad": 2, "subarea": "Derecho Procesal General", "tema": "Legitimación en la causa", "resultado": "Distingue la legitimación en la causa de otras figuras.", "demanda": "Comprender", "enunciado": "La legitimación en la causa se relaciona con:", "opciones": [{"texto": "El vínculo de las partes con la relación jurídica discutida.", "justificacion": "Correcta. Determina si quien demanda y quien es demandado son los sujetos de la relación sustancial; su falta es excepción previa (art. 153 num. 3 COGEP)."}, {"texto": "La capacidad económica de las partes para litigar.", "justificacion": "Incorrecta. La capacidad económica no condiciona la legitimación."}, {"texto": "La nacionalidad de los litigantes en el proceso.", "justificacion": "Incorrecta. La nacionalidad no define la legitimación."}, {"texto": "La existencia de prueba documental previa a la demanda.", "justificacion": "Incorrecta. La prueba se refiere al fondo, no a la legitimación."}], "correcta": 0, "referencias": ["COGEP"]}, {"id": "DPG-06", "area": 3, "dificultad": 1, "subarea": "Derecho Procesal General", "tema": "Capacidad procesal", "resultado": "Identifica la capacidad procesal.", "demanda": "Recordar", "enunciado": "La capacidad procesal de una parte alude a:", "opciones": [{"texto": "Su aptitud para actuar en el proceso, por sí o representada.", "justificacion": "Correcta. Tiene capacidad procesal quien puede comparecer por sí mismo; los incapaces lo hacen por medio de sus representantes (art. 31 COGEP)."}, {"texto": "La preparación técnica de su abogado defensor.", "justificacion": "Incorrecta. La pericia del abogado no es la capacidad procesal de la parte."}, {"texto": "El número de recursos que puede interponer.", "justificacion": "Incorrecta. Los recursos dependen de la ley (art. 251 COGEP), no de la capacidad."}, {"texto": "La posibilidad de elegir libremente el tribunal que conocerá su causa.", "justificacion": "Incorrecta. La competencia la fija la ley, no la parte."}], "correcta": 0, "referencias": ["COGEP"]}, {"id": "DPG-07", "area": 3, "dificultad": 1, "subarea": "Derecho Procesal General", "tema": "Procuración judicial", "resultado": "Comprende la función de la representación judicial.", "demanda": "Comprender", "enunciado": "La representación judicial cumple la función de:", "opciones": [{"texto": "Permitir que una persona actúe por medio de otra habilitada.", "justificacion": "Correcta. La procuración judicial permite comparecer por medio de un procurador con poder suficiente (arts. 41 a 45 COGEP)."}, {"texto": "Asegurar que el juez represente los intereses públicos.", "justificacion": "Incorrecta. El juez es imparcial y no representa a nadie."}, {"texto": "Sustituir la prueba por las declaraciones del representante.", "justificacion": "Incorrecta. La representación no reemplaza la prueba."}, {"texto": "Eliminar la necesidad de notificar a las partes.", "justificacion": "Incorrecta. Las notificaciones siguen siendo obligatorias (art. 65 COGEP)."}], "correcta": 0, "referencias": ["COGEP"]}, {"id": "DPG-08", "area": 3, "dificultad": 1, "subarea": "Derecho Procesal General", "tema": "Citación", "resultado": "Identifica el objeto de la citación.", "demanda": "Recordar", "enunciado": "La citación tiene por objeto esencial:", "opciones": [{"texto": "Hacer conocer al demandado la demanda y lo que se pretende.", "justificacion": "Correcta. La citación es el acto por el cual se hace conocer a la persona demandada el contenido de la demanda o de la petición de una diligencia preparatoria (art. 53 COGEP)."}, {"texto": "Adelantar la ejecución de la sentencia que se dicte.", "justificacion": "Incorrecta. La ejecución solo procede tras una decisión ejecutoriada."}, {"texto": "Garantizar la inmediación del juez en la práctica de la prueba anunciada.", "justificacion": "Incorrecta. La inmediación se garantiza en la audiencia, no con la citación."}, {"texto": "Convertir el proceso en confidencial para terceros.", "justificacion": "Incorrecta. Rige la publicidad, salvo excepciones legales."}], "correcta": 0, "referencias": ["COGEP"]}, {"id": "DPG-09", "area": 3, "dificultad": 1, "subarea": "Derecho Procesal General", "tema": "Debido proceso", "resultado": "Identifica elementos del debido proceso.", "demanda": "Comprender", "enunciado": "El derecho al debido proceso exige, entre otros elementos, que:", "opciones": [{"texto": "Las partes puedan ser oídas y contradecir en igualdad.", "justificacion": "Correcta. El art. 76 CRE garantiza el derecho a la defensa, a ser escuchado en el momento oportuno y en igualdad de condiciones, y a contradecir las pruebas."}, {"texto": "La sentencia sea siempre absolutoria del demandado, por presunción de inocencia.", "justificacion": "Incorrecta. El debido proceso no garantiza un resultado."}, {"texto": "El juez pueda asesorar a una de las partes.", "justificacion": "Incorrecta. Vulneraría la imparcialidad del juzgador."}, {"texto": "Se prohíba toda audiencia oral en el proceso.", "justificacion": "Incorrecta. La Constitución adopta el sistema oral (art. 168 num. 6 CRE)."}], "correcta": 0, "referencias": ["CRE"]}, {"id": "DPG-10", "area": 3, "dificultad": 1, "subarea": "Derecho Procesal General", "tema": "Principio dispositivo", "resultado": "Aplica el principio dispositivo.", "demanda": "Comprender", "enunciado": "El principio dispositivo se manifiesta cuando:", "opciones": [{"texto": "Las partes deciden el inicio y el objeto del litigio.", "justificacion": "Correcta. Corresponde a las partes el impulso del proceso conforme al sistema dispositivo (art. 5 COGEP; art. 168 num. 6 CRE)."}, {"texto": "El juez impulsa de oficio cualquier pretensión.", "justificacion": "Incorrecta. Describe el sistema inquisitivo."}, {"texto": "La prueba la practica únicamente el juez.", "justificacion": "Incorrecta. La prueba la aportan principalmente las partes; la de oficio es excepcional."}, {"texto": "La sentencia se dicta sin que exista demanda.", "justificacion": "Incorrecta. Sin demanda no hay proceso civil."}], "correcta": 0, "referencias": ["COGEP", "CRE"]}, {"id": "DPG-11", "area": 3, "dificultad": 2, "subarea": "Derecho Procesal General", "tema": "Principio de contradicción", "resultado": "Identifica vulneraciones del principio de contradicción.", "demanda": "Analizar", "enunciado": "El principio de contradicción se vulnera típicamente si:", "opciones": [{"texto": "Se decide con un argumento que la parte no pudo rebatir.", "justificacion": "Correcta. La contradicción exige que cada parte conozca y pueda controvertir los argumentos y pruebas de la otra (art. 76 num. 7 lit. h CRE)."}, {"texto": "Se concede un plazo razonable para contestar la demanda.", "justificacion": "Incorrecta. Conceder plazo garantiza la contradicción."}, {"texto": "Se realiza la audiencia con presencia de ambas partes.", "justificacion": "Incorrecta. La presencia de las partes favorece la contradicción."}, {"texto": "Se permite impugnar la decisión del juzgador.", "justificacion": "Incorrecta. La impugnación es una garantía, no una vulneración."}], "correcta": 0, "referencias": ["CRE"]}, {"id": "DPG-12", "area": 3, "dificultad": 1, "subarea": "Derecho Procesal General", "tema": "Igualdad procesal", "resultado": "Comprende el alcance de la igualdad procesal.", "demanda": "Comprender", "enunciado": "La igualdad procesal supone, en términos prácticos, que:", "opciones": [{"texto": "Ninguna parte reciba ventajas indebidas en el proceso.", "justificacion": "Correcta. Las partes deben actuar en igualdad de condiciones (art. 76 num. 7 lit. c CRE; art. 11 num. 2 CRE)."}, {"texto": "El actor tenga siempre la última palabra en audiencia.", "justificacion": "Incorrecta. Rompería el equilibrio entre las partes."}, {"texto": "El demandado pueda evitar comparecer sin consecuencias.", "justificacion": "Incorrecta. La inasistencia tiene efectos procesales (art. 87 COGEP)."}, {"texto": "El juez deba preferir la prueba de la parte más débil.", "justificacion": "Incorrecta. La prueba se valora en conjunto, con sana crítica (art. 164 COGEP)."}], "correcta": 0, "referencias": ["CRE", "COGEP"]}, {"id": "DPG-13", "area": 3, "dificultad": 1, "subarea": "Derecho Procesal General", "tema": "Buena fe procesal", "resultado": "Identifica deberes derivados de la buena fe procesal.", "demanda": "Comprender", "enunciado": "La buena fe procesal implica que las partes deben:", "opciones": [{"texto": "Actuar sin maniobras dilatorias ni abuso de las formas.", "justificacion": "Correcta. Las partes deben actuar con buena fe y lealtad procesal, y el juzgador debe sancionar el abuso del derecho y las maniobras dilatorias (art. 26 del Código Orgánico de la Función Judicial)."}, {"texto": "Renunciar a toda impugnación de las decisiones.", "justificacion": "Incorrecta. Impugnar es un derecho, no una falta de buena fe."}, {"texto": "Aceptar siempre la pretensión de la parte contraria para evitar el litigio.", "justificacion": "Incorrecta. La buena fe no obliga a allanarse."}, {"texto": "Limitar su defensa a una sola intervención.", "justificacion": "Incorrecta. La buena fe no restringe el derecho a la defensa."}], "correcta": 0, "referencias": ["COFJ"]}, {"id": "DPG-14", "area": 3, "dificultad": 1, "subarea": "Derecho Procesal General", "tema": "Carga de la prueba", "resultado": "Aplica la regla general de la carga de la prueba.", "demanda": "Comprender", "enunciado": "La carga de la prueba, como regla general, corresponde a:", "opciones": [{"texto": "Quien afirma los hechos que sustentan su pretensión.", "justificacion": "Correcta. La parte actora prueba los hechos que propuso afirmativamente y que fueron negados (art. 169 COGEP)."}, {"texto": "El juez, por su deber de investigar de oficio todos los hechos.", "justificacion": "Incorrecta. La prueba de oficio es excepcional (art. 168 COGEP)."}, {"texto": "El perito, por su función técnica en el proceso.", "justificacion": "Incorrecta. El perito auxilia al juez, no soporta la carga."}, {"texto": "El secretario, por la custodia del expediente.", "justificacion": "Incorrecta. El secretario no es parte procesal."}], "correcta": 0, "referencias": ["COGEP"]}, {"id": "DPG-15", "area": 3, "dificultad": 1, "subarea": "Derecho Procesal General", "tema": "Pertinencia de la prueba", "resultado": "Identifica la prueba pertinente.", "demanda": "Comprender", "enunciado": "La prueba pertinente es aquella que:", "opciones": [{"texto": "Se refiere a los hechos controvertidos del proceso.", "justificacion": "Correcta. Es pertinente la prueba que se refiere directa o indirectamente a los hechos o circunstancias controvertidos (arts. 160 y 161 COGEP)."}, {"texto": "Proviene exclusivamente de documentos públicos o notariales.", "justificacion": "Incorrecta. Rige la libertad probatoria; no solo hay prueba documental pública."}, {"texto": "Requiere siempre la intervención de un perito.", "justificacion": "Incorrecta. El peritaje solo es necesario si se requieren conocimientos técnicos."}, {"texto": "Se practica únicamente en la fase de ejecución.", "justificacion": "Incorrecta. La prueba se practica en la audiencia de juicio o única."}], "correcta": 0, "referencias": ["COGEP"]}, {"id": "DPG-16", "area": 3, "dificultad": 1, "subarea": "Derecho Procesal General", "tema": "Utilidad de la prueba", "resultado": "Identifica la prueba útil.", "demanda": "Comprender", "enunciado": "La prueba útil se caracteriza porque:", "opciones": [{"texto": "Aporta información relevante y no redundante.", "justificacion": "Correcta. La admisibilidad exige pertinencia, utilidad y conducencia (art. 160 COGEP); la prueba superabundante puede rechazarse."}, {"texto": "Garantiza por sí sola una sentencia favorable.", "justificacion": "Incorrecta. Ninguna prueba asegura el resultado."}, {"texto": "Hace innecesaria la realización de audiencias.", "justificacion": "Incorrecta. La prueba se practica en audiencia."}, {"texto": "Elimina la posibilidad de contradicción.", "justificacion": "Incorrecta. Toda prueba está sujeta a contradicción."}], "correcta": 0, "referencias": ["COGEP"]}, {"id": "DPG-17", "area": 3, "dificultad": 1, "subarea": "Derecho Procesal General", "tema": "Licitud de la prueba", "resultado": "Aplica la regla de exclusión de la prueba ilícita.", "demanda": "Comprender", "enunciado": "La prueba lícita exige que:", "opciones": [{"texto": "Se obtenga y practique sin vulnerar derechos ni la ley.", "justificacion": "Correcta. Las pruebas obtenidas o actuadas con violación de la Constitución o la ley no tienen validez alguna (art. 76 num. 4 CRE; art. 160 COGEP)."}, {"texto": "Se presente únicamente en soporte digital.", "justificacion": "Incorrecta. El soporte no determina la licitud."}, {"texto": "Sea siempre de naturaleza testimonial.", "justificacion": "Incorrecta. Todos los medios de prueba pueden ser lícitos."}, {"texto": "Se produzca antes de presentar la demanda.", "justificacion": "Incorrecta. La licitud no depende del momento de obtención."}], "correcta": 0, "referencias": ["CRE", "COGEP"]}, {"id": "DPG-18", "area": 3, "dificultad": 2, "subarea": "Derecho Procesal General", "tema": "Valoración de la prueba", "resultado": "Comprende la valoración racional de la prueba.", "demanda": "Comprender", "enunciado": "La valoración probatoria racional supone que el juez:", "opciones": [{"texto": "Explique por qué da credibilidad y peso a cada prueba.", "justificacion": "Correcta. La prueba se aprecia en conjunto, de acuerdo con las reglas de la sana crítica, y el juzgador debe expresar la valoración de toda la prueba producida (art. 164 COGEP)."}, {"texto": "Aplique una tarifa legal fija que asigna un valor a cada tipo de prueba.", "justificacion": "Incorrecta. La tarifa legal es la excepción; rige la sana crítica."}, {"texto": "Decida por intuición, sin necesidad de motivar.", "justificacion": "Incorrecta. La motivación es obligatoria (art. 76 num. 7 lit. l CRE)."}, {"texto": "Excluya por regla general la prueba testimonial.", "justificacion": "Incorrecta. El testimonio es un medio de prueba válido (art. 174 COGEP)."}], "correcta": 0, "referencias": ["COGEP", "CRE"]}, {"id": "DPG-19", "area": 3, "dificultad": 1, "subarea": "Derecho Procesal General", "tema": "Motivación", "resultado": "Identifica la finalidad de la motivación.", "demanda": "Comprender", "enunciado": "La motivación de las decisiones judiciales cumple, entre otras, la finalidad de:", "opciones": [{"texto": "Permitir comprender y controlar la decisión.", "justificacion": "Correcta. Las resoluciones deben enunciar las normas y explicar su pertinencia a los hechos (art. 76 num. 7 lit. l CRE; art. 89 COGEP), lo que permite su control por las partes y por los tribunales superiores."}, {"texto": "Garantizar que no existan recursos contra ella.", "justificacion": "Incorrecta. La m
