 las partes.", "justificacion": "Incorrecta. La reserva no tiene relación con la inmediación."}], "correcta": 0, "referencias": ["COGEP"]}, {"id": "DPG-34", "area": 3, "dificultad": 1, "subarea": "Derecho Procesal General", "tema": "Concentración", "resultado": "Identifica el principio de concentración.", "demanda": "Comprender", "enunciado": "El principio de concentración busca:", "opciones": [{"texto": "Reunir las actuaciones en el menor número de actos.", "justificacion": "Correcta. Es uno de los principios del sistema oral (art. 168 num. 6 CRE)."}, {"texto": "Multiplicar los incidentes para mayor detalle.", "justificacion": "Incorrecta. Es contrario a la concentración."}, {"texto": "Evitar que el juez conozca la prueba.", "justificacion": "Incorrecta. Vulneraría la inmediación."}, {"texto": "Sustituir audiencias por escritos extensos.", "justificacion": "Incorrecta. Contradice el sistema oral."}], "correcta": 0, "referencias": ["CRE"]}, {"id": "DPG-35", "area": 3, "dificultad": 1, "subarea": "Derecho Procesal General", "tema": "Publicidad", "resultado": "Comprende el principio de publicidad procesal.", "demanda": "Comprender", "enunciado": "La publicidad procesal, como regla, persigue:", "opciones": [{"texto": "Control social y transparencia, salvo excepciones legales.", "justificacion": "Correcta. Los juicios y sus decisiones son públicos, salvo los casos expresamente señalados por la ley (art. 168 num. 5 CRE; art. 83 COGEP)."}, {"texto": "Impedir el acceso de las partes al expediente para proteger su intimidad.", "justificacion": "Incorrecta. Las partes siempre tienen acceso."}, {"texto": "Eliminar la contradicción entre las partes.", "justificacion": "Incorrecta. La publicidad no la elimina."}, {"texto": "Hacer obligatorio el arbitraje en la causa.", "justificacion": "Incorrecta. No guarda relación."}], "correcta": 0, "referencias": ["CRE", "COGEP"]}, {"id": "DPG-36", "area": 3, "dificultad": 1, "subarea": "Derecho Procesal General", "tema": "Notificación", "resultado": "Identifica la función de la notificación.", "demanda": "Recordar", "enunciado": "La notificación válida cumple la función de:", "opciones": [{"texto": "Hacer conocer oportunamente los actos procesales.", "justificacion": "Correcta. La notificación es el acto por el cual se pone en conocimiento de las partes y demás interesados las providencias judiciales (art. 65 COGEP)."}, {"texto": "Garantizar la práctica de la prueba pericial solicitada por las partes.", "justificacion": "Incorrecta. No guarda relación con la pericia."}, {"texto": "Sustituir la contestación a la demanda.", "justificacion": "Incorrecta. La contestación es un acto de parte."}, {"texto": "Evitar que el juez deba motivar.", "justificacion": "Incorrecta. La motivación es obligatoria."}], "correcta": 0, "referencias": ["COGEP"]}, {"id": "DPG-37", "area": 3, "dificultad": 2, "subarea": "Derecho Procesal General", "tema": "Ineficacia de los actos procesales", "resultado": "Identifica la ineficacia de los actos procesales.", "demanda": "Comprender", "enunciado": "Un acto procesal es ineficaz cuando:", "opciones": [{"texto": "No produce efectos por omitir requisitos esenciales.", "justificacion": "Correcta. La omisión de solemnidades sustanciales priva al acto de eficacia y puede acarrear nulidad (art. 107 COGEP)."}, {"texto": "Se practica de forma oral en una audiencia y no se reduce a escrito.", "justificacion": "Incorrecta. La oralidad es la regla."}, {"texto": "Se realiza con la intervención de un abogado.", "justificacion": "Incorrecta. El patrocinio no lo invalida."}, {"texto": "Se incorpora formalmente al expediente.", "justificacion": "Incorrecta. La incorporación no lo vuelve ineficaz."}], "correcta": 0, "referencias": ["COGEP"]}, {"id": "DPG-38", "area": 3, "dificultad": 1, "subarea": "Derecho Procesal General", "tema": "Prueba testimonial", "resultado": "Identifica los estándares de la prueba testimonial.", "demanda": "Comprender", "enunciado": "La prueba testimonial exige, como estándar mínimo, que:", "opciones": [{"texto": "Se practique con preguntas y contradicción.", "justificacion": "Correcta. El testimonio se practica en audiencia mediante interrogatorio y contrainterrogatorio (arts. 174 y 178 COGEP)."}, {"texto": "Sea siempre escrita y sin audiencia.", "justificacion": "Incorrecta. Se practica oralmente en audiencia."}, {"texto": "Se sustituya por informes policiales.", "justificacion": "Incorrecta. Un informe no reemplaza el testimonio."}, {"texto": "Se limite a familiares de las partes.", "justificacion": "Incorrecta. Puede declarar cualquier persona hábil."}], "correcta": 0, "referencias": ["COGEP"]}, {"id": "DPG-39", "area": 3, "dificultad": 1, "subarea": "Derecho Procesal General", "tema": "Contrainterrogatorio", "resultado": "Identifica el objetivo del contrainterrogatorio.", "demanda": "Comprender", "enunciado": "El contrainterrogatorio tiene como objetivo principal:", "opciones": [{"texto": "Cuestionar la credibilidad del testimonio adverso.", "justificacion": "Correcta. Lo realiza la parte contraria para controvertir la versión del testigo (art. 178 COGEP)."}, {"texto": "Sustituir el alegato final de la parte que propuso al testigo.", "justificacion": "Incorrecta. El alegato es un acto distinto."}, {"texto": "Evitar la inmediación del juzgador.", "justificacion": "Incorrecta. El contrainterrogatorio se hace ante el juez."}, {"texto": "Impulsar la reconvención del demandado.", "justificacion": "Incorrecta. No guarda relación."}], "correcta": 0, "referencias": ["COGEP"]}, {"id": "DPG-40", "area": 3, "dificultad": 1, "subarea": "Derecho Procesal General", "tema": "Prueba pericial", "resultado": "Identifica cuándo procede la prueba pericial.", "demanda": "Comprender", "enunciado": "La pericia se utiliza cuando:", "opciones": [{"texto": "Se requieren conocimientos técnicos para esclarecer hechos.", "justificacion": "Correcta. El perito es la persona natural o jurídica que, por sus conocimientos especializados, informa al juzgador sobre hechos técnicos (art. 221 COGEP)."}, {"texto": "Basta la simple afirmación de una de las partes.", "justificacion": "Incorrecta. La afirmación debe probarse."}, {"texto": "Solo existen documentos públicos en el proceso.", "justificacion": "Incorrecta. No es el criterio de la pericia."}, {"texto": "El juez debe delegar en un experto la decisión de fondo de la causa.", "justificacion": "Incorrecta. El juez no delega su decisión."}], "correcta": 0, "referencias": ["COGEP"]}, {"id": "DPG-41", "area": 3, "dificultad": 1, "subarea": "Derecho Procesal General", "tema": "Inspección judicial", "resultado": "Identifica la procedencia de la inspección judicial.", "demanda": "Comprender", "enunciado": "La inspección judicial es adecuada cuando:", "opciones": [{"texto": "La percepción directa del juez ayuda a esclarecer hechos.", "justificacion": "Correcta. El juzgador puede examinar directamente lugares, cosas o documentos (arts. 228 a 232 COGEP)."}, {"texto": "Se pretende reemplazar con ella toda otra prueba anunciada por las partes.", "justificacion": "Incorrecta. Es un medio más de prueba."}, {"texto": "No existe ninguna controversia sobre los hechos.", "justificacion": "Incorrecta. Sin controversia no hace falta prueba."}, {"texto": "Se busca cambiar la competencia del juez.", "justificacion": "Incorrecta. No guarda relación."}], "correcta": 0, "referencias": ["COGEP"]}, {"id": "DPG-42", "area": 3, "dificultad": 1, "subarea": "Derecho Procesal General", "tema": "Providencias preventivas", "resultado": "Identifica la finalidad de las providencias preventivas.", "demanda": "Comprender", "enunciado": "Una medida cautelar o providencia preventiva busca, en general:", "opciones": [{"texto": "Asegurar la eficacia de una eventual decisión final.", "justificacion": "Correcta. Las providencias preventivas, como el secuestro o la retención, aseguran el cumplimiento de lo que se resuelva (art. 124 COGEP)."}, {"texto": "Sancionar anticipadamente al demandado.", "justificacion": "Incorrecta. No son sanciones."}, {"texto": "Resolver de inmediato el fondo del litigio.", "justificacion": "Incorrecta. Son provisionales y accesorias."}, {"texto": "Eliminar el derecho de defensa del demandado.", "justificacion": "Incorrecta. No afectan el derecho de defensa."}], "correcta": 0, "referencias": ["COGEP"]}, {"id": "DPG-43", "area": 3, "dificultad": 2, "subarea": "Derecho Procesal General", "tema": "Apariencia de buen derecho", "resultado": "Comprende los requisitos de las providencias preventivas.", "demanda": "Analizar", "enunciado": "El requisito de apariencia de buen derecho se relaciona con:", "opciones": [{"texto": "La verosimilitud inicial de lo que se pretende.", "justificacion": "Correcta. Para ordenar una providencia preventiva se exige, entre otros requisitos, que se pruebe la existencia del crédito (art. 125 COGEP), es decir, una apariencia razonable del derecho."}, {"texto": "La certeza absoluta que el juez debe tener sobre el fondo del litigio.", "justificacion": "Incorrecta. La certeza se alcanza en sentencia."}, {"texto": "La existencia obligatoria de una confesión.", "justificacion": "Incorrecta. No es requisito."}, {"texto": "La renuncia del demandado a defenderse.", "justificacion": "Incorrecta. No guarda relación."}], "correcta": 0, "referencias": ["COGEP"]}, {"id": "DPG-44", "area": 3, "dificultad": 2, "subarea": "Derecho Procesal General", "tema": "Peligro en la demora", "resultado": "Comprende los requisitos de las providencias preventivas.", "demanda": "Analizar", "enunciado": "El peligro en la demora se configura cuando:", "opciones": [{"texto": "La espera puede frustrar la tutela o causar un daño grave.", "justificacion": "Correcta. Se exige probar que los bienes del deudor se encuentran en tal estado que no alcancen a cubrir la deuda o que puedan desaparecer u ocultarse (art. 125 COGEP)."}, {"texto": "El demandado comparece oportunamente al proceso y contesta la demanda.", "justificacion": "Incorrecta. La comparecencia no genera peligro."}, {"texto": "Existen varios abogados patrocinando a una parte.", "justificacion": "Incorrecta. No guarda relación."}, {"texto": "El juez convoca a la audiencia preliminar.", "justificacion": "Incorrecta. No guarda relación."}], "correcta": 0, "referencias": ["COGEP"]}, {"id": "DPG-45", "area": 3, "dificultad": 1, "subarea": "Derecho Procesal General", "tema": "Desistimiento", "resultado": "Identifica los efectos del desistimiento.", "demanda": "Recordar", "enunciado": "El desistimiento de la demanda implica, en general:", "opciones": [{"texto": "Que el actor abandona su pretensión en el proceso.", "justificacion": "Correcta. Quien desiste de la pretensión no puede volver a proponerla contra la misma persona (art. 237 COGEP)."}, {"texto": "Una sentencia definitiva favorable al actor.", "justificacion": "Incorrecta. Es lo opuesto."}, {"texto": "La imposición de responsabilidad penal al actor por haber demandado.", "justificacion": "Incorrecta. No tiene efectos penales."}, {"texto": "La nulidad de todo lo actuado por el juez.", "justificacion": "Incorrecta. No es una nulidad."}], "correcta": 0, "referencias": ["COGEP"]}, {"id": "DPG-46", "area": 3, "dificultad": 1, "subarea": "Derecho Procesal General", "tema": "Transacción", "resultado": "Identifica la transacción como forma de terminación.", "demanda": "Recordar", "enunciado": "La transacción, como forma de terminación del proceso, supone:", "opciones": [{"texto": "Un acuerdo con concesiones recíprocas de las partes.", "justificacion": "Correcta. Las partes terminan el litigio mediante concesiones mutuas; el juez la autoriza si es válida (art. 235 COGEP)."}, {"texto": "Una sentencia impuesta por el juzgador.", "justificacion": "Incorrecta. Es un acuerdo, no una imposición."}, {"texto": "Una declaración unilateral del demandado.", "justificacion": "Incorrecta. Requiere el acuerdo de ambas partes."}, {"texto": "Una sanción por la rebeldía del demandado.", "justificacion": "Incorrecta. No es una sanción."}], "correcta": 0, "referencias": ["COGEP"]}, {"id": "DPG-47", "area": 3, "dificultad": 2, "subarea": "Derecho Procesal General", "tema": "Falta de contestación", "resultado": "Determina los efectos de la falta de contestación.", "demanda": "Comprender", "enunciado": "Si el demandado no contesta la demanda, según el COGEP:", "opciones": [{"texto": "El proceso continúa y su silencio se tiene como negativa.", "justificacion": "Correcta. La falta de contestación se considera negativa de los fundamentos de la demanda, salvo que la ley disponga otro efecto (art. 157 COGEP); la inasistencia del demandado hace que la audiencia continúe en su rebeldía (art. 87 COGEP)."}, {"texto": "El actor gana automáticamente el proceso, sin necesidad de probar nada.", "justificacion": "Incorrecta. El actor sigue obligado a probar."}, {"texto": "Se anula la demanda presentada.", "justificacion": "Incorrecta. La demanda subsiste."}, {"texto": "Se suspende indefinidamente el trámite.", "justificacion": "Incorrecta. El proceso continúa."}], "correcta": 0, "referencias": ["COGEP"]}, {"id": "DPG-48", "area": 3, "dificultad": 1, "subarea": "Derecho Procesal General", "tema": "Recursos", "resultado": "Identifica la finalidad de los recursos.", "demanda": "Comprender", "enunciado": "El recurso, como institución procesal, tiene por finalidad:", "opciones": [{"texto": "Permitir revisar o corregir decisiones dentro de límites legales.", "justificacion": "Correcta. El COGEP prevé recursos horizontales y verticales (aclaración, ampliación, reforma, revocatoria, apelación, casación y de hecho, art. 251)."}, {"texto": "Reabrir el debate de la causa indefinidamente, sin plazos ni reglas fijas.", "justificacion": "Incorrecta. Los recursos tienen plazos y requisitos."}, {"texto": "Sustituir la motivación de la decisión judicial.", "justificacion": "Incorrecta. La motivación es obligatoria."}, {"texto": "Eliminar la firmeza de todas las sentencias.", "justificacion": "Incorrecta. Las sentencias quedan firmes al agotarse los recursos."}], "correcta": 0, "referencias": ["COGEP"]}, {"id": "DPG-49", "area": 3, "dificultad": 1, "subarea": "Derecho Procesal General", "tema": "Doble instancia", "resultado": "Comprende la garantía de doble instancia.", "demanda": "Comprender", "enunciado": "La doble instancia se justifica principalmente por:", "opciones": [{"texto": "Permitir que un superior revise y corrija errores.", "justificacion": "Correcta. La Constitución garantiza recurrir el fallo en todos los procedimientos en que se decida sobre derechos (art. 76 num. 7 lit. m CRE); la apelación procede contra sentencias de primera instancia (art. 256 COGEP)."}, {"texto": "Garantizar que el superior siempre modifique la sentencia recurrida.", "justificacion": "Incorrecta. El superior puede confirmarla."}, {"texto": "Evitar toda audiencia oral en segunda instancia.", "justificacion": "Incorrecta. La segunda instancia también es oral."}, {"texto": "Impedir los acuerdos entre las partes.", "justificacion": "Incorrecta. No guarda relación."}], "correcta": 0, "referencias": ["CRE", "COGEP"]}, {"id": "DPG-50", "area": 3, "dificultad": 1, "subarea": "Derecho Procesal General", "tema": "Cosa juzgada", "resultado": "Identifica los efectos de la cosa juzgada.", "demanda": "Recordar", "enunciado": "La cosa juzgada se caracteriza por:", "opciones": [{"texto": "La inmutabilidad de lo decidido una vez firme.", "justificacion": "Correcta. Las sentencias ejecutoriadas surten efecto irrevocable respecto de las partes (arts. 99 y 101 COGEP)."}, {"texto": "Permitir reabrir el caso por simple inconformidad.", "justificacion": "Incorrecta. Es lo contrario de la cosa juzgada."}, {"texto": "La suspensión automática de la sentencia.", "justificacion": "Incorrecta. La sentencia firme se cumple."}, {"texto": "La ausencia total de motivación del fallo.", "justificacion": "Incorrecta. No guarda relación."}], "correcta": 0, "referencias": ["COGEP"]}, {"id": "DPG-51", "area": 3, "dificultad": 1, "subarea": "Derecho Procesal General", "tema": "Ejecución", "resultado": "Identifica la finalidad de la ejecución.", "demanda": "Comprender", "enunciado": "La ejecución de una decisión judicial se orienta a:", "opciones": [{"texto": "Hacer cumplir lo resuelto, incluso de forma forzosa.", "justificacion": "Correcta. La sentencia ejecutoriada es título de ejecución (art. 363 COGEP) y su cumplimiento puede exigirse coactivamente."}, {"texto": "Revisar nuevamente la prueba practicada en juicio.", "justificacion": "Incorrecta. La prueba ya no se discute."}, {"texto": "Negociar otra vez la pretensión de la demanda.", "justificacion": "Incorrecta. Lo resuelto ya es obligatorio."}, {"texto": "Declarar la incompetencia del juez de ejecución.", "justificacion": "Incorrecta. No es su finalidad."}], "correcta": 0, "referencias": ["COGEP"]}, {"id": "DPG-52", "area": 3, "dificultad": 1, "subarea": "Derecho Procesal General", "tema": "Economía procesal", "resultado": "Identifica el principio de economía procesal.", "demanda": "Comprender", "enunciado": "El principio de economía procesal busca:", "opciones": [{"texto": "Evitar actuaciones innecesarias sin sacrificar garantías.", "justificacion": "Correcta. El sistema procesal debe ser eficaz y ágil, sin sacrificar la justicia por la sola omisión de formalidades (art. 169 CRE)."}, {"texto": "Reducir el derecho de defensa de las partes para acelerar el proceso.", "justificacion": "Incorrecta. Las garantías no se sacrifican."}, {"texto": "Eliminar toda la prueba del proceso.", "justificacion": "Incorrecta. La prueba sigue siendo necesaria."}, {"texto": "Impedir la intervención de terceros.", "justificacion": "Incorrecta. No guarda relación."}], "correcta": 0, "referencias": ["CRE"]}, {"id": "DPG-53", "area": 3, "dificultad": 1, "subarea": "Derecho Procesal General", "tema": "Tutela judicial efectiva", "resultado": "Comprende el contenido de la tutela judicial efectiva.", "demanda": "Comprender", "enunciado": "La tutela judicial efectiva exige que el sistema procesal:", "opciones": [{"texto": "Garantice acceso, decisión motivada y cumplimiento.", "justificacion": "Correcta. Toda persona tiene derecho al acceso gratuito a la justicia y a la tutela efectiva, imparcial y expedita de sus derechos (art. 75 CRE)."}, {"texto": "Asegure siempre un resultado favorable a quien presenta la demanda.", "justificacion": "Incorrecta. No garantiza un resultado."}, {"texto": "Permita dictar decisiones secretas.", "justificacion": "Incorrecta. Rige la publicidad."}, {"texto": "Prohíba la asistencia de un abogado.", "justificacion": "Incorrecta. La defensa técnica es un derecho."}], "correcta": 0, "referencias": ["CRE"]}]}];

function base(){return Q.map(x=>({id:x.id,a:x.a,s:x.s,t:x.t,ra:x.ra,d:x.d,q:x.q,o:x.o.map(p=>({x:p[0],w:p[1]})),refs:x.r.map(k=>BIB[k]||k)}))}
/* Paquetes incluidos dentro del archivo (funcionan sin publicar el banco en línea) */
function embBase(){const out=[];if(typeof EMB==="undefined")return out;EMB.forEach(p=>(p.preguntas||[]).forEach(x=>{try{const q=normItem(x,String(x.id),p.bibliografia||{});q.pk=p.id;out.push(q)}catch(e){}}));return out}

/* Normaliza una pregunta en formato JSON público (el mismo de Importar) */
function normItem(x,id,bib){
  const a=+x.area;if(!AREAS[a])throw"«area» debe ser 1 a 5";
  if(!x.enunciado)throw"falta «enunciado»";
  if(!Array.isArray(x.opciones)||x.opciones.length!==4)throw"deben ser exactamente 4 opciones";
  const c=+(x.correcta??0);if(!(c>=0&&c<=3))throw"«correcta» debe ser 0 a 3";
  const o=x.opciones.map(p=>typeof p==="string"?{x:p,w:""}:{x:String(p.texto??""),w:String(p.justificacion??"")});
  if(o.some(p=>!p.x))throw"hay una opción sin texto";
  const df=+x.dificultad;
  return {id,a,dif:(df>=1&&df<=5)?df:undefined,s:String(x.subarea??""),t:String(x.tema??""),ra:String(x.resultado??""),d:String(x.demanda??""),q:String(x.enunciado),
    o:[c,...[0,1,2,3].filter(k=>k!==c)].map(k=>o[k]),refs:Array.isArray(x.referencias)?x.referencias.map(r=>String((bib&&bib[r])||BIB[r]||r)):[]};
}

/* ---------- DIFICULTAD ADAPTATIVA ----------
   Cada área tiene un nivel (1 a 5). Tras cada simulacro completo: ≥ 80 % de acierto en el área → sube; < 50 % → baja.
   La dificultad de cada pregunta parte de su demanda cognitiva (o del campo «dificultad») y se ajusta con tu historial con ella. */
const LEVELS=[null,{n:"Básico",t:1.6,min:120},{n:"Intermedio",t:2.5,min:120},{n:"Avanzado",t:3.3,min:120},{n:"Experto",t:4.1,min:110},{n:"Titulación",t:4.7,min:100}];
const DEM={recordar:1,comprender:2,aplicar:3,analizar:4,evaluar:5,crear:5};
const UP=0.8,DOWN=0.5,START_LV=2;
function levels(){const l=store.get(K.lvl,{});for(const a in AREAS)if(!(l[a]>=1&&l[a]<=5))l[a]=START_LV;return l}
function globalLv(){const l=levels();return Math.round(Object.values(l).reduce((s,x)=>s+x,0)/Object.keys(l).length)}
function baseDiff(q){return q.dif||DEM[String(q.d||"").trim().toLowerCase()]||3}
function qDiff(q,QS){let e=baseDiff(q);const st=QS[q.id];if(st&&st[0]){const r=st[1]/st[0];e+=(1-r)*1.2-(r===1?0.4:0)}return Math.max(1,Math.min(5,e))}
function weightedPick(pool,k,wf){const items=pool.map(q=>({q,w:Math.max(1e-6,wf(q))})),out=[];
  while(out.length<k&&items.length){let s=items.reduce((t,x)=>t+x.w,0),r=Math.random()*s,i=0;for(;i<items.length-1;i++){r-=items[i].w;if(r<=0)break}out.push(items.splice(i,1)[0].q)}return out}
function pickAdaptive(pool,k,lv){
  const QS=store.get(K.qs,{}),last=new Set((store.get(K.last,null)||{}).ids||[]),T=LEVELS[lv].t;
  return weightedPick(pool,k,q=>{let w=Math.exp(-1.1*Math.abs(qDiff(q,QS)-T));const st=QS[q.id];
    if(!st)w*=1.4;else if(last.has(q.id))w*=0.35;if(lv>=4&&st&&st[1]<st[0])w*=1.3;return w});
}
function lvPill(l){return `<span class="lv l${l}">${l} · ${LEVELS[l].n}</span>`}

function dayNum(t){const d=t==null?new Date():new Date(t);return Math.floor((d.getTime()-d.getTimezoneOffset()*60000)/86400000)}

/* ---------- REPASO ESPACIADO ----------
   Pregunta fallada → vuelve mañana. Si la aciertas cuando le toca: vuelve a los 3 días, luego a los 7, y después queda dominada.
   Si la vuelves a fallar en cualquier momento, reinicia el ciclo. */
const SRS_INT=[1,3,7];
function srs(){let s=store.get(K.srs,null);if(!s){s={};const t=TODAY();store.get(K.errs,[]).forEach(id=>s[id]={b:0,due:t});store.set(K.srs,s)}return s}
function srsUpdate(ids,ans){const s=srs(),t=TODAY();let mastered=0,added=0,advanced=0;
  for(const id of ids){const ok=ans[id]===0,e=s[id];
    if(!ok){if(!e)added++;s[id]={b:0,due:t+SRS_INT[0]}}
    else if(e&&e.due<=t){const b=e.b+1;advanced++;if(b>=SRS_INT.length){delete s[id];mastered++}else s[id]={b,due:t+SRS_INT[b]}}}
  store.set(K.srs,s);if(mastered)store.set(K.mast,store.get(K.mast,0)+mastered);return {mastered,added,advanced}}
function srsList(){const m=byId(),s=srs();return Object.entries(s).filter(([id])=>m[id]).map(([id,e])=>Object.assign({id},e))}
function srsDue(){const t=TODAY();return srsList().filter(e=>e.due<=t)}
function srsPrune(){const m=byId(),s=srs();for(const id in s)if(!m[id])delete s[id];store.set(K.srs,s)}
function srsNext(){const l=srsList();if(!l.length)return null;return Math.min(...l.map(e=>e.due))-TODAY()}

/* ---------- RACHA Y SESIÓN DEL DÍA ---------- */
const DAILY_N=10;
function bumpStreak(){const t=TODAY(),s=store.get(K.streak,{n:0,best:0,last:null});if(s.last===t)return s;s.n=(s.last===t-1)?s.n+1:1;s.best=Math.max(s.best||0,s.n);s.last=t;store.set(K.streak,s);return s}
function streakNow(){const s=store.get(K.streak,{n:0,best:0,last:null}),t=TODAY();return (s.last===t||s.last===t-1)?s.n:0}
function dailyDone(){return store.get(K.daily,null)===TODAY()}
function areaAcc(){const m=byId(),QS=store.get(K.qs,{}),r={};for(const id in QS){const q=m[id];if(!q)continue;const x=r[q.a]||(r[q.a]=[0,0]);x[0]+=QS[id][1];x[1]+=QS[id][0]}const o={};for(const a in r)o[a]=r[a][1]?r[a][0]/r[a][1]:undefined;return o}
function startDaily(){
  if(!canStart())return;const due=shuffle(srsDue().map(e=>e.id)).slice(0,6),QS=store.get(K.qs,{}),lv=levels(),acc=areaAcc();
  const rest=weightedPick(bank().filter(q=>!due.includes(q.id)),DAILY_N-due.length,q=>{let w=Math.exp(-1.1*Math.abs(qDiff(q,QS)-LEVELS[lv[q.a]].t));w*=1+(1-(acc[q.a]??0.6))*2;if(!QS[q.id])w*=1.3;return w});
  newExam("daily","Sesión del día",shuffle(due.concat(rest.map(q=>q.id))),0,true);
}

/* ---------- DIAGNÓSTICO POR TEMA ---------- */
function topicStats(){const m=byId(),QS=store.get(K.qs,{}),sub={},tem={};
  for(const id in QS){const q=m[id];if(!q)continue;const[n,ok,ms]=QS[id];const ks=q.a+"|"+(q.s||"Sin subárea"),kt=ks+"|"+(q.t||"Sin tema");
    for(const[o,k]of[[sub,ks],[tem,kt]]){const x=o[k]||(o[k]={n:0,ok:0,ms:0,c:0,ids:[]});x.n+=n;x.ok+=ok;if(ms){x.ms+=ms;x.c+=n}x.ids.push(id)}}
  return {sub,tem}}
function weakTopics(minN){const{sub}=topicStats();return Object.entries(sub).map(([k,x])=>{const[a,s]=k.split("|");return Object.assign({a:+a,s,acc:x.ok/x.n},x)}).filter(x=>x.n>=(minN||3)&&x.acc<0.75).sort((x,y)=>x.acc-y.acc||y.n-x.n)}
let WEAK=[];
function startWeak(i){const w=WEAK[i];if(w)startTopic(w.a,w.s)}
function startTopic(a,s){if(!canStart())return;const pool=bank().filter(q=>q.a==a&&(q.s||"Sin subárea")===s);if(!pool.length)return;
  const ids=pickAdaptive(pool,Math.min(10,pool.length),levels()[a]).map(q=>q.id);newExam("prac","Refuerzo: "+s,ids,0,true)}

const CODES={"Constitución":"CRE","CRE":"CRE","Ley Orgánica de Garantías Jurisdiccionales y Control Constitucional":"LOGJCC","LOGJCC":"LOGJCC","Código Orgánico Administrativo":"COA","COA":"COA","Código Orgánico Integral Penal":"COIP","COIP":"COIP","Código Orgánico General de Procesos":"COGEP","COGEP":"COGEP","Ley de Arbitraje y Mediación":"LAM","LAM":"LAM","Código Civil":"CC","CC":"CC","Código del Trabajo":"CT","CT":"CT","Código Tributario":"CTRIB","CTrib":"CTRIB","Código de la Niñez y Adolescencia":"CONA","CONA":"CONA","Ley de Compañías":"LC","CADH":"CADH","Convención Americana":"CADH"};
const CODE_NAME={CRE:"Constitución",LOGJCC:"Ley Orgánica de Garantías Jurisdiccionales y Control Constitucional",COA:"Código Orgánico Administrativo",COIP:"Código Orgánico Integral Penal",COGEP:"Código Orgánico General de Procesos",LAM:"Ley de Arbitraje y Mediación",CC:"Código Civil",CT:"Código del Trabajo",CTRIB:"Código Tributario",CONA:"Código de la Niñez y Adolescencia",LC:"Ley de Compañías",CADH:"Convención Americana sobre Derechos Humanos"};
const ART_RE=new RegExp("\\barts?\\.\\s*(\\d+(?:\\s*(?:,|y|a)\\s*\\d+)*)(?:\\s*(?:num|lit|inc)\\.\\s*[\\w\\)]+)*\\s*,?\\s*(?:del |de la |de )?("+Object.keys(CODES).sort((a,b)=>b.length-a.length).map(x=>x.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("|")+")\\b","g");
function artsDB(){return Object.assign({},typeof ART!=="undefined"?ART:{},store.get(K.arts,{}))}
function citedArts(txt){const out=[];let m;ART_RE.lastIndex=0;while((m=ART_RE.exec(txt))){const code=CODES[m[2]];const nums=[];m[1].replace(/(\d+)\s*a\s*(\d+)/g,(_,x,y)=>{for(let i=+x;i<=+y&&i-x<6;i++)nums.push(i);return""}).replace(/\d+/g,n=>{nums.push(+n);return n});for(const n of nums)out.push(code+" "+n)}return out}
function artsBlock(q){const db=artsDB(),seen=new Set(),list=[];
  for(const o of q.o)for(const k of citedArts(o.w||"")) if(!seen.has(k)&&db[k]){seen.add(k);list.push(k)}
  if(!list.length)return "";
  return `<h4>Artículos clave</h4><p class="artnote">Síntesis para estudio, no es el texto literal. Verifica la versión vigente en la fuente oficial.</p>${list.map(k=>{const[c,n]=k.split(" ");return `<details class="art"><summary>Art. ${n} · ${esc(CODE_NAME[c]||c)}</summary><p>${esc(db[k])}</p></details>`}).join("")}`}

let SYNCING=false;
const isWeb=()=>/^https?:$/.test(location.protocol);
function srcUrl(){const s=store.get(K.src,"")||DEFAULT_SRC;if(s)return s;return isWeb()?new URL("banco/manifest.json",location.href).href:""}
async function getJSON(u){
  const ctl=typeof AbortController!=="undefined"?new AbortController():null;const tm=setTimeout(()=>ctl&&ctl.abort(),20000);
  try{const r=await fetch(u+(u.includes("?")?"&":"?")+"t="+Date.now(),{cache:"no-store",signal:ctl&&ctl.signal});if(!r.ok)throw"HTTP "+r.status;return await r.json()}
  finally{clearTimeout(tm)}
}
async function sync(manual){
  if(SYNCING)return;const url=srcUrl();
  if(!url){if(manual)alert("Primero configura la dirección del banco en línea en Banco › Actualización en línea.");return}
  if(navigator.onLine===false){if(manual)alert("No hay conexión a internet. Seguirás usando las preguntas guardadas.");return}
  SYNCING=true;refreshSync();
  const st=store.get(K.sync,{});let added=0,updated=0;
  try{
    const man=await getJSON(url);const list=man.paquetes||man.packs||[];
    if(!Array.isArray(list))throw"manifiesto sin «paquetes»";
    const have=store.get(K.packs,{});
    for(const p of list){
      const v=String(p.version??1);if(have[p.id]&&have[p.id].v===v)continue;
      const data=await getJSON(new URL(p.archivo,url).href);
      const arr=Array.isArray(data)?data:(data.preguntas||[]);const bib=data.bibliografia||{};if(data.articulos&&typeof data.articulos==='object')store.set(K.arts,Object.assign(store.get(K.arts,{}),data.articulos));
      const qs=[];arr.forEach((x,i)=>{try{const q=normItem(x,String(x.id||(p.id+"-"+(i+1))),bib);q.pk=p.id;qs.push(q)}catch(e){}});
      const old=store.get(K.remote,[]),prev=old.filter(q=>q.pk===p.id).length;
      store.set(K.remote,old.filter(q=>q.pk!==p.id).concat(qs));
      if(have[p.id])updated+=qs.length;else added+=Math.max(0,qs.length-prev);
      have[p.id]={v,n:qs.length,t:String(p.titulo||p.id),f:Date.now()};store.set(K.packs,have);
    }
    store.set(K.sync,{t:Date.now(),ok:true,added,updated,url});
    if(added||updated)toast(added?`Se añadieron ${added} preguntas nuevas al banco. Ya puedes usarlas sin internet.`:`Se actualizaron ${updated} preguntas del banco.`);
    else if(manual)toast("Tu banco ya está al día.");
  }catch(e){
    store.set(K.sync,Object.assign({},st,{err:String(e&&e.message||e),te:Date.now(),url}));
    if(manual)alert("No se pudo actualizar el banco:\n"+(e&&e.message||e)+"\n\nSeguirás usando las preguntas guardadas.");
  }finally{SYNCING=false;refreshSync();if(VIEW==="home")home();else if(VIEW==="bank")bankView()}
}
function ago(t){const s=Math.round((Date.now()-t)/1000);if(s<60)return"hace un momento";const m=Math.round(s/60);if(m<60)return`hace ${m} min`;const h=Math.round(m/60);if(h<48)return`hace ${h} h`;return`hace ${Math.round(h/24)} días`}
function syncLine(){
  const st=store.get(K.sync,{}),n=bank().length,url=srcUrl();
  let dot="",txt;
  if(SYNCING){dot="busy";txt="Buscando preguntas nuevas…"}
  else if(!url){txt=`${n} preguntas guardadas · actualización en línea sin configurar`}
  else if(navigator.onLine===false){dot="off";txt=`Sin conexión · usando ${n} preguntas guardadas`}
  else if(st.err&&(!st.t||st.te>st.t)){dot="off";txt=`No se pudo actualizar (${ago(st.te)}) · ${n} preguntas guardadas`}

}

/* ---------- EXAMEN ---------- */
function accTime(){if(EX&&EX.qt0&&EX.cur){EX.tq=EX.tq||{};EX.tq[EX.cur]=(EX.tq[EX.cur]||0)+Math.min(Date.now()-EX.qt0,15*60000)}if(EX)EX.qt0=null}

function askFinish(){const un=EX.ids.length-answered(),fl=Object.keys(EX.flag).length;
  let msg="¿Finalizar y calificar?";if(un)msg+=`\n\nTienes ${un} pregunta${un>1?"s":""} sin responder (cuentan como incorrectas).`;if(fl)msg+=`\n${fl} marcada${fl>1?"s":""} para revisar.`;
  if(confirm(msg))finish(false)}
function exitExam(){accTime();saveEx();if(confirm(EX.dur?"¿Salir al inicio? Tu evaluación queda guardada, pero el cronómetro sigue corriendo.":"¿Salir al inicio? Tu avance queda guardado."))home();else if(VIEW==="exam"){EX.qt0=Date.now()}}

/* ---------- CALIFICACIÓN ---------- */
function finish(auto){
  accTime();stopTick();stopSpeak();const m=byId();let ok=0;const by={},wrong=[];
  EX.ids.forEach(id=>{const q=m[id];if(!q)return;by[q.a]=by[q.a]||[0,0];by[q.a][1]++;if(EX.ans[id]===0){ok++;by[q.a][0]++}else wrong.push(id)});
  EX.done=true;EX.end=Math.min(Date.now(),EX.dur?EX.start+EX.dur:Date.now());EX.ok=ok;EX.by=by;EX.auto=!!auto;
  EX.srs=srsUpdate(EX.ids.filter(id=>m[id]),EX.ans);
  const QS=store.get(K.qs,{});EX.ids.forEach(id=>{if(!m[id])return;const s=QS[id]||[0,0,0];s[0]++;if(EX.ans[id]===0)s[1]++;s[2]=(s[2]||0)+((EX.tq||{})[id]||0);QS[id]=s});store.set(K.qs,QS);
  if(answered()>=5||EX.mode==="daily")EX.streak=bumpStreak().n;
  if(EX.mode==="daily")store.set(K.daily,TODAY());
  EX.lvChange=[];
  if(EX.mode==="sim"){const lv=levels();
    for(const a in by){const[o,t]=by[a],p=o/t,from=lv[a];let to=from;if(p>=UP)to=Math.min(5,from+1);else if(p<DOWN)to=Math.max(1,from-1);lv[a]=to;EX.lvChange.push({a,from,to,p})}
    store.set(K.lvl,lv);EX.lvAfter=lv}
  const h=store.get(K.hist,[]);h.unshift({d:EX.end,mode:EX.mode,title:EX.title,n:EX.ids.length,ok,by,used:EX.end-EX.start,auto:EX.auto,g:EX.mode==="sim"?globalLv():undefined});store.set(K.hist,h.slice(0,200));
  store.set(K.last,EX);store.set(K.exam,null);
  resultsView(EX);
}

  const tot=ids.reduce((s,id)=>s+tq[id],0),avg=tot/ids.length,slow=ids.slice().sort((x,y)=>tq[y]-tq[x]).slice(0,3).filter(id=>tq[id]>PACE);

function impFile(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>doImport(String(r.result));r.readAsText(f)}
function doImport(txt){
  let raw,aik=null;try{raw=JSON.parse(txt)}catch(e){aik=parseAiken(txt);if(!aik.items.length&&!aik.bad.length){alert("No reconozco el formato. Usa JSON (como el ejemplo) o AIKEN (Q1. / A. / B. / C. / D. / ANSWER: A).");return}
    if(!aik.items.length){alert("No se importó ninguna pregunta AIKEN:\n\n"+aik.bad.slice(0,8).join("\n"));return}
    const a=prompt(`Detecté ${aik.items.length} preguntas en formato AIKEN. ¿A qué área pertenecen?\n1 Constitucional/DD. HH./Administrativo\n2 Penal y Procesal Penal\n3 Procesal y Métodos Alternativos\n4 Civil\n5 Int. Privado/Mercantil/Tributario/Laboral`,"3");if(a==null)return;
    if(!AREAS[+a]){alert("Área no válida (1 a 5).");return}aik.items.forEach(x=>x.area=+a);raw=aik.items}
  let data=Array.isArray(raw)?raw:Array.isArray(raw.preguntas)?raw.preguntas:[raw];if(!Array.isArray(raw))data.bibliografia=raw.bibliografia;
  const out=[],bad=aik?aik.bad.slice():[],stamp=Date.now().toString(36),seen=new Set(bank().map(qKey));let dup=0;
  const bib=data.bibliografia||{};let biased=0;
  data.forEach((x,i)=>{try{const q=normItem(x,"U"+stamp+"-"+i,bib);const k=qKey(q);if(seen.has(k)){dup++;return}seen.add(k);if(lenBias(q.o.map(o=>o.x),0)>1.35)biased++;out.push(q)}catch(e){bad.push("Pregunta "+(i+1)+": "+e)}});
  if(out.length){store.set(K.custom,store.get(K.custom,[]).concat(out))}
  alert(`Importadas: ${out.length}${dup?"\nOmitidas por repetidas (ya estaban en el banco o duplicadas en el archivo): "+dup:""}${aik&&out.length?"\nLas preguntas AIKEN no traen argumentación de cada opción ni bibliografía.":""}${biased?"\nAtención: en "+biased+" de ellas la correcta es bastante más larga que los distractores (se adivina fácil). Conviene equilibrarlas.":""}${bad.length?"\nCon errores (omitidas): "+bad.length+"\n\n"+bad.slice(0,8).join("\n"):""}`);
  bankView();
}

function proposeItem(){const g=i=>document.getElementById(i).value.trim();
  return {area:+g("pa"),subarea:g("ps"),tema:g("pt"),resultado:g("pr"),demanda:g("pd"),enunciado:g("pq"),
    opciones:[0,1,2,3].map(i=>({texto:g("po"+i),justificacion:g("pw"+i)})),correcta:+document.querySelector("input[name=pc]:checked").value,referencias:g("pref").split("\n").map(x=>x.trim()).filter(Boolean)}}
/* Sesgo de longitud: la correcta no debe delatarse por ser mucho más larga que los distractores */
/* Clave para detectar preguntas repetidas: enunciado + opciones, sin mayúsculas, tildes ni signos */
function normTxt(t){return String(t||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9ñ ]+/g," ").replace(/\s+/g," ").trim()}
function qKey(q){return normTxt(q.q)+"|"+q.o.map(o=>normTxt(o.x)).sort().join("|")}
/* Formato AIKEN (Moodle): enunciado, opciones "A." a "D." y línea "ANSWER: X" */
function parseAiken(txt){const items=[],bad=[];let cur=null,n=0;
  const close=()=>{if(!cur)return;n++;const lab="Pregunta "+n+(cur.q?" («"+cur.q.slice(0,40)+"…»)":"");
    if(cur.opts.length!==4)bad.push(lab+": debe tener exactamente 4 opciones (tiene "+cur.opts.length+")");
    else if(cur.ans==null)bad.push(lab+": falta la línea ANSWER");
    else{const c="ABCD".indexOf(cur.ans);if(c<0)bad.push(lab+": ANSWER no válido");else items.push({enunciado:cur.q,opciones:cur.opts.map(t=>({texto:t,justificacion:""})),correcta:c,subarea:"",tema:"",demanda:"",referencias:[]})}
    cur=null};
  for(let line of String(txt).replace(/\r/g,"").split("\n")){line=line.trim();if(!line)continue;
    let m;
    if((m=line.match(/^ANSWER\s*:\s*([A-Za-z])/i))){if(cur)cur.ans=m[1].toUpperCase();close();continue}
    if(cur&&cur.opts.length<6&&(m=line.match(/^([A-Fa-f])\s*[\.\)]\s*(.+)$/))&&m[1].toUpperCase()==="ABCDEF"[cur.opts.length]){cur.opts.push(m[2].trim());continue}
    if(cur&&cur.opts.length){if(/^(Q|P|Pregunta)?\s*\d+\s*[\.\)\-:]/i.test(line))close();else continue} /* notas tras las opciones (p. ej., «Tema → art.») */
    line=line.replace(/^(Q|P|Pregunta)?\s*\d+\s*[\.\)\-:]\s*/i,"");
    if(!cur)cur={q:line,opts:[],ans:null};else cur.q+=" "+line}
  if(cur)close();return {items,bad}}
function lenBias(textos,c){const L=textos.map(t=>String(t||"").length),ds=L.filter((_,i)=>i!==c),avg=ds.reduce((a,b)=>a+b,0)/ds.length;return avg?L[c]/avg:1}
function proposeCheck(x){if(!x.enunciado)return"Falta el enunciado.";if(x.opciones.some(o=>!o.texto))return"Completa las cuatro alternativas.";if(x.opciones.some(o=>!o.justificacion))return"Argumenta las cuatro alternativas (por qué cada una es correcta o incorrecta).";if(!x.subarea||!x.tema)return"Indica la subárea y el tema.";
  const r=lenBias(x.opciones.map(o=>o.texto),x.correcta);if(r>1.35)return`La alternativa correcta es ${Math.round((r-1)*100)} % más larga que el promedio de los distractores, y eso la delata. Acórtala (lleva la explicación a su justificación) o desarrolla más los distractores.`;return""}
function proposeSave(){const x=proposeItem(),e=proposeCheck(x);if(e){alert(e);return}
  try{const q=normItem(x,"U"+Date.now().toString(36)+"-p",{});store.set(K.custom,store.get(K.custom,[]).concat([q]));VIEW="home";toast("Pregunta agregada a tu banco.");home()}catch(err){alert(String(err))}}
async function proposeShare(){const x=proposeItem(),e=proposeCheck(x);if(e){alert(e);return}
  const txt=JSON.stringify([x],null,2);
  try{if(navigator.share){await navigator.share({title:"Pregunta para el Simulador Complexivo",text:txt});return}}catch(err){if(err&&err.name==="AbortError")return}
  try{await navigator.clipboard.writeText(txt);toast("Pregunta copiada. Pégala en WhatsApp o correo.")}catch(err){const blob=new Blob([txt],{type:"application/json"}),u=URL.createObjectURL(blob),l=document.createElement("a");l.href=u;l.download="pregunta-propuesta.json";document.body.appendChild(l);l.click();l.remove()}}

/* ---------- BOTÓN ATRÁS DE ANDROID ---------- */
try{history.pushState({s:1},"")}catch(e){}
window.addEventListener("popstate",()=>{
  try{history.pushState({s:1},"")}catch(e){}
  if(VIEW==="exam")exitExam();
  else if(VIEW==="grid")go(0,true);
  else if(VIEW==="review")resultsView(store.get(K.last));
  else if(VIEW==="propose"&&!confirm("¿Salir sin guardar la pregunta?"))return;
  else if(VIEW!=="home")home();
});
document.addEventListener("visibilitychange",()=>{if(EX&&!EX.done&&VIEW==="exam"){if(document.hidden){accTime();saveEx();stopSpeak()}else EX.qt0=Date.now()}});
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&EX&&!EX.done&&(VIEW==="exam"||VIEW==="grid")&&EX.dur&&remaining()<=0)finish(true)});

/* ---------- ACTUALIZACIÓN AUTOMÁTICA ---------- */
window.addEventListener("online",()=>{refreshSync();sync(false)});
window.addEventListener("offline",refreshSync);
setInterval(()=>sync(false),6*3600*1000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden){const st=store.get(K.sync,{});if(!st.t||Date.now()-st.t>3600*1000)sync(false)}});
if(isWeb()&&"serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(()=>{})}

home();
setTimeout(()=>sync(false),800);
</script>
