etición, porque el silencio siempre es negativo en materia administrativa.", "justificacion": "Incorrecta. El silencio no siempre es negativo; depende de lo que prevea la norma para el trámite."}, {"texto": "Se suspende el procedimiento, porque la falta de respuesta impide continuar con el trámite iniciado.", "justificacion": "Incorrecta. El silencio no suspende; produce un efecto jurídico que permite continuar o exigir cumplimiento."}, {"texto": "Se archiva el expediente, porque la inactividad de la administración extingue la petición presentada.", "justificacion": "Incorrecta. La inactividad no archiva; el silencio positivo protege al administrado frente a la mora."}], "correcta": 0, "referencias": ["COA"]}, {"id": "EX-027", "area": 1, "subarea": "Derecho Administrativo", "tema": "Responsabilidad patrimonial del Estado", "resultado": "Aplica la responsabilidad objetiva del Estado por falta de servicio.", "demanda": "Aplicar", "enunciado": "Por falta de mantenimiento, un puente público colapsa y causa daños a un transportista que circulaba normalmente. El Estado alega que no hubo culpa de un funcionario identificado. ¿Debe responder?", "opciones": [{"texto": "Sí, porque el Estado responde por la falta o deficiencia del servicio.", "justificacion": "Correcta. El Estado responde objetivamente por daños derivados de la falta o deficiente prestación del servicio. Base legal: art. 11.9 de la Constitución de la República."}, {"texto": "No, porque sin identificar al funcionario culpable no existe responsabilidad patrimonial del Estado.", "justificacion": "Incorrecta. La responsabilidad es por falta de servicio y no exige identificar al funcionario culpable."}, {"texto": "Sí, porque todo daño ocurrido en una vía pública genera responsabilidad penal del Estado.", "justificacion": "Incorrecta. La responsabilidad patrimonial es distinta de la penal y no requiere delito."}, {"texto": "No, porque el transportista asumió el riesgo al usar un puente público en mal estado.", "justificacion": "Incorrecta. El uso normal de un servicio público no implica asumir el riesgo de su falta de mantenimiento."}], "correcta": 0, "referencias": ["CRE"]}, {"id": "EX-028", "area": 1, "subarea": "Derecho Administrativo", "tema": "Contratación pública", "resultado": "Identifica los principios de la contratación pública.", "demanda": "Comprender", "enunciado": "En un proceso de contratación, la entidad elige al oferente sin publicar los pliegos ni permitir la participación de otros interesados. ¿Qué principio se vulnera principalmente?", "opciones": [{"texto": "Principios de concurrencia y transparencia, porque debe garantizar acceso e igualdad a los oferentes.", "justificacion": "Correcta. La contratación pública exige publicidad y concurrencia para garantizar igualdad y transparencia. Base legal: art. 3 de la Ley Orgánica del Sistema Nacional de Contratación Pública (texto reformado en 2025)."}, {"texto": "Principio de legalidad, porque la entidad actuó sin una ley que le permita contratar obras.", "justificacion": "Incorrecta. La entidad sí puede contratar; el vicio es la falta de concurrencia y transparencia."}, {"texto": "Principio de eficiencia, porque la entidad no eligió al oferente que ofrecía el menor precio.", "justificacion": "Incorrecta. La eficiencia no se reduce al menor precio ni es el principio principalmente vulnerado."}, {"texto": "Principio de desconcentración, porque la entidad debió delegar la contratación a otra institución.", "justificacion": "Incorrecta. La desconcentración se refiere a la organización, no a la publicidad del proceso."}], "correcta": 0, "referencias": ["LOSNCP"]}, {"id": "EX-029", "area": 1, "subarea": "Derecho Administrativo", "tema": "Servicio público", "resultado": "Distingue concesión y autorización en servicios públicos.", "demanda": "Comprender", "enunciado": "El Estado otorga a una empresa privada la gestión de un servicio público de agua potable, manteniendo la titularidad del servicio y fijando tarifas. ¿Qué figura se utilizó?", "opciones": [{"texto": "Concesión, porque se entrega la gestión del servicio público, sin transferir su titularidad.", "justificacion": "Correcta. La concesión entrega la gestión o explotación del servicio, manteniendo el Estado la titularidad. Base legal: art. 316 de la Constitución de la República; art. 74 del Código Orgánico Administrativo."}, {"texto": "Autorización, porque el Estado permite a un particular ejercer una actividad privada sin titularidad estatal.", "justificacion": "Incorrecta. La autorización habilita actividades privadas, no la gestión de un servicio público titularidad del Estado."}, {"texto": "Permiso, porque se trata de una simple tolerancia para usar bienes públicos sin contraprestación.", "justificacion": "Incorrecta. El permiso no implica la gestión integral de un servicio público con obligaciones de prestación."}, {"texto": "Privatización, porque el Estado transfiere definitivamente la titularidad del servicio al particular.", "justificacion": "Incorrecta. En la concesión no hay transferencia definitiva de titularidad, solo gestión temporal."}], "correcta": 0, "referencias": ["CRE", "COA"]}, {"id": "EX-030", "area": 1, "subarea": "Derecho Constitucional", "tema": "Grupos de atención prioritaria", "resultado": "Aplica la protección reforzada a grupos de atención prioritaria.", "demanda": "Aplicar", "enunciado": "Una trabajadora es despedida intempestivamente pese a que su empleador conocía que estaba embarazada. ¿Qué protección especial opera?", "opciones": [{"texto": "Protección reforzada: el despido es ineficaz y procede su reintegro.", "justificacion": "Correcta. Las mujeres embarazadas son grupo de atención prioritaria con protección especial en el ámbito laboral (arts. 35 y 43 de la Constitución), y su despido es ineficaz, con derecho a reintegro (art. 195.1 del Código del Trabajo). Base legal: arts. 35 y 43 de la Constitución; art. 195.1 del Código del Trabajo."}, {"texto": "Ninguna, porque basta con pagar la indemnización por despido intempestivo.", "justificacion": "Incorrecta. La indemnización ordinaria no sustituye la protección reforzada (art. 195.1 del Código del Trabajo)."}, {"texto": "La misma estabilidad general que tiene cualquier trabajadora, sin distinción.", "justificacion": "Incorrecta. La Constitución les otorga una protección específica (art. 43)."}, {"texto": "Protección penal, porque todo despido de una embarazada es delito.", "justificacion": "Incorrecta. La protección es constitucional y laboral, no penal automática."}], "correcta": 0, "referencias": ["CRE", "CT"]}, {"id": "EX-031", "area": 1, "subarea": "Derecho Constitucional", "tema": "Garantías normativas", "resultado": "Identifica las garantías normativas de los derechos.", "demanda": "Comprender", "enunciado": "La Asamblea aprueba una ley que restringe un derecho constitucional más allá de lo permitido, sin respetar su contenido esencial. ¿Qué garantía se incumple?", "opciones": [{"texto": "Garantía normativa, porque las leyes deben respetar el contenido esencial y la progresividad de derechos.", "justificacion": "Correcta. La garantía normativa obliga a que las normas respeten el contenido esencial de los derechos. Base legal: art. 84 de la Constitución de la República."}, {"texto": "Garantía jurisdiccional, porque solo los jueces pueden aprobar leyes que desarrollen derechos.", "justificacion": "Incorrecta. La aprobación de leyes corresponde al legislador; la garantía vulnerada es normativa."}, {"texto": "Garantía institucional, porque la ley debió ser aprobada por la Corte Constitucional y no por la Asamblea.", "justificacion": "Incorrecta. La Corte no aprueba leyes; ejerce control posterior de constitucionalidad."}, {"texto": "Garantía de políticas públicas, porque la ley debió incluir un plan de ejecución presupuestaria.", "justificacion": "Incorrecta. Las políticas públicas son otra garantía, distinta de la adecuación normativa de la ley."}], "correcta": 0, "referencias": ["CRE"]}, {"id": "EX-032", "area": 2, "subarea": "Derecho Penal (parte general)", "tema": "Tipicidad", "resultado": "Distingue tipicidad objetiva y subjetiva en el COIP.", "demanda": "Comprender", "enunciado": "Una persona dispara a otra con intención de matarla y la víctima fallece. El fiscal debe probar tipicidad. ¿Qué comprende la tipicidad en este caso?", "opciones": [{"texto": "La conducta, el resultado y el nexo causal, además del dolo como elemento subjetivo del tipo.", "justificacion": "Correcta. La tipicidad abarca elementos objetivos (conducta, resultado, nexo) y subjetivos (dolo o culpa). Base legal: art. 25-27 del Código Orgánico Integral Penal."}, {"texto": "Solo la pena prevista, porque la tipicidad se limita a la sanción que impone el legislador.", "justificacion": "Incorrecta. La pena es consecuencia, no el contenido de la tipicidad."}, {"texto": "La culpabilidad del autor, porque sin culpabilidad no puede haber conducta típica alguna.", "justificacion": "Incorrecta. La culpabilidad es una categoría distinta y posterior a la tipicidad."}, {"texto": "La antijuridicidad formal, porque toda conducta típica es automáticamente antijurídica y culpable.", "justificacion": "Incorrecta. La tipicidad no implica automáticamente antijuridicidad; puede haber causa de justificación."}], "correcta": 0, "referencias": ["COIP"]}, {"id": "EX-033", "area": 2, "subarea": "Derecho Penal (parte general)", "tema": "Antijuridicidad y legítima defensa", "resultado": "Aplica los requisitos de la legítima defensa.", "demanda": "Aplicar", "enunciado": "Una persona es atacada con un cuchillo y repele la agresión con un golpe proporcional que lesiona al agresor, sin haber provocado el ataque. ¿Qué se configura?", "opciones": [{"texto": "Legítima defensa, por agresión actual e ilegítima sin provocación.", "justificacion": "Correcta. La legítima defensa exige agresión actual e ilegítima, necesidad racional del medio y falta de provocación. Base legal: art. 33 del Código Orgánico Integral Penal."}, {"texto": "Estado de necesidad, porque sacrifica un bien menor para salvar uno mayor.", "justificacion": "Incorrecta. Aquí no hay conflicto de bienes por peligro común, sino agresión ilegítima actual."}, {"texto": "Cumplimiento de un deber legal, por actuar en ejercicio de una función pública.", "justificacion": "Incorrecta. No hay función pública ni deber legal que justifique la conducta en este caso."}, {"texto": "Error de prohibición, porque creía que podía defenderse con cualquier medio.", "justificacion": "Incorrecta. No hay error sobre la prohibición; la persona actuó dentro de una causa de justificación."}], "correcta": 0, "referencias": ["COIP"]}, {"id": "EX-034", "area": 2, "subarea": "Derecho Penal (parte general)", "tema": "Culpabilidad e inimputabilidad", "resultado": "Identifica la inimputabilidad por trastorno mental.", "demanda": "Comprender", "enunciado": "Un perito determina que al momento del hecho el autor padecía un trastorno mental que le impedía comprender la ilicitud de su conducta. ¿Qué consecuencia penal corresponde?", "opciones": [{"texto": "Es inimputable, porque no pudo comprender la ilicitud por trastorno mental al momento del hecho.", "justificacion": "Correcta. Es inimputable quien por trastorno mental no pudo comprender la ilicitud o determinarse conforme a ella. Base legal: art. 36 del Código Orgánico Integral Penal."}, {"texto": "Se le impone la misma pena, porque el trastorno mental no afecta la responsabilidad penal en ningún caso.", "justificacion": "Incorrecta. Si el trastorno impide comprender la ilicitud, puede excluir o disminuir la culpabilidad."}, {"texto": "Se declara la extinción de la acción, porque el trastorno mental extingue automáticamente el delito cometido.", "justificacion": "Incorrecta. El trastorno no extingue la acción; incide en la culpabilidad y puede dar lugar a medida de seguridad."}, {"texto": "Se agrava la pena, porque el trastorno demuestra mayor peligrosidad y debe sancionarse con más severidad.", "justificacion": "Incorrecta. La mayor peligrosidad no implica agravar la pena si falta la capacidad de comprender la ilicitud."}], "correcta": 0, "referencias": ["COIP"]}, {"id": "EX-035", "area": 2, "subarea": "Derecho Penal (parte general)", "tema": "Autoría y participación", "resultado": "Distingue autoría mediata de complicidad.", "demanda": "Analizar", "enunciado": "Un jefe utiliza a un subordinado que desconoce que el paquete que transporta contiene droga, para introducirla al país. ¿Cómo responde el jefe?", "opciones": [{"texto": "Como autor mediato, porque domina el hecho utilizando a otro como instrumento que actúa sin dolo.", "justificacion": "Correcta. Hay autoría mediata cuando se utiliza a otra persona como instrumento sin dolo o sin responsabilidad. Base legal: art. 42 del Código Orgánico Integral Penal."}, {"texto": "Como cómplice, porque solo ayudó al subordinado que ejecutó directamente la conducta típica.", "justificacion": "Incorrecta. El subordinado actúa sin dolo; quien domina el hecho es el jefe que lo instrumentaliza."}, {"texto": "Como encubridor, porque conocía el delito pero no participó en su ejecución material.", "justificacion": "Incorrecta. El encubrimiento es posterior y de auxilio; aquí el jefe planifica y domina el hecho."}, {"texto": "Como coautor, porque jefe y subordinado ejecutaron conjuntamente el delito con reparto de funciones.", "justificacion": "Incorrecta. No hay coautoría porque el subordinado no actúa con dolo ni con dominio funcional conjunto."}], "correcta": 0, "referencias": ["COIP"]}, {"id": "EX-036", "area": 2, "subarea": "Derecho Penal (parte general)", "tema": "Tentativa", "resultado": "Aplica las reglas de la tentativa punible.", "demanda": "Aplicar", "enunciado": "Una persona dispara a otra con intención de matarla, pero la víctima sobrevive por atención médica oportuna. El disparo sí se ejecutó. ¿Qué figura se configura?", "opciones": [{"texto": "Tentativa, porque realizó actos idóneos y el resultado no se produjo por causas ajenas.", "justificacion": "Correcta. Hay tentativa cuando se inician actos de ejecución idóneos pero el resultado no se produce por causas ajenas. Base legal: art. 39 del Código Orgánico Integral Penal."}, {"texto": "Delito imposible, porque la atención médica hizo imposible que el resultado se produzca en este caso.", "justificacion": "Incorrecta. El delito imposible supone inidoneidad del medio; aquí el medio era idóneo."}, {"texto": "Delito consumado, porque el disparo ya se ejecutó y la intención de matar quedó demostrada.", "justificacion": "Incorrecta. El homicidio requiere la muerte; sin ella no hay consumación aunque haya dolo."}, {"texto": "Desistimiento, porque el autor no continuó disparando y permitió que la víctima reciba ayuda.", "justificacion": "Incorrecta. No hay desistimiento voluntario; el resultado no se produjo por intervención médica, no por abandono."}], "correcta": 0, "referencias": ["COIP"]}, {"id": "EX-037", "area": 2, "subarea": "Derecho Penal (parte general)", "tema": "Concurso de delitos", "resultado": "Distingue concurso ideal y concurso real.", "demanda": "Comprender", "enunciado": "Con un solo disparo, una persona mata a una víctima y lesiona a otra que estaba a su lado. ¿Qué concurso se configura?", "opciones": [{"texto": "Concurso ideal, porque con una sola acción se cometieron dos delitos que deben sancionarse.", "justificacion": "Correcta. Hay concurso ideal cuando una sola acción produce varios delitos que se sancionan conforme a esa figura. Base legal: art. 21 del Código Orgánico Integral Penal."}, {"texto": "Concurso real, porque hay dos resultados producidos por dos conductas independientes entre sí.", "justificacion": "Incorrecta. El concurso real exige pluralidad de conductas; aquí hay una sola acción."}, {"texto": "Delito continuado, porque los delitos se cometieron con el mismo propósito y en un mismo contexto.", "justificacion": "Incorrecta. El delito continuado requiere pluralidad de acciones con unidad de propósito, no una sola acción."}, {"texto": "Concurso aparente, porque solo se debe sancionar el delito más grave y excluir el otro.", "justificacion": "Incorrecta. No es aparente; ambos delitos concurren y deben valorarse en el concurso ideal."}], "correcta": 0, "referencias": ["COIP"]}, {"id": "EX-038", "area": 2, "subarea": "Derecho Penal (parte general)", "tema": "Penas y atenuantes", "resultado": "Aplica atenuantes y agravantes en la determinación de la pena.", "demanda": "Aplicar", "enunciado": "Un procesado por robo se presenta voluntariamente ante la autoridad, colabora con la investigación y repara integralmente a la víctima. ¿Cómo inciden esas circunstancias en la pena?", "opciones": [{"texto": "Son atenuantes que inciden en la determinación de la pena.", "justificacion": "Correcta. Presentarse voluntariamente, colaborar y reparar el daño son circunstancias atenuantes (art. 45 del Código Orgánico Integral Penal), cuya aplicación se rige por el art. 44 del mismo código. Base legal: arts. 44 y 45 del Código Orgánico Integral Penal."}, {"texto": "Son agravantes, porque demuestran que conocía la ilicitud de su conducta.", "justificacion": "Incorrecta. Ninguna figura entre las agravantes del art. 47 del Código Orgánico Integral Penal."}, {"texto": "Son causas de justificación que excluyen la antijuridicidad del robo.", "justificacion": "Incorrecta. Las causas de justificación son el estado de necesidad y la legítima defensa (art. 30 del Código Orgánico Integral Penal)."}, {"texto": "Son eximentes que lo exoneran totalmente de responsabilidad penal.", "justificacion": "Incorrecta. Las atenuantes reducen la pena; no excluyen la responsabilidad."}], "correcta": 0, "referencias": ["COIP"]}, {"id": "EX-039", "area": 2, "subarea": "Derecho Penal (parte general)", "tema": "Principio de legalidad", "resultado": "Aplica el principio de legalidad y la prohibición de analogía in malam partem.", "demanda": "Comprender", "enunciado": "El fiscal pretende sancionar una conducta que no está descrita como delito en el COIP, por considerarla similar a otra sí tipificada. ¿Qué principio lo impide?", "opciones": [{"texto": "Principio de legalidad, porque no hay delito ni pena sin ley previa que describa la conducta.", "justificacion": "Correcta. El principio de legalidad prohíbe sancionar conductas no tipificadas y la analogía en perjuicio. Base legal: art. 76.3 de la Constitución de la República; art. 5.1 del Código Orgánico Integral Penal."}, {"texto": "Principio de proporcionalidad, porque la sanción sería desproporcionada frente a la conducta realizada.", "justificacion": "Incorrecta. La proporcionalidad regula la medida de la pena, no la existencia previa del tipo penal."}, {"texto": "Principio de oportunidad, porque el fiscal puede abstenerse de acusar si la conducta es leve.", "justificacion": "Incorrecta. La oportunidad regula la persecución, no permite crear delitos por analogía."}, {"texto": "Principio de lesividad, porque la conducta no lesionó ningún bien jurídico protegido por la ley.", "justificacion": "Incorrecta. La lesividad exige lesión, pero el obstáculo principal es la falta de tipificación previa."}], "correcta": 0, "referencias": ["CRE", "COIP"]}, {"id": "EX-040", "area": 2, "subarea": "Derecho Penal (parte especial)", "tema": "Homicidio y asesinato", "resultado": "Distingue homicidio de asesinato por sus circunstancias.", "demanda": "Analizar", "enunciado": "Una persona mata a otra con alevosía, aprovechando que la víctima dormía y sin posibilidad de defensa. ¿Qué delito se configura?", "opciones": [{"texto": "Asesinato, porque se mata con alevosía y aprovechando la indefensión de la víctima.", "justificacion": "Correcta. El asesinato se configura cuando se mata con circunstancias como la alevosía. Base legal: art. 140 del Código Orgánico Integral Penal."}, {"texto": "Homicidio culposo, porque no hubo intención de matar sino negligencia al usar un arma.", "justificacion": "Incorrecta. Hay dolo y alevosía, no culpa ni negligencia."}, {"texto": "Homicidio simple, porque toda muerte causada por otra persona es homicidio sin agravantes.", "justificacion": "Incorrecta. La alevosía califica el hecho y lo distingue del homicidio simple."}, {"texto": "Lesiones graves, porque la víctima no pudo defenderse y el resultado fue una lesión mortal.", "justificacion": "Incorrecta. El resultado es la muerte, no una lesión; el tipo es contra la vida."}], "correcta": 0, "referencias": ["COIP"]}, {"id": "EX-041", "area": 2, "subarea": "Derecho Penal (parte especial)", "tema": "Femicidio", "resultado": "Identifica los elementos del femicidio.", "demanda": "Aplicar", "enunciado": "Un hombre mata a su expareja por celos y por su condición de mujer, en un contexto de relaciones de poder y violencia previa. ¿Qué delito se configura?", "opciones": [{"texto": "Femicidio, porque se da muerte a una mujer por su condición de género en relaciones de poder.", "justificacion": "Correcta. El femicidio exige matar a una mujer por su condición de género, en contexto de poder o violencia. Base legal: art. 141 del Código Orgánico Integral Penal."}, {"texto": "Homicidio, porque la muerte de una mujer por su pareja se sanciona como homicidio simple.", "justificacion": "Incorrecta. Cuando se mata a una mujer por su condición de género en relaciones de poder, el tipo es femicidio."}, {"texto": "Asesinato, porque hubo violencia previa y la víctima era expareja del autor del hecho.", "justificacion": "Incorrecta. Aunque puede concurrir alevosía, el tipo específico por género es el femicidio."}, {"texto": "Violencia psicológica, porque la muerte fue precedida de celos y violencia en la relación.", "justificacion": "Incorrecta. La violencia psicológica no abarca el resultado de muerte; el tipo es femicidio."}], "correcta": 0, "referencias": ["COIP"]}, {"id": "EX-042", "area": 2, "subarea": "Derecho Penal (parte especial)", "tema": "Lesiones", "resultado": "Califica lesiones según su gravedad y resultado.", "demanda": "Comprender", "enunciado": "Tras una agresión, la víctima queda con una incapacidad para trabajar de 45 días, sin enfermedad grave ni pérdida de órgano. ¿Cómo se califican las lesiones?", "opciones": [{"texto": "Lesiones con incapacidad de 31 a 90 días, sancionadas en el art. 152 num. 3.", "justificacion": "Correcta. El art. 152 del Código Orgánico Integral Penal gradúa las lesiones por los días de incapacidad: de 31 a 90 días corresponde el numeral 3."}, {"texto": "Lesiones con incapacidad de 9 a 30 días, del art. 152 num. 2 del COIP.", "justificacion": "Incorrecta. Ese numeral cubre incapacidades de 9 a 30 días; aquí son 45."}, {"texto": "Contravención de lesiones, porque no hubo pérdida de un órgano ni secuela.", "justificacion": "Incorrecta. La contravención de lesiones se limita a incapacidades de hasta tres días."}, {"texto": "Lesiones con grave enfermedad o incapacidad permanente, del art. 152 num. 4.", "justificacion": "Incorrecta. Ese supuesto exige grave enfermedad o incapacidad mayor a noventa días."}], "correcta": 0, "referencias": ["COIP"]}, {"id": "EX-043", "area": 2, "subarea": "Derecho Penal (parte especial)", "tema": "Hurto y robo", "resultado": "Distingue hurto de robo por el uso de violencia.", "demanda": "Comprender", "enunciado": "Una persona sustrae un celular del bolsillo de la víctima sin que esta se dé cuenta y sin usar violencia ni amenaza. ¿Qué delito comete?", "opciones": [{"texto": "Hurto, porque hubo apoderamiento de bien ajeno sin violencia, amenaza ni fuerza.", "justificacion": "Correcta. El hurto es el apoderamiento de bien ajeno sin violencia, amenaza o fuerza en las cosas o personas. Base legal: art. 196-189 del Código Orgánico Integral Penal."}, {"texto": "Robo, porque toda sustracción de un bien ajeno sin consentimiento es robo.", "justificacion": "Incorrecta. El robo exige violencia, amenaza o fuerza; sin ellas, el tipo es hurto."}, {"texto": "Estafa, porque la víctima fue engañada para entregar el celular sin darse cuenta.", "justificacion": "Incorrecta. No hubo engaño para obtener la entrega; hubo apoderamiento subrepticio."}, {"texto": "Abuso de confianza, porque la víctima había confiado el celular al autor del hecho.", "justificacion": "Incorrecta. No hubo entrega en confianza; el autor tomó el bien sin que la víctima lo entregara."}], "correcta": 0, "referencias": ["COIP"]}, {"id": "EX-044", "area": 2, "subarea": "Derecho Penal (parte especial)", "tema": "Estafa", "resultado": "Identifica los elementos de la estafa.", "demanda": "Aplicar", "enunciado": "Una persona vende un vehículo con documentos falsos, haciendo creer al comprador que es de su propiedad y sin gravámenes, y recibe el pago. ¿Qué delito comete?", "opciones": [{"texto": "Estafa, porque obtuvo el pago induciendo a error a la víctima mediante engaño.", "justificacion": "Correcta. La estafa exige engaño, error, disposición patrimonial y perjuicio. Base legal: art. 186 del Código Orgánico Integral Penal."}, {"texto": "Hurto, por apoderarse del dinero sin que el comprador lo advirtiera.", "justificacion": "Incorrecta. El comprador entregó voluntariamente el dinero, inducido por engaño, no hubo sustracción."}, {"texto": "Abuso de confianza, porque el comprador confió en la palabra del vendedor.", "justificacion": "Incorrecta. El abuso de confianza exige que se entregue un bien para un fin y se lo desvíe; aquí hubo engaño inicial."}, {"texto": "Solo falsificación, porque el delito consiste en adulterar los documentos.", "justificacion": "Incorrecta. La falsificación puede concurrir, pero el engaño patrimonial configura estafa."}], "correcta": 0, "referencias": ["COIP"]}, {"id": "EX-045", "area": 2, "subarea": "Derecho Penal (parte especial)", "tema": "Delitos sexuales", "resultado": "Distingue violación de abuso sexual.", "demanda": "Comprender", "enunciado": "Una persona accede carnalmente a otra mediante violencia y sin consentimiento. ¿Qué delito se configura?", "opciones": [{"texto": "Violación, porque hubo acceso carnal obtenido mediante violencia.", "justificacion": "Correcta. Es violación el acceso carnal con introducción total o parcial del miembro viril u otros objetos, cuando se usa violencia, amenaza o intimidación (art. 171 del Código Orgánico Integral Penal)."}, {"texto": "Abuso sexual, porque toda agresión sexual sin consentimiento es abuso.", "justificacion": "Incorrecta. El abuso sexual (art. 170) no comprende el acceso carnal."}, {"texto": "Acoso sexual, porque se usó violencia para obtener un acto sexual.", "justificacion": "Incorrecta. El acoso sexual (art. 166) consiste en solicitar actos de naturaleza sexual aprovechando una situación de autoridad o confianza."}, {"texto": "Estupro, porque la víctima no consintió el acceso carnal.", "justificacion": "Incorrecta. El estupro (art. 167) supone engaño a una persona mayor de catorce y menor de dieciocho años, no violencia."}], "correcta": 0, "referencias": ["COIP"]}, {"id": "EX-046", "area": 2, "subarea": "Derecho Penal (parte especial)", "tema": "Peculado", "resultado": "Identifica los elementos del peculado.", "demanda": "Aplicar", "enunciado": "Un servidor público a cargo de fondos de una institución se apropia de parte de ellos para uso personal. ¿Qué delito comete?", "opciones": [{"texto": "Peculado, porque el servidor se apropió de fondos públicos que tenía a su cargo por su función.", "justificacion": "Correcta. El peculado es la apropiación de bienes o fondos públicos por el servidor que los tiene a su cargo. Base legal: art. 278 del Código Orgánico Integral Penal."}, {"texto": "Cohecho, porque recibió un beneficio económico por el ejercicio de su cargo público.", "justificacion": "Incorrecta. El cohecho exige recibir dádiva para hacer u omitir un acto del cargo; aquí hay apropiación."}, {"texto": "Concusión, porque exigió un pago indebido a un ciudadano para realizar un trámite.", "justificacion": "Incorrecta. La concusión exige exigir indebidamente; aquí el servidor se apropia de fondos públicos."}, {"texto": "Enriquecimiento ilícito, porque su patrimonio aumentó sin justificar el origen de los fondos.", "justificacion": "Incorrecta. El enriquecimiento ilícito exige incremento injustificado, pero el tipo específico es peculado."}], "correcta": 0, "referencias": ["COIP"]}, {"id": "EX-047", "area": 2, "subarea": "Derecho Penal (parte especial)", "tema": "Violencia contra la mujer", "resultado": "Aplica la violencia de género en el ámbito intrafamiliar.", "demanda": "Aplicar", "enunciado": "En el hogar, un hombre agrede físicamente de forma habitual a su conviviente, causándole lesiones que requieren 10 días de incapacidad. ¿Cómo debe calificarse?", "opciones": [{"texto": "Violencia física contra la mujer o miembros del núcleo familiar.", "justificacion": "Correcta. La violencia física en el núcleo familiar tiene tipo específico por el vínculo y contexto. Base legal: art. 156 del Código Orgánico Integral Penal."}, {"texto": "Lesiones leves comunes, porque la incapacidad es menor a treinta días.", "justificacion": "Incorrecta. El contexto intrafamiliar y de género incide en la calificación y no es una lesión común."}, {"texto": "Solo una contravención, porque toda agresión en el hogar lo es.", "justificacion": "Incorrecta. Según la gravedad y habitualidad, puede ser delito; no toda agresión doméstica es contravención."}, {"texto": "Lesiones culposas, porque buscaba corregir a la conviviente.", "justificacion": "Incorrecta. Hay dolo de lesionar; la intención de corregir no excluye el dolo ni la tipicidad."}], "correcta": 0, "referencias": ["COIP"]}, {"id": "EX-048", "area": 2, "subarea": "Derecho Procesal Penal", "tema": "Investigación previa e instrucción", "resultado": "Distingue investigación previa de instrucción fiscal.", "demanda": "Comprender", "enunciado": "La Fiscalía recibe una denuncia por un presunto delito y realiza diligencias para verificar si existen elementos para imputar. Aún no hay formulación de cargos. ¿En qué fase está?", "opciones": [{"texto": "Investigación previa.", "justificacion": "Correcta. La investigación previa precede a la formulación de cargos y busca elementos de convicción. Base legal: arts. 580 y 591 del Código Orgánico Integral Penal."}, {"texto": "Instrucción fiscal.", "justificacion": "Incorrecta. La instrucción inicia con la formulación de cargos, no con las primeras diligencias."}, {"texto": "Etapa de juicio.", "justificacion": "Incorrecta. La etapa de juicio es posterior, ante el tribunal, con prueba ya anunciada."}, {"texto": "Etapa de evaluación y preparatoria de juicio ante el juez.", "justificacion": "Incorrecta. La evaluación requiere instrucción previa y dictamen fiscal, que aún no existen."}], "correcta": 0, "referencias": ["COIP"]}, {"id": "EX-049", "area": 2, "subarea": "Derecho Procesal Penal", "tema": "Prisión preventiva", "resultado": "Aplica los requisitos de la prisión preventiva.", "demanda": "Analizar", "enunciado": "El fiscal solicita prisión preventiva, pero solo presenta la denuncia y no acredita elementos de convicción sobre la existencia del delito ni la participación. ¿Debe concederla el juez?", "opciones": [{"texto": "No, porque no se cumplen los requisitos de elementos de convicción, necesidad y proporcionalidad.", "justificacion": "Correcta. La prisión preventiva exige elementos de convicción, necesidad, proporcionalidad y que no haya otra medida. Base legal: art. 77 de la Constitución de la República; art. 534 del Código Orgánico Integral Penal."}, {"texto": "Sí, porque la gravedad del delito justifica por sí sola la prisión preventiva del procesado.", "justificacion": "Incorrecta. La gravedad no basta; se requieren elementos de convicción y necesidad de la medida."}, {"texto": "Sí, porque la Fiscalía siempre puede solicitarla y el juez debe acogerla para asegurar el proceso.", "justificacion": "Incorrecta. El juez debe verificar los requisitos; no es automática por solicitud fiscal."}, {"texto": "No, porque la prisión preventiva está prohibida en todos los casos por la Constitución.", "justificacion": "Incorrecta. No está prohibida; es excepcional y debe cumplir requisitos legales y constitucionales."}], "correcta": 0, "referencias": ["CRE", "COIP"]}, {"id": "EX-050", "area": 2, "subarea": "Derecho Procesal Penal", "tema": "Medidas cautelares alternativas", "resultado": "Identifica medidas alternativas a la prisión preventiva.", "demanda": "Comprender", "enunciado": "En un delito sancionado con pena menor a cinco años, sin riesgo de fuga acreditado, el juez busca asegurar la presencia del procesado sin privarlo de libertad. ¿Qué puede disponer?", "opciones": [{"texto": "Prohibición de salida del país y presentación periódica, como medidas alternativas a la prisión.", "justificacion": "Correcta. Son medidas cautelares personales alternativas que aseguran el proceso sin privar de libertad. Base legal: art. 522 del Código Orgánico Integral Penal."}, {"texto": "Prisión preventiva obligatoria, porque es la única medida que asegura la comparecencia del procesado.", "justificacion": "Incorrecta. La prisión preventiva es excepcional; existen medidas alternativas menos gravosas."}, {"texto": "Detención con fines investigativos por 24 horas, como medida cautelar permanente hasta el juicio.", "justificacion": "Incorrecta. La detención investigativa es temporal y no es medida cautelar para asegurar el proceso."}, {"texto": "Arresto domiciliario con vigilancia, porque es la única alternativa permitida por el COIP.", "justificacion": "Incorrecta. Existen varias medidas alternativas, no solo el arresto domiciliario."}], "correcta": 0, "referencias": ["COIP"]}, {"id": "EX-051", "area": 2, "subarea": "Derecho Procesal Penal", "tema": "Procedimiento abreviado", "resultado": "Identifica los requisitos del procedimiento abreviado.", "demanda": "Aplicar", "enunciado": "Un procesado por un delito con pena máxima de diez años admite el hecho y consiente libremente el procedimiento abreviado que propone la Fiscalía antes de la audiencia preparatoria de juicio. ¿Procede?", "opciones": [{"texto": "Sí: la pena no supera diez años y hay admisión y consentimiento.", "justificacion": "Correcta. El procedimiento abreviado procede en infracciones con pena máxima de hasta diez años, con admisión del hecho y consentimiento expreso del procesado; puede proponerse desde la formulación de cargos hasta la audiencia preparatoria de juicio (art. 635 del Código Orgánico Integral Penal)."}, {"texto": "No: el abreviado solo procede en delitos con pena de hasta cinco años.", "justificacion": "Incorrecta. El límite de cinco años corresponde al procedimiento directo (art. 640)."}, {"texto": "No, porque la víctima debe aprobar expresamente el acuerdo.", "justificacion": "Incorrecta. La víctima puede ser escuchada, pero su aprobación no es requisito."}, {"texto": "No, porque solo cabe antes de la formulación de cargos.", "justificacion": "Incorrecta. Se propone desde la formulación de cargos, no antes."}], "correcta": 0, "referencias": ["COIP"]}, {"id": "EX-052", "area": 2, "subarea": "Derecho Procesal Penal", "tema": "Presunción de inocencia", "resultado": "Aplica la presunción de inocencia y la carga de la prueba.", "demanda": "Comprender", "enunciado": "En juicio, la Fiscalía no logra probar la participación del acusado, pero el tribunal lo condena por sospechas y antecedentes. ¿Qué principio se vulnera?", "opciones": [{"texto": "Presunción de inocencia, porque la culpabilidad debe probarse y la duda favorece al acusado.", "justificacion": "Correcta. La presunción de inocencia exige prueba de culpabilidad; la duda se resuelve a favor del procesado. Base legal: art. 76.2 de la Constitución de la República; art. 5.4 del Código Orgánico Integral Penal."}, {"texto": "Principio de legalidad, porque el delito no estaba tipificado al momento de los hechos.", "justificacion": "Incorrecta. El problema no es la falta de tipificación, sino la condena sin prueba de culpabilidad."}, {"texto": "Principio de inmediación, porque el juez no estuvo presente en todas las audiencias del juicio.", "justificacion": "Incorrecta. No hay datos de ausencia del juez; el vicio es la falta de prueba de culpabilidad."}, {"texto": "Principio de publicidad, porque el juicio no fue público y la sentencia no se motivó.", "justificacion": "Incorrecta. No hay datos de falta de publicidad; el vicio es condenar sin prueba suficiente."}], "correcta": 0, "referencias": ["CRE", "COIP"]}, {"id": "EX-053", "area": 2, "subarea": "Derecho Procesal Penal", "tema": "Prueba ilícita", "resultado": "Identifica la exclusión de la prueba obtenida con vulneración de derechos.", "demanda": "Analizar", "enunciado": "La policía ingresa a un domicilio sin orden judicial ni flagrancia y obtiene documentos que incriminan al procesado. La defensa pide excluirlos. ¿Qué corresponde?", "opciones": [{"texto": "Excluirlos, porque la prueba obtenida con vulneración de derechos carece de eficacia probatoria.", "justificacion": "Correcta. La prueba obtenida con violación de derechos constitucionales no tiene eficacia probatoria. Base legal: art. 76.4 de la Constitución de la República; art. 454.6 del Código Orgánico Integral Penal."}, {"texto": "Admitirlos, porque la prueba es útil y demuestra la culpabilidad del procesado.", "justificacion": "Incorrecta. La utilidad no sana la vulneración de derechos en la obtención de la prueba."}, {"texto": "Admitirlos si el fiscal los ratifica, porque la ratificación fiscal convalida la prueba ilícita.", "justificacion": "Incorrecta. La ratificación no convalida la vulneración de derechos en la obtención de la prueba."}, {"texto": "Valorarlos con menor peso, porque aunque se obtuvieron sin orden, son documentos auténticos.", "justificacion": "Incorrecta. No se atenúa su valor; la prueba ilícita se excluye, no se valora con menor peso."}], "correcta": 0, "referencias": ["CRE", "COIP"]}, {"id": "EX-054", "area": 2, "subarea": "Derecho Procesal Penal", "tema": "Recurso de apelación", "resultado": "Distingue apelación de casación en materia penal.", "demanda": "Comprender", "enunciado": "Una parte considera que la sentencia de primer nivel valoró mal la prueba y aplicó mal la ley. Quiere que se revise el fondo. ¿Qué recurso debe interponer?", "opciones": [{"texto": "Apelación, porque permite revisar hechos, prueba y derecho ante el superior.", "justificacion": "Correcta. La apelación permite la revisión integral de hechos, prueba y derecho por el superior. Base legal: art. 653-657 del Código Orgánico Integral Penal."}, {"texto": "Casación, porque permite revisar la valoración de la prueba y los hechos del caso.", "justificacion": "Incorrecta. La casación revisa errores de derecho, no revalora prueba ni hechos."}, {"texto": "Acción extraordinaria de protección, porque permite revisar la valoración de prueba en todo proceso.", "justificacion": "Incorrecta. Esta garantía no revisa valoración de prueba, solo vulneración de derechos constitucionales."}, {"texto": "Revisión, porque permite revisar sentencias ejecutoriadas por errores de hecho y derecho.", "justificacion": "Incorrecta. La revisión procede contra sentencias ejecutoriadas y por causales específicas, no es el recurso ordinario."}], "correcta": 0, "referencias": ["COIP"]}, {"id": "EX-055", "area": 2, "subarea": "Derecho Procesal Penal", "tema": "Procedimiento directo", "resultado": "Identifica cuándo procede el procedimiento directo.", "demanda": "Comprender", "enunciado": "Una persona es aprehendida en delito flagrante por un delito sancionado con pena máxima de 5 años. La Fiscalía quiere concentrar el proceso en una sola audiencia. ¿Qué procedimiento corresponde?", "opciones": [{"texto": "Procedimiento directo, porque concentra el proceso en una audiencia por flagrancia y pena máxima.", "justificacion": "Correcta. El procedimiento directo procede en flagrancia para delitos con pena máxima de 5 años. Base legal: art. 640 del Código Orgánico Integral Penal."}, {"texto": "Procedimiento ordinario, porque todo delito flagrante debe seguir el trámite ordinario completo.", "justificacion": "Incorrecta. Para flagrancia con pena máxima de 5 años, el COIP prevé el procedimiento directo concentrado."}, {"texto": "Procedimiento abreviado, porque requiere la admisión del hecho por parte del procesado.", "justificacion": "Incorrecta. El abreviado exige admisión y acuerdo; el directo se basa en la flagrancia y la pena."}, {"texto": "Procedimiento para ejercicio privado, porque la flagrancia siempre implica acción penal privada.", "justificacion": "Incorrecta. La flagrancia no convierte la acción en privada; la acción sigue siendo pública en este caso."}], "correcta": 0, "referencias": ["COIP"]}, {"id": "EX-056", "area": 2, "subarea": "Derecho Procesal Penal", "tema": "Etapa de juicio", "resultado": "Identifica el objeto de la etapa de evaluación y preparatoria.", "demanda": "Comprender", "enunciado": "Concluida la instrucción, el fiscal emite dictamen acusatorio y el juez convoca a audiencia. ¿Qué debe resolver el juez en esa audiencia?", "opciones": [{"texto": "Resolver si hay mérito para llamar a juicio con base en el dictamen.", "justificacion": "Correcta. En la etapa preparatoria el juez decide si llama a juicio o dicta sobreseimiento. Base legal: art. 601-608 del Código Orgánico Integral Penal."}, {"texto": "Dictar sentencia condenatoria, porque ya existe dictamen acusatorio del fiscal.", "justificacion": "Incorrecta. La sentencia corresponde a la etapa de juicio, no a la preparatoria."}, {"texto": "Ordenar la prisión preventiva, porque es obligatoria cuando hay dictamen acusatorio.", "justificacion": "Incorrecta. La prisión preventiva no es automática; debe verificar sus requisitos."}, {"texto": "Practicar toda la prueba, porque en esa audiencia se actúa la prueba del juicio.", "justificacion": "Incorrecta. La prueba se practica en juicio; en preparatoria solo se anuncia y se depura."}], "correcta": 0, "referencias": ["COIP"]}, {"id": "EX-057", "area": 2, "subarea": "Derecho Penal (parte especial)", "tema": "Delitos contra la administración", "resultado": "Distingue cohecho de concusión.", "demanda": "Analizar", "enunciado": "Un funcionario recibe dinero de un particular para agilizar un trámite que debía realizar sin pago adicional. ¿Qué delito comete el funcionario?", "opciones": [{"texto": "Cohecho, porque recibió una dádiva para realizar un acto propio de su cargo.", "justificacion": "Correcta. El cohecho es recibir o aceptar dádiva para hacer u omitir un acto del cargo. Base legal: art. 280 del Código Orgánico Integral Penal."}, {"texto": "Concusión, porque exigió al particular un pago indebido para realizar el trámite.", "justificacion": "Incorrecta. La concusión exige exigir; aquí el funcionario recibió, no exigió el pago."}, {"texto": "Peculado, porque se apropió de fondos públicos que tenía a su cargo.", "justificacion": "Incorrecta. No hubo apropiación de fondos públicos, sino recepción de dádiva por el cargo."}, {"texto": "Tráfico de influencias, porque usó su influencia para obtener un beneficio económico.", "justificacion": "Incorrecta. El tráfico de influencias exige influir en otro servidor; aquí recibió directamente."}], "correcta": 0, "referencias": ["COIP"]}, {"id": "EX-058", "area": 3, "subarea": "Derecho Procesal (COGEP)", "tema": "Demanda", "resultado": "Identifica los requisitos de la demanda en el COGEP.", "demanda": "Comprender", "enunciado": "Un actor presenta demanda sin señalar el domicilio del demandado ni precisar su pretensión. El juez la califica. ¿Qué debe hacer?", "opciones": [{"texto": "Mandar a completarla en el plazo legal, porque la demanda debe cumplir los requisitos del COGEP.", "justificacion": "Correcta. Si la demanda no cumple requisitos, el juez manda a completarla en el término previsto. Base legal: art. 142-146 del Código Orgánico General de Procesos."}, {"texto": "Admitirla, porque el juez debe suplir de oficio los defectos de la demanda presentada.", "justificacion": "Incorrecta. El juez no suple la pretensión ni el domicilio; debe mandar a completar."}, {"texto": "Rechazarla definitivamente, porque toda demanda incompleta es improcedente sin subsanación.", "justificacion": "Incorrecta. El COGEP permite mandar a completar la demanda en plazo, no rechazarla de plano."}, {"texto": "Archivarla, porque la falta de domicilio impide citar y extingue la acción del actor.", "justificacion": "Incorrecta. La falta de domicilio no extingue la acción; se concede plazo para completarla."}], "correcta": 0, "referencias": ["COGEP"]}, {"id": "EX-059", "area": 3, "subarea": "Derecho Procesal (COGEP)", "tema": "Contestación y reconvención", "resultado": "Distingue contestación de reconvención.", "demanda": "Comprender", "enunciado": "El demandado, al contestar, no solo se opone a la pretensión, sino que demanda al actor el pago de una deuda relacionada. ¿Qué figura ejerció?", "opciones": [{"texto": "Reconvención.", "justificacion": "Correcta. La reconvención es la demanda que el demandado formula contra el actor en el mismo juicio. Base legal: art. 154 del Código Orgánico General de Procesos."}, {"texto": "Excepción previa.", "justificacion": "Incorrecta. La excepción previa busca impedir o depurar el proceso, no demandar al actor."}, {"texto": "Allanamiento.", "justificacion": "Incorrecta. El allanamiento es aceptar la pretensión, no plantear una pretensión contraria."}, {"texto": "Tercería.", "justificacion": "Incorrecta. La tercería la plantea un tercero, no el demandado contra el actor."}], "correcta": 0, "referencias": ["COGEP"]}, {"id": "EX-060", "area": 3, "subarea": "Derecho Procesal (COGEP)", "tema": "Prueba", "resultado": "Aplica la carga de la prueba en el COGEP.", "demanda": "Aplicar", "enunciado": "En un juicio por incumplimiento de contrato, el actor afirma que entregó la mercadería y el demandado niega haberla recibido. ¿Quién debe probar la entrega?", "opciones": [{"texto": "El actor, porque quien alega un hecho debe probar su existencia en el proceso.", "justificacion": "Correcta. La carga de la prueba corresponde a quien afirma un hecho que sustenta su pretensión. Base legal: art. 169 del Código Orgánico General de Procesos."}, {"texto": "El demandado, porque quien niega un hecho debe probar que no ocurrió la entrega.", "justificacion": "Incorrecta. La negativa simple no invierte la carga; quien afirma debe probar."}, {"texto": "El juez, porque debe investigar de oficio todos los hechos alegados por las partes.", "justificacion": "Incorrecta. El juez valora la prueba, pero la carga corresponde a quien alega el hecho."}, {"texto": "El perito, porque la entrega de mercadería solo se prueba con informe pericial obligatorio.", "justificacion": "Incorrecta. No toda entrega exige pericia; puede probarse con documentos, testigos u otros medios."}], "correcta": 0, "referencias": ["COGEP"]}, {"id": "EX-061", "area": 3, "subarea": "Derecho Procesal (COGEP)", "tema": "Procedimiento ordinario", "resultado": "Identifica las audiencias del procedimiento ordinario.", "demanda": "Comprender", "enunciado": "En un juicio ordinario por cobro de una deuda de alta cuantía, ¿cuántas audiencias prevé el COGEP y cuáles son?", "opciones": [{"texto": "Dos audiencias: preliminar y de juicio, con fases de saneamiento, prueba y sentencia.", "justificacion": "Correcta. El ordinario tiene audiencia preliminar y audiencia de juicio, con sus fases respectivas. Base legal: art. 289-297 del Código Orgánico General de Procesos."}, {"texto": "Una sola audiencia única, donde se resuelven excepciones, prueba y sentencia.", "justificacion": "Incorrecta. La audiencia única es propia del sumario, no del ordinario."}, {"texto": "Ninguna audiencia, porque el ordinario es escrito y se resuelve sin audiencias orales.", "justificacion": "Incorrecta. El COGEP es oral por audiencias; el ordinario sí tiene audiencias."}, {"texto": "Tres audiencias: conciliación, prueba y alegatos, todas separadas en días distintos.", "justificacion": "Incorrecta. El COGEP no prevé tres audiencias para el ordinario; son dos."}], "correcta": 0, "referencias": ["COGEP"]}, {"id": "EX-063", "area": 3, "subarea": "Derecho Procesal (COGEP)", "tema": "Procedimiento ejecutivo", "resultado": "Identifica el título ejecutivo y su exigibilidad.", "demanda": "Aplicar", "enunciado": "Se demanda en vía ejecutiva con una letra de cambio vencida, líquida y exigible, con firma no negada. ¿Procede la vía ejecutiva?", "opciones": [{"texto": "Sí procede, porque la letra de cambio es título ejecutivo de una obligación exigible.", "justificacion": "Correcta. El título ejecutivo debe contener obligación clara, pura, determinada y actualmente exigible. Base legal: art. 347 del Código Orgánico General de Procesos."}, {"texto": "No procede, porque la letra de cambio debe demandarse siempre en vía ordinaria.", "justificacion": "Incorrecta. La letra de cambio es título ejecutivo y habilita la vía ejecutiva."}, {"texto": "No procede, porque la vía ejecutiva exige sentencia previa que declare la deuda.", "justificacion": "Incorrecta. La vía ejecutiva parte del título, no requiere sentencia previa."}, {"texto": "Sí procede, porque toda deuda vencida puede cobrarse en vía ejecutiva sin título.", "justificacion": "Incorrecta. Sin título ejecutivo no procede la vía ejecutiva; se requiere el documento calificado."}], "correcta": 0, "referencias": ["COGEP"]}, {"id": "EX-064", "area": 3, "subarea": "Derecho Procesal (COGEP)", "tema": "Procedimiento monitorio", "resultado": "Aplica los requisitos del procedimiento monitorio.", "demanda": "Aplicar", "enunciado": "Un arrendador quiere cobrar cánones de arriendo vencidos por 8.000 dólares, sin título ejecutivo, con documentos que prueban la deuda. ¿Qué vía es idónea?", "opciones": [{"texto": "Monitorio, por ser una deuda dineraria líquida sin título ejecutivo.", "justificacion": "Correcta. El monitorio procede para deudas de dinero determinadas, líquidas, exigibles y de plazo vencido, de hasta cincuenta salarios básicos unificados, que no consten en título ejecutivo (art. 356 del Código Orgánico General de Procesos)."}, {"texto": "Ordinario, porque toda deuda sin título debe tramitarse por esa vía.", "justificacion": "Incorrecta. Existe una vía específica más ágil: el monitorio."}, {"texto": "Ejecutivo, porque los documentos de la deuda bastan como título.", "justificacion": "Incorrecta. Solo los documentos del art. 347 del Código Orgánico General de Procesos son títulos ejecutivos."}, {"texto": "Ninguna, porque los cánones vencidos no pueden cobrarse judicialmente.", "justificacion": "Incorrecta. Los cánones vencidos son exigibles judicialmente."}], "correcta": 0, "referencias": ["COGEP"]}, {"id": "EX-065", "area": 3, "subarea": "Derecho Procesal (COGEP)", "tema": "Recursos", "resultado": "Distingue apelación de casación en materia civil.", "demanda": "Comprender", "enunciado": "Una parte considera que la sentencia de segunda instancia aplicó indebidamente una norma de derecho sustantivo. ¿Qué recurso procede?", "opciones": [{"texto": "Casación.", "justificacion": "Correcta. La casación procede contra sentencias de segunda instancia por indebida aplicación del derecho. Base legal: art. 266-270 del Código Orgánico General de Procesos."}, {"texto": "Apelación.", "justificacion": "Incorrecta. La apelación ya se agotó en segunda instancia; aquí se cuestiona derecho sustantivo."}, {"texto": "Revisión.", "justificacion": "Incorrecta. La revisión procede por causales específicas contra sentencias ejecutoriadas, no es el recurso ordinario."}, {"texto": "Aclaración.", "justificacion": "Incorrecta. La aclaración solo aclara obscuridades, no corrige la aplicación del derecho."}], "correcta": 0, "referencias": ["COGEP"]}, {"id": "EX-066", "area": 3, "subarea": "Derecho Procesal (COGEP)", "tema": "Ejecución", "resultado": "Identifica la fase de ejecución de sentencia.", "demanda": "Comprender", "enunciado": "Tras sentencia ejecutoriada que ordena pagar una suma, el deudor no cumple voluntariamente. ¿Qué debe hacer el acreedor?", "opciones": [{"texto": "Pedir la ejecución forzosa de la sentencia ante el juez de primera instancia.", "justificacion": "Correcta. La sentencia ejecutoriada es título de ejecución (art. 363 del Código Orgánico General de Procesos) y su cumplimiento se exige en la fase de ejecución, sin necesidad de un nuevo juicio."}, {"texto": "Iniciar un juicio ordinario para que se declare de nuevo la deuda.", "justificacion": "Incorrecta. No se requiere nuevo juicio; la sentencia ya declaró la obligación."}, {"texto": "Interponer casación, porque la falta de pago es un error de derecho.", "justificacion": "Incorrecta. La casación no ejecuta; impugna la aplicación del derecho, no la falta de pago."}, {"texto": "Pedir la nulidad de la sentencia por no haber sido cumplida.", "justificacion": "Incorrecta. El incumplimiento no anula la sentencia; habilita su ejecución forzosa."}], "correcta": 0, "referencias": ["COGEP"]}, {"id": "EX-067", "area": 3, "subarea": "Métodos Alternativos", "tema": "Mediación - Principios", "resultado": "Identifica los principios de la mediación.", "demanda": "Comprender", "enunciado": "En una mediación, el mediador debe permitir que las partes decidan libremente si llegan a un acuerdo, sin imponerles una solución. ¿Qué principio aplica?", "opciones": [{"texto": "Voluntariedad: las partes deciden si llegan o no a un acuerdo.", "justificacion": "Correcta. La mediación se basa en la voluntariedad y en que las partes construyen su propio acuerdo. Base legal: art. 43-44 de la Ley de Arbitraje y Mediación."}, {"texto": "Obligatoriedad: las partes deben llegar necesariamente a un acuerdo.", "justificacion": "Incorrecta. Nadie está obligado a acordar; la mediación es voluntaria."}, {"texto": "Publicidad: todo lo dicho en la mediación debe hacerse público.", "justificacion": "Incorrecta. La mediación es confidencial, no pública."}, {"texto": "Contradicción: el mediador decide cuál de las partes tiene razón.", "justificacion": "Incorrecta. El mediador no decide; facilita que las partes lleguen a un acuerdo."}], "correcta": 0, "referencias": ["LAM"]}, {"id": "EX-069", "area": 3, "subarea": "Métodos Alternativos", "tema": "Arbitraje - Convenio", "resultado": "Identifica los requisitos del convenio arbitral.", "demanda": "Comprender", "enunciado": "Dos empresas acuerdan por escrito someter sus controversias sobre un contrato a arbitraje, antes de que surja el conflicto. ¿Qué celebraron?", "opciones": [{"texto": "Una cláusula compromisoria, porque el pacto es previo al conflicto.", "justificacion": "Correcta. El convenio arbitral es el acuerdo escrito para someter a arbitraje controversias surgidas o que puedan surgir (art. 5 de la Ley de Arbitraje y Mediación); cuando se pacta antes del conflicto, la doctrina lo denomina cláusula compromisoria."}, {"texto": "Un acta de mediación, porque acordaron resolver sin acudir a un juez.", "justificacion": "Incorrecta. El acta de mediación es el resultado de mediar, no el pacto previo de arbitraje."}, {"texto": "Un compromiso arbitral, porque someten una controversia ya existente.", "justificacion": "Incorrecta. El compromiso se celebra cuando ya existe controversia; aquí es previo."}, {"texto": "Una transacción, porque terminaron un litigio con concesiones mutuas.", "justificacion": "Incorrecta. La transacción pone fin a un litigio; aquí solo pactan la vía arbitral futura."}], "correcta": 0, "referencias": ["LAM"]}, {"id": "EX-070", "area": 3, "subarea": "Métodos Alternativos", "tema": "Arbitraje - Laudo", "resultado": "Determina el efecto del laudo arbitral.", "demanda": "Comprender", "enunciado": "Un tribunal arbitral dicta un laudo que resuelve el fondo de la controversia. Una parte quiere desconocerlo alegando que no es sentencia. ¿Qué efecto tiene el laudo?", "opciones": [{"texto": "Tiene efecto de sentencia ejecutoriada y de cosa juzgada entre las partes.", "justificacion": "Correcta. El laudo arbitral tiene efecto de sentencia ejecutoriada y cosa juzgada. Base legal: art. 190 de la Constitución de la República; art. 30-32 de la Ley de Arbitraje y Mediación."}, {"texto": "Es una opinión técnica, sin obligatoriedad para las partes en conflicto.", "justificacion": "Incorrecta. El laudo es obligatorio y tiene efecto de sentencia ejecutoriada."}, {"texto": "Es un acuerdo de mediación que solo obliga si lo ratifica un juez civil.", "justificacion": "Incorrecta. El laudo no es mediación; es decisión del tribunal arbitral con fuerza de sentencia."}, {"texto": "Es nulo, porque solo los jueces de la Función Judicial dictan sentencias.", "justificacion": "Incorrecta. La Constitución reconoce el arbitraje como medio alternativo con laudo vinculante."}], "correcta": 0, "referencias": ["CRE", "LAM"]}, {"id": "EX-071", "area": 3, "subarea": "Métodos Alternativos", "tema": "Justicia de paz y negociación", "resultado": "Distingue mediación de justicia de paz.", "demanda": "Comprender", "enunciado": "En una comunidad, un juez de paz ayuda a vecinos a resolver un conflicto de linderos, proponiendo soluciones y buscando un acuerdo. ¿Qué caracteriza a la justicia de paz?", "opciones": [{"texto": "Busca resolver conflictos comunitarios mediante acuerdo y equidad.", "justificacion": "Correcta. Las juezas y jueces de paz resuelven en equidad conflictos individuales, comunitarios, vecinales y contravenciones, procurando primero el acuerdo, y no se requiere patrocinio de abogado (art. 189 de la Constitución)."}, {"texto": "El juez de paz decide con sentencia obligatoria sin escuchar a las partes.", "justificacion": "Incorrecta. El juez de paz busca el acuerdo, no impone sentencia sin escuchar."}, {"texto": "Exige abogado y se tramita igual que un juicio ordinario civil.", "justificacion": "Incorrecta. La justicia de paz es sencilla, comunitaria y no exige formalidades de juicio ordinario."}, {"texto": "Solo procede para delitos graves sancionados con pena de prisión.", "justificacion": "Incorrecta. La justicia de paz no conoce delitos graves; es para conflictos comunitarios menores."}], "correcta": 0, "referencias": ["CRE"]}, {"id": "EX-072", "area": 4, "subarea": "Personas y Familia", "tema": "Matrimonio", "resultado": "Identifica los requisitos del matrimonio civil.", "demanda": "Comprender", "enunciado": "Dos personas mayores de edad, con capacidad y sin impedimentos, quieren contraer matrimonio civil. ¿Qué se requiere para su validez?", "opciones": [{"texto": "Consentimiento libre, capacidad y las solemnidades legales.", "justificacion": "Correcta. El matrimonio exige consentimiento libre, capacidad y formalidades previstas en la ley. Base legal: art. 96-102 del Código Civil."}, {"texto": "Autorización de los padres, porque todo matrimonio requiere su permiso.", "justificacion": "Incorrecta. Los mayores de edad capaces no requieren autorización de sus padres."}, {"texto": "Dote o aporte económico, porque sin patrimonio común no hay matrimonio.", "justificacion": "Incorrecta. La dote no es requisito para la validez del matrimonio civil."}, {"texto": "Convivencia previa de dos años como unión de hecho reconocida.", "justificacion": "Incorrecta. La convivencia previa no es requisito para contraer matrimonio."}], "correcta": 0, "referencias": ["CC"]}, {"id": "EX-073", "area": 4, "subarea": "Personas y Familia", "tema": "Unión de hecho", "resultado": "Distingue unión de hecho de matrimonio.", "demanda": "Comprender", "enunciado": "Dos personas conviven de forma estable y monogámica por tres años, sin estar casadas, y quieren que se reconozca su unión. ¿Qué figura corresponde?", "opciones": [{"texto": "Unión de hecho, porque es la convivencia estable y monogámica de dos personas libres de vínculo.", "justificacion": "Correcta. La unión de hecho es la convivencia estable, monogámica y libre de vínculo matrimonial. Base legal: art. 68 de la Constitución de la República; art. 222 del Código Civil."}, {"texto": "Matrimonio, porque la convivencia estable equivale automáticamente al matrimonio civil.", "justificacion": "Incorrecta. La convivencia no es matrimonio; es unión de hecho con efectos propios."}, {"texto": "Sociedad conyugal, porque la convivencia genera automáticamente sociedad conyugal sin declaración.", "justificacion": "Incorrecta. La sociedad conyugal es del matrimonio; en unión de hecho se genera sociedad de bienes."}, {"texto": "Concubinato sin efectos, porque la convivencia sin matrimonio no produce efectos jurídicos.", "justificacion": "Incorrecta. La unión de hecho sí produce efectos personales y patrimoniales reconocidos por la ley."}], "correcta": 0, "referencias": ["CRE", "CC"]}, {"id": "EX-074", "area": 4, "subarea": "Personas y Familia", "tema": "Divorcio", "resultado": "Identifica las causales de divorcio por causal.", "demanda": "Aplicar", "enunciado": "Un cónyuge demanda el divorcio alegando adulterio del otro, debidamente probado. ¿Qué debe verificar el juez?", "opciones": [{"texto": "Que se configura la causal de adulterio prevista en el Código Civil, y probarla.", "justificacion": "Correcta. El adulterio es causal de divorcio y debe probarse conforme a la ley. Base legal: art. 110 del Código Civil."}, {"texto": "Que ambos cónyuges están de acuerdo, porque sin mutuo acuerdo no procede el divorcio.", "justificacion": "Incorrecta. El divorcio por causal no exige mutuo acuerdo; basta probar la causal."}, {"texto": "Que transcurrieron cinco años, porque el divorcio por causal exige ese plazo mínimo.", "justificacion": "Incorrecta. No hay plazo de cinco años para el divorcio por adulterio."}, {"texto": "Que hay hijos menores, porque sin hijos no puede demandarse el divorcio por causal.", "justificacion": "Incorrecta. La existencia de hijos no es requisito para el divorcio por causal."}], "correcta": 0, "referencias": ["CC"]}, {"id": "EX-075", "area": 4, "subarea": "Personas y Familia", "tema": "Alimentos", "resultado": "Determina los criterios para fijar alimentos.", "demanda": "Aplicar", "enunciado": "Un padre demanda alimentos para su hijo menor. El juez debe fijar la pensión. ¿Qué criterios debe considerar?", "opciones": [{"texto": "Las necesidades del niño y la capacidad del alimentante, según la tabla.", "justificacion": "Correcta. Los alimentos se fijan según necesidades del alimentado y capacidad del alimentante. Base legal: normas sobre el derecho de alimentos del Título V del Libro II del Código de la Niñez y Adolescencia (tabla de pensiones mínimas)."}, {"texto": "Solo los ingresos del padre, sin considerar las necesidades del hijo.", "justificacion": "Incorrecta. Debe considerar necesidades del alimentado y capacidad del alimentante, según tabla."}, {"texto": "La voluntad del alimentante, que decide cuánto puede aportar.", "justificacion": "Incorrecta. La pensión no depende solo de la voluntad; la fija el juez con criterios legales."}, {"texto": "El patrimonio de los abuelos, que son los obligados principales.", "justificacion": "Incorrecta. Los obligados principales son los padres; los abuelos son subsidiarios en ciertos casos."}], "correcta": 0, "referencias": ["CONA", "CC"]}, {"id": "EX-076", "area": 4, "subarea": "Personas y Familia", "tema": "Patria potestad", "resultado": "Identifica el contenido de la patria potestad.", "demanda": "Comprender", "enunciado": "Los padres de un niño de 10 años discuten quién decide sobre su educación y salud. ¿A quién corresponde esa facultad?", "opciones": [{"texto": "A ambos padres, que ejercen conjuntamente la patria potestad.", "justificacion": "Correcta. La patria potestad es conjunta y comprende cuidado, educación y representación. Base legal: art. 283 del Código Civil; art. 104 del Código de la Niñez y Adolescencia."}, {"texto": "Solo al padre, porque la patria potestad corresponde al progenitor varón.", "justificacion": "Incorrecta. La patria potestad corresponde a ambos padres en igualdad de condiciones."}, {"texto": "Solo a la madre, porque tiene preferencia legal sobre el padre.", "justificacion": "Incorrecta. No hay preferencia legal por ser madre; la patria potestad es de ambos."}, {"texto": "Al juez de familia, porque los padres no deciden sobre salud ni educación.", "justificacion": "Incorrecta. El juez interviene en conflicto, pero la regla es que deciden ambos padres."}], "correcta": 0, "referencias": ["CC", "CONA"]}, {"id": "EX-077", "area": 4, "subarea": "Personas y Familia", "tema": "Sociedad conyugal", "resultado": "Distingue bienes propios de bienes sociales.", "demanda": "Analizar", "enunciado": "Durante el matrimonio, un cónyuge recibe por herencia un inmueble. Al disolverse la sociedad conyugal, ¿cómo se clasifica ese inmueble?", "opciones": [{"texto": "Bien propio, porque los bienes adquiridos por herencia o donación son propios del cónyuge.", "justificacion": "Correcta. Los bienes adquiridos por herencia, donación o legado son bienes propios, no sociales. Base legal: arts. 158 y 164 del Código Civil."}, {"texto": "Bien social, porque todo bien adquirido durante el matrimonio ingresa a la sociedad conyugal.", "justificacion": "Incorrecta. Los bienes adquiridos por herencia no ingresan a la sociedad conyugal."}, {"texto": "Bien ganancial, porque la herencia se considera ganancial si se recibe durante el matrimonio.", "justificacion": "Incorrecta. La herencia no es ganancial; es propia del heredero."}, {"texto": "Bien mixto, porque la mitad es propia y la mitad es social por el matrimonio.", "justificacion": "Incorrecta. No hay categoría mixta; el bien heredado es propio en su totalidad."}], "correcta": 0, "referencias": ["CC"]}, {"id": "EX-078", "area": 4, "subarea": "Obligaciones y Contratos", "tema": "Fuentes de las obligaciones", "resultado": "Identifica las fuentes de las obligaciones.", "demanda": "Comprender", "enunciado": "Una persona causa daño a otra al chocar su vehículo por imprudencia, sin que exista contrato entre ellas. ¿De qué fuente nace la obligación de reparar?", "opciones": [{"texto": "De un cuasidelito: un hecho ilícito culposo que causa daño.", "justificacion": "Correcta. El art. 1453 del Código Civil enumera como fuentes de las obligaciones el contrato, el cuasicontrato, el delito, el cuasidelito y la ley; el daño causado por imprudencia es un cuasidelito, que obliga a indemnizar (art. 2214 del Código Civil). Base legal: arts. 1453 y 2214 del Código Civil."}, {"texto": "Del contrato, porque todo daño entre particulares supone un contrato previo.", "justificacion": "Incorrecta. No existe contrato entre las partes."}, {"texto": "De un cuasicontrato, por un acuerdo tácito de repararse mutuamente.", "justificacion": "Incorrecta. El cuasicontrato es un hecho voluntario lícito, no un hecho dañoso."}, {"texto": "De la voluntad unilateral del conductor que decidió causar el daño.", "justificacion": "Incorrecta. Hubo imprudencia, no voluntad de dañar; tampoco es una fuente reconocida en el art. 1453."}], "correcta": 0, "referencias": ["CC"]}, {"id": "EX-079", "area": 4, "subarea": "Obligaciones y Contratos", "tema": "Mora", "resultado": "Aplica la constitución en mora del deudor.", "demanda": "Aplicar", "enunciado": "En un contrato, el deudor no paga en la fecha pactada, pese a requerimiento del acreedor. ¿Cuándo está en mora?", "opciones": [{"texto": "Desde que venció el plazo estipulado sin que pagara.", "justificacion": "Correcta. El deudor está en mora cuando no ha cumplido la obligación dentro del término estipulado (art. 1567 num. 1 del Código Civil)."}, {"texto": "Desde que se celebró el contrato, porque la mora opera con la firma.", "justificacion": "Incorrecta. La mora requiere retardo y requerimiento o vencimiento del plazo, no la sola firma."}, {"texto": "Desde que el juez dicta sentencia que lo declare en mora.", "justificacion": "Incorrecta. La sentencia declara la mora, pero la mora nace del retardo exigible, no de la sentencia."}, {"texto": "Nunca, porque la mora solo aplica a las obligaciones de hacer.", "justificacion": "Incorrecta. La mora aplica a obligaciones de dar, hacer y no hacer."}], "correcta": 0, "referencias": ["CC"]}, {"id": "EX-080", "area": 4, "subarea": "Obligaciones y Contratos", "tema": "Responsabilidad contractual", "resultado": "Distingue responsabilidad contractual de extracontractual.", "demanda": "Analizar", "enunciado": "Un contratista incumple un contrato de obra al entregar la construcción con defectos. El dueño demanda la reparación. ¿Qué responsabilidad se configura?", "opciones": [{"texto": "Contractual, por incumplir una obligación pactada.", "justificacion": "Correcta. La responsabilidad contractual nace del incumplimiento de una obligación contractual. Base legal: art. 1563 y 1572 del Código Civil."}, {"texto": "Extracontractual, porque el daño se causó sin que exista contrato.", "justificacion": "Incorrecta. Sí existe contrato de obra; la responsabilidad es contractual."}, {"texto": "Objetiva, porque responde aunque no haya culpa en los defectos.", "justificacion": "Incorrecta. La responsabilidad contractual exige incumplimiento culpable, no es objetiva automática."}, {"texto": "Penal, porque todo incumplimiento contractual es delito.", "justificacion": "Incorrecta. El incumplimiento contractual no es por sí solo delito penal."}], "correcta": 0, "referencias": ["CC"]}, {"id": "EX-081", "area": 4, "subarea": "Obligaciones y Contratos", "tema": "Nulidad del contrato", "resultado": "Distingue nulidad absoluta de nulidad relativa.", "demanda": "Analizar", "enunciado": "Un contrato se celebra con objeto ilícito, contrario a la ley. ¿Qué nulidad se configura y quién puede alegarla?", "opciones": [{"texto": "Nulidad absoluta, que el juez puede declarar incluso de oficio.", "justificacion": "Correcta. El objeto ilícito produce nulidad absoluta (art. 1698 del Código Civil), que puede y debe declararse de oficio cuando aparece de manifiesto y puede alegarla todo el que tenga interés (art. 1699 del Código Civil)."}, {"texto": "Nulidad relativa, que solo puede alegar la parte afectada.", "justificacion": "Incorrecta. El objeto ilícito produce nulidad absoluta, alegable por interesados y el juez."}, {"texto": "Inexistencia, porque el contrato nunca nació a la vida jurídica.", "justificacion": "Incorrecta. La categoría aplicable en el Código Civil es nulidad absoluta, no inexistencia."}, {"texto": "Rescisión por lesión enorme, sin afectar la validez del contrato.", "justificacion": "Incorrecta. La rescisión por lesión es distinta; aquí el vicio es objeto ilícito, que da nulidad absoluta."}], "correcta": 0, "referencias": ["CC"]}, {"id": "EX-082", "area": 4, "subarea": "Obligaciones y Contratos", "tema": "Compraventa", "resultado": "Identifica las obligaciones del vendedor en la compraventa.", "demanda": "Comprender", "enunciado": "En una compraventa, el vendedor entrega un bien con vicios ocultos que lo hacen inservible. ¿Qué obligación incumplió?", "opciones": [{"texto": "La obligación de saneamiento, porque debe garantizar que el bien no tenga vicios ocultos.", "justificacion": "Correcta. El vendedor responde por saneamiento por vicios redhibitorios que afectan el bien. Base legal: normas sobre el saneamiento por vicios redhibitorios del Código Civil."}, {"texto": "La obligación de pagar el precio, porque el vendedor debe pagar el precio del bien vendido.", "justificacion": "Incorrecta. Pagar el precio es obligación del comprador, no del vendedor."}, {"texto": "La obligación de registrar, porque el vendedor debe registrar el contrato en el Registro de la Propiedad.", "justificacion": "Incorrecta. El registro no es la obligación incumplida; es el saneamiento por vicios ocultos."}, {"texto": "La obligación de conservar, porque el vendedor debe conservar el bien después de la venta.", "justificacion": "Incorrecta. La conservación es previa a la entrega; el problema son los vicios ocultos."}], "correcta": 0, "referencias": ["CC"]}, {"id": "EX-083", "area": 4, "subarea": "Obligaciones y Contratos", "tema": "Arrendamiento", "resultado": "Aplica las obligaciones del arrendador.", "demanda": "Aplicar", "enunciado": "Un arrendador entrega un local con filtraciones que impiden su uso comercial y se niega a repararlas. ¿Qué puede exigir el arrendatario?", "opciones": [{"texto": "La terminación del contrato o la rebaja de la renta, por el mal estado del local.", "justificacion": "Correcta. El arrendador debe entregar el bien en buen estado y hacer reparaciones necesarias. Base legal: normas sobre las obligaciones del arrendador del Código Civil."}, {"texto": "Solo el pago de daños, porque el arrendatario no puede pedir terminación ni rebaja de renta.", "justificacion": "Incorrecta. El arrendatario puede pedir terminación o rebaja, además de daños en ciertos casos."}, {"texto": "Nada, porque el arrendatario recibió el bien y asumió todos sus defectos al firmar.", "justificacion": "Incorrecta. El arrendatario no asume defectos que impiden el uso y que debe reparar el arrendador."}, {"texto": "La compra del local, porque el arrendador incumplió y debe venderlo al arrendatario.", "justificacion": "Incorrecta. El incumplimiento no obliga al arrendador a vender el bien arrendado."}], "correcta": 0, "referencias": ["CC"]}, {"id": "EX-084", "area": 4, "subarea": "Sucesiones", "tema": "Apertura de la sucesión", "resultado": "Identifica el momento y lugar de apertura de la sucesión.", "demanda": "Comprender", "enunciado": "Una persona fallece en Quito, donde tenía su último domicilio. ¿Cuándo y dónde se abre su sucesión?", "opciones": [{"texto": "Al fallecer, en el lugar de su último domicilio, porque allí se abre la sucesión.", "justificacion": "Correcta. La sucesión se abre al momento de la muerte, en el lugar del último domicilio del causante. Base legal: art. 997-1000 del Código Civil."}, {"texto": "Al inscribir la defunción, en el lugar donde se inscribió el acta de defunción.", "justificacion": "Incorrecta. La inscripción es prueba, pero la apertura es al momento de la muerte y en el domicilio."}, {"texto": "Al aceptar los herederos, en el lugar donde los herederos residan actualmente.", "justificacion": "Incorrecta. La aceptación es posterior; la apertura no depende de la residencia de los herederos."}, {"texto": "Al dictar sentencia, en el lugar donde el juez declare abierta la sucesión.", "justificacion": "Incorrecta. La sentencia no crea la apertura; esta se produce por la muerte del causante."}], "correcta": 0, "referencias": ["CC"]}, {"id": "EX-085", "area": 4, "subarea": "Sucesiones", "tema": "Legítima", "resultado": "Calcula la legítima en sucesión testada.", "demanda": "Aplicar", "enunciado": "Un testador con dos hijos deja testamento en que asigna todo a un amigo, sin dejar nada a sus hijos. ¿Qué pueden reclamar los hijos?", "opciones": [{"texto": "Su legítima, porque los hijos son legitimarios y el testador debía respetarla.", "justificacion": "Correcta. Los legitimarios tienen derecho a la legítima, que limita la libre disposición del testador. Base legal: arts. 1205 y 1207 del Código Civil."}, {"texto": "Nada, porque el testador puede disponer libremente de todos sus bienes.", "justificacion": "Incorrecta. Los hijos son legitimarios y tienen derecho a la legítima que no puede vulnerarse."}, {"texto": "Solo alimentos, porque los hijos mayores no tienen derecho a heredar si hay testamento.", "justificacion": "Incorrecta. La legítima no es alimentos; es porción de la herencia que les corresponde por ley."}, {"texto": "Toda la herencia, porque el testamento que excluye a los hijos es totalmente nulo.", "justificacion": "Incorrecta. El testamento no es totalmente nulo; se reforma para respetar la legítima."}], "correcta": 0, "referencias": ["CC"]}, {"id": "EX-086", "area": 4, "subarea": "Sucesiones", "tema": "Testamento", "resultado": "Identifica los requisitos del testamento solemne abierto.", "demanda": "Comprender", "enunciado": "Un testador quiere otorgar testamento solemne abierto ante notario, con tres testigos. ¿Qué requisito es esencial?", "opciones": [{"texto": "Que se otorgue ante notario y testigos, con lectura y firma del testamento.", "justificacion": "Correcta. El testamento solemne abierto se otorga ante notario y testigos, con lectura y firma. Base legal: art. 1053-1064 del Código Civil."}, {"texto": "Que sea escrito a mano por el testador, sin intervención de notario ni testigos.", "justificacion": "Incorrecta. Eso corresponde al testamento ológrafo, no al solemne abierto."}, {"texto": "Que se mantenga secreto, sin que el notario ni los testigos conozcan su contenido.", "justificacion": "Incorrecta. El secreto corresponde al testamento cerrado, no al abierto."}, {"texto": "Que se otorgue solo si no hay herederos forzosos que puedan reclamar legítima.", "justificacion": "Incorrecta. La existencia de legitimarios no impide otorgar testamento."}], "correcta": 0, "referencias": ["CC"]}, {"id": "EX-087", "area": 4, "subarea": "Sucesiones", "tema": "Desheredamiento", "resultado": "Aplica las causales de desheredamiento.", "demanda": "Aplicar", "enunciado": "Un padre quiere desheredar a su hijo porque este lo injurió gravemente y atentó contra su vida. ¿Qué debe hacer?", "opciones": [{"texto": "Desheredarlo en testamento, expresando la causal legal de injuria grave o atentado contra su vida.", "justificacion": "Correcta. El desheredamiento debe constar en testamento, con expresión de una causal legal y probada. Base legal: art. 1231-1235 del Código Civil."}, {"texto": "Desheredarlo de palabra, porque basta la voluntad del padre manifestada verbalmente.", "justificacion": "Incorrecta. El desheredamiento debe hacerse por testamento y con expresión de la causal legal."}, {"texto": "Desheredarlo por cualquier motivo, porque el padre puede desheredar sin justificar la causa.", "justificacion": "Incorrecta. Solo proceden las causales taxativas previstas en el Código Civil."}, {"texto": "Excluirlo sin testamento, porque el desheredamiento no requiere testamento ni causal legal.", "justificacion": "Incorrecta. Sin testamento y sin causal legal no hay desheredamiento válido."}], "correcta": 0, "referencias": ["CC"]}, {"id": "EX-088", "area": 4, "subarea": "Sucesiones", "tema": "Aceptación y repudiación", "resultado": "Distingue aceptación expresa de tácita.", "demanda": "Comprender", "enunciado": "Un heredero vende un bien de la herencia como si fuera propio, sin haber declarado expresamente que acepta. ¿Qué se configura?", "opciones": [{"texto": "Aceptación tácita, porque ejecutó un acto que supone voluntad de aceptar la herencia.", "justificacion": "Correcta. La aceptación tácita se configura con actos que suponen voluntad de aceptar, como disponer del bien. Base legal: normas sobre la aceptación y repudiación de asignaciones del Código Civil."}, {"texto": "Repudiación, porque al vender el bien demuestra que no quiere la herencia.", "justificacion": "Incorrecta. Vender como propio implica aceptar, no repudiar."}, {"texto": "Aceptación con beneficio de inventario, porque todo acto implica ese beneficio automático.", "justificacion": "Incorrecta. El beneficio de inventario requiere declaración expresa, no se presume por el acto."}, {"texto": "Ninguna, porque solo la aceptación expresa ante notario produce efectos.", "justificacion": "Incorrecta. La aceptación puede ser expresa o tácita, ambas producen efectos."}], "correcta": 0, "referencias": ["CC"]}, {"id": "EX-089", "area": 4, "subarea": "Sucesiones", "tema": "Partición", "resultado": "Identifica el objeto de la partición hereditaria.", "demanda": "Comprender", "enunciado": "Varios herederos quieren dividir los bienes de la herencia para que cada uno reciba su cuota. ¿Qué figura deben promover?", "opciones": [{"texto": "Partición, porque permite dividir los bienes hereditarios y adjudicar a cada heredero su cuota.", "justificacion": "Correcta. La partición divide la masa hereditaria y adjudica a cada heredero lo que le corresponde. Base legal: art. 1338 y siguientes del Código Civil."}, {"texto": "Inventario, porque solo con inventario se puede dividir la herencia sin adjudicar bienes.", "justificacion": "Incorrecta. El inventario lista bienes, pero no los divide ni
