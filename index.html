ia antes que cualquier pariente.", "justificacion": "Incorrecta. El Estado es el último llamado."}], "correcta": 0, "referencias": ["CC"]}, {"id": "EX-266", "area": 4, "subarea": "Personas y Familia", "tema": "Persona Jurídica", "resultado": "Identifica los atributos de la persona jurídica", "demanda": "Comprender", "enunciado": "¿Cuáles son los atributos de la persona jurídica?", "opciones": [{"texto": "Nombre, domicilio, patrimonio propio, capacidad y nacionalidad.", "justificacion": "Correcta. La persona jurídica tiene estos atributos clásicos del derecho civil."}, {"texto": "Solo el nombre o razón social con que se inscribe en el registro.", "justificacion": "Incorrecta. Tiene otros atributos."}, {"texto": "El estado civil y la edad de quienes la representan legalmente.", "justificacion": "Incorrecta. Esos son de personas naturales."}, {"texto": "Solo el patrimonio aportado por sus socios o fundadores.", "justificacion": "Incorrecta. Faltan otros."}], "correcta": 0, "referencias": ["CC"]}, {"id": "EX-267", "area": 4, "subarea": "Obligaciones y Contratos", "tema": "Pago", "resultado": "Comprende el pago como extinción de obligaciones", "demanda": "Comprender", "enunciado": "El pago, como modo de extinguir las obligaciones, consiste en:", "opciones": [{"texto": "Prestación íntegra y oportuna de lo que se debe, que libera al deudor.", "justificacion": "Correcta. El pago es el cumplimiento exacto de la obligación (Art. 1583 CC). Base legal: normas sobre el pago efectivo del Código Civil."}, {"texto": "Firma del contrato del que nace la obligación entre las partes.", "justificacion": "Incorrecta. Es el acuerdo, no el pago."}, {"texto": "Sustitución de la obligación por otra nueva que extingue la anterior.", "justificacion": "Incorrecta. Es otra forma de extinción."}, {"texto": "Extinción de la acción por no haberse ejercido en el plazo legal.", "justificacion": "Incorrecta. Es otro modo de extinguir."}], "correcta": 0, "referencias": ["CC"]}, {"id": "EX-268", "area": 4, "subarea": "Personas y Familia", "tema": "Matrimonio", "resultado": "Aplica los requisitos del matrimonio", "demanda": "Aplicar", "enunciado": "¿Cuál es un requisito de validez del matrimonio civil en Ecuador?", "opciones": [{"texto": "Consentimiento libre de contrayentes mayores de edad, sin impedimentos.", "justificacion": "Correcta. El matrimonio exige el consentimiento libre de los contrayentes (art. 67 de la Constitución; art. 81 del Código Civil), que deben ser mayores de dieciocho años desde la reforma de 2015, y la ausencia de impedimentos dirimentes."}, {"texto": "Que los contrayentes acrediten tener bienes comunes antes de casarse.", "justificacion": "Incorrecta. Los bienes comunes no son requisito."}, {"texto": "Que los padres aprueben el matrimonio, aunque los contrayentes sean adultos.", "justificacion": "Incorrecta. Desde 2015 no pueden casarse menores de edad, por lo que no cabe autorización de los padres."}, {"texto": "Que los contrayentes hayan convivido al menos cinco años antes.", "justificacion": "Incorrecta. La convivencia previa no es requisito."}], "correcta": 0, "referencias": ["CRE", "CC"]}, {"id": "EX-269", "area": 4, "subarea": "Personas y Familia", "tema": "Alimentos", "resultado": "Aplica el derecho de alimentos", "demanda": "Aplicar", "enunciado": "El derecho de alimentos comprende:", "opciones": [{"texto": "Alimentación, salud, educación, vivienda, vestuario y recreación.", "justificacion": "Correcta. Los alimentos incluyen no solo comida, sino educación y salud (Art. 349 CC)."}, {"texto": "Únicamente la comida diaria que necesita el alimentario.", "justificacion": "Incorrecta. Es más amplio."}, {"texto": "Únicamente el pago de la vivienda que ocupa el alimentario.", "justificacion": "Incorrecta. Incluye otros rubros."}, {"texto": "Únicamente las pensiones de un establecimiento educativo privado.", "justificacion": "Incorrecta. No es exclusivo."}], "correcta": 0, "referencias": ["CC"]}, {"id": "EX-270", "area": 5, "subarea": "Mercantil", "tema": "Fusión de Sociedades", "resultado": "Comprende la fusión de sociedades", "demanda": "Comprender", "enunciado": "La fusión de sociedades consiste en:", "opciones": [{"texto": "Unión de sociedades en una nueva o por absorción, con traspaso de patrimonios.", "justificacion": "Correcta. La fusión implica la extinción de las sociedades fusionadas y la transferencia de sus patrimonios (Ley de Compañías)."}, {"texto": "Venta de la totalidad de las acciones de una compañía a un tercero.", "justificacion": "Incorrecta. Es una transferencia de patrimonio."}, {"texto": "Disolución inmediata de una compañía sin transmisión de su patrimonio.", "justificacion": "Incorrecta. Es una integración."}, {"texto": "Cambio de especie de una compañía, que conserva su personalidad jurídica.", "justificacion": "Incorrecta. No hay unión de personas jurídicas."}], "correcta": 0, "referencias": ["LC"]}, {"id": "EX-271", "area": 5, "subarea": "Mercantil", "tema": "Cheque", "resultado": "Diferencia cheque de letra de cambio", "demanda": "Analizar", "enunciado": "El cheque es un título valor que se caracteriza por:", "opciones": [{"texto": "Orden incondicional de pago a la vista, girada contra un banco.", "justificacion": "Correcta. El cheque es un título valor a la vista y girado contra un banco (Ley de Cheques)."}, {"texto": "Título con vencimiento a un año desde la fecha de su emisión.", "justificacion": "Incorrecta. Es a la vista."}, {"texto": "Promesa de pago emitida directamente por el deudor a su acreedor.", "justificacion": "Incorrecta. Se gira contra un banco."}, {"texto": "Título que no requiere la firma del girador para su validez.", "justificacion": "Incorrecta. Requiere firma del girador."}], "correcta": 0, "referencias": ["LCH"]}, {"id": "EX-272", "area": 4, "subarea": "Obligaciones y Contratos", "tema": "Novación", "resultado": "Comprende la novación", "demanda": "Comprender", "enunciado": "La novación como modo de extinguir las obligaciones consiste en:", "opciones": [{"texto": "Sustitución de una obligación por otra nueva.", "justificacion": "Correcta. La novación extingue la obligación antigua y crea una nueva (Art. 1641 CC). Base legal: normas sobre la novación del Código Civil."}, {"texto": "Pago íntegro de la deuda en el lugar y tiempo convenidos.", "justificacion": "Incorrecta. Eso es pago."}, {"texto": "Extinción de la acción por no haberse ejercido en el plazo legal.", "justificacion": "Incorrecta. Es otro modo."}, {"texto": "Perdón de la deuda que el acreedor concede al deudor.", "justificacion": "Incorrecta. Es una remisión."}], "correcta": 0, "referencias": ["CC"]}, {"id": "EX-273", "area": 4, "subarea": "Obligaciones y Contratos", "tema": "Contrato de Promesa", "resultado": "Comprende el contrato de promesa", "demanda": "Aplicar", "enunciado": "El contrato de promesa de compraventa se caracteriza por:", "opciones": [{"texto": "Obliga a celebrar un contrato futuro y debe constar por escrito.", "justificacion": "Correcta. La promesa de celebrar un contrato solo produce obligación si consta por escrito, si el contrato prometido no es de los que la ley declara ineficaces, si contiene un plazo o condición que fije la época de su celebración y si en ella se especifica el contrato prometido (art. 1570 del Código Civil)."}, {"texto": "Transfiere el dominio de la cosa desde el momento de su suscripción.", "justificacion": "Incorrecta. Solo obliga a hacerlo en el futuro."}, {"texto": "Puede celebrarse verbalmente, sin que conste por escrito ni plazo alguno.", "justificacion": "Incorrecta. Debe ser escrita."}, {"texto": "Es un acto unilateral, que solo obliga a quien promete vender.", "justificacion": "Incorrecta. Es bilateral."}], "correcta": 0, "referencias": ["CC"]}, {"id": "EX-274", "area": 4, "subarea": "Sucesiones", "tema": "Aceptación de la Herencia", "resultado": "Diferencia aceptación pura de beneficio de inventario", "demanda": "Analizar", "enunciado": "¿Cuál es la diferencia entre la aceptación pura y simple de la herencia y la aceptación con beneficio de inventario?", "opciones": [{"texto": "Con beneficio de inventario se responde hasta lo heredado.", "justificacion": "Correcta. La aceptación pura y simple hace al heredero responsable ultra vires, mientras el beneficio de inventario limita la responsabilidad (Art. 1264 CC). Base legal: normas sobre la aceptación y el beneficio de inventario del Código Civil."}, {"texto": "No hay diferencia legal en cuanto a la responsabilidad por las deudas.", "justificacion": "Incorrecta. Existen efectos distintos."}, {"texto": "El beneficio de inventario extingue la herencia y sus deudas.", "justificacion": "Incorrecta. Solo limita la responsabilidad."}, {"texto": "La aceptación pura y simple solo procede de forma expresa y escrita.", "justificacion": "Incorrecta. Puede ser tácita o expresa."}], "correcta": 0, "referencias": ["CC"]}, {"id": "EX-275", "area": 5, "subarea": "Laboral", "tema": "Despido Intempestivo", "resultado": "Calcula la indemnización por despido", "demanda": "Aplicar", "enunciado": "Un trabajador con 5 años de servicio es despedido intempestivamente sin causa justa. Conforme al Código del Trabajo, ¿cómo se calcula su indemnización?", "opciones": [{"texto": "Cinco remuneraciones mensuales: un mes por cada año de servicio.", "justificacion": "Correcta. Con más de tres años de servicio corresponde una remuneración mensual por cada año, sin exceder de veinticinco (art. 188 del Código del Trabajo); además procede la bonificación del art. 185 y los haberes pendientes. Base legal: arts. 185 y 188 del Código del Trabajo."}, {"texto": "Tres remuneraciones mensuales, sin importar los años de servicio.", "justificacion": "Incorrecta. Tres meses corresponden a quien tiene hasta tres años de servicio."}, {"texto": "El 25% de la remuneración por cada año de servicio, nada más.", "justificacion": "Incorrecta. El 25% por año es la bonificación por desahucio (art. 185), no la indemnización del art. 188."}, {"texto": "Un salario básico unificado por cada año de servicio prestado.", "justificacion": "Incorrecta. Se calcula sobre la remuneración, no sobre el salario básico."}], "correcta": 0, "referencias": ["CT"]}, {"id": "EX-276", "area": 5, "subarea": "Laboral", "tema": "Relación Laboral", "resultado": "Identifica los elementos de la relación laboral", "demanda": "Comprender", "enunciado": "¿Cuáles son los elementos esenciales de una relación laboral?", "opciones": [{"texto": "Prestación personal, dependencia y remuneración.", "justificacion": "Correcta. Los tres elementos clásicos son personal, subordinación y remuneración (Art. 8 Código del Trabajo). Base legal: art. 8 del Código del Trabajo."}, {"texto": "Solo la suscripción de un contrato escrito ante el inspector.", "justificacion": "Incorrecta. El contrato puede ser verbal."}, {"texto": "Solo el pago periódico de una cantidad de dinero.", "justificacion": "Incorrecta. Faltan los otros elementos."}, {"texto": "La constitución de una sociedad entre las partes.", "justificacion": "Incorrecta. No es un elemento laboral."}], "correcta": 0, "referencias": ["CT"]}, {"id": "EX-277", "area": 5, "subarea": "Laboral", "tema": "Jornada de Trabajo", "resultado": "Aplica los límites de la jornada laboral", "demanda": "Aplicar", "enunciado": "La jornada ordinaria de trabajo en Ecuador no podrá exceder de:", "opciones": [{"texto": "Ocho horas diarias y cuarenta semanales, salvo excepciones legales.", "justificacion": "Correcta. El Art. 47 del Código del Trabajo establece la jornada máxima de 8 horas diarias y 40 semanales. Base legal: arts. 47 y 55 del Código del Trabajo."}, {"texto": "Doce horas diarias, siempre que se paguen como horas ordinarias.", "justificacion": "Incorrecta. Excede el máximo legal."}, {"texto": "Seis horas diarias en todos los casos y para toda actividad.", "justificacion": "Incorrecta. Es la máxima, no la única."}, {"texto": "No tiene límite si el trabajador acepta por escrito la jornada.", "justificacion": "Incorrecta. Tiene límite legal."}], "correcta": 0, "referencias": ["CT"]}, {"id": "EX-278", "area": 5, "subarea": "Tributario", "tema": "Principios Tributarios", "resultado": "Aplica el principio de legalidad", "demanda": "Comprender", "enunciado": "El principio de legalidad tributaria establece que:", "opciones": [{"texto": "Los impuestos solo se crean por ley, a iniciativa del Ejecutivo.", "justificacion": "Correcta. Solo por iniciativa de la Función Ejecutiva y mediante ley sancionada por la Asamblea Nacional se pueden establecer, modificar, exonerar o extinguir impuestos; las tasas y contribuciones se crean por acto normativo de órgano competente (art. 301 de la Constitución)."}, {"texto": "El Presidente de la República puede crear impuestos mediante decreto ejecutivo.", "justificacion": "Incorrecta. Requiere ley."}, {"texto": "Los municipios pueden crear cualquier impuesto mediante ordenanza.", "justificacion": "Incorrecta. Tienen límites constitucionales."}, {"texto": "Las tarifas de los impuestos las fija libremente el ministro de Finanzas.", "justificacion": "Incorrecta. Deben estar en la ley."}], "correcta": 0, "referencias": ["CRE"]}, {"id": "EX-279", "area": 5, "subarea": "Tributario", "tema": "Impuesto a la Renta", "resultado": "Comprende el hecho generador del IR", "demanda": "Comprender", "enunciado": "El Impuesto a la Renta en Ecuador grava:", "opciones": [{"texto": "La renta global de personas naturales y sociedades.", "justificacion": "Correcta. El IR grava los ingresos netos de personas y empresas (Ley de Régimen Tributario Interno). Base legal: arts. 1 y 2 de la Ley de Régimen Tributario Interno."}, {"texto": "Solo el consumo de bienes muebles y la prestación de servicios.", "justificacion": "Incorrecta. Eso es el IVA."}, {"texto": "Solo la importación de bienes desde el exterior.", "justificacion": "Incorrecta. También grava rentas internas."}, {"texto": "La propiedad de inmuebles urbanos y rurales.", "justificacion": "Incorrecta. Eso es el impuesto predial."}], "correcta": 0, "referencias": ["LORTI"]}, {"id": "EX-280", "area": 5, "subarea": "Tributario", "tema": "IVA", "resultado": "Comprende el IVA", "demanda": "Comprender", "enunciado": "El Impuesto al Valor Agregado (IVA) es un impuesto que:", "opciones": [{"texto": "Grava la transferencia e importación de bienes y los servicios.", "justificacion": "Correcta. El IVA es un impuesto indirecto al consumo (Ley de Régimen Tributario Interno). Base legal: art. 52 de la Ley de Régimen Tributario Interno."}, {"texto": "Grava la renta global de las personas naturales y sociedades.", "justificacion": "Incorrecta. Eso es el IR."}, {"texto": "Grava la propiedad de vehículos motorizados de transporte.", "justificacion": "Incorrecta. Es otro impuesto."}, {"texto": "Es un impuesto directo que asume el productor del bien.", "justificacion": "Incorrecta. Es indirecto."}], "correcta": 0, "referencias": ["LORTI"]}, {"id": "EX-281", "area": 5, "subarea": "Mercantil", "tema": "Propiedad Intelectual", "resultado": "Diferencia marca de patente", "demanda": "Analizar", "enunciado": "¿Cuál es la diferencia entre una marca y una patente?", "opciones": [{"texto": "La marca distingue productos o servicios; la patente protege invenciones.", "justificacion": "Correcta. La marca distingue productos y la patente protege invenciones (Código Orgánico de la Economía Social de los Conocimientos)."}, {"texto": "Son figuras equivalentes que protegen indistintamente signos e invenciones.", "justificacion": "Incorrecta. Protegen cosas distintas."}, {"texto": "La patente identifica servicios en el mercado y la marca, productos.", "justificacion": "Incorrecta. Eso hace la marca de servicio."}, {"texto": "La marca protege invenciones con aplicación industrial por veinte años.", "justificacion": "Incorrecta. Protege signos distintivos."}], "correcta": 0, "referencias": ["CRE"]}, {"id": "EX-282", "area": 5, "subarea": "Internacional Privado", "tema": "Ley Aplicable", "resultado": "Aplica el Derecho Internacional Privado", "demanda": "Aplicar", "enunciado": "En el Derecho Internacional Privado, ¿qué determina la ley aplicable a un contrato internacional?", "opciones": [{"texto": "La ley elegida por las partes y, en su defecto, la de mayor vinculación.", "justificacion": "Correcta. Rige el principio de autonomía de la voluntad y el criterio de vinculación más estrecha."}, {"texto": "La ley del domicilio del demandante, en todos los contratos internacionales.", "justificacion": "Incorrecta. No es un criterio absoluto."}, {"texto": "La ley ecuatoriana, aunque el contrato no tenga vínculo con el Ecuador.", "justificacion": "Incorrecta. Hay normas de conflicto."}, {"texto": "La ley del país del juez que conoce la causa, sin excepción posible.", "justificacion": "Incorrecta. No siempre."}], "correcta": 0, "referencias": ["BUST"]}, {"id": "EX-283", "area": 5, "subarea": "Laboral", "tema": "Contrato Colectivo", "resultado": "Comprende el contrato colectivo", "demanda": "Comprender", "enunciado": "El contrato colectivo de trabajo es aquel que:", "opciones": [{"texto": "Lo celebran empleadores y una asociación de trabajadores.", "justificacion": "Correcta. El contrato colectivo busca mejorar las condiciones laborales a través de la negociación colectiva (Art. 220 Código del Trabajo). Base legal: art. 220 del Código del Trabajo."}, {"texto": "Se celebra entre un trabajador individual y su empleador por escrito.", "justificacion": "Incorrecta. Eso es contrato individual."}, {"texto": "Es un contrato civil de prestación de servicios entre varias personas.", "justificacion": "Incorrecta. Generalmente requiere organización."}, {"texto": "Lo celebran varios empleadores entre sí para fijar salarios uniformes.", "justificacion": "Incorrecta. Es laboral."}], "correcta": 0, "referencias": ["CT"]}, {"id": "EX-284", "area": 5, "subarea": "Tributario", "tema": "Contrabando", "resultado": "Diferencia contrabando de defraudación", "demanda": "Comprender", "enunciado": "El delito de contrabando consiste en:", "opciones": [{"texto": "Ingresar o sacar mercancías eludiendo el control aduanero.", "justificacion": "Correcta. El contrabando consiste en evadir el control y vigilancia aduanera sobre mercancías cuya cuantía supere el límite legal, ingresándolas o sacándolas del país (art. 301 del Código Orgánico Integral Penal); la evasión de tributos al comercio exterior mediante otros medios constituye defraudación aduanera (art. 299). Base legal: arts. 299 y 301 del Código Orgánico Integral Penal."}, {"texto": "Dejar de pagar el impuesto a la renta del ejercicio fiscal.", "justificacion": "Incorrecta. Eso es defraudación tributaria."}, {"texto": "Comprar productos de fabricación nacional en el mercado interno.", "justificacion": "Incorrecta. No es delito."}, {"texto": "Traer un obsequio personal declarado dentro del límite permitido.", "justificacion": "Incorrecta. No es contrabando."}], "correcta": 0, "referencias": ["COIP"]}, {"id": "EX-285", "area": 5, "subarea": "Laboral", "tema": "Riesgos del Trabajo", "resultado": "Diferencia accidente de trabajo de enfermedad profesional", "demanda": "Analizar", "enunciado": "¿Cuál es la diferencia entre accidente de trabajo y enfermedad profesional?", "opciones": [{"texto": "El accidente es un suceso repentino; la enfermedad, una afección progresiva.", "justificacion": "Correcta. El accidente es súbito y la enfermedad es progresiva, ambas cubiertas por el IESS (Art. 347 Código del Trabajo). Base legal: arts. 347 a 349 del Código del Trabajo."}, {"texto": "Son la misma contingencia y se rigen por idénticas reglas de prueba.", "justificacion": "Incorrecta. Tienen diferencias temporales."}, {"texto": "La enfermedad profesional deriva necesariamente de un accidente previo.", "justificacion": "Incorrecta. Son causas distintas."}, {"texto": "El accidente de trabajo es el que ocurre fuera de la jornada laboral.", "justificacion": "Incorrecta. Debe ser por causa del trabajo."}], "correcta": 0, "referencias": ["CT"]}, {"id": "EX-286", "area": 5, "subarea": "Laboral", "tema": "Utilidades", "resultado": "Aplica el reparto de utilidades", "demanda": "Aplicar", "enunciado": "Respecto del reparto de utilidades, los trabajadores tienen derecho a:", "opciones": [{"texto": "El 15% de las utilidades líquidas: 10% por días trabajados y 5% por cargas.", "justificacion": "Correcta. El Art. 97 del Código del Trabajo establece el reparto del 15% de utilidades (10% días, 5% cargas). Base legal: art. 97 del Código del Trabajo."}, {"texto": "El 15% de las ventas brutas, repartido por igual entre los trabajadores.", "justificacion": "Incorrecta. Es sobre utilidades, no ventas."}, {"texto": "El 10% de las utilidades, solo para quienes tienen cargas familiares.", "justificacion": "Incorrecta. Es un derecho legal."}, {"texto": "La totalidad de las utilidades, si la empresa no reinvierte en el año.", "justificacion": "Incorrecta. Es un porcentaje."}], "correcta": 0, "referencias": ["CT"]}, {"id": "EX-287", "area": 1, "subarea": "Derecho Constitucional", "tema": "Control difuso y consulta de norma", "resultado": "Evalúa cuándo el juez debe suspender y consultar a la Corte Constitucional.", "demanda": "Evaluar", "enunciado": "En un juicio civil, el juez duda de la constitucionalidad de una norma que debe aplicar, pero ya la inaplicó en otro caso similar por control difuso. La parte pide que consulte a la Corte Constitucional. El juez considera que la duda persiste y la norma es determinante para el fallo. ¿Qué debe hacer?", "opciones": [{"texto": "Suspender la causa y consultar a la Corte Constitucional, por la duda razonable.", "justificacion": "Correcta. La consulta procede cuando el juez tiene duda razonable sobre una norma determinante para la decisión. Base legal: art. 428 de la Constitución de la República; art. 142 de la Ley Orgánica de Garantías Jurisdiccionales y Control Constitucional."}, {"texto": "Inaplicarla de nuevo por control difuso, porque el precedente propio lo autoriza sin consultar a la Corte.", "justificacion": "Incorrecta. Aunque puede inaplicar, si tiene duda razonable y la norma es determinante, debe suspender y consultar."}, {"texto": "Aplicarla sin cuestionarla, porque la duda del juez no suspende el proceso ni obliga a consultar.", "justificacion": "Incorrecta. La duda razonable sobre norma determinante obliga a suspender y elevar la consulta."}, {"texto": "Declararla inconstitucional con efectos generales, porque el juez ordinario tiene esa competencia.", "justificacion": "Incorrecta. El juez ordinario no declara inconstitucionalidad con efectos generales; eso corresponde a la Corte."}], "correcta": 0, "referencias": ["CRE", "LOGJCC"]}, {"id": "EX-288", "area": 1, "subarea": "Derecho Constitucional", "tema": "Acción de protección y subsidiariedad", "resultado": "Evalúa la procedencia de la acción de protección frente a vía ordinaria eficaz.", "demanda": "Evaluar", "enunciado": "Un trabajador impugna su destitución alegando vulneración al debido proceso, pero existe vía contencioso-administrativa que puede suspender el acto y reparar integralmente en 30 días. No demuestra daño irreparable. ¿Procede la acción de protección?", "opciones": [{"texto": "No procede, porque existe vía ordinaria adecuada y eficaz y no se acredita daño irreparable.", "justificacion": "Correcta. La acción de protección es subsidiaria cuando existe vía ordinaria adecuada y eficaz. Base legal: art. 88 de la Constitución de la República; art. 40 de la Ley Orgánica de Garantías Jurisdiccionales y Control Constitucional."}, {"texto": "Sí procede, porque toda vulneración de debido proceso debe repararse por acción de protección.", "justificacion": "Incorrecta. Si existe vía ordinaria adecuada y eficaz sin daño irreparable, la acción es improcedente."}, {"texto": "Sí procede, porque la vía contenciosa nunca es adecuada para reparar vulneraciones constitucionales.", "justificacion": "Incorrecta. La vía contenciosa puede ser adecuada si permite suspensión y reparación integral oportuna."}, {"texto": "No procede, porque la destitución de servidores nunca vulnera derechos constitucionales.", "justificacion": "Incorrecta. La destitución sí puede vulnerar derechos; la improcedencia es por subsidiariedad, no por el tema."}], "correcta": 0, "referencias": ["CRE", "LOGJCC"]}, {"id": "EX-289", "area": 1, "subarea": "Derecho Constitucional", "tema": "Hábeas corpus correctivo", "resultado": "Distingue hábeas corpus liberatorio, correctivo y preventivo.", "demanda": "Analizar", "enunciado": "Una persona cumple prisión preventiva en un centro donde es sometida a tratos crueles y a aislamiento prolongado sin justificación, que agravan su privación de libertad. Su defensa interpone hábeas corpus. ¿Qué modalidad procede?", "opciones": [{"texto": "Correctivo, porque busca corregir condiciones que agravan ilegalmente la privación de libertad.", "justificacion": "Correcta. El hábeas corpus correctivo protege contra tratos que agravan la privación legal de libertad. Base legal: art. 89 de la Constitución de la República."}, {"texto": "Liberatorio, porque toda privación de libertad ilegal debe repararse con la libertad inmediata.", "justificacion": "Incorrecta. La privación es legal; lo que se cuestiona son las condiciones que agravan la detención."}, {"texto": "Preventivo, porque busca evitar una futura detención que aún no se ha ejecutado.", "justificacion": "Incorrecta. No se busca prevenir una detención futura, sino corregir las condiciones actuales."}, {"texto": "Restrictivo, porque busca impedir que la autoridad restrinja la libertad de circulación del detenido.", "justificacion": "Incorrecta. La categoría aplicable es correctivo, no restrictivo, por el agravamiento de condiciones."}], "correcta": 0, "referencias": ["CRE"]}, {"id": "EX-290", "area": 1, "subarea": "Derecho Constitucional", "tema": "Acción de inconstitucionalidad y efectos", "resultado": "Evalúa los efectos de la declaratoria de inconstitucionalidad.", "demanda": "Evaluar", "enunciado": "La Corte Constitucional declara inconstitucional una ordenanza con efectos a futuro, pero la ordenanza ya generó cobros durante dos años. Un afectado pide devolución retroactiva automática. ¿Qué corresponde?", "opciones": [{"texto": "No hay devolución automática, porque la Corte puede modular efectos y la sentencia define su alcance temporal.", "justificacion": "Correcta. La Corte modula los efectos temporales; la devolución depende de lo resuelto en sentencia. Base legal: art. 436 de la Constitución de la República; art. 95 de la Ley Orgánica de Garantías Jurisdiccionales y Control Constitucional."}, {"texto": "Devolución automática, porque toda declaratoria de inconstitucionalidad tiene efecto retroactivo absoluto.", "justificacion": "Incorrecta. La Corte puede modular efectos; no toda declaratoria es retroactiva automática."}, {"texto": "No hay devolución, porque las ordenanzas inconstitucionales mantienen efectos definitivos aunque se anulen.", "justificacion": "Incorrecta. Pueden revisarse efectos, pero no es que siempre se mantengan; depende de la modulación."}, {"texto": "Devolución automática, porque la ordenanza nunca existió y todos sus efectos deben eliminarse.", "justificacion": "Incorrecta. La teoría de la inexistencia no implica retroactividad automática si la Corte modula efectos."}], "correcta": 0, "referencias": ["CRE", "LOGJCC"]}, {"id": "EX-291", "area": 1, "subarea": "Derecho Constitucional", "tema": "Debido proceso y prueba ilícita administrativa", "resultado": "Aplica la exclusión de prueba ilícita en procedimiento sancionador.", "demanda": "Analizar", "enunciado": "En un procedimiento disciplinario, la administración sanciona con base en correos obtenidos sin orden judicial, vulnerando la intimidad, aunque los correos prueban la falta. El funcionario alega vulneración al debido proceso. ¿Qué corresponde?", "opciones": [{"texto": "Excluir los correos, porque la prueba obtenida violando derechos es ineficaz.", "justificacion": "Correcta. La prueba obtenida con violación de derechos constitucionales carece de eficacia, incluso en sede administrativa. Base legal: art. 76 num. 4 de la Constitución."}, {"texto": "Valorarlos, porque en sede administrativa no rige la exclusión de prueba.", "justificacion": "Incorrecta. La exclusión de prueba ilícita aplica también en procedimientos administrativos sancionadores."}, {"texto": "Valorarlos con menor peso, porque son auténticos y prueban la falta.", "justificacion": "Incorrecta. La prueba ilícita no se valora con menor peso; se excluye por vulneración de derechos."}, {"texto": "Sancionar igual, porque la gravedad de la falta convalida la prueba.", "justificacion": "Incorrecta. La gravedad no convalida la vulneración de derechos en la obtención de la prueba."}], "correcta": 0, "referencias": ["CRE"]}, {"id": "EX-292", "area": 1, "subarea": "Derecho Constitucional", "tema": "Derechos de la naturaleza y ponderación", "resultado": "Pondera derechos de la naturaleza frente a desarrollo.", "demanda": "Evaluar", "enunciado": "Un proyecto minero cuenta con licencia ambiental, pero afectaría irreversiblemente el ciclo vital de un páramo que es fuente de agua. La comunidad demanda a favor de la naturaleza. ¿Qué debe ponderar el juez?", "opciones": [{"texto": "La irreversibilidad del daño y los derechos de la naturaleza, frente al proyecto.", "justificacion": "Correcta. Debe ponderar la irreversibilidad y el contenido esencial de los derechos de la naturaleza frente al desarrollo. Base legal: art. 71-73 de la Constitución de la República."}, {"texto": "Solo la licencia, porque la licencia ambiental impide cuestionar cualquier afectación a la naturaleza.", "justificacion": "Incorrecta. La licencia no impide el control constitucional si hay afectación irreversible a derechos de la naturaleza."}, {"texto": "Solo la voluntad de la empresa, porque la licencia otorga un derecho adquirido intangible.", "justificacion": "Incorrecta. La licencia no otorga derecho adquirido a vulnerar derechos de la naturaleza."}, {"texto": "Solo el interés económico, porque el desarrollo prevalece siempre sobre los derechos de la naturaleza.", "justificacion": "Incorrecta. No hay prevalencia automática del desarrollo; debe ponderarse con los derechos de la naturaleza."}], "correcta": 0, "referencias": ["CRE"]}, {"id": "EX-293", "area": 1, "subarea": "Derecho Constitucional", "tema": "Consulta previa y consentimiento", "resultado": "Distingue consulta previa de consentimiento previo, libre e informado.", "demanda": "Analizar", "enunciado": "El Estado planea trasladar a una comunidad indígena de su territorio ancestral para un proyecto extractivo, sin obtener su consentimiento, aunque la consultó. La comunidad alega vulneración. ¿Qué exige el derecho en este supuesto?", "opciones": [{"texto": "Consentimiento previo, libre e informado, porque el traslado de territorio ancestral exige consentimiento.", "justificacion": "Correcta. El traslado de pueblos indígenas de su territorio exige consentimiento previo, libre e informado. Base legal: art. 57 num. 11 de la Constitución; art. 16 del Convenio 169 de la OIT."}, {"texto": "Solo consulta, porque la consulta previa nunca exige consentimiento y basta con informar a la comunidad.", "justificacion": "Incorrecta. En traslado y casos de gran impacto se exige consentimiento, no solo consulta."}, {"texto": "Solo información posterior, porque el Estado puede trasladar sin consulta si ofrece compensación económica.", "justificacion": "Incorrecta. La compensación no sustituye la consulta ni el consentimiento exigido."}, {"texto": "Consulta y consentimiento solo si la comunidad lo solicita, porque sin solicitud no hay obligación estatal.", "justificacion": "Incorrecta. La obligación estatal no depende de que la comunidad lo solicite; es previa y obligatoria."}], "correcta": 0, "referencias": ["CRE"]}, {"id": "EX-294", "area": 1, "subarea": "Derechos Humanos", "tema": "Agotamiento de recursos internos", "resultado": "Evalúa las excepciones al agotamiento de recursos internos.", "demanda": "Evaluar", "enunciado": "Una víctima denuncia tortura, pero los recursos internos son ineficaces por retardo injustificado de más de 8 años sin decisión y por falta de independencia del órgano. Quiere acudir a la Comisión Interamericana. ¿Puede hacerlo sin agotar recursos?", "opciones": [{"texto": "Sí, por el retardo injustificado y la ineficacia de los recursos.", "justificacion": "Correcta. El retardo injustificado y la ineficacia son excepciones al agotamiento de recursos internos. Base legal: art. 46 num. 2 de la Convención Americana sobre Derechos Humanos."}, {"texto": "No, porque debe agotar los recursos internos aunque sean ineficaces.", "justificacion": "Incorrecta. El agotamiento admite excepciones por ineficacia, retardo injustificado o falta de debido proceso."}, {"texto": "No, porque la tortura no es materia del Sistema Interamericano.", "justificacion": "Incorrecta. La tortura sí es materia del Sistema Interamericano."}, {"texto": "Sí, y puede acudir directamente a la Corte sin pasar por la Comisión.", "justificacion": "Incorrecta. Debe acudir primero a la Comisión; la Corte no conoce casos sin trámite previo ante la Comisión."}], "correcta": 0, "referencias": ["CADH"]}, {"id": "EX-295", "area": 1, "subarea": "Derechos Humanos", "tema": "Bloque de constitucionalidad y tratados", "resultado": "Aplica el bloque de constitucionalidad y la jerarquía de tratados.", "demanda": "Analizar", "enunciado": "Una ley interna restringe un derecho y un tratado de derechos humanos ratificado lo protege más ampliamente. El juez duda entre aplicar la ley o el tratado. Además, la Constitución ordena aplicar la norma más favorable. ¿Qué debe preferir?", "opciones": [{"texto": "El tratado y la interpretación más favorable, por el principio pro persona.", "justificacion": "Correcta. Los tratados de derechos humanos integran el bloque y se aplica la interpretación más favorable. Base legal: arts. 11 num. 5, 417 y 426 de la Constitución."}, {"texto": "La ley interna, porque es posterior y deroga al tratado de igual rango.", "justificacion": "Incorrecta. Los tratados de derechos humanos tienen rango constitucional y no se derogan por ley posterior."}, {"texto": "Ninguna: el conflicto debe resolverlo la Asamblea Nacional.", "justificacion": "Incorrecta. El juez debe resolver el conflicto aplicando el bloque y el principio pro persona."}, {"texto": "La ley interna, porque el juez no puede aplicar tratados internacionales.", "justificacion": "Incorrecta. El juez debe aplicar tratados que integran el ordenamiento y el bloque de constitucionalidad."}], "correcta": 0, "referencias": ["CRE"]}, {"id": "EX-296", "area": 1, "subarea": "Derechos Humanos", "tema": "Medidas cautelares constitucionales y daño", "resultado": "Evalúa la inminencia y gravedad en medidas cautelares.", "demanda": "Evaluar", "enunciado": "Una autoridad anuncia que en 6 meses evaluará si demuele un barrio, sin fecha cierta ni acto concreto. Se pide medida cautelar constitucional por amenaza. ¿Procede?", "opciones": [{"texto": "No procede: no hay amenaza grave e inminente, solo una posibilidad.", "justificacion": "Correcta. La medida cautelar exige amenaza grave e inminente, no una posibilidad futura e incierta. Base legal: art. 87 de la Constitución de la República; art. 26 de la Ley Orgánica de Garantías Jurisdiccionales y Control Constitucional."}, {"texto": "Sí procede, porque todo anuncio de demolición es amenaza grave e inminente.", "justificacion": "Incorrecta. Sin acto concreto ni inminencia, no hay amenaza grave e inminente que justifique la medida."}, {"texto": "Sí procede, porque las medidas cautelares proceden aunque no haya amenaza concreta.", "justificacion": "Incorrecta. Sin amenaza concreta, grave e inminente, la medida cautelar es improcedente."}, {"texto": "No procede, porque las medidas cautelares solo proceden contra actos ya consumados.", "justificacion": "Incorrecta. Proceden ante amenaza, pero esta debe ser grave e inminente, no meramente eventual."}], "correcta": 0, "referencias": ["CRE", "LOGJCC"]}, {"id": "EX-298", "area": 1, "subarea": "Derecho Administrativo", "tema": "Nulidad y acto favorable", "resultado": "Evalúa la revocatoria de acto favorable y derechos adquiridos.", "demanda": "Evaluar", "enunciado": "La administración otorgó una licencia que generó derechos a su titular. Luego detecta que la licencia se otorgó con un vicio de nulidad por incompetencia manifiesta. Quiere revocarla de oficio sin proceso. ¿Qué debe hacer?", "opciones": [{"texto": "Iniciar procedimiento de revisión de oficio con debido proceso, porque el acto generó derechos.", "justificacion": "Correcta. La revisión de acto favorable que generó derechos exige procedimiento con debido proceso. Base legal: art. 132 del Código Orgánico Administrativo (revisión de oficio)."}, {"texto": "Revocarla de oficio sin proceso, porque la nulidad permite revocación inmediata sin garantías.", "justificacion": "Incorrecta. Aun ante nulidad, debe respetarse el debido proceso y la revisión de oficio con garantías."}, {"texto": "Revocarla por lesividad sin notificar, porque la lesividad no exige notificar al interesado.", "justificacion": "Incorrecta. La declaratoria de lesividad exige notificar y garantizar la defensa del interesado."}, {"texto": "Mantenerla, porque todo acto favorable es irreversible aunque tenga vicio de nulidad.", "justificacion": "Incorrecta. El acto favorable con vicio de nulidad puede revisarse, pero con procedimiento."}], "correcta": 0, "referencias": ["COA"]}, {"id": "EX-299", "area": 1, "subarea": "Derecho Administrativo", "tema": "Responsabilidad y eximentes", "resultado": "Evalúa eximentes de responsabilidad patrimonial del Estado.", "demanda": "Evaluar", "enunciado": "Durante un terremoto imprevisible e irresistible, un puente público colapsa pese a mantenimiento adecuado, causando daños. El afectado demanda al Estado por falta de servicio. ¿Debe responder?", "opciones": [{"texto": "No, porque concurre fuerza mayor imprevisible e irresistible y no hay falta de servicio acreditada.", "justificacion": "Correcta. La fuerza mayor y la ausencia de falta de servicio eximen de responsabilidad patrimonial. Base legal: art. 11 num. 9 de la Constitución."}, {"texto": "Sí, porque todo daño en vía pública genera responsabilidad objetiva del Estado sin eximentes.", "justificacion": "Incorrecta. La fuerza mayor imprevisible e irresistible puede eximir si no hay falta de servicio."}, {"texto": "Sí, porque el Estado siempre responde por daños en infraestructura pública, aunque haya mantenimiento.", "justificacion": "Incorrecta. No siempre responde; debe acreditarse falta de servicio o nexo causal imputable."}, {"texto": "No, porque el afectado asumió el riesgo al usar el puente durante un terremoto.", "justificacion": "Incorrecta. No es asunción de riesgo; la eximente es la fuerza mayor, no la culpa del afectado."}], "correcta": 0, "referencias": ["CRE", "COA"]}, {"id": "EX-300", "area": 1, "subarea": "Derecho Administrativo", "tema": "Contratación y terminación unilateral", "resultado": "Evalúa la terminación unilateral por incumplimiento del contratista.", "demanda": "Analizar", "enunciado": "En un contrato público, el contratista incumple gravemente el plazo. La entidad quiere terminar unilateralmente, pero el contrato no prevé procedimiento y el contratista alega que no fue escuchado. ¿Qué debe hacer la entidad?", "opciones": [{"texto": "Motivar y garantizar debido proceso antes de terminar unilateralmente por incumplimiento.", "justificacion": "Correcta. La terminación unilateral exige motivación, debido proceso y verificación del incumplimiento. Base legal: arts. 108 y 109 de la Ley Orgánica del Sistema Nacional de Contratación Pública (numeración vigente tras la reforma de octubre de 2025)."}, {"texto": "Terminar sin escuchar, porque la terminación unilateral no exige debido proceso.", "justificacion": "Incorrecta. La terminación unilateral exige motivación y debido proceso, con oportunidad de defensa."}, {"texto": "Terminar sin motivar, porque la motivación solo se exige en actos favorables.", "justificacion": "Incorrecta. La motivación se exige en todo acto administrativo, incluida la terminación."}, {"texto": "Mantener el contrato, porque sin cláusula de terminación no puede terminarse unilateralmente.", "justificacion": "Incorrecta. La ley prevé terminación unilateral por incumplimiento, pero con debido proceso."}], "correcta": 0, "referencias": ["LOSNCP"]}, {"id": "EX-301", "area": 1, "subarea": "Derecho Administrativo", "tema": "Concesión y equilibrio económico", "resultado": "Aplica la teoría del equilibrio económico en concesión.", "demanda": "Analizar", "enunciado": "En una concesión, el Estado modifica unilateralmente las tarifas por interés público, rompiendo el equilibrio económico del concesionario que cumplió sus obligaciones. ¿Qué puede reclamar el concesionario?", "opciones": [{"texto": "El restablecimiento del equilibrio económico o una compensación.", "justificacion": "Correcta. La modificación unilateral por interés público obliga a restablecer el equilibrio o compensar."}, {"texto": "Nada, porque el Estado puede fijar tarifas sin compensar al concesionario.", "justificacion": "Incorrecta. La modificación por interés público debe mantener el equilibrio económico o compensar."}, {"texto": "La terminación automática de la concesión por el cambio de tarifas.", "justificacion": "Incorrecta. La modificación no extingue automáticamente; habilita restablecimiento o compensación."}, {"texto": "Nada, porque asumió todo riesgo tarifario al firmar la concesión.", "justificacion": "Incorrecta. El riesgo asumido no incluye la modificación unilateral por interés público sin compensación."}], "correcta": 0, "referencias": ["COA"]}, {"id": "EX-302", "area": 1, "subarea": "Derecho Constitucional", "tema": "Igualdad y test de proporcionalidad", "resultado": "Aplica el test de igualdad en caso de trato diferenciado.", "demanda": "Evaluar", "enunciado": "Una norma otorga un beneficio solo a personas nacidas en una provincia, sin justificación objetiva, excluyendo a otras en igual situación. Se alega vulneración a la igualdad. ¿Qué debe aplicar el juez?", "opciones": [{"texto": "Aplicar el test de igualdad y declarar la vulneración si no hay justificación.", "justificacion": "Correcta. El test de igualdad exige fin legítimo, idoneidad, necesidad y proporcionalidad del trato. Base legal: art. 11 num. 2 de la Constitución."}, {"texto": "Aceptarla, porque el legislador puede diferenciar sin dar razones.", "justificacion": "Incorrecta. Todo trato diferenciado debe justificarse con fin legítimo, idoneidad, necesidad y proporcionalidad."}, {"texto": "Aceptarla, porque la igualdad no admite tratos diferenciados justificados.", "justificacion": "Incorrecta. La igualdad admite trato diferenciado justificado; aquí falta justificación."}, {"texto": "Declararla inconstitucional sin test, porque toda diferencia discrimina.", "justificacion": "Incorrecta. No toda diferencia es discriminación; debe aplicarse el test de igualdad."}], "correcta": 0, "referencias": ["CRE"]}, {"id": "EX-303", "area": 1, "subarea": "Derecho Constitucional", "tema": "No regresividad y contenido esencial", "resultado": "Evalúa la regresividad de una medida que reduce protección.", "demanda": "Evaluar", "enunciado": "Una ley reduce la protección de un derecho social ya alcanzado, sin justificación, afectando su contenido esencial y sin medidas compensatorias. ¿Qué principio se vulnera?", "opciones": [{"texto": "No regresividad.", "justificacion": "Correcta. La progresividad prohíbe retrocesos injustificados que afecten el contenido esencial. Base legal: art. 11 num. 8 de la Constitución."}, {"texto": "Legalidad.", "justificacion": "Incorrecta. El problema no es la competencia, sino la reducción injustificada de protección."}, {"texto": "Publicidad.", "justificacion": "Incorrecta. No hay datos de falta de publicación; el vicio es la regresividad."}, {"texto": "Seguridad jurídica.", "justificacion": "Incorrecta. No toda ley nueva vulnera seguridad; aquí el vicio es la regresividad injustificada."}], "correcta": 0, "referencias": ["CRE"]}, {"id": "EX-304", "area": 1, "subarea": "Derecho Constitucional", "tema": "Acción por incumplimiento", "resultado": "Distingue acción por incumplimiento de acción de protección.", "demanda": "Analizar", "enunciado": "Un colectivo exige que se cumpla una sentencia de la Corte Interamericana que el Estado no ha ejecutado, pese a ser clara y exigible. ¿Qué garantía corresponde?", "opciones": [{"texto": "Acción por incumplimiento.", "justificacion": "Correcta. La acción por incumplimiento procede para exigir cumplimiento de sentencias e informes. Base legal: art. 93 de la Constitución."}, {"texto": "Acción de protección.", "justificacion": "Incorrecta. Para exigir cumplimiento de sentencias y normas existe la acción por incumplimiento."}, {"texto": "Hábeas corpus.", "justificacion": "Incorrecta. El hábeas corpus protege la libertad, no el cumplimiento de sentencias internacionales."}, {"texto": "Acción de inconstitucionalidad contra la omisión del Estado.", "justificacion": "Incorrecta. No se cuestiona la constitucionalidad de la sentencia, sino su incumplimiento."}], "correcta": 0, "referencias": ["CRE"]}, {"id": "EX-305", "area": 1, "subarea": "Derecho Administrativo", "tema": "Procedimiento sancionador y non bis in idem", "resultado": "Aplica non bis in idem en sanción administrativa y penal.", "demanda": "Evaluar", "enunciado": "Un servidor es sancionado administrativamente por un hecho y luego es procesado penalmente por el mismo hecho, con mismo fundamento y mismo bien jurídico. Alegó non bis in idem y fue rechazado por ser vías distintas. ¿Es correcto el rechazo?", "opciones": [{"texto": "No, porque si hay identidad de sujeto, hecho y fundamento, se vulnera non bis in idem.", "justificacion": "Correcta. El non bis in idem prohíbe doble sanción con identidad de sujeto, hecho y fundamento. Base legal: art. 76.7 de la Constitución de la República."}, {"texto": "Sí, porque la vía administrativa y la penal nunca configuran non bis in idem aunque sea el mismo hecho.", "justificacion": "Incorrecta. Si hay identidad de sujeto, hecho y fundamento, puede configurarse non bis in idem."}, {"texto": "No, porque toda sanción administrativa impide siempre cualquier proceso penal posterior.", "justificacion": "Incorrecta. No toda sanción administrativa impide proceso penal; depende de la identidad de fundamento."}, {"texto": "Sí, porque el servidor siempre puede ser sancionado dos veces por el mismo hecho.", "justificacion": "Incorrecta. No siempre; depende de la identidad de fundamento y bien jurídico."}], "correcta": 0, "referencias": ["CRE"]}, {"id": "EX-306", "area": 1, "subarea": "Derecho Constitucional", "tema": "Garantía jurisdiccional y daño irreparable", "resultado": "Evalúa el daño irreparable en acción de protección.", "demanda": "Evaluar", "enunciado": "Una comunidad alega que si no se suspende una obra, se destruirá irreversiblemente un ecosistema y se afectará su derecho al agua, sin posibilidad de reparación posterior. ¿Qué elemento justifica la acción urgente?", "opciones": [{"texto": "Daño irreparable: la destrucción irreversible no admite reparación posterior.", "justificacion": "Correcta. El daño irreparable justifica la protección urgente cuando la reparación posterior es imposible. Base legal: art. 88 de la Constitución de la República; art. 39 de la Ley Orgánica de Garantías Jurisdiccionales y Control Constitucional."}, {"texto": "Daño moral, porque toda afectación ambiental lo genera de forma automática.", "justificacion": "Incorrecta. El elemento clave es la irreparabilidad, no el daño moral automático."}, {"texto": "Daño patrimonial, porque la destrucción genera un perjuicio cuantificable.", "justificacion": "Incorrecta. El daño patrimonial no captura la irreversibilidad del ecosistema."}, {"texto": "Daño eventual, porque la obra podría o no destruir el ecosistema.", "justificacion": "Incorrecta. No es eventual; hay riesgo concreto de destrucción irreversible."}], "correcta": 0, "referencias": ["CRE", "LOGJCC"]}, {"id": "EX-307", "area": 2, "subarea": "Derecho Penal (parte general)", "tema": "Error de tipo y error de prohibición", "resultado": "Distingue error de tipo de error de prohibición en caso de dolo.", "demanda": "Evaluar", "enunciado": "Un cazador dispara a lo que cree que es un animal, pero era una persona oculta entre arbustos. No había forma de preverlo con diligencia media. ¿Qué error se configura y qué efecto tiene?", "opciones": [{"texto": "Error de tipo invencible, porque desconocía un elemento del tipo y elimina el dolo y la culpa.", "justificacion": "Correcta. El error sobre un elemento del tipo, invencible, excluye dolo y culpa. Base legal: art. 28.1 del Código Orgánico Integral Penal."}, {"texto": "Error de prohibición invencible, porque desconocía que matar estaba prohibido por la ley penal.", "justificacion": "Incorrecta. No desconoce la prohibición; desconoce un elemento del tipo: que era una persona."}, {"texto": "Error de tipo vencible, porque debió prever que podía ser una persona y responde por culpa.", "justificacion": "Incorrecta. Si era imprevisible con diligencia media, el error es invencible, no vencible."}, {"texto": "Dolo eventual, porque asumió el riesgo de que fuera una persona y disparó de todos modos.", "justificacion": "Incorrecta. No hay asunción del riesgo; creía razonablemente que era un animal."}], "correcta": 0, "referencias": ["COIP"]}, {"id": "EX-308", "area": 2, "subarea": "Derecho Penal (parte general)", "tema": "Autoría mediata y aparato de poder", "resultado": "Aplica autoría mediata por dominio de aparato organizado.", "demanda": "Analizar", "enunciado": "Un comandante ordena a subordinados ejecutar desapariciones, dentro de una estructura jerárquica donde los ejecutores son fungibles y actúan con dolo. El comandante no ejecuta materialmente. ¿Cómo responde?", "opciones": [{"texto": "Como autor mediato, por dominar un aparato organizado de poder.", "justificacion": "Correcta. Hay autoría mediata por dominio de aparato organizado de poder con ejecutores fungibles. Base legal: art. 42 del Código Orgánico Integral Penal."}, {"texto": "Como cómplice, porque solo ordenó sin ejecutar materialmente el delito.", "justificacion": "Incorrecta. Quien domina el aparato y ordena, responde como autor mediato, no como cómplice."}, {"texto": "Como coautor, porque comandante y subordinados ejecutaron conjuntamente con reparto de funciones.", "justificacion": "Incorrecta. No hay coautoría horizontal; hay dominio vertical del aparato por el comandante."}, {"texto": "Como encubridor, porque conocía el delito pero no participó en su ejecución.", "justificacion": "Incorrecta. El encubrimiento es posterior; aquí hay dominio del hecho desde la orden."}], "correcta": 0, "referencias": ["COIP"]}, {"id": "EX-309", "area": 2, "subarea": "Derecho Penal (parte general)", "tema": "Coautoría y complicidad", "resultado": "Distingue coautoría funcional de complicidad necesaria.", "demanda": "Evaluar", "enunciado": "Dos personas planean un robo. Una vigila la entrada con arma y la otra sustrae bienes, con reparto funcional y dominio conjunto. La vigilante no sustrae bienes. ¿Cómo responde la vigilante?", "opciones": [{"texto": "Como coautora, por el reparto de funciones del plan común.", "justificacion": "Correcta. La coautoría funcional exige plan común y aporte esencial con dominio del hecho. Base legal: arts. 42 y 43 del Código Orgánico Integral Penal."}, {"texto": "Como cómplice, porque no ejecutó la sustracción y solo vigiló.", "justificacion": "Incorrecta. La vigilancia con dominio funcional y plan común es coautoría, no mera complicidad."}, {"texto": "Como encubridora, porque su aporte fue posterior a la sustracción.", "justificacion": "Incorrecta. Su aporte fue durante la ejecución, no posterior."}, {"texto": "Como autora mediata, porque usó a la otra persona como instrumento.", "justificacion": "Incorrecta. La otra persona actúa con dolo; no hay instrumentalización sin dolo."}], "correcta": 0, "referencias": ["COIP"]}, {"id": "EX-310", "area": 2, "subarea": "Derecho Penal (parte general)", "tema": "Tentativa inidónea y delito imposible", "resultado": "Distingue tentativa punible de delito imposible.", "demanda": "Evaluar", "enunciado": "Una persona dispara con arma descargada que creía cargada, con intención de matar, pero por superstición cree que el arma matará igual. ¿Qué se configura?", "opciones": [{"texto": "Delito imposible por inidoneidad absoluta del medio y del objeto, no punible.", "justificacion": "Correcta. La inidoneidad absoluta del medio hace que el delito sea imposible y no punible. Base legal: art. 39 del Código Orgánico Integral Penal (la tentativa exige actos idóneos)."}, {"texto": "Tentativa punible, porque realizó actos idóneos para matar aunque el resultado no se produjo.", "justificacion": "Incorrecta. El medio era absolutamente inidóneo; no hay tentativa punible."}, {"texto": "Tentativa inidónea punible, porque aunque el medio era inidóneo, el autor creía que era idóneo.", "justificacion": "Incorrecta. La creencia no convierte en punible la inidoneidad absoluta del medio."}, {"texto": "Delito consumado, porque la intención de matar ya se manifestó con el disparo.", "justificacion": "Incorrecta. Sin resultado ni idoneidad, no hay consumación."}], "correcta": 0, "referencias": ["COIP"]}, {"id": "EX-313", "area": 2, "subarea": "Derecho Penal (parte general)", "tema": "Legítima defensa putativa", "resultado": "Distingue legítima defensa real de putativa.", "demanda": "Analizar", "enunciado": "Una persona cree erróneamente que otra la atacará con un arma, porque la otra saca un celular, y la lesiona. No había agresión real. ¿Qué se configura?", "opciones": [{"texto": "Defensa putativa: error sobre la existencia de la agresión.", "justificacion": "Correcta. La defensa putativa es error sobre la existencia de agresión y se valora por su vencibilidad. Base legal: arts. 28 y 33 del Código Orgánico Integral Penal."}, {"texto": "Legítima defensa, porque actuó frente a una agresión que creía real.", "justificacion": "Incorrecta. Sin agresión real no hay legítima defensa; hay defensa putativa por error."}, {"texto": "Estado de necesidad, porque sacrificó un bien ajeno ante un peligro.", "justificacion": "Incorrecta. No hay peligro real ni conflicto de bienes; hay error sobre la agresión."}, {"texto": "Cumplimiento de un deber legal de defenderse frente a terceros.", "justificacion": "Incorrecta. No hay deber legal; hay error sobre la agresión."}], "correcta": 0, "referencias": ["COIP"]}, {"id": "EX-316", "area": 2, "subarea": "Derecho Penal (parte especial)", "tema": "Femicidio y asesinato", "resultado": "Distingue femicidio de asesinato con agravante de género.", "demanda": "Evaluar", "enunciado": "Un hombre mata a su pareja con alevosía, por su condición de mujer y en contexto de violencia de género previa. El fiscal acusa por asesinato y femicidio. ¿Qué debe resolver el juez?", "opciones": [{"texto": "Condenar solo por femicidio, tipo especial que desplaza al asesinato.", "justificacion": "Correcta. El femicidio, como tipo especial por género, desplaza al asesinato en concurso aparente. Base legal: arts. 140 y 141 del Código Orgánico Integral Penal."}, {"texto": "Condenar por ambos, porque son dos delitos independientes que concurren realmente.", "justificacion": "Incorrecta. Hay concurso aparente; el femicidio es tipo especial que desplaza al asesinato."}, {"texto": "Condenar solo por asesinato, porque la alevosía es más grave que el género.", "justificacion": "Incorrecta. La alevosía no desplaza el tipo especial de femicidio."}, {"texto": "Absolver por uno y condenar por lesiones, porque no puede haber femicidio con alevosía.", "justificacion": "Incorrecta. La alevosía puede concurrir con femicidio; no lo excluye."}], "correcta": 0, "referencias": ["COIP"]}, {"id": "EX-318", "area": 2, "subarea": "Derecho Penal (parte especial)", "tema": "Lavado de activos", "resultado": "Aplica la autonomía del lavado de activos.", "demanda": "Evaluar", "enunciado": "Una persona oculta fondos provenientes de narcotráfico, pero no se logra probar quién cometió el narcotráfico ni se condena por ese delito. ¿Puede condenarse por lavado de activos?", "opciones": [{"texto": "Sí: el lavado es autónomo y basta acreditar el origen ilícito.", "justificacion": "Correcta. El lavado de activos es autónomo de otros delitos; no se requiere sentencia previa por el delito del que provienen los bienes, sino acreditar su origen ilícito (art. 317 del Código Orgánico Integral Penal)."}, {"texto": "No: sin condena previa por el delito fuente no hay lavado.", "justificacion": "Incorrecta. El lavado es autónomo; basta acreditar el origen ilícito, no la condena previa."}, {"texto": "No: el lavado exige que el mismo autor cometa el delito fuente.", "justificacion": "Incorrecta. El lavado puede cometerlo persona distinta al autor del delito previo."}, {"texto": "Sí, pero solo si participó en el narcotráfico que originó los fondos.", "justificacion": "Incorrecta. No exige participar en el delito previo; basta conocer el origen ilícito."}], "correcta": 0, "referencias": ["COIP"]}, {"id": "EX-319", "area": 2, "subarea": "Derecho Penal (parte especial)", "tema": "Violación y abuso sexual", "resultado": "Distingue violación de abuso sexual por acceso carnal.", "demanda": "Analizar", "enunciado": "Un adulto realiza tocamientos sexuales a un niño sin acceso carnal, con violencia. La defensa alega que es violación porque hubo violencia. ¿Qué delito se configura?", "opciones": [{"texto": "Abuso sexual, porque hubo actos sexuales sin acceso carnal.", "justificacion": "Correcta. El abuso sexual comprende los actos de naturaleza sexual sin acceso carnal (art. 170 del Código Orgánico Integral Penal); la violación exige acceso carnal (art. 171). Base legal: arts. 166, 167, 170 y 171 del Código Orgánico Integral Penal."}, {"texto": "Violación, porque toda agresión sexual con violencia lo es.", "justificacion": "Incorrecta. Sin acceso carnal no hay violación."}, {"texto": "Acoso sexual, porque los tocamientos buscaban un acto sexual.", "justificacion": "Incorrecta. El acoso consiste en solicitar actos sexuales aprovechando una situación de superioridad (art. 166)."}, {"texto": "Estupro, porque la víctima es menor y hubo engaño.", "justificacion": "Incorrecta. El estupro exige engaño a una persona mayor de catorce y menor de dieciocho años con acceso carnal (art. 167)."}], "correcta": 0, "referencias": ["COIP"]}, {"id": "EX-320", "area": 2, "subarea": "Derecho Penal (parte especial)", "tema": "Trata de personas y tráfico ilícito", "resultado": "Distingue trata de personas de tráfico ilícito de migrantes.", "demanda": "Evaluar", "enunciado": "Una red capta a mujeres con engaño, las traslada y las explota sexualmente, sin consentimiento válido. La defensa alega que es tráfico de migrantes porque las trasladó. ¿Qué delito es?", "opciones": [{"texto": "Trata de personas, porque hubo captación con engaño y explotación sexual.", "justificacion": "Correcta. La trata exige captación, traslado y explotación con medios como engaño. Base legal: arts. 91 y 213 del Código Orgánico Integral Penal."}, {"texto": "Tráfico ilícito de migrantes, porque hubo traslado de personas a otro país.", "justificacion": "Incorrecta. El tráfico es traslado con consentimiento para evadir migración; aquí hay captación y explotación."}, {"texto": "Tráfico de personas, porque ambos delitos son idénticos y se sancionan igual.", "justificacion": "Incorrecta. Son delitos distintos; la trata exige explotación, el tráfico no."}, {"texto": "Proxenetismo, porque solo hubo explotación sexual sin traslado.", "justificacion": "Incorrecta. Hubo captación y traslado con explotación, que configuran trata."}], "correcta": 0, "referencias": ["COIP"]}, {"id": "EX-321", "area": 2, "subarea": "Derecho Penal (parte especial)", "tema": "Delitos contra la propiedad y violencia", "resultado": "Distingue robo con violencia de robo con fuerza en las cosas.", "demanda": "Analizar", "enunciado": "Una persona rompe la ventana de una casa vacía y sustrae bienes, sin violencia contra personas. ¿Qué delito comete?", "opciones": [{"texto": "Robo, porque se apoderó de los bienes empleando fuerza en las cosas.", "justificacion": "Correcta. El robo con fuerza en las cosas exige fuerza en las cosas para el apoderamiento. Base legal: arts. 189 y 196 del Código Orgánico Integral Penal."}, {"texto": "Robo con violencia contra personas, porque rompió la ventana con violencia.", "justificacion": "Incorrecta. La violencia contra cosas no es violencia contra personas."}, {"texto": "Hurto, porque no hubo violencia contra personas.", "justificacion": "Incorrecta. Hubo fuerza en las cosas, que califica como robo, no hurto."}, {"texto": "Daño a bien ajeno, porque solo rompió la ventana y no sustrajo con violencia.", "justificacion": "Incorrecta. Hubo sustracción con fuerza, que es robo, no solo daño."}], "correcta": 0, "referencias": ["COIP"]}, {"id": "EX-322", "area": 2, "subarea": "Derecho Procesal Penal", "tema": "Prisión preventiva y caducidad", "resultado": "Aplica la caducidad de la prisión preventiva.", "demanda": "Evaluar", "enunciado": "Un procesado lleva 11 meses en prisión preventiva por delito con pena máxima de 5 años, sin sentencia. La Fiscalía pide prórroga por complejidad. ¿Qué corresponde?", "opciones": [{"texto": "Ordenar su libertad, porque caducó la prisión preventiva por exceder el plazo legal.", "justificacion": "Correcta. La prisión preventiva no puede exceder de seis meses en delitos sancionados con prisión ni de un año en delitos sancionados con reclusión; si se exceden, queda sin efecto (art. 77 num. 9 de la Constitución; art. 541 del Código Orgánico Integral Penal). Con pena máxima de cinco años, el plazo es de seis meses."}, {"texto": "Mantenerla, porque la complejidad justifica prorrogar la prisión preventiva indefinidamente.", "justificacion": "Incorrecta. La prisión preventiva tiene límite temporal y caduca si excede el plazo legal."}, {"texto": "Sustituirla por arresto domiciliario sin audiencia, porque la caducidad es automática sin control.", "justificacion": "Incorrecta. La caducidad requiere control judicial y puede sustituirse por otra medida, no automática sin audiencia."}, {"texto": "Mantenerla, porque la gravedad del delito impide la caducidad de la prisión preventiva.", "justificacion": "Incorrecta. La gravedad no impide la caducidad; el plazo es límite constitucional."}], "correcta": 0, "referencias": ["CRE", "COIP"]}, {"id": "EX-323", "area": 2, "subarea": "Derecho Procesal Penal", "tema": "Prueba ilícita derivada", "resultado": "Aplica la teoría del fruto del árbol envenenado.", "demanda": "Evaluar", "enunciado": "La policía obtiene sin orden una confesión ilícita que revela dónde está el arma. Luego, con esa información, obtiene orden y recoge el arma. La defensa pide excluir el arma. ¿Qué corresponde?", "opciones": [{"texto": "Excluir el arma, porque deriva de una prueba obtenida ilícitamente.", "justificacion": "Correcta. La prueba derivada de una ilícita se excluye por ser fruto del árbol envenenado, salvo excepciones. Base legal: art. 76 num. 4 de la Constitución; art. 454 num. 6 del Código Orgánico Integral Penal."}, {"texto": "Admitir el arma, porque se recogió con una orden judicial válida.", "justificacion": "Incorrecta. Si deriva de prueba ilícita, puede ser ilícita derivada y excluirse."}, {"texto": "Valorarla con menor peso, porque es auténtica aunque derive de otra ilícita.", "justificacion": "Incorrecta. La prueba ilícita derivada se excluye, no se valora con menor peso."}, {"texto": "Admitirla, porque la evidencia material no puede ser prueba ilícita.", "justificacion": "Incorrecta. La prueba material también puede ser ilícita derivada."}], "correcta": 0, "referencias": ["CRE", "COIP"]}, {"id": "EX-324", "area": 2, "subarea": "Derecho Procesal Penal", "tema": "Procedimiento abreviado y víctima", "resultado": "Evalúa los derechos de la víctima en procedimiento abreviado.", "demanda": "Analizar", "enunciado": "En procedimiento abreviado, el procesado admite el hecho y acepta pena, pero la víctima no fue escuchada ni se reparó el daño. ¿Qué vicio existe?", "opciones": [{"texto": "Vulneración del derecho de la víctima a ser escuchada y a la reparación integral.", "justificacion": "Correcta. La víctima debe ser escuchada y debe considerarse la reparación integral. Base legal: arts. 635 a 638 del Código Orgánico Integral Penal; art. 78 de la Constitución."}, {"texto": "Ninguno, porque la víctima no tiene derechos en el procedimiento abreviado.", "justificacion": "Incorrecta. La víctima debe ser escuchada y la reparación es relevante en el abreviado."}, {"texto": "Ninguno, porque el abreviado solo requiere acuerdo entre fiscal y procesado.", "justificacion": "Incorrecta. El abreviado exige escuchar a la víctima, aunque no requiera su consentimiento."}, {"texto": "Nulidad automática, porque sin reparación no puede haber procedimiento abreviado.", "justificacion": "Incorrecta. La falta de escucha no genera nulidad automática, pero vulnera derechos de la víctima."}], "correcta": 0, "referencias": ["COIP", "CRE"]}, {"id": "EX-325", "area": 2, "subarea": "Derecho Procesal Penal", "tema": "Principio de oportunidad", "resultado": "Aplica el principio de oportunidad y su control.", "demanda": "Comprender", "enunciado": "La Fiscalía decide no acusar por un delito de bagatela, con pena máxima de 1 año, sin violencia, y con reparación del daño. ¿Qué principio aplica?", "opciones": [{"texto": "Principio de oportunidad, porque permite abstención por bagatela, reparación y baja pena.", "justificacion": "Correcta. El principio de oportunidad permite no ejercer la acción penal en casos de bagatela. Base legal: art. 412 del Código Orgánico Integral Penal."}, {"texto": "Principio de legalidad, porque la Fiscalía debe acusar en todos los delitos sin excepción.", "justificacion": "Incorrecta. El principio de oportunidad permite abstención en casos de bagatela con requisitos."}, {"texto": "Principio de proporcionalidad, porque la pena sería desproporcionada para el delito.", "justificacion": "Incorrecta. La proporcionalidad regula la pena, no la abstención de acusar."}, {"texto": "Principio de presunción de inocencia, porque el procesado no fue condenado.", "justificacion": "Incorrecta. La presunción no es el fundamento de la abstención; es la oportunidad."}], "correcta": 0, "referencias": ["COIP"]}, {"id": "EX-326", "area": 2, "subarea": "Derecho Procesal Penal", "tema": "Detención y flagrancia", "resultado": "Evalúa la legalidad de la detención en flagrancia.", "demanda": "Evaluar", "enunciado": "Una persona es detenida tres días después del delito, sin orden, porque la policía alega flagrancia por haber encontrado el objeto robado en su poder. ¿Es legal la detención?", "opciones": [{"texto": "No, porque no hay flagrancia por falta de inmediatez y se requería orden judicial.", "justificacion": "Correcta. La flagrancia exige inmediatez o persecución ininterrumpida de máximo cuarenta y ocho horas; sin ella, la detención requiere orden judicial. Base legal: art. 77 num. 1 de la Constitución; art. 527 del Código Orgánico Integral Penal."}, {"texto": "Sí, porque el hallazgo del objeto robado configura flagrancia en cualquier momento.", "justificacion": "Incorrecta. La flagrancia exige inmediatez; tres días después no hay flagrancia."}, {"texto": "Sí, porque la policía puede detener sin orden cuando hay sospecha de delito.", "justificacion": "Incorrecta. La sospecha no autoriza detención sin orden ni flagrancia."}, {"texto": "No, porque toda detención sin orden es ilegal aunque haya flagrancia.", "justificacion": "Incorrecta. La detención en flagrancia sin orden sí es legal si hay inmediatez."}], "correcta": 0, "referencias": ["CRE", "COIP"]}, {"id": "EX-327", "area": 2, "subarea": "Derecho Procesal Penal", "tema": "Casación penal", "resultado": "Distingue casación de apelación en materia penal.", "demanda": "Analizar", "enunciado": "La defensa alega que la sentencia de segunda instancia valoró mal la prueba testimonial y pide casación para revalorarla. ¿Procede la casación?", "opciones": [{"texto": "No, porque la casación no revalora prueba, solo controla errores de derecho.", "justificacion": "Correcta. La casación controla la correcta aplicación del derecho, no la valoración de prueba. Base legal: art. 656 del Código Orgánico Integral Penal."}, {"texto": "Sí, porque la casación permite revalorar toda la prueba del juicio.", "justificacion": "Incorrecta. La casación revisa errores de derecho, no revalora prueba."}, {"texto": "No, porque la casación solo procede contra autos de prisión preventiva.", "justificacion": "Incorrecta. La casación procede contra sentencias, no solo contra autos."}, {"texto": "Sí, porque la casación es una tercera instancia para revisar hechos y prueba.", "justificacion": "Incorrecta. La casación no es tercera instancia de hechos."}], "correcta": 0, "referencias": ["COIP"]}, {"id": "EX-328", "area": 2, "subarea": "Derecho Procesal Penal", "tema": "Revisión penal", "resultado": "Identifica las causales de revisión penal.", "demanda": "Comprender", "enunciado": "Tras sentencia ejecutoriada, aparece una prueba de ADN que demuestra que el condenado no cometió el delito. ¿Qué recurso procede?", "opciones": [{"texto": "Revisión, porque procede por prueba nueva que demuestra inocencia del condenado.", "justificacion": "Correcta. La revisión procede por prueba nueva que evidencia error en la condena. Base legal: art. 658 del Código Orgánico Integral Penal."}, {"texto": "Apelación, porque permite revisar la sentencia y la prueba nueva.", "justificacion": "Incorrecta. La apelación no procede contra sentencia ejecutoriada."}, {"texto": "Casación, porque permite revisar la valoración de la prueba de ADN.", "justificacion": "Incorrecta. La casación no procede contra sentencia ejecutoriada por prueba nueva."}, {"texto": "Acción extraordinaria, porque permite revisar sentencias ejecutoriadas por prueba nueva.", "justificacion": "Incorrecta. La acción extraordinaria revisa vulneración de derechos, no prueba nueva."}], "correcta": 0, "referencias": ["COIP"]}, {"id": "EX-330", "area": 2, "subarea": "Derecho Penal (parte especial)", "tema": "Delito de odio", "resultado": "Aplica el delito de odio y su motivación.", "demanda": "Analizar", "enunciado": "Una persona agrede a otra por su orientación sexual, con insultos homofóbicos y lesiones, para intimidarla por su identidad. ¿Qué delito se configura?", "opciones": [{"texto": "Delito de odio, porque la agresión se motivó en la orientación sexual de la víctima.", "justificacion": "Correcta. El delito de odio exige agresión motivada por orientación sexual, identidad u otra condición. Base legal: art. 177 del Código Orgánico Integral Penal."}, {"texto": "Lesiones simples, porque la motivación no cambia la calificación de las lesiones.", "justificacion": "Incorrecta. La motivación por odio configura delito de odio, no solo lesiones."}, {"texto": "Discriminación, porque toda agresión por orientación es solo discriminación administrativa.", "justificacion": "Incorrecta. La discriminación administrativa es distinta del delito de odio penal."}, {"texto": "Injuria, porque los insultos homofóbicos son solo injurias.", "justificacion": "Incorrecta. Hubo lesiones con motivación de odio, que configuran delito de odio."}], "correcta": 0, "referencias": ["COIP"]}, {"id": "EX-331", "area": 2, "subarea": "Derecho Procesal Penal", "tema": "Medidas de protección y no revictimización", "resultado": "Aplica la no revictimización en delitos sexuales.", "demanda": "Evaluar", "enunciado": "En un juicio por violación, el tribunal ordena que la víctima declare 5 veces, en audiencias públicas, sin cámara de Gesell, pese a su afectación. ¿Qué principio se vulnera?", "opciones": [{"texto": "No revictimización.", "justificacion": "Correcta. La no revictimización exige evitar declaraciones reiteradas y proteger a la víctima. Base legal: art. 78 de la Constitución; art. 11 del Código Orgánico Integral Penal."}, {"texto": "Publicidad.", "justificacion": "Incorrecta. La publicidad cede ante la protección y no revictimización de la víctima."}, {"texto": "Contradicción.", "justificacion": "Incorrecta. La contradicción no exige declaraciones reiteradas sin protección."}, {"texto": "Inmediación.", "justificacion": "Incorrecta. La inmediación no exige revictimizar con declaraciones reiteradas."}], "correcta": 0, "referencias": ["CRE", "COIP"]}, {"id": "EX-332", "area": 2, "subarea": "Derecho Penal (parte general)", "tema": "Concurso real y pena", "resultado": "Aplica la acumulación de penas en concurso real.", "demanda": "Aplicar", "enunciado": "Una persona comete dos robos independientes en fechas distintas, con dos sentencias en un solo proceso. ¿Cómo se determina la pena?", "opciones": [{"texto": "Se acumulan las penas de ambos delitos, hasta el máximo previsto para el concurso real.", "justificacion": "Correcta. En el concurso real se acumulan las penas hasta un máximo del doble de la pena más grave, sin que exceda de cuarenta años (art. 20 del Código Orgánico Integral Penal)."}, {"texto": "Se impone solo la pena del delito más grave, porque el concurso real se sanciona con una pena.", "justificacion": "Incorrecta. En concurso real se acumulan penas hasta el máximo legal."}, {"texto": "Se impone la pena del último delito, porque el primero se considera absorbido.", "justificacion": "Incorrecta. No hay absorción en concurso real; hay acumulación."}, {"texto": "Se impone la mitad de cada pena, porque el concurso real reduce las penas.", "justificacion": "Incorrecta. El concurso real no reduce; acumula hasta el máximo."}], "correcta": 0, "referencias": ["COIP"]}, {"id": "EX-334", "area": 3, "subarea": "Derecho Procesal (COGEP)", "tema": "Cosa juzgada y litispendencia", "resultado": "Distingue cosa juzgada de litispendencia.", "demanda": "Analizar", "enunciado": "Un actor demanda por cobro de deuda ya resuelta con sentencia ejecutoriada, y simultáneamente tiene otro juicio pendiente por la misma deuda y partes. ¿Qué excepciones concurren?", "opciones": [{"texto": "Cosa juzgada para el proceso ya resuelto y litispendencia para el pendiente.", "justificacion": "Correcta. La cosa juzgada aplica al proceso resuelto; la litispendencia al pendiente. Base legal: art. 153 nums. 5 y 8 del Código Orgánico General de Procesos."}, {"texto": "Solo litispendencia, porque hay dos juicios pendientes por la misma causa.", "justificacion": "Incorrecta. Hay juicio pendiente y sentencia ejecutoriada; concurren ambas excepciones."}, {"texto": "Ninguna, porque la deuda puede demandarse varias veces sin límite.", "justificacion": "Incorrecta. La cosa juzgada y litispendencia impiden doble juzgamiento."}, {"texto": "Solo cosa juzgada, porque la existencia de otro juicio pendiente no genera litispendencia.", "justificacion": "Incorrecta. La litispendencia sí se configura por juicio pendiente con identidad de causa."}], "correcta": 0, "referencias": ["COGEP"]}, {"id": "EX-335", "area": 3, "subarea": "Derecho Procesal (COGEP)", "tema": "Carga dinámica de la prueba", "resultado": "Aplica la carga dinámica de la prueba.", "demanda": "Evaluar", "enunciado": "En un juicio de mala praxis médica, el paciente alega negligencia, pero la historia clínica está solo en poder del hospital que se niega a entregarla. ¿Cómo se distribuye la carga?", "opciones": [{"texto": "Carga dinámica: debe probar quien está en mejor posición, el hospital.", "justificacion": "Correcta. El COGEP admite que la carga recaiga en la parte que se encuentra en mejores condiciones de probar el hecho, por disponibilidad y facilidad probatoria (art. 169 del Código Orgánico General de Procesos)."}, {"texto": "El paciente debe probarlo todo, aunque no tenga acceso a la historia.", "justificacion": "Incorrecta. La carga dinámica permite trasladar la carga a quien está en mejor posición."}, {"texto": "El juez investiga de oficio, porque se elimina la carga de las partes.", "justificacion": "Incorrecta. El juez no sustituye a las partes; la carga se redistribuye según mejor posición."}, {"texto": "Nadie tiene la carga, porque sin historia clínica no puede resolverse.", "justificacion": "Incorrecta. El juicio debe resolverse con la carga redistribuida, no con abstención."}], "correcta": 0, "referencias": ["COGEP"]}, {"id": "EX-336", "area": 3, "subarea": "Derecho Procesal (COGEP)", "tema": "Prueba nueva", "resultado": "Evalúa la admisibilidad de prueba nueva en segunda instancia.", "demanda": "Evaluar", "enunciado": "En apelación, una parte presenta un documento que existía antes del juicio pero que no presentó por negligencia, alegando que es determinante. ¿Debe admitirse?", "opciones": [{"texto": "No: existía antes y no se presentó por negligencia, sin justificación.", "justificacion": "Correcta. La prueba nueva requiere justificación de no haber podido presentarse en primera instancia. Base legal: art. 258 del Código Orgánico General de Procesos."}, {"texto": "Sí, porque toda prueba determinante debe admitirse en segunda instancia.", "justificacion": "Incorrecta. La prueba nueva en apelación exige que no haya podido presentarse antes por causa justificada."}, {"texto": "Sí, porque la apelación es una nueva oportunidad para toda la prueba.", "justificacion": "Incorrecta. La apelación no es nueva oportunidad para prueba negligente."}, {"texto": "No, porque en apelación está prohibida cualquier prueba nueva.", "justificacion": "Incorrecta. Sí se admite prueba nueva en casos justificados, no nunca."}], "correcta": 0, "referencias": ["COGEP"]}, {"id": "EX-337", "area": 3, "subarea": "Derecho Procesal (COGEP)", "tema": "Nulidad procesal", "resultado": "Aplica la nulidad procesal por indefensión.", "demanda": "Evaluar", "enunciado": "En un juicio, el juez no notifica la audiencia de juicio al demandado, quien no comparece y es condenado en rebeldía. El demandado alega nulidad. ¿Procede?", "opciones": [{"texto": "Sí, porque la falta de notificación que genera indefensión produce nulidad procesal.", "justificacion": "Correcta. La falta de notificación que impide ejercer defensa genera nulidad por indefensión. Base legal: art. 107 del Código Orgánico General de Procesos."}, {"texto": "No, porque la rebeldía impide alegar nulidad por falta de notificación.", "justificacion": "Incorrecta. La falta de notificación que genera indefensión es causal de nulidad."}, {"texto": "No, porque la nulidad solo procede si el demandado prueba que habría ganado el juicio.", "justificacion": "Incorrecta. Basta la indefensión; no exige probar que habría ganado."}, {"texto": "Sí, pero solo si el demandado consigna el valor de la condena.", "justificacion": "Incorrecta. La nulidad por indefensión no exige consignar la condena."}], "correcta": 0, "referencias": ["COGEP"]}, {"id": "EX-338", "area": 3, "subarea": "Derecho Procesal (COGEP)", "tema": "Procedimiento ejecutivo y excepciones", "resultado": "Evalúa las excepciones en procedimiento ejecutivo.", "demanda": "Analizar", "enunciado": "En un juicio ejecutivo con letra de cambio, el ejecutado alega falsedad de la firma y pago parcial. El juez considera que la falsedad no es excepción en ejecutivo. ¿Es correcto?", "opciones": [{"texto": "No: en el ejecutivo pueden oponerse la falsedad del título y el pago.", "justificacion": "Correcta. En el procedimiento ejecutivo pueden oponerse, entre otras, la nulidad formal o falsedad del título y la extinción total o parcial de la obligación (art. 353 del Código Orgánico General de Procesos)."}, {"texto": "Sí: en el ejecutivo no caben las excepciones de falsedad ni de pago.", "justificacion": "Incorrecta. En ejecutivo sí pueden opone
