: "Incorrecta. El arrendador no garantiza un rendimiento económico."}], "correcta": 0, "referencias": ["CC"]}, {"id": "EX-179", "area": 4, "subarea": "Sucesiones", "tema": "Albacea", "resultado": "Identifica las funciones del albacea.", "demanda": "Comprender", "enunciado": "El testador nombra un albacea. ¿Cuál es su función principal?", "opciones": [{"texto": "Ejecutar las disposiciones del testamento por encargo del testador.", "justificacion": "Correcta. El albacea tiene como función principal la ejecución del testamento. Base legal: normas sobre los albaceas o ejecutores testamentarios del Código Civil."}, {"texto": "Representar a los herederos en todos los juicios contra la herencia.", "justificacion": "Incorrecta. La representación de los herederos no es la función principal."}, {"texto": "Decidir de forma definitiva la partición entre los coherederos.", "justificacion": "Incorrecta. La partición corresponde a los herederos o al juez."}, {"texto": "Sustituir al juez en la resolución de los conflictos sucesorios.", "justificacion": "Incorrecta. El albacea no ejerce funciones jurisdiccionales."}], "correcta": 0, "referencias": ["CC"]}, {"id": "EX-180", "area": 4, "subarea": "Obligaciones y Contratos", "tema": "Contrato de mutuo", "resultado": "Identifica la naturaleza del contrato de mutuo.", "demanda": "Comprender", "enunciado": "Una persona entrega a otra una cantidad de dinero con la obligación de restituir otro tanto. ¿Qué contrato se configura?", "opciones": [{"texto": "Mutuo.", "justificacion": "Correcta. El artículo 2115 del Código Civil define el mutuo de esa manera. Base legal: normas sobre el mutuo del Código Civil."}, {"texto": "Comodato.", "justificacion": "Incorrecta. El comodato recae sobre cosas no fungibles."}, {"texto": "Depósito.", "justificacion": "Incorrecta. El depósito no implica la facultad de usar y consumir la cosa."}, {"texto": "Compraventa.", "justificacion": "Incorrecta. En el mutuo no hay precio sino obligación de restituir otro tanto."}], "correcta": 0, "referencias": ["CC"]}, {"id": "EX-181", "area": 4, "subarea": "Personas y Familia", "tema": "Divorcio", "resultado": "Identifica las causales de divorcio.", "demanda": "Comprender", "enunciado": "Los cónyuges pretenden divorciarse por mutuo consentimiento. ¿Cuál es el régimen aplicable?", "opciones": [{"texto": "Ante juez o ante notario, aun con hijos, si su situación ya está resuelta.", "justificacion": "Correcta. El divorcio por mutuo consentimiento se tramita en procedimiento voluntario (art. 107 del Código Civil) o ante notario (art. 18 num. 22 de la Ley Notarial); desde la reforma de 2019 la vía notarial procede aun con hijos menores o dependientes, si su tenencia, alimentos y visitas ya se resolvieron judicialmente o por acta de mediación."}, {"texto": "Deben invocar una causal de divorcio y probarla en juicio.", "justificacion": "Incorrecta. El mutuo consentimiento no exige causal."}, {"texto": "Deben estar separados de hecho al menos tres años antes.", "justificacion": "Incorrecta. La ley no exige un tiempo de separación previa."}, {"texto": "Solo pueden divorciarse si nunca tuvieron hijos en común.", "justificacion": "Incorrecta. Los hijos no impiden el divorcio por mutuo consentimiento."}], "correcta": 0, "referencias": ["CC"]}, {"id": "EX-183", "area": 5, "subarea": "Mercantil", "tema": "Sociedad anónima", "resultado": "Aplica las reglas de responsabilidad de los administradores.", "demanda": "Aplicar", "enunciado": "Los administradores de una sociedad anónima realizan actos contrarios al interés social que causan perjuicio. ¿Cuál es el régimen de responsabilidad?", "opciones": [{"texto": "Responden solidariamente por los daños que causen con su gestión.", "justificacion": "Correcta. La Ley de Compañías establece la responsabilidad solidaria de los administradores por los perjuicios causados con actos contrarios a la ley, al estatuto o al interés social."}, {"texto": "Responden solo ante la sociedad y nunca ante accionistas o terceros.", "justificacion": "Incorrecta. También pueden responder frente a los accionistas y terceros."}, {"texto": "Responden únicamente hasta el monto de sus acciones en la compañía.", "justificacion": "Incorrecta. La responsabilidad no se limita a su aporte de capital."}, {"texto": "Responden solo si actuaron con dolo, nunca por culpa en la gestión.", "justificacion": "Incorrecta. La responsabilidad abarca tanto el dolo como la culpa."}], "correcta": 0, "referencias": ["LC"]}, {"id": "EX-184", "area": 5, "subarea": "Tributario", "tema": "Prescripción de la acción de cobro", "resultado": "Aplica el plazo de prescripción de la acción de cobro tributario.", "demanda": "Aplicar", "enunciado": "El SRI notifica un título de crédito. El contribuyente no paga ni impugna. ¿Cuál es el plazo de prescripción de la acción de cobro?", "opciones": [{"texto": "Cinco años desde que la obligación fue exigible.", "justificacion": "Correcta. La acción de cobro prescribe en cinco años desde la fecha en que la obligación fue exigible, y en siete si no se presentó la declaración debida (art. 55 del Código Orgánico Tributario)."}, {"texto": "Cinco años desde que se notificó el título de crédito.", "justificacion": "Incorrecta. El plazo no se cuenta desde la notificación del título, sino desde la exigibilidad."}, {"texto": "Diez años desde la emisión del acto de determinación.", "justificacion": "Incorrecta. No existe un plazo de diez años para la acción de cobro."}, {"texto": "Tres años desde la notificación del título de crédito.", "justificacion": "Incorrecta. Tres años es el plazo general de caducidad de la facultad determinadora (art. 94), no de la prescripción del cobro."}], "correcta": 0, "referencias": ["CTRIB"]}, {"id": "EX-189", "area": 5, "subarea": "Tributario", "tema": "Determinación tributaria", "resultado": "Distingue la determinación mixta de la determinación de oficio.", "demanda": "Analizar", "enunciado": "El contribuyente presenta su declaración y el SRI la acepta sin observaciones. ¿Qué tipo de determinación se ha producido?", "opciones": [{"texto": "Determinación por el sujeto pasivo, mediante su declaración.", "justificacion": "Correcta. La determinación por el sujeto pasivo se efectúa mediante la declaración que presenta el propio contribuyente; la determinación mixta es la que realiza la administración con datos que exige al contribuyente (normas sobre formas de determinación del Código Orgánico Tributario). Base legal: arts. 87 a 93 del Código Orgánico Tributario."}, {"texto": "Determinación mixta, por intervenir el contribuyente y el SRI.", "justificacion": "Incorrecta. En la mixta determina la administración con datos requeridos al contribuyente."}, {"texto": "Determinación de oficio, porque la administración la aceptó.", "justificacion": "Incorrecta. La de oficio la efectúa directamente la administración."}, {"texto": "Determinación presuntiva, basada en índices y promedios.", "justificacion": "Incorrecta. La presuntiva procede cuando no es posible la determinación directa."}], "correcta": 0, "referencias": ["CTRIB"]}, {"id": "EX-190", "area": 5, "subarea": "Laboral", "tema": "Jornada de trabajo", "resultado": "Aplica las reglas de la jornada máxima de trabajo.", "demanda": "Aplicar", "enunciado": "Un trabajador labora cuarenta y cinco horas semanales de manera habitual. ¿Cuál es el régimen de esas horas adicionales?", "opciones": [{"texto": "Son horas suplementarias que deben remunerarse con el recargo legal correspondiente.", "justificacion": "Correcta. Las horas que exceden la jornada máxima ordinaria se pagan con recargo. Base legal: art. 47 y 55 del Código del Trabajo."}, {"texto": "Son horas ordinarias porque la jornada máxima legal es de cuarenta y ocho horas semanales.", "justificacion": "Incorrecta. La jornada máxima ordinaria es de cuarenta horas."}, {"texto": "Son horas extraordinarias solo si se laboran en días de descanso obligatorio.", "justificacion": "Incorrecta. Las horas extraordinarias tienen un régimen distinto."}, {"texto": "No generan recargo porque el trabajador aceptó libremente la jornada extendida.", "justificacion": "Incorrecta. La aceptación del trabajador no elimina el derecho al recargo."}], "correcta": 0, "referencias": ["CT"]}, {"id": "EX-193", "area": 5, "subarea": "Tributario", "tema": "Exenciones tributarias", "resultado": "Identifica el carácter de las exenciones tributarias.", "demanda": "Comprender", "enunciado": "Una norma establece una exención tributaria a favor de cierto grupo de contribuyentes. ¿Cuál es su naturaleza?", "opciones": [{"texto": "Es una excepción a la obligación tributaria que debe interpretarse de manera restrictiva.", "justificacion": "Correcta. Las exenciones son de interpretación restrictiva. Base legal: art. 35 del Código Orgánico Tributario."}, {"texto": "Es un beneficio de carácter general que se aplica a todos los contribuyentes por igual.", "justificacion": "Incorrecta. La exención es una excepción a la regla general de tributación."}, {"texto": "Es un derecho subjetivo del contribuyente que puede extenderse por analogía a casos similares.", "justificacion": "Incorrecta. No procede la analogía para extender el ámbito de las exenciones."}, {"texto": "Es una facultad discrecional de la administración tributaria que se otorga caso por caso.", "justificacion": "Incorrecta. La exención es de origen legal y no discrecional."}], "correcta": 0, "referencias": ["CTRIB"]}, {"id": "EX-194", "area": 5, "subarea": "Laboral", "tema": "Finiquito", "resultado": "Identifica el valor del acta de finiquito.", "demanda": "Comprender", "enunciado": "Las partes suscriben un acta de finiquito ante el inspector de trabajo. ¿Cuál es su valor?", "opciones": [{"texto": "Tiene valor reforzado y se impugna por causas como el error de cálculo.", "justificacion": "Correcta. El finiquito celebrado ante inspector de trabajo tiene presunción de legitimidad. Base legal: art. 595 del Código del Trabajo."}, {"texto": "Es un documento privado que puede impugnarse libremente en cualquier tiempo.", "justificacion": "Incorrecta. El finiquito celebrado ante autoridad de trabajo tiene un valor reforzado."}, {"texto": "Extingue todos los derechos del trabajador sin reclamo posterior posible.", "justificacion": "Incorrecta. Pueden reclamarse derechos no incluidos o no renunciables."}, {"texto": "Requiere homologación judicial para adquirir fuerza ejecutiva.", "justificacion": "Incorrecta. El finiquito ante inspector no requiere homologación judicial adicional."}], "correcta": 0, "referencias": ["CT"]}, {"id": "EX-196", "area": 5, "subarea": "Tributario", "tema": "Responsabilidad solidaria", "resultado": "Identifica los casos de responsabilidad solidaria en materia tributaria.", "demanda": "Aplicar", "enunciado": "Los representantes legales de una sociedad dejan de pagar los tributos debidos. ¿Cuál es su régimen de responsabilidad?", "opciones": [{"texto": "Pueden responder de manera solidaria por los tributos adeudados por la sociedad.", "justificacion": "Correcta. El Código Orgánico Tributario establece supuestos de responsabilidad solidaria de los representantes. Base legal: art. 26 y 27 del Código Orgánico Tributario."}, {"texto": "Responden solo de manera subsidiaria después de agotar los bienes de la sociedad.", "justificacion": "Incorrecta. En ciertos casos la responsabilidad es solidaria."}, {"texto": "No responden personalmente porque la obligación tributaria es exclusivamente de la sociedad.", "justificacion": "Incorrecta. Existen casos de responsabilidad personal de los representantes."}, {"texto": "Responden solo cuando media dolo o culpa grave en la administración de la sociedad.", "justificacion": "Incorrecta. La solidaridad no siempre exige la demostración de dolo o culpa grave."}], "correcta": 0, "referencias": ["CTRIB"]}, {"id": "EX-198", "area": 5, "subarea": "Tributario", "tema": "Impuesto a la renta", "resultado": "Identifica el hecho generador del impuesto a la renta.", "demanda": "Comprender", "enunciado": "¿Cuál es el hecho generador del impuesto a la renta en Ecuador?", "opciones": [{"texto": "La obtención de ingresos gravados por parte de personas naturales o sociedades.", "justificacion": "Correcta. La Ley de Régimen Tributario Interno establece como hecho generador la obtención de rentas. Base legal: art. 1 y 2 de la Ley de Régimen Tributario Interno."}, {"texto": "La transferencia de dominio de bienes inmuebles a título oneroso o gratuito.", "justificacion": "Incorrecta. Ese es el hecho generador de otros impuestos."}, {"texto": "El consumo de bienes y servicios gravados con tarifa del impuesto al valor agregado.", "justificacion": "Incorrecta. Ese es el hecho generador del IVA."}, {"texto": "La propiedad o posesión de vehículos motorizados de transporte terrestre.", "justificacion": "Incorrecta. Ese es el hecho generador del impuesto a los vehículos."}], "correcta": 0, "referencias": ["LORTI"]}, {"id": "EX-199", "area": 1, "subarea": "Derecho Constitucional", "tema": "Acción de Protección", "resultado": "Identifica los requisitos de procedencia", "demanda": "Comprender", "enunciado": "Una persona quiere presentar una acción de protección. ¿Qué requisitos deben concurrir para que proceda?", "opciones": [{"texto": "Vulneración de un derecho constitucional y ausencia de otra vía eficaz.", "justificacion": "Correcta. Se requiere la violación de un derecho constitucional, una acción u omisión de autoridad pública o de un particular y la inexistencia de otro mecanismo de defensa judicial adecuado y eficaz (art. 88 de la Constitución; art. 40 de la Ley Orgánica de Garantías Jurisdiccionales y Control Constitucional)."}, {"texto": "Agotamiento previo de la vía administrativa ante la misma entidad.", "justificacion": "Incorrecta. No se exige agotar la vía administrativa."}, {"texto": "Presentarla dentro de los veinte días siguientes a la vulneración.", "justificacion": "Incorrecta. La acción de protección no tiene término de caducidad; el de veinte días corresponde a la acción extraordinaria de protección (art. 60 de la Ley Orgánica de Garantías Jurisdiccionales y Control Constitucional)."}, {"texto": "Acreditar un daño económico cuantificable y una cuantía mínima.", "justificacion": "Incorrecta. Protege derechos, no exige un daño económico ni una cuantía."}], "correcta": 0, "referencias": ["CRE", "LOGJCC"]}, {"id": "EX-200", "area": 1, "subarea": "Derecho Constitucional", "tema": "Hábeas Corpus", "resultado": "Diferencia hábeas corpus de otras garantías", "demanda": "Aplicar", "enunciado": "La garantía jurisdiccional del hábeas corpus tiene como finalidad principal:", "opciones": [{"texto": "Recuperar la libertad ilegítimamente perdida y proteger la vida e integridad.", "justificacion": "Correcta. El Art. 89 de la CRE establece que el hábeas corpus protege la libertad, vida e integridad de las personas privadas de libertad."}, {"texto": "Garantizar el acceso a la información pública que una entidad ha negado.", "justificacion": "Incorrecta. Eso es la acción de acceso a la información."}, {"texto": "Conocer, actualizar o rectificar datos personales que constan en registros.", "justificacion": "Incorrecta. Eso es el hábeas data."}, {"texto": "Exigir el cumplimiento de una norma o de un informe internacional de derechos.", "justificacion": "Incorrecta. Eso es la acción de incumplimiento."}], "correcta": 0, "referencias": ["CRE"]}, {"id": "EX-201", "area": 1, "subarea": "Derecho Constitucional", "tema": "Debido Proceso", "resultado": "Analiza las garantías básicas del debido proceso", "demanda": "Analizar", "enunciado": "Respecto de las garantías del debido proceso establecidas en el Art. 76 de la Constitución, ¿cuál de las siguientes afirmaciones es correcta?", "opciones": [{"texto": "Rigen la legalidad, la defensa técnica y la exclusión de la prueba ilícita.", "justificacion": "Correcta. Recoge los principios de legalidad, derecho a la defensa técnica y la nulidad de la prueba ilícita, garantizados en el Art. 76. Base legal: art. 76 de la Constitución."}, {"texto": "Sus garantías se aplican solo a los procesos de materia penal.", "justificacion": "Incorrecta. Se aplica a todo procedimiento."}, {"texto": "El juez puede prescindir de la imparcialidad en asuntos urgentes.", "justificacion": "Incorrecta. La imparcialidad es esencial."}, {"texto": "La prueba obtenida con violación de derechos conserva su valor.", "justificacion": "Incorrecta. Carece de valor probatorio."}], "correcta": 0, "referencias": ["CRE"]}, {"id": "EX-202", "area": 1, "subarea": "Derecho Constitucional", "tema": "Estado de Excepción", "resultado": "Identifica las causales y límites del estado de excepción", "demanda": "Comprender", "enunciado": "¿Cuáles son las causales por las que el Presidente de la República puede decretar el estado de excepción?", "opciones": [{"texto": "Agresión, conflicto armado, grave conmoción interna, calamidad o desastre.", "justificacion": "Correcta. El art. 164 de la Constitución prevé el estado de excepción en caso de agresión, conflicto armado internacional o interno, grave conmoción interna, calamidad pública o desastre natural, con observancia de los principios de necesidad, proporcionalidad, legalidad, temporalidad, territorialidad y razonabilidad. Base legal: arts. 164 y 165 de la Constitución."}, {"texto": "Cualquier situación que el Presidente considere conveniente al interés nacional.", "justificacion": "Incorrecta. Las causales son taxativas (art. 164 de la Constitución)."}, {"texto": "Una crisis política que impida la aprobación de leyes en la Asamblea.", "justificacion": "Incorrecta. La crisis política no es causal; la disolución de la Asamblea es una figura distinta (art. 148)."}, {"texto": "Una grave crisis económica, aunque no exista conmoción ni calamidad.", "justificacion": "Incorrecta. La crisis económica no figura entre las causales del art. 164."}], "correcta": 0, "referencias": ["CRE"]}, {"id": "EX-203", "area": 1, "subarea": "Derecho Constitucional", "tema": "Derechos de la Naturaleza", "resultado": "Aplica el principio de restauración ambiental", "demanda": "Aplicar", "enunciado": "La Constitución de Montecristi reconoce a la naturaleza como sujeto de derechos. ¿Qué implica esto?", "opciones": [{"texto": "Que se respeten su existencia y ciclos; cualquiera puede exigirlo.", "justificacion": "Correcta. El Art. 71 establece la naturaleza como sujeto de derechos y la legitimación amplia para su defensa. Base legal: arts. 71 y 72 de la Constitución."}, {"texto": "Es un bien de propiedad del Estado, que decide de forma exclusiva sobre su uso.", "justificacion": "Incorrecta. Los derechos van más allá de la titularidad estatal."}, {"texto": "Solo los animales domésticos son titulares de derechos frente a sus dueños.", "justificacion": "Incorrecta. Aplica a los ecosistemas."}, {"texto": "Solo el Ministerio del Ambiente puede reclamar judicialmente su protección.", "justificacion": "Incorrecta. Cualquier persona puede defenderla."}], "correcta": 0, "referencias": ["CRE"]}, {"id": "EX-204", "area": 1, "subarea": "Derecho Administrativo", "tema": "Acto Administrativo", "resultado": "Identifica los elementos del acto administrativo", "demanda": "Comprender", "enunciado": "En el derecho administrativo, ¿qué se entiende por acto administrativo?", "opciones": [{"texto": "Declaración unilateral de voluntad en función administrativa con efectos individuales.", "justificacion": "Correcta. Acto administrativo es la declaración unilateral de voluntad, efectuada en ejercicio de la función administrativa, que produce efectos jurídicos individuales o generales, siempre que se agote con su cumplimiento y de forma directa (art. 98 del Código Orgánico Administrativo)."}, {"texto": "Acuerdo bilateral entre la administración y un particular para prestar un servicio.", "justificacion": "Incorrecta. El acuerdo bilateral corresponde al contrato administrativo."}, {"texto": "Norma general dictada por la Asamblea Nacional en ejercicio de su potestad legislativa.", "justificacion": "Incorrecta. La ley es expresión de la función legislativa."}, {"texto": "Decisión de un juez que resuelve una controversia entre la administración y un particular.", "justificacion": "Incorrecta. La sentencia es un acto jurisdiccional."}], "correcta": 0, "referencias": ["COA"]}, {"id": "EX-205", "area": 1, "subarea": "Derecho Administrativo", "tema": "Silencio Administrativo", "resultado": "Diferencia el silencio administrativo positivo y negativo", "demanda": "Analizar", "enunciado": "¿En qué consiste el silencio administrativo en el ordenamiento jurídico ecuatoriano?", "opciones": [{"texto": "Efecto que la ley atribuye a la falta de resolución en plazo, en regla positivo.", "justificacion": "Correcta. Cuando la administración no resuelve en el plazo, la petición se entiende aprobada (silencio positivo) y el acto presunto puede ejecutarse con la certificación correspondiente (art. 207 del Código Orgánico Administrativo), salvo las excepciones legales."}, {"texto": "Falta de respuesta del administrado a un requerimiento que le hizo la entidad pública.", "justificacion": "Incorrecta. Es la falta de respuesta de la administración."}, {"texto": "Sanción que la administración impone al ciudadano que no completa su petición.", "justificacion": "Incorrecta. Es una garantía o ficción legal."}, {"texto": "Figura propia del derecho civil que se aplica solo entre particulares.", "justificacion": "Incorrecta. Es propio del derecho público."}], "correcta": 0, "referencias": ["COA"]}, {"id": "EX-206", "area": 1, "subarea": "Derecho Constitucional", "tema": "Acción de Incumplimiento", "resultado": "Identifica la finalidad de la acción de incumplimiento", "demanda": "Comprender", "enunciado": "¿Cuál es el objetivo de la acción de incumplimiento establecida en la Constitución?", "opciones": [{"texto": "Garantizar la aplicación de normas e informes internacionales de derechos humanos.", "justificacion": "Correcta. El Art. 93 de la CRE establece este mecanismo para asegurar el cumplimiento de normas y decisiones de DD.HH. Base legal: art. 93 de la Constitución."}, {"texto": "Exigir el pago de deudas civiles reconocidas en documentos privados entre las partes.", "justificacion": "Incorrecta. Para eso están los juicios ejecutivos."}, {"texto": "Revisar en abstracto si una ley es compatible con el texto de la Constitución.", "justificacion": "Incorrecta. Eso es la acción de inconstitucionalidad."}, {"texto": "Sancionar disciplinariamente a los jueces que retardan el despacho de las causas.", "justificacion": "Incorrecta. No tiene fines disciplinarios."}], "correcta": 0, "referencias": ["CRE"]}, {"id": "EX-207", "area": 1, "subarea": "Derecho Administrativo", "tema": "Contratación Pública", "resultado": "Identifica los principios de la contratación pública", "demanda": "Comprender", "enunciado": "Según la Ley Orgánica del Sistema Nacional de Contratación Pública (LOSNCP), ¿cuál es uno de los principios rectores?", "opciones": [{"texto": "Transparencia, que exige publicidad y control social de los procedimientos.", "justificacion": "Correcta. La transparencia es un principio fundamental consagrado en el art. 3 de la LOSNCP. Base legal: art. 3 de la Ley Orgánica del Sistema Nacional de Contratación Pública."}, {"texto": "Reserva, que impone mantener en secreto los procesos hasta su adjudicación.", "justificacion": "Incorrecta. Rige la publicidad."}, {"texto": "Afinidad, que permite elegir al contratista por la confianza de la entidad.", "justificacion": "Incorrecta. Rige la igualdad."}, {"texto": "Discrecionalidad, que hace de la contratación directa la regla general.", "justificacion": "Incorrecta. Es la excepción."}], "correcta": 0, "referencias": ["LOSNCP"]}, {"id": "EX-208", "area": 1, "subarea": "Derecho Administrativo", "tema": "Jurisdicción Contencioso Administrativa", "resultado": "Determina la competencia de los tribunales de lo contencioso", "demanda": "Aplicar", "enunciado": "¿Cuál es la función de la jurisdicción contencioso administrativa en Ecuador?", "opciones": [{"texto": "Controlar la legalidad de actos, contratos y hechos de la administración pública.", "justificacion": "Correcta. La jurisdicción contencioso administrativa tutela los derechos de los administrados y controla la legalidad de los actos, contratos y hechos de la administración (art. 173 de la Constitución; art. 300 del Código Orgánico General de Procesos)."}, {"texto": "Juzgar los delitos comunes cometidos por los servidores en el ejercicio del cargo.", "justificacion": "Incorrecta. Es materia penal."}, {"texto": "Resolver los conflictos patrimoniales que se suscitan entre simples particulares.", "justificacion": "Incorrecta. Es materia civil."}, {"texto": "Crear, modificar o extinguir tributos mediante resoluciones de carácter general.", "justificacion": "Incorrecta. Es función de la Asamblea."}], "correcta": 0, "referencias": ["CRE", "COGEP"]}, {"id": "EX-209", "area": 2, "subarea": "Derecho Penal (parte especial)", "tema": "Robo y Hurto", "resultado": "Diferencia el hurto del robo", "demanda": "Analizar", "enunciado": "En relación con el delito de robo tipificado en el COIP, ¿cuál es su elemento diferenciador respecto del hurto?", "opciones": [{"texto": "En el robo media fuerza en las cosas, violencia o amenaza a las personas.", "justificacion": "Correcta. El robo (art. 189 del Código Orgánico Integral Penal) exige amenazas o violencia sobre las personas o fuerza en las cosas; el hurto (art. 196) es el apoderamiento sin esos medios. Base legal: arts. 189 y 196 del Código Orgánico Integral Penal."}, {"texto": "El robo solo puede cometerse dentro de un local comercial o una vivienda.", "justificacion": "Incorrecta. El lugar no define el tipo penal."}, {"texto": "El robo exige que el bien sustraído supere un valor económico determinado.", "justificacion": "Incorrecta. El valor no distingue el robo del hurto."}, {"texto": "El robo solo puede cometerlo quien tiene la tenencia legítima del bien.", "justificacion": "Incorrecta. Quien dispone de lo que tiene en tenencia legítima comete abuso de confianza."}], "correcta": 0, "referencias": ["COIP"]}, {"id": "EX-210", "area": 2, "subarea": "Derecho Procesal Penal", "tema": "Prisión Preventiva", "resultado": "Identifica los requisitos de la prisión preventiva", "demanda": "Aplicar", "enunciado": "¿Cuáles son los requisitos que el juez debe evaluar para dictar la medida cautelar de prisión preventiva?", "opciones": [{"texto": "Elementos de convicción, pena mayor a un año y medidas insuficientes.", "justificacion": "Correcta. El art. 534 del Código Orgánico Integral Penal exige elementos de convicción sobre el delito y la participación, indicios de que las medidas no privativas de libertad son insuficientes y que la pena sea superior a un año; la medida es excepcional (art. 77 num. 1 de la Constitución)."}, {"texto": "Que el procesado carezca de recursos económicos para pagar una caución.", "justificacion": "Incorrecta. La situación económica no es requisito legal."}, {"texto": "Que la Fiscalía la solicite, aun sin exponer los fundamentos del pedido.", "justificacion": "Incorrecta. El pedido fiscal debe ser motivado."}, {"texto": "Que se trate de cualquier delito, porque es la medida cautelar ordinaria.", "justificacion": "Incorrecta. Es una medida excepcional, no ordinaria."}], "correcta": 0, "referencias": ["COIP"]}, {"id": "EX-211", "area": 2, "subarea": "Derecho Procesal Penal", "tema": "Procedimiento Abreviado", "resultado": "Comprende el procedimiento abreviado", "demanda": "Comprender", "enunciado": "¿En qué consiste el procedimiento abreviado en el sistema penal ecuatoriano?", "opciones": [{"texto": "El procesado admite el hecho a cambio de una pena menor (hasta diez años).", "justificacion": "Correcta. Procede en infracciones con pena máxima de hasta diez años, con admisión del hecho y consentimiento expreso del procesado; puede proponerse desde la audiencia de formulación de cargos hasta la audiencia preparatoria de juicio (arts. 635 y 636 del Código Orgánico Integral Penal)."}, {"texto": "Se dicta sentencia sin base probatoria alguna, por simple pedido de la Fiscalía.", "justificacion": "Incorrecta. El juez verifica los elementos del caso y el consentimiento."}, {"texto": "Solo se aplica a delitos graves cuya pena privativa supera los diez años.", "justificacion": "Incorrecta. El límite es de hasta diez años."}, {"texto": "Es la primera fase de la investigación, previa a la formulación de cargos.", "justificacion": "Incorrecta. No es una fase de investigación sino un procedimiento especial."}], "correcta": 0, "referencias": ["COIP"]}, {"id": "EX-212", "area": 2, "subarea": "Derecho Penal (parte general)", "tema": "Tentativa", "resultado": "Diferencia tentativa de delito consumado", "demanda": "Analizar", "enunciado": "¿Cuándo estamos frente a una tentativa de delito?", "opciones": [{"texto": "Hay actos idóneos de ejecución, pero el delito no se consuma por causas ajenas.", "justificacion": "Correcta. Hay tentativa cuando, con dolo, se inicia la ejecución de actos idóneos conducentes de modo inequívoco a la realización del delito, que no se consuma por circunstancias ajenas a la voluntad del autor (art. 39 del Código Orgánico Integral Penal)."}, {"texto": "La persona solo concibe la idea de cometer un delito, sin exteriorizarla.", "justificacion": "Incorrecta. Los pensamientos no son punibles."}, {"texto": "El autor realiza todos los elementos del tipo y produce el resultado.", "justificacion": "Incorrecta. Eso es consumación."}, {"texto": "El autor desiste voluntariamente y evita que el resultado se produzca.", "justificacion": "Incorrecta. Eso puede eximir de pena."}], "correcta": 0, "referencias": ["COIP"]}, {"id": "EX-213", "area": 2, "subarea": "Derecho Penal (parte general)", "tema": "Legítima Defensa", "resultado": "Aplica las causales de exclusión de la antijuridicidad", "demanda": "Aplicar", "enunciado": "Para que se configure la legítima defensa como causa de exclusión de la responsabilidad penal, se requiere:", "opciones": [{"texto": "Agresión actual e ilegítima, necesidad racional del medio y falta de provocación.", "justificacion": "Correcta. Reúne los tres requisitos clásicos del Art. 33 del COIP para la legítima defensa. Base legal: art. 33 del Código Orgánico Integral Penal."}, {"texto": "Que la agresión sea futura y el defensor actúe para prevenirla con anticipación.", "justificacion": "Incorrecta. Debe ser actual o inminente."}, {"texto": "Que el agresor sea el propietario del lugar donde se produce la defensa.", "justificacion": "Incorrecta. Irrelevante."}, {"texto": "Que la defensa se ejerza siempre con un arma de fuego de uso permitido.", "justificacion": "Incorrecta. Debe ser proporcional."}], "correcta": 0, "referencias": ["COIP"]}, {"id": "EX-214", "area": 2, "subarea": "Derecho Procesal Penal", "tema": "Flagrancia", "resultado": "Identifica los presupuestos de la flagrancia", "demanda": "Comprender", "enunciado": "¿Cuál de los siguientes supuestos constituye flagrancia según el COIP?", "opciones": [{"texto": "Aprehensión al cometer el delito o tras persecución de hasta 48 horas.", "justificacion": "Correcta. Hay flagrancia cuando se sorprende a la persona cometiendo la infracción o inmediatamente después, o tras una persecución ininterrumpida que no supere las cuarenta y ocho horas (art. 527 del COIP). Base legal: art. 527 del Código Orgánico Integral Penal."}, {"texto": "Detención basada solo en una denuncia anónima recibida por la policía.", "justificacion": "Incorrecta. No es flagrancia."}, {"texto": "Confesión del sospechoso un mes después de cometida la infracción.", "justificacion": "Incorrecta. Excede el tiempo."}, {"texto": "Captura en cumplimiento de una orden de detención dictada por un juez.", "justificacion": "Incorrecta. Es detención con orden judicial."}], "correcta": 0, "referencias": ["COIP"]}, {"id": "EX-215", "area": 2, "subarea": "Derecho Penal (parte especial)", "tema": "Delitos Informáticos", "resultado": "Diferencia fraude informático de otros delitos", "demanda": "Analizar", "enunciado": "La apropiación fraudulenta por medios electrónicos, tipificada en el COIP, consiste en:", "opciones": [{"texto": "Manipular sistemas informáticos para apropiarse de bienes ajenos o transferirlos.", "justificacion": "Correcta. El art. 190 del Código Orgánico Integral Penal sanciona a quien utilice fraudulentamente un sistema informático o redes electrónicas para facilitar la apropiación de un bien ajeno o la transferencia no consentida de bienes, valores o derechos."}, {"texto": "Sustraer con violencia un teléfono celular a una persona en la vía pública.", "justificacion": "Incorrecta. Eso es robo común."}, {"texto": "Enviar a otra persona un correo electrónico con expresiones ofensivas.", "justificacion": "Incorrecta. Puede ser otro tipo de infracción."}, {"texto": "Copiar un programa de computador con la autorización expresa de su titular.", "justificacion": "Incorrecta. No hay delito."}], "correcta": 0, "referencias": ["COIP"]}, {"id": "EX-216", "area": 2, "subarea": "Derecho Penal (parte especial)", "tema": "Peculado", "resultado": "Identifica los sujetos activos del peculado", "demanda": "Aplicar", "enunciado": "¿Quién puede ser sujeto activo del delito de peculado?", "opciones": [{"texto": "Los servidores públicos y quienes administran fondos públicos.", "justificacion": "Correcta. El Art. 278 del COIP restringe el sujeto activo a servidores públicos o administradores de recursos estatales que se apropien de ellos. Base legal: art. 278 del Código Orgánico Integral Penal."}, {"texto": "Cualquier particular, aunque no administre bienes ni recursos del Estado.", "justificacion": "Incorrecta. Se requiere calidad de servidor público."}, {"texto": "Únicamente el Presidente de la República y los ministros de Estado.", "justificacion": "Incorrecta. Aplica a cualquier servidor."}, {"texto": "Solo los extranjeros no residentes que contratan con entidades públicas.", "justificacion": "Incorrecta. Depende de la función."}], "correcta": 0, "referencias": ["COIP"]}, {"id": "EX-217", "area": 2, "subarea": "Derecho Penal (parte general)", "tema": "Medidas Cautelares", "resultado": "Diferencia medidas cautelares de penas", "demanda": "Comprender", "enunciado": "¿Cuál es la finalidad de las medidas cautelares en el proceso penal?", "opciones": [{"texto": "Asegurar la comparecencia, la reparación y la eficacia del proceso.", "justificacion": "Correcta. Las medidas cautelares (Art. 519 COIP) buscan fines procesales, no punitivos. Base legal: art. 519 del Código Orgánico Integral Penal."}, {"texto": "Castigar anticipadamente al procesado antes de que exista sentencia.", "justificacion": "Incorrecta. No son penas."}, {"texto": "Sustituir la sentencia condenatoria cuando el proceso se demora.", "justificacion": "Incorrecta. Son instrumentales."}, {"texto": "Beneficiar siempre al procesado frente a la pretensión de la víctima.", "justificacion": "Incorrecta. Buscan el proceso."}], "correcta": 0, "referencias": ["COIP"]}, {"id": "EX-218", "area": 2, "subarea": "Derecho Procesal Penal", "tema": "Recurso de Casación", "resultado": "Determina los fines del recurso de casación", "demanda": "Analizar", "enunciado": "El recurso de casación en materia penal es un recurso extraordinario que tiene como finalidad:", "opciones": [{"texto": "Corregir errores de derecho en la sentencia, sin volver a valorar la prueba.", "justificacion": "Correcta. El Art. 656 del COIP establece que la casación se basa en errores de derecho o falta de motivación, no en hechos. Base legal: art. 656 del Código Orgánico Integral Penal."}, {"texto": "Revisar de nuevo los hechos y la prueba, como una segunda instancia.", "justificacion": "Incorrecta. No es una segunda instancia."}, {"texto": "Obtener la libertad inmediata del procesado privado de ella ilegalmente.", "justificacion": "Incorrecta. Existen otros mecanismos."}, {"texto": "Modificar la pena por simple criterio de conveniencia del tribunal.", "justificacion": "Incorrecta. Requiere error de derecho."}], "correcta": 0, "referencias": ["COIP"]}, {"id": "EX-219", "area": 2, "subarea": "Derecho Penal (parte especial)", "tema": "Trata de Personas", "resultado": "Identifica los elementos del delito de trata", "demanda": "Comprender", "enunciado": "El delito de trata de personas se configura cuando:", "opciones": [{"texto": "Captar, trasladar o acoger a una persona con fines de explotación.", "justificacion": "Correcta. El Art. 91 del COIP describe la trata como un delito pluriofensivo que atenta contra la libertad personal. Base legal: art. 91 del Código Orgánico Integral Penal."}, {"texto": "Viajar al extranjero por voluntad propia en busca de trabajo.", "justificacion": "Incorrecta. No hay explotación ni engaño."}, {"texto": "Contratar a una persona con salario justo y prestaciones de ley.", "justificacion": "Incorrecta. No es explotación."}, {"texto": "Facilitar a un migrante el cruce irregular de una frontera, sin explotación.", "justificacion": "Incorrecta. Puede ser tráfico ilícito, no trata."}], "correcta": 0, "referencias": ["COIP"]}, {"id": "EX-220", "area": 2, "subarea": "Derecho Penal (parte especial)", "tema": "Homicidio y Asesinato", "resultado": "Diferencia asesinato de homicidio", "demanda": "Analizar", "enunciado": "¿Cuál es la diferencia fundamental entre homicidio y asesinato en el COIP?", "opciones": [{"texto": "El asesinato exige circunstancias como la alevosía; el homicidio no.", "justificacion": "Correcta. El Art. 140 del COIP tipifica el asesinato con agravantes específicas, mientras el homicidio (Art. 144) es la regla general. Base legal: arts. 140 y 144 del Código Orgánico Integral Penal."}, {"texto": "El asesinato es siempre una muerte causada por accidente o imprudencia.", "justificacion": "Incorrecta. Requiere intención y agravantes."}, {"texto": "El homicidio tiene una pena mayor que la prevista para el asesinato.", "justificacion": "Incorrecta. El asesinato tiene mayor pena."}, {"texto": "No hay diferencia legal: ambos términos designan el mismo tipo penal.", "justificacion": "Incorrecta. Son tipos penales distintos."}], "correcta": 0, "referencias": ["COIP"]}, {"id": "EX-221", "area": 2, "subarea": "Derecho Penal (parte especial)", "tema": "Lavado de Activos", "resultado": "Comprende la naturaleza del lavado de activos", "demanda": "Comprender", "enunciado": "El delito de lavado de activos consiste en:", "opciones": [{"texto": "Ocultar o dar apariencia lícita a bienes que provienen de un delito.", "justificacion": "Correcta. El Art. 317 del COIP sanciona el lavado de activos como el proceso de dar apariencia de legalidad a bienes de origen ilícito. Base legal: art. 317 del Código Orgánico Integral Penal."}, {"texto": "Obtener ganancias mediante una actividad comercial lícita y declarada.", "justificacion": "Incorrecta. No hay origen ilícito."}, {"texto": "Pagar tributos atrasados con los intereses y recargos correspondientes.", "justificacion": "Incorrecta. Es un tema tributario."}, {"texto": "Solicitar un crédito a una entidad financiera para iniciar un negocio.", "justificacion": "Incorrecta. Es una operación financiera lícita."}], "correcta": 0, "referencias": ["COIP"]}, {"id": "EX-222", "area": 2, "subarea": "Derecho Penal (parte general)", "tema": "Etapa de Investigación Previa", "resultado": "Identifica la finalidad de la investigación previa", "demanda": "Comprender", "enunciado": "En el proceso penal ecuatoriano, la etapa de investigación previa tiene como objetivo:", "opciones": [{"texto": "Reunir elementos de convicción para decidir si se formulan cargos.", "justificacion": "Correcta. El Art. 580 del COIP establece que la investigación previa busca reunir elementos para determinar si hay mérito para acusar. Base legal: art. 580 del Código Orgánico Integral Penal."}, {"texto": "Juzgar de inmediato al sospechoso en una audiencia oral y pública.", "justificacion": "Incorrecta. No hay juicio en esta etapa."}, {"texto": "Dictar sentencia condenatoria con base en las versiones recogidas.", "justificacion": "Incorrecta. Es tarea del tribunal de juicio."}, {"texto": "Imponer al investigado una pena anticipada mientras se investiga.", "justificacion": "Incorrecta. No se aplican penas."}], "correcta": 0, "referencias": ["COIP"]}, {"id": "EX-223", "area": 2, "subarea": "Derecho Procesal Penal", "tema": "Procedimiento Directo", "resultado": "Identifica las características del procedimiento directo", "demanda": "Aplicar", "enunciado": "El procedimiento directo es aplicable en los siguientes casos:", "opciones": [{"texto": "Delitos flagrantes con pena máxima de hasta cinco años, salvo exclusiones.", "justificacion": "Correcta. El procedimiento directo procede en delitos calificados como flagrantes sancionados con pena máxima de hasta cinco años y en delitos contra la propiedad de hasta treinta salarios básicos; se excluyen, entre otros, los delitos contra la eficiencia de la administración pública, contra la integridad sexual y reproductiva y de violencia contra la mujer o miembros del núcleo familiar (art. 640 del Código Orgánico Integral Penal)."}, {"texto": "Cualquier delito flagrante, sin importar la pena ni el bien jurídico.", "justificacion": "Incorrecta. Existen límites de pena y exclusiones legales."}, {"texto": "Delitos flagrantes con pena máxima de hasta diez años, en todos los casos.", "justificacion": "Incorrecta. Diez años es el límite del procedimiento abreviado (art. 635)."}, {"texto": "Delitos no flagrantes cuya pena máxima no exceda de un año.", "justificacion": "Incorrecta. La flagrancia es requisito del procedimiento directo."}], "correcta": 0, "referencias": ["COIP"]}, {"id": "EX-224", "area": 2, "subarea": "Derecho Penal (parte general)", "tema": "Dolo", "resultado": "Diferencia dolo de culpa", "demanda": "Comprender", "enunciado": "En materia penal, el dolo se define como:", "opciones": [{"texto": "Conocer los elementos del tipo y actuar con voluntad de realizarlos.", "justificacion": "Correcta. El Art. 26 del COIP define el dolo como la voluntad y conocimiento de la realización del tipo penal. Base legal: art. 26 del Código Orgánico Integral Penal."}, {"texto": "Infringir el deber objetivo de cuidado sin intención de causar el daño.", "justificacion": "Incorrecta. Eso es culpa."}, {"texto": "Desconocer por completo que la conducta está prohibida por la ley.", "justificacion": "Incorrecta. No exime de responsabilidad."}, {"texto": "Causar un resultado por un hecho fortuito, imprevisible e inevitable.", "justificacion": "Incorrecta. No hay intención."}], "correcta": 0, "referencias": ["COIP"]}, {"id": "EX-225", "area": 2, "subarea": "Derecho Penal (parte general)", "tema": "Concurso de Infracciones", "resultado": "Diferencia concurso ideal de real", "demanda": "Analizar", "enunciado": "¿En qué consiste el concurso ideal de infracciones penales?", "opciones": [{"texto": "Una sola conducta encaja en varios tipos; rige la pena mayor.", "justificacion": "Correcta. Cuando varios tipos penales son subsumibles a una misma conducta, se aplica la pena de la infracción más grave (art. 21 del Código Orgánico Integral Penal); el concurso real, con varias conductas, se rige por el art. 20."}, {"texto": "Se cometen varios delitos independientes en días distintos.", "justificacion": "Incorrecta. Varias conductas independientes forman concurso real (art. 20)."}, {"texto": "El delito iniciado no llega a consumarse por causas ajenas.", "justificacion": "Incorrecta. Eso es tentativa (art. 39)."}, {"texto": "Intervienen varias personas en la ejecución de un mismo delito.", "justificacion": "Incorrecta. Eso es participación (arts. 41 a 43)."}], "correcta": 0, "referencias": ["COIP"]}, {"id": "EX-226", "area": 2, "subarea": "Derecho Procesal Penal", "tema": "Formulación de Cargos", "resultado": "Identifica la formulación de cargos", "demanda": "Comprender", "enunciado": "La audiencia de formulación de cargos es aquella en la que:", "opciones": [{"texto": "El fiscal comunica los cargos e inicia la instrucción fiscal.", "justificacion": "Correcta. La formulación de cargos (Art. 591 COIP) es el acto que da inicio a la etapa de instrucción fiscal. Base legal: arts. 591 y 595 del Código Orgánico Integral Penal."}, {"texto": "El tribunal dicta sentencia condenatoria o ratificatoria de inocencia.", "justificacion": "Incorrecta. Es el inicio del proceso."}, {"texto": "Las partes practican la prueba ante el tribunal de garantías penales.", "justificacion": "Incorrecta. Es la etapa de juicio."}, {"texto": "El sentenciado interpone recurso de apelación contra la sentencia.", "justificacion": "Incorrecta. Es una etapa impugnatoria."}], "correcta": 0, "referencias": ["COIP"]}, {"id": "EX-227", "area": 2, "subarea": "Derecho Procesal Penal", "tema": "Apelación", "resultado": "Comprende el recurso de apelación", "demanda": "Aplicar", "enunciado": "El recurso de apelación en el proceso penal ecuatoriano:", "opciones": [{"texto": "Es un recurso ordinario que permite revisar los hechos y el derecho aplicado.", "justificacion": "Correcta. El Art. 653 del COIP regula la apelación como un recurso ordinario que permite revisar la resolución de primera instancia. Base legal: art. 653 del Código Orgánico Integral Penal."}, {"texto": "Es un recurso extraordinario limitado a errores de derecho en la sentencia.", "justificacion": "Incorrecta. Es un recurso ordinario."}, {"texto": "Solo procede contra decisiones adoptadas durante la investigación previa.", "justificacion": "Incorrecta. No aplica allí."}, {"texto": "No existe en materia penal, pues las sentencias son siempre definitivas.", "justificacion": "Incorrecta. Es parte del COIP."}], "correcta": 0, "referencias": ["COIP"]}, {"id": "EX-228", "area": 2, "subarea": "Derecho Penal (parte general)", "tema": "Acción de Revisión", "resultado": "Identifica los fines de la acción de revisión", "demanda": "Analizar", "enunciado": "La acción de revisión en materia penal busca:", "opciones": [{"texto": "Anular una condena firme por error de hecho o prueba falsa o nueva.", "justificacion": "Correcta. El Art. 658 del COIP permite revisar sentencias firmes ante la aparición de nuevas pruebas o fraude procesal. Base legal: art. 658 del Código Orgánico Integral Penal."}, {"texto": "Sustituir al recurso de apelación cuando este no se interpuso a tiempo.", "justificacion": "Incorrecta. Es un recurso autónomo."}, {"texto": "Revisar los hechos antes de que se celebre la audiencia de juicio.", "justificacion": "Incorrecta. Es para sentencias firmes."}, {"texto": "Modificar la pena impuesta por simple criterio de conveniencia del juez.", "justificacion": "Incorrecta. Requiere causales legales."}], "correcta": 0, "referencias": ["COIP"]}, {"id": "EX-229", "area": 2, "subarea": "Derecho Penal (parte general)", "tema": "Autoría Mediata", "resultado": "Diferencia autoría mediata de coautoría", "demanda": "Analizar", "enunciado": "¿Qué es la autoría mediata en el derecho penal?", "opciones": [{"texto": "Quien comete el delito valiéndose de otra persona como instrumento.", "justificacion": "Correcta. El Art. 42 numeral 2 del COIP regula la autoría mediata cuando se utiliza a otro como instrumento del delito. Base legal: art. 42 num. 2 del Código Orgánico Integral Penal."}, {"texto": "Quienes ejecutan juntos el delito con dominio funcional del hecho.", "justificacion": "Incorrecta. Eso es coautoría."}, {"texto": "Quien ayuda al autor a ocultar los efectos después del delito.", "justificacion": "Incorrecta. Eso es encubrimiento."}, {"texto": "Quien comete el delito siendo menor de dieciocho años de edad.", "justificacion": "Incorrecta. Es inimputabilidad."}], "correcta": 0, "referencias": ["COIP"]}, {"id": "EX-230", "area": 2, "subarea": "Derecho Penal (parte general)", "tema": "Penas No Privativas de Libertad", "resultado": "Identifica penas no privativas de libertad", "demanda": "Comprender", "enunciado": "¿Cuál de las siguientes es una pena no privativa de libertad en el COIP?", "opciones": [{"texto": "El servicio comunitario.", "justificacion": "Correcta. El servicio comunitario es una pena no privativa de libertad (art. 60 num. 3 del Código Orgánico Integral Penal). Base legal: arts. 58 y 60 del Código Orgánico Integral Penal."}, {"texto": "La prisión preventiva.", "justificacion": "Incorrecta. La prisión preventiva es una medida cautelar (art. 522)."}, {"texto": "El internamiento en un hospital psiquiátrico como medida de seguridad.", "justificacion": "Incorrecta. El internamiento es una medida de seguridad para inimputables (art. 76)."}, {"texto": "La multa.", "justificacion": "Incorrecta. La multa es una pena restrictiva de los derechos de propiedad (art. 69 num. 1), categoría distinta de las no privativas de libertad (art. 58)."}], "correcta": 0, "referencias": ["COIP"]}, {"id": "EX-231", "area": 2, "subarea": "Derecho Penal (parte especial)", "tema": "Delitos Sexuales", "resultado": "Analiza el delito de violación", "demanda": "Aplicar", "enunciado": "El delito de violación, tipificado en el Art. 171 del COIP, se configura cuando:", "opciones": [{"texto": "Hay acceso carnal sin consentimiento, con violencia o abuso de vulnerabilidad.", "justificacion": "Correcta. El Art. 171 describe el acceso carnal no consentido, siendo el consentimiento el eje central del tipo penal. Base legal: art. 171 del Código Orgánico Integral Penal."}, {"texto": "Dos personas adultas mantienen relaciones sexuales libremente consentidas.", "justificacion": "Incorrecta. Hay consentimiento."}, {"texto": "Una persona envía a otra mensajes de contenido ofensivo o humillante.", "justificacion": "Incorrecta. No hay acceso carnal."}, {"texto": "Se realiza un tocamiento sexual no consentido, sin que exista acceso carnal.", "justificacion": "Incorrecta. Puede ser abuso sexual, no violación."}], "correcta": 0, "referencias": ["COIP"]}, {"id": "EX-232", "area": 2, "subarea": "Derecho Penal (parte especial)", "tema": "Delitos Ambientales", "resultado": "Identifica los delitos contra el ambiente", "demanda": "Comprender", "enunciado": "¿Qué conducta constituye un delito ambiental según el COIP?", "opciones": [{"texto": "Contaminar gravemente el agua, el suelo o el aire en perjuicio de la naturaleza.", "justificacion": "Correcta. El COIP tipifica varios delitos ambientales, incluyendo la contaminación y la deforestación ilegal (Arts. 245-250)."}, {"texto": "Depositar residuos domésticos en un contenedor municipal autorizado.", "justificacion": "Incorrecta. Es una falta administrativa."}, {"texto": "Podar o talar un árbol ornamental en un jardín privado con permiso.", "justificacion": "Incorrecta. Depende de la regulación, pero no es delito penal grave."}, {"texto": "Regar plantas o cultivos con agua de una fuente debidamente autorizada.", "justificacion": "Incorrecta. No es delito."}], "correcta": 0, "referencias": ["COIP"]}, {"id": "EX-233", "area": 2, "subarea": "Derecho Penal (parte especial)", "tema": "Cohecho", "resultado": "Analiza el delito de cohecho", "demanda": "Aplicar", "enunciado": "El delito de cohecho se configura cuando:", "opciones": [{"texto": "Un servidor público recibe una dádiva por un acto de su cargo.", "justificacion": "Correcta. El Art. 280 del COIP tipifica el cohecho como la recepción de beneficios indebidos por parte de un servidor público. Base legal: art. 280 del Código Orgánico Integral Penal."}, {"texto": "Un particular regala un libro a un amigo por su cumpleaños.", "justificacion": "Incorrecta. No hay acto público."}, {"texto": "Un empleado público recibe su remuneración mensual de la entidad.", "justificacion": "Incorrecta. Es un pago legal."}, {"texto": "Un juez dicta una sentencia en ejercicio regular de su competencia.", "justificacion": "Incorrecta. Es su función."}], "correcta": 0, "referencias": ["COIP"]}, {"id": "EX-234", "area": 2, "subarea": "Derecho Penal (parte especial)", "tema": "Lesiones", "resultado": "Diferencia lesiones de otros delitos", "demanda": "Comprender", "enunciado": "El delito de lesiones en el COIP consiste en:", "opciones": [{"texto": "Causar a otro un daño en su integridad o en su salud.", "justificacion": "Correcta. El Art. 152 del COIP define las lesiones como el daño a la integridad física o salud, clasificándolas por gravedad. Base legal: art. 152 del Código Orgánico Integral Penal."}, {"texto": "Quitar la vida a otra persona de forma intencional y sin justificación.", "justificacion": "Incorrecta. Eso es homicidio."}, {"texto": "Apoderarse de un bien mueble ajeno mediante violencia o amenaza.", "justificacion": "Incorrecta. Eso es hurto o robo."}, {"texto": "Proferir expresiones que deshonran o desacreditan a otra persona.", "justificacion": "Incorrecta. Puede ser injuria."}], "correcta": 0, "referencias": ["COIP"]}, {"id": "EX-235", "area": 2, "subarea": "Derecho Penal (parte especial)", "tema": "Tráfico de Drogas", "resultado": "Diferencia tráfico de consumo", "demanda": "Analizar", "enunciado": "¿Cuál es la diferencia entre el tráfico de sustancias sujetas a fiscalización y el consumo?", "opciones": [{"texto": "El tráfico implica comercializar o distribuir; el consumo personal no es punible.", "justificacion": "Correcta. El art. 220 del Código Orgánico Integral Penal sanciona el tráfico ilícito de sustancias sujetas a fiscalización y dispone que la tenencia para consumo personal en las cantidades establecidas no es punible; la Constitución trata las adicciones como un problema de salud pública (art. 364). Base legal: art. 220 del Código Orgánico Integral Penal; art. 364 de la Constitución."}, {"texto": "El consumo es siempre un delito grave, aunque la cantidad sea mínima.", "justificacion": "Incorrecta. No es punible el consumo personal."}, {"texto": "El tráfico se configura únicamente cuando la tenencia es para uso personal.", "justificacion": "Incorrecta. Es para distribución."}, {"texto": "No existe diferencia legal: toda tenencia de sustancias se sanciona igual.", "justificacion": "Incorrecta. Son figuras distintas."}], "correcta": 0, "referencias": ["COIP", "CRE"]}, {"id": "EX-236", "area": 2, "subarea": "Derecho Penal (parte general)", "tema": "Garantías Constitucionales Penales", "resultado": "Aplica el principio de non bis in idem", "demanda": "Aplicar", "enunciado": "El principio de non bis in idem en materia penal significa que:", "opciones": [{"texto": "Nadie puede ser juzgado ni sancionado dos veces por la misma causa.", "justificacion": "Correcta. Consagrado en el Art. 76 numeral 7 literal i de la CRE y en el COIP, prohíbe el doble juzgamiento. Base legal: art. 76 num. 7 lit. i de la Constitución."}, {"texto": "Puede juzgarse nuevamente por un mismo hecho si surgen nuevas pruebas.", "justificacion": "Incorrecta. Es lo contrario."}, {"texto": "La prohibición rige solo para delitos leves y contravenciones.", "justificacion": "Incorrecta. Aplica para todos."}, {"texto": "Permite imponer dos penas por el mismo hecho si son de distinta clase.", "justificacion": "Incorrecta. Prohíbe la doble sanción."}], "correcta": 0, "referencias": ["CRE"]}, {"id": "EX-237", "area": 2, "subarea": "Derecho Penal (parte general)", "tema": "Responsabilidad Penal de Personas Jurídicas", "resultado": "Comprende la responsabilidad penal de personas jurídicas", "demanda": "Comprender", "enunciado": "En el Ecuador, ¿pueden las personas jurídicas ser penalmente responsables?", "opciones": [{"texto": "Sí, por delitos cometidos en su beneficio por quienes la dirigen o representan.", "justificacion": "Correcta. El Art. 49 del COIP establece la responsabilidad penal de las personas jurídicas y las penas aplicables. Base legal: art. 49 del Código Orgánico Integral Penal."}, {"texto": "No, porque solo las personas naturales pueden ser penalmente responsables.", "justificacion": "Incorrecta. El COIP sí las contempla."}, {"texto": "No; las personas jurídicas solo responden en materia civil por los daños.", "justificacion": "Incorrecta. Existe responsabilidad penal."}, {"texto": "Sí, pero únicamente cuando se trata de compañías extranjeras domiciliadas.", "justificacion": "Incorrecta. Aplica a nacionales también."}], "correcta": 0, "referencias": ["COIP"]}, {"id": "EX-238", "area": 3, "subarea": "Métodos Alternativos", "tema": "Mediación", "resultado": "Determina la naturaleza de la mediación", "demanda": "Aplicar", "enunciado": "¿Cuál es una característica fundamental de la mediación en Ecuador?", "opciones": [{"texto": "Es voluntaria y confidencial, y el acuerdo tiene efecto de sentencia.", "justificacion": "Correcta. Refleja los principios de voluntariedad, confidencialidad y la naturaleza ejecutiva del acta de mediación. Base legal: arts. 43 a 47 de la Ley de Arbitraje y Mediación."}, {"texto": "El mediador decide la controversia mediante una resolución obligatoria.", "justificacion": "Incorrecta. El mediador no decide."}, {"texto": "Es obligatoria en todos los conflictos antes de acudir a un juez.", "justificacion": "Incorrecta. Es voluntaria."}, {"texto": "Su acta carece de efectos ejecutivos y solo vale como prueba.", "justificacion": "Incorrecta. Requiere patrocinio."}], "correcta": 0, "referencias": ["LAM"]}, {"id": "EX-239", "area": 3, "subarea": "Métodos Alternativos", "tema": "Arbitraje", "resultado": "Diferencia arbitraje de jurisdicción ordinaria", "demanda": "Comprender", "enunciado": "El arbitraje es un mecanismo alternativo de solución de conflictos que se caracteriza por:", "opciones": [{"texto": "Las partes someten el conflicto a árbitros cuyo laudo tiene fuerza de sentencia.", "justificacion": "Correcta. El arbitraje se fundamenta en el pacto arbitral y culmina con un laudo con efectos de cosa juzgada. Base legal: arts. 1, 5 y 32 de la Ley de Arbitraje y Mediación."}, {"texto": "Es un juicio ordinario que se sigue ante un juez de la Función Judicial.", "justificacion": "Incorrecta. Es un mecanismo alternativo."}, {"texto": "Concluye sin decisión final, con una simple recomendación a las partes.", "justificacion": "Incorrecta. El laudo es obligatorio."}, {"texto": "Se aplica únicamente a la solución de controversias de naturaleza penal.", "justificacion": "Incorrecta. No aplica en materia penal."}], "correcta": 0, "referencias": ["LAM"]}, {"id": "EX-240", "area": 3, "subarea": "Métodos Alternativos", "tema": "Conciliación", "resultado": "Identifica la conciliación procesal", "demanda": "Comprender", "enunciado": "¿En qué consiste la conciliación como método alternativo de solución de conflictos?", "opciones": [{"texto": "Las partes acuerdan ante el juez y el acuerdo vale como sentencia.", "justificacion": "Correcta. La conciliación puede ser intraprocesal (ante el juez) y su acta tiene mérito ejecutivo. Base legal: arts. 233 y 234 del Código Orgánico General de Procesos."}, {"texto": "El juez decide unilateralmente la controversia sin escuchar a las partes.", "justificacion": "Incorrecta. Requiere acuerdo de partes."}, {"texto": "Es un recurso para impugnar la sentencia ante un tribunal superior.", "justificacion": "Incorrecta. No es un recurso."}, {"texto": "Es la audiencia en la que se practica la prueba del juicio oral.", "justificacion": "Incorrecta. Es un acuerdo."}], "correcta": 0, "referencias": ["COGEP"]}, {"id": "EX-241", "area": 3, "subarea": "Métodos Alternativos", "tema": "Laudo Arbitral", "resultado": "Identifica la naturaleza del laudo arbitral", "demanda": "Aplicar", "enunciado": "El laudo arbitral emitido por un tribunal de arbitraje:", "opciones": [{"texto": "Es obligatorio, tiene efecto de cosa juzgada y solo admite acción de nulidad.", "justificacion": "Correcta. El laudo tiene fuerza ejecutoria y solo procede recurso de nulidad (Art. 31 Ley de Arbitraje y Mediación). Base legal: arts. 30 a 32 de la Ley de Arbitraje y Mediación."}, {"texto": "Es una simple recomendación que las partes pueden acatar o no.", "justificacion": "Incorrecta. Es obligatorio."}, {"texto": "Carece de efectos jurídicos mientras no lo homologue un juez civil.", "justificacion": "Incorrecta. Tiene fuerza de sentencia."}, {"texto": "Puede apelarse ante la Corte Provincial en cualquier caso y por cualquier motivo.", "justificacion": "Incorrecta. Solo procede nulidad."}], "correcta": 0, "referencias": ["LAM"]}, {"id": "EX-243", "area": 3, "subarea": "Derecho Procesal (COGEP)", "tema": "Carga de la Prueba", "resultado": "Aplica el principio de carga de la prueba", "demanda": "Aplicar", "enunciado": "En el proceso civil ecuatoriano, ¿a quién corresponde la carga de la prueba?", "opciones": [{"texto": "A quien afirma un hecho, salvo los casos en que la ley invierte la carga.", "justificacion": "Correcta. Es obligación de la parte actora probar los hechos que ha propuesto afirmativamente en la demanda y que ha negado la parte demandada en su contestación; la ley prevé casos de inversión y de carga dinámica (art. 169 del Código Orgánico General de Procesos)."}, {"texto": "Siempre al juez, que debe investigar de oficio los hechos controvertidos.", "justificacion": "Incorrecta. El juez no investiga de oficio en civil."}, {"texto": "Siempre al demandado, que debe desvirtuar todo lo afirmado por el actor.", "justificacion": "Incorrecta. Depende de quién alega."}, {"texto": "Al secretario del juzgado, que certifica los hechos del proceso.", "justificacion": "Incorrecta. No es parte procesal."}], "correcta": 0, "referencias": ["COGEP"]}, {"id": "EX-244", "area": 3, "subarea": "Derecho Procesal (COGEP)", "tema": "Cosa Juzgada", "resultado": "Identifica los efectos de la cosa juzgada", "demanda": "Comprender", "enunciado": "¿Qué efectos produce la cosa juzgada en una sentencia firme?", "opciones": [{"texto": "Hace inmutable la decisión e impide un nuevo proceso sobre lo mismo.", "justificacion": "Correcta. Las sentencias ejecutoriadas surten efectos irrevocables respecto de las partes y no pueden ser alteradas en proceso posterior cuando hay identidad de objeto, causa y partes (arts. 99 y 101 del Código Orgánico General de Procesos)."}, {"texto": "Permite volver a demandar los mismos hechos con distinto abogado.", "justificacion": "Incorrecta. Prohíbe la doble demanda."}, {"texto": "Sus efectos se limitan a los procesos de materia penal.", "justificacion": "Incorrecta. Aplica en todas las materias."}, {"texto": "Carece de efectos frente a las partes que litigaron el proceso.", "justificacion": "Incorrecta. Es vinculante."}], "correcta": 0, "referencias": ["COGEP"]}, {"id": "EX-245", "area": 3, "subarea": "Derecho Procesal (COGEP)", "tema": "Nulidad Procesal", "resultado": "Identifica las causales de nulidad", "demanda": "Analizar", "enunciado": "¿Cuál de las siguientes es una causal de nulidad procesal en el COGEP?", "opciones": [{"texto": "La falta de citación del demandado, que le causa indefensión.", "justificacion": "Correcta. Son solemnidades sustanciales comunes a todos los procesos, entre otras, la jurisdicción, la competencia, la legitimidad de personería, la citación y la notificación; su omisión anula el proceso si pudo influir en la decisión (art. 107 del Código Orgánico General de Procesos)."}, {"texto": "El retraso del abogado al inicio de la audiencia, aunque luego intervenga.", "justificacion": "Incorrecta. No es causal de nulidad general."}, {"texto": "La discrepancia del juez con el criterio jurídico de una de las partes.", "justificacion": "Incorrecta. No afecta el proceso."}, {"texto": "Que ninguna de las partes haya apelado del auto que admitió la prueba.", "justificacion": "Incorrecta. No es causal."}], "correcta": 0, "referencias": ["COGEP"]}, {"id": "EX-246", "area": 3, "subarea": "Métodos Alternativos", "tema": "Inmediación", "resultado": "Aplica el principio de inmediación", "demanda": "Comprender", "enunciado": "El principio de inmediación en el proceso oral implica que:", "opciones": [{"texto": "El juez preside la audiencia y recibe la prueba de forma directa.", "justificacion": "Correcta. La inmediación exige la presencia del juez en la práctica de la prueba (Art. 6 COGEP). Base legal: art. 6 del Código Orgánico General de Procesos."}, {"texto": "El juez puede delegar en un secretario la práctica de la audiencia.", "justificacion": "Incorrecta. Debe estar presente."}, {"texto": "La prueba se valora solo a partir de los escritos de las partes.", "justificacion": "Incorrecta. Prima la oralidad."}, {"texto": "Los testigos no comparecen y se reciben únicamente sus declaraciones escritas.", "justificacion": "Incorrecta. Son parte esencial."}], "correcta": 0, "referencias": ["COGEP"]}, {"id": "EX-248", "area": 3, "subarea": "Métodos Alternativos", "tema": "Ejecución de Actas de Mediación", "resultado": "Aplica la ejecución de títulos", "demanda": "Aplicar", "enunciado": "Si una de las partes incumple un acta de mediación, ¿cuál es el mecanismo legal para exigir su cumplimiento?", "opciones": [{"texto": "Pedir su ejecución, porque vale como sentencia ejecutoriada.", "justificacion": "Correcta. El acta de mediación con acuerdo tiene efecto de sentencia ejecutoriada y cosa juzgada (art. 47 de la Ley de Arbitraje y Mediación) y es título de ejecución (art. 363 del Código Orgánico General de Procesos). Base legal: art. 47 de la Ley de Arbitraje y Mediación; art. 363 del Código Orgánico General de Procesos."}, {"texto": "Iniciar un nuevo juicio ordinario para que se declare la obligación.", "justificacion": "Incorrecta. Ya existe un título ejecutivo."}, {"texto": "Nada, porque el acuerdo de mediación no es jurídicamente exigible.", "justificacion": "Incorrecta. Es ejecutable."}, {"texto": "Apelar ante el mediador para que revise el acuerdo incumplido.", "justificacion": "Incorrecta. El mediador no es juez."}], "correcta": 0, "referencias": ["LAM", "COGEP"]}, {"id": "EX-249", "area": 3, "subarea": "Derecho Procesal (COGEP)", "tema": "Recursos Procesales", "resultado": "Identifica los recursos horizontales", "demanda": "Comprender", "enunciado": "El recurso de aclaración o ampliación en el proceso civil tiene como finalidad:", "opciones": [{"texto": "Que el mismo juez aclare puntos oscuros o resuelva puntos omitidos.", "justificacion": "Correcta. Los recursos de aclaración y ampliación se presentan ante el mismo juez para corregir oscuridades (Art. 253 COGEP). Base legal: arts. 253 a 255 del Código Orgánico General de Procesos."}, {"texto": "Que el tribunal superior revise de nuevo los hechos de la sentencia.", "justificacion": "Incorrecta. Eso es apelación."}, {"texto": "Que se declare la nulidad de todo lo actuado desde la demanda.", "justificacion": "Incorrecta. Es para aclarar, no anular."}, {"texto": "Que se admitan nuevas pruebas no presentadas en la audiencia.", "justificacion": "Incorrecta. No es su finalidad."}], "correcta": 0, "referencias": ["COGEP"]}, {"id": "EX-250", "area": 3, "subarea": "Derecho Procesal (COGEP)", "tema": "Principio Dispositivo", "resultado": "Analiza el principio dispositivo", "demanda": "Analizar", "enunciado": "El principio dispositivo en el proceso civil significa que:", "opciones": [{"texto": "Las partes impulsan el proceso y fijan su objeto; el juez decide sobre ello.", "justificacion": "Correcta. La sustanciación de los procesos se lleva a cabo mediante el sistema oral, de acuerdo con los principios de concentración, contradicción y dispositivo (art. 168 num. 6 de la Constitución); el juez resuelve según lo pedido por las partes (art. 19 del Código Orgánico de la Función Judicial). Base legal: art. 168 num. 6 de la Constitución; art. 19 del Código Orgánico de la Función Judicial."}, {"texto": "El juez investiga de oficio los hechos y amplía lo pedido por las partes.", "justificacion": "Incorrecta. Eso es el principio inquisitivo."}, {"texto": "Las partes no pueden desistir, transigir ni disponer de sus derechos.", "justificacion": "Incorrecta. Pueden transigir o desistir."}, {"texto": "El proceso es reservado y solo las partes conocen sus actuaciones.", "justificacion": "Incorrecta. Rige la publicidad."}], "correcta": 0, "referencias": ["CRE", "COFJ"]}, {"id": "EX-254", "area": 4, "subarea": "Obligaciones y Contratos", "tema": "Obligaciones de Dar", "resultado": "Diferencia obligaciones de dar, hacer y no hacer", "demanda": "Analizar", "enunciado": "¿Qué caracteriza a una obligación de dar?", "opciones": [{"texto": "Obliga a transferir el dominio o a entregar una cosa.", "justificacion": "Correcta. La obligación de dar implica transferir el dominio o entregar una cosa (Art. 1561 CC)."}, {"texto": "Obliga a ejecutar un trabajo o a prestar un servicio personal.", "justificacion": "Incorrecta. Eso es obligación de hacer."}, {"texto": "Obliga al deudor a abstenerse de realizar un hecho determinado.", "justificacion": "Incorrecta. Eso es obligación de no hacer."}, {"texto": "Es una obligación natural, que no confiere acción para exigirla.", "justificacion": "Incorrecta. Es una obligación civil."}], "correcta": 0, "referencias": ["CC"]}, {"id": "EX-255", "area": 4, "subarea": "Obligaciones y Contratos", "tema": "Prescripción Extintiva", "resultado": "Distingue prescripción extintiva de adquisitiva", "demanda": "Comprender", "enunciado": "La prescripción extintiva en materia civil:", "opciones": [{"texto": "Extingue acciones no ejercidas en el plazo legal: cinco años las ejecutivas.", "justificacion": "Correcta. La prescripción extingue las acciones y derechos ajenos por no haberse ejercido durante cierto tiempo (art. 2392 del Código Civil); la acción ejecutiva prescribe en cinco años y la ordinaria en diez (art. 2415 del Código Civil). Base legal: arts. 2392 y 2415 del Código Civil."}, {"texto": "Permite adquirir el dominio de una cosa por haberla poseído largo tiempo.", "justificacion": "Incorrecta. Esa es la prescripción adquisitiva."}, {"texto": "Extingue la obligación porque el deudor pagó íntegramente lo debido.", "justificacion": "Incorrecta. El pago es otro modo de extinguir obligaciones."}, {"texto": "Carece de plazos legales y opera a criterio del juez de la causa.", "justificacion": "Incorrecta. La ley fija plazos concretos (art. 2415)."}], "correcta": 0, "referencias": ["CC"]}, {"id": "EX-256", "area": 4, "subarea": "Obligaciones y Contratos", "tema": "Compraventa", "resultado": "Identifica los elementos de la compraventa", "demanda": "Comprender", "enunciado": "El contrato de compraventa se define como:", "opciones": [{"texto": "Una parte se obliga a dar una cosa y la otra a pagarla en dinero.", "justificacion": "Correcta. La compraventa es un contrato en que una de las partes se obliga a dar una cosa y la otra a pagarla en dinero (art. 1732 del Código Civil) y se reputa perfecta desde que las partes convienen en la cosa y el precio, salvo las excepciones legales (art. 1740 del Código Civil). Base legal: arts. 1732 y 1740 del Código Civil."}, {"texto": "Una parte concede a otra el goce temporal de una cosa por un precio.", "justificacion": "Incorrecta. No hay transferencia de dominio."}, {"texto": "Una parte transfiere gratuitamente una cosa a otra que la acepta.", "justificacion": "Incorrecta. No hay precio."}, {"texto": "Un acto unilateral por el que el vendedor promete entregar una cosa.", "justificacion": "Incorrecta. Es bilateral."}], "correcta": 0, "referencias": ["CC"]}, {"id": "EX-257", "area": 4, "subarea": "Personas y Familia", "tema": "Unión de Hecho", "resultado": "Identifica los requisitos de la unión de hecho", "demanda": "Aplicar", "enunciado": "Para que una unión de hecho produzca efectos jurídicos en Ecuador, se requiere:", "opciones": [{"texto": "Unión estable y monogámica de dos personas libres de vínculo matrimonial.", "justificacion": "Correcta. La unión estable y monogámica entre dos personas libres de vínculo matrimonial, que forman un hogar de hecho, genera los mismos derechos y obligaciones que el matrimonio (art. 68 de la Constitución; art. 222 del Código Civil); la ley presume la estabilidad cuando ha durado al menos dos años."}, {"texto": "Convivencia ocasional de un fin de semana entre dos personas adultas.", "justificacion": "Incorrecta. Se exige estabilidad."}, {"texto": "Que la pareja tenga hijos en común reconocidos ante el Registro Civil.", "justificacion": "Incorrecta. Los hijos no son requisito."}, {"texto": "Que la pareja firme ante notario un contrato de sociedad de bienes.", "justificacion": "Incorrecta. La formalización no es requisito de existencia; puede probarse la unión."}], "correcta": 0, "referencias": ["CRE", "CC"]}, {"id": "EX-258", "area": 4, "subarea": "Personas y Familia", "tema": "Patria Potestad", "resultado": "Comprende la patria potestad", "demanda": "Comprender", "enunciado": "La patria potestad es:", "opciones": [{"texto": "Derechos y deberes de los padres sobre el hijo no emancipado.", "justificacion": "Correcta. La patria potestad es una función tuitiva que busca el interés superior del menor (Art. 283 CC). Base legal: art. 283 del Código Civil."}, {"texto": "Un derecho absoluto de los padres, ejercido en su propio beneficio.", "justificacion": "Incorrecta. Es una función en beneficio del hijo."}, {"texto": "Un conjunto de facultades limitado a la administración de los bienes del hijo.", "justificacion": "Incorrecta. Aplica a la persona también."}, {"texto": "Una potestad que se extingue cuando el hijo cumple quince años de edad.", "justificacion": "Incorrecta. Se pierde con la emancipación legal."}], "correcta": 0, "referencias": ["CC"]}, {"id": "EX-259", "area": 4, "subarea": "Personas y Familia", "tema": "Domicilio", "resultado": "Diferencia domicilio de residencia", "demanda": "Analizar", "enunciado": "En el derecho civil, el domicilio se define como:", "opciones": [{"texto": "La residencia con ánimo real o presunto de permanecer.", "justificacion": "Correcta. El Art. 44 del CC define el domicilio como la residencia con ánimo de permanencia. Base legal: normas sobre el domicilio del Título Preliminar y Libro I del Código Civil."}, {"texto": "Lugar donde la persona nació, que se mantiene durante toda su vida.", "justificacion": "Incorrecta. Eso puede ser el origen, no el domicilio."}, {"texto": "Lugar donde la persona trabaja, aunque no resida allí.", "justificacion": "Incorrecta. No necesariamente."}, {"texto": "Lugar donde la persona pasa sus vacaciones de forma temporal.", "justificacion": "Incorrecta. No hay ánimo de permanencia."}], "correcta": 0, "referencias": ["CC"]}, {"id": "EX-260", "area": 4, "subarea": "Obligaciones y Contratos", "tema": "Arrendamiento", "resultado": "Identifica los elementos del arrendamiento", "demanda": "Comprender", "enunciado": "El contrato de arrendamiento es aquel en el que:", "opciones": [{"texto": "Una parte concede el goce temporal de una cosa y la otra paga un precio.", "justificacion": "Correcta. El Art. 1857 del CC define el arrendamiento como la concesión del uso o goce temporal por un precio. Base legal: normas sobre el arrendamiento del Código Civil."}, {"texto": "Una parte transfiere definitivamente el dominio de la cosa a la otra.", "justificacion": "Incorrecta. Solo es uso temporal."}, {"texto": "Una parte dona la cosa a otra, sin recibir contraprestación alguna.", "justificacion": "Incorrecta. No hay precio."}, {"texto": "Es unilateral, porque solo el arrendatario contrae obligaciones.", "justificacion": "Incorrecta. Genera obligaciones para ambas partes."}], "correcta": 0, "referencias": ["CC"]}, {"id": "EX-261", "area": 4, "subarea": "Obligaciones y Contratos", "tema": "Responsabilidad Civil Extracontractual", "resultado": "Aplica la responsabilidad civil", "demanda": "Aplicar", "enunciado": "¿Qué elementos se requieren para que exista responsabilidad civil extracontractual?", "opciones": [{"texto": "Hecho culpable o doloso, daño y nexo causal entre ambos.", "justificacion": "Correcta. Los elementos de la responsabilidad extracontractual (Art. 2229 CC) son el daño, la culpa y el nexo causal. Base legal: arts. 2214 y 2229 del Código Civil."}, {"texto": "Solo la existencia de un contrato válido entre las partes.", "justificacion": "Incorrecta. Eso es responsabilidad contractual."}, {"texto": "Solo la intención de dañar, aunque no se produzca daño alguno.", "justificacion": "Incorrecta. También puede ser por negligencia."}, {"texto": "Basta la conducta culpable, aunque no exista daño cierto.", "justificacion": "Incorrecta. El daño es esencial."}], "correcta": 0, "referencias": ["CC"]}, {"id": "EX-262", "area": 5, "subarea": "Mercantil", "tema": "Letra de Cambio", "resultado": "Comprende la letra de cambio", "demanda": "Comprender", "enunciado": "La letra de cambio es:", "opciones": [{"texto": "Título valor con una orden incondicional de pagar dinero.", "justificacion": "Correcta. La letra de cambio es un título valor que incorpora una orden de pago (Código de Comercio). Base legal: normas sobre la letra de cambio del Código de Comercio de 2019."}, {"texto": "Contrato de compraventa en el que se difiere el pago del precio.", "justificacion": "Incorrecta. Es un título valor."}, {"texto": "Valor representativo del capital de una compañía cotizada en bolsa.", "justificacion": "Incorrecta. Es un título de crédito."}, {"texto": "Promesa de pago sin formalidades, que puede constar en cualquier documento.", "justificacion": "Incorrecta. Requiere formalidades."}], "correcta": 0, "referencias": ["CCOM"]}, {"id": "EX-263", "area": 5, "subarea": "Mercantil", "tema": "Compañía Anónima", "resultado": "Identifica características de la C.A.", "demanda": "Comprender", "enunciado": "¿Cuál es una característica principal de la Compañía Anónima?", "opciones": [{"texto": "Capital dividido en acciones y responsabilidad limitada a los aportes.", "justificacion": "Correcta. La C.A. se caracteriza por la limitación de responsabilidad y la división del capital en acciones (Ley de Compañías). Base legal: art. 143 de la Ley de Compañías."}, {"texto": "Los socios responden con su patrimonio personal por las deudas sociales.", "justificacion": "Incorrecta. La responsabilidad es limitada."}, {"texto": "Carece de junta general y la administran solo sus fundadores.", "justificacion": "Incorrecta. Es su órgano supremo."}, {"texto": "Solo puede constituirse con dos socios y no admite nuevos accionistas.", "justificacion": "Incorrecta. Puede tener muchos."}], "correcta": 0, "referencias": ["LC"]}, {"id": "EX-264", "area": 4, "subarea": "Obligaciones y Contratos", "tema": "Mandato", "resultado": "Diferencia mandato de arrendamiento", "demanda": "Analizar", "enunciado": "El contrato de mandato se define como:", "opciones": [{"texto": "Una persona confía a otra la gestión de sus negocios.", "justificacion": "Correcta. El mandato implica la gestión de negocios por cuenta ajena (Art. 2020 CC). Base legal: art. 2020 del Código Civil."}, {"texto": "Una persona entrega una cosa a otra en garantía de una obligación.", "justificacion": "Incorrecta. Eso es prenda o hipoteca."}, {"texto": "Una persona transfiere a otra la propiedad de un bien por un precio.", "justificacion": "Incorrecta. Es un acto de disposición."}, {"texto": "Una persona concede a otra el uso temporal de un inmueble por un canon.", "justificacion": "Incorrecta. Eso es arrendamiento."}], "correcta": 0, "referencias": ["CC"]}, {"id": "EX-265", "area": 4, "subarea": "Sucesiones", "tema": "Sucesión Intestada", "resultado": "Aplica el orden de suceder intestado", "demanda": "Aplicar", "enunciado": "En la sucesión intestada, ¿quiénes son los primeros llamados a heredar?", "opciones": [{"texto": "Los hijos, que excluyen a otros herederos, sin perjuicio de la porción conyugal.", "justificacion": "Correcta. Los hijos excluyen a todos los otros herederos, sin perjuicio de la porción conyugal que corresponda al cónyuge sobreviviente (art. 1028 del Código Civil)."}, {"texto": "Los hermanos del causante, que concurren con los hijos por partes iguales.", "justificacion": "Incorrecta. Los hermanos solo heredan a falta de descendientes, ascendientes y cónyuge."}, {"texto": "Los primos del causante, como parientes colaterales más próximos.", "justificacion": "Incorrecta. Los colaterales lejanos están en órdenes posteriores."}, {"texto": "El Estado, que recibe la herenc
