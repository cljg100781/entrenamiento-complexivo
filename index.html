rse excepciones como falsedad y pago."}, {"texto": "Sí: la letra de cambio es título ejecutivo y no admite excepciones.", "justificacion": "Incorrecta. El título ejecutivo admite excepciones; no es inimpugnable."}, {"texto": "No, aunque solo puede oponerse la prescripción de la acción cambiaria.", "justificacion": "Incorrecta. Pueden oponerse varias excepciones, incluida falsedad y pago."}], "correcta": 0, "referencias": ["COGEP"]}, {"id": "EX-340", "area": 3, "subarea": "Derecho Procesal (COGEP)", "tema": "Casación civil y precedente", "resultado": "Evalúa la casación por inobservancia de precedente.", "demanda": "Evaluar", "enunciado": "La sentencia de segunda instancia se aparta de un precedente obligatorio de la Corte Nacional, sin justificar el apartamiento, y aplica otra interpretación. ¿Procede casación?", "opciones": [{"texto": "Sí, porque la inobservancia de precedente obligatorio es causal de casación.", "justificacion": "Correcta. La inobservancia de precedente obligatorio configura causal de casación. Base legal: art. 268 del Código Orgánico General de Procesos."}, {"texto": "No, porque el precedente de la Corte Nacional no es obligatorio para los jueces.", "justificacion": "Incorrecta. El precedente obligatorio de la Corte Nacional sí vincula a los jueces."}, {"texto": "Sí, pero solo si la Corte Nacional lo declara de oficio sin recurso.", "justificacion": "Incorrecta. La casación requiere recurso de parte, no declaración de oficio."}, {"texto": "No, porque la casación solo procede por indebida aplicación de la ley, no por precedente.", "justificacion": "Incorrecta. La inobservancia de precedente es causal de casación por error de derecho."}], "correcta": 0, "referencias": ["COGEP"]}, {"id": "EX-341", "area": 3, "subarea": "Derecho Procesal (COGEP)", "tema": "Ejecución y tercería", "resultado": "Distingue tercería excluyente de tercería coadyuvante.", "demanda": "Analizar", "enunciado": "En ejecución, un tercero alega que el bien embargado es de su propiedad y pide excluirlo, mientras otro tercero alega ser acreedor y quiere cobrar con el remate. ¿Qué tercerías son?", "opciones": [{"texto": "La primera es excluyente y la segunda, coadyuvante.", "justificacion": "Correcta. La excluyente reclama propiedad; la coadyuvante busca participar en el cobro. Base legal: art. 47 del Código Orgánico General de Procesos."}, {"texto": "Ambas excluyentes, porque ambas buscan excluir el bien del embargo.", "justificacion": "Incorrecta. El acreedor no busca excluir, sino cobrar; es coadyuvante."}, {"texto": "Ambas coadyuvantes, porque ambas quieren participar en la ejecución.", "justificacion": "Incorrecta. La que reclama propiedad es excluyente, no coadyuvante."}, {"texto": "Ninguna, porque en ejecución no se admiten tercerías de ningún tipo.", "justificacion": "Incorrecta. En ejecución sí se admiten tercerías excluyentes y coadyuvantes."}], "correcta": 0, "referencias": ["COGEP"]}, {"id": "EX-342", "area": 3, "subarea": "Métodos Alternativos", "tema": "Mediación y confidencialidad", "resultado": "Evalúa la confidencialidad en mediación.", "demanda": "Evaluar", "enunciado": "En un juicio posterior, una parte quiere usar como prueba lo dicho por la otra en mediación que terminó sin acuerdo. La otra se opone alegando confidencialidad. ¿Qué corresponde?", "opciones": [{"texto": "Excluirla, porque la mediación es confidencial y lo dicho no puede usarse como prueba.", "justificacion": "Correcta. La confidencialidad impide usar en juicio lo revelado en mediación sin acuerdo. Base legal: art. 50 de la Ley de Arbitraje y Mediación."}, {"texto": "Admitirla, porque todo lo dicho en mediación puede usarse en juicio posterior.", "justificacion": "Incorrecta. Lo dicho en mediación es confidencial y no puede usarse en juicio posterior."}, {"texto": "Admitirla si el mediador la ratifica, porque la ratificación levanta la confidencialidad.", "justificacion": "Incorrecta. La ratificación del mediador no levanta la confidencialidad."}, {"texto": "Admitirla con menor peso, porque aunque es confidencial, puede valorarse parcialmente.", "justificacion": "Incorrecta. No se valora con menor peso; se excluye por confidencialidad."}], "correcta": 0, "referencias": ["LAM"]}, {"id": "EX-344", "area": 3, "subarea": "Métodos Alternativos", "tema": "Arbitraje y competencia-competencia", "resultado": "Aplica el principio competencia-competencia.", "demanda": "Analizar", "enunciado": "En arbitraje, el demandado alega que el convenio arbitral es nulo por falta de capacidad. El tribunal arbitral decide sobre su propia competencia. ¿Puede hacerlo?", "opciones": [{"texto": "Sí, porque el tribunal arbitral decide sobre su propia competencia.", "justificacion": "Correcta. El principio competencia-competencia permite al tribunal decidir sobre su competencia. Base legal: art. 22 de la Ley de Arbitraje y Mediación."}, {"texto": "No, porque solo el juez ordinario puede decidir sobre la validez del convenio arbitral.", "justificacion": "Incorrecta. El tribunal arbitral puede decidir sobre su propia competencia por competencia-competencia."}, {"texto": "No, porque la nulidad del convenio debe resolverla siempre la Corte Constitucional.", "justificacion": "Incorrecta. La Corte Constitucional no resuelve la validez del convenio arbitral."}, {"texto": "Sí, pero su decisión es definitiva y no puede revisarse en anulación.", "justificacion": "Incorrecta. La decisión puede revisarse en acción de nulidad del laudo."}], "correcta": 0, "referencias": ["LAM"]}, {"id": "EX-345", "area": 3, "subarea": "Métodos Alternativos", "tema": "Anulación del laudo", "resultado": "Identifica las causales de anulación del laudo.", "demanda": "Evaluar", "enunciado": "En un arbitraje no se notificó a una parte la audiencia en que se practicó la prueba, lo que le impidió ejercer su defensa; luego se dictó el laudo. ¿Procede la acción de nulidad?", "opciones": [{"texto": "Sí, porque la falta de notificación impidió ejercer el derecho de defensa.", "justificacion": "Correcta. Es causal de nulidad del laudo que no se haya notificado a una de las partes con las providencias del tribunal y que ello haya limitado o impedido su derecho de defensa (art. 31 de la Ley de Arbitraje y Mediación)."}, {"texto": "No, porque el laudo es inimpugnable y no admite nulidad por ningún motivo.", "justificacion": "Incorrecta. El laudo admite acción de nulidad por las causales del art. 31."}, {"texto": "Sí, pero solo si se demuestra que el laudo es injusto en el fondo.", "justificacion": "Incorrecta. La nulidad no revisa el fondo de lo decidido."}, {"texto": "No, porque los vicios de notificación solo se reclaman ante los árbitros.", "justificacion": "Incorrecta. La acción de nulidad se interpone contra el laudo por las causales legales."}], "correcta": 0, "referencias": ["LAM"]}, {"id": "EX-346", "area": 3, "subarea": "Métodos Alternativos", "tema": "Mediación y acuerdo parcial", "resultado": "Evalúa el acta de mediación con acuerdo parcial.", "demanda": "Aplicar", "enunciado": "En mediación, las partes acuerdan sobre una parte de la controversia y dejan otra sin acuerdo. ¿Qué efecto tiene el acta?", "opciones": [{"texto": "Efecto de sentencia para lo acordado y las partes pueden demandar lo no acordado.", "justificacion": "Correcta. El acuerdo parcial tiene efecto de cosa juzgada para lo acordado; lo demás puede demandarse. Base legal: art. 47 de la Ley de Arbitraje y Mediación."}, {"texto": "Ninguno, porque el acuerdo parcial no tiene efecto de sentencia.", "justificacion": "Incorrecta. El acuerdo parcial tiene efecto de sentencia para lo acordado."}, {"texto": "Efecto de sentencia para todo, porque el acuerdo parcial se extiende a toda la controversia.", "justificacion": "Incorrecta. El acuerdo parcial no se extiende a lo no acordado."}, {"texto": "Nulo, porque la mediación exige acuerdo total para tener efectos.", "justificacion": "Incorrecta. La mediación admite acuerdo parcial con efectos para lo acordado."}], "correcta": 0, "referencias": ["LAM"]}, {"id": "EX-347", "area": 4, "subarea": "Personas y Familia", "tema": "Nulidad del matrimonio", "resultado": "Distingue nulidad de matrimonio por error en persona.", "demanda": "Evaluar", "enunciado": "Una persona contrae matrimonio creyendo que su pareja es otra persona con la que tenía relación, por suplantación de identidad. ¿Qué vicio se configura?", "opciones": [{"texto": "Error en persona, porque el consentimiento recayó en persona distinta a la querida.", "justificacion": "Correcta. El error en la persona es causal de nulidad del matrimonio por vicio del consentimiento. Base legal: normas sobre la nulidad del matrimonio por vicios del consentimiento del Código Civil."}, {"texto": "Error en cualidades, porque la persona tenía cualidades distintas a las esperadas.", "justificacion": "Incorrecta. El error en cualidades no anula; el error es en la identidad de la persona."}, {"texto": "Dolo, porque hubo engaño sobre cualidades, pero no sobre la identidad de la persona.", "justificacion": "Incorrecta. Aquí hubo suplantación de identidad, no solo engaño sobre cualidades."}, {"texto": "Fuerza, porque la persona fue obligada a casarse contra su voluntad.", "justificacion": "Incorrecta. No hubo fuerza; hubo error en la persona por suplantación."}], "correcta": 0, "referencias": ["CC"]}, {"id": "EX-348", "area": 4, "subarea": "Personas y Familia", "tema": "Unión de hecho y sociedad de bienes", "resultado": "Distingue sociedad de bienes de sociedad conyugal.", "demanda": "Analizar", "enunciado": "Dos convivientes en unión de hecho terminan su convivencia y quieren liquidar bienes adquiridos durante la unión. ¿Qué sociedad se liquida?", "opciones": [{"texto": "Sociedad de bienes, porque la unión de hecho genera sociedad de bienes con reglas propias.", "justificacion": "Correcta. La unión de hecho genera sociedad de bienes, distinta de la sociedad conyugal. Base legal: art. 68 de la Constitución; art. 222 del Código Civil."}, {"texto": "Sociedad conyugal, porque la unión de hecho genera sociedad conyugal igual que el matrimonio.", "justificacion": "Incorrecta. La unión de hecho genera sociedad de bienes, no sociedad conyugal."}, {"texto": "Ninguna, porque la unión de hecho no genera sociedad de bienes.", "justificacion": "Incorrecta. Sí genera sociedad de bienes que debe liquidarse."}, {"texto": "Sociedad comercial, porque los convivientes son socios comerciales por convivir.", "justificacion": "Incorrecta. No es sociedad comercial; es sociedad de bienes de la unión de hecho."}], "correcta": 0, "referencias": ["CC", "CRE"]}, {"id": "EX-350", "area": 4, "subarea": "Personas y Familia", "tema": "Filiación e impugnación", "resultado": "Aplica la impugnación de paternidad y prueba de ADN.", "demanda": "Evaluar", "enunciado": "Un hombre reconoció a un niño como hijo, pero luego prueba de ADN demuestra que no es padre biológico y que el reconocimiento fue por engaño. ¿Qué puede hacer?", "opciones": [{"texto": "Impugnar el reconocimiento por vicio del consentimiento y por no ser padre biológico.", "justificacion": "Correcta. El reconocimiento puede impugnarse por error o dolo y por falta de vínculo biológico. Base legal: arts. 249 y 250 del Código Civil; art. 106 del Código de la Niñez y Adolescencia."}, {"texto": "Nada, porque el reconocimiento es irrevocable aunque haya engaño y no sea padre biológico.", "justificacion": "Incorrecta. El reconocimiento puede impugnarse por vicio y por no ser padre biológico."}, {"texto": "Solo pedir alimentos, porque el reconocimiento no puede impugnarse por ADN.", "justificacion": "Incorrecta. El ADN es prueba idónea para impugnar el reconocimiento."}, {"texto": "Adoptar al niño, porque la única vía es adoptar tras impugnar.", "justificacion": "Incorrecta. La adopción es distinta; la vía es impugnar el reconocimiento."}], "correcta": 0, "referencias": ["CC", "CONA"]}, {"id": "EX-351", "area": 4, "subarea": "Personas y Familia", "tema": "Capitulaciones matrimoniales", "resultado": "Evalúa la validez de capitulaciones matrimoniales.", "demanda": "Analizar", "enunciado": "Antes del matrimonio, los novios pactan en capitulaciones que todos los bienes serán propios y no habrá sociedad conyugal. ¿Es válido el pacto?", "opciones": [{"texto": "Sí, porque las capitulaciones previas pueden excluir la sociedad conyugal.", "justificacion": "Correcta. Las capitulaciones previas pueden excluir o modificar la sociedad conyugal. Base legal: normas sobre las capitulaciones matrimoniales del Código Civil."}, {"texto": "No, porque la sociedad conyugal es obligatoria y no admite exclusión.", "justificacion": "Incorrecta. Las capitulaciones pueden excluir o modificar la sociedad conyugal."}, {"texto": "No, porque las capitulaciones solo pueden otorgarse después de casarse.", "justificacion": "Incorrecta. Las capitulaciones se otorgan antes del matrimonio."}, {"texto": "Sí, pero solo surte efecto si se inscribe después del divorcio.", "justificacion": "Incorrecta. Deben otorgarse antes y no dependen del divorcio."}], "correcta": 0, "referencias": ["CC"]}, {"id": "EX-353", "area": 4, "subarea": "Obligaciones y Contratos", "tema": "Nulidad y confirmación", "resultado": "Distingue confirmación de nulidad relativa.", "demanda": "Evaluar", "enunciado": "Un contrato con vicio de error que genera nulidad relativa es confirmado por la parte afectada, con conocimiento del vicio y sin presión. ¿Qué efecto tiene la confirmación?", "opciones": [{"texto": "Sana la nulidad relativa, porque se ratificó con conocimiento del vicio.", "justificacion": "Correcta. La confirmación con conocimiento del vicio sana la nulidad relativa. Base legal: art. 1699 del Código Civil (la nulidad absoluta no se sanea por ratificación) y normas sobre la ratificación de la nulidad relativa."}, {"texto": "No la sana, porque la nulidad relativa no admite ratificación alguna.", "justificacion": "Incorrecta. La nulidad relativa sí puede confirmarse por la parte protegida."}, {"texto": "Sana también la nulidad absoluta, porque toda nulidad se ratifica.", "justificacion": "Incorrecta. La nulidad absoluta no se sana con confirmación."}, {"texto": "Anula el contrato, porque ratificar implica reconocer la nulidad.", "justificacion": "Incorrecta. La confirmación purga, no anula."}], "correcta": 0, "referencias": ["CC"]}, {"id": "EX-354", "area": 4, "subarea": "Obligaciones y Contratos", "tema": "Culpa y caso fortuito", "resultado": "Distingue culpa de caso fortuito en responsabilidad.", "demanda": "Analizar", "enunciado": "Un deudor no cumple porque un terremoto imprevisible e irresistible destruyó el bien debido, sin culpa suya. ¿Debe responder?", "opciones": [{"texto": "No: el caso fortuito imprevisible e irresistible exime de responsabilidad.", "justificacion": "Correcta. El caso fortuito exime si es imprevisible, irresistible y sin culpa. Base legal: arts. 30 y 1563 del Código Civil."}, {"texto": "Sí, porque todo incumplimiento genera responsabilidad aun con caso fortuito.", "justificacion": "Incorrecta. El caso fortuito imprevisible e irresistible exime si no hay culpa."}, {"texto": "Sí, porque en una zona sísmica ningún terremoto es caso fortuito.", "justificacion": "Incorrecta. Aunque la zona sea sísmica, el terremoto concreto puede ser imprevisible e irresistible."}, {"texto": "No, y basta con alegar el caso fortuito sin necesidad de probarlo.", "justificacion": "Incorrecta. El deudor debe probar el caso fortuito."}], "correcta": 0, "referencias": ["CC"]}, {"id": "EX-355", "area": 4, "subarea": "Obligaciones y Contratos", "tema": "Cláusula penal", "resultado": "Aplica la cláusula penal y su reducción.", "demanda": "Evaluar", "enunciado": "En un contrato, se pacta cláusula penal de 100.000 por incumplimiento parcial de 10% de la obligación, que ya se cumplió en 90%. El acreedor exige los 100.000. ¿Qué puede hacer el juez?", "opciones": [{"texto": "Reducirla, por el cumplimiento parcial y la desproporción de la pena.", "justificacion": "Correcta. La cláusula penal puede reducirse por cumplimiento parcial o por ser enorme. Base legal: normas sobre la cláusula penal del Código Civil."}, {"texto": "Conceder los 100.000, porque la cláusula penal no puede reducirse.", "justificacion": "Incorrecta. La cláusula penal puede reducirse si es enorme o si hubo cumplimiento parcial."}, {"texto": "Negarla, porque la cláusula penal es nula por regla general.", "justificacion": "Incorrecta. La cláusula penal es válida; puede moderarse, no anularse automáticamente."}, {"texto": "Concederla más los daños, aunque no se pactó su acumulación.", "justificacion": "Incorrecta. Sin pacto, la cláusula penal excluye daños adicionales."}], "correcta": 0, "referencias": ["CC"]}, {"id": "EX-356", "area": 4, "subarea": "Obligaciones y Contratos", "tema": "Lesión enorme", "resultado": "Aplica la lesión enorme en compraventa.", "demanda": "Analizar", "enunciado": "Una persona vende un inmueble que vale 100.000 por 30.000, por necesidad apremiante y sin conocer su valor. ¿Qué puede demandar?", "opciones": [{"texto": "Rescisión por lesión enorme: el precio es inferior a la mitad del justo.", "justificacion": "Correcta. El vendedor sufre lesión enorme cuando el precio que recibe es inferior a la mitad del justo precio de la cosa, y puede pedir la rescisión del contrato (arts. 1828 y 1829 del Código Civil)."}, {"texto": "Nulidad por error, porque el vendedor desconocía el valor del inmueble.", "justificacion": "Incorrecta. La figura específica es lesión enorme, no error."}, {"texto": "Nulidad por dolo, porque el comprador lo engañó sobre el precio.", "justificacion": "Incorrecta. No hay prueba de dolo; hay desproporción que configura lesión enorme."}, {"texto": "Nada, porque la libertad contractual impide revisar el precio.", "justificacion": "Incorrecta. La lesión enorme permite revisar la desproporción grave."}], "correcta": 0, "referencias": ["CC"]}, {"id": "EX-357", "area": 4, "subarea": "Obligaciones y Contratos", "tema": "Mora del acreedor", "resultado": "Distingue mora del deudor de mora del acreedor.", "demanda": "Analizar", "enunciado": "El deudor quiere pagar en el plazo, pero el acreedor se niega a recibir el pago sin justificación. ¿En qué mora incurre el acreedor?", "opciones": [{"texto": "Mora del acreedor, por negarse sin justa causa a recibir el pago.", "justificacion": "Correcta. La mora del acreedor se configura cuando se niega injustificadamente a recibir el pago. Base legal: normas sobre el pago por consignación y la mora del acreedor del Código Civil."}, {"texto": "Mora del deudor, porque la deuda no se extinguió dentro del plazo.", "justificacion": "Incorrecta. El deudor quiso pagar; la mora es del acreedor por no recibir."}, {"texto": "Ninguna, porque la negativa del acreedor no tiene efectos jurídicos.", "justificacion": "Incorrecta. La negativa injustificada sí genera mora del acreedor."}, {"texto": "Mora de ambos, porque los dos son responsables de que no se pagara.", "justificacion": "Incorrecta. Solo el acreedor está en mora; el deudor ofreció pagar."}], "correcta": 0, "referencias": ["CC"]}, {"id": "EX-358", "area": 4, "subarea": "Obligaciones y Contratos", "tema": "Mandato aparente", "resultado": "Aplica el mandato aparente frente a terceros.", "demanda": "Evaluar", "enunciado": "Un mandatario revocado sigue actuando como mandatario frente a un tercero de buena fe que desconocía la revocación. ¿Obliga el acto al mandante?", "opciones": [{"texto": "Sí, porque el tercero de buena fe ignoraba la revocación.", "justificacion": "Correcta. El mandato aparente protege al tercero de buena fe que desconocía la revocación. Base legal: normas sobre la terminación del mandato y los terceros de buena fe del Código Civil."}, {"texto": "No, porque la revocación extingue el mandato y ningún acto posterior obliga al mandante.", "justificacion": "Incorrecta. Frente a tercero de buena fe, el mandato aparente obliga al mandante."}, {"texto": "No, porque el tercero debió verificar la revocación antes de contratar.", "justificacion": "Incorrecta. La buena fe protege al tercero que desconocía la revocación."}, {"texto": "Sí, porque la revocación nunca tiene efectos frente a terceros.", "justificacion": "Incorrecta. La revocación sí tiene efectos, salvo frente a tercero de buena fe."}], "correcta": 0, "referencias": ["CC"]}, {"id": "EX-359", "area": 4, "subarea": "Sucesiones", "tema": "Legítima y cuarta de libre disposición", "resultado": "Calcula la legítima y la cuarta de libre disposición.", "demanda": "Evaluar", "enunciado": "Un testador con hijos deja testamento asignando 50% a un amigo, 30% a un hijo y 20% a otro hijo. ¿Qué porción vulnera la legítima?", "opciones": [{"texto": "La del amigo, porque con hijos solo es libre la cuarta parte de los bienes.", "justificacion": "Correcta. Con legitimarios, la cuarta de libre disposición es el límite para extraños. Base legal: art. 1205 del Código Civil y normas sobre legítimas y cuarta de mejoras."}, {"texto": "Ninguna, porque el testador puede dejar libremente la mitad a un extraño.", "justificacion": "Incorrecta. Con hijos, la libre disposición es la cuarta parte, no la mitad."}, {"texto": "La de los hijos, porque no tienen legítima cuando existe testamento.", "justificacion": "Incorrecta. Los hijos tienen derecho a legítima que limita la libre disposición."}, {"texto": "Todas, porque el testamento es nulo por incluir a un extraño.", "justificacion": "Incorrecta. No es nulo todo; se reforma para respetar la legítima."}], "correcta": 0, "referencias": ["CC"]}, {"id": "EX-360", "area": 4, "subarea": "Sucesiones", "tema": "Porción conyugal", "resultado": "Distingue porción conyugal de legítima.", "demanda": "Analizar", "enunciado": "Al morir el causante, su cónyuge sobreviviente sin bienes propios reclama porción conyugal, aunque hay hijos legitimarios. ¿Qué le corresponde?", "opciones": [{"texto": "Porción conyugal, porque el cónyuge sobreviviente sin bienes tiene derecho a ella.", "justificacion": "Correcta. La porción conyugal corresponde al cónyuge sobreviviente que carece de bienes. Base legal: art. 1205 del Código Civil y normas sobre la porción conyugal."}, {"texto": "Nada, porque con hijos legitimarios el cónyuge no tiene derecho a porción conyugal.", "justificacion": "Incorrecta. El cónyuge sobreviviente pobre tiene derecho a porción conyugal aun con hijos."}, {"texto": "Toda la herencia, porque el cónyuge excluye a los hijos.", "justificacion": "Incorrecta. El cónyuge no excluye a los hijos; tiene porción conyugal."}, {"texto": "Legítima, porque el cónyuge es legitimario igual que los hijos.", "justificacion": "Incorrecta. El cónyuge no es legitimario; tiene porción conyugal, distinta de la legítima."}], "correcta": 0, "referencias": ["CC"]}, {"id": "EX-361", "area": 4, "subarea": "Sucesiones", "tema": "Indignidad vs desheredamiento", "resultado": "Distingue indignidad de desheredamiento.", "demanda": "Evaluar", "enunciado": "Un hijo atentó contra la vida del causante, pero el causante lo perdonó expresamente en testamento posterior. ¿Puede el hijo heredar?", "opciones": [{"texto": "Sí, porque el perdón del causante en testamento purga la indignidad.", "justificacion": "Correcta. El perdón expreso en testamento purga la indignidad. Base legal: normas sobre la indignidad para suceder del Código Civil (no se alega contra disposiciones testamentarias posteriores a los hechos)."}, {"texto": "No, porque la indignidad es irrevocable aunque haya perdón del causante.", "justificacion": "Incorrecta. El perdón del causante puede purgar la indignidad si se otorga en testamento."}, {"texto": "No, porque el desheredamiento es irrevocable y no admite perdón.", "justificacion": "Incorrecta. El desheredamiento y la indignidad admiten perdón expreso."}, {"texto": "Sí, porque la indignidad nunca impide heredar.", "justificacion": "Incorrecta. La indignidad sí impide heredar, salvo perdón."}], "correcta": 0, "referencias": ["CC"]}, {"id": "EX-362", "area": 4, "subarea": "Sucesiones", "tema": "Desheredamiento y prueba", "resultado": "Aplica la prueba del desheredamiento.", "demanda": "Evaluar", "enunciado": "Un padre deshereda a su hijo en testamento alegando injuria grave, pero los herederos no prueban la injuria. ¿Qué corresponde?", "opciones": [{"texto": "Dejar sin efecto el desheredamiento, porque la causal debe probarse por quien la alega.", "justificacion": "Correcta. La causal de desheredamiento debe probarse; sin prueba, se deja sin efecto. Base legal: art. 1232 del Código Civil."}, {"texto": "Mantener el desheredamiento, porque basta alegarlo en testamento.", "justificacion": "Incorrecta. El desheredamiento debe probarse; sin prueba, es ineficaz."}, {"texto": "Anular todo el testamento, porque el desheredamiento no probado anula todo el testamento.", "justificacion": "Incorrecta. Solo cae el desheredamiento, no todo el testamento."}, {"texto": "Mantenerlo, porque el testamento es prueba suficiente de la injuria.", "justificacion": "Incorrecta. El testamento alega, pero no prueba la causal."}], "correcta": 0, "referencias": ["CC"]}, {"id": "EX-363", "area": 4, "subarea": "Sucesiones", "tema": "Beneficio de inventario", "resultado": "Aplica la pérdida del beneficio de inventario.", "demanda": "Analizar", "enunciado": "Un heredero acepta con beneficio de inventario, pero luego oculta bienes de la herencia para quedarse con ellos. ¿Qué pierde?", "opciones": [{"texto": "El beneficio de inventario, y pasa a responder de forma ilimitada.", "justificacion": "Correcta. Ocultar bienes hace perder el beneficio y el heredero responde por deudas sin límite. Base legal: normas sobre el beneficio de inventario del Código Civil."}, {"texto": "Nada, porque el beneficio de inventario es irrevocable una vez aceptado.", "justificacion": "Incorrecta. Ocultar bienes hace perder el beneficio de inventario."}, {"texto": "La calidad de heredero, porque ocultar bienes lo excluye de la sucesión.", "justificacion": "Incorrecta. No pierde la calidad de heredero; pierde el beneficio."}, {"texto": "Únicamente su legítima, que acrece a los demás herederos.", "justificacion": "Incorrecta. Afecta el beneficio de inventario, no solo la legítima."}], "correcta": 0, "referencias": ["CC"]}, {"id": "EX-364", "area": 4, "subarea": "Sucesiones", "tema": "Colación", "resultado": "Aplica la colación de donaciones.", "demanda": "Analizar", "enunciado": "Un hijo recibió en vida una donación del causante y luego concurre a la herencia con otros hijos. ¿Qué debe hacer con la donación?", "opciones": [{"texto": "Colacionarla, imputándola a su cuota para igualar a los herederos.", "justificacion": "Correcta. La colación obliga a imputar las donaciones a la cuota hereditaria. Base legal: normas sobre la colación y el acervo imaginario del Código Civil."}, {"texto": "Nada, porque la donación en vida no se considera en la herencia.", "justificacion": "Incorrecta. La donación debe colacionarse para igualar a los herederos."}, {"texto": "Ocultarla, porque la colación es voluntaria y no obligatoria.", "justificacion": "Incorrecta. La colación es obligatoria para igualar a los herederos."}, {"texto": "Devolverla, porque toda donación en vida es nula si hay otros herederos.", "justificacion": "Incorrecta. No es nula; se colaciona para igualar."}], "correcta": 0, "referencias": ["CC"]}, {"id": "EX-365", "area": 5, "subarea": "Mercantil", "tema": "Aval cambiario", "resultado": "Distingue aval de fianza cambiaria.", "demanda": "Evaluar", "enunciado": "Una persona firma como aval en una letra de cambio, sin indicar por quién avala. ¿Por quién se entiende que avala?", "opciones": [{"texto": "Por el girador, porque a falta de indicación se presume que avala a este.", "justificacion": "Correcta. A falta de indicación, el aval se entiende otorgado por el girador. Base legal: normas sobre el aval de la letra de cambio del Código de Comercio de 2019."}, {"texto": "Por el beneficiario, porque el aval siempre garantiza al beneficiario.", "justificacion": "Incorrecta. A falta de indicación, se entiende por el girador, no por el beneficiario."}, {"texto": "Por nadie, porque sin indicación el aval es nulo.", "justificacion": "Incorrecta. Sin indicación no es nulo; se presume por el girador."}, {"texto": "Por el endosante, porque el aval garantiza a quien endosó el título.", "justificacion": "Incorrecta. La presunción legal es por el girador."}], "correcta": 0, "referencias": ["CCOM"]}, {"id": "EX-366", "area": 5, "subarea": "Mercantil", "tema": "Protesto", "resultado": "Aplica el protesto en letra de cambio.", "demanda": "Analizar", "enunciado": "Una letra de cambio no es pagada a su vencimiento y el tenedor no levanta protesto en el plazo legal. ¿Qué pierde el tenedor?", "opciones": [{"texto": "Las acciones de regreso contra endosantes y avalistas.", "justificacion": "Correcta. La falta de protesto hace perder las acciones de regreso. Base legal: normas sobre el protesto de la letra de cambio del Código de Comercio de 2019."}, {"texto": "Nada, porque el protesto es facultativo y no afecta las acciones cambiarias.", "justificacion": "Incorrecta. La falta de protesto hace perder acciones de regreso contra endosantes y avalistas."}, {"texto": "La acción directa, porque sin protesto se pierde toda acción cambiaria.", "justificacion": "Incorrecta. La acción directa contra el aceptante se conserva."}, {"texto": "El título, porque sin protesto la letra se anula.", "justificacion": "Incorrecta. La letra no se anula; se pierden acciones de regreso."}], "correcta": 0, "referencias": ["CCOM"]}, {"id": "EX-367", "area": 5, "subarea": "Mercantil", "tema": "Endoso en procuración", "resultado": "Distingue endoso en propiedad de endoso en procuración.", "demanda": "Analizar", "enunciado": "Una letra es endosada en procuración para que el endosatario la cobre. El endosatario quiere transferirla en propiedad a un tercero. ¿Puede hacerlo?", "opciones": [{"texto": "No: el endoso en procuración solo faculta para cobrar.", "justificacion": "Correcta. El endoso en procuración solo faculta para cobrar, no transmite propiedad. Base legal: normas sobre el endoso de la letra de cambio del Código de Comercio de 2019."}, {"texto": "Sí, porque todo endoso transmite la propiedad del título al endosatario.", "justificacion": "Incorrecta. El endoso en procuración no transmite propiedad; solo faculta para cobrar."}, {"texto": "Sí, porque el endosatario en procuración adquiere el dominio de la letra.", "justificacion": "Incorrecta. No es dueño; es mandatario para cobrar."}, {"texto": "No, porque el endoso en procuración es nulo y no produce efecto alguno.", "justificacion": "Incorrecta. Es válido, pero solo para cobrar."}], "correcta": 0, "referencias": ["CCOM"]}, {"id": "EX-368", "area": 5, "subarea": "Mercantil", "tema": "Cheque cruzado", "resultado": "Aplica el cheque cruzado y su pago.", "demanda": "Analizar", "enunciado": "Un cheque cruzado generalmente es presentado por el beneficiario para cobrar en efectivo en ventanilla. El banco se niega a pagar en efectivo. ¿Es correcta la negativa?", "opciones": [{"texto": "Sí, porque el cheque cruzado se paga por medio de un banco.", "justificacion": "Correcta. El cheque cruzado debe cobrarse por medio de banco."}, {"texto": "No, porque el cheque cruzado debe pagarse en efectivo al beneficiario.", "justificacion": "Incorrecta. El cheque cruzado debe pagarse a través de banco, no en efectivo en ventanilla."}, {"texto": "No, porque el cruzamiento es solo decorativo y no afecta el pago.", "justificacion": "Incorrecta. El cruzamiento sí afecta la forma de pago."}, {"texto": "Sí, porque el banco nunca paga cheques cruzados.", "justificacion": "Incorrecta. Sí los paga, pero por medio de banco, no en efectivo."}], "correcta": 0, "referencias": ["LCH"]}, {"id": "EX-369", "area": 5, "subarea": "Mercantil", "tema": "Levantamiento del velo societario", "resultado": "Aplica el levantamiento del velo societario.", "demanda": "Evaluar", "enunciado": "Una compañía es usada por su único socio para defraudar a acreedores, confundiendo patrimonios y sin contabilidad. Los acreedores piden que el socio responda personalmente. ¿Procede?", "opciones": [{"texto": "Sí: ante fraude y confusión patrimonial se levanta el velo.", "justificacion": "Correcta. El levantamiento del velo procede ante fraude, abuso y confusión patrimonial. Base legal: art. 17 de la Ley de Compañías."}, {"texto": "No, porque la compañía siempre separa patrimonios y el socio nunca responde.", "justificacion": "Incorrecta. Ante fraude y confusión patrimonial, procede levantar el velo."}, {"texto": "No, porque el levantamiento del velo solo procede en materia penal.", "justificacion": "Incorrecta. Procede también en materia civil y mercantil ante fraude."}, {"texto": "Sí, porque toda compañía unipersonal implica levantamiento automático del velo.", "justificacion": "Incorrecta. No es automático; exige fraude o confusión patrimonial."}], "correcta": 0, "referencias": ["LC"]}, {"id": "EX-370", "area": 5, "subarea": "Mercantil", "tema": "Aumento de capital y derecho preferente", "resultado": "Aplica el derecho preferente en aumento de capital.", "demanda": "Analizar", "enunciado": "En una compañía anónima, se acuerda aumento de capital sin ofrecer derecho preferente a los accionistas existentes, quienes se oponen. ¿Qué derecho se vulnera?", "opciones": [{"texto": "Derecho de preferencia.", "justificacion": "Correcta. Los accionistas tienen derecho preferente para suscribir los aumentos de capital en proporción a sus acciones (Ley de Compañías). Base legal: normas sobre el derecho preferente de suscripción de la Ley de Compañías."}, {"texto": "Derecho de voto.", "justificacion": "Incorrecta. El problema no es el voto sino la preferencia en la suscripción."}, {"texto": "Derecho de receso.", "justificacion": "Incorrecta. El derecho de receso permite separarse de la compañía en ciertos acuerdos; no es lo vulnerado aquí."}, {"texto": "Derecho a dividendos.", "justificacion": "Incorrecta. No se afectan los dividendos, sino la preferencia para suscribir."}], "correcta": 0, "referencias": ["LC"]}, {"id": "EX-371", "area": 5, "subarea": "Internacional Privado", "tema": "Reenvío y orden público", "resultado": "Aplica el reenvío y el orden público internacional.", "demanda": "Evaluar", "enunciado": "Un juez ecuatoriano debe aplicar ley extranjera, pero la norma de conflicto extranjera remite a la ley ecuatoriana. El juez duda si aceptar el reenvío. ¿Qué debe considerar?", "opciones": [{"texto": "Si procede el reenvío y si la ley extranjera afecta el orden público.", "justificacion": "Correcta. Debe analizar el reenvío y el límite del orden público internacional."}, {"texto": "Aceptar siempre el reenvío, porque toda remisión extranjera obliga al juez ecuatoriano.", "justificacion": "Incorrecta. El reenvío no siempre se acepta; depende de la norma y del orden público."}, {"texto": "Rechazar siempre el reenvío, porque el juez solo aplica ley ecuatoriana.", "justificacion": "Incorrecta. El juez puede aplicar ley extranjera según norma de conflicto."}, {"texto": "Aplicar la ley que elija el demandado, porque el reenvío lo decide el demandado.", "justificacion": "Incorrecta. El reenvío lo valora el juez, no el demandado."}], "correcta": 0, "referencias": ["BUST", "CC"]}, {"id": "EX-372", "area": 5, "subarea": "Internacional Privado", "tema": "Fraude a la ley", "resultado": "Identifica el fraude a la ley en DIP.", "demanda": "Analizar", "enunciado": "Dos ecuatorianos viajan a otro país solo para casarse con requisitos más laxos y evadir impedimentos ecuatorianos, y regresan inmediatamente. ¿Qué figura se configura?", "opciones": [{"texto": "Fraude a la ley, por eludir la ley ecuatoriana con un artificio.", "justificacion": "Correcta. El fraude a la ley es eludir la ley aplicable mediante artificio para evadirla."}, {"texto": "Conflicto de leyes, porque solo hay conflicto entre dos leyes aplicables.", "justificacion": "Incorrecta. No es solo conflicto; hay artificio para evadir la ley."}, {"texto": "Reenvío, porque la ley extranjera remite a la ley ecuatoriana.", "justificacion": "Incorrecta. No hay remisión; hay artificio para evadir."}, {"texto": "Orden público, porque la ley extranjera vulnera el orden público ecuatoriano.", "justificacion": "Incorrecta. El problema es el fraude, no solo el orden público."}], "correcta": 0, "referencias": ["BUST", "CC"]}, {"id": "EX-373", "area": 5, "subarea": "Internacional Privado", "tema": "Exequátur y orden público", "resultado": "Evalúa el exequátur frente al orden público.", "demanda": "Evaluar", "enunciado": "Una sentencia extranjera de divorcio se basa en una causal que vulnera la igualdad de género y el orden público ecuatoriano. Se pide exequátur. ¿Qué debe hacer el juez?", "opciones": [{"texto": "Negarlo, porque la sentencia vulnera el orden público ecuatoriano y no puede homologarse.", "justificacion": "Correcta. El exequátur se niega si la sentencia vulnera el orden público. Base legal: arts. 102 a 104 del Código Orgánico General de Procesos."}, {"texto": "Concederlo, porque toda sentencia extranjera debe homologarse sin control.", "justificacion": "Incorrecta. El exequátur exige control de orden público."}, {"texto": "Negarlo, porque toda sentencia de divorcio extranjera es incompatible con el orden público.", "justificacion": "Incorrecta. No toda sentencia extranjera vulnera el orden público; depende del caso."}, {"texto": "Concederlo, porque el orden público no aplica a sentencias extranjeras.", "justificacion": "Incorrecta. El orden público sí es límite al exequátur."}], "correcta": 0, "referencias": ["COGEP"]}, {"id": "EX-374", "area": 5, "subarea": "Internacional Privado", "tema": "Arbitraje internacional y laudo extranjero", "resultado": "Aplica el reconocimiento de laudo extranjero.", "demanda": "Analizar", "enunciado": "Un laudo arbitral dictado en el extranjero se quiere ejecutar en Ecuador, pero el demandado alega que no fue notificado del arbitraje. ¿Qué debe verificar el juez?", "opciones": [{"texto": "Si se respetó la notificación y el derecho de defensa.", "justificacion": "Correcta. La falta de notificación es causal para negar reconocimiento del laudo extranjero. Base legal: art. V de la Convención sobre el Reconocimiento y la Ejecución de las Sentencias Arbitrales Extranjeras (Nueva York, 1958)."}, {"texto": "Nada, porque los laudos extranjeros se ejecutan automáticamente sin control.", "justificacion": "Incorrecta. El reconocimiento exige verificar debido proceso y notificación."}, {"texto": "Solo el fondo, porque el juez debe revisar si el laudo es justo.", "justificacion": "Incorrecta. No se revisa el fondo; se controla debido proceso y orden público."}, {"texto": "Nada, porque el arbitraje internacional no requiere notificación.", "justificacion": "Incorrecta. El arbitraje sí exige notificación y debido proceso."}], "correcta": 0, "referencias": ["CRE"]}, {"id": "EX-375", "area": 5, "subarea": "Mercantil", "tema": "Competencia desleal", "resultado": "Identifica el acto de confusión en competencia desleal.", "demanda": "Analizar", "enunciado": "Una empresa usa un empaque casi idéntico al de su competidor, con marca similar, para que los consumidores confundan los productos. ¿Qué acto se configura?", "opciones": [{"texto": "Acto de confusión, porque induce a confundir productos y empresa de competidor.", "justificacion": "Correcta. El acto de confusión induce a error sobre origen empresarial de productos. Base legal: art. 27 de la Ley Orgánica de Regulación y Control del Poder de Mercado."}, {"texto": "Acto de imitación, porque toda imitación de empaque es competencia desleal.", "justificacion": "Incorrecta. La imitación no siempre es desleal; la confusión sí lo es por inducir a error."}, {"texto": "Publicidad engañosa, porque solo hay publicidad que engaña al consumidor.", "justificacion": "Incorrecta. Hay confusión sobre origen, no solo publicidad engañosa."}, {"texto": "Ninguno, porque el empaque no está protegido por marca registrada.", "justificacion": "Incorrecta. La confusión puede existir aunque no haya marca registrada."}], "correcta": 0, "referencias": ["CRE"]}, {"id": "EX-376", "area": 5, "subarea": "Mercantil", "tema": "Franquicia y distribución", "resultado": "Distingue franquicia de distribución.", "demanda": "Analizar", "enunciado": "Una empresa otorga a otra el derecho a usar su marca, know-how y sistema, con control y regalías, para operar un negocio idéntico. ¿Qué contrato es?", "opciones": [{"texto": "Franquicia, porque hay cesión de marca, know-how y sistema con control.", "justificacion": "Correcta. La franquicia implica uso de marca, know-how y sistema bajo control del franquiciante."}, {"texto": "Distribución, porque la empresa distribuye productos a otra para que los venda.", "justificacion": "Incorrecta. La distribución es venta de productos; aquí hay uso de marca y sistema."}, {"texto": "Licencia de marca, porque solo se cede la marca sin sistema.", "justificacion": "Incorrecta. Aquí hay marca, know-how y sistema, no solo marca."}, {"texto": "Mandato, porque la empresa actúa por mandato de la otra.", "justificacion": "Incorrecta. No hay mandato; hay franquicia."}], "correcta": 0, "referencias": ["CCOM"]}, {"id": "EX-377", "area": 5, "subarea": "Mercantil", "tema": "Prelación de créditos en concurso", "resultado": "Aplica la prelación de créditos en concurso.", "demanda": "Evaluar", "enunciado": "En concurso, concurren crédito laboral, crédito hipotecario y crédito quirografario. ¿Cuál es el orden de prelación?", "opciones": [{"texto": "Laboral, luego hipotecario y luego quirografario.", "justificacion": "Correcta. Las deudas con los trabajadores constituyen crédito privilegiado de primera clase, con preferencia aun a los hipotecarios (art. 328 de la Constitución; art. 2374 del Código Civil); los quirografarios no tienen preferencia."}, {"texto": "Quirografario, luego hipotecario y luego laboral.", "justificacion": "Incorrecta. Los quirografarios se pagan al final."}, {"texto": "Hipotecario, luego laboral y luego quirografario.", "justificacion": "Incorrecta. El crédito laboral prefiere incluso al hipotecario (art. 328 de la Constitución)."}, {"texto": "Todos a prorrata, sin ningún orden de preferencia.", "justificacion": "Incorrecta. En el concurso rige la prelación legal de créditos."}], "correcta": 0, "referencias": ["CRE", "CC"]}, {"id": "EX-379", "area": 5, "subarea": "Tributario", "tema": "Elusión y evasión", "resultado": "Distingue elusión de evasión tributaria.", "demanda": "Evaluar", "enunciado": "Una empresa crea estructuras artificiales sin sustancia económica, solo para pagar menos impuesto, sin simular operaciones. ¿Qué figura se configura?", "opciones": [{"texto": "Elusión, por usar formas artificiosas sin sustancia económica.", "justificacion": "Correcta. La elusión usa artificios sin sustancia para eludir, sin engaño directo. Base legal: art. 17 del Código Orgánico Tributario."}, {"texto": "Evasión, porque toda reducción del impuesto a pagar lo es.", "justificacion": "Incorrecta. La evasión exige engaño o simulación; aquí hay artificio sin sustancia, que es elusión."}, {"texto": "Planificación fiscal legítima, porque es lícito buscar pagar menos impuesto.", "justificacion": "Incorrecta. La planificación sin sustancia económica es elusión, no legítima."}, {"texto": "Defraudación tributaria, porque la elusión equivale siempre a ese delito.", "justificacion": "Incorrecta. La elusión no es automáticamente defraudación; requiere engaño."}], "correcta": 0, "referencias": ["CTRIB"]}, {"id": "EX-380", "area": 5, "subarea": "Tributario", "tema": "Prescripción y caducidad tributaria", "resultado": "Distingue prescripción de caducidad en materia tributaria.", "demanda": "Analizar", "enunciado": "La administración no determina una obligación tributaria en el plazo legal y luego pretende cobrarla. El contribuyente alega caducidad. ¿Qué corresponde?", "opciones": [{"texto": "Caducidad de la facultad determinadora.", "justificacion": "Correcta. La caducidad extingue la facultad de determinar si no se ejerce en plazo. Base legal: art. 94 del Código Orgánico Tributario."}, {"texto": "Prescripción de la acción de cobro.", "justificacion": "Incorrecta. La pérdida de la facultad de determinar es caducidad, no prescripción."}, {"texto": "Prescripción, porque equivale a caducidad.", "justificacion": "Incorrecta. Son distintas: caducidad extingue facultad; prescripción extingue acción de cobro."}, {"texto": "Ninguna, porque no hay plazo para determinar.", "justificacion": "Incorrecta. La facultad de determinar tiene plazo y caduca."}], "correcta": 0, "referencias": ["CTRIB"]}, {"id": "EX-381", "area": 5, "subarea": "Tributario", "tema": "Determinación presuntiva", "resultado": "Aplica la determinación presuntiva.", "demanda": "Analizar", "enunciado": "Un contribuyente no lleva contabilidad ni presenta declaraciones, y la administración determina el impuesto con base en presunciones legales. ¿Es válida la determinación?", "opciones": [{"texto": "Sí, porque sin contabilidad ni declaraciones procede la vía presuntiva.", "justificacion": "Correcta. La determinación presuntiva se aplica cuando no hay elementos para determinación directa. Base legal: art. 92 del Código Orgánico Tributario."}, {"texto": "No, porque sin contabilidad no puede determinarse impuesto alguno.", "justificacion": "Incorrecta. La determinación presuntiva procede cuando no hay contabilidad o declaraciones."}, {"texto": "No, porque la determinación presuntiva es inconstitucional.", "justificacion": "Incorrecta. La determinación presuntiva es legal y tiene base en el Código Orgánico Tributario."}, {"texto": "Sí, pero solo si el contribuyente acepta la presunción.", "justificacion": "Incorrecta. No requiere aceptación; es facultad de la administración."}], "correcta": 0, "referencias": ["CTRIB"]}, {"id": "EX-382", "area": 5, "subarea": "Tributario", "tema": "Pago indebido y devolución", "resultado": "Aplica el pago indebido en materia tributaria.", "demanda": "Aplicar", "enunciado": "Un contribuyente paga un impuesto que no debía por error de cálculo de la administración, y pide devolución. La administración alega que el pago es definitivo. ¿Qué corresponde?", "opciones": [{"texto": "Devolver lo pagado, porque el pago indebido genera derecho a devolución.", "justificacion": "Correcta. El pago indebido da derecho a devolución. Base legal: arts. 122 y 123 del Código Orgánico Tributario."}, {"texto": "Negarla, porque todo pago tributario es definitivo e irrevocable.", "justificacion": "Incorrecta. El pago indebido genera derecho a devolución."}, {"texto": "Negarla, porque el contribuyente debió impugnar antes de pagar.", "justificacion": "Incorrecta. El pago no impide reclamar la devolución por pago indebido."}, {"texto": "Devolver únicamente si existe una sentencia judicial que lo ordene.", "justificacion": "Incorrecta. La devolución puede proceder administrativamente sin sentencia."}], "correcta": 0, "referencias": ["CTRIB"]}, {"id": "EX-383", "area": 5, "subarea": "Laboral", "tema": "Estabilidad reforzada y embarazo", "resultado": "Aplica la estabilidad reforzada de embarazada y visto bueno.", "demanda": "Evaluar", "enunciado": "Una trabajadora embarazada es despedida sin visto bueno, alegando indisciplina. El empleador alega que la indisciplina es justa causa. ¿Qué debe resolver el juez?", "opciones": [{"texto": "Declarar ineficaz el despido, con reintegro e indemnización.", "justificacion": "Correcta. Sin visto bueno no hay terminación justificada; el despido de una trabajadora embarazada es ineficaz, con derecho al reintegro y a la indemnización adicional prevista en la ley (art. 43 de la Constitución; art. 195.1 del Código del Trabajo). Base legal: art. 43 de la Constitución; arts. 172 y 195.1 del Código del Trabajo."}, {"texto": "Aceptar la justa causa, porque la indisciplina permite despedir sin visto bueno.", "justificacion": "Incorrecta. La indisciplina debe calificarse mediante visto bueno ante el inspector del trabajo (art. 172)."}, {"texto": "Declarar justificado el despido, porque la embarazada carece de estabilidad.", "justificacion": "Incorrecta. La trabajadora embarazada tiene protección reforzada."}, {"texto": "Negar la indemnización, porque la trabajadora ya no presta servicios.", "justificacion": "Incorrecta. La ineficacia del despido mantiene sus derechos."}], "correcta": 0, "referencias": ["CRE", "CT"]}, {"id": "EX-384", "area": 5, "subarea": "Laboral", "tema": "Dirigente sindical y visto bueno", "resultado": "Aplica la protección del dirigente sindical.", "demanda": "Evaluar", "enunciado": "Un dirigente sindical es despedido sin visto bueno, alegando que el sindicato no estaba registrado. Se prueba que sí estaba registrado y que el despido fue por su actividad sindical. ¿Qué corresponde?", "opciones": [{"texto": "Despido ineficaz, porque el dirigente está protegido en sus funciones.", "justificacion": "Correcta. La ineficacia del despido se aplica también a los dirigentes sindicales en cumplimiento de sus funciones (art. 195.1 del Código del Trabajo), además de las garantías del art. 187 del mismo código y de la libertad sindical (art. 326 num. 7 de la Constitución). Base legal: arts. 187 y 195.1 del Código del Trabajo; art. 326 num. 7 de la Constitución."}, {"texto": "Despido justificado, porque el dirigente no tiene protección especial.", "justificacion": "Incorrecta. Los dirigentes tienen garantías especiales (art. 187)."}, {"texto": "Ninguno, porque la garantía sindical protege solo al empleador.", "justificacion": "Incorrecta. La garantía protege al dirigente."}, {"texto": "Despido justificado, porque la actividad sindical no está protegida.", "justificacion": "Incorrecta. La actividad sindical está protegida por la Constitución."}], "correcta": 0, "referencias": ["CT", "CRE"]}, {"id": "EX-385", "area": 5, "subarea": "Laboral", "tema": "Horas suplementarias y extraordinarias", "resultado": "Distingue horas suplementarias de extraordinarias.", "demanda": "Analizar", "enunciado": "Un trabajador labora 2 horas más de lunes a viernes y 4 horas el sábado, con autorización. ¿Cómo se califican las horas del sábado?", "opciones": [{"texto": "Extraordinarias, porque son en día de descanso y tienen recargo mayor.", "justificacion": "Correcta. Las horas en días de descanso son extraordinarias, con recargo mayor. Base legal: art. 55 del Código del Trabajo."}, {"texto": "Suplementarias, porque todas las horas adicionales son suplementarias.", "justificacion": "Incorrecta. Las horas del sábado son extraordinarias por ser en día de descanso."}, {"texto": "Ordinarias, porque el trabajador aceptó laborar el sábado.", "justificacion": "Incorrecta. La aceptación no las convierte en ordinarias."}, {"texto": "Ninguna, porque las horas del sábado no se pagan.", "justificacion": "Incorrecta. Las horas del sábado sí se pagan como extraordinarias."}], "correcta": 0, "referencias": ["CT"]}, {"id": "EX-386", "area": 5, "subarea": "Laboral", "tema": "Tercerización e intermediación", "resultado": "Distingue tercerización prohibida de intermediación.", "demanda": "Evaluar", "enunciado": "Una empresa contrata a otra para que le provea trabajadores que realizan su actividad principal, bajo su dirección, sin autonomía. ¿Qué se configura?", "opciones": [{"texto": "Intermediación prohibida.", "justificacion": "Correcta. La intermediación para actividad principal bajo dirección está prohibida. Base legal: Mandato Constituyente 8; art. 327 de la Constitución."}, {"texto": "Tercerización válida.", "justificacion": "Incorrecta. La tercerización de actividad principal bajo dirección es prohibida."}, {"texto": "Ninguna figura irregular.", "justificacion": "Incorrecta. La intermediación para actividad principal está prohibida."}, {"texto": "Contrato civil válido.", "justificacion": "Incorrecta. Si no hay autonomía y hay dirección, es intermediación prohibida."}], "correcta": 0, "referencias": ["CRE"]}]}, {"id": "pack-007", "bibliografia": {"CADH": "Organización de los Estados Americanos. (1969). Convención Americana sobre Derechos Humanos. https://www.oas.org/dil/esp/tratados_b-32_convencion_americana_sobre_derechos_humanos.htm", "CC": "Congreso Nacional del Ecuador. (2005). Código Civil (Codificación 2005-010). Registro Oficial Suplemento 46, 24 de junio de 2005. Texto vigente con sus reformas, entre ellas la Ley Reformatoria de 2015 (R.O. 526-2S, 19 de junio de 2015); última actualización: Segundo Suplemento del R.O. 61, 17 de junio de 2025. https://www.gob.ec/regulaciones/codigo-civil-codificacion-no-2005-010", "CCOM": "Asamblea Nacional del Ecuador. (2019). Código de Comercio. Registro Oficial Suplemento 497, 29 de mayo de 2019. Última reforma: Tercer Suplemento del R.O. 245, 7 de febrero de 2023. https://www.supercias.gob.ec/bd_supercias/descargas/lotaip/a2/2019/JUNIO/C%C3%B3digo_de_Comercio.pdf", "COA": "Asamblea Nacional del Ecuador. (2017). Código Orgánico Administrativo. Registro Oficial Segundo Suplemento 31, 7 de julio de 2017. Última reforma: 13 de octubre de 2025. https://lotaip.bomberosquito.gob.ec/transparencia/2026/archivos/coa26.pdf", "COGEP": "Asamblea Nacional del Ecuador. (2015). Código Orgánico General de Procesos. Registro Oficial Suplemento 506, 22 de mayo de 2015. Reformado, entre otras, por la Ley Orgánica Reformatoria del COGEP (R.O. Suplemento 517, 26 de junio de 2019); última reforma consultada: Cuarto Suplemento del R.O. 140, 7 de octubre de 2025. https://portal.compraspublicas.gob.ec/sercop/wp-content/uploads/2025/11/CODIGO-ORGANICO-GENERAL-DE-PROCESOS-COGEP.pdf", "COIP": "Asamblea Nacional del Ecuador. (2014). Código Orgánico Integral Penal. Registro Oficial Suplemento 180, 10 de febrero de 2014. Texto actualizado al 13 de octubre de 2025 (última reforma incorporada: Tercer Suplemento del R.O. 68, 26 de junio de 2025). https://legalcloud.ec/wp-content/uploads/2025/10/COIP-13102025-Digital.pdf", "CONA": "Congreso Nacional del Ecuador. (2003). Código de la Niñez y Adolescencia (Ley 100). Registro Oficial 737, 3 de enero de 2003. Última reforma: Ley Orgánica Reformatoria de Varios Cuerpos Legales para la Agilización de la Adopción, R.O. 347, 14 de agosto de 2026. https://www.registroficial.gob.ec/", "CRE": "Asamblea Constituyente del Ecuador. (2008). Constitución de la República del Ecuador. Registro Oficial 449, 20 de octubre de 2008 (con las enmiendas posteriores, incluidas las aprobadas en el referéndum de 2024). https://www.asambleanacional.gob.ec/", "CT": "Congreso Nacional del Ecuador. (2005). Código del Trabajo (Codificación 2005-017). Registro Oficial Suplemento 167, 16 de diciembre de 2005. Texto vigente con sus reformas; última reforma: 9 de abril de 2026. https://portal.compraspublicas.gob.ec/sercop/wp-content/uploads/2026/08/CODIGO-DEL-TRABAJO.pdf", "CTRIB": "Congreso Nacional del Ecuador. (2005). Código Orgánico Tributario (antes Código Tributario, Codificación 2005-09). Registro Oficial Suplemento 38, 14 de junio de 2005; reformado y renombrado por la Ley Orgánica Reformatoria al Código Tributario, Noveno Suplemento del R.O. 392, 19 de octubre de 2026. https://www.gob.ec/regulaciones/codigo-organico-tributario", "LAM": "Congreso Nacional del Ecuador. (2006). Ley de Arbitraje y Mediación (Codificación 2006-014). Registro Oficial 417, 14 de diciembre de 2006, con sus reformas. https://oas.org/es/sla/ddi/docs/Ecuador%20-%20Ley%20de%20Arbitraje%20y%20Mediaci%C3%B3n.pdf", "LC": "Congreso Nacional del Ecuador. (1999). Ley de Compañías (Codificación 1999-031). Registro Oficial 312, 5 de noviembre de 1999. Reformada por la Ley Reformatoria a la Ley de Compañías para la Optimización e Impulso Empresarial y para el Fomento del Gobierno Corporativo (R.O. Suplemento 269, 15 de marzo de 2023); última reforma: 3 de octubre de 2025. https://www.eeasa.com.ec/content/uploads/2025/12/LEY-DE-COMPANIAS.pdf", "LOGJCC": "Asamblea Nacional del Ecuador. (2009). Ley Orgánica de Garantías Jurisdiccionales y Control Constitucional. Registro Oficial Segundo Suplemento 52, 22 de octubre de 2009. Última reforma: R.O. Suplemento 245, 7 de febrero de 2023. https://lotaip.bomberosquito.gob.ec/transparencia/2026/archivos/logjcc26.pdf", "LOSNCP": "Asamblea Nacional del Ecuador. (2008). Ley Orgánica del Sistema Nacional de Contratación Pública. Registro Oficial Suplemento 395, 4 de agosto de 2008. Reformada integralmente; última reforma: Cuarto Suplemento del R.O. 140, 7 de octubre de 2025. https://usgn.espe.edu.ec/wp-content/uploads/2026/01/1.-Ley-Organica-del-Sistema-Nacional-de-Contratacion-Publica.pdf"}, "preguntas": [{"id": "RZ-CON-01", "area": 1, "dificultad": 4, "subarea": "Derecho Constitucional", "tema": "Acción de protección contra decisiones judiciales", "resultado": "Resuelve un caso de acción de protección contra decisiones judiciales razonando desde la norma aplicable.", "demanda": "Evaluar", "enunciado": "Una persona pierde un juicio civil en todas las instancias y, convencida de que el juez vulneró su derecho a la defensa, presenta una acción de protección contra la sentencia ejecutoriada. ¿Cuál es el razonamiento correcto del juez constitucional?", "opciones": [{"texto": "Es improcedente; contra sentencias firmes cabe la acción extraordinaria.", "justificacion": "Correcta. La acción de protección no procede contra providencias judiciales (art. 42 num. 6 de la Ley Orgánica de Garantías Jurisdiccionales y Control Constitucional); la vulneración de derechos en sentencias firmes se reclama ante la Corte Constitucional mediante acción extraordinaria de protección (art. 94 de la Constitución)."}, {"texto": "Es procedente, porque la defensa es un derecho constitucional directamente tutelable.", "justificacion": "Incorrecta. Que el derecho sea tutelable no habilita esta garantía contra decisiones judiciales (art. 42 num. 6 de la Ley Orgánica de Garantías Jurisdiccionales y Control Constitucional)."}, {"texto": "Es procedente si se presenta dentro de los veinte días posteriores a la ejecutoria.", "justificacion": "Incorrecta. El término de veinte días es de la acción extraordinaria de protección (art. 60 de la misma ley), no de la acción de protección."}, {"texto": "Debe reconducirla de oficio a un recurso de revisión ante la Corte Nacional.", "justificacion": "Incorrecta. No existe esa reconducción; la vía constitucional adecuada es la acción extraordinaria de protección."}], "correcta": 0, "referencias": ["CRE", "LOGJCC"]}, {"id": "RZ-CON-02", "area": 1, "dificultad": 5, "subarea": "Derecho Constitucional", "tema": "Acción extraordinaria de protección y agotamiento de recursos", "resultado": "Resuelve un caso de acción extraordinaria de protección y agotamiento de recursos razonando desde la norma aplicable.", "demanda": "Evaluar", "enunciado": "El abogado de una parte olvidó apelar una sentencia de primera instancia que, a su juicio, vulneró el debido proceso. Ya ejecutoriada, presenta acción extraordinaria de protección. ¿Qué argumento decide la admisibilidad?", "opciones": [{"texto": "No se agotaron los recursos y la omisión es atribuible a la negligencia de la parte.", "justificacion": "Correcta. La acción extraordinaria de protección exige agotar los recursos ordinarios y extraordinarios, salvo que su falta de interposición no sea atribuible a la negligencia del titular del derecho (art. 94 de la Constitución; art. 61 num. 3 de la Ley Orgánica de Garantías Jurisdiccionales y Control Constitucional)."}, {"texto": "La gravedad de la vulneración al debido proceso dispensa de agotar los recursos ordinarios.", "justificacion": "Incorrecta. La gravedad no reemplaza el requisito de agotamiento previsto en el art. 94 de la Constitución."}, {"texto": "Basta con que la sentencia esté ejecutoriada, porque es una decisión judicial definitiva.", "justificacion": "Incorrecta. La ejecutoria es necesaria, pero también se exige agotar los recursos disponibles."}, {"texto": "Procede, porque el error del abogado no puede perjudicar los derechos de su cliente.", "justificacion": "Incorrecta. La Constitución excluye expresamente la falta de recursos atribuible a negligencia de la parte, y la negligencia del patrocinador se imputa a ella."}], "correcta": 0, "referencias": ["CRE", "LOGJCC"]}, {"id": "RZ-CON-03", "area": 1, "dificultad": 3, "subarea": "Derecho Constitucional", "tema": "Hábeas data frente a particulares", "resultado": "Resuelve un caso de hábeas data frente a particulares razonando desde la norma aplicable.", "demanda": "Analizar", "enunciado": "Una cooperativa privada mantiene en su base de datos una deuda ya pagada de un socio y se niega a corregirla. El socio quiere obligarla a rectificar el registro. ¿Qué razonamiento es correcto?", "opciones": [{"texto": "Procede hábeas data, porque protege datos personales en archivos públicos o privados.", "justificacion": "Correcta. El hábeas data permite conocer, actualizar, rectificar, eliminar o anular datos personales que consten en entidades públicas o privadas (art. 92 de la Constitución)."}, {"texto": "No procede hábeas data, porque esta garantía se limita a registros de entidades públicas.", "justificacion": "Incorrecta. El art. 92 de la Constitución incluye expresamente a las entidades privadas."}, {"texto": "Procede la acción de acceso a la información pública, por tratarse de un dato financiero.", "justificacion": "Incorrecta. Esa acción tutela información pública; aquí se trata de datos personales del accionante (art. 91 de la Constitución)."}, {"texto": "Debe demandar en juicio ordinario, porque la relación con la cooperativa es contractual.", "justificacion": "Incorrecta. La existencia de un contrato no excluye la garantía específica sobre datos personales del art. 92 de la Constitución."}], "correcta": 0, "referencias": ["CRE", "LOGJCC"]}, {"id": "RZ-CON-04", "area": 1, "dificultad": 3, "subarea": "Derecho Constitucional", "tema": "Acceso a la información pública", "resultado": "Resuelve un caso de acceso a la información pública razonando desde la norma aplicable.", "demanda": "Aplicar", "enunciado": "Un periodista pide a un municipio copias de los contratos de obra pública del último año. El municipio no responde y luego le niega la entrega sin invocar ninguna reserva legal. ¿Qué garantía corresponde?", "opciones": [{"texto": "Acción de acceso a la información pública, porque se negó información pública sin reserva.", "justificacion": "Correcta. La acción de acceso a la información pública procede cuando la información ha sido denegada expresa o tácitamente, y solo la reserva declarada conforme a la ley puede justificar la negativa (art. 91 de la Constitución)."}, {"texto": "Hábeas data, porque el periodista quiere conocer información que consta en registros.", "justificacion": "Incorrecta. El hábeas data protege datos personales del titular; los contratos municipales no lo son (art. 92 de la Constitución)."}, {"texto": "Acción por incumplimiento, porque el municipio no cumple la Ley de Transparencia.", "justificacion": "Incorrecta. La acción por incumplimiento persigue la aplicación de normas o informes; para la negativa de información existe una garantía específica (art. 91)."}, {"texto": "Acción de protección, que es la única garantía apta frente a omisiones municipales.", "justificacion": "Incorrecta. Existe una garantía específica y más adecuada para este supuesto (art. 91 de la Constitución)."}], "correcta": 0, "referencias": ["CRE", "LOGJCC"]}, {"id": "RZ-CON-05", "area": 1, "dificultad": 4, "subarea": "Derecho Constitucional", "tema": "Acción por incumplimiento y reclamo previo", "resultado": "Resuelve un caso de acción por incumplimiento y reclamo previo razonando desde la norma aplicable.", "demanda": "Evaluar", "enunciado": "Un colectivo presenta directamente ante la Corte Constitucional una acción por incumplimiento de una ley que obliga a un ministerio a crear un registro. Nunca reclamó antes al ministerio. ¿Cuál es el defecto?", "opciones": [{"texto": "Faltó el reclamo previo de cumplimiento dirigido al ministerio obligado.", "justificacion": "Correcta. La acción por incumplimiento exige haber reclamado previamente el cumplimiento a la autoridad y que esta haya mantenido el incumplimiento o no haya contestado en el término legal (art. 93 de la Constitución; art. 54 de la Ley Orgánica de Garantías Jurisdiccionales y Control Constitucional)."}, {"texto": "Debió presentarse ante un juez de primera instancia y no ante la Corte Constitucional.", "justificacion": "Incorrecta. La acción por incumplimiento se presenta ante la Corte Constitucional (art. 93 de la Constitución)."}, {"texto": "La acción procede contra sentencias internacionales, no contra leyes internas.", "justificacion": "Incorrecta. Procede para garantizar la aplicación de normas del sistema jurídico y de sentencias o informes internacionales (art. 93)."}, {"texto": "Un colectivo carece de legitimación para presentar garantías constitucionales.", "justificacion": "Incorrecta. Las garantías pueden proponerse por cualquier persona, grupo de personas o colectivo (art. 86 num. 1 de la Constitución)."}], "correcta": 0, "referencias": ["CRE", "LOGJCC"]}, {"id": "RZ-CON-06", "area": 1, "dificultad": 5, "subarea": "Derecho Constitucional", "tema": "Consulta de norma y silencio de la Corte", "resultado": "Resuelve un caso de consulta de norma y silencio de la corte razonando desde la norma aplicable.", "demanda": "Evaluar", "enunciado": "Un juez suspende un proceso y eleva consulta de constitucionalidad. Transcurren más de cuarenta y cinco días sin que la Corte Constitucional se pronuncie. ¿Qué consecuencia prevé la Constitución?", "opciones": [{"texto": "El perjudicado puede interponer la acción que corresponda ante la Corte.", "justificacion": "Correcta. Si transcurrido el plazo la Corte no se pronuncia, el perjudicado podrá interponer la acción correspondiente (art. 428 de la Constitución); la suspensión no es indefinida."}, {"texto": "El juez queda habilitado para declarar la inconstitucionalidad con efectos generales.", "justificacion": "Incorrecta. La declaratoria con efectos generales es competencia exclusiva de la Corte Constitucional (art. 436 de la Constitución)."}, {"texto": "La norma consultada se entiende derogada por el silencio de la Corte Constitucional.", "justificacion": "Incorrecta. El silencio no produce derogación ni expulsión de la norma."}, {"texto": "El proceso queda suspendido hasta que la Corte resuelva, sin importar el tiempo.", "justificacion": "Incorrecta. La Constitución fija un plazo y prevé una consecuencia para su vencimiento (art. 428)."}], "correcta": 0, "referencias": ["CRE"]}, {"id": "RZ-CON-07", "area": 1, "dificultad": 4, "subarea": "Derecho Constitucional", "tema": "Jerarquía normativa y principio de competencia", "resultado": "Resuelve un caso de jerarquía normativa y principio de competencia razonando desde la norma aplicable.", "demanda": "Analizar", "enunciado": "Una ordenanza municipal regula el uso del suelo urbano, competencia exclusiva del municipio, y contradice un decreto ejecutivo sobre la misma materia. ¿Qué norma debe aplicarse y por qué?", "opciones": [{"texto": "La ordenanza, porque la jerarquía considera la competencia exclusiva del gobierno autónomo.", "justificacion": "Correcta. La jerarquía normativa considera el principio de competencia, en especial la titularidad de las competencias exclusivas de los gobiernos autónomos descentralizados (art. 425 de la Constitución); el uso y ocupación del suelo es competencia exclusiva municipal (art. 264 num. 2)."}, {"texto": "El decreto, porque en la pirámide normativa los decretos se ubican sobre las ordenanzas.", "justificacion": "Incorrecta. El orden jerárquico del art. 425 se aplica considerando el principio de competencia, que aquí favorece a la ordenanza."}, {"texto": "El decreto, porque las normas nacionales prevalecen sobre las locales en caso de conflicto.", "justificacion": "Incorrecta. No hay prevalencia automática de lo nacional cuando la materia es de competencia exclusiva local."}, {"texto": "Ninguna, porque el conflicto debe resolverlo la Asamblea Nacional mediante ley interpretativa.", "justificacion": "Incorrecta. Los jueces y autoridades resuelven antinomias aplicando el art. 425 de la Constitución."}], "correcta": 0, "referencias": ["CRE"]}, {"id": "RZ-CON-08", "area": 1, "dificultad": 3, "subarea": "Derechos Humanos", "tema": "Principio pro persona", "resultado": "Resuelve un caso de principio pro persona razonando desde la norma aplicable.", "demanda": "Aplicar", "enunciado": "Una norma sobre permisos de maternidad admite dos lecturas: una incluye a las madres adoptivas y otra las excluye. La entidad aplica la segunda por ser \"más literal\". ¿Cuál es el error de razonamiento?", "opciones": [{"texto": "Debió preferir la interpretación que más favorezca la vigencia de los derechos.", "justificacion": "Correcta. En materia de derechos, las servidoras y servidores deben aplicar la norma y la interpretación que más favorezcan su efectiva vigencia (art. 11 num. 5 de la Constitución)."}, {"texto": "Debió consultar a la Asamblea Nacional antes de interpretar una norma ambigua.", "justificacion": "Incorrecta. La autoridad administrativa está obligada a aplicar directamente el principio pro persona (art. 11 num. 3 y 5 de la Constitución)."}, {"texto": "Ninguno, porque ante normas claras la interpretación literal prevalece.", "justificacion": "Incorrecta. En derechos, el criterio decisivo es el más favorable a su vigencia, no el literal."}, {"texto": "Debió aplicar la lectura que menos impacte en el presupuesto de la entidad.", "justificacion": "Incorrecta. La disponibilidad presupuestaria no es criterio para restringir derechos (art. 11 num. 4 de la Constitución)."}], "correcta": 0, "referencias": ["CRE"]}, {"id": "RZ-CON-09", "area": 1, "dificultad": 4, "subarea": "Derecho Constitucional", "tema": "Igualdad material y acción afirmativa", "resultado": "Resuelve un caso de igualdad material y acción afirmativa razonando desde la norma aplicable.", "demanda": "Evaluar", "enunciado": "Una convocatoria pública reserva un porcentaje de plazas para personas con discapacidad. Un postulante sin discapacidad la impugna alegando discriminación. ¿Qué razonamiento es correcto?", "opciones": [{"texto": "La reserva es una acción afirmativa legítima que promueve la igualdad real.", "justificacion": "Correcta. El Estado adopta medidas de acción afirmativa que promuevan la igualdad real en favor de los titulares de derechos en situación de desigualdad (art. 11 num. 2 de la Constitución), y las personas con discapacidad son grupo de atención prioritaria (art. 35)."}, {"texto": "La reserva es discriminatoria, porque distingue a los postulantes por una condición personal.", "justificacion": "Incorrecta. El mismo art. 11 num. 2 admite medidas de acción afirmativa; no toda distinción es discriminatoria."}, {"texto": "La reserva solo sería válida si el postulante impugnante aceptara expresamente la medida.", "justificacion": "Incorrecta. La validez de la medida no depende del consentimiento de terceros."}, {"texto": "La reserva vulnera el principio de mérito que rige el ingreso al servicio público.", "justificacion": "Incorrecta. El mérito se armoniza con la igualdad material; las acciones afirmativas son constitucionalmente admitidas."}], "correcta": 0, "referencias": ["CRE"]}, {"id": "RZ-CON-10", "area": 1, "dificultad": 4, "subarea": "Derecho Constitucional", "tema": "Reparación integral en garantías", "resultado": "Resuelve un caso de reparación integral en garantías razonando desde la norma aplicable.", "demanda": "Analizar", "enunciado": "En una acción de protección, el juez declara la vulneración del derecho a la salud de un paciente, pero se limita a esa declaración sin ordenar ninguna medida adicional. ¿Qué omitió?", "opciones": [{"texto": "Ordenar la reparación integral, material e inmaterial, de la vulneración.", "justificacion": "Correcta. Cuando se constata la vulneración de derechos, el juez debe ordenar la reparación integral, material e inmaterial, y especificar las obligaciones a cumplir (art. 86 num. 3 de la Constitución; art. 18 de la Ley Orgánica de Garantías Jurisdiccionales y Control Constitucional)."}, {"texto": "Remitir el expediente a la Fiscalía para que investigue la negligencia médica.", "justificacion": "Incorrecta. La garantía jurisdiccional no se convierte en proceso penal."}, {"texto": "Elevar la sentencia en consulta obligatoria a la Corte Constitucional antes de ejecutarla.", "justificacion": "Incorrecta. Las sentencias ejecutoriadas se remiten a la Corte para su eventual selección, no en consulta previa a la ejecución (art. 86 num. 5)."}, {"texto": "Nada, porque la declaración de vulneración es suficiente reparación en sí misma.", "justificacion": "Incorrecta. La Constitución exige ordenar la reparación integral."}], "correcta": 0, "referencias": ["CRE", "LOGJCC"]}, {"id": "RZ-ADM-01", "area": 1, "dificultad": 4, "subarea": "Derecho Administrativo", "tema": "Recurso extraordinario de revisión", "resultado": "Resuelve un caso de recurso extraordinario de revisión razonando desde la norma aplicable.", "demanda": "Analizar", "enunciado": "Una licencia se otorgó con base en certificados que luego se declaran falsos por sentencia. El acto ya está firme en vía administrativa. ¿Qué vía tiene la administración o el interesado dentro del propio procedimiento administrativo?", "opciones": [{"texto": "El recurso extraordinario de revisión, por los documentos declarados falsos.", "justificacion": "Correcta. El recurso extraordinario de revisión procede contra actos firmes, entre otros supuestos, cuando en la resolución han influido documentos o testimonios declarados falsos (art. 232 del Código Orgánico Administrativo)."}, {"texto": "El recurso de apelación ante la máxima autoridad de la entidad que lo emitió.", "justificacion": "Incorrecta. La apelación procede contra actos no firmes dentro del término legal (art. 224 del Código Orgánico Administrativo)."}, {"texto": "Ninguna, porque un acto firme en vía administrativa es inmodificable.", "justificacion": "Incorrecta. La firmeza no impide el recurso extraordinario de revisión en los supuestos legales."}, {"texto": "La acción de protección, porque es la vía ordinaria para corregir actos administrativos.", "justificacion": "Incorrecta. La acción de protección no es vía ordinaria de control de legalidad."}], "correcta": 0, "referencias": ["COA"]}, {"id": "RZ-ADM-02", "area": 1, "dificultad": 3, "subarea": "Derecho Administrativo", "tema": "Término de la apelación administrativa", "resultado": "Resuelve un caso de término de la apelación administrativa razonando desde la norma aplicable.", "demanda": "Aplicar", "enunciado": "Un acto administrativo sancionador se notificó un lunes. El administrado presenta apelación quince días hábiles después, alegando que el término es de un mes. ¿Qué debe resolver la administración?", "opciones": [{"texto": "Inadmitir la apelación, porque el término legal de diez días ya venció.", "justificacion": "Correcta. El término para interponer el recurso de apelación es de diez días contados desde el día siguiente a la notificación (art. 224 del Código Orgánico Administrativo)."}, {"texto": "Admitirla, porque el término de un mes rige para impugnar actos sancionadores.", "justificacion": "Incorrecta. El término de un mes no es el previsto para la apelación."}, {"texto": "Admitirla, porque en materia sancionadora no existen términos de caducidad.", "justificacion": "Incorrecta. La apelación está sujeta a término legal también en materia sancionadora."}, {"texto": "Tramitarla como recurso extraordinario de revisión, por haber vencido la apelación.", "justificacion": "Incorrecta. La revisión procede contra actos firmes y por causales taxativas (art. 232 del Código Orgánico Administrativo), no como sustituto de una apelación tardía."}], "correcta": 0, "referencias": ["COA"]}, {"id": "RZ-ADM-03", "area": 1, "dificultad": 4, "subarea": "Derecho Administrativo", "tema": "Prescripción de la potestad sancionadora", "resultado": "Resuelve un caso de prescripción de la potestad sancionadora razonando desde la norma aplicable.", "demanda": "Aplicar", "enunciado": "Una entidad pretende sancionar una infracción administrativa leve cometida hace dos años, sin que antes haya iniciado procedimiento alguno. ¿Qué razonamiento es correcto?", "opciones": [{"texto": "Prescribió la potestad sancionadora, porque las infracciones leves prescriben al año.", "justificacion": "Correcta. El ejercicio de la potestad sancionadora prescribe en un año para las infracciones leves, tres años para las graves y cinco para las muy graves (art. 245 del Código Orgánico Administrativo)."}, {"texto": "Puede sancionar, porque la prescripción solo corre una vez notificado el inicio del procedimiento.", "justificacion": "Incorrecta. El plazo corre desde la comisión de la infracción; el inicio del procedimiento lo interrumpe, no lo origina."}, {"texto": "Puede sancionar, porque la potestad sancionadora del Estado es imprescriptible.", "justificacion": "Incorrecta. La imprescriptibilidad se limita a supuestos constitucionales específicos."}, {"texto": "Prescribió, pero la entidad puede imponer la sanción si la infracción fue reiterada.", "justificacion": "Incorrecta. La reiteración no revive una potestad prescrita respecto de esa infracción."}], "correcta": 0, "referencias": ["COA"]}, {"id": "RZ-ADM-04", "area": 1, "dificultad": 4, "subarea": "Derecho Administrativo", "tema": "Ejecutoriedad y suspensión del acto", "resultado": "Resuelve un caso de ejecutoriedad y suspensión del acto razonando desde la norma aplicable.", "demanda": "Analizar", "enunciado": "Un comerciante apela la clausura de su local. La entidad ejecuta la clausura mientras se tramita el recurso. El comerciante alega que la apelación suspendía automáticamente el acto. ¿Quién tiene razón?", "opciones": [{"texto": "La entidad, salvo que el comerciante haya pedido la suspensión y esta se haya concedido.", "justificacion": "Correcta. La interposición de un recurso no suspende la ejecución del acto impugnado, salvo que el interesado lo solicite y se cumplan los presupuestos legales para concederla (art. 229 del Código Orgánico Administrativo)."}, {"texto": "El comerciante, porque la apelación de una sanción tiene efecto suspensivo legal.", "justificacion": "Incorrecta. La regla es la ejecutividad del acto, no la suspensión automática."}, {"texto": "El comerciante, porque una sanción no puede ejecutarse antes de que exista sentencia judicial.", "justificacion": "Incorrecta. Los actos administrativos se presumen legítimos y son ejecutables."}, {"texto": "Ninguno, porque la clausura debió ordenarla un juez de lo contencioso administrativo.", "justificacion": "Incorrecta. La clausura puede ser una sanción administrativa impuesta por la autoridad competente."}], "correcta": 0, "referencias": ["COA"]}, {"id": "RZ-ADM-05", "area": 1, "dificultad": 5, "subarea": "Derecho Administrativo", "tema": "Lesividad frente a revisión de oficio", "resultado": "Resuelve un caso de lesividad frente a revisión de oficio razonando desde la norma aplicable.", "demanda": "Evaluar", "enunciado": "La administración otorgó un permiso favorable con un vicio que no es causal de nulidad, sino de simple anulabilidad. Ahora quiere dejarlo sin efecto. ¿Qué camino debe seguir?", "opciones": [{"texto": "Declarar el acto lesivo e impugnarlo ante la jurisdicción contencioso administrativa.", "justificacion": "Correcta. Los actos favorables con vicios que no son de nulidad no pueden revisarse de oficio; la administración debe declararlos lesivos para el interés público e impugnarlos judicialmente (art. 115 del Código Orgánico Administrativo), mientras que la revisión de oficio se reserva a los actos nulos (art. 132)."}, {"texto": "Revisarlo de oficio, porque la administración puede anular los actos con vicios.", "justificacion": "Incorrecta. La revisión de oficio procede para actos nulos (art. 132 del Código Orgá
