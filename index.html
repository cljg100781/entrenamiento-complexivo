  <div class="card score"><div class="big" style="color:var(--${nt>=7?"ok":nt>=5?"warn":"bad"})">${nt.toFixed(2)}</div><div class="sub">sobre 10 · ${ex.ok} de ${n} correctas (${Math.round(ex.ok/n*100)}%)</div>
  <div class="sub">Tiempo usado: ${fmt(ex.end-ex.start)}${ex.dur?" de "+fmt(ex.dur):""}${ex.auto?" · finalizado por tiempo":""}</div></div>
  <div class="card"><h3>Desempeño por área</h3><div class="dist">${Object.entries(ex.by).sort((x,y)=>x[0]-y[0]).map(([a,[o,t]])=>`<div class="r"><span>${esc(AREAS[a].n)}</span><b>${o}/${t}</b></div><div class="track ${trackCls(o/t)}"><i style="width:${o/t*100}%"></i></div>`).join("")}</div></div>
  <div class="row"><button class="btn pri" onclick="reviewView('bad')">Revisar incorrectas (${n-ex.ok})</button><button class="btn" onclick="reviewView('all')">Revisar todas</button></div>
  <p class="note">Meta personal sugerida: 7/10 o más en cada área.<br>Las preguntas falladas pasan a «Repasar errores».</p>
  </main>`;
  window.scrollTo(0,0);
}
function reviewBody(q,p,a,inline){
  const ok=a===0,none=a===undefined;
  return `<div class="card">
  <p class="verdict ${ok?"ok":"bad"}">${none?"Sin responder. La respuesta correcta es la "+L[p.indexOf(0)]+".":ok?"✓ Respuesta correcta.":"✗ Incorrecta. La respuesta correcta es la "+L[p.indexOf(0)]+"."}</p>
  <h4>Argumentación de cada opción</h4>
  ${p.map((oi,k)=>`<div class="why ${oi===0?"ok":""}"><b>${L[k]}) ${esc(q.o[oi].x)}</b>${esc(q.o[oi].w||"")}</div>`).join("")}
  <h4>Ficha del ítem</h4>
  <table class="meta"><tr><td>Área</td><td>${esc(AREAS[q.a]?.n)}</td></tr><tr><td>Subárea</td><td>${esc(q.s)}</td></tr><tr><td>Tema</td><td>${esc(q.t)}</td></tr><tr><td>Resultado de aprendizaje</td><td>${esc(q.ra)}</td></tr><tr><td>Demanda cognitiva</td><td>${esc(q.d)}</td></tr></table>
  ${q.refs&&q.refs.length?`<h4>Referencias (APA 7)</h4><div class="refs">${q.refs.map(r=>`<p>${linkify(r)}</p>`).join("")}</div>`:""}
  </div>`;
}
function reviewView(f){
  VIEW="review";const ex=store.get(K.last,null);if(!ex)return home();const m=byId();
  const list=ex.ids.map((id,i)=>({id,i})).filter(o=>m[o.id]&&(f==="all"||ex.ans[o.id]!==0));
  app().innerHTML=`<header class="top"><button class="ic" onclick="resultsView(store.get(K.last))">‹</button><div class="mid"><div class="kicker">${esc(ex.title)}</div><b>Revisión · ${list.length} pregunta${list.length===1?"":"s"}</b></div></header>
  <main class="wrap">${list.length?list.map(({id,i})=>{const q=m[id],p=ex.perm[id],a=ex.ans[id];
   return `<div class="chips"><span class="chip">Pregunta ${i+1}</span><span class="chip">${esc(q.s)}</span></div><div class="card"><p class="stem">${esc(q.q)}</p>${p.map((oi,k)=>{let c="opt";if(oi===0)c+=" ok";else if(a===oi)c+=" bad";return `<button class="${c}" disabled><span class="lt">${L[k]}</span><span>${esc(q.o[oi].x)}</span></button>`}).join("")}</div>${reviewBody(q,p,a)}`}).join(""):`<div class="card">¡Sin errores en esta evaluación!</div>`}
  <button class="btn" style="width:100%" onclick="home()">Volver al inicio</button></main>`;
  window.scrollTo(0,0);
}

/* ---------- HISTORIAL ---------- */
function historyView(){
  VIEW="hist";stopTick();const h=store.get(K.hist,[]);const agg={};
  h.forEach(x=>Object.entries(x.by||{}).forEach(([a,[o,t]])=>{agg[a]=agg[a]||[0,0];agg[a][0]+=o;agg[a][1]+=t}));
  const sims=h.filter(x=>x.mode==="sim");
  app().innerHTML=`<header class="top"><button class="ic" onclick="home()">‹</button><div class="mid"><div class="kicker">Tu avance</div><b>Historial</b></div></header>
  <main class="wrap">
  ${h.length?`<div class="card"><h3>Acierto acumulado por área</h3><div class="dist">${Object.keys(AREAS).filter(a=>agg[a]).map(a=>{const[o,t]=agg[a];return `<div class="r"><span>${esc(AREAS[a].n)}</span><b>${Math.round(o/t*100)}%</b></div><div class="track ${trackCls(o/t)}"><i style="width:${o/t*100}%"></i></div><div class="muted" style="font-size:12px;margin-top:3px">${o} de ${t} respuestas correctas</div>`}).join("")}</div></div>
  ${sims.length?`<div class="card"><h3>Simulacros completos</h3><p class="muted" style="margin:0;font-size:14px">${sims.length} realizados · promedio ${(sims.reduce((s,x)=>s+nota(x.ok,x.n),0)/sims.length).toFixed(2)}/10 · mejor ${Math.max(...sims.map(x=>nota(x.ok,x.n))).toFixed(2)}/10</p></div>`:""}
  <div class="card"><h3>Intentos</h3>${h.map(x=>`<div class="hist"><div><b>${esc(x.title)}</b><div class="muted">${new Date(x.d).toLocaleString("es-EC",{dateStyle:"medium",timeStyle:"short"})} · ${x.ok}/${x.n}</div></div><div class="pill" style="color:var(--${nota(x.ok,x.n)>=7?"ok":nota(x.ok,x.n)>=5?"warn":"bad"})">${nota(x.ok,x.n).toFixed(2)}</div></div>`).join("")}</div>
  ${store.get(K.last,null)?`<button class="btn" style="width:100%;margin-bottom:10px" onclick="resultsView(store.get(K.last))">Ver la última evaluación</button>`:""}
  <button class="btn" style="width:100%" onclick="clearHist()">Borrar historial y errores</button>`
  :`<div class="card">Aún no has rendido ninguna evaluación.</div>`}
  </main>`;
}
function clearHist(){if(confirm("¿Borrar todo el historial y la lista de errores?")){store.set(K.hist,[]);store.set(K.errs,[]);store.set(K.last,null);historyView()}}

/* ---------- BANCO ---------- */
const EJEMPLO=`[
  {
    "area": 4,
    "subarea": "Sucesiones",
    "tema": "Desheredamiento",
    "resultado": "Aplica las causales de desheredamiento.",
    "demanda": "Aplicar",
    "enunciado": "Texto de la pregunta...",
    "opciones": [
      {"texto": "Alternativa A", "justificacion": "Por qué es correcta o incorrecta"},
      {"texto": "Alternativa B", "justificacion": "..."},
      {"texto": "Alternativa C", "justificacion": "..."},
      {"texto": "Alternativa D", "justificacion": "..."}
    ],
    "correcta": 0,
    "referencias": ["Autor. (Año). Título. Fuente. https://..."]
  }
]`;
function bankView(){
  VIEW="bank";stopTick();const c=store.get(K.custom,[]),r=store.get(K.remote,[]),b=bank(),packs=store.get(K.packs,{}),st=store.get(K.sync,{}),saved=store.get(K.src,"");
  app().innerHTML=`<header class="top"><button class="ic" onclick="home()">‹</button><div class="mid"><div class="kicker">${b.length} preguntas</div><b>Banco de preguntas</b></div></header>
  <main class="wrap">
  ${syncLine()}
  <div class="card"><h3>Contenido</h3><div class="dist">${Object.entries(AREAS).map(([a,v])=>{const t=BASE.filter(q=>q.a==a).length,d=r.filter(q=>q.a==a).length,u=c.filter(q=>q.a==a).length;return `<div class="r"><span>${esc(v.n)}</span><b>${b.filter(q=>q.a==a).length}</b></div><div class="muted" style="font-size:12px">${t} incluidas${d?" + "+d+" descargadas":""}${u?" + "+u+" importadas":""} · el simulacro usa ${v.k}</div>`}).join("")}</div></div>
  <div class="card"><h3>Actualización en línea</h3>
  <p class="muted" style="font-size:14px;margin:0 0 10px;line-height:1.5">Cada vez que abras la app con internet (y cuando vuelva la conexión) se descargan los paquetes de preguntas nuevos y quedan guardados para usarlos sin conexión.</p>
  ${isWeb()&&!saved?`<p style="font-size:13.5px;margin:0 0 10px">Fuente: <b>banco de este mismo sitio</b></p>`:""}
  <label class="fld" for="src">${isWeb()?"Otra dirección (opcional)":"Dirección del banco (manifest.json)"}</label>
  <input type="url" id="src" inputmode="url" placeholder="https://usuario.github.io/complexivo/banco/manifest.json" value="${esc(saved)}">
  <div class="row" style="margin-top:10px"><button class="btn" onclick="saveSrc()">Guardar dirección</button><button class="btn pri" onclick="sync(true)" ${srcUrl()?"":"disabled"}>Actualizar ahora</button></div>
  ${st.err&&(!st.t||st.te>st.t)?`<p style="font-size:13px;color:var(--bad);margin:10px 0 0">Último error: ${esc(st.err)}</p>`:""}
  ${Object.keys(packs).length?`<h4>Paquetes descargados</h4>${Object.entries(packs).map(([id,p])=>`<div class="pk"><span>${esc(p.t)}</span><b>${p.n}</b></div>`).join("")}<button class="btn" style="width:100%;margin-top:10px" onclick="delRemote()">Borrar preguntas descargadas</button>`:""}
  </div>
  <div class="card"><h3>Importar preguntas</h3>
  <p class="muted" style="font-size:14px;margin:0 0 10px;line-height:1.5">Pega un JSON con el formato de abajo o elige un archivo .json. Áreas: 1 Constitucional/DD. HH./Administrativo · 2 Penal · 3 Procesal y MASC · 4 Civil · 5 Int. Privado/Mercantil/Tributario/Laboral. «correcta» es el índice (0 a 3) de la opción correcta.</p>
  <textarea id="imp" placeholder="Pega aquí el JSON"></textarea>
  <div class="row" style="margin-top:10px"><button class="btn pri" onclick="doImport(document.getElementById('imp').value)">Importar texto</button><label class="btn" style="text-align:center;display:flex;align-items:center;justify-content:center">Elegir archivo<input type="file" accept=".json,application/json,text/plain" style="display:none" onchange="impFile(this)"></label></div>
  <h4>Formato</h4><pre>${esc(EJEMPLO)}</pre></div>
  ${c.length?`<div class="card"><h3>Preguntas importadas: ${c.length}</h3><div class="row"><button class="btn" onclick="expCustom()">Exportar (.json)</button><button class="btn" onclick="delCustom()">Eliminar importadas</button></div></div>`:""}
  </main>`;
}
function impFile(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>doImport(String(r.result));r.readAsText(f)}
function doImport(txt){
  let raw;try{raw=JSON.parse(txt)}catch(e){alert("El texto no es un JSON válido:\n"+e.message);return}
  let data=Array.isArray(raw)?raw:Array.isArray(raw.preguntas)?raw.preguntas:[raw];if(!Array.isArray(raw))data.bibliografia=raw.bibliografia;
  const out=[],bad=[],stamp=Date.now().toString(36);
  const bib=data.bibliografia||{};
  data.forEach((x,i)=>{try{out.push(normItem(x,"U"+stamp+"-"+i,bib))}catch(e){bad.push("Pregunta "+(i+1)+": "+e)}});
  if(out.length){store.set(K.custom,store.get(K.custom,[]).concat(out))}
  alert(`Importadas: ${out.length}${bad.length?"\nCon errores (omitidas): "+bad.length+"\n\n"+bad.slice(0,8).join("\n"):""}`);
  bankView();
}
function expCustom(){
  const c=store.get(K.custom,[]).map(q=>({area:q.a,subarea:q.s,tema:q.t,resultado:q.ra,demanda:q.d,enunciado:q.q,opciones:q.o.map(p=>({texto:p.x,justificacion:p.w})),correcta:0,referencias:q.refs}));
  const blob=new Blob([JSON.stringify(c,null,2)],{type:"application/json"});const u=URL.createObjectURL(blob);
  const l=document.createElement("a");l.href=u;l.download="preguntas-complexivo.json";document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);
}
function saveSrc(){const v=document.getElementById("src").value.trim();if(v&&!/^https?:\/\//.test(v)){alert("La dirección debe empezar con https://");return}store.set(K.src,v);bankView();if(v||isWeb())sync(true)}
function delRemote(){if(confirm("¿Borrar las preguntas descargadas? Se volverán a descargar en la próxima actualización.")){store.set(K.remote,[]);store.set(K.packs,{});store.set(K.errs,validErrs());bankView()}}
function delCustom(){if(confirm("¿Eliminar todas las preguntas importadas?")){store.set(K.custom,[]);store.set(K.errs,validErrs());bankView()}}

/* ---------- BOTÓN ATRÁS DE ANDROID ---------- */
try{history.pushState({s:1},"")}catch(e){}
window.addEventListener("popstate",()=>{
  try{history.pushState({s:1},"")}catch(e){}
  if(VIEW==="exam")exitExam();
  else if(VIEW==="grid")go(0,true);
  else if(VIEW==="review")resultsView(store.get(K.last));
  else if(VIEW!=="home")home();
});
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&EX&&!EX.done&&(VIEW==="exam"||VIEW==="grid")&&EX.dur&&remaining()<=0)finish(true)});

/* ---------- ACTUALIZACIÓN AUTOMÁTICA ---------- */
window.addEventListener("online",()=>{refreshSync();sync(false)});
window.addEventListener("offline",refreshSync);
setInterval(()=>sync(false),6*3600*1000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden){const st=store.get(K.sync,{});if(!st.t||Date.now()-st.t>3600*1000)sync(false)}});
if(isWeb()&&"serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(()=>{})}

home();
setTimeout(()=>sync(false),800);
</script>
