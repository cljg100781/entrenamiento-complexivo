artes."}], "correcta": 0, "referencias": ["COGEP"]}, {"id": "UTE-DPG-08", "area": 3, "dificultad": 3, "subarea": "Derecho Procesal General", "tema": "Recusación", "resultado": "Resuelve el caso aplicando recusación.", "demanda": "Comprender", "enunciado": "Se admite la recusación de un juez en una causa concreta. ¿Qué efecto tiene?", "opciones": [{"texto": "Pierde competencia solo respecto de esa causa.", "justificacion": "Correcta. La recusación aceptada hace perder competencia para esa causa, no la potestad jurisdiccional general (art. 165 num. 2 COFJ)."}, {"texto": "Pierde su jurisdicción para todas las causas.", "justificacion": "Incorrecta. El efecto se limita a la causa concreta."}, {"texto": "Debe seguir conociendo la causa con un secretario adjunto.", "justificacion": "Incorrecta. Debe separarse de esa causa."}, {"texto": "Queda suspendido de sus funciones por noventa días.", "justificacion": "Incorrecta. La recusación no es una sanción disciplinaria."}], "correcta": 0, "referencias": ["COFJ"]}, {"id": "UTE-DPG-09", "area": 3, "dificultad": 2, "subarea": "Derecho Procesal General", "tema": "Competencia por materia", "resultado": "Resuelve el caso aplicando competencia por materia.", "demanda": "Comprender", "enunciado": "Dos jueces ejercen la potestad de administrar justicia, pero uno conoce asuntos laborales y otro civiles. ¿Qué institución explica esa distribución?", "opciones": [{"texto": "La competencia asignada a cada juzgador.", "justificacion": "Correcta. La competencia es la medida en que se distribuye la potestad jurisdiccional por materia, personas, territorio y grados (arts. 150 y 156 COFJ)."}, {"texto": "La jurisdicción como potestad pública general.", "justificacion": "Incorrecta. Ambos jueces tienen jurisdicción; lo que difiere es la competencia."}, {"texto": "La procuración judicial de los litigantes.", "justificacion": "Incorrecta. Se refiere a la representación de las partes."}, {"texto": "La representación legal de las partes.", "justificacion": "Incorrecta. No distribuye asuntos entre jueces."}], "correcta": 0, "referencias": ["COFJ"]}, {"id": "UTE-DPG-10", "area": 3, "dificultad": 2, "subarea": "Derecho Procesal General", "tema": "Competencia por grado", "resultado": "Resuelve el caso aplicando competencia por grado.", "demanda": "Comprender", "enunciado": "Una causa pasa del juzgado de primera instancia al tribunal que resolverá la apelación. ¿Qué criterio identifica quién conoce en cada instancia?", "opciones": [{"texto": "La competencia por grado.", "justificacion": "Correcta. El grado es uno de los criterios legales de distribución de la competencia (art. 156 COFJ)."}, {"texto": "La competencia por territorio.", "justificacion": "Incorrecta. El territorio no distingue instancias."}, {"texto": "La prorrogación de la competencia.", "justificacion": "Incorrecta. La prorrogación opera respecto del territorio."}, {"texto": "La jurisdicción voluntaria.", "justificacion": "Incorrecta. No guarda relación con las instancias."}], "correcta": 0, "referencias": ["COFJ"]}, {"id": "UTE-DPG-11", "area": 3, "dificultad": 3, "subarea": "Derecho Procesal General", "tema": "Reconvención en el sumario", "resultado": "Resuelve el caso aplicando reconvención en el sumario.", "demanda": "Aplicar", "enunciado": "En un procedimiento sumario, el demandado reconviene por una relación jurídica independiente y sin conexión con la demanda principal. ¿Es admisible?", "opciones": [{"texto": "No: en el sumario solo se admite la reconvención conexa.", "justificacion": "Correcta. Así lo dispone el art. 333 num. 2 COGEP."}, {"texto": "Sí: la reconvención procede siempre en cualquier procedimiento.", "justificacion": "Incorrecta. El procedimiento sumario la limita a la conexa."}, {"texto": "Sí, si el actor no se opone en la audiencia única.", "justificacion": "Incorrecta. La limitación es legal, no depende del actor."}, {"texto": "No: en el sumario está prohibida toda reconvención.", "justificacion": "Incorrecta. La conexa sí se admite."}], "correcta": 0, "referencias": ["COGEP"]}, {"id": "UTE-DPG-12", "area": 3, "dificultad": 3, "subarea": "Derecho Procesal General", "tema": "Jurisdicción y posesión del cargo", "resultado": "Resuelve el caso aplicando jurisdicción y posesión del cargo.", "demanda": "Comprender", "enunciado": "Una persona ha sido nombrada jueza, pero aún no toma posesión ni entra en servicio efectivo. ¿Puede dictar sentencia con base en su nombramiento?", "opciones": [{"texto": "No: para ejercer la jurisdicción debe posesionarse.", "justificacion": "Correcta. El nombramiento origina la jurisdicción, pero su ejercicio comienza con la posesión y el servicio efectivo (art. 152 COFJ)."}, {"texto": "Sí: el nombramiento basta para ejercer la jurisdicción desde su expedición.", "justificacion": "Incorrecta. Falta la posesión del cargo."}, {"texto": "Sí, si las partes aceptan expresamente su intervención.", "justificacion": "Incorrecta. La voluntad de las partes no suple ese requisito."}, {"texto": "Sí, pero solo en procedimientos sumarios.", "justificacion": "Incorrecta. La regla es general."}], "correcta": 0, "referencias": ["COFJ"]}, {"id": "UTE-DPG-13", "area": 3, "dificultad": 3, "subarea": "Derecho Procesal General", "tema": "Prorrogación de la competencia", "resultado": "Resuelve el caso aplicando prorrogación de la competencia.", "demanda": "Analizar", "enunciado": "Dos partes acuerdan que un juez con competencia exclusivamente civil conozca su conflicto laboral. ¿El acuerdo le otorga competencia por materia?", "opciones": [{"texto": "No: la prorrogación es territorial, no material.", "justificacion": "Correcta. La prorrogación de la competencia regulada en el art. 162 COFJ opera respecto del territorio y no modifica la competencia por materia."}, {"texto": "Sí: las partes pueden prorrogar cualquier competencia por mutuo acuerdo.", "justificacion": "Incorrecta. La competencia material es de orden público."}, {"texto": "Sí, si el acuerdo consta en escritura pública.", "justificacion": "Incorrecta. La forma no cambia la regla."}, {"texto": "Sí, si el juez laboral competente lo autoriza.", "justificacion": "Incorrecta. No existe esa autorización."}], "correcta": 0, "referencias": ["COFJ"]}, {"id": "UTE-DPG-14", "area": 3, "dificultad": 2, "subarea": "Derecho Procesal General", "tema": "Cláusula especial para transigir", "resultado": "Resuelve el caso aplicando cláusula especial para transigir.", "demanda": "Aplicar", "enunciado": "Una abogada tiene procuración judicial, pero su mandato no contiene cláusula especial para transigir. ¿Qué requiere para transigir en representación de su mandante?", "opciones": [{"texto": "Una cláusula especial que le confiera esa facultad.", "justificacion": "Correcta. Transigir es una de las facultades que requieren cláusula especial en la procuración judicial (art. 43 COGEP)."}, {"texto": "Su sola acreditación como profesional del derecho.", "justificacion": "Incorrecta. La calidad de abogada no basta."}, {"texto": "Su designación como procuradora común.", "justificacion": "Incorrecta. No confiere facultades especiales."}, {"texto": "El consentimiento del abogado de la contraparte.", "justificacion": "Incorrecta. Es irrelevante para su facultad."}], "correcta": 0, "referencias": ["COGEP"]}, {"id": "UTE-DPG-15", "area": 3, "dificultad": 2, "subarea": "Derecho Procesal General", "tema": "Imparcialidad", "resultado": "Resuelve el caso aplicando imparcialidad.", "demanda": "Comprender", "enunciado": "Una jueza favorece a quien considera más influyente, aunque las pruebas no respalden su pretensión. ¿Qué principio vulnera?", "opciones": [{"texto": "La imparcialidad.", "justificacion": "Correcta. La decisión debe respetar la igualdad de las partes y fundarse jurídicamente (art. 9 COFJ)."}, {"texto": "La publicidad.", "justificacion": "Incorrecta. No se trata del carácter público de las actuaciones."}, {"texto": "La celeridad.", "justificacion": "Incorrecta. No se trata de demoras."}, {"texto": "La gratuidad.", "justificacion": "Incorrecta. No se refiere al costo del servicio."}], "correcta": 0, "referencias": ["COFJ"]}, {"id": "UTE-DPG-16", "area": 3, "dificultad": 1, "subarea": "Derecho Procesal General", "tema": "Competencia territorial", "resultado": "Resuelve el caso aplicando competencia territorial.", "demanda": "Recordar", "enunciado": "En una controversia civil, la persona demandada tiene un único domicilio en Cuenca. Sin fueros especiales, ¿qué determina la competencia territorial general?", "opciones": [{"texto": "El domicilio de la persona demandada.", "justificacion": "Correcta. Es la regla general del art. 9 COGEP."}, {"texto": "El domicilio de la parte actora.", "justificacion": "Incorrecta. No es la regla general."}, {"texto": "El lugar elegido por el abogado del actor.", "justificacion": "Incorrecta. La competencia la fija la ley."}, {"texto": "La sede de la Corte Nacional de Justicia.", "justificacion": "Incorrecta. La Corte Nacional no conoce en primera instancia."}], "correcta": 0, "referencias": ["COGEP"]}, {"id": "UTE-DPG-17", "area": 3, "dificultad": 3, "subarea": "Derecho Procesal General", "tema": "Tercerías", "resultado": "Resuelve el caso aplicando tercerías.", "demanda": "Aplicar", "enunciado": "Una persona ajena al litigio pide intervenir para que se la declare titular del derecho discutido. ¿Qué clase de tercería corresponde?", "opciones": [{"texto": "Excluyente de dominio, porque reclama la titularidad.", "justificacion": "Correcta. Es la tercería excluyente del art. 47 num. 1 COGEP."}, {"texto": "Coadyuvante, porque respalda a una de las partes.", "justificacion": "Incorrecta. La coadyuvante apoya a una parte sin reclamar el derecho para sí."}, {"texto": "Litisconsorcio pasivo, porque se demanda contra ella.", "justificacion": "Incorrecta. Ella no es demandada."}, {"texto": "Procuración común, porque representa a varios.", "justificacion": "Incorrecta. No es una forma de representación."}], "correcta": 0, "referencias": ["COGEP"]}, {"id": "UTE-DPG-18", "area": 3, "dificultad": 2, "subarea": "Derecho Procesal General", "tema": "Recurso de ampliación", "resultado": "Resuelve el caso aplicando recurso de ampliación.", "demanda": "Aplicar", "enunciado": "La sentencia deja sin resolver uno de los puntos controvertidos y la parte busca un pronunciamiento del mismo juzgador. ¿Qué recurso corresponde?", "opciones": [{"texto": "Ampliación.", "justificacion": "Correcta. La ampliación procede cuando no se resolvió alguno de los puntos controvertidos (art. 253 COGEP)."}, {"texto": "Revocatoria.", "justificacion": "Incorrecta. No procede contra sentencias."}, {"texto": "De hecho.", "justificacion": "Incorrecta. Procede contra la negativa de un recurso."}, {"texto": "Aclaración.", "justificacion": "Incorrecta. La aclaración procede ante una decisión oscura, no ante una omisión."}], "correcta": 0, "referencias": ["COGEP"]}, {"id": "UTE-DPG-19", "area": 3, "dificultad": 2, "subarea": "Derecho Procesal General", "tema": "Consejo de la Judicatura", "resultado": "Resuelve el caso aplicando consejo de la judicatura.", "demanda": "Comprender", "enunciado": "Una persona solicita al Consejo de la Judicatura que revoque una sentencia civil porque discrepa de su contenido. ¿Qué corresponde?", "opciones": [{"texto": "Ejercer sus atribuciones administrativas, sin revisar la sentencia.", "justificacion": "Correcta. El Consejo de la Judicatura es órgano de gobierno, administración, vigilancia y disciplina (art. 178 CRE); no sustituye al tribunal competente para revisar sentencias."}, {"texto": "Revisar el fondo de la sentencia como tribunal de apelación.", "justificacion": "Incorrecta. Carece de funciones jurisdiccionales."}, {"texto": "Resolver el litigio en equidad, como lo haría un juez de paz de la localidad.", "justificacion": "Incorrecta. No es un órgano jurisdiccional."}, {"texto": "Actuar como procurador judicial de la solicitante.", "justificacion": "Incorrecta. No representa a las partes."}], "correcta": 0, "referencias": ["CRE"]}, {"id": "UTE-DPG-20", "area": 3, "dificultad": 3, "subarea": "Derecho Procesal General", "tema": "La naturaleza como parte", "resultado": "Resuelve el caso aplicando la naturaleza como parte.", "demanda": "Comprender", "enunciado": "Se presenta una demanda en representación de la naturaleza conforme a las reglas legales. ¿Puede rechazarse porque la naturaleza no es persona natural ni jurídica?", "opciones": [{"texto": "No: el COGEP permite que la naturaleza sea parte procesal.", "justificacion": "Correcta. El art. 30 num. 4 COGEP reconoce a la naturaleza como parte, y su intervención se sujeta a las reglas de representación aplicables (arts. 10 y 71 CRE)."}, {"texto": "Sí: solo las personas naturales y jurídicas pueden ser partes.", "justificacion": "Incorrecta. El COGEP amplía expresamente las partes procesales."}, {"texto": "Sí, salvo que la demanda la presente el Estado.", "justificacion": "Incorrecta. Cualquier persona puede actuar en su representación."}, {"texto": "No, pero solo si lo autoriza la Corte Constitucional.", "justificacion": "Incorrecta. No se requiere esa autorización."}], "correcta": 0, "referencias": ["COGEP", "CRE"]}]}, {"id": "pack-005", "bibliografia": {"CC": "Congreso Nacional del Ecuador. (2005). Código Civil (Codificación 2005-010). Registro Oficial Suplemento 46, 24 de junio de 2005. Texto vigente con sus reformas, entre ellas la Ley Reformatoria de 2015 (R.O. 526-2S, 19 de junio de 2015); última actualización: Segundo Suplemento del R.O. 61, 17 de junio de 2025. https://www.gob.ec/regulaciones/codigo-civil-codificacion-no-2005-010", "CCE2815": "Corte Constitucional del Ecuador. (2021). Sentencia No. 28-15-IN/21 (preferencia materna en la tenencia). https://www.corteconstitucional.gob.ec/", "COA": "Asamblea Nacional del Ecuador. (2017). Código Orgánico Administrativo. Registro Oficial Segundo Suplemento 31, 7 de julio de 2017. Última reforma: 13 de octubre de 2025. https://lotaip.bomberosquito.gob.ec/transparencia/2026/archivos/coa26.pdf", "COFJ": "Asamblea Nacional del Ecuador. (2009). Código Orgánico de la Función Judicial. Registro Oficial Suplemento 544, 9 de marzo de 2009. Reformado, entre otras, por la Ley Orgánica Reformatoria de Varios Cuerpos Legales para la Agilización de la Adopción (R.O. 347, 14 de agosto de 2026). https://www.funcionjudicial.gob.ec/", "COGEP": "Asamblea Nacional del Ecuador. (2015). Código Orgánico General de Procesos. Registro Oficial Suplemento 506, 22 de mayo de 2015. Reformado, entre otras, por la Ley Orgánica Reformatoria del COGEP (R.O. Suplemento 517, 26 de junio de 2019); última reforma consultada: Cuarto Suplemento del R.O. 140, 7 de octubre de 2025. https://portal.compraspublicas.gob.ec/sercop/wp-content/uploads/2025/11/CODIGO-ORGANICO-GENERAL-DE-PROCESOS-COGEP.pdf", "CONA": "Congreso Nacional del Ecuador. (2003). Código de la Niñez y Adolescencia (Ley 100). Registro Oficial 737, 3 de enero de 2003. Última reforma: Ley Orgánica Reformatoria de Varios Cuerpos Legales para la Agilización de la Adopción, R.O. 347, 14 de agosto de 2026. https://www.registroficial.gob.ec/", "CRE": "Asamblea Constituyente del Ecuador. (2008). Constitución de la República del Ecuador. Registro Oficial 449, 20 de octubre de 2008 (con las enmiendas posteriores, incluidas las aprobadas en el referéndum de 2024). https://www.asambleanacional.gob.ec/"}, "preguntas": [{"id": "NV-ADM-01", "area": 1, "dificultad": 3, "subarea": "Derecho Administrativo", "tema": "Acto administrativo impugnable", "resultado": "Resuelve el caso aplicando acto administrativo impugnable.", "demanda": "Analizar", "enunciado": "Durante un trámite de licencia ambiental se producen cuatro actuaciones. ¿Cuál puede impugnarse de forma autónoma mediante recurso administrativo?", "opciones": [{"texto": "La resolución que niega la licencia ambiental.", "justificacion": "Correcta. Es un acto administrativo: declaración unilateral que produce efectos jurídicos individuales de forma directa (art. 98 COA)."}, {"texto": "El informe técnico no vinculante previo a resolver.", "justificacion": "Incorrecta. Es un acto de simple administración, sin efectos directos."}, {"texto": "El dictamen jurídico interno solicitado por la dirección.", "justificacion": "Incorrecta. Es un acto preparatorio que no decide el asunto."}, {"texto": "La propuesta de resolución elaborada por el analista.", "justificacion": "Incorrecta. No produce efectos jurídicos por sí misma."}], "correcta": 0, "referencias": ["COA"]}, {"id": "NV-ADM-02", "area": 1, "dificultad": 3, "subarea": "Derecho Administrativo", "tema": "Requisitos de validez", "resultado": "Resuelve el caso aplicando requisitos de validez.", "demanda": "Aplicar", "enunciado": "Una entidad impone una multa con una resolución que solo cita «la normativa vigente», sin describir los hechos ni explicar la norma aplicada. ¿Qué requisito de validez falla?", "opciones": [{"texto": "La motivación.", "justificacion": "Correcta. La motivación es requisito de validez del acto (art. 99 COA) y exige explicar la pertinencia de las normas a los hechos (art. 76 num. 7 lit. l CRE)."}, {"texto": "La notificación.", "justificacion": "Incorrecta. La notificación es condición de eficacia, no de validez (art. 101 COA)."}, {"texto": "La competencia.", "justificacion": "Incorrecta. Nada indica que el órgano carezca de competencia."}, {"texto": "La publicidad.", "justificacion": "Incorrecta. No es uno de los requisitos de validez del art. 99 COA."}], "correcta": 0, "referencias": ["COA", "CRE"]}, {"id": "NV-ADM-03", "area": 1, "dificultad": 3, "subarea": "Derecho Administrativo", "tema": "Silencio administrativo", "resultado": "Resuelve el caso aplicando silencio administrativo.", "demanda": "Aplicar", "enunciado": "Una empresa pide un permiso de uso de suelo. Pasan treinta y cinco días sin respuesta ni causa legal de suspensión. ¿Qué efecto se produce, por regla general?", "opciones": [{"texto": "Se entiende aprobada la petición por silencio positivo.", "justificacion": "Correcta. Vencido el término de treinta días sin resolución, la petición se entiende aprobada (art. 207 COA), salvo excepciones legales."}, {"texto": "Se entiende negada y queda abierta la vía judicial.", "justificacion": "Incorrecta. El COA no consagra el silencio negativo como regla."}, {"texto": "El trámite caduca y la empresa debe presentarlo de nuevo.", "justificacion": "Incorrecta. La inacción de la administración no perjudica al peticionario."}, {"texto": "La empresa debe esperar un año y presentar una queja.", "justificacion": "Incorrecta. No existe ese plazo ni ese requisito."}], "correcta": 0, "referencias": ["COA"]}, {"id": "NV-ADM-04", "area": 1, "dificultad": 3, "subarea": "Derecho Administrativo", "tema": "Eficacia del acto", "resultado": "Resuelve el caso aplicando eficacia del acto.", "demanda": "Aplicar", "enunciado": "Una resolución que revoca un permiso se notifica en una dirección que no corresponde al administrado, quien nunca la recibe. ¿Qué afirmación es correcta?", "opciones": [{"texto": "El acto puede ser válido, pero no es eficaz hasta notificarse bien.", "justificacion": "Correcta. El acto administrativo es eficaz una vez notificado (art. 101 COA); una notificación defectuosa impide oponerlo y ejecutarlo."}, {"texto": "El acto es nulo de pleno derecho por la notificación errónea.", "justificacion": "Incorrecta. La notificación no es requisito de validez."}, {"texto": "El acto surte efectos desde su firma, aunque no se notifique.", "justificacion": "Incorrecta. Sin notificación válida no hay eficacia."}, {"texto": "Basta con publicar el acto en la página web de la entidad.", "justificacion": "Incorrecta. La publicación no sustituye la notificación personal."}], "correcta": 0, "referencias": ["COA"]}, {"id": "NV-ADM-05", "area": 1, "dificultad": 4, "subarea": "Derecho Administrativo", "tema": "Causales de nulidad", "resultado": "Resuelve el caso aplicando causales de nulidad.", "demanda": "Analizar", "enunciado": "¿Cuál de las siguientes situaciones constituye causal de nulidad del acto administrativo según el COA?", "opciones": [{"texto": "Que lo dicte un órgano manifiestamente incompetente por materia.", "justificacion": "Correcta. La incompetencia manifiesta por materia, territorio o tiempo es causal de nulidad (art. 105 COA)."}, {"texto": "Que tenga un error en el número de expediente asignado por la entidad.", "justificacion": "Incorrecta. Es un vicio subsanable sin trascendencia."}, {"texto": "Que se notifique un día después del término previsto en la norma.", "justificacion": "Incorrecta. Afecta la eficacia, no la validez."}, {"texto": "Que cite un artículo mal numerado pero aplicable.", "justificacion": "Incorrecta. Es un error material subsanable."}], "correcta": 0, "referencias": ["COA"]}, {"id": "NV-ADM-06", "area": 1, "dificultad": 4, "subarea": "Derecho Administrativo", "tema": "Lesividad", "resultado": "Resuelve el caso aplicando lesividad.", "demanda": "Analizar", "enunciado": "Una entidad advierte que otorgó a un particular un acto favorable ilegítimo, aunque no incurso en causal de nulidad, y quiere dejarlo sin efecto. ¿Qué vía corresponde?", "opciones": [{"texto": "Declararlo lesivo y demandar su anulación ante el tribunal contencioso.", "justificacion": "Correcta. Los actos favorables que no son nulos no pueden revocarse directamente: la administración debe declararlos lesivos e impugnarlos en sede judicial (acción de lesividad, COA)."}, {"texto": "Revocarlo directamente por razones de oportunidad y conveniencia institucional.", "justificacion": "Incorrecta. La revocación directa de actos favorables está restringida."}, {"texto": "Pedir al particular que interponga recurso de apelación.", "justificacion": "Incorrecta. El recurso es un medio del administrado, no de la entidad."}, {"texto": "Dejarlo sin efecto mediante un nuevo informe técnico.", "justificacion": "Incorrecta. Un informe no extingue un acto administrativo."}], "correcta": 0, "referencias": ["COA"]}, {"id": "NV-ADM-07", "area": 1, "dificultad": 3, "subarea": "Derecho Administrativo", "tema": "Avocación", "resultado": "Resuelve el caso aplicando avocación.", "demanda": "Comprender", "enunciado": "El ministro decide asumir el conocimiento de un expediente que correspondía a una subsecretaría bajo su dependencia. ¿Qué figura aplica?", "opciones": [{"texto": "Avocación.", "justificacion": "Correcta. La avocación permite al órgano superior asumir el conocimiento de un asunto atribuido a un inferior jerárquico (formas de transferencia de la competencia, COA)."}, {"texto": "Delegación.", "justificacion": "Incorrecta. La delegación transfiere el ejercicio al inferior, no al superior."}, {"texto": "Suplencia.", "justificacion": "Incorrecta. La suplencia cubre la ausencia del titular."}, {"texto": "Encomienda de gestión.", "justificacion": "Incorrecta. Se refiere a actividades materiales o técnicas."}], "correcta": 0, "referencias": ["COA"]}, {"id": "NV-ADM-08", "area": 1, "dificultad": 2, "subarea": "Derecho Administrativo", "tema": "Recursos administrativos", "resultado": "Resuelve el caso aplicando recursos administrativos.", "demanda": "Recordar", "enunciado": "Según el Código Orgánico Administrativo, ¿qué recursos administrativos pueden interponerse contra los actos administrativos?", "opciones": [{"texto": "Apelación y extraordinario de revisión.", "justificacion": "Correcta. El COA prevé el recurso de apelación y el extraordinario de revisión (art. 219 COA)."}, {"texto": "Reposición, apelación y revisión.", "justificacion": "Incorrecta. El COA eliminó la reposición como recurso general."}, {"texto": "Casación y apelación administrativa.", "justificacion": "Incorrecta. La casación es un recurso judicial."}, {"texto": "Revocatoria y nulidad ante la Contraloría.", "justificacion": "Incorrecta. No son recursos administrativos del COA."}], "correcta": 0, "referencias": ["COA"]}, {"id": "NV-ADM-09", "area": 1, "dificultad": 3, "subarea": "Derecho Administrativo", "tema": "Presunción de legitimidad", "resultado": "Resuelve el caso aplicando presunción de legitimidad.", "demanda": "Aplicar", "enunciado": "Un administrado considera ilegal una multa válidamente notificada y presenta recurso de apelación. ¿Qué efecto tiene el recurso sobre la ejecución de la multa?", "opciones": [{"texto": "En principio no la suspende, salvo que se pida y conceda la suspensión.", "justificacion": "Correcta. Los actos administrativos se presumen legítimos y ejecutorios; la interposición de recursos no suspende la ejecución, salvo que el órgano la suspenda en los casos legales (COA)."}, {"texto": "La suspende automáticamente hasta que se resuelva el recurso.", "justificacion": "Incorrecta. La suspensión no es automática."}, {"texto": "La anula, porque el acto deja de presumirse legítimo.", "justificacion": "Incorrecta. La presunción subsiste mientras no se declare su invalidez."}, {"texto": "La convierte en una obligación natural no exigible.", "justificacion": "Incorrecta. La categoría civil no aplica a la multa."}], "correcta": 0, "referencias": ["COA"]}, {"id": "NV-ADM-10", "area": 1, "dificultad": 3, "subarea": "Derecho Administrativo", "tema": "Responsabilidad del Estado", "resultado": "Resuelve el caso aplicando responsabilidad del estado.", "demanda": "Aplicar", "enunciado": "Un vehículo municipal mal estacionado causa un accidente que daña la propiedad de un vecino. ¿Cómo responde el municipio?", "opciones": [{"texto": "Objetivamente, y luego repite contra el servidor responsable.", "justificacion": "Correcta. El Estado responde por las acciones u omisiones de sus servidores en el desempeño de sus cargos y ejerce el derecho de repetición (art. 11 num. 9 CRE)."}, {"texto": "No responde, porque el daño lo causó un servidor individual.", "justificacion": "Incorrecta. La responsabilidad del Estado es directa frente al afectado."}, {"texto": "Solo responde si se prueba el dolo del conductor municipal.", "justificacion": "Incorrecta. La responsabilidad estatal no exige dolo."}, {"texto": "Responde solo si el vecino obtiene una sentencia penal previa.", "justificacion": "Incorrecta. No se exige una condena penal."}], "correcta": 0, "referencias": ["CRE"]}, {"id": "NV-CIV-01", "area": 4, "dificultad": 3, "subarea": "Personas y Familia", "tema": "Incapacidad relativa", "resultado": "Resuelve el caso aplicando incapacidad relativa.", "demanda": "Aplicar", "enunciado": "Sebastián, de quince años, compra una bicicleta a plazos sin intervención de sus representantes. ¿Qué calificación corresponde a su capacidad?", "opciones": [{"texto": "Es relativamente incapaz, por ser menor adulto.", "justificacion": "Correcta. El adolescente (menor adulto) es relativamente incapaz (arts. 21 y 1463 CC); sus actos adolecen de nulidad relativa."}, {"texto": "Es absolutamente incapaz, por ser menor de edad.", "justificacion": "Incorrecta. La incapacidad absoluta corresponde a los impúberes."}, {"texto": "Es plenamente capaz, por tener más de doce años.", "justificacion": "Incorrecta. La plena capacidad llega a los dieciocho años."}, {"texto": "Es capaz si el vendedor ignoraba su edad.", "justificacion": "Incorrecta. La ignorancia del vendedor no otorga capacidad."}], "correcta": 0, "referencias": ["CC"]}, {"id": "NV-CIV-02", "area": 4, "dificultad": 4, "subarea": "Personas y Familia", "tema": "Disolución de la sociedad conyugal", "resultado": "Resuelve el caso aplicando disolución de la sociedad conyugal.", "demanda": "Analizar", "enunciado": "¿Cuál de las siguientes situaciones NO disuelve la sociedad conyugal según el Código Civil?", "opciones": [{"texto": "La separación de hecho prolongada de los cónyuges.", "justificacion": "Correcta. La separación de hecho no figura entre las causas taxativas de disolución del art. 189 CC."}, {"texto": "La sentencia de divorcio debidamente inscrita.", "justificacion": "Incorrecta. El divorcio disuelve la sociedad conyugal."}, {"texto": "La muerte de uno de los cónyuges.", "justificacion": "Incorrecta. La muerte disuelve la sociedad conyugal."}, {"texto": "La sentencia de disolución pedida por un cónyuge.", "justificacion": "Incorrecta. Es causa de disolución prevista en la ley."}], "correcta": 0, "referencias": ["CC"]}, {"id": "NV-CIV-03", "area": 4, "dificultad": 3, "subarea": "Personas y Familia", "tema": "Bienes propios", "resultado": "Resuelve el caso aplicando bienes propios.", "demanda": "Aplicar", "enunciado": "Durante el matrimonio, sin capitulaciones, Paula recibe de su tía la donación de un terreno. ¿Cómo se clasifica el terreno?", "opciones": [{"texto": "Como bien propio de Paula, por adquirirse a título gratuito.", "justificacion": "Correcta. Los bienes adquiridos durante el matrimonio a título gratuito (donación, herencia, legado) no ingresan al haber social (CC)."}, {"texto": "Como haber social, porque se adquirió durante el matrimonio.", "justificacion": "Incorrecta. El título gratuito excluye el bien del haber social."}, {"texto": "Como copropiedad entre Paula y su cónyuge por mitades.", "justificacion": "Incorrecta. No hay base para la copropiedad."}, {"texto": "Como haber social, si el cónyuge acepta la donación.", "justificacion": "Incorrecta. La aceptación del cónyuge no cambia el título."}], "correcta": 0, "referencias": ["CC"]}, {"id": "NV-CIV-04", "area": 4, "dificultad": 2, "subarea": "Personas y Familia", "tema": "Edad para contraer matrimonio", "resultado": "Resuelve el caso aplicando edad para contraer matrimonio.", "demanda": "Recordar", "enunciado": "Dos adolescentes de diecisiete años quieren casarse con la autorización expresa de sus padres. ¿Es posible?", "opciones": [{"texto": "No: la edad mínima es dieciocho años y la autorización no la suple.", "justificacion": "Correcta. Desde la reforma de 2015 es nulo el matrimonio de menores de dieciocho años (art. 95 num. 2 CC), sin que la autorización de los padres lo valide."}, {"texto": "Sí, con la autorización de ambos progenitores ante notario.", "justificacion": "Incorrecta. La autorización parental ya no habilita el matrimonio."}, {"texto": "Sí, si un juez de familia lo autoriza expresamente por una causa justa.", "justificacion": "Incorrecta. No existe dispensa judicial de edad."}, {"texto": "Sí, si al menos uno de ellos es mayor de dieciséis años.", "justificacion": "Incorrecta. Ambos deben tener al menos dieciocho años."}], "correcta": 0, "referencias": ["CC"]}, {"id": "NV-CIV-05", "area": 4, "dificultad": 3, "subarea": "Personas y Familia", "tema": "Divorcio por mutuo acuerdo", "resultado": "Resuelve el caso aplicando divorcio por mutuo acuerdo.", "demanda": "Aplicar", "enunciado": "Ana y Jorge, sin hijos menores ni dependientes, deciden divorciarse de mutuo acuerdo. ¿Ante quién pueden tramitarlo?", "opciones": [{"texto": "Ante notario, mediante el trámite notarial de mutuo acuerdo.", "justificacion": "Correcta. El divorcio por mutuo consentimiento puede tramitarse ante notario (art. 18 num. 22 de la Ley Notarial), además de la vía judicial; desde la reforma de 2019 procede incluso con hijos menores o dependientes, si su tenencia, alimentos y visitas ya se resolvieron judicialmente o por acta de mediación."}, {"texto": "Solo ante la jueza o el juez de familia del domicilio de cualquiera de ellos.", "justificacion": "Incorrecta. La vía notarial también está prevista en este supuesto."}, {"texto": "Ante el Registro Civil, con dos testigos.", "justificacion": "Incorrecta. El Registro Civil inscribe el divorcio, no lo declara."}, {"texto": "Ante un centro de mediación, con acta de acuerdo total.", "justificacion": "Incorrecta. El acta de mediación no declara el divorcio."}], "correcta": 0, "referencias": ["CC"]}, {"id": "NV-CIV-06", "area": 4, "dificultad": 3, "subarea": "Personas y Familia", "tema": "Obligados subsidiarios de alimentos", "resultado": "Resuelve el caso aplicando obligados subsidiarios de alimentos.", "demanda": "Aplicar", "enunciado": "El padre de un niño se encuentra ausente y la madre no puede cubrir la pensión. ¿Quiénes pueden ser obligados subsidiariamente?", "opciones": [{"texto": "Los abuelos, los hermanos mayores de veintiún años y los tíos.", "justificacion": "Correcta. El Código de la Niñez y Adolescencia establece obligados subsidiarios, en ese orden, cuando faltan o no pueden cumplir los principales."}, {"texto": "Solo el Estado, mediante el bono de desarrollo humano.", "justificacion": "Incorrecta. La ley prevé primero obligados subsidiarios familiares."}, {"texto": "Los primos y sobrinos del progenitor ausente.", "justificacion": "Incorrecta. No están entre los obligados subsidiarios."}, {"texto": "Nadie: la obligación de alimentos es solo de los progenitores.", "justificacion": "Incorrecta. La ley prevé obligados subsidiarios."}], "correcta": 0, "referencias": ["CONA"]}, {"id": "NV-CIV-07", "area": 4, "dificultad": 4, "subarea": "Personas y Familia", "tema": "Preferencia materna", "resultado": "Resuelve el caso aplicando preferencia materna.", "demanda": "Evaluar", "enunciado": "En un juicio de tenencia, la madre invoca la regla legal que prefiere a la madre para confiarle a los hijos. ¿Cuál es el estado actual de esa regla?", "opciones": [{"texto": "Fue declarada inconstitucional; rige el interés superior del niño.", "justificacion": "Correcta. La Corte Constitucional declaró inconstitucional la preferencia materna automática (sentencia 28-15-IN/21); la tenencia se decide según el interés superior y la opinión del niño."}, {"texto": "Sigue vigente y obliga al juez a preferir a la madre en todos los casos.", "justificacion": "Incorrecta. La preferencia automática fue expulsada del ordenamiento."}, {"texto": "Rige solo para niños menores de doce años.", "justificacion": "Incorrecta. No subsiste una preferencia por edad."}, {"texto": "Fue reemplazada por una preferencia a favor del padre.", "justificacion": "Incorrecta. No existe preferencia por el sexo del progenitor."}], "correcta": 0, "referencias": ["CCE2815", "CONA"]}, {"id": "NV-CIV-08", "area": 4, "dificultad": 3, "subarea": "Personas y Familia", "tema": "Patria potestad y tenencia", "resultado": "Resuelve el caso aplicando patria potestad y tenencia.", "demanda": "Comprender", "enunciado": "Tras el divorcio, la tenencia de los hijos se confía a la madre. ¿Qué ocurre con la patria potestad del padre?", "opciones": [{"texto": "La conserva, salvo suspensión o pérdida declarada judicialmente.", "justificacion": "Correcta. La tenencia es el cuidado cotidiano; la patria potestad es el conjunto de derechos de los padres sobre los hijos no emancipados (art. 283 CC) y no se pierde por el divorcio."}, {"texto": "La pierde automáticamente con la sentencia de divorcio.", "justificacion": "Incorrecta. El divorcio no extingue la patria potestad."}, {"texto": "Se suspende hasta que los hijos cumplan dieciocho años.", "justificacion": "Incorrecta. No existe esa suspensión automática."}, {"texto": "Pasa al Estado mientras la madre tenga la tenencia.", "justificacion": "Incorrecta. El Estado no asume la patria potestad en este caso."}], "correcta": 0, "referencias": ["CC", "CONA"]}, {"id": "NV-CIV-09", "area": 4, "dificultad": 3, "subarea": "Personas y Familia", "tema": "Parentesco colateral", "resultado": "Resuelve el caso aplicando parentesco colateral.", "demanda": "Aplicar", "enunciado": "Martín y Sofía son primos hermanos (hijos de dos hermanos) y quieren casarse. ¿Qué parentesco tienen y qué efecto produce?", "opciones": [{"texto": "Colateral de cuarto grado; el matrimonio es válido.", "justificacion": "Correcta. Entre primos hermanos hay cuatro generaciones (art. 22 CC); solo es nulo el matrimonio entre colaterales en segundo grado (art. 95 CC)."}, {"texto": "Colateral de segundo grado; el matrimonio es nulo.", "justificacion": "Incorrecta. El segundo grado corresponde a los hermanos."}, {"texto": "Colateral de tercer grado; el matrimonio es nulo.", "justificacion": "Incorrecta. El tercer grado corresponde a tío y sobrino, y tampoco es impedimento."}, {"texto": "Afinidad de cuarto grado; el matrimonio requiere dispensa.", "justificacion": "Incorrecta. Son parientes por consanguinidad, no por afinidad."}], "correcta": 0, "referencias": ["CC"]}, {"id": "NV-CIV-10", "area": 4, "dificultad": 4, "subarea": "Personas y Familia", "tema": "Pluralidad de domicilios", "resultado": "Resuelve el caso aplicando pluralidad de domicilios.", "demanda": "Analizar", "enunciado": "Un comerciante tiene su familia y una tienda en Ambato, y otra tienda con casa propia en Latacunga, donde pasa la mitad de la semana. ¿Cuál es su domicilio civil?", "opciones": [{"texto": "Tiene domicilio en ambas ciudades.", "justificacion": "Correcta. Cuando en varias secciones territoriales concurren circunstancias constitutivas de domicilio civil, se entiende que la persona tiene domicilio en todas ellas (CC)."}, {"texto": "Solo Ambato, por vivir allí su familia.", "justificacion": "Incorrecta. En ambas ciudades concurren circunstancias constitutivas de domicilio."}, {"texto": "Solo Latacunga, por tener allí casa propia.", "justificacion": "Incorrecta. La propiedad de la casa no excluye el otro domicilio."}, {"texto": "El de su nacimiento, al no poder determinarse uno solo.", "justificacion": "Incorrecta. El lugar de nacimiento no fija el domicilio."}], "correcta": 0, "referencias": ["CC"]}, {"id": "NV-CIV-11", "area": 4, "dificultad": 4, "subarea": "Personas y Familia", "tema": "Rescisión por fuerza", "resultado": "Resuelve el caso aplicando rescisión por fuerza.", "demanda": "Analizar", "enunciado": "Bajo amenazas que duraron hasta enero de 2024, Pedro firmó en junio de 2023 una venta. ¿Desde cuándo corre el plazo de cuatro años para pedir la rescisión?", "opciones": [{"texto": "Desde enero de 2024, cuando cesó la violencia.", "justificacion": "Correcta. En caso de violencia o fuerza, el cuatrienio se cuenta desde el día en que esta cesó (art. 1708 CC)."}, {"texto": "Desde junio de 2023, fecha de la firma.", "justificacion": "Incorrecta. Ese cómputo rige para el error y el dolo."}, {"texto": "Desde que Pedro denuncia las amenazas ante la Fiscalía.", "justificacion": "Incorrecta. La denuncia no fija el inicio del plazo."}, {"texto": "Desde la inscripción de la venta en el Registro.", "justificacion": "Incorrecta. La inscripción no determina el cómputo."}], "correcta": 0, "referencias": ["CC"]}, {"id": "NV-CIV-12", "area": 4, "dificultad": 3, "subarea": "Personas y Familia", "tema": "Saneamiento de la nulidad relativa", "resultado": "Resuelve el caso aplicando saneamiento de la nulidad relativa.", "demanda": "Aplicar", "enunciado": "Un adolescente vendió un bien sin autorización. Al cumplir dieciocho años, ratifica expresamente la venta. ¿Qué efecto tiene la ratificación?", "opciones": [{"texto": "Sanea la nulidad relativa y el contrato queda firme.", "justificacion": "Correcta. La nulidad relativa puede sanearse por la ratificación de las partes o por el transcurso del tiempo (CC); lo hace quien ya es capaz."}, {"texto": "Ninguno, porque la nulidad es absoluta e insaneable.", "justificacion": "Incorrecta. La incapacidad del menor adulto produce nulidad relativa."}, {"texto": "Solo sana si la aprueba un juez de familia.", "justificacion": "Incorrecta. La ratificación del ya capaz basta."}, {"texto": "Convierte el contrato en una donación revocable.", "justificacion": "Incorrecta. No cambia la naturaleza del contrato."}], "correcta": 0, "referencias": ["CC"]}, {"id": "NV-DPG-01", "area": 3, "dificultad": 3, "subarea": "Derecho Procesal General", "tema": "Prorrogación tácita", "resultado": "Resuelve el caso aplicando prorrogación tácita.", "demanda": "Aplicar", "enunciado": "Se demanda en Quito a una persona domiciliada en Loja. El demandado contesta sobre el fondo sin alegar incompetencia. ¿Qué ocurre con la competencia territorial?", "opciones": [{"texto": "Se prorroga tácitamente a favor del juez de Quito.", "justificacion": "Correcta. La competencia territorial puede prorrogarse por sometimiento tácito de las partes (art. 162 COFJ)."}, {"texto": "El juez debe inhibirse de oficio en cualquier estado.", "justificacion": "Incorrecta. La incompetencia territorial es prorrogable."}, {"texto": "El proceso es nulo por falta de competencia material.", "justificacion": "Incorrecta. El problema es territorial, no material."}, {"texto": "La causa debe remitirse a la Corte Provincial de Loja.", "justificacion": "Incorrecta. No hay remisión en este supuesto."}], "correcta": 0, "referencias": ["COFJ"]}, {"id": "NV-DPG-02", "area": 3, "dificultad": 2, "subarea": "Derecho Procesal General", "tema": "Excusa y recusación", "resultado": "Resuelve el caso aplicando excusa y recusación.", "demanda": "Comprender", "enunciado": "Un juez advierte que es primo hermano de la parte actora y se aparta por su propia iniciativa. ¿Qué figura utiliza?", "opciones": [{"texto": "La excusa.", "justificacion": "Correcta. La excusa es el apartamiento voluntario del juzgador incurso en causal; la recusación la plantea una parte (COGEP)."}, {"texto": "La recusación.", "justificacion": "Incorrecta. La recusación la propone una de las partes."}, {"texto": "La inhibición por incompetencia.", "justificacion": "Incorrecta. Su competencia no está en duda."}, {"texto": "La prorrogación de la competencia.", "justificacion": "Incorrecta. No guarda relación con la imparcialidad."}], "correcta": 0, "referencias": ["COGEP"]}, {"id": "NV-DPG-03", "area": 3, "dificultad": 2, "subarea": "Derecho Procesal General", "tema": "Recurso de aclaración", "resultado": "Resuelve el caso aplicando recurso de aclaración.", "demanda": "Aplicar", "enunciado": "La parte resolutiva de una sentencia es oscura y admite dos lecturas sobre el monto a pagar. ¿Qué recurso horizontal corresponde?", "opciones": [{"texto": "Aclaración.", "justificacion": "Correcta. La aclaración procede cuando la sentencia es oscura (art. 253 COGEP)."}, {"texto": "Ampliación.", "justificacion": "Incorrecta. Procede cuando se omitió resolver un punto."}, {"texto": "Casación.", "justificacion": "Incorrecta. Es un recurso extraordinario vertical."}, {"texto": "De hecho.", "justificacion": "Incorrecta. Procede contra la negativa de un recurso."}], "correcta": 0, "referencias": ["COGEP"]}, {"id": "NV-DPG-04", "area": 3, "dificultad": 3, "subarea": "Derecho Procesal General", "tema": "Tercería coadyuvante", "resultado": "Resuelve el caso aplicando tercería coadyuvante.", "demanda": "Aplicar", "enunciado": "Un subarrendatario interviene en un juicio entre arrendador y arrendatario para apoyar la posición del arrendatario. ¿Qué clase de tercería es?", "opciones": [{"texto": "Coadyuvante.", "justificacion": "Correcta. El tercero coadyuvante interviene para apoyar la pretensión de una de las partes, por tener interés en el resultado (art. 47 COGEP)."}, {"texto": "Excluyente de dominio.", "justificacion": "Incorrecta. No reclama para sí el derecho discutido."}, {"texto": "Excluyente de pago.", "justificacion": "Incorrecta. No pretende ser pagado con preferencia."}, {"texto": "Litisconsorcio necesario.", "justificacion": "Incorrecta. No es parte originaria indispensable."}], "correcta": 0, "referencias": ["COGEP"]}, {"id": "NV-DPG-05", "area": 3, "dificultad": 3, "subarea": "Derecho Procesal General", "tema": "Elementos de la jurisdicción", "resultado": "Resuelve el caso aplicando elementos de la jurisdicción.", "demanda": "Comprender", "enunciado": "¿Qué elemento de la jurisdicción permite al juez hacer cumplir coactivamente lo resuelto?", "opciones": [{"texto": "La executio.", "justificacion": "Correcta. La executio es la potestad de hacer ejecutar lo juzgado, incluso con el auxilio de la fuerza pública; se distingue de la notio, la vocatio, la coertio y el iudicium."}, {"texto": "La notio.", "justificacion": "Incorrecta. Es la facultad de conocer el asunto."}, {"texto": "La vocatio.", "justificacion": "Incorrecta. Es la facultad de convocar a las partes."}, {"texto": "El iudicium.", "justificacion": "Incorrecta. Es la facultad de dictar sentencia."}], "correcta": 0, "referencias": ["COFJ"]}, {"id": "NV-DPG-06", "area": 3, "dificultad": 2, "subarea": "Derecho Procesal General", "tema": "Partes procesales", "resultado": "Resuelve el caso aplicando partes procesales.", "demanda": "Comprender", "enunciado": "Una comuna indígena quiere demandar a una empresa por la afectación de su territorio. ¿Puede ser parte procesal?", "opciones": [{"texto": "Sí: el COGEP reconoce a comunidades y colectivos como partes.", "justificacion": "Correcta. El art. 30 COGEP reconoce como partes, además de personas naturales y jurídicas, a comunidades, pueblos, nacionalidades y colectivos, y a la naturaleza."}, {"texto": "No: solo las personas naturales y jurídicas pueden ser partes.", "justificacion": "Incorrecta. El COGEP amplía el catálogo de partes."}, {"texto": "Solo si antes se constituye como compañía anónima.", "justificacion": "Incorrecta. No necesita constituirse como sociedad."}, {"texto": "Solo por medio de la Defensoría del Pueblo.", "justificacion": "Incorrecta. Puede comparecer por sus propios representantes."}], "correcta": 0, "referencias": ["COGEP"]}, {"id": "NV-DPG-07", "area": 3, "dificultad": 2, "subarea": "Derecho Procesal General", "tema": "Facultades especiales del procurador", "resultado": "Resuelve el caso aplicando facultades especiales del procurador.", "demanda": "Aplicar", "enunciado": "El procurador judicial de una empresa, sin cláusula especial, quiere desistir del proceso. ¿Puede hacerlo?", "opciones": [{"texto": "No: desistir requiere una cláusula especial en la procuración.", "justificacion": "Correcta. Desistir, allanarse, transigir y recibir valores, entre otros actos, requieren cláusula especial (art. 43 COGEP)."}, {"texto": "Sí: la procuración general habilita cualquier acto procesal.", "justificacion": "Incorrecta. Ciertos actos exigen facultad expresa."}, {"texto": "Sí, si el juez lo autoriza en la audiencia preliminar.", "justificacion": "Incorrecta. La autorización judicial no suple el mandato."}, {"texto": "Sí, si la contraparte acepta el desistimiento.", "justificacion": "Incorrecta. La aceptación contraria no suple la facultad."}], "correcta": 0, "referencias": ["COGEP"]}, {"id": "NV-DPG-08", "area": 3, "dificultad": 3, "subarea": "Derecho Procesal General", "tema": "Cosa juzgada como excepción", "resultado": "Resuelve el caso aplicando cosa juzgada como excepción.", "demanda": "Aplicar", "enunciado": "El actor demanda nuevamente a la misma persona, por el mismo objeto y la misma causa, que ya fueron resueltos en una sentencia ejecutoriada. ¿Qué excepción previa corresponde?", "opciones": [{"texto": "Cosa juzgada.", "justificacion": "Correcta. La cosa juzgada es excepción previa del art. 153 COGEP y deriva del efecto irrevocable de la sentencia ejecutoriada (arts. 99 y 101 COGEP)."}, {"texto": "Litispendencia.", "justificacion": "Incorrecta. Supone un proceso todavía pendiente."}, {"texto": "Caducidad.", "justificacion": "Incorrecta. Se refiere a la extinción por el paso del tiempo."}, {"texto": "Falta de capacidad.", "justificacion": "Incorrecta. Nada indica un problema de capacidad."}], "correcta": 0, "referencias": ["COGEP"]}]}, {"id": "pack-006", "bibliografia": {"BUST": "Convención de Derecho Internacional Privado [Código de Bustamante]. (1928). La Habana. https://www.oas.org/juridico/spanish/tratados/a-31.html", "CADH": "Organización de los Estados Americanos. (1969). Convención Americana sobre Derechos Humanos. https://www.oas.org/dil/esp/tratados_b-32_convencion_americana_sobre_derechos_humanos.htm", "CC": "Congreso Nacional del Ecuador. (2005). Código Civil (Codificación 2005-010). Registro Oficial Suplemento 46, 24 de junio de 2005. Texto vigente con sus reformas, entre ellas la Ley Reformatoria de 2015 (R.O. 526-2S, 19 de junio de 2015); última actualización: Segundo Suplemento del R.O. 61, 17 de junio de 2025. https://www.gob.ec/regulaciones/codigo-civil-codificacion-no-2005-010", "CCOM": "Asamblea Nacional del Ecuador. (2019). Código de Comercio. Registro Oficial Suplemento 497, 29 de mayo de 2019. Última reforma: Tercer Suplemento del R.O. 245, 7 de febrero de 2023. https://www.supercias.gob.ec/bd_supercias/descargas/lotaip/a2/2019/JUNIO/C%C3%B3digo_de_Comercio.pdf", "COA": "Asamblea Nacional del Ecuador. (2017). Código Orgánico Administrativo. Registro Oficial Segundo Suplemento 31, 7 de julio de 2017. Última reforma: 13 de octubre de 2025. https://lotaip.bomberosquito.gob.ec/transparencia/2026/archivos/coa26.pdf", "COFJ": "Asamblea Nacional del Ecuador. (2009). Código Orgánico de la Función Judicial. Registro Oficial Suplemento 544, 9 de marzo de 2009. Reformado, entre otras, por la Ley Orgánica Reformatoria de Varios Cuerpos Legales para la Agilización de la Adopción (R.O. 347, 14 de agosto de 2026). https://www.funcionjudicial.gob.ec/", "COGEP": "Asamblea Nacional del Ecuador. (2015). Código Orgánico General de Procesos. Registro Oficial Suplemento 506, 22 de mayo de 2015. Reformado, entre otras, por la Ley Orgánica Reformatoria del COGEP (R.O. Suplemento 517, 26 de junio de 2019); última reforma consultada: Cuarto Suplemento del R.O. 140, 7 de octubre de 2025. https://portal.compraspublicas.gob.ec/sercop/wp-content/uploads/2025/11/CODIGO-ORGANICO-GENERAL-DE-PROCESOS-COGEP.pdf", "COIP": "Asamblea Nacional del Ecuador. (2014). Código Orgánico Integral Penal. Registro Oficial Suplemento 180, 10 de febrero de 2014. Texto actualizado al 13 de octubre de 2025 (última reforma incorporada: Tercer Suplemento del R.O. 68, 26 de junio de 2025). https://legalcloud.ec/wp-content/uploads/2025/10/COIP-13102025-Digital.pdf", "CONA": "Congreso Nacional del Ecuador. (2003). Código de la Niñez y Adolescencia (Ley 100). Registro Oficial 737, 3 de enero de 2003. Última reforma: Ley Orgánica Reformatoria de Varios Cuerpos Legales para la Agilización de la Adopción, R.O. 347, 14 de agosto de 2026. https://www.registroficial.gob.ec/", "CRE": "Asamblea Constituyente del Ecuador. (2008). Constitución de la República del Ecuador. Registro Oficial 449, 20 de octubre de 2008 (con las enmiendas posteriores, incluidas las aprobadas en el referéndum de 2024). https://www.asambleanacional.gob.ec/", "CT": "Congreso Nacional del Ecuador. (2005). Código del Trabajo (Codificación 2005-017). Registro Oficial Suplemento 167, 16 de diciembre de 2005. Texto vigente con sus reformas; última reforma: 9 de abril de 2026. https://portal.compraspublicas.gob.ec/sercop/wp-content/uploads/2026/08/CODIGO-DEL-TRABAJO.pdf", "CTRIB": "Congreso Nacional del Ecuador. (2005). Código Orgánico Tributario (antes Código Tributario, Codificación 2005-09). Registro Oficial Suplemento 38, 14 de junio de 2005; reformado y renombrado por la Ley Orgánica Reformatoria al Código Tributario, Noveno Suplemento del R.O. 392, 19 de octubre de 2026. https://www.gob.ec/regulaciones/codigo-organico-tributario", "LAM": "Congreso Nacional del Ecuador. (2006). Ley de Arbitraje y Mediación (Codificación 2006-014). Registro Oficial 417, 14 de diciembre de 2006, con sus reformas. https://oas.org/es/sla/ddi/docs/Ecuador%20-%20Ley%20de%20Arbitraje%20y%20Mediaci%C3%B3n.pdf", "LC": "Congreso Nacional del Ecuador. (1999). Ley de Compañías (Codificación 1999-031). Registro Oficial 312, 5 de noviembre de 1999. Reformada por la Ley Reformatoria a la Ley de Compañías para la Optimización e Impulso Empresarial y para el Fomento del Gobierno Corporativo (R.O. Suplemento 269, 15 de marzo de 2023); última reforma: 3 de octubre de 2025. https://www.eeasa.com.ec/content/uploads/2025/12/LEY-DE-COMPANIAS.pdf", "LOGJCC": "Asamblea Nacional del Ecuador. (2009). Ley Orgánica de Garantías Jurisdiccionales y Control Constitucional. Registro Oficial Segundo Suplemento 52, 22 de octubre de 2009. Última reforma: R.O. Suplemento 245, 7 de febrero de 2023. https://lotaip.bomberosquito.gob.ec/transparencia/2026/archivos/logjcc26.pdf", "LORTI": "Congreso Nacional del Ecuador. (2004). Ley de Régimen Tributario Interno (Codificación 2004-026). Registro Oficial Suplemento 463, 17 de noviembre de 2004, con sus reformas. https://www.sri.gob.ec/", "LOSNCP": "Asamblea Nacional del Ecuador. (2008). Ley Orgánica del Sistema Nacional de Contratación Pública. Registro Oficial Suplemento 395, 4 de agosto de 2008. Reformada integralmente; última reforma: Cuarto Suplemento del R.O. 140, 7 de octubre de 2025. https://usgn.espe.edu.ec/wp-content/uploads/2026/01/1.-Ley-Organica-del-Sistema-Nacional-de-Contratacion-Publica.pdf", "LCH": "Ecuador. (s. f.). Ley de Cheques. Texto vigente con sus reformas; no fue derogada por el Código de Comercio de 2019 (cuyas disposiciones derogatorias no la incluyen). https://www.supercias.gob.ec/bd_supercias/descargas/lotaip/a2/2019/JUNIO/C%C3%B3digo_de_Comercio.pdf"}, "preguntas": [{"id": "EX-001", "area": 4, "subarea": "Sucesiones", "tema": "Desheredamiento", "resultado": "Aplica las causales de desheredamiento previstas en el Código Civil.", "demanda": "Aplicar", "enunciado": "Juan, padre de tres hijos, otorga testamento en el que declara desheredado a su hijo mayor por haberle inferido injurias graves y reiteradas que constan en sentencia firme de juicio de injurias. El hijo desheredado demanda la nulidad de la cláusula. ¿Cuál es la decisión correcta conforme al Código Civil ecuatoriano?", "opciones": [{"texto": "Es válida: la injuria grave contra el testador es causal de desheredamiento.", "justificacion": "Correcta. El art. 1231 num. 1 del Código Civil permite desheredar al descendiente que cometió injuria grave contra el testador en su persona, honra o bienes; la causa debe expresarse en el testamento y probarse (art. 1232 del Código Civil). Base legal: arts. 1230 a 1232 del Código Civil."}, {"texto": "Es nula: las injurias solo bastan si van acompañadas de tentativa de homicidio.", "justificacion": "Incorrecta. La injuria grave es causal autónoma (art. 1231 num. 1 del Código Civil); no exige tentativa de homicidio."}, {"texto": "Es nula: el desheredamiento requiere autorización judicial previa al testamento.", "justificacion": "Incorrecta. El desheredamiento es una disposición testamentaria (art. 1230 del Código Civil); no requiere autorización judicial previa."}, {"texto": "Es válida solo si la cuota del desheredado se reparte entre los demás hijos.", "justificacion": "Incorrecta. La validez no depende del destino de la cuota; eso es una consecuencia distinta del desheredamiento."}], "correcta": 0, "referencias": ["CC"]}, {"id": "EX-002", "area": 1, "subarea": "Derechos Humanos", "tema": "Garantías jurisdiccionales", "resultado": "Identifica el alcance de la acción de protección frente a actos de la administración pública.", "demanda": "Analizar", "enunciado": "Un ciudadano interpone acción de protección contra una resolución administrativa que le niega un permiso de construcción alegando vulneración del derecho a la propiedad y al debido proceso. El juez de primera instancia declara improcedente la acción por considerar que existe vía ordinaria. ¿Cuál es el criterio correcto según la Constitución y la jurisprudencia constitucional?", "opciones": [{"texto": "Procede si hay vulneración directa de derechos y no existe otra vía eficaz.", "justificacion": "Correcta. La acción de protección procede contra actos de autoridad pública no judicial que vulneren derechos (art. 88 de la Constitución) cuando no exista otro mecanismo de defensa judicial adecuado y eficaz (art. 40 num. 3 de la Ley Orgánica de Garantías Jurisdiccionales y Control Constitucional)."}, {"texto": "Es improcedente: siempre debe agotarse antes la vía contencioso-administrativa.", "justificacion": "Incorrecta. La acción de protección es de carácter residual pero no exige agotamiento previo cuando existe vulneración de derechos constitucionales."}, {"texto": "Solo procede contra actos de particulares, nunca contra actos de la administración.", "justificacion": "Incorrecta. El artículo 88 de la Constitución permite la acción de protección también contra actos de autoridad pública."}, {"texto": "Es improcedente porque la propiedad no es un derecho tutelable por garantías.", "justificacion": "Incorrecta. El derecho de propiedad está reconocido en el artículo 66 numeral 26 de la Constitución y es susceptible de tutela."}], "correcta": 0, "referencias": ["CRE", "LOGJCC"]}, {"id": "EX-003", "area": 2, "subarea": "Derecho Penal (parte general)", "tema": "Peculado", "resultado": "Aplica los elementos del tipo penal de peculado.", "demanda": "Aplicar", "enunciado": "Un servidor público de una empresa pública utiliza un vehículo oficial de manera reiterada para fines personales y, además, dispone de combustible institucional para su consumo particular. ¿Cuál es la tipificación correcta conforme al Código Orgánico Integral Penal?", "opciones": [{"texto": "Peculado, por disponer arbitrariamente de bienes públicos a su cargo.", "justificacion": "Correcta. El artículo 278 sanciona la apropiación, distracción o disposición arbitraria de bienes públicos por parte de servidores o proveedores del Estado."}, {"texto": "Abuso de confianza, porque el vehículo no es de propiedad del servidor.", "justificacion": "Incorrecta. El tipo aplicable es el peculado cuando el bien está en poder del servidor por razón de su cargo."}, {"texto": "Solo una falta administrativa disciplinaria, que no constituye delito.", "justificacion": "Incorrecta. La conducta supera el ámbito disciplinario e integra el tipo penal de peculado."}, {"texto": "Enriquecimiento ilícito, por un incremento patrimonial no justificado.", "justificacion": "Incorrecta. El enriquecimiento ilícito requiere un incremento patrimonial desproporcionado; aquí el núcleo es la disposición arbitraria del bien público."}], "correcta": 0, "referencias": ["COIP"]}, {"id": "EX-004", "area": 3, "subarea": "Métodos Alternativos", "tema": "Mediación", "resultado": "Determina los efectos del acta de mediación.", "demanda": "Comprender", "enunciado": "Las partes suscriben un acta de mediación en un centro autorizado por el Consejo de la Judicatura en la que reconocen una obligación de pago y fijan un plazo. El deudor incumple. ¿Cuál es el valor jurídico del acta?", "opciones": [{"texto": "Tiene efecto de sentencia ejecutoriada y se ejecuta por vía de apremio.", "justificacion": "Correcta. El acta de mediación con acuerdo tiene efecto de sentencia ejecutoriada y cosa juzgada, y se ejecuta del mismo modo que las sentencias de última instancia (art. 47 de la Ley de Arbitraje y Mediación); el COGEP la considera título de ejecución (art. 363)."}, {"texto": "Vale como contrato privado y exige un juicio ordinario para ejecutarse.", "justificacion": "Incorrecta. La ley le confiere fuerza de sentencia ejecutoriada."}, {"texto": "Solo tiene valor probatorio y no puede ejecutarse de forma directa.", "justificacion": "Incorrecta. La norma le otorga eficacia ejecutiva plena."}, {"texto": "Es nula, porque la mediación no admite obligaciones de dar dinero.", "justificacion": "Incorrecta. La mediación es procedente en materia de obligaciones patrimoniales disponibles."}], "correcta": 0, "referencias": ["LAM"]}, {"id": "EX-011", "area": 1, "subarea": "Derecho Constitucional", "tema": "Supremacía constitucional", "resultado": "Aplica el principio de supremacía de la Constitución.", "demanda": "Aplicar", "enunciado": "Una ley ordinaria contradice un derecho constitucional. El juez debe decidir. ¿Cuál es la decisión correcta?", "opciones": [{"texto": "Aplica la Constitución y, ante duda razonable, consulta a la Corte.", "justificacion": "Correcta. La Constitución prevalece sobre cualquier otra norma (art. 424 de la Constitución) y es de aplicación directa (art. 426); si el juez considera que una norma es contraria a ella, suspende la causa y la consulta a la Corte Constitucional (art. 428 de la Constitución). Base legal: arts. 424, 426 y 428 de la Constitución."}, {"texto": "Aplica la ley ordinaria, por ser posterior y especial frente a la Constitución.", "justificacion": "Incorrecta. El criterio cronológico no opera contra la Constitución (art. 424)."}, {"texto": "Aplica ambas normas de manera concurrente, armonizando su contenido literal.", "justificacion": "Incorrecta. Una contradicción no se resuelve aplicando ambas normas."}, {"texto": "Archiva el proceso hasta que la Asamblea Nacional reforme la ley.", "justificacion": "Incorrecta. El juez no puede abstenerse de resolver ni esperar una reforma legal."}], "correcta": 0, "referencias": ["CRE"]}, {"id": "EX-013", "area": 1, "subarea": "Derecho Constitucional", "tema": "Acción de protección", "resultado": "Determina la procedencia de la acción de protección frente a actos de autoridad.", "demanda": "Analizar", "enunciado": "Una servidora pública es destituida mediante acto administrativo sin ser escuchada ni poder presentar pruebas. Interpone acción de protección alegando vulneración al debido proceso. ¿Procede la acción?", "opciones": [{"texto": "Sí procede, porque la acción protege derechos constitucionales vulnerados por actos de autoridad pública.", "justificacion": "Correcta. La acción de protección procede contra actos u omisiones de autoridad que vulneren derechos constitucionales. Base legal: art. 88 de la Constitución de la República; art. 39-41 de la Ley Orgánica de Garantías Jurisdiccionales y Control Constitucional."}, {"texto": "No procede, porque la destitución es un asunto de mera legalidad que debe impugnarse solo en vía administrativa.", "justificacion": "Incorrecta. Aunque haya vía administrativa, si hay vulneración de un derecho constitucional procede la garantía."}, {"texto": "No procede, porque la acción de protección solo protege derechos de personas en situación de vulnerabilidad.", "justificacion": "Incorrecta. La acción protege a cualquier persona, no solo a grupos de atención prioritaria."}, {"texto": "Sí procede, porque toda destitución es inconstitucional y debe dejarse sin efecto de forma automática.", "justificacion": "Incorrecta. No toda destitución es inconstitucional; debe verificarse la vulneración concreta del derecho."}], "correcta": 0, "referencias": ["CRE", "LOGJCC"]}, {"id": "EX-014", "area": 1, "subarea": "Derecho Constitucional", "tema": "Hábeas corpus", "resultado": "Identifica el objeto y procedencia del hábeas corpus.", "demanda": "Comprender", "enunciado": "Una persona es detenida por más de 24 horas sin orden judicial ni delito flagrante y sin ser puesta a órdenes del juez. Su familia quiere interponer una garantía. ¿Cuál es la adecuada?", "opciones": [{"texto": "Hábeas corpus, para recuperar la libertad frente a una detención ilegal.", "justificacion": "Correcta. El hábeas corpus procede para recuperar la libertad ante detención ilegal o arbitraria. Base legal: art. 89 de la Constitución de la República."}, {"texto": "Hábeas data, para conocer los datos que constan en el registro policial.", "justificacion": "Incorrecta. El hábeas data protege datos personales, no la libertad ambulatoria."}, {"texto": "Acción de protección, que es la única vía para reparar detenciones ilegales.", "justificacion": "Incorrecta. Para la privación ilegal de libertad existe una garantía específica y más idónea."}, {"texto": "Acción por incumplimiento, para obligar a la policía a cumplir una sentencia.", "justificacion": "Incorrecta. La acción de incumplimiento exige una sentencia u obligación incumplida, no es el caso."}], "correcta": 0, "referencias": ["CRE"]}, {"id": "EX-015", "area": 1, "subarea": "Derecho Constitucional", "tema": "Hábeas data", "resultado": "Distingue el hábeas data de otras garantías jurisdiccionales.", "demanda": "Comprender", "enunciado": "Un ciudadano constata que una entidad financiera mantiene un reporte de deuda ya pagada y se niega a rectificarlo, lo que le impide acceder a crédito. ¿Qué garantía le permite exigir la rectificación?", "opciones": [{"texto": "Hábeas data, que permite actualizar o rectificar datos personales.", "justificacion": "Correcta. El hábeas data tutela el acceso y la rectificación de datos personales en archivos públicos o privados. Base legal: art. 92 de la Constitución de la República."}, {"texto": "Acción de protección, única vía para rectificar datos en cualquier registro.", "justificacion": "Incorrecta. Aunque protege derechos, existe una garantía específica para datos personales."}, {"texto": "Hábeas corpus, que protege la libertad económica frente a reportes de crédito.", "justificacion": "Incorrecta. El hábeas corpus protege la libertad física, no la rectificación de datos."}, {"texto": "Acción extraordinaria de protección contra la decisión de la entidad financiera.", "justificacion": "Incorrecta. Esta acción procede contra sentencias o autos definitivos, no contra un registro financiero."}], "correcta": 0, "referencias": ["CRE"]}, {"id": "EX-016", "area": 1, "subarea": "Derecho Constitucional", "tema": "Acción extraordinaria de protección", "resultado": "Determina los requisitos de la acción extraordinaria de protección.", "demanda": "Analizar", "enunciado": "Tras agotar los recursos ordinarios, una parte alega que la sentencia definitiva vulneró su derecho a la defensa porque nunca fue notificada. ¿Qué debe demostrar para que proceda la acción extraordinaria de protección?", "opciones": [{"texto": "Que en la decisión definitiva se vulneró un derecho constitucional.", "justificacion": "Correcta. Requiere sentencia o auto definitivo y vulneración de un derecho constitucional imputable al juzgador. Base legal: art. 94 de la Constitución de la República; art. 58 de la Ley Orgánica de Garantías Jurisdiccionales y Control Constitucional."}, {"texto": "Que la sentencia es injusta en el fondo y que el juez valoró mal la prueba.", "justificacion": "Incorrecta. La acción no es una instancia para revisar el acierto del fallo sobre el fondo."}, {"texto": "Que existe una prueba nueva que no pudo presentar en el proceso ordinario.", "justificacion": "Incorrecta. La existencia de prueba nueva no es por sí sola causal de esta garantía constitucional."}, {"texto": "Que el proceso duró más de un año y que no está conforme con el resultado.", "justificacion": "Incorrecta. La duración o la inconformidad no configuran por sí solas vulneración de derechos constitucionales."}], "correcta": 0, "referencias": ["CRE", "LOGJCC"]}, {"id": "EX-017", "area": 1, "subarea": "Derecho Constitucional", "tema": "Debido proceso", "resultado": "Aplica las garantías del debido proceso en procedimientos sancionadores.", "demanda": "Aplicar", "enunciado": "En un procedimiento disciplinario, la autoridad sanciona a un funcionario con base en un informe que nunca le fue puesto en conocimiento ni pudo contradecir. ¿Qué garantía se vulnera?", "opciones": [{"texto": "El derecho a la defensa, porque no se le permitió conocer ni contradecir la prueba en su contra.", "justificacion": "Correcta. El derecho a la defensa incluye conocer los cargos y contradecir pruebas en todo procedimiento. Base legal: art. 76 de la Constitución de la República."}, {"texto": "La seguridad jurídica, porque la sanción no fue publicada en el Registro Oficial antes de aplicarse.", "justificacion": "Incorrecta. La publicación no es el problema; el problema es la imposibilidad de contradecir la prueba."}, {"texto": "El derecho a la propiedad, porque la sanción implica una multa que afecta su patrimonio personal.", "justificacion": "Incorrecta. La afectación patrimonial es consecuencia, no la garantía procesal vulnerada."}, {"texto": "La libertad de expresión, porque el funcionario no pudo opinar públicamente sobre la sanción impuesta.", "justificacion": "Incorrecta. La libertad de expresión no es la garantía central vulnerada en este supuesto."}], "correcta": 0, "referencias": ["CRE"]}, {"id": "EX-018", "area": 1, "subarea": "Derecho Constitucional", "tema": "Derechos de la naturaleza", "resultado": "Aplica los derechos de la naturaleza en un caso concreto.", "demanda": "Aplicar", "enunciado": "Una empresa inicia obras que desvían el cauce de un río, afectando su ciclo vital y la biodiversidad, sin autorización ambiental. Una comunidad interpone acción de protección a favor del río. ¿Qué fundamento es correcto?", "opciones": [{"texto": "Procede, porque la naturaleza tiene derecho a que se respete su existencia y regeneración de ciclos.", "justificacion": "Correcta. La Constitución reconoce a la naturaleza el derecho a la existencia y al mantenimiento de sus ciclos vitales. Base legal: art. 71-72 de la Constitución de la República."}, {"texto": "No procede, porque la naturaleza no es sujeto de derechos y solo las personas pueden demandar.", "justificacion": "Incorrecta. En Ecuador la naturaleza es sujeto de derechos constitucionales y puede ser representada."}, {"texto": "Procede, porque toda obra sin autorización es penalmente sancionable y debe suspenderse de inmediato.", "justificacion": "Incorrecta. La falta de autorización no convierte automáticamente el hecho en delito penal."}, {"texto": "No procede, porque solo el Estado puede autorizar obras y la comunidad carece de legitimación activa.", "justificacion": "Incorrecta. Cualquier persona puede ejercer acciones en favor de la naturaleza, con legitimación amplia."}], "correcta": 0, "referencias": ["CRE"]}, {"id": "EX-019", "area": 1, "subarea": "Derecho Constitucional", "tema": "Consulta previa", "resultado": "Identifica el alcance de la consulta previa, libre e informada.", "demanda": "Comprender", "enunciado": "El Estado proyecta explotar recursos no renovables en territorio de una comunidad indígena, sin haber realizado consulta previa. La comunidad alega vulneración. ¿Qué implica la consulta previa?", "opciones": [{"texto": "Que el Estado debe garantizar un proceso de consulta previa, libre e informada antes de adoptar la medida.", "justificacion": "Correcta. La consulta previa exige informar y escuchar a la comunidad antes de adoptar medidas que la afecten. Base legal: art. 57.7 de la Constitución de la República."}, {"texto": "Que la comunidad puede vetar cualquier proyecto, y sin su consentimiento el Estado no puede actuar.", "justificacion": "Incorrecta. La consulta no es veto general; el consentimiento es exigible en casos calificados por la Constitución y la jurisprudencia."}, {"texto": "Que el Estado debe consultar de forma previa, libre e informada, pero puede decidir sin consultar si hay urgencia.", "justificacion": "Incorrecta. La urgencia no exime al Estado de realizar la consulta previa, libre e informada."}, {"texto": "Que basta con informar a la comunidad después de iniciado el proyecto, si se le ofrecen compensaciones.", "justificacion": "Incorrecta. Informar después no es consulta previa; debe ser antes de la decisión y de la ejecución."}], "correcta": 0, "referencias": ["CRE"]}, {"id": "EX-020", "area": 1, "subarea": "Derechos Humanos", "tema": "Sistema Interamericano", "resultado": "Distingue las funciones de la Comisión y la Corte Interamericana.", "demanda": "Comprender", "enunciado": "Tras agotar los recursos internos, una víctima de violación de derechos humanos quiere acudir al Sistema Interamericano. ¿Cuál es el órgano que puede dictar sentencia vinculante contra el Estado?", "opciones": [{"texto": "La Corte Interamericana, porque es el órgano jurisdiccional que dicta sentencias obligatorias.", "justificacion": "Correcta. La Corte IDH es el tribunal que emite sentencias vinculantes para los Estados que aceptaron su competencia. Base legal: art. 33 y 62 de la Convención Americana sobre Derechos Humanos."}, {"texto": "La Comisión Interamericana, porque es la que emite sentencias obligatorias para los Estados parte.", "justificacion": "Incorrecta. La Comisión emite informes y recomendaciones, no sentencias vinculantes."}, {"texto": "La Corte Constitucional ecuatoriana, porque sus fallos obligan a todos los Estados americanos.", "justificacion": "Incorrecta. Sus fallos obligan en Ecuador, no a otros Estados del Sistema Interamericano."}, {"texto": "La Asamblea General de la OEA, porque resuelve todos los casos de derechos humanos en la región.", "justificacion": "Incorrecta. La Asamblea General es órgano político, no jurisdiccional para casos individuales."}], "correcta": 0, "referencias": ["CADH"]}, {"id": "EX-021", "area": 1, "subarea": "Derechos Humanos", "tema": "Principio pro persona", "resultado": "Aplica el principio pro persona en caso de conflicto normativo.", "demanda": "Aplicar", "enunciado": "En un caso, una norma interna restringe un derecho y un tratado internacional de derechos humanos lo protege de forma más amplia. El juez debe decidir. ¿Qué principio debe aplicar?", "opciones": [{"texto": "Principio pro persona, por lo que debe aplicar la norma que más favorezca a la persona.", "justificacion": "Correcta. El principio pro persona obliga a preferir la interpretación y norma más favorable a la persona. Base legal: art. 11.5 de la Constitución de la República."}, {"texto": "Principio de legalidad, por lo que debe aplicar siempre la norma interna por ser posterior.", "justificacion": "Incorrecta. La posterioridad no resuelve el conflicto cuando está en juego la mayor protección del derecho."}, {"texto": "Principio de supremacía legal, por lo que debe aplicar la norma de mayor jerarquía formal sin excepción.", "justificacion": "Incorrecta. La jerarquía formal no basta; la Constitución ordena la interpretación más favorable."}, {"texto": "Principio de especialidad, por lo que debe aplicar la norma especial aunque restrinja el derecho.", "justificacion": "Incorrecta. La especialidad cede ante la interpretación más favorable a la persona en derechos humanos."}], "correcta": 0, "referencias": ["CRE"]}, {"id": "EX-022", "area": 1, "subarea": "Derechos Humanos", "tema": "Medidas cautelares constitucionales", "resultado": "Determina la procedencia de medidas cautelares constitucionales.", "demanda": "Analizar", "enunciado": "Una autoridad anuncia que en 48 horas demolerá viviendas sin orden judicial ni proceso, lo que dejaría sin hogar a varias familias. Se solicita medida cautelar constitucional. ¿Procede?", "opciones": [{"texto": "Sí, porque existe una amenaza grave e inminente a derechos.", "justificacion": "Correcta. La medida cautelar procede ante amenaza grave e inminente de vulneración de derechos. Base legal: art. 87 de la Constitución de la República; art. 26 de la Ley Orgánica de Garantías Jurisdiccionales y Control Constitucional."}, {"texto": "No, porque las medidas cautelares solo proceden cuando el derecho ya se vulneró.", "justificacion": "Incorrecta. Las medidas cautelares buscan prevenir o cesar la amenaza, no solo reparar lo consumado."}, {"texto": "Sí, porque toda demolición anunciada por una autoridad es inconstitucional.", "justificacion": "Incorrecta. No toda demolición es inconstitucional; procede por la amenaza grave e inminente en este caso."}, {"texto": "No, porque la demolición es un acto que solo se impugna en vía contenciosa.", "justificacion": "Incorrecta. La existencia de vía ordinaria no impide la medida cautelar si hay amenaza grave e inminente."}], "correcta": 0, "referencias": ["CRE", "LOGJCC"]}, {"id": "EX-023", "area": 1, "subarea": "Derecho Constitucional", "tema": "Acción de inconstitucionalidad", "resultado": "Identifica quién puede interponer acción de inconstitucionalidad y su efecto.", "demanda": "Comprender", "enunciado": "Un grupo de ciudadanos considera que una ordenanza municipal contradice la Constitución. Quieren que se declare su inconstitucionalidad con efectos generales. ¿Qué acción corresponde?", "opciones": [{"texto": "Acción pública de inconstitucionalidad ante la Corte Constitucional.", "justificacion": "Correcta. La acción de inconstitucionalidad permite el control abstracto y la expulsión de la norma inconstitucional. Base legal: art. 436.2 de la Constitución de la República."}, {"texto": "Acción de protección, que permite declarar la inconstitucionalidad general.", "justificacion": "Incorrecta. La acción de protección repara el caso concreto, no declara inconstitucionalidad con efecto general."}, {"texto": "Hábeas corpus, para suspender la aplicación de la ordenanza municipal.", "justificacion": "Incorrecta. El hábeas corpus protege la libertad personal, no la constitucionalidad de ordenanzas."}, {"texto": "Acción por incumplimiento, para que el municipio cumpla la Constitución.", "justificacion": "Incorrecta. La acción de cumplimiento exige el cumplimiento de una norma clara, no la expulsión de una inconstitucional."}], "correcta": 0, "referencias": ["CRE"]}, {"id": "EX-024", "area": 1, "subarea": "Derecho Administrativo", "tema": "Acto administrativo", "resultado": "Identifica los elementos esenciales del acto administrativo.", "demanda": "Comprender", "enunciado": "Una resolución de una entidad pública impone una sanción, pero no indica la norma que la fundamenta ni los hechos que la motivan. ¿Qué requisito se incumple?", "opciones": [{"texto": "La motivación, porque el acto debe expresar los hechos y las normas que justifican la decisión.", "justificacion": "Correcta. La motivación exige enunciar hechos y fundamentos jurídicos que sustentan el acto administrativo. Base legal: art. 100-101 del Código Orgánico Administrativo."}, {"texto": "La eficacia, porque la resolución no fue publicada en el Registro Oficial para que surta efectos.", "justificacion": "Incorrecta. La eficacia se refiere a la producción de efectos, no a la fundamentación del acto."}, {"texto": "La competencia territorial, porque la entidad actuó fuera de su jurisdicción geográfica establecida.", "justificacion": "Incorrecta. No hay datos de que la entidad haya actuado fuera de su territorio."}, {"texto": "La notificación, porque la resolución no fue entregada al administrado en su domicilio señalado.", "justificacion": "Incorrecta. La notificación es posterior; el vicio aquí es la falta de motivación del acto."}], "correcta": 0, "referencias": ["COA"]}, {"id": "EX-025", "area": 1, "subarea": "Derecho Administrativo", "tema": "Nulidad del acto administrativo", "resultado": "Distingue nulidad y anulabilidad del acto administrativo.", "demanda": "Analizar", "enunciado": "Un acto administrativo fue dictado por una autoridad manifiestamente incompetente y vulnera derechos constitucionales. ¿Qué consecuencia corresponde?", "opciones": [{"texto": "Es nulo, porque fue dictado por autoridad incompetente y con violación de derechos constitucionales.", "justificacion": "Correcta. La incompetencia manifiesta y la violación de derechos constitucionales producen nulidad del acto. Base legal: art. 105 del Código Orgánico Administrativo."}, {"texto": "Es anulable, porque todo vicio de competencia se subsana con la convalidación posterior de la autoridad.", "justificacion": "Incorrecta. La incompetencia manifiesta y la vulneración de derechos generan nulidad, no mera anulabilidad."}, {"texto": "Es eficaz, porque los actos administrativos se presumen válidos aunque tengan vicios graves.", "justificacion": "Incorrecta. La presunción de validez no sana vicios que producen nulidad de pleno derecho."}, {"texto": "Es inexistente, porque la incompetencia impide que el acto produzca cualquier efecto desde su emisión.", "justificacion": "Incorrecta. La categoría de inexistencia no es la prevista en el COA para este supuesto; corresponde la nulidad."}], "correcta": 0, "referencias": ["COA"]}, {"id": "EX-026", "area": 1, "subarea": "Derecho Administrativo", "tema": "Procedimiento administrativo", "resultado": "Aplica el silencio administrativo en el COA.", "demanda": "Aplicar", "enunciado": "Un ciudadano presenta un reclamo ante una entidad pública y transcurre el plazo legal sin respuesta. El COA prevé silencio administrativo positivo para ese trámite. ¿Qué efecto se produce?", "opciones": [{"texto": "Se entiende aceptada la petición, porque el silencio positivo opera como estimación de lo solicitado.", "justificacion": "Correcta. El silencio positivo implica que la petición se entiende aceptada por falta de respuesta oportuna. Base legal: art. 207 del Código Orgánico Administrativo."}, {"texto": "Se entiende negada la p
